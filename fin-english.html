<script>
(function(){
'use strict';
(function(){
  var k='lasthash:'+(location.pathname.split('/').pop()||'index.html');
  try{
    if(!location.hash){var h=localStorage.getItem(k);if(h&&h.length>1)history.replaceState(null,'',location.pathname+location.search+h)}
    var sv=function(){try{if(location.hash.length>1&&!/^#home$/.test(location.hash))localStorage.setItem(k,location.hash);else localStorage.removeItem(k)}catch(e){}};
    window.addEventListener('hashchange',sv);sv();
  }catch(e){}
})();
var root=document.documentElement;
function $(s,e){return (e||document).querySelector(s)}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var view=$('#view');
var D=JSON.parse($('#edata').textContent),LS=D.lessons,UN=D.units,BYID={};
LS.forEach(function(l,i){l.i=i;BYID[l.id]=l});
var PROF='artem';

/* оформление (общее с разделом «Финансы») */
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme')}
var SKINS=[['auto','Как в системе','#F4F1E8','#1F6B57',''],['ocean','Океан','#E9F0F6','#1A5FA8','light'],
  ['dark','Ночь','#171611','#5FC2A3','dark'],['graphite','Графит','#15171B','#7BA7F5','dark'],['news','Газета','#161512','#E0483B','dark']];
function applySkin(id){
  var sk=SKINS.filter(function(x){return x[0]===id})[0];if(!sk){id='auto';sk=SKINS[0]}
  if(id==='auto'){root.removeAttribute('data-skin');applyTheme('')}
  else if(id==='light'||id==='dark'){root.removeAttribute('data-skin');applyTheme(id)}
  else{root.setAttribute('data-skin',id);applyTheme(sk[4])}
  try{var bg=getComputedStyle(root).getPropertyValue('--bg').trim();$$('meta[name=theme-color]').forEach(function(m){if(bg)m.setAttribute('content',bg)})}catch(e){}
}
function skinGet(){var v=store('fin:skin');if(v)return v;var t=store('theme');return t==='dark'||t==='light'?t:'auto'}
applySkin(skinGet(),true);
function skinMenu(open){
  var m=document.getElementById('thm');
  if(!open){if(m)m.remove();return}
  if(m){m.remove();return}
  var cur=skinGet();m=document.createElement('div');m.id='thm';m.className='thm';m.setAttribute('role','menu');
  m.innerHTML='<p>Оформление</p>'+SKINS.map(function(x,i){return (i===1||i===3?'<div class="sep"></div>':'')+'<button type="button" role="menuitemradio" aria-checked="'+(x[0]===cur)+'" class="'+(x[0]===cur?'on':'')+'" data-skin="'+x[0]+'"><span class="skw" style="background:'+x[2]+'"><i style="background:'+x[3]+'"></i></span>'+x[1]+'</button>'}).join('');
  document.body.appendChild(m);
}

/* прогресс: только отметки «прочитано» */
var P=(function(){try{return JSON.parse(store('feng:'+PROF)||'{}')||{}}catch(e){return {}}})();
P.done=P.done||{};
function pSave(){store('feng:'+PROF,JSON.stringify(P))}

/* markdown */
marked.use({gfm:true,breaks:false,renderer:{
  table:function(h,b){return '<div class="tablewrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>\n'},
  code:function(code,lang){if(lang==='f')return '<div class="f">'+esc(code)+'</div>\n';return '<pre><code>'+esc(code)+'</code></pre>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
function md(s){return marked.parse(s||'')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9а-яё]+/g,'-').replace(/^-|-$/g,'')}

function nextLesson(){for(var i=0;i<LS.length;i++)if(!P.done[LS[i].id])return LS[i];return null}
function lessonRow(l){
  var d=!!P.done[l.id];
  return '<a class="lrow'+(d?' done':'')+'" href="#t/'+l.id+'" data-q="'+esc((l.title+' '+l.short+' '+l.words.map(function(w){return w.w+' '+w.t}).join(' ')).toLowerCase())+'"><span class="ln">'+(d?'✓':l.n)+'</span><span class="lt"><b>'+esc(l.title)+'</b><small>'+esc(l.short)+'</small></span><span class="lm"><span class="tag">'+esc(l.level)+'</span><span class="tag">≈ '+l.min+' мин</span></span></a>';
}
function renderHome(){
  document.title='Английский · Финансы';
  var done=Object.keys(P.done).filter(function(k){return BYID[k]}).length,tot=LS.length,nx=nextLesson(),words=LS.reduce(function(s,l){return s+l.words.length},0);
  var h='<h1 class="pg">Finance English</h1><p class="lead">'+tot+' тем по 7–9 минут на уровне курса «Финансы»: формулы, мосты, проверки и ловушки по-английски, как на собеседовании в IB. Русский перевод терминов в скобках, слова с примерами в конце темы, общий глоссарий во вкладке. Без заданий.</p>';
  h+='<div class="hero"><div class="box"><h3>Прогресс</h3><div class="big">'+done+' <small>из '+tot+' тем</small></div><div class="bar2"><i style="width:'+Math.round(done/tot*100)+'%"></i></div>'
    +'<div class="stats"><span>Слов в курсе: <b>'+words+'</b></span><span>Уровень: <b>B1 → C1</b></span></div></div>';
  h+= nx?'<a class="box cont" href="#t/'+nx.id+'"><h3>'+(done?'Продолжить':'Начать')+'</h3><b>'+nx.n+'. '+esc(nx.title)+'</b><small>'+esc(nx.short)+'</small><span class="btn sm" style="align-self:flex-start">Открыть тему</span></a>'
    : '<div class="box"><h3>Курс прочитан</h3><b style="font:600 19px var(--serif)">Все темы отмечены</b><p class="lead" style="margin:6px 0 0">Перечитывай слова: в конце каждой темы есть список.</p></div>';
  h+='</div>';
  h+='<div class="tools"><input type="search" id="lq" placeholder="Найти тему или слово: WACC, облигации, leverage…" aria-label="Поиск темы"></div>';
  for(var u=1;u<=4;u++){var ls=LS.filter(function(l){return l.unit===u});if(!ls.length)continue;
    h+='<div class="unit" data-u="'+u+'"><h2>'+esc(UN[u][0])+'</h2><span>'+esc(UN[u][1])+' · '+ls.length+' '+plural(ls.length,['тема','темы','тем'])+'</span></div><div data-ul="'+u+'">'+ls.map(lessonRow).join('')+'</div>'}
  h+='<div class="empty" id="lnone" hidden>Ничего не найдено.</div>';
  view.innerHTML=h;
}
function filterHome(){
  var q=($('#lq')||{}).value||'';q=q.toLowerCase().trim();var any=false;
  $$('.lrow').forEach(function(a){var ok=!q||a.getAttribute('data-q').indexOf(q)>=0;a.hidden=!ok;if(ok)any=true});
  $$('.unit').forEach(function(u){var box=$('[data-ul="'+u.getAttribute('data-u')+'"]');var vis=$$('.lrow',box).some(function(a){return !a.hidden});u.hidden=!vis;box.hidden=!vis});
  var n=$('#lnone');if(n)n.hidden=any;
}
function plural(n,f){var m=n%10,c=n%100;return m===1&&c!==11?f[0]:(m>=2&&m<=4&&(c<10||c>=20)?f[1]:f[2])}

function renderLesson(id,sub){
  var l=BYID[id];if(!l){location.hash='#home';return}
  document.title=l.title+' · Finance English';store('feng:last:'+PROF,id);
  var done=!!P.done[l.id],pv=LS[l.i-1],nx=LS[l.i+1];
  var body=md(l.theory),tmp=document.createElement('div');tmp.innerHTML=body;
  var heads=[];$$('h2',tmp).forEach(function(h2){var s='s-'+slug(h2.textContent);h2.id=s;heads.push([s,h2.textContent])});
  body=tmp.innerHTML;
  var h='<a class="crumb" href="#home">← Все темы</a><h1 class="pg">'+l.n+'. '+esc(l.title)+'</h1>'
   +'<div class="lh"><span class="tag">'+esc(l.level)+'</span><span class="tag">≈ '+l.min+' мин</span><span>'+esc(UN[l.unit][0])+'</span>'+(done?'<span class="tag sc">прочитано</span>':'')+'</div>'
   +'<p class="lead">'+esc(l.short)+'</p>';
  if(heads.length)h+='<nav class="snav" id="snav">'+heads.map(function(x){return '<button type="button" class="chip" data-go="'+x[0]+'">'+esc(x[1])+'</button>'}).join('')+'<button type="button" class="chip" data-go="s-words">Words</button></nav>';
  h+='<div class="prose" id="theory">'+body+'</div>';
  h+='<section class="sec" id="s-words"><h2>Words <small style="font:500 14px var(--sans);color:var(--muted)">'+l.words.length+'</small></h2><div class="tools"><button type="button" class="btn sm ghost" data-hidet>Скрыть переводы</button></div>'
   +'<div class="tablewrap" id="wbox"><table class="wt"><thead><tr><th>Term</th><th>Перевод</th><th>Example</th></tr></thead><tbody>'
   +l.words.map(function(w){return '<tr><td>'+esc(w.w)+'</td><td class="tr">'+esc(w.t)+'</td><td class="ex">'+esc(w.x)+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  h+='<div class="done-bar'+(done?' ok':'')+'" id="donebar"><button type="button" class="btn" data-done="'+l.id+'">'+(done?'✓ Прочитано (снять отметку)':'Отметить прочитанным')+'</button></div>';
  h+='<div class="pager">'+(pv?'<a class="pv" href="#t/'+pv.id+'"><small>← Предыдущая</small><b>'+pv.n+'. '+esc(pv.title)+'</b></a>':'<span></span>')+(nx?'<a class="nx" href="#t/'+nx.id+'"><small>Следующая →</small><b>'+nx.n+'. '+esc(nx.title)+'</b></a>':'')+'</div>';
  view.innerHTML=h;
  var hh=$('#top').offsetHeight;root.style.setProperty('--hh',hh+'px');
  if(sub){var el=document.getElementById(sub);if(el)setTimeout(function(){el.scrollIntoView({block:'start'});el.classList.add('pulse')},30)}
}

function setNav(s){$$('#sw a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===s)})}
var GQ='';
function renderGlossary(q0){
  setNav('glossary');document.title='Glossary · Finance English';
  var all=[];LS.forEach(function(l){l.words.forEach(function(w){all.push({w:w.w,t:w.t,x:w.x,l:l})})});
  all.sort(function(a,b){return a.w.toLowerCase()<b.w.toLowerCase()?-1:1});
  var h='<h1 class="pg">Glossary</h1><p class="lead">'+all.length+' терминов из всех тем: английский термин, русский перевод, пример и ссылка на тему. Ищи по-английски или по-русски.</p>'
   +'<div class="tools"><input type="search" id="gq" placeholder="WACC, дюрация, covenant…" aria-label="Поиск по глоссарию" value="'+esc(GQ)+'"></div>'
   +'<div class="tablewrap"><table class="gl"><thead><tr><th>Term</th><th>Перевод</th><th>Example</th><th>Topic</th></tr></thead><tbody>'
   +all.map(function(e){return '<tr data-q="'+esc((e.w+' '+e.t+' '+e.x).toLowerCase())+'"><td>'+esc(e.w)+'</td><td>'+esc(e.t)+'</td><td class="ex">'+esc(e.x)+'</td><td><a href="#t/'+e.l.id+'/s-words">'+e.l.n+'. '+esc(e.l.title)+'</a></td></tr>'}).join('')
   +'</tbody></table></div><div class="empty" id="gnone" hidden>Ничего не найдено.</div>';
  view.innerHTML=h;var hh=$('#top').offsetHeight;root.style.setProperty('--hh',hh+'px');filterGl();
  if(q0){var el=$('#gq');el.value=q0;GQ=q0;filterGl()}
}
function filterGl(){var q=($('#gq')||{}).value||'';GQ=q;q=q.toLowerCase().trim();var any=false;$$('.gl tbody tr').forEach(function(tr){var ok=!q||tr.getAttribute('data-q').indexOf(q)>=0;tr.hidden=!ok;if(ok)any=true});var n=$('#gnone');if(n)n.hidden=any}
var lastRoute='';
function route(){
  var h=decodeURIComponent(location.hash.slice(1)||'home'),p=h.split('/');lastRoute=h;
  skinMenu(false);
  if(p[0]==='t'){setNav('home');renderLesson(p[1],p[2])}
  else if(p[0]==='glossary'){renderGlossary(p[1])}
  else{setNav('home');renderHome()}
  if(!(p[0]==='t'&&p[2]))window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(!t.closest)return;
  if(t.closest('#b-theme')){e.stopPropagation();skinMenu(true);return}
  if(b=t.closest('#thm [data-skin]')){var id=b.getAttribute('data-skin');store('fin:skin',id);if(id==='light'||id==='dark')store('theme',id);applySkin(id);skinMenu(false);return}
  if(document.getElementById('thm')&&!t.closest('#thm'))skinMenu(false);
  if(b=t.closest('[data-sz]')){if(window.siteZoom)window.siteZoom(+b.getAttribute('data-sz'));return}
  if(b=t.closest('[data-go]')){var el=document.getElementById(b.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b=t.closest('[data-hidet]')){var bx=$('#wbox').parentNode;bx.classList.toggle('hidet');b.textContent=bx.classList.contains('hidet')?'Показать переводы':'Скрыть переводы';return}
  if(b=t.closest('.hidet .tr')){b.classList.toggle('show');return}
  if(b=t.closest('[data-done]')){var l2=BYID[b.getAttribute('data-done')];if(P.done[l2.id]){delete P.done[l2.id]}else{P.done[l2.id]=Date.now()}pSave();var bar=$('#donebar'),dn=!!P.done[l2.id];bar.classList.toggle('ok',dn);b.textContent=dn?'✓ Прочитано (снять отметку)':'Отметить прочитанным';return}
});
document.addEventListener('input',function(e){if(e.target.id==='lq')filterHome();if(e.target.id==='gq')filterGl()});
route();
})();
