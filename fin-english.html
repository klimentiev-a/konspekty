<script type="application/json" id="edata">{"lessons":[{"n":1,"title":"The three statements and how they link","short":"Как связаны ОФР, баланс и ОДДС, «walk me through the three statements», что происходит при изменении амортизации, выручки и оборотного капитала","level":"B2","unit":1,"min":8,"id":"three-statements","theory":"> **In one minute.** The income statement (P&L; ОФР, отчёт о прибылях и убытках) shows performance over a period; the balance sheet (баланс) shows the position at a date; the cash flow statement (ОДДС, отчёт о движении денежных средств) reconciles (сверяет) profit with cash. Net income (NI, чистая прибыль) is the link: it flows into retained earnings (нераспределённая прибыль) on the balance sheet and is the first line of cash flow from operations (CFO, операционный денежный поток). Every change you make to one statement must land on the other two, and the balance sheet must still balance.\n\n## The three links\n\n```f\n1. Net income → Retained earnings (Equity)           — balance sheet\n2. Net income → first line of CFO, + D&A − ΔNWC       — cash flow statement\n3. Closing cash (CFS) → Cash (Assets)                 — balance sheet\n   Capex → PP&E; new debt → Liabilities; dividends → Retained earnings ↓\n```\n\nAbbreviations: D&A is depreciation and amortisation (амортизация), ΔNWC is the change in net working capital (изменение оборотного капитала), CFS is the cash flow statement, PP&E is property, plant and equipment (основные средства), CFI and CFF are investing and financing cash flows (инвестиционный и финансовый денежные потоки).\n\nAssets = Liabilities + Equity holds after every transaction (операция). If it does not, you have forgotten one leg of the entry (проводка).\n\n## Walk me through: depreciation up by 10 (tax 25%)\n\nThe standard interview script, line by line.\n\n| Statement | Change | Why |\n|---|---|---|\n| Income statement | EBIT (operating profit, операционная прибыль) −10, tax −2.5, net income −7.5 | D&A is an expense before tax |\n| Cash flow statement | NI −7.5, add back D&A +10, CFO +2.5, cash +2.5 | D&A is non-cash (неденежный расход); the tax saving is real |\n| Balance sheet | Cash +2.5, PP&E −10 → assets −7.5; retained earnings −7.5 → equity −7.5 | Both sides down 7.5, balances |\n\nThe tax shield (налоговый щит) is the only cash effect: 10 × 25% = 2.5. Higher D&A lowers profit but raises cash.\n\n## Walk me through: revenue up by 100 on credit (cost 60, tax 25%)\n\n| Statement | Change |\n|---|---|\n| Income statement | Revenue +100, COGS (cost of goods sold, себестоимость продаж) +60, EBIT +40, tax +10, NI +30 |\n| Cash flow statement | NI +30, receivables (дебиторская задолженность) +100 → −100 in ΔNWC, inventory −60 → +60; CFO −10; cash −10 |\n| Balance sheet | Cash −10, receivables +100, inventory −60 → assets +30; retained earnings +30 |\n\nProfit rose by 30 while cash fell by 10: the sale is booked under the accrual principle (принцип начисления) before the customer pays. This is why analysts compare cash conversion (конверсия прибыли в деньги) = CFO / EBITDA (earnings before interest, taxes, depreciation and amortisation; прибыль до процентов, налогов и амортизации) across years.\n\n## Walk me through: 100 of capex financed with debt\n\nIncome statement: nothing in year 0 (capex is not an expense; depreciation starts next year, interest starts accruing). Cash flow: CFI −100, CFF +100, cash unchanged. Balance sheet: PP&E +100, debt +100. From year 1: D&A and interest expense (процентные расходы) hit the P&L, interest is paid in CFO, principal (основная сумма) is repaid in CFF.\n\n## Which statement matters most?\n\nThe interview answer: the cash flow statement, because cash is a fact and profit is an opinion (прибыль — мнение, деньги — факт), and because valuation (оценка) discounts cash flows. If you can see only one line, take CFO; if you can see only two statements, take the income statement and the balance sheet, since the cash flow statement can be rebuilt from them.\n\n## Where numbers come from\n\nStatements are prepared under IFRS (МСФО) for Russian public companies, US GAAP (ОПБУ США) in the United States and RAS (РСБУ, российские стандарты) for tax and statutory purposes. Annual reports (годовые отчёты) are audited (проверены аудитором); quarterly ones usually are not. Notes to the statements (примечания к отчётности) hold the details that the face of the statements hides: debt schedules, lease commitments, segment data (данные по сегментам), related-party transactions (операции со связанными сторонами).\n\n## Checks and pitfalls\n\n- Deferred revenue (отложенная выручка) is a liability, not revenue: cash received before delivery.\n- Dividends never touch the income statement: equity down, cash down (CFF).\n- Share buybacks (обратный выкуп) reduce equity through treasury shares (казначейские акции), not through profit.\n- Goodwill impairment (обесценение гудвила) is a non-cash loss: NI down, add back in CFO, cash unchanged.\n- Interest paid sits in CFO under US GAAP; under IFRS it may be in CFO or CFF: check the policy before comparing.","words":[{"w":"income statement (P&L)","t":"отчёт о прибылях и убытках, ОФР","x":"The income statement covers a period, not a date."},{"w":"balance sheet","t":"баланс","x":"The balance sheet must balance after every entry."},{"w":"cash flow statement","t":"отчёт о движении денежных средств, ОДДС","x":"The cash flow statement reconciles profit with cash."},{"w":"reconcile","t":"сверять, увязывать","x":"CFO reconciles net income with operating cash."},{"w":"retained earnings","t":"нераспределённая прибыль","x":"Net income flows into retained earnings."},{"w":"accrual principle","t":"принцип начисления","x":"Revenue is recognised on delivery under the accrual principle."},{"w":"non-cash expense","t":"неденежный расход","x":"Depreciation is the classic non-cash expense."},{"w":"tax shield","t":"налоговый щит","x":"The tax shield on D&A equals D&A times the tax rate."},{"w":"cash conversion","t":"конверсия прибыли в деньги","x":"Cash conversion fell to 60% of EBITDA."},{"w":"receivables","t":"дебиторская задолженность","x":"A jump in receivables drains operating cash flow."},{"w":"inventory","t":"запасы","x":"Inventory build-up ahead of the season reduced CFO."},{"w":"capital expenditures (capex)","t":"капитальные затраты","x":"Capex is capitalised, not expensed."},{"w":"capitalise vs expense","t":"капитализировать / списывать в расходы","x":"The company capitalised development costs."},{"w":"principal","t":"основная сумма долга","x":"Principal repayments sit in financing cash flow."},{"w":"deferred revenue","t":"отложенная выручка","x":"Deferred revenue is a liability until the service is delivered."},{"w":"treasury shares","t":"казначейские акции","x":"Buybacks create treasury shares."},{"w":"impairment","t":"обесценение","x":"The impairment is non-cash and added back in CFO."},{"w":"notes to the financial statements","t":"примечания к отчётности","x":"The debt schedule is in the notes."},{"w":"related-party transactions","t":"операции со связанными сторонами","x":"Related-party transactions are disclosed separately."},{"w":"statutory accounts","t":"отчётность по национальным стандартам","x":"Statutory accounts under RAS differ from IFRS."},{"w":"audited","t":"проверенный аудитором","x":"Only the annual statements are audited."}]},{"n":2,"title":"Income statement, EBITDA and adjustments","short":"Структура ОФР, EBITDA и её корректировки, МСФО 16, разовые статьи, разводнённая EPS через treasury stock method","level":"B2","unit":1,"min":8,"id":"income-statement-ebitda","theory":"> **In one minute.** Revenue → gross profit → EBITDA → EBIT → EBT → net income. EBITDA (прибыль до процентов, налогов и амортизации) is the banker's proxy for operating cash generation (операционная генерация денег): it strips out financing (interest), jurisdiction (tax) and asset age (D&A, амортизация). Everyone adjusts it, so always ask which EBITDA: reported (отчётная), adjusted (скорректированная), pre- or post-IFRS 16 (МСФО 16), LTM (last twelve months, за последние 12 месяцев) or forward (прогнозная).\n\n## Structure\n\n```f\nRevenue\n− COGS                      → Gross profit        (gross margin, валовая маржа)\n− SG&A, R&D, other opex     → EBITDA              (EBITDA margin)\n− D&A                       → EBIT                (operating margin)\n± Interest, FX, other       → EBT (pre-tax)\n− Income tax                → Net income          (net margin)\n÷ Diluted shares            → Diluted EPS\n```\n\nCOGS is the cost of goods sold (себестоимость продаж), SG&A — selling, general and administrative expenses (коммерческие и управленческие расходы), R&D — research and development (исследования и разработки), opex — operating expenses (операционные расходы), EBIT — earnings before interest and tax (операционная прибыль), EBT — earnings before tax (прибыль до налогообложения), FX — foreign exchange (курсовые разницы), EPS — earnings per share (прибыль на акцию).\n\nMargins (маржа, рентабельность) are each line divided by revenue. \"Operating leverage\" (операционный рычаг) means margins expand when revenue grows because part of the costs is fixed (постоянные затраты).\n\n## EBITDA adjustments\n\nAdjusted EBITDA (скорректированная EBITDA) removes items that are non-recurring (разовые) or non-operating (неоперационные):\n\n- one-off items (разовые статьи): restructuring costs (расходы на реструктуризацию), litigation (судебные издержки), gains on asset sales (прибыль от продажи активов);\n- impairments (обесценения) and write-offs (списания);\n- share-based compensation (вознаграждение акциями) — US practice adds it back, many analysts do not;\n- FX revaluation (курсовые переоценки) of debt and balances;\n- income from associates (доход от ассоциированных компаний) if their value is added separately in the EV bridge (мост от стоимости бизнеса к стоимости акций).\n\nRule: whatever you add back to EBITDA must be treated consistently (единообразно) across all peers and in the EV bridge. Suspicious sign: \"adjustments\" every year in the same direction.\n\n## IFRS 16 and leases\n\nSince 2019 operating leases (операционная аренда) are capitalised: a right-of-use asset (актив в форме права пользования) and a lease liability (обязательство по аренде). Rent leaves opex and splits into depreciation and interest, so EBITDA rises mechanically for retailers, airlines and telecoms. Two consistent options: use post-IFRS 16 EBITDA and include lease liabilities in net debt, or use EBITDAR (EBITDA before rent) with pre-IFRS 16 debt. Mixing them makes EV/EBITDA look cheap.\n\n## Revenue recognition\n\nUnder IFRS 15 revenue is recognised when control (контроль) of a good or service passes to the customer, allocated across performance obligations (обязанности к исполнению). Long contracts use percentage of completion (по мере готовности). Subscriptions create deferred revenue (отложенная выручка). Gross vs net (брутто или нетто): a marketplace books commission, not the full ticket. Check the policy before comparing revenue multiples.\n\n## Below EBIT\n\nInterest expense (процентные расходы) net of interest income; FX gains and losses (курсовые разницы); share of profit of associates (доля в прибыли ассоциированных компаний, equity method). Effective tax rate (эффективная ставка налога) = tax / EBT; it differs from the statutory rate (установленная законом ставка; 25% in Russia from 2025) because of non-deductible expenses (невычитаемые расходы), tax losses carried forward (перенос убытков) and different jurisdictions (юрисдикции).\n\n## Diluted EPS and the treasury stock method\n\nBasic EPS (базовая прибыль на акцию) = net income to common shareholders / weighted average shares (средневзвешенное число акций). Diluted EPS (разводнённая) adds potential shares from options (опционы), warrants (варранты) and convertibles (конвертируемые бумаги). The TSM assumes that option proceeds are used to buy back shares at the market price; only in-the-money options (опционы «в деньгах», strike — цена исполнения — below the share price) count.\n\n```f\nTreasury stock method (TSM):\nnew shares = options × (1 − strike / share price)      — only in-the-money options\nConvertibles (if-converted): add conversion shares, add back after-tax interest to NI\n```\n\nDiluted share count is also what you use in the EV bridge and for price per share in a DCF (discounted cash flow, модель дисконтированных денежных потоков).\n\n## Quality of earnings checks\n\n- Revenue grows, receivables grow faster → aggressive recognition.\n- EBITDA grows, CFO (operating cash flow, операционный денежный поток) does not → working capital or capitalised costs.\n- Capitalised development (капитализированные разработки) rising → costs moved from the P&L (ОФР) to the balance sheet.\n- Frequent changes in depreciation lives (сроки амортизации) or inventory method.\n- Large \"other income\" (прочие доходы).","words":[{"w":"gross profit / gross margin","t":"валовая прибыль / валовая маржа","x":"Gross margin compressed on higher input costs."},{"w":"operating leverage","t":"операционный рычаг","x":"Operating leverage drives margin expansion as volumes grow."},{"w":"EBITDA","t":"прибыль до процентов, налогов и амортизации","x":"Adjusted EBITDA excludes restructuring costs."},{"w":"adjusted (normalised) EBITDA","t":"скорректированная EBITDA","x":"Normalised EBITDA is the base for multiples."},{"w":"non-recurring item","t":"разовая статья","x":"The fine was treated as a non-recurring item."},{"w":"restructuring costs","t":"расходы на реструктуризацию","x":"Restructuring costs were added back."},{"w":"write-off","t":"списание","x":"The write-off of obsolete inventory hit EBIT."},{"w":"share-based compensation","t":"вознаграждение акциями","x":"US companies add back share-based compensation."},{"w":"right-of-use asset","t":"актив в форме права пользования","x":"IFRS 16 created a right-of-use asset."},{"w":"lease liability","t":"обязательство по аренде","x":"Lease liabilities are included in net debt."},{"w":"EBITDAR","t":"EBITDA до арендных платежей","x":"Airlines are compared on EBITDAR."},{"w":"revenue recognition","t":"признание выручки","x":"Revenue recognition follows IFRS 15."},{"w":"performance obligation","t":"обязанность к исполнению","x":"Each performance obligation is recognised separately."},{"w":"gross vs net revenue","t":"выручка брутто и нетто","x":"The marketplace reports net revenue."},{"w":"effective tax rate","t":"эффективная ставка налога","x":"The effective tax rate is below the statutory 25%."},{"w":"tax loss carryforward","t":"перенос налогового убытка","x":"Tax loss carryforwards reduce future cash taxes."},{"w":"basic / diluted EPS","t":"базовая / разводнённая прибыль на акцию","x":"Diluted EPS is lower because of options."},{"w":"treasury stock method","t":"метод казначейских акций","x":"The treasury stock method counts only in-the-money options."},{"w":"weighted average shares","t":"средневзвешенное число акций","x":"EPS uses weighted average shares, not year-end."},{"w":"equity method","t":"метод долевого участия","x":"Associates are accounted for by the equity method."},{"w":"capitalised development costs","t":"капитализированные затраты на разработку","x":"Capitalised development costs flatter EBITDA."}]},{"n":3,"title":"Balance sheet, working capital and net debt","short":"Что считать долгом и долгоподобными статьями, NWC по операционному определению, DSO/DIO/DPO, цикл оборота денег, забалансовые обязательства","level":"B2","unit":1,"min":8,"id":"balance-sheet-nwc-net-debt","theory":"> **In one minute.** The balance sheet is a photo: Assets = Liabilities + Equity. For valuation you need two things from it: net working capital, NWC (чистый оборотный капитал), because its change is a cash flow, and net debt (чистый долг) with debt-like items (долгоподобные статьи), because they are subtracted from enterprise value (EV, стоимость бизнеса). Book equity (балансовый капитал) is history; market capitalization (рыночная капитализация) is expectation.\n\n## Operating NWC\n\n```f\nNWC (operating) = Receivables + Inventory + Prepayments\n               − Payables − Accrued expenses − Customer advances\nExcludes: cash, short-term debt, current portion of LTD, dividends payable\n```\n\nLTD is long-term debt (долгосрочный долг): its current portion is debt, not working capital.\n\nGrowth consumes NWC. ΔNWC > 0 is a cash outflow (отток), ΔNWC < 0 an inflow (приток). Forecast NWC through days (в днях), not as a lump sum:\n\n```f\nDSO = Receivables / Revenue × 365        (дни оборота дебиторки)\nDIO = Inventory / COGS × 365             (дни оборота запасов)\nDPO = Payables / COGS × 365              (дни оборота кредиторки)\nCash conversion cycle (CCC) = DSO + DIO − DPO\n```\n\nDSO, DIO and DPO stand for days sales outstanding, days inventory outstanding and days payables outstanding; COGS is the cost of goods sold (себестоимость продаж).\n\nRetail and marketplaces often run a negative CCC: customers pay today, suppliers are paid in 45–60 days, so suppliers finance growth (поставщики финансируют рост). In a downturn this reverses: sales fall, payables still come due.\n\n## Net debt and debt-like items\n\n```f\nNet debt = Gross debt (loans, bonds, leases) − Cash and equivalents\nDebt-like items (subtract from EV in the bridge):\n  lease liabilities (IFRS 16), pension deficits (дефицит пенсионного плана),\n  asset retirement obligations (обязательства по выводу из эксплуатации),\n  preferred shares, minority interest (NCI), earn-outs, deferred consideration,\n  unpaid dividends, litigation provisions\nCash-like items (add): marketable securities, stakes in associates, non-core assets\n```\n\nTranslations: preferred shares (привилегированные акции), minority interest or NCI, non-controlling interest (неконтролирующая доля), earn-outs (доплаты продавцу при достижении целей), deferred consideration (отложенная оплата по сделке), litigation provisions (резервы под судебные иски), marketable securities (ликвидные ценные бумаги), stakes in associates (доли в ассоциированных компаниях), non-core assets (непрофильные активы).\n\nRestricted cash (ограниченные в использовании денежные средства) is not cash. Trapped cash (заблокированные деньги) in foreign subsidiaries may be discounted. For a consistent EV/EBITDA, lease liabilities go into net debt only if EBITDA is post-IFRS 16.\n\n## Leverage and liquidity ratios\n\n```f\nNet debt / EBITDA       — leverage; < 2x comfortable, > 4x stressed (sector-dependent)\nDebt / Equity, Debt / Capital\nInterest coverage = EBIT / Interest   (or EBITDA / Interest)\nCurrent ratio = Current assets / Current liabilities\nQuick ratio = (Current assets − Inventory) / Current liabilities\n```\n\nUtilities and infrastructure carry higher leverage because cash flows are regulated and stable; miners and developers cannot.\n\n## Equity\n\nShare capital (уставный капитал), share premium (эмиссионный доход), retained earnings, other comprehensive income, OCI (прочий совокупный доход: FX translation, revaluation), treasury shares (negative). Book value per share (балансовая стоимость на акцию) matters for banks and insurers, where P/B (price to book, цена к балансовой стоимости) is the key multiple; for industrials it is mostly irrelevant.\n\n## Off-balance-sheet and hidden liabilities\n\nGuarantees (поручительства) for subsidiaries, take-or-pay contracts (контракты «бери или плати»), commitments (обязательства по капзатратам), contingent liabilities (условные обязательства) in litigation, factoring without recourse (факторинг без регресса) that removes receivables but not risk. All live in the notes (примечания). Due diligence (комплексная проверка) in M&A (mergers and acquisitions, слияния и поглощения) spends most of its time here.\n\n## Reading the balance sheet in five minutes\n\n1. Net debt / EBITDA and the maturity profile (график погашений): when is the debt wall (стена погашений)?\n2. NWC days versus history and peers: are receivables ageing (стареет ли дебиторка)?\n3. Goodwill and intangibles share of assets: acquisition-driven growth, impairment risk.\n4. Cash versus short-term debt: liquidity cushion (подушка ликвидности), undrawn facilities (невыбранные кредитные линии).\n5. Equity sign: negative equity (отрицательный капитал) after losses or buybacks is a covenant (ковенант, условие кредитного договора) and solvency (платёжеспособность) issue.","words":[{"w":"net working capital (NWC)","t":"чистый оборотный капитал","x":"ΔNWC is a cash flow, not an expense."},{"w":"operating definition","t":"операционное определение","x":"Use the operating definition of NWC, without cash and debt."},{"w":"prepayments","t":"авансы выданные, предоплата","x":"Prepayments to suppliers are part of NWC."},{"w":"customer advances","t":"авансы полученные","x":"Customer advances reduce working capital needs."},{"w":"accrued expenses","t":"начисленные расходы","x":"Accrued expenses include unpaid wages."},{"w":"days sales outstanding (DSO)","t":"дни оборота дебиторской задолженности","x":"DSO rose from 40 to 55 days."},{"w":"cash conversion cycle","t":"цикл оборота денежных средств","x":"A negative cash conversion cycle funds growth."},{"w":"gross debt / net debt","t":"валовой долг / чистый долг","x":"Net debt excludes cash on the balance sheet."},{"w":"debt-like items","t":"долгоподобные статьи","x":"Pension deficits are debt-like items."},{"w":"restricted cash","t":"ограниченные в использовании денежные средства","x":"Restricted cash is excluded from net debt."},{"w":"asset retirement obligation","t":"обязательство по выводу из эксплуатации","x":"Miners carry large asset retirement obligations."},{"w":"minority interest (NCI)","t":"доля меньшинства, неконтролирующая доля","x":"NCI is subtracted in the EV bridge."},{"w":"interest coverage","t":"покрытие процентов","x":"Interest coverage dropped below 2x."},{"w":"other comprehensive income (OCI)","t":"прочий совокупный доход","x":"FX translation differences go through OCI."},{"w":"book value per share","t":"балансовая стоимость на акцию","x":"The bank trades at 0.8x book value per share."},{"w":"contingent liability","t":"условное обязательство","x":"Contingent liabilities are disclosed in the notes."},{"w":"take-or-pay contract","t":"контракт «бери или плати»","x":"Take-or-pay contracts are hidden fixed costs."},{"w":"factoring without recourse","t":"факторинг без регресса","x":"Factoring without recourse removes receivables from the balance sheet."},{"w":"maturity profile","t":"график погашений","x":"The maturity profile shows a wall in 2027."},{"w":"undrawn facility","t":"невыбранная кредитная линия","x":"Undrawn facilities provide a liquidity cushion."},{"w":"solvency","t":"платёжеспособность","x":"Negative equity raises solvency concerns."}]},{"n":4,"title":"Cash flow, FCFF and FCFE","short":"Косвенный метод, три раздела ОДДС, формулы FCFF и FCFE, с какой ставкой что дисконтировать, cash conversion и дивидендная способность","level":"B2","unit":1,"min":8,"id":"cash-flow-fcf","theory":"> **In one minute.** CFO, cash flow from operations (операционный денежный поток), starts from net income, adds back non-cash items and subtracts ΔNWC, the change in net working capital (изменение оборотного капитала). FCFF, free cash flow to the firm (поток для всех инвесторов), is unlevered (без учёта долга) and discounted at WACC, the weighted average cost of capital (средневзвешенная стоимость капитала), to get enterprise value (стоимость бизнеса); FCFE, free cash flow to equity (поток для акционеров), is levered (с учётом долга) and discounted at the cost of equity (стоимость собственного капитала) to get equity value (стоимость акционерного капитала). Never cross them.\n\n## The three sections\n\n```f\nCFO = Net income + D&A + impairments + SBC ± other non-cash − ΔNWC (− interest paid, if shown here)\nCFI = − Capex − Acquisitions + Disposals ± Financial investments\nCFF = + Debt raised − Debt repaid + Equity issued − Buybacks − Dividends − Lease principal\nΔ Cash = CFO + CFI + CFF + FX effect\n```\n\nCFI and CFF are investing and financing cash flows (инвестиционный и финансовый потоки), D&A is depreciation and amortisation (амортизация), SBC is share-based compensation (вознаграждение акциями).\n\nUnder IFRS (МСФО) interest paid and dividends received can sit in CFO or CFF; US GAAP puts interest paid in CFO. For comparisons, reclassify (переклассифицировать) to one convention.\n\n## FCFF and FCFE\n\n```f\nFCFF = EBIT × (1 − t) + D&A − Capex − ΔNWC\n     = NOPAT + D&A − Capex − ΔNWC\n     = CFO + Interest × (1 − t) − Capex            (if interest is in CFO)\n\nFCFE = FCFF − Interest × (1 − t) + Net borrowing\n     = CFO − Capex + Net borrowing                  (if interest is in CFO)\n```\n\nHere t is the tax rate (ставка налога). NOPAT, net operating profit after tax (чистая операционная прибыль после налогов), uses EBIT (operating profit, операционная прибыль), not EBT (прибыль до налогообложения), because interest has not been deducted: the cash is available to lenders and shareholders together. Net borrowing (чистое привлечение долга) = new debt − repayments.\n\n| Flow | Belongs to | Discount at | Result |\n|---|---|---|---|\n| FCFF | Lenders + shareholders | WACC | Enterprise value |\n| FCFE | Shareholders | Cost of equity (Ke) | Equity value |\n| Dividends | Shareholders | Ke | Equity value (DDM, dividend discount model) |\n\n## Simple FCF and dividend capacity\n\n```f\nFCF (simple) = CFO − Capex\nFCF yield = FCF / Market cap\nDividend capacity = FCF − mandatory debt repayments − lease principal\n```\n\nRussian dividend policies (дивидендная политика) often reference FCF (Lukoil: 100% of adjusted FCF), net income under IFRS (SOEs, state-owned enterprises — госкомпании: 50%), or leverage thresholds (Severstal, NLMK: 100% of FCF if Net debt/EBITDA < 1x). Read the policy, then rebuild the formula.\n\n## Capex: maintenance versus growth\n\nMaintenance capex (поддерживающие капзатраты) keeps capacity (мощности) flat; growth capex (капзатраты на рост) adds it. Companies rarely split them, so analysts proxy maintenance capex by D&A or by the company's guidance (ориентир менеджмента). In a DCF the terminal year must have capex ≥ D&A, otherwise the company shrinks while you assume it grows.\n\n## Cash conversion and quality\n\n```f\nCash conversion = CFO / EBITDA     (or FCF / Net income)\n```\n\nBelow 60–70% for several years means profit is not turning into cash: receivables ageing, inventory build-up, capitalised costs (капитализированные расходы) hidden in CFI, or prepayments to related parties. Above 100% is usually temporary: NWC release (высвобождение оборотного капитала) in a downturn.\n\n## Non-cash and non-operating traps\n\n- Share-based compensation: non-cash, but it dilutes shareholders; subtract its value or count the shares.\n- Capitalised interest (капитализированные проценты) on construction sits in CFI, not CFO.\n- Factoring receivables boosts CFO once; it is financing in substance (по сути).\n- Working capital facilities (кредитные линии на оборотный капитал) drawn at year end flatter cash.\n- FX effect on cash (курсовой эффект) is not a flow: show it separately.\n\n## Burn rate and runway\n\nFor loss-making companies: burn rate (скорость сжигания денег) = monthly negative FCF; runway (запас хода) = cash / burn rate. A venture round (раунд финансирования) must close before runway hits six months.","words":[{"w":"cash flow from operations (CFO)","t":"операционный денежный поток","x":"CFO covers capex twice."},{"w":"indirect method","t":"косвенный метод","x":"The indirect method starts from net income."},{"w":"disposal","t":"продажа актива, выбытие","x":"Disposals of non-core assets boosted CFI."},{"w":"reclassify","t":"переклассифицировать","x":"Reclassify interest paid into CFO for comparability."},{"w":"free cash flow to the firm (FCFF)","t":"свободный денежный поток для фирмы","x":"FCFF is unlevered and discounted at WACC."},{"w":"free cash flow to equity (FCFE)","t":"свободный денежный поток для акционеров","x":"FCFE includes net borrowing."},{"w":"unlevered / levered","t":"без учёта долга / с учётом долга","x":"Unlevered free cash flow ignores interest."},{"w":"NOPAT","t":"чистая операционная прибыль после налогов","x":"NOPAT equals EBIT times one minus tax."},{"w":"net borrowing","t":"чистое привлечение долга","x":"Net borrowing was positive after the refinancing."},{"w":"dividend discount model (DDM)","t":"модель дисконтирования дивидендов","x":"Banks are often valued with a DDM."},{"w":"FCF yield","t":"доходность по свободному денежному потоку","x":"A 12% FCF yield supports the dividend."},{"w":"dividend capacity","t":"дивидендная способность","x":"Dividend capacity is FCF after mandatory repayments."},{"w":"maintenance capex","t":"поддерживающие капзатраты","x":"Maintenance capex roughly equals D&A."},{"w":"guidance","t":"ориентир (прогноз менеджмента)","x":"Management guidance implies capex of 50 billion."},{"w":"capacity","t":"мощности","x":"Growth capex adds capacity."},{"w":"cash conversion","t":"конверсия прибыли в деньги","x":"Cash conversion improved to 85%."},{"w":"working capital release","t":"высвобождение оборотного капитала","x":"A working capital release lifted FCF in the downturn."},{"w":"capitalised interest","t":"капитализированные проценты","x":"Capitalised interest is hidden in CFI."},{"w":"in substance","t":"по сути, по экономическому содержанию","x":"Factoring is financing in substance."},{"w":"burn rate","t":"скорость сжигания денег","x":"The burn rate is 3 million dollars a month."},{"w":"runway","t":"запас хода (месяцев денег)","x":"Runway is under a year."}]},{"n":5,"title":"Time value of money, NPV and IRR","short":"Дисконтирование, аннуитет и перпетуитет, NPV и IRR с их ловушками, mid-year convention, связь IRR и MOIC","level":"B2","unit":2,"min":7,"id":"tvm-npv-irr","theory":"> **In one minute.** PV = CF / (1 + r)^t: present value (приведённая стоимость) is a cash flow (денежный поток) discounted at rate r for t years. Perpetuity (перпетуитет, бессрочный поток) = C / r; growing perpetuity = C / (r − g), where g is the growth rate (темп роста). NPV (чистая приведённая стоимость) > 0 means the project earns more than its cost of capital; IRR (внутренняя норма доходности) is the rate at which NPV = 0. NPV decides, IRR communicates.\n\n## Core formulas\n\n```f\nFV = PV × (1 + r)^n                  PV = FV / (1 + r)^n\nDiscount factor DF_t = 1 / (1 + r)^t\nAnnuity PV = C × [1 − (1 + r)^−n] / r\nPerpetuity PV = C / r                Growing perpetuity PV = C₁ / (r − g), g < r\nMid-year convention: DF_t = 1 / (1 + r)^(t − 0.5)\nEAR = (1 + APR / m)^m − 1            continuous: FV = PV × e^(rt)\nRule of 72: doubling time ≈ 72 / r(%)\n```\n\nFV is future value (будущая стоимость), C is a fixed annual payment, n the number of periods; EAR is the effective annual rate (эффективная годовая ставка) and APR the quoted annual rate (номинальная годовая ставка) compounded m times a year.\n\nCash flows arrive through the year, not on 31 December, so DCF (discounted cash flow, дисконтированные денежные потоки) models use the mid-year convention (поправка на середину года); it raises value by roughly half a year of discounting. Nominal flows (номинальные, с инфляцией) go with nominal rates, real with real; rouble flows with a rouble rate.\n\n## NPV\n\n```f\nNPV = Σ CF_t / (1 + r)^t − I₀\n```\n\nDecision rule: accept if NPV > 0 at the cost of capital. NPV is additive (аддитивна): the NPV of a portfolio of projects is the sum. Excel: `=NPV(r; CF₁..CFₙ) + CF₀` (ЧПС); the function assumes the first flow is one period away, so add the initial investment (первоначальные инвестиции) outside.\n\n## IRR and its traps\n\n```f\nΣ CF_t / (1 + IRR)^t = 0          Excel: IRR (ВСД), XIRR for dated flows (ЧИСТВНДОХ)\n```\n\nAccept if IRR > hurdle rate (пороговая ставка). Traps:\n\n- **Multiple IRRs** when flows change sign more than once (mine closure costs, refinancing).\n- **Reinvestment assumption:** IRR assumes interim flows are reinvested at the IRR. MIRR (модифицированная IRR) uses the cost of capital.\n- **Scale:** a 50% IRR on 1 million is worth less than 20% on 100 million. Mutually exclusive projects (взаимоисключающие проекты): use NPV, or incremental IRR (приростная IRR).\n- **Timing games:** early cash out inflates IRR; private equity (фонды прямых инвестиций) uses subscription lines (кредитные линии под обязательства инвесторов) to delay capital calls (требования о внесении капитала) and lift IRR without creating value.\n\n## IRR, MOIC and time\n\nPrivate equity reports IRR together with MOIC, multiple on invested capital (мультипликатор вложенного капитала), because IRR alone hides duration.\n\n| MOIC | 3 years | 5 years | 7 years |\n|---|---|---|---|\n| 2.0x | 26% | 15% | 10% |\n| 2.5x | 36% | 20% | 14% |\n| 3.0x | 44% | 25% | 17% |\n\nMental rule: IRR ≈ MOIC^(1/n) − 1.\n\n## Payback and profitability index\n\nPayback (срок окупаемости) ignores time value and later flows; discounted payback (дисконтированный срок окупаемости) fixes the first. Profitability index, PI (индекс рентабельности) = PV of inflows / I₀, useful under capital rationing (ограниченность капитала): rank by PI, not by NPV.\n\n## Choosing the discount rate\n\nThe rate must match the risk and the currency of the flow: risk-free (безрисковая ставка) for certain flows, WACC (weighted average cost of capital, средневзвешенная стоимость капитала) for the firm's operating flows, Ke (cost of equity, стоимость собственного капитала) for equity flows, a project-specific rate (ставка под проект) when the project's risk differs from the company's. Using the company WACC for a riskier project is a classic value-destroying error.","words":[{"w":"discount factor","t":"коэффициент дисконтирования","x":"The discount factor for year 5 at 12% is 0.567."},{"w":"annuity","t":"аннуитет","x":"Loan repayments form an annuity."},{"w":"perpetuity","t":"перпетуитет","x":"Terminal value is a growing perpetuity."},{"w":"mid-year convention","t":"поправка на середину года","x":"The mid-year convention adds about 4% to EV."},{"w":"effective annual rate (EAR)","t":"эффективная годовая ставка","x":"EAR exceeds the quoted APR under monthly compounding."},{"w":"nominal vs real","t":"номинальный / реальный","x":"Match nominal flows with nominal rates."},{"w":"net present value (NPV)","t":"чистая приведённая стоимость","x":"NPV is positive at a 15% WACC."},{"w":"additive","t":"аддитивный","x":"NPV is additive across projects."},{"w":"initial investment","t":"первоначальные инвестиции","x":"The initial investment is paid at t = 0."},{"w":"internal rate of return (IRR)","t":"внутренняя норма доходности","x":"The project IRR is 18% against a 15% hurdle."},{"w":"hurdle rate","t":"пороговая ставка","x":"Projects must clear the hurdle rate."},{"w":"multiple IRRs","t":"несколько значений IRR","x":"Sign changes produce multiple IRRs."},{"w":"reinvestment assumption","t":"допущение о реинвестировании","x":"IRR's reinvestment assumption is optimistic."},{"w":"modified IRR (MIRR)","t":"модифицированная внутренняя норма доходности","x":"MIRR reinvests at the cost of capital."},{"w":"mutually exclusive projects","t":"взаимоисключающие проекты","x":"For mutually exclusive projects, rank by NPV."},{"w":"incremental IRR","t":"приростная IRR","x":"Compare the incremental IRR with the hurdle."},{"w":"subscription line","t":"кредитная линия под обязательства инвесторов","x":"Subscription lines inflate reported IRR."},{"w":"capital call","t":"требование о внесении капитала","x":"The fund issued a capital call for the deal."},{"w":"MOIC","t":"мультипликатор вложенного капитала","x":"2.5x MOIC in five years is roughly a 20% IRR."},{"w":"payback period","t":"срок окупаемости","x":"Payback is four years before discounting."},{"w":"profitability index","t":"индекс рентабельности","x":"Rank projects by profitability index under capital rationing."},{"w":"capital rationing","t":"ограниченность капитала","x":"Under capital rationing not all positive-NPV projects can be funded."}]},{"n":6,"title":"Cost of capital: CAPM and WACC","short":"Полная формула WACC, CAPM со страновой премией, unlever/relever беты по Хамаде, стоимость долга, веса по рынку, типичные ошибки и российская специфика","level":"C1","unit":2,"min":8,"id":"wacc-capm","theory":"> **In one minute.** WACC (средневзвешенная стоимость капитала) is the blended required return (требуемая доходность) of lenders and shareholders, weighted by market values of debt and equity. Ke, the cost of equity (стоимость собственного капитала), comes from the CAPM, the capital asset pricing model (модель оценки капитальных активов), with a beta relevered to the target capital structure; Kd, the cost of debt (стоимость долга), is the current marginal borrowing cost (предельная стоимость заимствования) after tax. Small changes in WACC move a DCF (discounted cash flow, модель дисконтированных денежных потоков) a lot, so every input must be defensible (обоснованным).\n\n## Formulas\n\n```f\nWACC = E/(D+E) × Ke + D/(D+E) × Kd × (1 − t)   (+ P/(D+E+P) × Kp if preferred shares)\n\nCAPM: Ke = Rf + β_L × ERP (+ CRP + size premium + specific risk premium)\n\nHamada:  β_U = β_L / [1 + (1 − t) × D/E]        (unlever peer betas)\n         β_L = β_U × [1 + (1 − t) × D/E_target]  (relever to target)\n```\n\nE and D are the market values of equity and debt, P and Kp — of preferred shares (привилегированные акции), t is the tax rate, Rf the risk-free rate, β_L and β_U the levered and unlevered betas (бета с учётом и без учёта долга).\n\n## Inputs: cost of equity\n\n- **Risk-free rate (безрисковая ставка):** yield of long government bonds in the currency of the cash flows. Rouble DCF: 10-year OFZ (ОФЗ, облигации федерального займа); dollar DCF: 10-year US Treasury. Match currency and horizon.\n- **Equity risk premium, ERP (премия за риск акций):** long-run excess return of stocks over bonds; practitioners use 5–6% for developed markets (Damodaran, Kroll surveys).\n- **Country risk premium, CRP (страновая премия):** added for emerging markets; estimated from sovereign CDS (credit default swap, кредитный дефолтный своп) spreads or sovereign bond spreads scaled by equity volatility. For a rouble DCF with OFZ as Rf part of the country risk is already in Rf; do not double count (не учитывать дважды).\n- **Beta (бета):** regression of stock returns on the index, 2–5 years, weekly or monthly. Illiquid stocks give unreliable betas, so use a peer set (аналоги): unlever each peer's beta, take the median, relever to the target's D/E. Adjusted beta (Bloomberg) = 0.67 × raw + 0.33 × 1.\n- **Size premium (премия за размер)** and company-specific premium (специфическая премия) are used for small or private companies; justify them, do not plug.\n\n## Inputs: cost of debt\n\nKd is the yield to maturity on the company's traded bonds or the rate on new loans, not the coupon on old debt. For unrated companies: risk-free + spread implied by a synthetic rating (синтетический рейтинг) from interest coverage. After tax: Kd × (1 − t), valid only while the company has taxable profit to shield (есть прибыль, которую можно защитить).\n\n## Weights\n\nMarket value of equity = market capitalization (diluted). Market value of debt ≈ book value unless bonds trade far from par. Use the target capital structure (целевая структура капитала): the industry median or management's stated leverage, not the distressed structure of today. WACC assumes the structure is constant; if leverage changes a lot (LBO, leveraged buyout — покупка компании в долг), use APV (adjusted present value, скорректированная приведённая стоимость): unlevered value + PV of tax shields − PV of distress costs.\n\n## Why debt is cheaper, up to a point\n\nLenders are senior and interest is deductible, so Kd(1 − t) < Ke. Adding debt lowers WACC until expected costs of financial distress (ожидаемые издержки финансовых затруднений) and rising Ke and Kd outweigh the tax shield: trade-off theory (теория компромисса). Modigliani-Miller: without taxes and distress, capital structure is irrelevant; with taxes, V_L = V_U + t × D (value of the levered firm equals the unlevered value plus the tax shield on debt). Pecking order (теория иерархии): firms prefer internal funds, then debt, then equity, because equity issuance signals overvaluation.\n\n## Worked example (rouble)\n\n```f\nRf = 14.5% (10y OFZ), ERP = 6%, β_U(peers) = 0.9, target D/E = 0.5, t = 25%\nβ_L = 0.9 × [1 + 0.75 × 0.5] = 1.24\nKe = 14.5% + 1.24 × 6% = 21.9%\nKd = 17% → after tax 12.75%\nWeights: E = 1/1.5 = 66.7%, D = 33.3%\nWACC = 0.667 × 21.9% + 0.333 × 12.75% = 14.6% + 4.25% = 18.9%\n```\n\n## Typical mistakes\n\n- Book weights instead of market weights.\n- Coupon of old bonds instead of current yield.\n- Dollar ERP with rouble Rf, or real flows with nominal WACC.\n- Double counting country risk (in Rf and in CRP).\n- Using WACC for FCFE or Ke for FCFF.\n- A constant WACC for a company that deleverages (снижает долг) over the forecast; use APV or year-by-year WACC.","words":[{"w":"required return","t":"требуемая доходность","x":"Investors' required return rises with risk."},{"w":"marginal cost of borrowing","t":"предельная стоимость заимствования","x":"Kd is the marginal cost of borrowing, not the historical coupon."},{"w":"defensible","t":"обоснованный, защищаемый","x":"Every WACC input must be defensible in front of a client."},{"w":"risk-free rate","t":"безрисковая ставка","x":"We take the 10-year OFZ yield as the risk-free rate."},{"w":"equity risk premium (ERP)","t":"премия за риск инвестирования в акции","x":"An ERP of 6% is standard."},{"w":"country risk premium (CRP)","t":"страновая премия за риск","x":"The CRP is derived from sovereign CDS."},{"w":"double count","t":"учитывать дважды","x":"Do not double count country risk."},{"w":"raw / adjusted beta","t":"сырая / скорректированная бета","x":"Adjusted beta pulls raw beta towards one."},{"w":"unlever / relever","t":"убрать / вернуть эффект долга (бета)","x":"Relever the beta to the target D/E."},{"w":"size premium","t":"премия за размер","x":"A size premium applies to small caps."},{"w":"synthetic rating","t":"синтетический рейтинг","x":"A synthetic rating is inferred from interest coverage."},{"w":"target capital structure","t":"целевая структура капитала","x":"Weights reflect the target capital structure."},{"w":"adjusted present value (APV)","t":"скорректированная приведённая стоимость","x":"APV suits deals with changing leverage."},{"w":"tax shield","t":"налоговый щит","x":"The PV of tax shields is added in APV."},{"w":"financial distress costs","t":"издержки финансовых затруднений","x":"Distress costs offset the tax shield at high leverage."},{"w":"trade-off theory","t":"теория компромисса","x":"The trade-off theory explains optimal leverage."},{"w":"pecking order","t":"теория иерархии финансирования","x":"Under the pecking order, firms issue equity last."},{"w":"signal","t":"сигнал (рынку)","x":"An equity issue signals that shares are overvalued."},{"w":"deleverage","t":"снижать долговую нагрузку","x":"The company plans to deleverage to 1x."},{"w":"practitioner","t":"практик","x":"Practitioners use 5–6% for the ERP."}]},{"n":7,"title":"DCF: forecast, terminal value and the EV bridge","short":"Шаги DCF, два метода терминальной стоимости и подразумеваемый g, полный мост EV → Equity с долгоподобными статьями, чувствительность и проверки","level":"C1","unit":2,"min":8,"id":"dcf","theory":"> **In one minute.** Forecast FCFF, free cash flow to the firm (свободный денежный поток для всех инвесторов), for 5–10 years, discount at WACC (средневзвешенная стоимость капитала), add the present value of terminal value (терминальная стоимость), get enterprise value, EV (стоимость предприятия). Subtract net debt and debt-like items, add non-operating assets, divide by diluted shares. Show a sensitivity grid (таблица чувствительности), never a single number. Terminal value is 60–80% of EV, so the cross-check of g, the perpetual growth rate (темп роста в бессрочном периоде), against the exit multiple is the most important step.\n\n## Steps\n\n```f\n1. Drivers: revenue (volume × price), margins, capex, NWC days, tax\n2. FCFF_t = EBIT_t × (1 − t) + D&A_t − Capex_t − ΔNWC_t\n3. WACC (Topic 6)\n4. TV_n = FCFF_n × (1 + g) / (WACC − g)      — perpetuity growth\n   TV_n = EBITDA_n × exit EV/EBITDA           — exit multiple\n5. EV = Σ FCFF_t × DF_t + TV_n × DF_n          (mid-year convention for flows)\n6. Equity value = EV − net debt − debt-like + non-operating assets\n7. Price = Equity value / diluted shares; sensitivity WACC × g\n```\n\nD&A is depreciation and amortisation (амортизация), NWC — net working capital (оборотный капитал), TV — terminal value, DF — discount factor (коэффициент дисконтирования).\n\n## Terminal value: two methods and the cross-check\n\nPerpetuity growth (бессрочный рост): g ≤ long-run nominal GDP growth (рост номинального ВВП); for rouble models 3–4%, for dollar 2–3%. The terminal year must be normalised (нормализован): capex ≈ D&A × (1 + g), NWC growing with revenue, margins at mid-cycle (среднециклические).\n\nExit multiple (выходной мультипликатор): current peer EV/EBITDA, often haircut (с дисконтом) because multiples at the end of a forecast are unknown. Always compute the implied values (подразумеваемые значения):\n\n```f\nImplied g from a multiple:  g = (TV × WACC − FCFF_n) / (TV + FCFF_n)\nImplied multiple from g:    TV / EBITDA_n\n```\n\nIf the exit multiple implies g = 8%, the multiple is too high. If the Gordon TV (терминальная стоимость по модели Гордона) implies 12x EBITDA for a 6x sector, g or margins are too high.\n\nFinite-life assets (конечные активы): mines, oil fields, concessions (концессии) get no TV; model to the end of reserves (life of mine, срок отработки запасов) plus closure and reclamation costs (затраты на закрытие и рекультивацию).\n\n## The EV → Equity bridge\n\n```f\nEquity value = EV\n  − Gross debt (loans, bonds)\n  + Cash and equivalents (less restricted / trapped cash)\n  − Lease liabilities (if EBITDA is post-IFRS 16)\n  − Preferred shares\n  − Minority interest (NCI) at market or book value\n  − Pension deficit, decommissioning provisions, litigation provisions\n  − Earn-outs and deferred consideration\n  + Associates and JVs (equity-accounted, not in EBITDA)\n  + Non-core assets, financial investments\n```\n\nNCI is non-controlling interest (неконтролирующая доля), JVs are joint ventures (совместные предприятия).\n\nConsistency rule: whatever is excluded from FCFF must be added or subtracted in the bridge, and vice versa. Price per share uses diluted shares via the treasury stock method (Topic 2).\n\n## Sensitivity and scenarios\n\nTwo-way table (двумерная таблица): WACC ± 1pp (percentage point, процентный пункт) in rows, g or exit multiple in columns. Then operating sensitivities: commodity price, FX (валютный курс), margin, capex. Scenarios (сценарии): base, bull (оптимистичный), bear (пессимистичный), each with its own driver set. The output is a range (диапазон) on the football field (диаграмма «футбольное поле») next to trading comps (сравнимые публичные компании) and precedent transactions (сделки‑аналоги).\n\n## Sanity checks\n\n- TV share of EV above 85% → forecast too short or g too high.\n- Implied EV/EBITDA and P/E versus peers.\n- ROIC (return on invested capital, рентабельность инвестированного капитала) in the terminal year versus WACC: a perpetual ROIC far above WACC is a strong claim.\n- FCFF margin trend: should converge (сходиться) to history or peers.\n- Revenue CAGR, compound annual growth rate (среднегодовой темп роста), versus market growth: market share (доля рынка) implied.\n- Currency: rouble flows, rouble WACC, rouble net debt; dollar debt converted at the spot rate (спотовый курс).\n\n## DCF variants\n\nFCFE / DDM (free cash flow to equity / dividend discount model — поток для акционеров / модель дисконтирования дивидендов) for banks and insurers (debt is raw material, not financing, so no EV). APV (adjusted present value, скорректированная приведённая стоимость) when leverage changes (LBO, leveraged buyout — покупка компании в долг). Sum-of-the-parts, SOTP (оценка по частям) for conglomerates: value each segment (сегмент) by its own method, subtract corporate costs (корпоративные расходы) and apply a conglomerate discount (дисконт конгломерата) if the market does.","words":[{"w":"driver","t":"драйвер (ключевая переменная)","x":"Volume and price are the revenue drivers."},{"w":"explicit forecast period","t":"прогнозный период","x":"The explicit forecast period is seven years."},{"w":"perpetuity growth method","t":"метод бессрочного роста","x":"The perpetuity growth method assumes g of 3%."},{"w":"exit multiple method","t":"метод выходного мультипликатора","x":"The exit multiple method uses 6x EBITDA."},{"w":"implied growth / implied multiple","t":"подразумеваемый рост / мультипликатор","x":"The implied growth rate of 8% is unrealistic."},{"w":"normalised terminal year","t":"нормализованный терминальный год","x":"Capex equals D&A in the normalised terminal year."},{"w":"mid-cycle margin","t":"среднециклическая маржа","x":"Use mid-cycle margins for a steelmaker."},{"w":"finite-life asset","t":"актив с конечным сроком жизни","x":"A mine is a finite-life asset with no terminal value."},{"w":"life of mine","t":"срок отработки запасов","x":"The model runs to the end of the life of mine."},{"w":"reclamation costs","t":"затраты на рекультивацию","x":"Reclamation costs are deducted at closure."},{"w":"EV-to-equity bridge","t":"мост от EV к стоимости акций","x":"Lease liabilities sit in the EV-to-equity bridge."},{"w":"deferred consideration","t":"отложенный платёж (за покупку)","x":"Deferred consideration is a debt-like item."},{"w":"equity-accounted","t":"учитываемый по методу долевого участия","x":"Associates are equity-accounted and added separately."},{"w":"two-way sensitivity table","t":"двумерная таблица чувствительности","x":"The two-way table shows WACC against g."},{"w":"range","t":"диапазон, «вилка»","x":"Present a range, not a point estimate."},{"w":"sanity check","t":"проверка на здравый смысл","x":"The implied multiple is a sanity check."},{"w":"converge","t":"сходиться","x":"Margins converge to peer levels by year five."},{"w":"CAGR","t":"среднегодовой темп роста","x":"Revenue CAGR of 12% implies share gains."},{"w":"sum-of-the-parts (SOTP)","t":"оценка по частям","x":"The holding is valued on a sum-of-the-parts basis."},{"w":"conglomerate discount","t":"дисконт конгломерата","x":"A 20% conglomerate discount is applied to SOTP."}]},{"n":8,"title":"Multiples, trading comps and precedent transactions","short":"Согласованность числителя и знаменателя, LTM/NTM и календаризация, выбор аналогов, нормализация, премия за контроль, football field","level":"B2","unit":2,"min":8,"id":"multiples-comps","theory":"> **In one minute.** A multiple (мультипликатор) is value divided by a metric. EV, enterprise value (стоимость бизнеса), goes with pre-interest metrics (revenue, EBITDA, EBIT); equity value (стоимость акционерного капитала) goes with post-interest metrics (net income, book equity). Trading comps (сопоставимые публичные компании) give the market's price for a minority stake; precedent transactions (прошлые сделки) include a control premium (премия за контроль). Multiples are a compressed DCF (discounted cash flow, модель дисконтированных денежных потоков): high growth and low risk mean a high multiple.\n\n## Consistency\n\n```f\nEV / Revenue, EV / EBITDA, EV / EBIT, EV / capacity   — numerator: EV (all capital providers)\nP / E, P / B, P / FCFE, dividend yield                 — numerator: equity value\nWrong: EV / Net income, Price / EBITDA\nEV = Market cap (diluted) + Net debt + NCI + Preferred − Associates\n```\n\nNCI is non-controlling interest (неконтролирующая доля); associates (ассоциированные компании) are subtracted because their profit is not in EBITDA.\n\nIf EBITDA is post-IFRS 16 (МСФО 16), EV must include lease liabilities. If EBITDA excludes associates, their value is excluded from EV. Same rule for pensions and other debt-like items.\n\n## Choosing and calendarising metrics\n\nLTM (last twelve months, за последние 12 месяцев): last annual + current YTD (year to date, с начала года) − prior YTD. NTM / forward (прогнозные): consensus (консенсус-прогноз) for the next 12 months. Calendarisation (календаризация): align peers with different fiscal year ends (конец финансового года). Normalise (нормализовать) EBITDA and net income for one-offs; use diluted shares; convert currencies at the same date.\n\n## Peer selection\n\nCriteria: industry and business model, size, geography, growth, margins, capital intensity (капиталоёмкость), accounting standards. Five to ten names. Exclude peers in distress, in a takeover, or with negative metrics. Report median (медиана) and interquartile range (межквартильный размах), not the mean (среднее), to limit outliers (выбросы).\n\n## What drives a multiple\n\n```f\nFrom Gordon:  P/E ≈ Payout / (Ke − g);   EV/EBITDA ≈ (1 − t)(1 − reinvestment rate) / (WACC − g) × (EBIT/EBITDA)\n```\n\nHere Ke is the cost of equity (стоимость собственного капитала), g the long-term growth rate, t the tax rate, and the reinvestment rate (доля реинвестирования) is the share of NOPAT spent on capex and working capital.\n\nSo compare multiples with growth and returns: PEG (price/earnings to growth) = P/E / growth; \"EV/EBITDA versus EBITDA growth\" scatter. A premium (премия) to peers needs a reason: higher growth, higher ROIC (return on invested capital, рентабельность инвестированного капитала), lower risk, better governance (корпоративное управление). A discount (дисконт) can be a sanctions, liquidity, free-float (доля акций в свободном обращении) or governance discount; Russian equities trade at a steep discount to EM (emerging markets, развивающиеся рынки) peers for all four.\n\n## Industry-specific multiples\n\n| Sector | Multiples |\n|---|---|\n| Banks, insurers | P/E, P/B, P/TBV (к материальному капиталу), ROE (return on equity, рентабельность капитала) vs P/B |\n| Oil and gas, mining | EV/EBITDA, EV/reserves (к запасам), EV/production, EV/2P (proved + probable reserves, доказанные и вероятные запасы) |\n| Retail | EV/EBITDA(R), EV/Sales, sales per square metre |\n| Telecom, utilities | EV/EBITDA, EV/subscriber, EV/MW or EV/RAB (регулируемая база активов) |\n| Tech, SaaS (software as a service, ПО по подписке) | EV/Sales, EV/ARR (annual recurring revenue, годовая повторяющаяся выручка), Rule of 40 (правило 40: рост выручки + маржа ≥ 40%) |\n| Real estate | P/NAV (к чистой стоимости активов), cap rate (ставка капитализации) |\n\n## Trading comps versus precedent transactions\n\n| | Trading comps | Precedent transactions |\n|---|---|---|\n| Price reflects | Minority stake, liquid market, today | Control, synergies, deal conditions, past dates |\n| Level | Lower | Higher by control premium of 20–40% |\n| Data | Public, current | Deal terms often undisclosed |\n| Use | Fair market value, IPO (initial public offering, первичное размещение) pricing | M&A (mergers and acquisitions, слияния и поглощения), fairness opinions (заключение о справедливости цены) |\n\nFor precedent deals, note the date (the cycle), the buyer type (strategic vs financial), the stake (control or minority), payment form (cash or stock) and whether synergies were priced.\n\n## Pitfalls\n\n- Peak-cycle earnings make cyclicals look cheap; use mid-cycle or EV/capacity.\n- Negative or tiny earnings → P/E meaningless; move up the P&L (ОФР) to EBITDA or sales.\n- Different accounting: capitalised costs, IFRS 16, revenue gross vs net.\n- Stale market data; pre-announcement prices for targets (unaffected price, цена до объявления).\n- Multiples of controlled companies with low free float are not clean references.\n\n## Presentation\n\nFootball field: horizontal bars for each method — 52-week range (диапазон за 52 недели), analyst targets, trading comps (25th–75th percentile), precedents, DCF (WACC × g range), LBO value (LBO, leveraged buyout — цена, которую может заплатить фонд при покупке в долг). The overlap (пересечение) is the defensible range.","words":[{"w":"numerator / denominator consistency","t":"согласованность числителя и знаменателя","x":"Check numerator and denominator consistency before comparing."},{"w":"LTM (last twelve months)","t":"за последние 12 месяцев","x":"LTM EBITDA is 120 billion roubles."},{"w":"NTM (next twelve months)","t":"за следующие 12 месяцев","x":"NTM multiples use consensus forecasts."},{"w":"calendarisation","t":"календаризация","x":"Calendarisation aligns fiscal years."},{"w":"consensus estimate","t":"консенсус-прогноз","x":"The stock trades at 5x consensus EBITDA."},{"w":"capital intensity","t":"капиталоёмкость","x":"Capital intensity differs across peers."},{"w":"interquartile range","t":"межквартильный размах","x":"The interquartile range is 5–7x."},{"w":"premium / discount to peers","t":"премия / дисконт к аналогам","x":"The discount to peers reflects governance risk."},{"w":"PEG ratio","t":"P/E к росту","x":"A PEG below 1 suggests growth is cheap."},{"w":"governance","t":"корпоративное управление","x":"Weak governance justifies a discount."},{"w":"tangible book value (TBV)","t":"материальный балансовый капитал","x":"Banks trade on price to tangible book value."},{"w":"regulated asset base (RAB)","t":"регулируемая база активов","x":"Utilities are valued on EV/RAB."},{"w":"net asset value (NAV)","t":"чистая стоимость активов","x":"REITs trade at a discount to NAV."},{"w":"cap rate","t":"ставка капитализации","x":"A 10% cap rate implies a value of 10x net operating income."},{"w":"minority stake","t":"миноритарный пакет","x":"Trading comps price a minority stake."},{"w":"control premium","t":"премия за контроль","x":"The control premium averaged 30%."},{"w":"fairness opinion","t":"заключение о справедливости цены","x":"The board obtained a fairness opinion."},{"w":"unaffected price","t":"цена до объявления о сделке","x":"The premium is measured to the unaffected price."},{"w":"stale data","t":"устаревшие данные","x":"Stale data distorts the comps."},{"w":"52-week range","t":"диапазон за 52 недели","x":"The offer is above the 52-week range."},{"w":"overlap","t":"пересечение (диапазонов)","x":"The overlap of methods defines the valuation range."}]},{"n":9,"title":"Ratio analysis, ROIC and quality of earnings","short":"Четыре группы коэффициентов, Дюпон, ROIC против WACC и EVA, покрытие и долговая нагрузка, тревожные сигналы в отчётности","level":"B2","unit":2,"min":7,"id":"ratios-analysis","theory":"> **In one minute.** Ratios compare across size and time; they mean nothing without a benchmark (ориентир). The one that matters for value is ROIC, return on invested capital (рентабельность инвестированного капитала), against WACC, the weighted average cost of capital (средневзвешенная стоимость капитала): the spread (спред) times invested capital is EVA (экономическая добавленная стоимость). DuPont analysis (формула Дюпона) shows whether ROE, return on equity (рентабельность капитала), comes from margin, turnover or leverage. Quality-of-earnings checks tell you whether the ratios are real.\n\n## Formulas\n\n```f\nProfitability:  Gross / EBITDA / EBIT / Net margin = line / Revenue\n                ROE = NI / avg Equity;  ROA = NI / avg Assets\n                ROIC = NOPAT / (Net debt + Equity) = NOPAT / Invested capital\n                EVA = (ROIC − WACC) × Invested capital\nDuPont:         ROE = NI/Revenue × Revenue/Assets × Assets/Equity\n                     (margin)      (turnover)       (equity multiplier)\nLeverage:       Net debt / EBITDA;  Debt / Equity;  Debt / Capital\nCoverage:       EBIT / Interest;  EBITDA / Interest;  DSCR = CFADS / (Interest + Principal)\nLiquidity:      Current ratio;  Quick ratio;  Cash ratio\nEfficiency:     Asset turnover;  DSO, DIO, DPO;  CCC\nMarket:         P/E;  EV/EBITDA;  Dividend yield;  Payout = DPS / EPS\n```\n\nNI is net income (чистая прибыль), ROA — return on assets (рентабельность активов), NOPAT — net operating profit after tax (операционная прибыль после налогов), DSCR — debt service coverage ratio (коэффициент покрытия обслуживания долга), CFADS — cash flow available for debt service, DSO/DIO/DPO — days of receivables, inventory and payables, CCC — cash conversion cycle (цикл оборота денег), DPS and EPS — dividend and earnings per share (дивиденд и прибыль на акцию).\n\n## ROIC: the value ratio\n\nROIC uses NOPAT (EBIT × (1 − t)) over invested capital (инвестированный капитал) = net debt + equity, or equivalently operating assets − operating liabilities. Exclude excess cash and non-operating assets; decide consistently on goodwill (with goodwill shows returns on acquisitions, without it shows operating economics). Value is created only when ROIC > WACC; growth with ROIC < WACC destroys value faster. Interview line: \"Growth is worth paying for only when returns exceed the cost of capital.\"\n\n## DuPont in practice\n\n| Business | Margin | Turnover | Leverage | ROE source |\n|---|---|---|---|---|\n| Grocery retail | Low | High | Moderate | Turnover |\n| Luxury, software | High | Low | Low | Margin |\n| Banks | Thin | Low | Very high | Leverage |\n\nA rising ROE driven only by the equity multiplier is risk, not performance. Five-step DuPont separates tax burden (NI/EBT) and interest burden (EBT/EBIT).\n\n## Leverage and coverage\n\nNet debt / EBITDA: < 1x conservative, 2–3x normal, > 4x stressed, with sector context (regulated utilities carry 4–5x; miners target < 1.5x). Interest coverage below 1.5–2x signals distress (финансовые трудности); rating agencies (рейтинговые агентства) map FFO/Debt (funds from operations to debt) and coverage to ratings. DSCR (покрытие обслуживания долга) is the project-finance (проектное финансирование) test: cash available for debt service, CFADS, over interest plus principal; lenders require ≥ 1.2–1.3x.\n\n## Efficiency and working capital\n\nDSO, DIO, DPO and the cash conversion cycle (Topic 3). Asset turnover (оборачиваемость активов) falls when a company builds capacity ahead of demand; capex / D&A above 1.5x for years means heavy investment, watch whether revenue follows.\n\n## Quality of earnings: red flags\n\n- Receivables or inventory growing faster than revenue for 2+ years.\n- CFO (operating cash flow, операционный денежный поток) persistently below net income; cash conversion < 60%.\n- Rising capitalised costs (development, interest), extended depreciation lives.\n- \"Adjusted\" EBITDA diverging from reported; recurring \"one-offs\".\n- Large related-party sales (продажи связанным сторонам) or receivables.\n- Auditor change, qualified opinion (аудиторское заключение с оговоркой), late filings (задержка отчётности).\n- Off-balance-sheet financing: factoring, guarantees, take-or-pay.\n- Gains on revaluation (переоценка) or disposals supporting net income.\n\n## How to present ratio analysis\n\nThree to five years of history, peer median, one line per conclusion: \"Leverage rose to 3.2x on debt-funded capex; coverage still 4x; working capital days stable; FCF (free cash flow, свободный денежный поток) turns positive in 2027 as capex normalises.\" Numbers without a sentence are not analysis.","words":[{"w":"return on invested capital (ROIC)","t":"рентабельность инвестированного капитала","x":"ROIC of 18% exceeds a 13% WACC."},{"w":"invested capital","t":"инвестированный капитал","x":"Invested capital equals net debt plus equity."},{"w":"economic value added (EVA)","t":"экономическая добавленная стоимость","x":"EVA turned positive as returns improved."},{"w":"spread (ROIC − WACC)","t":"спред доходности над стоимостью капитала","x":"A positive spread justifies growth."},{"w":"equity multiplier","t":"мультипликатор капитала","x":"Banks have an equity multiplier above 10."},{"w":"tax burden / interest burden","t":"налоговая / процентная нагрузка","x":"Five-step DuPont isolates the interest burden."},{"w":"interest coverage","t":"покрытие процентов","x":"Interest coverage of 1.5x is a warning."},{"w":"CFADS","t":"денежный поток, доступный для обслуживания долга","x":"DSCR divides CFADS by debt service."},{"w":"debt service","t":"обслуживание долга","x":"Debt service includes interest and principal."},{"w":"rating agency","t":"рейтинговое агентство","x":"The rating agency downgraded the issuer."},{"w":"FFO (funds from operations)","t":"операционные средства (метрика рейтинговых агентств)","x":"S&P looks at FFO to debt."},{"w":"asset turnover","t":"оборачиваемость активов","x":"Asset turnover fell during the capex programme."},{"w":"ahead of demand","t":"с опережением спроса","x":"Capacity was built ahead of demand."},{"w":"red flag","t":"тревожный сигнал","x":"Rising related-party receivables are a red flag."},{"w":"qualified opinion","t":"аудиторское заключение с оговоркой","x":"The auditor issued a qualified opinion."},{"w":"late filing","t":"задержка публикации отчётности","x":"A late filing alarmed investors."},{"w":"revaluation gain","t":"доход от переоценки","x":"Net income was supported by revaluation gains."},{"w":"peer median","t":"медиана по аналогам","x":"Margins are above the peer median."},{"w":"benchmark","t":"ориентир","x":"Use last year and peers as benchmarks."},{"w":"distress","t":"финансовые трудности","x":"Coverage below 1x signals distress."}]},{"n":10,"title":"Building a three-statement model","short":"Драйверы прогноза, расписания долга и амортизации, циркулярность, балансировка через revolver и cash sweep, проверки и сценарии в Excel","level":"C1","unit":2,"min":8,"id":"three-statement-model","theory":"> **In one minute.** A three-statement model (модель трёх отчётов) forecasts the income statement, balance sheet and cash flow statement so that they tie (сходятся): the cash from the CFS, the cash flow statement (ОДДС), equals cash on the balance sheet and assets equal liabilities plus equity in every year. Drivers (драйверы) sit on one assumptions sheet (лист предпосылок), schedules (расписания) compute debt, D&A, depreciation and amortisation (амортизация), and NWC, net working capital (оборотный капитал), and a revolver (возобновляемая кредитная линия) balances the sheet.\n\n## Layout\n\n```f\nAssumptions → Income statement → Balance sheet → Cash flow statement\nSchedules: D&A and capex (PP&E roll-forward), NWC (days), debt (tranches, interest, repayments),\n           equity (dividends, buybacks), tax (NOLs), leases\nChecks: BS balance = 0; cash CFS = cash BS; debt schedule = BS debt; no negative cash\n```\n\nPP&E is property, plant and equipment (основные средства), NOLs are net operating losses (налоговые убытки к переносу), BS is the balance sheet.\n\nConventions: inputs in blue, formulas in black, links in green; one formula per row across years; no hard-coded numbers (жёстко прописанные числа) inside formulas; historical columns to the left of forecast; units stated.\n\n## Drivers\n\n- **Revenue:** volume × price, or segment growth; tie to capacity and market.\n- **Costs:** % of revenue for variable (переменные), fixed (постоянные) grown with inflation; split COGS, the cost of goods sold (себестоимость), and opex, operating expenses (операционные расходы).\n- **NWC:** DSO, DIO, DPO (days of receivables, inventory and payables — дни оборота дебиторки, запасов и кредиторки) applied to revenue and COGS.\n- **Capex and D&A:** capex as % of revenue or project list; D&A from the PP&E roll-forward (движение основных средств): opening + capex − D&A = closing; D&A = opening PP&E / useful life + new capex / life × ½.\n- **Tax:** statutory rate on EBT (earnings before tax, прибыль до налогообложения), adjusted for NOLs (перенос убытков) and non-deductibles; deferred tax if needed.\n- **Debt:** tranches (транши) with rate, maturity, amortisation (график погашения); interest on average balance.\n- **Dividends:** payout ratio or policy formula.\n\n## Balancing the model\n\nCash is the plug (балансирующая статья) through the cash flow statement; it must never be forced. Minimum cash (минимальный остаток) is an assumption; if forecast cash falls below it, the revolver draws; if cash is above it, the revolver repays or a cash sweep (досрочное погашение из избытка денег) pays down term debt (срочный кредит).\n\n```f\nRevolver draw = MAX(0, Min cash − Cash before revolver)\nRevolver repayment = MIN(Revolver balance, MAX(0, Cash before revolver − Min cash))\n```\n\n## Circularity\n\nInterest depends on average debt, debt depends on cash, cash depends on interest: a circular reference (циклическая ссылка). Options: enable iterative calculation (итеративные вычисления) with a circuit breaker switch (переключатель-предохранитель) that sets interest to opening balance when the model blows up; or compute interest on opening balances and accept the simplification.\n\n## Checks and error traps\n\n- Balance check row: Assets − Liabilities − Equity = 0 in all years, conditional formatting.\n- Cash tie: closing cash CFS = BS cash.\n- Debt tie: schedule balances = BS debt by tranche.\n- Signs: capex negative in CFI (investing cash flow, инвестиционный поток), D&A positive add-back, ΔNWC sign.\n- Sanity: margins, NWC days, capex/D&A, leverage within plausible ranges; TV (terminal value, терминальная стоимость) share.\n- Use IFERROR sparingly; errors should be visible, not hidden.\n\n## Scenarios and sensitivity\n\nScenario switch (переключатель сценариев) via CHOOSE or INDEX on the assumptions sheet: base, upside (оптимистичный), downside (пессимистичный). Data tables (таблицы данных, What-If) for two-way sensitivities; they slow the model, so keep them on a separate sheet. Goal Seek (подбор параметра) for break-even (точка безубыточности) questions: what revenue decline breaches the covenant (ковенант, условие кредитного договора)?\n\n## Excel vocabulary\n\nWorkbook (книга), worksheet / tab (лист), cell reference (ссылка на ячейку), absolute reference with $ (абсолютная ссылка), named range (именованный диапазон), lookup (INDEX/MATCH, XLOOKUP; ПОИСКПОЗ, ПРОСМОТРX), SUMPRODUCT (СУММПРОИЗВ), EOMONTH (КОНМЕСЯЦА), OFFSET (СМЕЩ), roll-forward (движение остатка: opening → closing), toggle (переключатель), flag (флаг 0/1), timeline (временная шкала).","words":[{"w":"three-statement model","t":"модель трёх отчётов","x":"The three-statement model ties in every year."},{"w":"tie (out)","t":"сходиться, увязываться","x":"The cash flow ties to the balance sheet."},{"w":"assumptions sheet","t":"лист предпосылок","x":"All inputs live on the assumptions sheet."},{"w":"schedule","t":"расписание (вспомогательный расчёт)","x":"The debt schedule computes interest by tranche."},{"w":"roll-forward","t":"движение остатка (начало → конец периода)","x":"The PP&E roll-forward drives depreciation."},{"w":"hard-coded number","t":"жёстко прописанное число","x":"Avoid hard-coded numbers inside formulas."},{"w":"variable / fixed costs","t":"переменные / постоянные затраты","x":"Fixed costs grow with inflation, variable with volume."},{"w":"useful life","t":"срок полезного использования","x":"Equipment is depreciated over a ten-year useful life."},{"w":"net operating loss (NOL)","t":"налоговый убыток к переносу","x":"NOLs shield taxable income for three years."},{"w":"tranche","t":"транш","x":"The senior tranche amortises 10% a year."},{"w":"amortisation schedule","t":"график погашения","x":"The amortisation schedule is back-ended."},{"w":"plug","t":"балансирующая статья","x":"Cash is the plug through the cash flow statement."},{"w":"minimum cash balance","t":"минимальный остаток денежных средств","x":"Minimum cash is set at 5% of revenue."},{"w":"revolver (revolving credit facility)","t":"возобновляемая кредитная линия","x":"The revolver draws when cash falls below the minimum."},{"w":"cash sweep","t":"досрочное погашение из избытка денег","x":"A 50% cash sweep repays the term loan early."},{"w":"circular reference","t":"циклическая ссылка","x":"Interest on average debt creates a circular reference."},{"w":"iterative calculation","t":"итеративные вычисления","x":"Enable iterative calculation to resolve the circularity."},{"w":"circuit breaker","t":"переключатель-предохранитель","x":"A circuit breaker stops the model from blowing up."},{"w":"scenario switch","t":"переключатель сценариев","x":"The scenario switch selects base, upside or downside."},{"w":"data table","t":"таблица данных (анализ «что если»)","x":"A data table shows price sensitivity to WACC and g."},{"w":"Goal Seek","t":"подбор параметра","x":"Use Goal Seek to find the break-even price."},{"w":"conditional formatting","t":"условное форматирование","x":"Conditional formatting flags a non-zero balance check."}]},{"n":11,"title":"Bonds, yields, duration and credit","short":"Цена и доходность, YTM и текущая доходность, дюрация и выпуклость, кредитный спред и рейтинги, кривая доходности, типы ОФЗ, НКД","level":"B2","unit":3,"min":8,"id":"bonds-rates","theory":"> **In one minute.** Price and yield move inversely (в противоположных направлениях). YTM, yield to maturity (доходность к погашению), is the IRR, internal rate of return (внутренняя норма доходности), of the bond's cash flows. Duration (дюрация) is the price sensitivity to yield: ΔP/P ≈ −D_mod × Δy, where D_mod is modified duration (модифицированная дюрация). Credit spread (кредитный спред) over the risk-free curve prices default risk; ratings map it. The yield curve (кривая доходности) shows the market's path for the policy rate (ключевая ставка центрального банка).\n\n## Pricing\n\n```f\nP = Σ C / (1 + y)^t + F / (1 + y)^n          C = coupon, F = face value, y = YTM per period\nCurrent yield = C / P\nPrice < 100 → trades at a discount (ниже номинала); > 100 → at a premium\nDirty price = Clean price + Accrued interest (НКД)\nAccrued = C × days since last coupon / days in coupon period\n```\n\nZero-coupon bonds (бескупонные): P = F / (1 + y)^n; duration = maturity.\n\n## Duration and convexity\n\n```f\nMacaulay duration D = Σ t × PV(CF_t) / P                (years)\nModified duration D_mod = D / (1 + y)\nΔP / P ≈ −D_mod × Δy + ½ × Convexity × Δy²\nDV01 (PVBP) = price change per 1 bp = D_mod × P × 0.0001\n```\n\nDV01 (dollar value of one basis point) and PVBP (price value of a basis point) are the same measure; 1 bp, one basis point (базисный пункт), is 0.01%.\n\nLonger maturity and lower coupon → higher duration. A 10-year OFZ (ОФЗ, облигации федерального займа) with D_mod ≈ 6 loses about 6% if yields rise 100 bp. Convexity (выпуклость) is positive for plain bonds: prices rise more when yields fall than they drop when yields rise. Floaters (флоатеры) have duration close to the next reset date, so they protect against rising rates.\n\n## Credit\n\n```f\nYield = Risk-free (same maturity) + Credit spread (bp) [+ liquidity premium]\nExpected loss = PD × LGD × EAD    (probability of default × loss given default × exposure at default: вероятность дефолта × потери при дефолте × сумма под риском)\n```\n\nRatings: AAA–BBB− investment grade (инвестиционный уровень), BB+ and below high yield (высокодоходные). Russian scale: ACRA (АКРА), Expert RA (Эксперт РА), NCR (НКР), NRA (НРА) from AAA(RU) down. A downgrade (понижение) widens spreads; a fallen angel (падший ангел) crosses below investment grade and forces index-driven selling. Covenants (ковенанты), seniority (старшинство) and security (обеспечение) determine LGD (Topic 17).\n\nGovernment bonds: OFZ-PD fixed coupon (ОФЗ‑ПД, постоянный купон), OFZ-PK floater linked to RUONIA, the rouble overnight index average (ОФЗ‑ПК, переменный купон), OFZ-IN inflation-linked (ОФЗ‑ИН, индексируемый номинал), OFZ-AD amortising (ОФЗ‑АД, амортизация долга). Corporate: fixed, floaters tied to key rate or RUONIA, replacement bonds (замещающие облигации) that replaced Eurobonds (еврооблигации), yuan bonds. Put via offer (оферта): the investor may redeem early at a set date; call (колл): the issuer may.\n\n## Yield curve\n\nTerm structure (временная структура ставок): yield against maturity for one issuer. Normal (upward), flat, inverted (инвертированная). Theories: expectations (ожидания будущих коротких ставок), liquidity premium (премия за срок), segmentation. An inverted curve means the market expects cuts: Russia 2024–2025 with short OFZ above long. Steepening (увеличение наклона) and flattening (выравнивание) are traded through curve positions. RGBI (Russian Government Bond Index, индекс гособлигаций Мосбиржи) tracks OFZ prices.\n\n## Bond math for the desk\n\n- Breakeven inflation (вменённая инфляция) = nominal yield − linker (облигация с индексируемым номиналом) real yield.\n- Carry and roll-down (кэрри и скатывание по кривой): the return from holding a bond as it ages down a steep curve.\n- Reinvestment risk (риск реинвестирования) vs price risk: they offset at the horizon equal to duration (immunisation, иммунизация).\n- Yield to call / yield to put / yield to worst (доходность к худшему) for bonds with options.\n- Repo (репо) funds bond positions; the repo rate versus the coupon gives positive or negative carry.\n\n## Reading a bond headline\n\n\"Issuer placed a 3-year bond at 15.5%, 150 bp over OFZ, book covered 2x, duration 2.4.\" \"OFZ curve bull-steepened (ралли на коротком конце) after the dovish statement (мягкий сигнал ЦБ о снижении ставки).\" \"Spreads tightened (сузились) 40 bp.\"","words":[{"w":"yield to maturity (YTM)","t":"доходность к погашению","x":"YTM is the bond's internal rate of return."},{"w":"current yield","t":"текущая доходность","x":"Current yield ignores the pull to par."},{"w":"pull to par","t":"подтягивание цены к номиналу","x":"Pull to par lifts a discount bond as it nears maturity."},{"w":"clean / dirty price","t":"чистая / грязная цена","x":"The dirty price includes accrued interest."},{"w":"accrued interest","t":"накопленный купонный доход (НКД)","x":"Accrued interest is paid to the seller."},{"w":"modified duration","t":"модифицированная дюрация","x":"Modified duration of 6 means a 6% loss per 100 bp."},{"w":"convexity","t":"выпуклость","x":"Convexity makes long bonds gain more than they lose."},{"w":"DV01","t":"изменение цены на 1 б.п.","x":"The position's DV01 is 2 million roubles."},{"w":"credit spread","t":"кредитный спред","x":"Credit spreads tightened after the upgrade."},{"w":"probability of default (PD)","t":"вероятность дефолта","x":"PD rises as coverage falls."},{"w":"loss given default (LGD)","t":"потери при дефолте","x":"Secured bonds have lower LGD."},{"w":"fallen angel","t":"«падший ангел»","x":"Fallen angels are sold by investment-grade funds."},{"w":"floating-rate note (floater)","t":"флоатер","x":"Floaters reset to RUONIA plus a spread."},{"w":"inflation-linked bond (linker)","t":"облигация с индексируемым номиналом","x":"Linkers hedge inflation risk."},{"w":"put option / offer","t":"оферта (право досрочного погашения)","x":"The bond has a put via offer in two years."},{"w":"steepening / flattening","t":"увеличение / уменьшение наклона кривой","x":"The curve steepened on supply concerns."},{"w":"breakeven inflation","t":"вменённая (безубыточная) инфляция","x":"Breakeven inflation is 6%."},{"w":"carry and roll-down","t":"кэрри и скатывание по кривой","x":"Carry and roll-down add 2% a year."},{"w":"yield to worst","t":"доходность к худшему","x":"Quote yield to worst for callable bonds."},{"w":"immunisation","t":"иммунизация (портфеля облигаций)","x":"Immunisation matches duration to the horizon."},{"w":"book covered 2x","t":"книга заявок переподписана в 2 раза","x":"The book was covered 2x within an hour."}]},{"n":12,"title":"Equity markets and ECM: IPO, SPO, dividends and buybacks","short":"Процесс IPO от выбора банков до стабилизации, сбор заявок и ценообразование, greenshoe и lock-up, SPO и ABB, дивидендные даты и байбэк, индексы и free flo
