at","level":"B2","unit":3,"min":8,"id":"equity-markets-ecm","theory":"> **In one minute.** Equity capital markets (ECM, рынок акционерного капитала) are how companies sell shares: IPO, initial public offering (первичное размещение), and follow-on deals (вторичные размещения: SPO, ABB, rights issue — see the table below). Banks run bookbuilding (сбор заявок), set the price, stabilise (стабилизируют) with a greenshoe and bind insiders with a lock-up. On the secondary market the stock is valued on free float (доля акций в свободном обращении), liquidity, index weight and the dividend/buyback policy.\n\n## IPO process\n\n```f\n1. Beauty parade (конкурс банков) → mandate: global coordinators, bookrunners, co-managers\n2. Due diligence (комплексная проверка), prospectus (проспект), audited IFRS (МСФО) accounts for 3 years, corporate restructuring\n3. Analyst presentation → pre-deal investor education (PDIE), early-look meetings\n4. Price range (ценовой диапазон) set; roadshow (роуд-шоу) 1–2 weeks; bookbuilding\n5. Pricing (определение цены): demand, quality of the book, allocation (аллокация)\n6. Listing (листинг) and first day of trading; stabilisation up to 30 days; lock-up 90–180 days\n```\n\nPrimary shares (новые акции) bring cash to the company (cash-in); secondary shares (существующие акции) are sold by shareholders (cash-out). The offer size, free float after the deal and the use of proceeds (использование средств) are in the prospectus. Underwriting (андеррайтинг): firm commitment (гарантированное размещение) versus best efforts (без гарантии).\n\n## Pricing mechanics\n\n- Book covered 3x (книга переподписана в 3 раза) means demand is three times the offer; oversubscription (переподписка) lets banks price at the top of the range and allocate selectively to long-only investors (долгосрочные инвесторы) over hedge funds.\n- IPO discount (дисконт при IPO) to fair value of 10–20% to ensure aftermarket performance (динамика после размещения).\n- Greenshoe / over-allotment option (опцион доразмещения) of 10–15%: the stabilising manager sells extra shares and buys them back if the price falls, supporting the price.\n- Cornerstone / anchor investors (якорные инвесторы) commit before the book opens.\n- Russian specifics since 2023: small deals, retail allocation caps, 50% of the book to retail, Bank of Russia pushing for better disclosure (раскрытие) and allocation rules.\n\n## Follow-on deals\n\n| Deal | What | Speed | Price |\n|---|---|---|---|\n| SPO (secondary public offering) | Existing shareholder sells, prospectus-based | Weeks | Discount 3–8% |\n| ABB / ABO (accelerated bookbuild) | Overnight placement to institutions | Hours | Discount 5–10% |\n| Follow-on (primary) | Company issues new shares | Weeks | Discount, dilution |\n| Rights issue (преимущественное право) | Existing holders buy pro rata, TERP pricing | Weeks | Deep discount |\n| Convertible bond | Debt convertible into shares | Days | Premium to spot |\n| Block trade | Large stake sold to one or few buyers | Hours | Negotiated |\n\nTERP, theoretical ex-rights price (теоретическая цена после отсечения прав) = (old shares × price + new shares × subscription price) / total shares.\n\n## Dividends and buybacks\n\nDates: declaration (объявление), record date (дата закрытия реестра), ex-dividend date (экс-дивидендная дата, one trading day before the record date under T+1 settlement, расчёты на следующий день), payment date (дата выплаты). The stock falls by the dividend on the ex-date: dividend gap (дивидендный гэп); its closing (закрытие гэпа) is a Russian retail obsession. Policy types: % of net income (SOEs, state-owned enterprises — госкомпании: 50% of IFRS net income), % of FCF (free cash flow, свободный денежный поток) with leverage triggers, progressive (прогрессивная, не снижается), special dividends (специальные). Interim (промежуточные) and final (итоговые).\n\nBuyback (обратный выкуп): on-market (на бирже), tender offer at a premium, or via a subsidiary; shares become treasury (казначейские) or quasi-treasury (квазиказначейские, on a subsidiary's balance sheet, keep votes) and may be cancelled (погашены). Buybacks raise EPS (earnings per share, прибыль на акцию) and are tax-efficient (налогово эффективны) versus dividends in many jurisdictions; in Russia dividends carry 13–15% personal tax.\n\n## Market structure facts to quote\n\nMarket cap, free float and free-float-adjusted weight in IMOEX (индекс Мосбиржи); index inclusion (включение в индекс) triggers passive buying; liquidity in average daily volume, ADV (среднедневной объём); turnover velocity (оборачиваемость); shareholder structure (структура акционеров): state, strategic, management, float. Depositary receipts (депозитарные расписки: ADR/GDR — American and global depositary receipts) represent shares abroad; most Russian DRs were converted into local shares after 2022.","words":[{"w":"equity capital markets (ECM)","t":"рынок акционерного капитала","x":"ECM teams run IPOs and follow-ons."},{"w":"global coordinator / bookrunner","t":"глобальный координатор / букраннер","x":"Two bookrunners managed the book."},{"w":"prospectus","t":"проспект эмиссии","x":"The prospectus lists risk factors."},{"w":"price range","t":"ценовой диапазон","x":"The range was set at 300–340 roubles."},{"w":"roadshow","t":"роуд-шоу","x":"Management met investors on a two-week roadshow."},{"w":"bookbuilding","t":"сбор заявок","x":"Bookbuilding closed a day early."},{"w":"allocation","t":"аллокация, распределение акций","x":"Allocation favoured long-only funds."},{"w":"primary / secondary shares","t":"новые / существующие акции","x":"Half of the deal is primary shares."},{"w":"use of proceeds","t":"использование привлечённых средств","x":"Proceeds will fund capex and deleveraging."},{"w":"firm commitment / best efforts","t":"гарантированное размещение / без гарантии","x":"The deal was underwritten on a firm-commitment basis."},{"w":"oversubscription","t":"переподписка","x":"Oversubscription allowed pricing at the top."},{"w":"long-only investor","t":"инвестор без коротких позиций (долгосрочный)","x":"Long-only investors anchor the book."},{"w":"greenshoe (over-allotment option)","t":"опцион доразмещения, «зелёный башмак»","x":"The greenshoe stabilised the price in week one."},{"w":"lock-up","t":"период запрета на продажу","x":"Insiders are under a 180-day lock-up."},{"w":"anchor (cornerstone) investor","t":"якорный инвестор","x":"An anchor investor took 20% of the deal."},{"w":"accelerated bookbuild (ABB)","t":"ускоренный сбор заявок","x":"The stake was sold in an overnight ABB."},{"w":"rights issue","t":"выпуск с преимущественным правом","x":"The rights issue was priced at a 30% discount to TERP."},{"w":"ex-dividend date","t":"экс-дивидендная дата","x":"The stock dropped on the ex-dividend date."},{"w":"dividend gap","t":"дивидендный гэп","x":"The dividend gap closed in ten days."},{"w":"quasi-treasury shares","t":"квазиказначейские акции","x":"Quasi-treasury shares keep voting rights."},{"w":"index inclusion","t":"включение в индекс","x":"Index inclusion brought passive inflows."},{"w":"average daily volume (ADV)","t":"среднедневной объём торгов","x":"ADV is 2 billion roubles."}]},{"n":13,"title":"Derivatives and hedging","short":"Форвардная цена через cost of carry, фьючерсы и маржа, выплаты по опционам, паритет пут-колл, входы Блэка-Шоулза и греки, свопы, хеджирование экспортёра","level":"C1","unit":3,"min":8,"id":"derivatives-hedging","theory":"> **In one minute.** Forwards and futures fix a price; options buy a right for a premium; swaps exchange cash flows. The forward price is spot plus cost of carry (стоимость удержания); an option's value is intrinsic (внутренняя) plus time value (временная), driven by volatility (волатильность). Companies hedge (хеджируют) inputs, outputs, FX (валютный курс) and rates; analysts check hedge accounting (учёт хеджирования) and derivative exposure in the notes.\n\n## Forwards and futures\n\n```f\nForward price:  F = S × (1 + r)^T  (financial asset)\n                F = S × e^((r − q)T)  with yield q;  F = S × (1 + r − y + storage) for commodities\nFX forward:     F = S × (1 + r_RUB)/(1 + r_USD)   — covered interest parity (покрытый паритет ставок)\nContango: F > S;  Backwardation: F < S\n```\n\nS is the spot price (спотовая цена), r the interest rate, T the time to maturity, q the income yield of the asset (e.g. dividend yield), y the convenience yield (выгода от владения товаром).\n\nFutures: exchange-traded, standardised, cleared through a CCP, central counterparty (центральный контрагент), daily mark-to-market (переоценка), initial and variation margin (начальная и вариационная маржа). MOEX (Мосбиржа) futures: Si (USD/RUB), CNY/RUB, RTS index (индекс РТС), Brent, gold, single stocks. Basis (базис) = futures − spot; basis risk (базисный риск) is what remains after a hedge.\n\n## Options\n\n```f\nCall payoff = max(S − K, 0);  Put payoff = max(K − S, 0)   (K = strike)\nPut-call parity: C − P = S − K × e^(−rT)\nPremium = Intrinsic value + Time value\nBlack-Scholes inputs: S, K, T, r, σ (volatility), q\n```\n\nMoneyness: in / at / out of the money (в деньгах / около денег / вне денег). European (исполнение только в дату) vs American (в любой день). Greeks: delta (Δ, sensitivity to S; also hedge ratio), gamma (Γ, change of delta), theta (Θ, time decay, временной распад), vega (ν, sensitivity to σ), rho (ρ, to rates). Implied volatility (подразумеваемая волатильность) is backed out of market prices; the volatility smile/skew (улыбка / перекос волатильности) shows puts priced richer than calls. RVI (Russian Volatility Index) is the MOEX volatility index.\n\nStrategies in a sentence: covered call (покрытый колл: long stock + short call for income), protective put (защитный пут), collar (коллар: put financed by selling a call), straddle (стрэддл: bet on volatility), spread (спред: limit cost and payoff).\n\n## Swaps\n\nInterest rate swap, IRS (процентный своп): pay fixed, receive floating (RUONIA / key rate) or the reverse; converts a floating loan into fixed. Cross-currency swap (валютно-процентный своп): exchange principal and interest in two currencies; used to turn yuan or dollar funding into roubles. CDS (кредитный дефолтный своп): protection buyer pays a spread, receives par minus recovery (стоимость возмещения) on default; the CDS spread is a market view on PD, the probability of default (вероятность дефолта). Total return swap (своп на совокупный доход) replicates ownership without holding the asset.\n\n## Corporate hedging\n\n| Exposure | Instrument | Example |\n|---|---|---|\n| Export revenue in USD | Sell USD forward / buy USD put | Oil company fixes rouble revenue |\n| Input cost | Buy futures / call | Airline locks jet fuel |\n| Floating-rate debt | Pay-fixed IRS / cap (кэп, потолок ставки) | Developer fixes cost of debt |\n| Output price | Sell forward / put, collar | Gold miner sets a floor |\n| Translation of foreign subsidiary | Net investment hedge | Holding with foreign assets |\n\nNatural hedge (естественный хедж): match the currency of debt with the currency of revenue. Hedge ratio (коэффициент хеджирования) is usually 30–70% of expected volumes 12–24 months out. Hedge accounting (учёт хеджирования, IFRS 9) lets gains and losses on the hedge sit in OCI, other comprehensive income (прочий совокупный доход), until the hedged item hits the P&L (ОФР); without it, derivatives create P&L volatility (волатильность прибыли). Mark-to-market of hedges can produce large \"paper\" losses when prices rally: read the notes before judging a quarter.\n\n## Risks the reader should flag\n\nLeverage (плечо) in derivatives; margin calls (требования о довнесении маржи) draining liquidity; counterparty risk (риск контрагента) on OTC, over-the-counter (внебиржевых), contracts with sanctioned or foreign banks; embedded derivatives (встроенные деривативы) in contracts (price formulas with caps and floors); speculative positions disguised as hedges (Barings, Metallgesellschaft, the CDOs of 2008 — collateralised debt obligations, обеспеченные долговые обязательства).","words":[{"w":"cost of carry","t":"стоимость удержания позиции","x":"The forward price equals spot plus cost of carry."},{"w":"covered interest parity","t":"покрытый паритет процентных ставок","x":"FX forwards follow covered interest parity."},{"w":"mark-to-market","t":"переоценка по рынку","x":"Futures are marked to market daily."},{"w":"initial / variation margin","t":"начальная / вариационная маржа","x":"Variation margin was called after the move."},{"w":"basis risk","t":"базисный риск","x":"Basis risk remains after a futures hedge."},{"w":"strike","t":"цена исполнения","x":"The strike is 90 roubles per dollar."},{"w":"payoff","t":"выплата (по опциону)","x":"The call payoff is zero below the strike."},{"w":"put-call parity","t":"паритет пут-колл","x":"Put-call parity links call and put prices."},{"w":"intrinsic / time value","t":"внутренняя / временная стоимость","x":"Time value decays as expiry nears."},{"w":"implied volatility","t":"подразумеваемая волатильность","x":"Implied volatility spiked before the decision."},{"w":"volatility skew","t":"перекос волатильности","x":"The skew shows demand for downside protection."},{"w":"delta hedge","t":"дельта-хеджирование","x":"The desk delta-hedges its option book."},{"w":"covered call / protective put","t":"покрытый колл / защитный пут","x":"A protective put caps the loss."},{"w":"collar","t":"коллар","x":"The miner used a zero-cost collar."},{"w":"interest rate swap (IRS)","t":"процентный своп","x":"The IRS converts floating debt to fixed."},{"w":"cross-currency swap","t":"валютно-процентный своп","x":"A cross-currency swap turned yuan funding into roubles."},{"w":"recovery rate","t":"уровень возмещения при дефолте","x":"CDS pays par minus the recovery rate."},{"w":"cap / floor","t":"потолок / пол (ставки или цены)","x":"The cap limits interest at 18%."},{"w":"natural hedge","t":"естественный хедж","x":"Dollar debt against dollar revenue is a natural hedge."},{"w":"hedge ratio","t":"коэффициент хеджирования","x":"The hedge ratio is 50% of next year's output."},{"w":"hedge accounting","t":"учёт хеджирования","x":"Hedge accounting keeps the swap's fair value in OCI."},{"w":"embedded derivative","t":"встроенный дериватив","x":"The contract contains an embedded derivative."}]},{"n":14,"title":"Portfolio theory and risk measurement","short":"Доходность и волатильность портфеля, корреляция и диверсификация, CAPM и бета, альфа, Шарп/Сортино/IR, VaR и expected shortfall, стресс-тесты, поведенческие ошибки","level":"C1","unit":3,"min":7,"id":"portfolio-risk","theory":"> **In one minute.** Risk is the standard deviation (стандартное отклонение) of returns; diversification (диверсификация) removes idiosyncratic risk (специфический риск), not systematic risk (систематический). CAPM, the capital asset pricing model (модель оценки капитальных активов), prices only beta. Judge managers on risk-adjusted return (доходность с учётом риска): Sharpe, Sortino, information ratio. Banks and funds measure tail risk (хвостовой риск) with VaR, value at risk (стоимостная мера риска), expected shortfall (средние потери за порогом VaR) and stress tests.\n\n## Portfolio math\n\n```f\nE(R_p) = Σ w_i × E(R_i)\nσ_p² = Σ w_i² σ_i² + Σ Σ w_i w_j σ_i σ_j ρ_ij        (two assets: w₁²σ₁² + w₂²σ₂² + 2w₁w₂σ₁σ₂ρ)\nAnnualised σ = σ_daily × √252;  σ_monthly × √12\nβ_i = Cov(R_i, R_m) / σ_m² = ρ_im × σ_i / σ_m\nCAPM: E(R_i) = R_f + β_i × (E(R_m) − R_f)\nAlpha (Jensen) = R_p − [R_f + β_p × (R_m − R_f)]\n```\n\nCorrelation (корреляция) below 1 lowers portfolio variance; the benefit is largest when ρ is low or negative. In crises correlations go to 1 (корреляции стремятся к единице): diversification fails when needed most.\n\n## Efficient frontier and CAPM\n\nMarkowitz: for each risk level there is a maximum-return portfolio; the set is the efficient frontier (граница эффективности). With a risk-free asset the best combination is the tangency portfolio (касательный портфель) on the capital market line (линия рынка капитала); in equilibrium it is the market portfolio. The security market line (линия рынка ценных бумаг) plots expected return against beta; assets above it have positive alpha. Multi-factor models (многофакторные модели: Fama-French size, value, momentum; APT — arbitrage pricing theory, арбитражная теория ценообразования) explain returns that CAPM cannot.\n\n## Risk-adjusted measures\n\n```f\nSharpe = (R_p − R_f) / σ_p\nSortino = (R_p − R_f) / σ_downside\nTreynor = (R_p − R_f) / β_p\nInformation ratio = (R_p − R_benchmark) / Tracking error\nMax drawdown = largest peak-to-trough decline (максимальная просадка)\nCalmar = Annual return / Max drawdown\n```\n\nSharpe above 1 is good for a diversified fund; hedge funds quote Sortino because upside volatility is not a cost. Tracking error (ошибка слежения) is the volatility of active returns (активная доходность); active share (доля активных позиций) measures how different the portfolio is from the index.\n\n## VaR, expected shortfall, stress\n\n```f\nVaR_α,h: loss not exceeded with probability α over horizon h\nParametric VaR (normal): VaR = z_α × σ × √h × Position     (z_99% = 2.33, z_95% = 1.65)\nExpected shortfall (ES, CVaR — conditional VaR) = average loss beyond VaR\n```\n\nMethods: parametric (параметрический), historical simulation (историческое моделирование), Monte Carlo. VaR ignores the tail beyond α; ES fixes that and is the Basel III (Базель III) standard under FRTB, the Fundamental Review of the Trading Book (пересмотр требований к торговой книге). Backtesting (бэктестинг) counts exceptions (превышения): more than expected means the model is wrong. Stress tests (стресс-тесты) and scenario analysis (сценарный анализ) use named shocks: oil −40%, rouble +30%, key rate +500 bp, 2008, 2014, 2022.\n\n## Asset allocation\n\nStrategic asset allocation (стратегическое распределение активов) sets long-run weights by asset class (класс активов): equities, bonds, cash, real estate, commodities, alternatives (private equity, hedge funds, infrastructure). Tactical (тактическое) tilts around them. Rebalancing (ребалансировка) to target weights is a disciplined \"sell high, buy low\". Risk parity (паритет риска) weights by risk contribution, not by capital. Liability-driven investing (LDI, инвестирование под обязательства) matches pension liabilities with duration.\n\n## Behavioural finance in one table\n\n| Bias | Russian | Effect |\n|---|---|---|\n| Loss aversion | неприятие потерь | Hold losers, sell winners (disposition effect, эффект диспозиции) |\n| Overconfidence | самоуверенность | Overtrading, under-diversification |\n| Anchoring | якорение | Fixation on purchase price or round numbers |\n| Herding | стадное поведение | Bubbles, panics |\n| Recency bias | эффект недавнего | Extrapolating the last year |\n| Confirmation bias | склонность к подтверждению | Ignoring contrary evidence |\n\nRules beat willpower: written policy, rebalancing, position limits (лимиты на позиции).","words":[{"w":"standard deviation","t":"стандартное отклонение","x":"Annualised standard deviation is 25%."},{"w":"idiosyncratic (specific) risk","t":"специфический риск","x":"Idiosyncratic risk is diversified away in 30 stocks."},{"w":"systematic risk","t":"систематический риск","x":"Only systematic risk earns a premium under CAPM."},{"w":"correlation","t":"корреляция","x":"Correlations converge to one in a crisis."},{"w":"covariance","t":"ковариация","x":"Beta is covariance over market variance."},{"w":"efficient frontier","t":"граница эффективности","x":"The portfolio lies on the efficient frontier."},{"w":"tangency portfolio","t":"касательный портфель","x":"The tangency portfolio has the highest Sharpe ratio."},{"w":"security market line","t":"линия рынка ценных бумаг","x":"Assets above the security market line have positive alpha."},{"w":"multi-factor model","t":"многофакторная модель","x":"Fama-French is a three-factor model."},{"w":"Sharpe ratio","t":"коэффициент Шарпа","x":"A Sharpe ratio above 1 is strong."},{"w":"Sortino ratio","t":"коэффициент Сортино","x":"Sortino penalises only downside volatility."},{"w":"information ratio","t":"информационный коэффициент","x":"The manager's information ratio is 0.6."},{"w":"tracking error","t":"ошибка слежения","x":"Tracking error is 3% against the index."},{"w":"active share","t":"доля активных позиций","x":"High active share means real stock picking."},{"w":"maximum drawdown","t":"максимальная просадка","x":"Maximum drawdown reached 40% in 2022."},{"w":"value at risk (VaR)","t":"стоимостная мера риска","x":"One-day 99% VaR is 50 million roubles."},{"w":"expected shortfall (ES)","t":"ожидаемые потери за порогом VaR","x":"Expected shortfall captures the tail."},{"w":"backtesting","t":"бэктестинг","x":"Backtesting showed too many exceptions."},{"w":"strategic / tactical allocation","t":"стратегическое / тактическое распределение","x":"Tactical allocation overweights bonds this quarter."},{"w":"risk parity","t":"паритет риска","x":"Risk parity leverages bonds to match equity risk."},{"w":"disposition effect","t":"эффект диспозиции","x":"The disposition effect makes investors sell winners early."},{"w":"position limit","t":"лимит на позицию","x":"Position limits cap single-name exposure at 5%."}]},{"n":15,"title":"M&A: process, pricing and accretion/dilution","short":"Продажа через аукцион от тизера до closing, документы SPA и CPs, синергии и премия, математика accretion/dilution, PPA и гудвил, защита от враждебных сделок, российские пороги оферты","level":"C1","unit":4,"min":9,"id":"ma-process-accretion","theory":"> **In one minute.** The buyer pays the unaffected price (цена до объявления) plus a control premium (премия за контроль), justified by synergies (синергии). Value is created only if the PV, present value (приведённая стоимость), of synergies exceeds the premium plus costs. Accretion/dilution (влияние на прибыль на акцию) is the board's optics test: EPS, earnings per share (прибыль на акцию), up or down. Goodwill (гудвил) is the price above fair value of net assets; an impairment later is the market's receipt for overpaying.\n\n## Sell-side process\n\n```f\nTeaser → NDA → CIM (information memorandum) → non-binding offers (IOI)\n→ management presentations, data room, due diligence (financial, tax, legal, commercial, technical)\n→ binding offers with mark-up of SPA → negotiation, signing → conditions precedent (CPs)\n→ closing: payment, transfer of shares; post-closing adjustments (completion accounts / locked box)\n```\n\nDocuments: NDA, non-disclosure agreement (соглашение о неразглашении), CIM, confidential information memorandum (информационный меморандум), LOI / term sheet, letter of intent (письмо о намерениях / основные условия), SPA, share purchase agreement (договор купли-продажи акций), with representations and warranties, R&W (заверения и гарантии), indemnities (возмещение потерь), MAC clause, material adverse change (оговорка о существенном неблагоприятном изменении), escrow (счёт эскроу), earn-out (отложенный платёж по результатам), non-compete (запрет конкуренции). Price mechanisms: completion accounts (цена по отчётности на дату закрытия, with adjustments for NWC, net working capital — оборотный капитал, and net debt) versus locked box (цена зафиксирована на прошлую дату, с leakage protection).\n\nCPs: antitrust (ФАС, Федеральная антимонопольная служба, in Russia), government commission approval for foreign investors, shareholder votes, financing. Break fee (штраф за срыв сделки, платит продавец) and reverse break fee (обратный штраф, платит покупатель).\n\n## Pricing: premium and synergies\n\n```f\nOffer price = Unaffected price × (1 + premium)          premium 20–40%\nValue created for buyer = PV(synergies) − Premium paid − Transaction and integration costs\nBreakeven run-rate synergies (pre-tax) = Premium × (WACC − g) / (1 − t)\n```\n\nThe last line solves Synergies × (1 − t) / (WACC − g) = Premium: after-tax synergies capitalised as a growing perpetuity must at least repay the premium (t — tax rate, g — growth rate of synergies).\n\nCost synergies (синергии по затратам: procurement, overheads, footprint) are credible; revenue synergies (синергии по выручке) are discounted by the market. Integration costs (затраты на интеграцию) typically equal one year of run-rate synergies (синергии в годовом выражении). Strategic buyers (стратеги) can pay more than financial buyers (финансовые инвесторы) because of synergies; the market reaction on announcement (реакция рынка на объявление) prices how much of the synergies the buyer gave away.\n\n## Accretion / dilution\n\n```f\nPro forma NI = NI_A + NI_T + Synergies × (1 − t) − Interest on new debt × (1 − t) − Foregone interest on cash × (1 − t) + / − new D&A from write-ups\nPro forma EPS = Pro forma NI / (Shares_A + New shares issued)\nAccretive if pro forma EPS > standalone EPS_A\n\nRules of thumb:\n All-stock: accretive if P/E_A > P/E_T  (buyer's \"expensive\" shares buy \"cheap\" earnings)\n All-cash:  accretive if Target earnings yield (E/P) > after-tax cost of debt (or cash yield)\n```\n\nA and T denote the acquirer and the target; NI is net income (чистая прибыль); D&A is depreciation and amortisation (амортизация).\n\nAccretion is not value creation: an accretive deal can destroy value if the premium exceeds synergies, and vice versa. Boards still care because EPS guidance (прогноз по EPS) moves the stock.\n\n## Purchase price allocation and goodwill\n\n```f\nGoodwill = Purchase price − Fair value of net identifiable assets\nNet identifiable assets = Book equity + Write-ups (PP&E, intangibles: brands, customer relationships, technology) − Deferred tax liability on write-ups\n```\n\nPP&E is property, plant and equipment (основные средства).\n\nWrite-ups (дооценка) create new D&A, which lowers pro forma EPS; goodwill is not amortised under IFRS (МСФО) but tested annually for impairment (обесценение). Bargain purchase (выгодная покупка): price below fair value → gain in the P&L (ОФР). Consolidation (консолидация): 100% of the target's assets and liabilities, with NCI, non-controlling interest (доля меньшинства), for the part not owned.\n\n## Hostile deals and defences\n\nHostile takeover (враждебное поглощение): tender offer (публичная оферта) directly to shareholders, proxy fight (борьба за доверенности) for the board. Defences: poison pill (ядовитая пилюля, rights plan), staggered board (ступенчатый совет директоров), white knight (белый рыцарь), crown jewel sale (продажа ключевого актива), golden parachutes (золотые парашюты), Pac-Man defence. Russian law: mandatory offer (обязательное предложение) on crossing 30%, 50%, 75% of voting shares in a public company; squeeze-out (принудительный выкуп) above 95% after a voluntary offer that gathered 10%+.\n\n## Other transaction types\n\nDivestiture (продажа подразделения), spin-off (выделение с распределением акций акционерам), carve-out IPO (частичное выделение через IPO), joint venture (совместное предприятие), minority investment (миноритарная инвестиция) with shareholder agreement (акционерное соглашение): tag-along (право присоединиться к продаже), drag-along (право требовать совместной продажи), ROFR, right of first refusal (преимущественное право покупки), put/call options between partners.","words":[{"w":"unaffected price","t":"цена до объявления о сделке","x":"The premium is 35% to the unaffected price."},{"w":"indication of interest (IOI)","t":"необязывающее предложение","x":"Six IOIs came in the first round."},{"w":"representations and warranties (R&W)","t":"заверения и гарантии","x":"R&W cover tax and title to assets."},{"w":"indemnity","t":"возмещение потерь","x":"The seller gave an indemnity for the tax claim."},{"w":"MAC clause","t":"оговорка о существенном неблагоприятном изменении","x":"The buyer invoked the MAC clause."},{"w":"escrow","t":"эскроу","x":"Ten percent of the price sits in escrow for a year."},{"w":"completion accounts / locked box","t":"цена по отчётности на закрытие / фиксированная цена","x":"A locked box fixes the price at the last audited date."},{"w":"leakage","t":"утечка стоимости (до закрытия)","x":"Dividends before closing count as leakage."},{"w":"conditions precedent (CPs)","t":"отлагательные условия","x":"Antitrust approval is the last CP."},{"w":"break fee","t":"штраф за срыв сделки","x":"The break fee is 2% of equity value."},{"w":"run-rate synergies","t":"синергии в годовом выражении","x":"Run-rate synergies of 5 billion by year three."},{"w":"integration costs","t":"затраты на интеграцию","x":"Integration costs equal one year of synergies."},{"w":"breakeven synergies","t":"синергии, покрывающие премию","x":"Breakeven synergies are 3% of combined costs."},{"w":"pro forma","t":"про-форма (объединённые показатели)","x":"Pro forma EPS rises 4%."},{"w":"accretive / dilutive","t":"увеличивающий / размывающий EPS","x":"The cash deal is accretive from year one."},{"w":"foregone interest","t":"упущенный процентный доход","x":"Foregone interest on cash reduces accretion."},{"w":"write-up","t":"дооценка актива","x":"Write-ups of intangibles add amortisation."},{"w":"purchase price allocation (PPA)","t":"распределение цены покупки","x":"PPA allocated 40% of the price to goodwill."},{"w":"bargain purchase","t":"выгодная покупка (цена ниже справедливой)","x":"A bargain purchase gain was booked."},{"w":"squeeze-out","t":"принудительный выкуп миноритариев","x":"The squeeze-out followed the 95% threshold."},{"w":"tag-along / drag-along","t":"право присоединения / право принуждения к продаже","x":"Minority holders have tag-along rights."},{"w":"right of first refusal (ROFR)","t":"преимущественное право покупки","x":"The ROFR gives partners first option on the stake."}]},{"n":16,"title":"LBO modelling and private equity returns","short":"Sources & uses, структура долга по траншам, cash sweep, три источника доходности, IRR и MOIC, быстрый расчёт в уме, выходы, что проверяет кредитор","level":"C1","unit":4,"min":8,"id":"lbo","theory":"> **In one minute.** An LBO, leveraged buyout (выкуп с долговым финансированием), buys a company with 50–70% debt secured on its own cash flows and sells it in 3–7 years. Returns come from debt paydown (погашение долга), EBITDA growth and multiple expansion (рост мультипликатора). The model answers two questions: what IRR, internal rate of return (внутренняя норма доходности), does the sponsor (фонд) get at a given price, and what price can it pay for a target IRR (20–25%).\n\n## Sources and uses\n\n```f\nUses:    Equity purchase price + Refinanced net debt + Fees (M&A, financing, legal) + Minimum cash\nSources: Senior debt (term loan A/B, revolver) + Second lien / mezzanine / HY bonds + Sponsor equity (+ rollover equity)\nEntry EV = EBITDA × entry multiple;  total leverage = Debt / EBITDA (4–6x US/EU; 2–3x Russia at current rates)\n```\n\nM&A fees are advisory fees (комиссии консультантов по сделке); HY bonds are high-yield bonds (высокодоходные облигации); second lien (долг второй очереди залога) and mezzanine (мезонинный долг) rank behind senior debt.\n\nRollover equity (переходящая доля): management or seller reinvests part of proceeds. Management incentive plan, MIP (опционная программа менеджмента): 5–10% of equity upside.\n\n## Debt structure\n\n| Tranche | Pricing | Repayment | Notes |\n|---|---|---|---|\n| Revolver | Base + 2–3% | Drawn / repaid as needed | Liquidity, commitment fee (комиссия за резервирование) |\n| Term loan A | Base + 3–4% | Amortising (амортизируемый) | Bank debt, maintenance covenants |\n| Term loan B | Base + 4–5% | 1% a year, bullet (единовременно в конце) | Institutional, cov-lite (covenant-lite, без поддерживаемых ковенантов) |\n| Second lien / mezzanine | 10–14%, PIK option | Bullet | Subordinated, warrants (варранты) |\n| High-yield bonds | Fixed 7–10% | Bullet | Incurrence covenants, call protection (защита от досрочного погашения) |\n\nPIK (payment-in-kind, проценты капитализируются) interest accrues to principal instead of being paid in cash. Cash sweep (досрочное погашение из избыточных денег): 50–100% of excess cash flow repays senior debt first.\n\n## The model in steps\n\n```f\n1. Entry: price, S&U, opening balance sheet with goodwill from PPA\n2. Operating forecast: revenue, EBITDA, capex, NWC → FCF before debt service\n3. Debt schedule: interest by tranche (average balance, circularity), mandatory amortisation, cash sweep\n4. Exit in year N: EV = EBITDA_N × exit multiple; Equity = EV − Net debt_N − MIP\n5. Returns: MOIC = Exit equity / Entry equity;  IRR from dated flows (XIRR)\n6. Sensitivities: entry/exit multiple, leverage, EBITDA growth; ability-to-pay analysis (максимальная цена под целевую IRR)\n```\n\nS&U is sources and uses, PPA — purchase price allocation (распределение цены покупки), NWC — net working capital (оборотный капитал), FCF — free cash flow (свободный денежный поток), MIP — management incentive plan; XIRR is the Excel function for IRR on dated cash flows.\n\n## Return attribution\n\n```f\nEquity_exit − Equity_entry = ΔEBITDA × multiple_entry   (EBITDA growth)\n                           + EBITDA_exit × Δmultiple     (multiple expansion)\n                           + Debt paydown                (deleveraging)\n```\n\nA disciplined model assumes exit multiple = entry multiple; returns must come from operations and deleveraging. Dividend recap (дивидендная рекапитализация): re-lever mid-life to return cash early, lifting IRR.\n\n## Quick math\n\nEntry EBITDA 100, 8x → EV 800, debt 500, equity 300. Exit year 5: EBITDA 130, 8x → EV 1,040, net debt 250 → equity 790. MOIC 2.6x, IRR ≈ 21%. Rule: IRR ≈ MOIC^(1/n) − 1; 2x in 5 years ≈ 15%, 3x in 5 ≈ 25%.\n\n## What makes a target LBO-able\n\nStable cash flows and margins, low capex intensity, low cyclicality, hard assets as collateral (обеспечение), fragmented market for bolt-ons (дополняющие покупки), weak existing balance sheet (room to lever), clear exit (strategic buyer, IPO — initial public offering, первичное размещение, or secondary buyout — продажа другому фонду). Not LBO-able: loss-making growth, heavy capex, regulated prices with political risk.\n\n## Lender's view and covenants\n\nMaintenance covenants (поддерживаемые ковенанты) tested quarterly: Net debt/EBITDA ≤ x, interest coverage ≥ y, capex cap. Incurrence covenants (ковенанты на действия) only when the company acts: new debt, dividends, asset sales. Headroom (запас по ковенанту) of 25–30% against the sponsor case. Equity cure (докапитализация для исправления нарушения): sponsor injects equity to fix a breach. Security package (пакет обеспечения): share pledge (залог акций), asset pledge, guarantees from opcos (операционные компании).\n\n## PE fund mechanics\n\nIn a PE, private equity (прямые инвестиции), fund LPs, limited partners (инвесторы фонда), commit capital (обязательства инвесторов); the GP, general partner (управляющий партнёр), calls it (capital call) as deals close; 2% management fee (комиссия за управление), 20% carry, carried interest (доля управляющего в прибыли), over an 8% hurdle (пороговая доходность) with catch-up (догоняющая выплата); clawback (возврат переплаченного вознаграждения) if later deals lose. Fund life 10 years: investment period (инвестиционный период) 5, harvesting (выход из инвестиций) 5. DPI, distributions to paid-in capital (распределения к вложенному капиталу), and TVPI, total value to paid-in capital (общая стоимость к вложенному), complement IRR.","words":[{"w":"sponsor","t":"спонсор сделки (фонд прямых инвестиций)","x":"The sponsor contributed 40% equity."},{"w":"sources and uses","t":"источники и использование средств","x":"Sources and uses must balance to the rouble."},{"w":"rollover equity","t":"переходящая доля (реинвестирование продавца)","x":"Management rolled over 10% of proceeds."},{"w":"management incentive plan (MIP)","t":"программа мотивации менеджмента","x":"The MIP gives managers 8% of exit equity."},{"w":"bullet repayment","t":"единовременное погашение в конце срока","x":"Bonds have bullet repayment at maturity."},{"w":"second lien","t":"долг второй очереди залога","x":"Second lien sits behind the senior loans."},{"w":"PIK (payment-in-kind)","t":"капитализируемые проценты","x":"PIK interest accrues to principal."},{"w":"commitment fee","t":"комиссия за резервирование лимита","x":"The revolver carries a 0.5% commitment fee."},{"w":"call protection","t":"защита от досрочного погашения","x":"Call protection lasts three years."},{"w":"cash sweep","t":"досрочное погашение из избыточного денежного потока","x":"A 75% cash sweep deleverages quickly."},{"w":"ability-to-pay analysis","t":"анализ максимальной цены под целевую доходность","x":"Ability-to-pay shows 8.5x at a 20% IRR."},{"w":"return attribution","t":"разложение доходности по источникам","x":"Return attribution shows most value from deleveraging."},{"w":"dividend recapitalisation","t":"дивидендная рекапитализация","x":"A dividend recap returned 0.5x early."},{"w":"bolt-on acquisition","t":"дополняющее поглощение","x":"Bolt-ons double the platform's EBITDA."},{"w":"secondary buyout","t":"продажа другому фонду","x":"Exit via secondary buyout to another sponsor."},{"w":"maintenance / incurrence covenants","t":"поддерживаемые ковенанты / ковенанты на действия","x":"Term loan B has only incurrence covenants."},{"w":"headroom","t":"запас по ковенанту","x":"Covenant headroom is 30% to EBITDA."},{"w":"equity cure","t":"исправление нарушения ковенанта взносом в капитал","x":"An equity cure right allows two cures over the life."},{"w":"share pledge","t":"залог акций","x":"Lenders hold a share pledge over the target."},{"w":"catch-up / clawback","t":"догоняющая выплата / возврат вознаграждения","x":"Carry has a full catch-up after the hurdle."},{"w":"DPI / TVPI","t":"распределения / общая стоимость к вложенному капиталу","x":"DPI of 1.2x means investors got their money back."}]},{"n":17,"title":"Debt financing, leveraged finance and restructuring","short":"Инструменты долга и их цена, синдикация, обеспечение и очерёдность, ковенанты и waiver, рейтинги, рефинансирование, дефолт, реструктуризация и банкротство","level":"C1","unit":4,"min":8,"id":"debt-restructuring","theory":"> **In one minute.** Debt is priced as base rate plus spread (базовая ставка плюс спред) for credit risk, structured by seniority (старшинство) and security (обеспечение), and policed by covenants (ковенанты). When cash flow fails, the sequence is waiver (вейвер, отказ кредиторов от требований за нарушение) → amend and extend (изменение условий и продление) → restructuring (haircut — списание части долга, debt-for-equity — конвертация долга в акции) → bankruptcy (банкротство). The waterfall (очерёдность выплат) decides who gets what.\n\n## Instruments and pricing\n\n```f\nLoan rate = Base (key rate / RUONIA / SOFR / EURIBOR) + Margin (bp)   — floating\nBond yield = Risk-free (same tenor) + Credit spread                       — fixed or floating\nMargin ratchet (ступенчатая маржа): spread steps with leverage\nFees: arrangement (за организацию), commitment (за резервирование), prepayment (за досрочное погашение)\n```\n\nRUONIA is the rouble overnight index average, SOFR the US secured overnight financing rate, EURIBOR the euro interbank offered rate; bp means basis points (базисные пункты, 0.01%).\n\n| Instrument | Typical use |\n|---|---|\n| Bilateral / club / syndicated loan | Working capital, capex, acquisitions; lead arranger (организатор) and agent bank (банк-агент) |\n| Revolver (RCF, revolving credit facility — возобновляемая кредитная линия) | Liquidity; drawn / undrawn |\n| Term loan A/B | Amortising bank debt / institutional cov-lite (covenant-lite, с облегчёнными ковенантами) |\n| Bonds (local, Eurobonds — еврооблигации, replacement — замещающие, yuan) | Longer tenor (срок), broader investor base, disclosure |\n| Commercial paper (коммерческие бумаги) | Short-term unsecured |\n| Project finance | Non-recourse (без регресса) to the sponsor; sizing by DSCR (debt service coverage ratio, покрытие обслуживания долга) |\n| Leasing, factoring, trade finance | Asset-based (под активы) |\n| Convertible, hybrid, perpetual | Equity-like features; rating agencies treat part of them as equity (equity credit) |\n\nLeveraged finance (левередж-финансирование) is lending to sub-investment-grade borrowers: LBO (leveraged buyout, выкуп в долг) debt, high-yield bonds, unitranche (единый транш, private credit).\n\n## Seniority and security\n\n```f\nWaterfall: super-senior (revolver, DIP) → senior secured → senior unsecured → subordinated → hybrids → preferred → common equity\nStructural subordination: debt at a holding company ranks behind opco debt (структурная субординация)\nSecurity: pledge of shares, PP&E, receivables, accounts; guarantees from subsidiaries (поручительства)\nIntercreditor agreement (межкредиторское соглашение): who enforces, standstill, release of security\n```\n\nDIP is debtor-in-possession financing (финансирование должника в ходе процедуры, Chapter 11), opco — the operating company (операционная компания), PP&E — property, plant and equipment (основные средства).\n\nRecovery rates (уровень возмещения): senior secured 60–80%, unsecured 30–50%, subordinated 10–20% historically; LGD, loss given default (потери при дефолте), = 1 − recovery.\n\n## Covenants and ratings\n\nMaintenance (tested quarterly: leverage, coverage, minimum equity) versus incurrence (triggered by actions). Breach → event of default (случай неисполнения) → lenders may accelerate (потребовать досрочного погашения); cross-default (кросс-дефолт) spreads it to other debt. In practice: waiver for a fee, reset of covenants, amend and extend (A&E, изменение условий и продление).\n\nRatings (Topic 11): agencies map FFO/debt (funds from operations to debt), debt/EBITDA, coverage and business risk to a grade; outlook and watch signal direction. Covenant headroom and rating headroom are what the CFO, chief financial officer (финансовый директор), manages.\n\n## Refinancing and liability management\n\nRefinance before the debt wall (стена погашений); extend maturities (удлинить сроки), diversify sources (currency, market, bank vs bond), keep undrawn RCF and cash as the liquidity cushion. Liability management (управление обязательствами): tender offer for bonds, exchange offer (обмен бумаг), consent solicitation (запрос согласия держателей) to change terms, early redemption (досрочное погашение) at a make-whole (компенсация за досрочный выкуп) or call price.\n\n## Distress and restructuring\n\n```f\nSignals: coverage < 1.5x, negative FCF (free cash flow), covenant breaches, rating in CCC (near default), bonds below 70, auditor going-concern doubt (сомнение в непрерывности деятельности)\nOptions: out-of-court restructuring (внесудебная) vs in-court (bankruptcy)\nTools: maturity extension, coupon cut, PIK toggle (право платить проценты бумагами), haircut (списание), debt-for-equity swap (конвертация долга в капитал),\n       new money (новые деньги) with super-senior status, asset sales, sale of the company\n```\n\nDistressed debt investors (инвесторы в проблемный долг) buy bonds at 30–60 cents to control the restructuring (fulcrum security, «опорная» бумага, which converts into equity). In Russia: Federal Law on Insolvency (Bankruptcy) No. 127-FZ — observation (наблюдение), financial rehabilitation (финансовое оздоровление), external management (внешнее управление), bankruptcy proceedings (конкурсное производство); creditors' meeting (собрание кредиторов), register of claims (реестр требований), priority of claims (очерёдность требований). US: Chapter 11 (reorganisation under court protection, DIP financing, cramdown — утверждение плана вопреки несогласным кредиторам) versus Chapter 7 (liquidation).","words":[{"w":"base rate plus margin","t":"базовая ставка плюс маржа","x":"The loan is priced at key rate plus 300 bp."},{"w":"margin ratchet","t":"ступенчатая маржа (зависит от долговой нагрузки)","x":"The margin ratchet cuts 50 bp below 2x leverage."},{"w":"lead arranger / agent bank","t":"организатор / банк-агент","x":"The lead arranger syndicated 70% of the loan."},{"w":"tenor","t":"срок (инструмента)","x":"Bonds offer longer tenor than loans."},{"w":"non-recourse","t":"без регресса на спонсора","x":"Project finance is non-recourse to the sponsor."},{"w":"unitranche","t":"единый транш (частный кредит)","x":"A unitranche replaced senior and mezzanine."},{"w":"leveraged finance","t":"левередж-финансирование","x":"Leveraged finance desks fund LBOs."},{"w":"waterfall","t":"очерёдность выплат","x":"The waterfall pays senior secured first."},{"w":"structural subordination","t":"структурная субординация","x":"Holdco bonds suffer structural subordination."},{"w":"intercreditor agreement","t":"межкредиторское соглашение","x":"The intercreditor agreement sets a 90-day standstill."},{"w":"recovery rate","t":"уровень возмещения","x":"Recovery on unsecured bonds was 35%."},{"w":"event of default","t":"случай неисполнения обязательств","x":"A missed covenant is an event of default."},{"w":"cross-default","t":"кросс-дефолт","x":"Cross-default clauses link all facilities."},{"w":"accelerate","t":"потребовать досрочного погашения","x":"Lenders may accelerate after a breach."},{"w":"amend and extend","t":"изменить условия и продлить срок","x":"An amend-and-extend pushed maturities to 2029."},{"w":"consent solicitation","t":"запрос согласия держателей облигаций","x":"The consent solicitation passed with 80%."},{"w":"make-whole","t":"компенсация при досрочном выкупе","x":"Early redemption requires a make-whole payment."},{"w":"going concern","t":"непрерывность деятельности","x":"The auditor flagged going-concern doubt."},{"w":"haircut","t":"списание части долга","x":"Creditors took a 40% haircut."},{"w":"debt-for-equity swap","t":"конвертация долга в акции","x":"Lenders became shareholders via a debt-for-equity swap."},{"w":"fulcrum security","t":"«опорная» бумага при реструктуризации","x":"The senior unsecured bonds are the fulcrum security."},{"w":"register of claims","t":"реестр требований кредиторов","x":"Claims must be entered in the register of claims."}]},{"n":18,"title":"Macro for markets: rates, inflation, FX and the budget rule","short":"Как решение по ставке проходит в экономику и в цены активов, реальная ставка, кривая, драйверы рубля, бюджетное правило, что смотреть в календаре","level":"B2","unit":4,"min":8,"id":"macro-rates-fx","theory":"> **In one minute.** The policy rate (ключевая ставка) sets the discount rate for everything; inflation (инфляция) and inflation expectations (инфляционные ожидания) set the policy rate. The real rate (реальная ставка) is the stance (жёсткость политики). For Russia the rouble is driven by the trade balance (торговый баланс), capital controls and the budget rule (бюджетное правило), less by rate differentials. Read macro as \"what does it do to cash flows and to the discount rate\".\n\n## Transmission\n\n```f\nKey rate ↑ → deposit and loan rates ↑ → credit growth ↓, saving ↑ → demand ↓ → inflation ↓ (lag 3–6 quarters)\n           → OFZ yields ↑ (short end first) → bond prices ↓ → equity discount rate ↑ → multiples ↓\n           → rouble ↑ (carry), importers' costs ↓\nReal rate = Key rate − expected inflation;  neutral real rate (нейтральная ставка) ≈ 3–4% in Russia (Bank of Russia estimate)\n```\n\nOFZ are Russian federal government bonds (ОФЗ, облигации федерального займа).\n\nTightening (ужесточение) and easing (смягчение); hawkish / dovish (ястребиный / голубиный) signal (сигнал); forward guidance (сигнал о будущих решениях); the Bank of Russia publishes a key rate path forecast (траектория ставки) four times a year. Average key rate forecast (среднегодовая ставка) is what the OFZ curve prices.\n\n## Inflation measures\n\nCPI, the consumer price index (ИПЦ), headline and core (базовая); the seasonally adjusted annualised rate (SAAR, сезонно скорректированная инфляция в годовом выражении) is what the Bank of Russia watches week to week; inflation expectations from the household survey by inFOM, a polling company working for the Bank of Russia (опрос населения) and enterprise price expectations (ценовые ожидания предприятий); trimmed mean (усечённое среднее). Target (цель): 4%. Disinflation (замедление инфляции), deflation, stagflation (стагфляция: no growth, high inflation).\n\n## Growth and the cycle\n\nGDP (ВВП) real growth; output gap (разрыв выпуска): positive gap = overheating (перегрев) → inflation. PMI, purchasing managers' index (индекс деловой активности), industrial production (промпроизводство), retail sales (розничные продажи), unemployment (безработица) at record lows = labour shortage (дефицит кадров) → wage inflation. Soft landing / hard landing (мягкая / жёсткая посадка); recession = two consecutive quarters of contraction.\n\n## Yield curve as a forecast\n\nShort OFZ yields ≈ expected average key rate over the tenor plus term premium (премия за срок). Inversion (инверсия) = cuts expected. Slope changes: bull steepening (short end rallies on cuts), bear flattening (short end sells off on hikes). Breakeven inflation (вменённая инфляция) from linkers (облигации с индексируемым номиналом). RUONIA, the rouble overnight index average, and the overnight repo rate (ставка репо овернайт) track the key rate daily; money-market funds (фонды денежного рынка) earn it.\n\n## The rouble\n\n```f\nDrivers: current account (счёт текущих операций) = trade balance + services + income;\n         exporters' FX sales (продажа валютной выручки), import demand, capital outflows (отток капитала),\n         Bank of Russia / Ministry of Finance operations under the budget rule, sanctions on payment channels\nBudget rule: oil and gas revenue above the cut-off price (цена отсечения) → buy FX/gold into the NWF, National Wealth Fund (ФНБ, Фонд национального благосостояния);\n             below → sell. Smooths the rouble and the budget.\n```\n\nSince 2022: capital controls (ограничения на движение капитала), yuan as the main traded currency, official rate from OTC (over-the-counter, внебиржевой рынок) data after MOEX (Мосбиржа) dollar/euro trading stopped in June 2024, mandatory FX sales for exporters at times, carry trade limited. Rouble strength hurts exporters' rouble EBITDA and budget revenue; weakness feeds inflation through imports with a lag of 2–3 quarters (pass-through, эффект переноса).\n\n## Fiscal\n\nBudget deficit (дефицит бюджета) financed by OFZ issuance (размещение ОФЗ) and the NWF; large issuance pushes long yields up (crowding out, вытеснение). Public debt (госдолг) ≈ 15–20% of GDP, low; but interest costs rise fast at a high key rate. Fiscal impulse (бюджетный импульс) from defence and social spending is pro-inflationary, which keeps the Bank of Russia tight: fiscal dominance (фискальное доминирование) risk.\n\n## Calendar and reactions\n\n| Release | Who | Market reaction |\n|---|---|---|\n| Key rate decision + statement, 8 per year, 13:30 MSK (московское время) | Bank of Russia | OFZ, rouble, banks, developers |\n| Weekly CPI (Wed), monthly CPI | Rosstat | Rate expectations |\n| inFOM expectations | Bank of Russia | Rate expectations |\n| Budget execution (monthly) | Ministry of Finance | OFZ supply, rouble |\n| FOMC (Federal Open Market Committee, комитет ФРС по ставкам), 8 per year; US CPI; non-farm payrolls (first Friday) | Fed (ФРС), BLS (Bureau of Labor Statistics, бюро статистики труда США) | Global risk, dollar, gold, crypto |\n| OPEC+ (ОПЕК+) meetings, EIA (US Energy Information Administration) inventories | — | Oil, rouble, oil stocks |\n\nReaction rules of thumb: hike → bonds down, banks mixed (margins up, credit quality down), developers and leveraged names down, rouble up; cut → the reverse; oil up → rouble up, oil stocks up with a lag through FX.","words":[{"w":"policy rate (key rate)","t":"ключевая ставка","x":"The policy rate was held at 14%."},{"w":"transmission mechanism","t":"трансмиссионный механизм","x":"Transmission takes three to six quarters."},{"w":"stance","t":"жёсткость (направленность) политики","x":"The stance remains tight with a 7% real rate."},{"w":"neutral rate","t":"нейтральная ставка","x":"The neutral real rate is about 3.5%."},{"w":"forward guidance","t":"сигнал о будущей политике","x":"Forward guidance pointed to a long pause."},{"w":"key rate path","t":"траектория ключевой ставки","x":"The key rate path implies cuts in 2027."},{"w":"seasonally adjusted annualised (SAAR)","t":"сезонно скорректированный в годовом выражении","x":"SAAR inflation slowed to 5%."},{"w":"inflation expectations","t":"инфляционные ожидания","x":"Household inflation expectations fell to 13%."},{"w":"output gap","t":"разрыв выпуска","x":"A positive output gap signals overheating."},{"w":"labour shortage","t":"дефицит кадров","x":"The labour shortage drives wage growth."},{"w":"bull steepening / bear flattening","t":"ралли на коротком конце / распродажа на коротком конце","x":"The curve bull-steepened after the dovish signal."},{"w":"current account","t":"счёт текущих операций","x":"The current account surplus narrowed."},{"w":"capital outflow","t":"отток капитала","x":"Capital outflows weakened the rouble."},{"w":"budget rule","t":"бюджетное правило","x":"Under the budget rule, excess oil revenue is saved."},{"w":"cut-off price","t":"цена отсечения","x":"The cut-off price is 60 dollars per barrel."},{"w":"National Wealth Fund (NWF)","t":"Фонд национального благосостояния","x":"The NWF finances the deficit."},{"w":"pass-through","t":"эффект переноса (курса в цены)","x":"FX pass-through to prices takes two quarters."},{"w":"crowding out","t":"вытеснение частных заёмщиков","x":"Heavy OFZ supply crowds out corporate issuers."},{"w":"fiscal impulse","t":"бюджетный импульс","x":"The fiscal impulse is pro-inflationary."},{"w":"fiscal dominance","t":"фискальное доминирование","x":"Fiscal dominance would undermine the inflation target."},{"w":"non-farm payrolls","t":"данные по занятости в несельскохозяйственном секторе США","x":"Payrolls beat expectations and the dollar rose."}]},{"n":19,"title":"IFRS vs US GAAP, consolidation and goodwill","short":"Ключевые различия стандартов, периметр консолидации и контроль, метод долевого участия, NCI, гудвил и обесценение, сегменты, отложенные налоги","level":"C1","unit":4,"min":8,"id":"ifrs-gaap-consolidation","theory":"> **In one minute.** IFRS (МСФО) is principles-based (на принципах), US GAAP (ОПБУ США) rules-based (на правилах); the logic matches, the details differ. Consolidation (консолидация) depends on control (контроль): subsidiaries (дочерние компании) are consolidated line by line with NCI (доля меньшинства); associates (ассоциированные компании, 20–50%) use the equity method (метод долевого участия); JVs, joint ventures (совместные предприятия), likewise. Goodwill = price − fair value of net assets, tested for impairment, never amortised under IFRS.\n\n## Perimeter of consolidation\n\n```f\nControl (IFRS 10): power + exposure to variable returns + ability to use power → consolidate 100%, show NCI\nSignificant influence (20–50%, IAS 28): equity method — one line \"share of profit\", one line \"investment\"\nJoint control (IFRS 11): joint venture → equity method; joint operation → proportionate share\n< 20%: financial asset at fair value (FVTPL / FVOCI)\n```\n\nIAS are the older International Accounting Standards still in force (МСФО (IAS)); FVTPL means fair value through profit or loss, FVOCI — fair value through other comprehensive income (see below).\n\nConsolidation steps: add 100% of the subsidiary's lines, eliminate (исключить) intercompany balances and sales (внутригрупповые обороты), unrealised profit in inventory, the parent's investment against the subsidiary's equity; what remains is goodwill; the part of net assets not owned is NCI. Equity-accounted income is in EBIT or below depending on policy and is excluded from EBITDA by most analysts, so the stake is added separately in the EV bridge (мост от стоимости бизнеса к стоимости акций).\n\n## Goodwill and impairment\n\n```f\nGoodwill = Consideration + NCI (fair value or proportionate) − Fair value of identifiable net assets\nImpairment test (IAS 36) annually at cash-generating unit (CGU, единица, генерирующая денежные потоки) level:\n  recoverable amount = max(value in use, fair value less costs of disposal) < carrying amount → impairment\nUnder US GAAP: qualitative step then quantitative; no reversal of goodwill impairment under either standard\n```\n\nImpairment is non-cash but signals overpayment and often precedes dividend cuts or covenant (ковенант) pressure.\n\n## Key IFRS vs US GAAP differences\n\nFIFO and LIFO are first-in-first-out and last-in-first-out inventory methods (ФИФО и ЛИФО); ASC is the US GAAP Accounting Standards Codification; CFS, CFO and CFF are the cash flow statement and its operating and financing sections.\n\n| Area | IFRS | US GAAP |\n|---|---|---|\n| Inventory | FIFO or weighted average; no LIFO | LIFO allowed (LIFO reserve disclosed) |\n| Development costs | Capitalised if criteria met (IAS 38) | Expensed (except software) |\n| PP&E revaluation | Allowed (revaluation model) | Not allowed |\n| Leases | All on balance sheet; single model (IFRS 16) | Operating vs finance lease; both on balance sheet (ASC 842), different expense pattern |\n| Impairment of assets | One-step, reversible for non-goodwill | Two-step, no reversal |\n| Interest paid in CFS | CFO or CFF | CFO |\n| Extraordinary items | Prohibited | Prohibited since 2015 |\n| Deferred tax | Balance sheet liability method, no current/non-current split | Same method, all non-current |\n| Fair value hierarchy | Level 1/2/3 (IFRS 13) | Level 1/2/3 (ASC 820) |\n\nRAS (РСБУ) differences: tax-driven, less fair value, no consolidation requirement at entity level, different lease and impairment practice; use IFRS for analysis and RAS for dividend capacity of subsidiaries (dividends are paid from RAS net profit).\n\n## Deferred taxes and other items\n\nA deferred tax liability (DTL, отложенное налоговое обязательство) arises when book value exceeds tax base (налоговая база): accelerated tax depreciation, write-ups in the PPA, purchase price allocation (распределение цены покупки). Deferred tax asset (DTA, отложенный налоговый актив): tax losses, provisions. DTL from PPA is debt-like only if it will reverse in cash. Provisions (резервы, IAS 37): recognised when probable and measurable; contingent liabilities (условные обязательства) only disclosed. Segment reporting (IFRS 8, сегментная отчётность): revenue and EBITDA by segment feed the SOTP, sum-of-the-parts valuation (оценка по частям).\n\n## Fair value and financial instruments\n\nIFRS 9 classification: amortised cost (амортизированная стоимость), FVOCI (через прочий совокупный доход), FVTPL (через прибыль или убыток); the expected credit loss (ECL, ожидаемые кредитные убытки) model with stages 1–3 for banks. Hedge accounting (учёт хеджирования) aligns derivative gains with the hedged item. Fair value hierarchy: Level 1 quoted prices, Level 2 observable inputs, Level 3 models.\n\n## Audit vocabulary\n\nUnqualified opinion (безоговорочно положительное заключение), qualified (с оговоркой), adverse (отрицательное), disclaimer (отказ от выражения мнения); key audit matters (ключевые вопросы аудита); going concern; restatement (пересчёт прошлых отчётов); material misstatement (существенное искажение); materiality threshold (порог существенности).","words":[{"w":"principles-based / rules-based","t":"основанный на принципах / на правилах","x":"IFRS is principles-based, US GAAP rules-based."},{"w":"perimeter of consolidation","t":"периметр консолидации","x":"The JV is outside the perimeter of consolidation."},{"w":"control","t":"контроль (IFRS 10)","x":"Control means power over relevant activities."},{"w":"significant influence","t":"значительное влияние","x":"A 30% stake gives significant influence."},{"w":"equity method","t":"метод долевого участия","x":"The associate is accounted for by the equity method."},{"w":"intercompany elimination","t":"исключение внутригрупповых оборотов","x":"Intercompany sales are eliminated on consolidation."},{"w":"non-controlling interest (NCI)","t":"неконтролирующая доля","x":"NCI reflects the 25% held by minorities."},{"w":"cash-generating unit (CGU)","t":"единица, генерирующая денежные потоки","x":"Goodwill is tested at the CGU level."},{"w":"recoverable amount","t":"возмещаемая стоимость","x":"The recoverable amount fell below carrying value."},{"w":"value in use","t":"ценность использования","x":"Value in use is a DCF of the CGU."},{"w":"carrying amount","t":"балансовая стоимость","x":"Carrying amount exceeded fair value."},{"w":"LIFO reserve","t":"резерв ЛИФО","x":"Add the LIFO reserve to compare inventories."},{"w":"revaluation model","t":"модель переоценки","x":"The revaluation model is allowed under IFRS only."},{"w":"deferred tax asset / liability","t":"отложенный налоговый актив / обязательство","x":"The DTL arose from accelerated tax depreciation."},{"w":"tax base","t":"налоговая база (актива)","x":"Book value above tax base creates a DTL."},{"w":"provision","t":"резерв (под обязательство)","x":"A provision was booked for the lawsuit."},{"w":"segment reporting","t":"сегментная отчётность","x":"Segment reporting feeds the sum-of-the-parts."},{"w":"amortised cost","t":"амортизированная стоимость","x":"Loans are carried at amortised cost."},{"w":"expected credit loss (ECL)","t":"ожидаемые кредитные убытки","x":"ECL provisions rose in stage 3."},{"w":"fair value hierarchy","t":"иерархия справедливой стоимости","x":"Level 3 inputs are unobservable."},{"w":"restatement","t":"пересчёт (корректировка) прошлой отчётности","x":"The restatement cut prior-year profit by 10%."},{"w":"materiality","t":"существенность","x":"The error was below the materiality threshold."}]},{"n":20,"title":"The Russian market and deals in English","short":"Инфраструктура и индексы, крупнейшие эмитенты по секторам, дивидендные правила, ОФЗ и ставка, рубль после 2022, санкционные особенности сделок, фразы для собеседования","level":"B2","unit":4,"min":8,"id":"russian-market","theory":"> **In one minute.** One exchange (MOEX, Мосбиржа), one mega-regulator (мегарегулятор: Bank of Russia), one benchmark (IMOEX, индекс Мосбиржи). A commodity- and state-heavy index with the strongest dividend culture among large markets, OFZ (ОФЗ, облигации федерального займа) as the rouble risk-free curve, the key rate as the main driver. Since 2022: domestic retail-dominated investor base, frozen foreign holdings, yuan instead of dollar, sanctions shaping every deal.\n\n## Infrastructure\n\nMoscow Exchange group: exchange, NCC — National Clearing Centre (НКЦ), NSD — National Settlement Depository (НРД); T+1 settlement (расчёты на следующий день); sessions 7:00–23:50 with the main one 10:00–18:50 MSK (московское время). Bank of Russia supervises banks, brokers, insurers, funds and issuers. Qualified investor (квалифицированный инвестор) status gates complex and foreign instruments; unqualified investors pass tests. Retail investors (частные инвесторы) are 70–80% of equity turnover; institutions: NPFs, non-state pension funds (НПФ), mutual funds (ПИФы), insurers, banks' prop desks (собственная торговля банков).\n\nIndices: IMOEX (rouble, free-float weighted, 15% single-name cap), RTS index (индекс РТС, in dollars), MOEX sector indices, RGBI (Russian Government Bond Index, OFZ), RUCBI (Russian Corporate Bond Index), RVI (Russian Volatility Index), MOEX Blue Chip index.\n\n## Issuers by sector\n\n| Sector | Names | Analyst focus |\n|---|---|---|\n| Oil and gas | Lukoil, Rosneft, Gazprom, Novatek, Surgutneftegas, Tatneft, Gazprom Neft, Transneft | Urals price and discount to Brent, rouble, taxes (MET / НДПИ, export duty), dividend policy |\n| Banks | Sberbank, VTB, T-Technologies, Sovcombank, MKB, BSPB | ROE (return on equity, рентабельность капитала), CET1 (common equity tier 1, достаточность базового капитала), cost of risk (стоимость риска), NIM (net interest margin, чистая процентная маржа), 50% payout |\n| Metals and mining | Norilsk Nickel, Polyus, Severstal, NLMK, MMK, Rusal, Alrosa, Mechel | Prices, China, sanctions, leverage, FCF-based (free cash flow, свободный денежный поток) dividends |\n| Tech and internet | Yandex, Ozon, VK, HeadHunter, Positive Technologies, Astra, Diasoft | Growth, re-domiciliation, GMV (gross merchandise value, оборот площадки), take rate, adjusted EBITDA |\n| Consumer | X5, Magnit, Lenta, Fix Price, Henderson | LFL sales (сопоставимые продажи), inflation pass-through, margins |\n| Telecom, utilities, transport | MTS, Rostelecom, Inter RAO, Rosseti, Aeroflot, Sovcomflot, Globaltrans | Regulated tariffs (регулируемые тарифы), capex, leverage |\n| Developers | PIK, Samolet, LSR, Etalon | Mortgage subsidies (льготная ипотека), escrow, debt |\n\nSOEs, state-owned enterprises (госкомпании), pay 50% of IFRS (МСФО) net income by government directive; many private companies tie dividends to FCF and leverage (Severstal, NLMK: 100% FCF below 1x net debt/EBITDA; Lukoil: 100% adjusted FCF). Surgutneftegas preferred dividends depend on FX revaluation of its dollar deposits (\"кубышка\").\n\n## Bonds and the key rate\n\nOFZ types: PD (fixed), PK (floaters on RUONIA, the rouble overnight rate), IN (linkers), AD (amortising); weekly MinFin auctions (аукционы Минфина); OFZ yields are the rouble risk-free rate for CAPM (capital asset pricing model, модель оценки капитальных активов). Corporate market: floaters tied to key rate / RUONIA dominated 2024–2025; replacement bonds (замещающие облигации) in USD/EUR terms settled in roubles; yuan bonds; ratings by ACRA (АКРА), Expert RA (Эксперт РА), NCR (НКР), NRA (НРА). Key rate: 7.5% mid-2023 → 21% October 2024 → easing from 2025; the OFZ curve stayed inverted while cuts were expected. Deposits and money-market funds (фонды денежного рынка, e.g. LQDT — the ticker of the largest one) absorbed retail money at high rates.\n\n## The rouble and capital controls\n\nFloating rate with controls: restrictions on transfers abroad, periodic mandatory FX sales by exporters (обязательная продажа валютной выручки), yuan as the main traded currency, official rate from OTC (over-the-counter, внебиржевой рынок) data since June 2024 (MOEX dollar and euro trading halted after US sanctions on the exchange). Drivers: oil export revenue and the Urals discount, import recovery, budget rule operations in yuan and gold, sanctions on payment channels (secondary sanctions, вторичные санкции). Limited carry trade: rates do not pull foreign capital in.\n\n## Sanctions and deal specifics\n\n- Foreign holders from unfriendly states (недружественные страны): shares frozen in type-C accounts (счета типа «С»); exit deals need Government Commission (правительственная комиссия) approval, a 50%+ discount to valuation and a voluntary contribution (добровольный взнос) to the budget.\n- Depositary receipts converted to local shares; re-domiciliation (редомициляция) from Cyprus, Netherlands, Jersey to Russia or special administrative regions (САР: Kaliningrad, Russky Island); some companies split (Yandex) or swapped shares.\n- Disclosure (раскрытие) partly suspended; some issuers publish limited IFRS, which raises the governance discount.\n- Western banks and the Big Four (Deloitte, PwC, EY, KPMG — крупнейшие аудиторско‑консалтинговые сети) left; their former Russian practices (Kept, B1, DRT, TeDo) and local banks run deals; valuation references are domestic.\n- Sanctioned counterparties: payment rails, correspondent banking (корреспондентские отношения), compliance (комплаенс) and blocking sanctions (блокирующие санкции; SDN — Specially Designated Nationals, американский список лиц под блокирующими санкциями) dominate M&A (mergers and acquisitions, слияния и поглощения) due diligence (комплексная проверка).\n\n## Interview phrases\n\n- \"The Russian equity market is a commodity and dividend story: low multiples (P/E 4–6x), high yields, sensitivity to oil, the rouble and the key rate.\"\n- \"Sber is the market proxy: the most liquid name and the largest index weight.\"\n- \"OFZ yields embed the Bank of Russia's expected rate path; the curve was inverted for most of 2024–2025.\"\n- \"Post-2022 the investor base is domestic retail; foreign holdings sit in type-C accounts; exits require Government Commission approval at a discount.\"\n- \"The rouble is driven by the trade balance, capital controls and the budget rule rather than by rate differentials.\"","words":[{"w":"mega-regulator","t":"мегарегулятор","x":"The Bank of Russia is a mega-regulator."},{"w":"qualified investor","t":"квалифицированный инвестор","x":"Foreign ETFs require qualified investor status."},{"w":"free-float weighted","t":"взвешенный по акциям в свободном обращении","x":"IMOEX is free-float weighted with a 15% cap."},{"w":"mineral extraction tax (MET)","t":"налог на добычу полезных ископаемых (НДПИ)","x":"MET takes most of the oil windfall."},{"w":"Urals discount","t":"дисконт Urals к Brent","x":"The Urals discount narrowed to 10 dollars."},{"w":"net interest margin (NIM)","t":"чистая процентная маржа","x":"Sber's NIM held near 6%."},{"w":"cost of risk","t":"стоимость риска (резервы к кредитам)","x":"Cost of risk rose to 1.5%."},{"w":"capital adequacy (CET1)","t":"достаточность капитала","x":"CET1 above 12% allows full dividends."},{"w":"like-for-like (LFL) sales","t":"сопоставимые продажи","x":"LFL sales grew 9% on traffic and ticket."},{"w":"take rate","t":"комиссия площадки (доля от GMV)","x":"Ozon's take rate reached 20%."},{"w":"regulated tariff","t":"регулируемый тариф","x":"Utilities earn regulated tariffs."},{"w":"subsidised mortgage","t":"льготная ипотека","x":"Subsidised mortgages drove developers' sales."},{"w":"government directive","t":"директива правительства","x":"A government directive sets the 50% payout."},{"w":"money-market fund","t":"фонд денежного рынка","x":"Money-market funds earn the RUONIA rate."},{"w":"mandatory FX sales","t":"обязательная продажа валютной выручки","x":"Mandatory FX sales supported the rouble."},{"w":"secondary sanctions","t":"вторичные санкции","x":"Secondary sanctions hit payments via Chinese banks."},{"w":"type-C account","t":"счёт типа «С»","x":"Foreign dividends accumulate in type-C accounts."},{"w":"Government Commission approval","t":"одобрение правительственной комиссии","x":"Exit deals need Government Commission approval."},{"w":"voluntary contribution","t":"добровольный взнос в бюджет","x":"The buyer paid a voluntary contribution of 35%."},{"w":"re-domiciliation","t":"редомициляция","x":"Re-domiciliation unlocked dividends for local holders."},{"w":"special administrative region (SAR)","t":"специальный административный район (САР)","x":"The holding moved to the Kaliningrad SAR."},{"w":"blocking sanctions (SDN)","t":"блокирующие санкции","x":"The bank is under blocking sanctions."}]}],"units":{"1":["Statements and cash","Отчётность и денежные потоки"],"2":["Valuation and modelling","Оценка и моделирование"],"3":["Markets and instruments","Рынки и инструменты"],"4":["Deals, debt, macro, accounting","Сделки, долг, макро, учёт"]}}</script>
