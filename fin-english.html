<script type="application/json" id="edata">{"lessons":[{"n":1,"title":"What finance is about: money, time and risk","short":"Три идеи, на которых стоят все финансы: деньги сегодня дороже денег завтра, риск требует платы, цена — это ожидания","level":"B1","unit":1,"min":8,"id":"what-finance-is","theory":"## Three ideas behind everything\n\nFinance (финансы) is the study of how people, companies and governments get money, spend it, and move it through time. Almost every topic in this course comes from three simple ideas.\n\n**First: money has a time value (временная стоимость денег).** A rouble today is worth more than a rouble next year, because today you can invest it (инвестировать), earn interest (проценты) and have more than a rouble next year. So when we compare money in different years, we must adjust (скорректировать) it. This idea is called discounting (дисконтирование) and we will study it in Topic 6.\n\n**Second: risk needs a reward (риск требует вознаграждения).** If two investments promise the same return (доходность), but one is riskier, nobody will choose the risky one. To attract investors (инвесторы), a risky asset (актив) must offer a higher expected return (ожидаемая доходность). This extra return is called a risk premium (премия за риск).\n\n**Third: the price of an asset is the present value of what it will give you.** A share (акция) is worth the cash it will pay its owner in the future, discounted to today. The same is true for a bond (облигация), a building or a whole company. This is why finance people spend so much time forecasting cash flows (денежные потоки): the forecast is the price.\n\n> **Remember.** Time, risk, and future cash flows. If you understand how these three connect, you understand the logic of finance.\n\n## Who does what in finance\n\nThe industry (отрасль) is large, so here is a short map.\n\n| Area | What they do | Typical employer |\n|---|---|---|\n| Corporate finance (корпоративные финансы) | Decide how a company raises money and what to invest in | Any large company, the CFO's team |\n| Investment banking, IB (инвестиционный банкинг) | Advise on mergers and acquisitions, help companies issue shares and bonds | Investment banks, boutiques |\n| Asset management (управление активами) | Invest other people's money in portfolios | Funds, pension funds, insurers |\n| Sales and trading (продажи и торговля) | Buy and sell securities for clients and the bank itself | Banks, brokers |\n| Private equity, PE (прямые инвестиции) | Buy whole companies, improve them, sell them later | PE funds |\n| Equity research (аналитика по акциям) | Write reports and recommendations on listed companies | Banks, independent firms |\n\nThe chief financial officer, CFO (финансовый директор) manages money inside a company. An analyst (аналитик) and an associate (ассоциат, младший сотрудник) are the first two job titles in a bank. A managing director, MD (управляющий директор) is a senior banker who brings in clients.\n\n## Two sides of a company\n\nEvery company can be described from two sides. On one side are its assets (активы): factories, inventory (запасы), cash (денежные средства), brands. On the other side is the money that paid for those assets. That money comes from two sources: debt (долг, заёмный капитал), which must be repaid with interest, and equity (собственный капитал), which belongs to the owners, the shareholders (акционеры).\n\nThe split between debt and equity is called the capital structure (структура капитала). Debt is cheaper, because interest is tax-deductible (вычитается из налоговой базы) and lenders (кредиторы) take less risk. But too much debt can push a company into default (дефолт, неплатёж) and bankruptcy (банкротство). Finding the right balance is one of the main jobs of corporate finance.\n\n## Primary and secondary markets\n\nWhen a company sells new shares or bonds to investors for the first time, this happens on the primary market (первичный рынок). The most famous example is an initial public offering, IPO (первичное публичное размещение акций). After that, investors trade those securities (ценные бумаги) with each other on the secondary market (вторичный рынок), for example on a stock exchange (фондовая биржа) such as the Moscow Exchange, MOEX (Московская биржа) or the New York Stock Exchange, NYSE (Нью-Йоркская фондовая биржа).\n\nThe company does not receive money from secondary-market trading. But the secondary market matters a lot: it sets the market price (рыночная цена), and that price tells the company how cheaply it can raise new money.\n\n## Return, yield and growth\n\nThree words look similar but mean different things.\n\n- **Return (доходность, отдача)** is how much you earned on an investment over a period, usually in percent: price change plus any income.\n- **Yield (доходность, обычно по облигациям или дивидендам)** is the income an asset pays relative to its price, for example a dividend yield (дивидендная доходность) of 8% or a bond yield (доходность облигации) of 15%.\n- **Growth (рост)** is how fast something increases: revenue growth (рост выручки), earnings growth (рост прибыли), GDP growth (рост ВВП).\n\nA classic mistake is to mix yield and return. A bond with a 15% yield can give a negative return in a year if its price falls.\n\n## Nominal and real\n\nPrices in finance can be nominal (номинальный), that is, in today's money without adjusting for inflation (инфляция), or real (реальный), adjusted for inflation. If your deposit (вклад) pays 14% and inflation is 7%, your real return is about 7%. Central banks (центральные банки) think in real terms when they set the key rate (ключевая ставка). We come back to this in Topic 19.\n\n## Why finance people love ratios\n\nA number alone says little. Revenue of 100 billion roubles is huge for a start-up (стартап) and small for an oil major (крупная нефтяная компания). That is why finance uses ratios (коэффициенты, мультипликаторы): profit divided by revenue, debt divided by earnings, price divided by earnings. A ratio makes companies of different sizes comparable (сопоставимыми). Most of this course is about which ratios matter and how to read them.\n\n> **Remember.** Always ask three questions about a number: compared with what, over what period, and in which currency and prices (nominal or real).","words":[{"w":"time value of money","t":"временная стоимость денег","x":"The time value of money explains why we discount future cash flows."},{"w":"risk premium","t":"премия за риск","x":"Investors demand a risk premium for holding emerging-market stocks."},{"w":"cash flow","t":"денежный поток","x":"The company generates strong cash flow from its core business."},{"w":"asset","t":"актив","x":"A factory, a patent and cash are all assets."},{"w":"debt","t":"долг, заёмный капитал","x":"The company raised debt to finance the new plant."},{"w":"equity","t":"собственный капитал, акции","x":"They issued new equity to reduce leverage."},{"w":"shareholder","t":"акционер","x":"Shareholders vote at the annual general meeting."},{"w":"lender","t":"кредитор","x":"The lender asked for collateral before approving the loan."},{"w":"capital structure","t":"структура капитала","x":"A balanced capital structure lowers the cost of capital."},{"w":"primary market","t":"первичный рынок","x":"Companies raise money on the primary market."},{"w":"secondary market","t":"вторичный рынок","x":"Shares change hands on the secondary market every day."},{"w":"stock exchange","t":"фондовая биржа","x":"The stock is listed on the Moscow Exchange."},{"w":"return","t":"доходность, отдача","x":"The fund delivered a 12% return last year."},{"w":"yield","t":"доходность (по облигациям, дивидендам)","x":"The bond yield rose to 15% after the rate hike."},{"w":"nominal / real","t":"номинальный / реальный","x":"Real wages fell although nominal wages grew."},{"w":"inflation","t":"инфляция","x":"High inflation erodes the value of savings."},{"w":"key rate","t":"ключевая ставка","x":"The central bank kept the key rate at 14%."},{"w":"ratio","t":"коэффициент, мультипликатор","x":"Analysts compare companies using ratios, not absolute numbers."},{"w":"investment banking","t":"инвестиционный банкинг","x":"Investment banking advises on deals and raises capital for clients."},{"w":"private equity","t":"прямые инвестиции","x":"Private equity funds buy companies and sell them a few years later."}]},{"n":2,"title":"The three financial statements and how they connect","short":"Отчёт о прибылях, баланс и отчёт о движении денег: что показывает каждый и как одна цифра переходит из отчёта в отчёт","level":"B1","unit":1,"min":9,"id":"three-statements","theory":"## Why three statements, not one\n\nA company reports its results in financial statements (финансовая отчётность). There are three main ones, and each answers a different question.\n\n| Statement | Question it answers | Period or moment |\n|---|---|---|\n| Income statement (отчёт о прибылях и убытках, ОФР) | Did the company earn a profit this period? | A period: quarter or year |\n| Balance sheet (бухгалтерский баланс) | What does the company own and owe right now? | A moment: the last day of the period |\n| Cash flow statement (отчёт о движении денежных средств, ОДДС) | Where did cash come from and where did it go? | A period |\n\nWhy not one statement? Because profit (прибыль) and cash (денежные средства) are different things. A company can show a profit and still run out of cash, for example when customers pay late. And the balance sheet is a photo, while the other two are a film of the period.\n\nTogether they are often called \"the three statements\", and the classic interview question is \"Walk me through the three statements\": explain how a change in one flows into the others.\n\n## The income statement in one paragraph\n\nThe income statement (also called the P&L, profit and loss statement) starts with revenue (выручка), the money earned from selling goods and services. Then it subtracts costs step by step: cost of goods sold, COGS (себестоимость), operating expenses (операционные расходы), depreciation (амортизация основных средств) and amortization (амортизация нематериальных активов), interest (проценты) and taxes (налоги). What is left is net income (чистая прибыль). Along the way we get important intermediate lines such as gross profit (валовая прибыль) and operating profit, also called EBIT (Earnings Before Interest and Taxes, прибыль до процентов и налогов). Topic 3 covers this in detail.\n\n## The balance sheet in one paragraph\n\nThe balance sheet lists assets (активы) on one side and, on the other, liabilities (обязательства) and shareholders' equity (собственный капитал). The key equation is:\n\n> **Assets = Liabilities + Equity.** Everything the company owns was paid for either with someone else's money (liabilities) or with the owners' money (equity).\n\nAssets are split into current assets (оборотные активы), which turn into cash within a year, such as cash itself, receivables (дебиторская задолженность) and inventory (запасы), and non-current assets (внеоборотные активы), such as property, plant and equipment, PP&E (основные средства) and goodwill (гудвил, деловая репутация). Liabilities are split the same way: current liabilities (краткосрочные обязательства), for example payables (кредиторская задолженность), and long-term debt (долгосрочный долг). Topic 4 goes deeper.\n\n## The cash flow statement in one paragraph\n\nThe cash flow statement has three sections. Cash flow from operations, CFO (денежный поток от операционной деятельности) shows cash generated by the core business. Cash flow from investing, CFI (от инвестиционной деятельности) shows money spent on capital expenditures, capex (капитальные затраты) and acquisitions, or received from selling assets. Cash flow from financing, CFF (от финансовой деятельности) shows debt raised or repaid, dividends (дивиденды) paid and shares issued or bought back. The sum of the three is the change in cash for the period.\n\n## How the statements connect\n\nThis is the part everyone must know. There are three links.\n\n**Link 1: net income goes to equity.** Net income from the income statement increases retained earnings (нераспределённая прибыль), which is part of equity on the balance sheet. Dividends reduce it.\n\n**Link 2: net income starts the cash flow statement.** CFO begins with net income, then adds back non-cash expenses (неденежные расходы) such as depreciation, and adjusts for changes in working capital (оборотный капитал): if receivables grew, cash is lower than profit, because customers have not paid yet.\n\n**Link 3: the change in cash lands on the balance sheet.** The closing cash on the cash flow statement is the cash line on the balance sheet. Capex increases PP&E; new debt increases liabilities; dividends reduce equity.\n\n## A worked example: depreciation goes up by 10\n\nInterviewers love this question: \"Depreciation increases by 10. What happens to the three statements?\" Assume a 20% tax rate (ставка налога).\n\n1. **Income statement.** Operating profit falls by 10. Taxes fall by 2. Net income falls by 8.\n2. **Cash flow statement.** Start with net income, which is 8 lower. Add back depreciation of 10, because it is a non-cash expense. Cash flow from operations rises by 2. Cash is up by 2.\n3. **Balance sheet.** Cash is up 2, PP&E is down 10, so assets are down 8. Retained earnings are down 8, so equity is down 8. Both sides fall by 8: the balance sheet balances (баланс сходится).\n\nThe lesson: a higher non-cash expense reduces profit but increases cash, because of the tax saving. This tax effect is called a tax shield (налоговый щит).\n\n## Where the statements come from\n\nCompanies prepare statements under an accounting standard (стандарт учёта). International Financial Reporting Standards, IFRS (МСФО, Международные стандарты финансовой отчётности) are used in most of the world, including Russian public companies. US GAAP (Generally Accepted Accounting Principles, ОПБУ США) is used in the United States. Russian companies also prepare RAS (Russian Accounting Standards, РСБУ) for tax and legal purposes. The logic is the same; the details differ, for example in how leases (аренда) or inventory are recorded.\n\nPublic companies (публичные компании) publish statements every quarter (квартал) and every year. An annual report (годовой отчёт) is audited (проверен аудитором) by an independent auditor (аудитор), which is why the Big Four audit firms (Deloitte, PwC, EY, KPMG) are so important.\n\n> **Remember.** Income statement = performance over a period. Balance sheet = position at a moment. Cash flow statement = movement of cash. Net income links all three.","words":[{"w":"financial statements","t":"финансовая отчётность","x":"The company publishes its financial statements every quarter."},{"w":"income statement (P&L)","t":"отчёт о прибылях и убытках","x":"The income statement shows revenue, costs and net income."},{"w":"balance sheet","t":"бухгалтерский баланс","x":"The balance sheet is a snapshot of assets and liabilities."},{"w":"cash flow statement","t":"отчёт о движении денежных средств","x":"The cash flow statement explains why cash changed."},{"w":"revenue","t":"выручка","x":"Revenue grew 12% year on year."},{"w":"net income","t":"чистая прибыль","x":"Net income is the bottom line of the income statement."},{"w":"assets","t":"активы","x":"Current assets include cash, receivables and inventory."},{"w":"liabilities","t":"обязательства","x":"Liabilities are what the company owes."},{"w":"shareholders' equity","t":"собственный капитал","x":"Equity equals assets minus liabilities."},{"w":"retained earnings","t":"нераспределённая прибыль","x":"Retained earnings grow when the company keeps its profit."},{"w":"receivables","t":"дебиторская задолженность","x":"Rising receivables mean customers are paying more slowly."},{"w":"payables","t":"кредиторская задолженность","x":"The firm stretched its payables to save cash."},{"w":"inventory","t":"запасы","x":"Inventory is counted as a current asset."},{"w":"PP&E (property, plant and equipment)","t":"основные средства","x":"Capex increases PP&E on the balance sheet."},{"w":"depreciation","t":"амортизация","x":"Depreciation is a non-cash expense."},{"w":"working capital","t":"оборотный капитал","x":"An increase in working capital reduces operating cash flow."},{"w":"capital expenditures (capex)","t":"капитальные затраты","x":"The company plans heavy capex next year."},{"w":"non-cash expense","t":"неденежный расход","x":"We add back non-cash expenses when we calculate cash flow."},{"w":"tax shield","t":"налоговый щит","x":"Interest creates a tax shield because it is deductible."},{"w":"IFRS","t":"МСФО","x":"Russian public companies report under IFRS."},{"w":"audit","t":"аудит, аудиторская проверка","x":"The annual report was audited by an independent firm."}]},{"n":3,"title":"The income statement: from revenue to net income","short":"Каждая строка от выручки до чистой прибыли, что такое EBITDA и маржа, и почему прибыль не равна деньгам","level":"B2","unit":1,"min":9,"id":"income-statement","theory":"## The waterfall of profit\n\nThe income statement (отчёт о прибылях и убытках) is a waterfall: it starts with everything the company earned and subtracts costs in a fixed order until only net income (чистая прибыль) is left. Here is the standard structure.\n\n| Line | What it is | Russian |\n|---|---|---|\n| Revenue (sales, top line) | Money earned from selling goods and services | Выручка |\n| − Cost of goods sold, COGS | Direct costs of what was sold: materials, factory labour | Себестоимость |\n| = Gross profit | What is left after direct costs | Валовая прибыль |\n| − Operating expenses, OPEX (SG&A, R&D) | Salaries of office staff, marketing, rent, research | Операционные расходы |\n| = EBITDA | Earnings before interest, taxes, depreciation and amortization | Прибыль до процентов, налогов и амортизации |\n| − Depreciation and amortization, D&A | Wear of equipment and intangible assets spread over years | Амортизация |\n| = EBIT (operating profit) | Earnings before interest and taxes | Операционная прибыль |\n| − Interest expense (+ interest income) | Cost of debt | Процентные расходы |\n| = EBT (pre-tax profit) | Earnings before taxes | Прибыль до налогообложения |\n| − Income tax | Corporate tax | Налог на прибыль |\n| = Net income (bottom line) | Profit for shareholders | Чистая прибыль |\n\nTwo slang words: the top line (верхняя строка) means revenue, the bottom line (нижняя строка, итог) means net income. \"Top-line growth\" is revenue growth; \"it hurts the bottom line\" means it reduces profit.\n\n## Revenue: when is a sale a sale?\n\nRevenue is recognised (признаётся) when the company delivers the product or service, not when it receives cash. This is the accrual principle (принцип начисления). If a software company sells a one-year subscription (подписка) for 12,000 roubles in January, it recognises 1,000 roubles of revenue each month. The cash arrived in January, but the revenue is spread over the year. The unearned part sits on the balance sheet as deferred revenue (отложенная выручка), a liability.\n\nThis is why revenue can differ from cash collected, and why analysts check receivables (дебиторская задолженность): if revenue grows but receivables grow faster, the company may be booking sales that customers will never pay for.\n\n## COGS and gross margin\n\nCost of goods sold (себестоимость) includes only the direct costs of the products sold: raw materials, factory workers, energy for the plant. Gross profit divided by revenue is the gross margin (валовая маржа, валовая рентабельность). It shows the basic economics of the product. A software company may have a gross margin of 80%; a supermarket chain, 25%; an oil company, somewhere between, depending on oil prices.\n\n## OPEX, SG&A and R&D\n\nOperating expenses (операционные расходы) are the costs of running the business that are not tied to a specific unit of product. The two big groups are selling, general and administrative expenses, SG&A (коммерческие, общие и административные расходы), which include marketing, head-office salaries and rent, and research and development, R&D (расходы на исследования и разработки).\n\n## EBITDA: the favourite number of bankers\n\nEBITDA (Earnings Before Interest, Taxes, Depreciation and Amortization — прибыль до вычета процентов, налогов и амортизации) is not a line in the official statement under IFRS, but everyone calculates it. Why? Because it shows operating performance (операционные результаты) without three things that depend on history or policy, not on the business: how the company is financed (interest), where it pays tax (taxes) and how old its equipment is (depreciation).\n\nEBITDA margin (рентабельность по EBITDA) = EBITDA / Revenue. It is the most common way to compare the profitability (прибыльность, рентабельность) of companies in one industry. It is also the base for the most popular multiple, EV/EBITDA (Topic 9), and for the main debt ratio, Net debt/EBITDA (Topic 18).\n\nCritics say EBITDA is \"earnings before everything bad\". It ignores capex (капитальные затраты): a company with huge EBITDA that must spend it all on new equipment is not rich. That is why we also look at cash flow (Topic 5).\n\n## Depreciation and amortization\n\nWhen a company buys a machine for 100 million roubles that will work for ten years, it does not record a 100 million expense in year one. It records 10 million each year as depreciation (амортизация основных средств). The same logic for intangible assets (нематериальные активы) such as licences and software is called amortization (амортизация нематериальных активов). Both are non-cash expenses (неденежные расходы): the cash left when the machine was bought. This is the main reason profit and cash differ.\n\n## Interest and taxes\n\nInterest expense (процентные расходы) is the cost of debt. It is deducted before tax, so debt reduces the tax bill: the tax shield (налоговый щит). Income tax (налог на прибыль) in Russia is 25% from 2025; in many countries, 20–30%. The effective tax rate (эффективная ставка налога) is tax actually paid divided by pre-tax profit, and it often differs from the official rate.\n\n## Net income and EPS\n\nNet income belongs to shareholders. Divided by the number of shares outstanding (акции в обращении), it gives earnings per share, EPS (прибыль на акцию), the number quoted in every earnings release (пресс-релиз о результатах). Diluted EPS (разводнённая прибыль на акцию) also counts shares that may appear from options and convertible bonds. The company can pay net income out as dividends (дивиденды) or keep it as retained earnings (нераспределённая прибыль).\n\n## Margins: the language of profitability\n\nEvery profit line divided by revenue gives a margin (маржа, рентабельность):\n\n- Gross margin = Gross profit / Revenue\n- EBITDA margin = EBITDA / Revenue\n- Operating margin (операционная рентабельность) = EBIT / Revenue\n- Net margin (чистая рентабельность) = Net income / Revenue\n\nWhen an analyst says \"margins are expanding\" (маржа растёт), it means profit is growing faster than revenue. \"Margin compression\" (сжатие маржи) is the opposite, often caused by rising costs the company cannot pass on to customers.\n\n## One-offs and adjusted numbers\n\nCompanies often report adjusted EBITDA (скорректированная EBITDA) or adjusted net income, excluding one-off items (разовые статьи): a fine, a write-off (списание), a gain on selling a building. The idea is to show recurring (регулярные, повторяющиеся) results. Be careful: some companies \"adjust\" every year, and the one-offs become suspiciously regular.\n\n> **Remember.** Revenue → Gross profit → EBITDA → EBIT → EBT → Net income. Each step subtracts one group of costs. EBITDA is the banker's favourite because it ignores financing, tax and the age of equipment.","words":[{"w":"top line","t":"выручка (разг.)","x":"Top-line growth slowed to 5% this quarter."},{"w":"bottom line","t":"чистая прибыль, итог (разг.)","x":"The strong rouble hurt the bottom line."},{"w":"cost of goods sold (COGS)","t":"себестоимость","x":"COGS rose because of higher steel prices."},{"w":"gross profit","t":"валовая прибыль","x":"Gross profit equals revenue minus COGS."},{"w":"gross margin","t":"валовая маржа","x":"Software firms enjoy gross margins above 70%."},{"w":"operating expenses (OPEX)","t":"операционные расходы","x":"The company cut operating expenses by 10%."},{"w":"SG&A","t":"коммерческие, общие и административные расходы","x":"Marketing is part of SG&A."},{"w":"R&D","t":"расходы на исследования и разработки","x":"R&D spending is high in pharma."},{"w":"EBITDA","t":"прибыль до процентов, налогов и амортизации","x":"EBITDA margin reached 35%."},{"w":"EBIT (operating profit)","t":"операционная прибыль","x":"EBIT fell after the depreciation charge increased."},{"w":"interest expense","t":"процентные расходы","x":"Interest expense doubled after the new bond issue."},{"w":"pre-tax profit (EBT)","t":"прибыль до налогообложения","x":"Pre-tax profit was 2 billion roubles."},{"w":"income tax","t":"налог на прибыль","x":"Income tax is 25% in Russia from 2025."},{"w":"effective tax rate","t":"эффективная ставка налога","x":"The effective tax rate was 22%."},{"w":"earnings per share (EPS)","t":"прибыль на акцию","x":"EPS beat analysts' expectations."},{"w":"shares outstanding","t":"акции в обращении","x":"The company has 1 billion shares outstanding."},{"w":"accrual principle","t":"принцип начисления","x":"Under the accrual principle, revenue is booked when delivered."},{"w":"deferred revenue","t":"отложенная выручка","x":"Deferred revenue is cash received for services not yet delivered."},{"w":"one-off item","t":"разовая статья","x":"The loss was caused by a one-off write-off."},{"w":"margin compression","t":"сжатие маржи","x":"Rising wages led to margin compression."},{"w":"recurring","t":"регулярный, повторяющийся","x":"Investors prefer recurring revenue."}]},{"n":4,"title":"The balance sheet and working capital","short":"Активы, обязательства и капитал, оборотный капитал и чистый долг: как читать баланс и что в нём ищут банкиры","level":"B2","unit":1,"min":9,"id":"balance-sheet","theory":"## A snapshot, not a film\n\nThe balance sheet (бухгалтерский баланс) shows what a company owns and owes on one date, usually 31 December or the last day of a quarter. The two sides must always be equal:\n\n> **Assets = Liabilities + Shareholders' equity.** Активы = Обязательства + Собственный капитал.\n\nThink of buying a flat for 10 million roubles with a 7 million mortgage (ипотека) and 3 million of your own money. The flat is the asset (10). The mortgage is the liability (7). Your equity is 3. If the flat's value rises to 12, equity becomes 5; the bank still gets 7.\n\n## Assets: what the company owns\n\nAssets (активы) are listed in order of liquidity (ликвидность), that is, how fast they turn into cash.\n\n**Current assets (оборотные активы)** are expected to become cash within a year:\n\n- Cash and cash equivalents (денежные средства и эквиваленты): money in the bank and short deposits.\n- Accounts receivable (дебиторская задолженность): money customers owe for goods already delivered.\n- Inventory (запасы): raw materials, work in progress and finished goods.\n- Prepaid expenses (расходы будущих периодов): rent or insurance paid in advance.\n\n**Non-current assets (внеоборотные активы)** serve the business for many years:\n\n- Property, plant and equipment, PP&E (основные средства): land, buildings, machines, recorded at cost minus accumulated depreciation (накопленная амортизация).\n- Intangible assets (нематериальные активы): licences, software, patents, brands bought from others.\n- Goodwill (гудвил): the premium paid above book value when buying another company (Topic 16).\n- Long-term investments (долгосрочные финансовые вложения): stakes in other companies.\n\n## Liabilities: what the company owes\n\nLiabilities (обязательства) are also split by time.\n\n**Current liabilities (краткосрочные обязательства)** are due within a year: accounts payable (кредиторская задолженность) to suppliers, short-term debt (краткосрочный долг) and the current portion of long-term debt, accrued expenses (начисленные расходы) such as wages not yet paid, and taxes payable (задолженность по налогам).\n\n**Non-current liabilities (долгосрочные обязательства)**: long-term debt (долгосрочный долг), bonds (облигации), lease liabilities (обязательства по аренде) and deferred tax liabilities (отложенные налоговые обязательства).\n\n## Equity: what belongs to the owners\n\nShareholders' equity (собственный капитал) has three main parts: share capital (уставный капитал) and share premium (эмиссионный доход) paid by investors when shares were issued, retained earnings (нераспределённая прибыль) accumulated over the years, and treasury shares (казначейские акции), the company's own shares bought back, shown as a negative number. Equity is also called book value (балансовая стоимость). Note that market capitalization (рыночная капитализация), the price of all shares on the exchange, is usually very different from book value, because the market values future profits, while the balance sheet records history.\n\n## Working capital: the money stuck in the business\n\nNet working capital, NWC (чистый оборотный капитал) is the money a company needs to keep day-to-day operations running. The operating definition is:\n\n> **NWC = Receivables + Inventory − Payables.** (A broader definition: current assets minus current liabilities, excluding cash and debt.)\n\nWhy does it matter? Because growth eats cash. A retailer that opens new stores must fill them with inventory before it sells anything. A manufacturer that wins a big client must deliver goods and wait 60 days for payment. In both cases profit may look fine, but cash disappears into working capital. An increase in NWC is a cash outflow (отток денег); a decrease is an inflow (приток).\n\nAnalysts measure working capital in days:\n\n- Days sales outstanding, DSO (оборачиваемость дебиторской задолженности в днях) = Receivables / Revenue × 365. How long customers take to pay.\n- Days inventory outstanding, DIO (оборачиваемость запасов в днях) = Inventory / COGS × 365. How long goods sit in the warehouse.\n- Days payable outstanding, DPO (оборачиваемость кредиторской задолженности в днях) = Payables / COGS × 365. How long the company takes to pay suppliers.\n\nThe cash conversion cycle (цикл оборота денежных средств) = DSO + DIO − DPO. The shorter, the better. Some businesses have a negative cycle: a supermarket sells goods for cash today and pays suppliers in 45 days, so suppliers finance the store.\n\n## Net debt: the number bankers look at first\n\nGross debt (валовой долг) is all interest-bearing liabilities (процентные обязательства): loans, bonds, leases. Net debt (чистый долг) subtracts cash:\n\n> **Net debt = Total debt − Cash and equivalents.**\n\nNet debt is used because a company with 100 of debt and 100 of cash is not really in debt. The key ratio is Net debt / EBITDA (чистый долг к EBITDA): below 1x is conservative, 2–3x is normal for a stable business, above 4x is risky. Lenders put this ratio into loan agreements as a covenant (ковенант, Topic 18).\n\nIf cash exceeds debt, the company has a net cash position (чистая денежная позиция). In Russia, Surgutneftegas is the famous example, with its huge foreign-currency deposits.\n\n## Leases and off-balance-sheet items\n\nSince IFRS 16 (2019), leases (аренда) are on the balance sheet: a right-of-use asset (актив в форме права пользования) and a lease liability. Before that, long-term rent was off-balance-sheet (забалансовое обязательство), which made retailers and airlines look less indebted than they were. When comparing companies, check whether lease liabilities are included in debt.\n\n## Reading a balance sheet quickly\n\n1. Is there enough liquidity? Compare current assets with current liabilities: the current ratio (коэффициент текущей ликвидности). Below 1 means the company may struggle to pay bills this year.\n2. How much debt? Net debt / EBITDA and Debt / Equity (долг к капиталу).\n3. Is working capital growing faster than revenue? If yes, something is wrong with collection or inventory.\n4. How big is goodwill? Large goodwill means the company grew by acquisitions and may face an impairment (обесценение) if those deals disappoint.\n\n> **Remember.** The balance sheet balances. Net debt = debt − cash. Working capital is cash stuck in receivables and inventory. Growth needs working capital, so growth needs cash.","words":[{"w":"snapshot","t":"моментальный снимок","x":"The balance sheet is a snapshot at year end."},{"w":"liquidity","t":"ликвидность","x":"Cash is the most liquid asset."},{"w":"current assets","t":"оборотные активы","x":"Inventory and receivables are current assets."},{"w":"non-current assets","t":"внеоборотные активы","x":"PP&E is the largest non-current asset for a steelmaker."},{"w":"accounts receivable","t":"дебиторская задолженность","x":"Accounts receivable rose because of slow-paying clients."},{"w":"accounts payable","t":"кредиторская задолженность","x":"Accounts payable are amounts owed to suppliers."},{"w":"intangible assets","t":"нематериальные активы","x":"Patents and software are intangible assets."},{"w":"goodwill","t":"гудвил, деловая репутация","x":"Goodwill appears after an acquisition."},{"w":"accrued expenses","t":"начисленные расходы","x":"Unpaid wages are accrued expenses."},{"w":"lease liability","t":"обязательство по аренде","x":"IFRS 16 brought lease liabilities onto the balance sheet."},{"w":"share capital","t":"уставный капитал","x":"Share capital is the nominal value of issued shares."},{"w":"treasury shares","t":"казначейские акции","x":"Treasury shares reduce equity."},{"w":"book value","t":"балансовая стоимость","x":"The stock trades below book value."},{"w":"market capitalization","t":"рыночная капитализация","x":"Market capitalization is price times shares outstanding."},{"w":"net working capital (NWC)","t":"чистый оборотный капитал","x":"Growth in NWC consumed most of the cash flow."},{"w":"cash conversion cycle","t":"цикл оборота денежных средств","x":"A short cash conversion cycle frees up cash."},{"w":"net debt","t":"чистый долг","x":"Net debt to EBITDA stood at 1.5x."},{"w":"net cash position","t":"чистая денежная позиция","x":"The company has a net cash position after the asset sale."},{"w":"current ratio","t":"коэффициент текущей ликвидности","x":"A current ratio below 1 is a warning sign."},{"w":"off-balance-sheet","t":"забалансовый","x":"Operating leases used to be off-balance-sheet."},{"w":"impairment","t":"обесценение","x":"The company booked a goodwill impairment of 5 billion roubles."}]},{"n":5,"title":"Cash flow and free cash flow","short":"Три раздела отчёта о движении денег, как от чистой прибыли дойти до операционного потока, и что такое FCF, FCFF и FCFE","level":"B2","unit":1,"min":9,"id":"cash-flow","theory":"## Cash is a fact, profit is an opinion\n\nThere is an old saying in finance: \"Profit is an opinion, cash is a fact\" (прибыль — это мнение, деньги — это факт). Profit depends on accounting choices: how fast you depreciate a machine, when you recognise revenue, what you call a one-off. Cash in the bank account does not depend on opinions. That is why investors, lenders and valuation models (модели оценки) focus on cash flow (денежный поток).\n\nThe cash flow statement (отчёт о движении денежных средств) explains why the cash balance changed during the period. It has three sections.\n\n## Section 1: cash flow from operations (CFO)\n\nCash flow from operating activities (денежный поток от операционной деятельности) is the cash generated by the core business. Under the indirect method (косвенный метод), which almost all companies use, it starts from net income and makes two kinds of adjustments:\n\n1. **Add back non-cash expenses (неденежные расходы).** Depreciation and amortization reduced profit, but no cash left the company. The same for impairments (обесценение) and share-based compensation (вознаграждение акциями).\n2. **Adjust for changes in working capital (изменение оборотного капитала).** If receivables grew by 50, customers owe 50 more than before, so cash is 50 lower than profit: subtract 50. If payables grew, the company delayed paying suppliers, so cash is higher: add. If inventory grew, cash was spent on stock: subtract.\n\n> **CFO = Net income + D&A + other non-cash items − Increase in working capital.**\n\nA healthy company has CFO higher than net income, because D&A is added back. If CFO is consistently lower than net income, profit may be of low quality (низкое качество прибыли): sales are booked but not collected.\n\n## Section 2: cash flow from investing (CFI)\n\nCash flow from investing activities (от инвестиционной деятельности) is usually negative. It includes capital expenditures, capex (капитальные затраты) on new equipment and buildings, purchases of other companies (acquisitions, поглощения), and purchases of financial assets. Sales of assets (divestments, продажа активов) are inflows.\n\nAnalysts split capex into maintenance capex (поддерживающие капзатраты), needed just to keep the business running, and growth capex (капзатраты на рост), spent to expand. Companies rarely disclose the split, so it is often estimated as roughly equal to depreciation.\n\n## Section 3: cash flow from financing (CFF)\n\nCash flow from financing activities (от финансовой деятельности) shows money moving between the company and its investors: debt raised (привлечение долга) is an inflow, debt repaid (погашение долга) an outflow; shares issued (выпуск акций) an inflow; dividends paid (выплата дивидендов) and share buybacks (обратный выкуп акций) are outflows.\n\nThe sum of the three sections, plus the effect of exchange rates (курсовые разницы) on foreign-currency cash, equals the change in cash for the period.\n\n## Free cash flow: what is really left\n\nFree cash flow, FCF (свободный денежный поток) is the cash the company generates after the investment needed to keep and grow the business. The simplest definition:\n\n> **FCF = CFO − Capex.**\n\nThis is the cash available to repay debt, pay dividends, buy back shares or make acquisitions. FCF yield (доходность по свободному денежному потоку) = FCF / Market capitalization. In Russia, dividend policies (дивидендная политика) of companies such as Lukoil are tied to FCF, so investors watch it closely.\n\n## FCFF and FCFE: two versions for valuation\n\nFor valuation (Topic 8) we need two more precise versions.\n\n**Free cash flow to the firm, FCFF (свободный денежный поток для фирмы)** is the cash available to all capital providers (поставщики капитала), both lenders and shareholders, before any interest payments:\n\n> **FCFF = EBIT × (1 − tax rate) + D&A − Capex − Increase in NWC.**\n\nEBIT × (1 − t) is called NOPAT (Net Operating Profit After Tax, чистая операционная прибыль после налогов). We start from EBIT, not net income, because interest has not been subtracted yet: FCFF is \"unlevered\" (без учёта долга). Discounting FCFF at WACC gives enterprise value (стоимость предприятия).\n\n**Free cash flow to equity, FCFE (свободный денежный поток для акционеров)** is what is left for shareholders only, after interest and after net borrowing:\n\n> **FCFE = FCFF − Interest × (1 − tax rate) + Net borrowing.**\n\nNet borrowing (чистое привлечение долга) is new debt minus repayments. FCFE is \"levered\" (с учётом долга). Discounting FCFE at the cost of equity gives equity value (стоимость собственного капитала).\n\n## Why cash and profit diverge: a checklist\n\n| Situation | Effect on profit | Effect on cash |\n|---|---|---|\n| Big investment in new plant | Small (depreciation starts) | Large outflow now |\n| Customers pay 90 days late | None | Lower CFO |\n| Inventory build-up before season | None | Lower CFO |\n| Goodwill impairment | Large loss | None |\n| Dividend paid | None | Outflow in CFF |\n| Debt refinanced | None | Inflow and outflow in CFF |\n\n## Cash burn and runway\n\nFor start-ups (стартапы) and loss-making companies the vocabulary is different. Cash burn (сжигание денег) is how much cash the company loses per month. Runway (запас хода) is how many months of cash it has left: cash divided by monthly burn. \"We have 18 months of runway\" means the company must raise money or become profitable within 18 months.\n\n> **Remember.** CFO starts with net income, adds back non-cash expenses, subtracts working capital growth. FCF = CFO − Capex. FCFF is for everyone (discount at WACC), FCFE is for shareholders (discount at cost of equity).","words":[{"w":"cash flow from operations (CFO)","t":"операционный денежный поток","x":"CFO exceeded net income thanks to depreciation."},{"w":"cash flow from investing (CFI)","t":"инвестиционный денежный поток","x":"CFI was negative because of heavy capex."},{"w":"cash flow from financing (CFF)","t":"финансовый денежный поток","x":"CFF shows dividends and debt repayment."},{"w":"indirect method","t":"косвенный метод","x":"Under the indirect method we start from net income."},{"w":"add back","t":"прибавить обратно","x":"We add back depreciation because it is non-cash."},{"w":"share-based compensation","t":"вознаграждение акциями","x":"Share-based compensation is a non-cash expense."},{"w":"quality of earnings","t":"качество прибыли","x":"Low cash conversion raises questions about the quality of earnings."},{"w":"maintenance capex","t":"поддерживающие капзатраты","x":"Maintenance capex roughly equals depreciation."},{"w":"growth capex","t":"капзатраты на рост","x":"Growth capex will double next year."},{"w":"acquisition","t":"поглощение, покупка компании","x":"The acquisition was paid for in cash."},{"w":"divestment","t":"продажа актива","x":"The divestment of the retail unit brought in 3 billion roubles."},{"w":"share buyback","t":"обратный выкуп акций","x":"The board approved a share buyback programme."},{"w":"free cash flow (FCF)","t":"свободный денежный поток","x":"FCF yield is above 10%."},{"w":"FCFF","t":"свободный денежный поток для фирмы","x":"We discount FCFF at WACC."},{"w":"FCFE","t":"свободный денежный поток для акционеров","x":"FCFE equals FCFF minus after-tax interest plus net borrowing."},{"w":"NOPAT","t":"чистая операционная прибыль после налогов","x":"NOPAT is EBIT times one minus the tax rate."},{"w":"unlevered / levered","t":"без учёта долга / с учётом долга","x":"Unlevered cash flow ignores interest."},{"w":"net borrowing","t":"чистое привлечение долга","x":"Net borrowing was positive as the company refinanced."},{"w":"cash burn","t":"сжигание денег","x":"The start-up's cash burn is 2 million dollars a month."},{"w":"runway","t":"запас хода (месяцев денег)","x":"They have twelve months of runway."}]},{"n":6,"title":"Time value of money: discounting, NPV and IRR","short":"Приведённая и будущая стоимость, ставка дисконтирования, аннуитет, перпетуитет, NPV и IRR на простых числах","level":"B2","unit":2,"min":9,"id":"time-value-of-money","theory":"## Why a rouble today beats a rouble tomorrow\n\nThe time value of money (временная стоимость денег) is the idea that money available now is worth more than the same amount in the future. Three reasons: you can invest it and earn interest (проценты), inflation (инфляция) reduces what money buys, and the future is uncertain (неопределённое). Everything in valuation is built on this idea.\n\n## Future value: compounding\n\nIf you put 100 in a deposit at 10% per year, after one year you have 110. After two years you have 121, not 120, because in the second year you earn interest on the interest. This is compounding (сложные проценты, капитализация). The formula for future value (будущая стоимость):\n\n> **FV = PV × (1 + r)^n**, where PV is the present value (приведённая, текущая стоимость), r is the interest rate (процентная ставка) per period and n is the number of periods.\n\nCompounding is powerful over long horizons: 100 at 10% becomes 259 after ten years and 1,745 after thirty.\n\n## Present value: discounting\n\nDiscounting (дисконтирование) is compounding in reverse. If you will receive 121 in two years and rates are 10%, that promise is worth 100 today:\n\n> **PV = FV / (1 + r)^n.**\n\nThe rate used is called the discount rate (ставка дисконтирования). The factor 1 / (1 + r)^n is the discount factor (коэффициент дисконтирования). The higher the rate or the longer the wait, the smaller the present value. That is why a high key rate (ключевая ставка) hurts growth stocks: their profits are far in the future, and a high discount rate makes them worth less today.\n\n## Which rate to use\n\nThe discount rate should reflect the risk of the cash flow. A government bond (государственная облигация) coupon is nearly certain, so it is discounted at the risk-free rate (безрисковая ставка). A start-up's forecast is very uncertain, so investors may use 30–40%. For a company's cash flows we use the cost of capital (стоимость капитала), which is Topic 7. The general rule: the discount rate = risk-free rate + risk premium (премия за риск).\n\n## Annuity and perpetuity\n\nAn annuity (аннуитет) is a series of equal payments for a fixed number of periods, such as a mortgage (ипотека) or a bond coupon (купон). Its present value:\n\n> **PV of annuity = C × [1 − (1 + r)^−n] / r**, where C is the payment per period.\n\nA perpetuity (перпетуитет, бессрочная рента) is a payment that continues forever. The formula is beautifully simple:\n\n> **PV of perpetuity = C / r.**\n\nA growing perpetuity (растущий перпетуитет), where the payment grows at rate g each year, is worth C / (r − g). This formula is the Gordon growth model (модель Гордона) when applied to dividends, and the basis of the terminal value (терминальная стоимость) in a DCF (Topic 8). It only works when g is smaller than r.\n\nExample: a share pays a dividend of 10 next year, dividends grow 3% a year, and investors want 13%. Price = 10 / (0.13 − 0.03) = 100.\n\n## Net present value (NPV)\n\nNet present value (чистая приведённая стоимость) is the sum of all discounted cash flows of a project, including the initial investment (первоначальные инвестиции), which is negative:\n\n> **NPV = Σ CF_t / (1 + r)^t − Initial investment.**\n\nDecision rule: if NPV > 0, the project creates value (создаёт стоимость), accept it. If NPV < 0, reject. Example: invest 1,000 today, receive 600 at the end of year 1 and 600 at the end of year 2, discount rate 10%. PV = 600/1.1 + 600/1.21 = 545 + 496 = 1,041. NPV = 41 > 0: accept. In Excel: =NPV(rate; flows) + initial investment (the Russian version is ЧПС).\n\n## Internal rate of return (IRR)\n\nThe internal rate of return (внутренняя норма доходности) is the discount rate at which NPV equals zero. It is the project's own return. Decision rule: accept if IRR is higher than the required rate, often called the hurdle rate (пороговая ставка). In the example above, IRR is about 13%: higher than 10%, so accept. In Excel: =IRR(flows) (ВСД).\n\nIRR is popular because it is a single percentage that is easy to compare. Private equity funds (фонды прямых инвестиций) report their results as IRR. But it has problems: it assumes reinvestment at the IRR itself, and a project with alternating positive and negative flows can have several IRRs. When NPV and IRR disagree, trust NPV.\n\n## Payback period\n\nThe payback period (срок окупаемости) is how long it takes to get the investment back. It is simple and used in practice, but ignores the time value of money and everything after the payback date. The discounted payback period (дисконтированный срок окупаемости) fixes the first problem.\n\n## Effective and nominal rates\n\nA 12% annual rate compounded monthly is actually 12.68% per year, because interest is added twelve times. The quoted rate is the nominal rate, APR (номинальная ставка); the real cost is the effective annual rate, EAR (эффективная годовая ставка): (1 + 0.12/12)^12 − 1. Banks quote the nominal rate for loans and the effective rate for deposits, for obvious reasons.\n\n## Continuous compounding and the rule of 72\n\nA quick trick: the rule of 72 (правило 72) says money doubles in roughly 72 / r years. At 8%, in 9 years; at 14%, in about 5 years. For derivatives pricing, continuous compounding (непрерывное начисление) is used: FV = PV × e^(rt). You will meet it in the Black-Scholes model (Topic 13).\n\n> **Remember.** PV = FV / (1 + r)^n. Perpetuity = C / r, growing perpetuity = C / (r − g). NPV > 0 means accept. IRR is the rate where NPV = 0. When they disagree, NPV wins.","words":[{"w":"present value (PV)","t":"приведённая стоимость","x":"The present value of 121 in two years at 10% is 100."},{"w":"future value (FV)","t":"будущая стоимость","x":"Future value grows with compounding."},{"w":"compounding","t":"сложные проценты, капитализация","x":"Monthly compounding gives a higher effective rate."},{"w":"discounting","t":"дисконтирование","x":"Discounting converts future cash into today's money."},{"w":"discount rate","t":"ставка дисконтирования","x":"A higher discount rate lowers valuations."},{"w":"discount factor","t":"коэффициент дисконтирования","x":"The discount factor for year 3 at 10% is 0.751."},{"w":"risk-free rate","t":"безрисковая ставка","x":"OFZ yields are used as the risk-free rate in Russia."},{"w":"annuity","t":"аннуитет","x":"A mortgage is an annuity with equal monthly payments."},{"w":"perpetuity","t":"перпетуитет, бессрочная рента","x":"A perpetuity is worth the payment divided by the rate."},{"w":"growing perpetuity","t":"растущий перпетуитет","x":"Terminal value uses a growing perpetuity formula."},{"w":"Gordon growth model","t":"модель Гордона","x":"The Gordon growth model prices a stock from its dividends."},{"w":"net present value (NPV)","t":"чистая приведённая стоимость","x":"Accept the project if NPV is positive."},{"w":"internal rate of return (IRR)","t":"внутренняя норма доходности","x":"The fund targets an IRR of 25%."},{"w":"hurdle rate","t":"пороговая ставка","x":"Projects below the hurdle rate are rejected."},{"w":"initial investment","t":"первоначальные инвестиции","x":"The initial investment is 1 billion roubles."},{"w":"payback period","t":"срок окупаемости","x":"The payback period is four years."},{"w":"nominal rate (APR)","t":"номинальная ставка","x":"The loan has a nominal rate of 12%."},{"w":"effective annual rate (EAR)","t":"эффективная годовая ставка","x":"The effective annual rate is 12.68%."},{"w":"rule of 72","t":"правило 72","x":"By the rule of 72, money doubles in nine years at 8%."}]},{"n":7,"title":"Cost of capital: CAPM and WACC","short":"Сколько стоят деньги компании: стоимость собственного капитала через CAPM, стоимость долга, веса и формула WACC","level":"B2","unit":2,"min":9,"id":"cost-of-capital","theory":"## What the cost of capital means\n\nEvery company uses other people's money, and other people want a return. The cost of capital (стоимость капитала) is the return the company must earn on its investments to satisfy both lenders (кредиторы) and shareholders (акционеры). If a project earns less than the cost of capital, it destroys value (разрушает стоимость), even if it is profitable on paper.\n\nThe cost of capital is also the discount rate (ставка дисконтирования) in a DCF (Topic 8). A small change in it moves the valuation a lot, so bankers argue about every input.\n\n## Two sources, two costs\n\nA company is financed by debt (долг) and equity (собственный капитал). Each has its own cost.\n\n**Cost of debt (стоимость долга)** is easy to see: it is the interest rate (процентная ставка) the company pays on new borrowing, for example the yield (доходность) on its bonds. Because interest is tax-deductible (вычитается из налогооблагаемой прибыли), the after-tax cost of debt (стоимость долга после налогов) is lower:\n\n> **After-tax cost of debt = Kd × (1 − t)**, where t is the tax rate.\n\nIf a company borrows at 16% and the tax rate is 25%, debt really costs 12%.\n\n**Cost of equity (стоимость собственного капитала)** is harder, because shareholders do not sign a contract with a fixed rate. It is the return they expect for holding the shares. We estimate it with the CAPM.\n\n## CAPM: capital asset pricing model\n\nThe capital asset pricing model, CAPM (модель оценки капитальных активов) says the expected return on a stock depends on one thing: how much market risk (рыночный риск) it carries.\n\n> **Ke = Rf + β × (Rm − Rf).**\n\n- **Rf** is the risk-free rate (безрисковая ставка), usually the yield on long-term government bonds (государственные облигации): US Treasuries for dollar valuations, OFZ for rouble ones.\n- **(Rm − Rf)** is the equity risk premium, ERP (премия за риск инвестирования в акции): how much more the stock market (фондовый рынок) returns than risk-free bonds over the long run. In developed markets about 5–6%; for Russia analysts add a country risk premium (страновая премия за риск).\n- **β (beta, бета)** measures how much the stock moves with the market. Beta of 1 means the stock moves like the market. Beta of 1.5 means it moves 50% more: higher risk, higher required return. Utilities (коммунальные компании) have betas around 0.5; technology and metals, often above 1.2.\n\nExample: Rf = 14%, ERP = 7%, beta = 1.2. Ke = 14% + 1.2 × 7% = 22.4%.\n\n## Levered and unlevered beta\n\nBeta from the stock market includes the effect of the company's debt: more debt makes shares riskier. This is levered beta (бета с учётом долга). To compare companies with different capital structures, analysts \"unlever\" beta (убирают эффект долга) and then \"relever\" it (пересчитывают) for the target company:\n\n> **β unlevered = β levered / [1 + (1 − t) × D/E].**\n\nThis is the Hamada formula, and it is used when a company is not listed (не торгуется на бирже) and we must borrow a beta from comparable companies (сопоставимые компании).\n\n## WACC: the weighted average\n\nThe weighted average cost of capital, WACC (средневзвешенная стоимость капитала) blends the two costs according to the share of debt and equity in the capital structure (структура капитала):\n\n> **WACC = E/(D+E) × Ke + D/(D+E) × Kd × (1 − t).**\n\nE is the market value of equity (market capitalization, рыночная капитализация), D is the market value of debt (in practice, book value of debt). Weights should be based on market values and on the target capital structure (целевая структура капитала), not on today's accident.\n\nExample: E = 70, D = 30, Ke = 22.4%, Kd = 16%, t = 25%. WACC = 0.7 × 22.4% + 0.3 × 16% × 0.75 = 15.7% + 3.6% = 19.3%.\n\n## Why debt lowers WACC, up to a point\n\nDebt is cheaper than equity for two reasons: lenders are paid first, so they take less risk, and interest is tax-deductible. So adding debt lowers WACC at first. But as leverage (долговая нагрузка) grows, both Kd and Ke rise, because default risk (риск дефолта) grows. At some point WACC starts to rise again. The capital structure with the lowest WACC is the optimal capital structure (оптимальная структура капитала). This is the trade-off theory (теория компромисса): tax benefits of debt against costs of financial distress (издержки финансовых затруднений).\n\nModigliani and Miller (Модильяни и Миллер) showed that in a perfect world without taxes, capital structure does not matter at all. Taxes and bankruptcy costs are what make it matter in practice.\n\n## Typical mistakes\n\n- Using the coupon on old bonds instead of the current market yield for Kd.\n- Mixing nominal cash flows with a real discount rate, or rouble cash flows with a dollar WACC.\n- Using book values for weights.\n- Forgetting to add the country risk premium for emerging markets (развивающиеся рынки).\n- Taking beta from a short, noisy period.\n\n## Hurdle rates in practice\n\nCompanies often set a hurdle rate (пороговая ставка) above WACC to leave a margin for error, for example WACC plus 2–3 points. Private equity funds think in IRR targets (целевая IRR), typically 20–25%, rather than WACC.\n\n> **Remember.** Ke = Rf + β × ERP. WACC = weighted Ke and after-tax Kd. Debt is cheaper, but too much debt raises everybody's risk. WACC is the discount rate for FCFF.","words":[{"w":"cost of capital","t":"стоимость капитала","x":"Projects must earn more than the cost of capital."},{"w":"cost of equity (Ke)","t":"стоимость собственного капитала","x":"The cost of equity is estimated with the CAPM."},{"w":"cost of debt (Kd)","t":"стоимость долга","x":"The cost of debt equals the yield on the company's bonds."},{"w":"after-tax","t":"после налогов","x":"The after-tax cost of debt is lower because interest is deductible."},{"w":"tax-deductible","t":"вычитаемый из налоговой базы","x":"Interest is tax-deductible, dividends are not."},{"w":"CAPM","t":"модель оценки капитальных активов","x":"CAPM links expected return to beta."},{"w":"beta","t":"бета","x":"A beta above 1 means the stock is more volatile than the market."},{"w":"equity risk premium (ERP)","t":"премия за риск инвестирования в акции","x":"Analysts assume an equity risk premium of 6%."},{"w":"country risk premium","t":"страновая премия за риск","x":"Emerging markets require a country risk premium."},{"w":"levered / unlevered beta","t":"бета с учётом / без учёта долга","x":"We unlever the peer betas and relever them for the target."},{"w":"WACC","t":"средневзвешенная стоимость капитала","x":"WACC is used to discount free cash flow to the firm."},{"w":"weighted average","t":"средневзвешенное","x":"WACC is a weighted average of the costs of debt and equity."},{"w":"market value","t":"рыночная стоимость","x":"Weights should use market values of debt and equity."},{"w":"target capital structure","t":"целевая структура капитала","x":"The target capital structure is 30% debt."},{"w":"leverage","t":"долговая нагрузка, финансовый рычаг","x":"Higher leverage raises the cost of equity."},{"w":"optimal capital structure","t":"оптимальная структура капитала","x":"The optimal capital structure minimises WACC."},{"w":"trade-off theory","t":"теория компромисса","x":"The trade-off theory balances tax savings against distress costs."},{"w":"financial distress","t":"финансовые затруднения","x":"Costs of financial distress rise with debt."},{"w":"comparable companies (peers)","t":"сопоставимые компании","x":"Beta was taken from a set of listed peers."},{"w":"hurdle rate","t":"пороговая ставка","x":"The hurdle rate for new projects is 20%."}]},{"n":8,"title":"DCF valuation step by step","short":"Модель дисконтированных денежных потоков: прогноз, терминальная стоимость, от стоимости предприятия к цене акции, анализ чувствительности","level":"B2","unit":2,"min":10,"id":"dcf","theory":"## The idea\n\nDiscounted cash flow, DCF (метод дисконтированных денежных потоков) values a company as the present value of the cash it will generate in the future. It is called intrinsic valuation (оценка по внутренней стоимости), because it does not depend on what the market thinks today. \"Walk me through a DCF\" is the most common technical interview question in investment banking, so learn the steps in order.\n\n## Step 1: forecast free cash flow\n\nBuild a forecast (прогноз) for 5–10 years, the explicit forecast period (прогнозный период). Start with revenue (выручка) and assumptions (предпосылки, допущения) about growth, margins, capex and working capital. For each year calculate free cash flow to the firm, FCFF (свободный денежный поток для фирмы):\n\n> **FCFF = EBIT × (1 − t) + D&A − Capex − ΔNWC.**\n\nThe assumptions are the heart of the model. Good analysts explain each one: \"Revenue grows 8% because volumes grow 3% and prices 5%.\" Bad analysts type numbers.\n\n## Step 2: choose the discount rate\n\nBecause FCFF belongs to all capital providers (поставщики капитала), discount it at WACC (Topic 7). If you use FCFE, cash flow to shareholders only, discount at the cost of equity. Never mix: FCFF with WACC, FCFE with Ke.\n\n## Step 3: terminal value\n\nThe company does not stop after year 5, so we need the value of all cash flows after the forecast period: terminal value, TV (терминальная стоимость). Two methods.\n\n**Perpetuity growth method (метод бессрочного роста, модель Гордона):**\n\n> **TV = FCFF_(n+1) / (WACC − g)**, where g is the long-term growth rate (долгосрочный темп роста).\n\nTake the last forecast year's cash flow, grow it one more year, divide by WACC minus g. The growth rate must be modest: usually inflation or long-run GDP growth, 2–4%. A company cannot grow faster than the economy forever.\n\n**Exit multiple method (метод выходного мультипликатора):**\n\n> **TV = EBITDA_n × exit multiple**, for example 6x EV/EBITDA.\n\nHere we assume the company is sold at the end of the forecast at a multiple typical for the industry (Topic 9). Bankers often show both and check that they give similar results.\n\nTerminal value typically makes up 60–80% of total value. That is why DCF is sensitive (чувствителен) to g and WACC.\n\n## Step 4: discount everything to today\n\nDiscount each year's FCFF and the terminal value:\n\n> **EV = Σ FCFF_t / (1 + WACC)^t + TV / (1 + WACC)^n.**\n\nThe result is enterprise value, EV (стоимость предприятия, стоимость бизнеса): the value of the operating business for all investors together. A detail: if cash flows arrive during the year rather than at the end, use the mid-year convention (поправка на середину года), discounting with t − 0.5.\n\n## Step 5: from enterprise value to equity value\n\nShareholders do not own the whole enterprise value; lenders get their part first.\n\n> **Equity value = EV − Net debt − Preferred shares − Minority interest + Non-operating assets.**\n\nNet debt (чистый долг) is debt minus cash. Minority interest, also called non-controlling interest (доля меньшинства, неконтролирующая доля) is the part of subsidiaries (дочерние компании) owned by others. Non-operating assets (непрофильные активы), such as a stake in another company, are added. This bridge (мост от стоимости предприятия к стоимости капитала) is the second most common interview question.\n\n## Step 6: price per share\n\nDivide equity value by the number of diluted shares outstanding (разводнённое количество акций в обращении), which includes shares from options and convertibles (конвертируемые бумаги). Compare with the market price (рыночная цена). If the DCF price is above the market, the stock is undervalued (недооценена): a buy recommendation. If below, overvalued (переоценена).\n\n## Step 7: sensitivity analysis\n\nBecause the result depends on assumptions, every DCF ends with a sensitivity table (таблица чувствительности): price per share for different combinations of WACC (rows) and g or exit multiple (columns). A good model also has scenarios (сценарии): base case (базовый), bull case (оптимистичный) and bear case (пессимистичный). Presenting a single number without a range is a sign of a beginner.\n\n## A numerical sketch\n\nFCFF for years 1–5: 100, 110, 120, 130, 140. WACC 15%, g 3%.\n\n- PV of forecast flows ≈ 87 + 83 + 79 + 74 + 70 = 393.\n- TV = 140 × 1.03 / (0.15 − 0.03) = 1,202. PV of TV = 1,202 / 1.15^5 = 597.\n- EV = 393 + 597 = 990. TV is 60% of value.\n- Net debt 200 → equity value 790. With 100 shares, price = 7.9 per share.\n\nRaise WACC to 17% and the price falls to roughly 6.6. That is the sensitivity.\n\n## Strengths and weaknesses\n\nDCF is theoretically correct and forces you to think about the business. But it is only as good as its assumptions, it is very sensitive to WACC and g, and it is hard to use for companies with negative cash flows or no history. In practice, bankers triangulate (сверяют) a DCF with multiples (Topic 9) and show all methods on one chart, the football field (диаграмма «футбольное поле»).\n\n> **Remember.** Forecast FCFF → discount at WACC → add terminal value → enterprise value → subtract net debt → equity value → divide by shares. Always show sensitivity.","words":[{"w":"discounted cash flow (DCF)","t":"метод дисконтированных денежных потоков","x":"The DCF suggests the stock is undervalued."},{"w":"intrinsic value","t":"внутренняя стоимость","x":"Intrinsic value does not depend on market mood."},{"w":"forecast period","t":"прогнозный период","x":"The explicit forecast period is five years."},{"w":"assumption","t":"предпосылка, допущение","x":"The key assumption is 5% revenue growth."},{"w":"perpetuity growth method","t":"метод бессрочного роста","x":"The perpetuity growth method uses a 3% long-term rate."},{"w":"exit multiple","t":"выходной мультипликатор","x":"We applied an exit multiple of 6x EBITDA."},{"w":"long-term growth rate","t":"долгосрочный темп роста","x":"The long-term growth rate should not exceed GDP growth."},{"w":"enterprise value (EV)","t":"стоимость предприятия","x":"Enterprise value is the value for all investors."},{"w":"equity value","t":"стоимость собственного капитала","x":"Equity value equals EV minus net debt."},{"w":"EV-to-equity bridge","t":"мост от стоимости предприятия к капиталу","x":"Walk me through the EV-to-equity bridge."},{"w":"minority interest (non-controlling interest)","t":"доля меньшинства","x":"Minority interest is subtracted from EV."},{"w":"non-operating assets","t":"непрофильные активы","x":"Non-operating assets are added to get equity value."},{"w":"diluted shares","t":"разводнённое количество акций","x":"Diluted shares include in-the-money options."},{"w":"undervalued / overvalued","t":"недооценённый / переоценённый","x":"The analyst believes the stock is undervalued."},{"w":"mid-year convention","t":"поправка на середину года","x":"The mid-year convention assumes cash arrives mid-year."},{"w":"sensitivity analysis","t":"анализ чувствительности","x":"Sensitivity analysis shows the range of outcomes."},{"w":"base case / bull case / bear case","t":"базовый / оптимистичный / пессимистичный сценарий","x":"In the bear case the price falls to 5."},{"w":"football field","t":"диаграмма «футбольное поле»","x":"The football field compares DCF and multiples."},{"w":"triangulate","t":"сверять несколькими методами","x":"Bankers triangulate DCF with trading comps."}]},{"n":9,"title":"Multiples and comparable companies","short":"EV/EBITDA, P/E и другие мультипликаторы: что в числителе и знаменателе, как выбрать аналоги и чем trading comps отличаются от precedent transactions","level":"B2","unit":2,"min":9,"id":"multiples","theory":"## Relative valuation\n\nA multiple (мультипликатор) is a ratio of a company's value to one of its financial metrics (финансовый показатель). Valuing a company with multiples is called relative valuation (сравнительная оценка): we assume that similar companies should trade at similar multiples, so we take the multiple of comparable companies (сопоставимые компании, аналоги) and apply it to our target (целевая компания).\n\nIf peers (аналоги) trade at 6x EBITDA and our company has EBITDA of 100, its enterprise value should be about 600. Simple, fast, and based on real market prices, which is why multiples are used more often than DCF in daily work.\n\n## The golden rule: match the numerator and the denominator\n\nEvery multiple has a value in the numerator (числитель) and a metric in the denominator (знаменатель). They must belong to the same group of investors.\n\n- **Enterprise value, EV (стоимость предприятия)** belongs to all investors, so it goes with metrics before interest: revenue, EBITDA, EBIT.\n- **Equity value, market capitalization (рыночная капитализация)** belongs to shareholders only, so it goes with metrics after interest: net income, book value of equity.\n\nEV / Net income is wrong. Price / EBITDA is wrong. Interviewers check this.\n\n## The main multiples\n\n| Multiple | Formula | When used |\n|---|---|---|\n| EV/EBITDA | Enterprise value / EBITDA | The default for most industries; ignores capital structure and D&A policy |\n| EV/EBIT | Enterprise value / EBIT | When capex intensity differs between peers |\n| EV/Sales (EV/Revenue) | Enterprise value / Revenue | Loss-making or early-stage companies |\n| P/E (price-to-earnings) | Share price / EPS, or Market cap / Net income | The most quoted multiple for stocks; needs positive earnings |\n| P/B (price-to-book) | Market cap / Book value of equity | Banks and insurers, where assets are financial |\n| EV/Capacity | EV / tonnes, barrels, megawatts | Industry-specific: steel, oil, power |\n| Dividend yield | Dividend per share / Price | Income investors, Russian market |\n\nP/E (коэффициент цена/прибыль) is read like this: a P/E of 10 means investors pay 10 roubles for each rouble of annual profit, or that the investment \"pays back\" in 10 years at current earnings. Its inverse, earnings yield (доходность по прибыли), 10%, is handy for comparing with bond yields.\n\n## Forward and trailing\n\nMultiples can use last twelve months, LTM or trailing (за последние двенадцать месяцев, трейлинг), or next twelve months, NTM or forward (прогнозные, форвардные). Forward multiples are usually lower for growing companies, because next year's earnings are higher. Always compare like with like: forward with forward.\n\n## What drives a multiple\n\nA high multiple is not \"expensive\" by itself. Multiples are shorthand for a DCF: EV/EBITDA is high when growth (рост) is high, risk (риск) is low, and the company needs little capex to grow. From the Gordon model, P/E ≈ payout / (Ke − g). So a company with higher growth or lower cost of equity deserves a higher multiple. When a stock trades at a premium (с премией) to peers, ask why: better growth, better margins, or just hype.\n\n## Trading comps: comparable company analysis\n\nComparable company analysis, trading comps (анализ сопоставимых публичных компаний) uses the multiples of listed peers.\n\n1. **Select the peer group (группа аналогов):** same industry, similar size, geography and business model. For a Russian steelmaker: Severstal, NLMK, MMK, plus global names with adjustments.\n2. **Gather the data:** EV, EBITDA, net income, forecasts from consensus (консенсус-прогноз аналитиков).\n3. **Calculate the multiples** for each peer; look at the median (медиана) and the range, not just the average, because one outlier (выброс) can distort the mean.\n4. **Apply** the multiple range to the target's metric to get an implied valuation (подразумеваемая оценка).\n\nTrading comps show what the market pays today for a minority stake (миноритарный пакет) in a similar company.\n\n## Precedent transactions\n\nPrecedent transaction analysis, transaction comps (анализ прошлых сделок) uses multiples paid in actual acquisitions (поглощения) of similar companies. These multiples are usually higher, because a buyer pays a control premium (премия за контроль), often 20–40%, to get the whole company and its synergies (синергии). Precedent transactions answer \"what would a buyer pay?\", trading comps answer \"what does the market pay?\". Both are shown on the football field together with the DCF.\n\n## Adjustments and pitfalls\n\n- **Normalise (нормализуйте) the metrics:** remove one-off items from EBITDA and net income.\n- **Check the definition of debt:** include leases and pension liabilities consistently.\n- **Mind the currency and the date:** market data changes every day.\n- **Negative or tiny earnings** make P/E meaningless; use EV/Sales or EV/EBITDA.\n- **Cyclical industries (циклические отрасли)** such as metals look cheap at the peak of the cycle, when earnings are high, and expensive at the bottom. Use mid-cycle (среднециклические) earnings or EV/Capacity.\n- **Different accounting standards** across countries change EBITDA; IFRS 16 raised EBITDA for lease-heavy companies.\n\n## How multiples are quoted in conversation\n\n\"The stock trades at 5 times forward EBITDA.\" \"Peers are at 12x earnings.\" \"They paid 8x for the asset.\" \"Russian equities trade at a steep discount (с большим дисконтом) to emerging-market peers.\" Note the word \"times\" (раз) and the letter x after the number.\n\n> **Remember.** EV goes with EBITDA, EBIT and revenue; price goes with earnings and book value. High multiple = high growth or low risk. Trading comps for the market price, precedent transactions for the price with a control premium.","words":[{"w":"multiple","t":"мультипликатор","x":"The company trades at a multiple of 6x EBITDA."},{"w":"relative valuation","t":"сравнительная оценка","x":"Relative valuation relies on peer multiples."},{"w":"comparable companies (comps, peers)","t":"сопоставимые компании, аналоги","x":"The peer group includes five listed steelmakers."},{"w":"numerator / denominator","t":"числитель / знаменатель","x":"The numerator and denominator must match."},{"w":"EV/EBITDA","t":"стоимость предприятия к EBITDA","x":"EV/EBITDA is the workhorse multiple in M&A."},{"w":"P/E (price-to-earnings)","t":"цена к прибыли","x":"The market trades at a P/E of 15."},{"w":"P/B (price-to-book)","t":"цена к балансовой стоимости","x":"Banks are valued on price-to-book."},{"w":"EV/Sales","t":"стоимость предприятия к выручке","x":"Loss-making start-ups are valued on EV/Sales."},{"w":"earnings yield","t":"доходность по прибыли","x":"An earnings yield of 10% equals a P/E of 10."},{"w":"trailing (LTM)","t":"за последние двенадцать месяцев","x":"The trailing multiple uses last year's EBITDA."},{"w":"forward (NTM)","t":"прогнозный, форвардный","x":"Forward P/E is 8x."},{"w":"premium / discount to peers","t":"премия / дисконт к аналогам","x":"The stock trades at a 20% discount to peers."},{"w":"median","t":"медиана","x":"We use the median multiple of the peer group."},{"w":"outlier","t":"выброс, аномальное значение","x":"One outlier distorted the average."},{"w":"implied valuation","t":"подразумеваемая оценка","x":"The implied valuation is 50 billion roubles."},{"w":"precedent transactions","t":"прошлые сделки (для оценки)","x":"Precedent transactions show what buyers paid."},{"w":"control premium","t":"премия за контроль","x":"Acquirers pay a control premium of about 30%."},{"w":"normalise","t":"нормализовать, очистить от разовых статей","x":"We normalise EBITDA for one-off gains."},{"w":"cyclical industry","t":"циклическая отрасль","x":"Steel is a cyclical industry."},{"w":"times (x)","t":"раз (о мультипликаторе)","x":"They paid ten times earnings."}]},{"n":10,"title":"Financial ratios: reading a company in numbers","short":"Рентабельность, ликвидность, долговая нагрузка, оборачиваемость и ROE через формулу Дюпона: какие коэффициенты смотреть и что они значат","level":"B2","unit":2,"min":9,"id":"ratios","theory":"## Why ratios\n\nA financial ratio (финансовый коэффициент) connects two numbers from the statements so that companies of different sizes and years can be compared. Ratio analysis (коэффициентный анализ) answers four questions: Is the company profitable? Can it pay its bills? How much debt does it carry? How efficiently does it use its assets? A ratio is only meaningful against a benchmark (ориентир, база для сравнения): the same company last year, or peers (аналоги) this year.\n\n## Profitability ratios\n\nProfitability ratios (коэффициенты рентабельности) show how much profit the company makes from its sales, assets or equity.\n\n- **Gross margin, EBITDA margin, net margin** (Topic 3): profit lines divided by revenue.\n- **Return on equity, ROE (рентабельность собственного капитала)** = Net income / Average equity. How much the owners earn on their capital. Banks are judged mainly on ROE; Sberbank's 22–25% is considered strong.\n- **Return on assets, ROA (рентабельность активов)** = Net income / Average assets.\n- **Return on invested capital, ROIC (рентабельность инвестированного капитала)** = NOPAT / (Debt + Equity). The cleanest measure: it compares operating profit after tax with all capital used. If ROIC is above WACC, the company creates value (создаёт стоимость); if below, it destroys value even while profitable. The difference ROIC − WACC is called the spread (спред), and the money amount is economic value added, EVA (экономическая добавленная стоимость).\n\n## The DuPont formula\n\nThe DuPont analysis (формула Дюпона) breaks ROE into three drivers:\n\n> **ROE = Net margin × Asset turnover × Equity multiplier**\n> = (Net income / Revenue) × (Revenue / Assets) × (Assets / Equity).\n\nA supermarket has a low margin but high turnover (оборачиваемость); a luxury brand has a high margin and low turnover; a bank has thin margins and a huge equity multiplier (мультипликатор капитала), that is, high leverage. The formula shows whether ROE comes from efficiency or just from debt. Rising ROE driven only by the equity multiplier is a warning.\n\n## Liquidity ratios\n\nLiquidity ratios (коэффициенты ликвидности) show whether the company can pay short-term obligations (краткосрочные обязательства).\n\n- **Current ratio (коэффициент текущей ликвидности)** = Current assets / Current liabilities. Around 1.5–2 is comfortable; below 1 means current liabilities exceed current assets.\n- **Quick ratio, acid test (коэффициент быстрой ликвидности)** = (Current assets − Inventory) / Current liabilities. Stricter, because inventory may be hard to sell quickly.\n- **Cash ratio (коэффициент абсолютной ликвидности)** = Cash / Current liabilities.\n\n## Leverage and coverage ratios\n\nLeverage ratios (коэффициенты долговой нагрузки) measure how much debt the company uses.\n\n- **Net debt / EBITDA (чистый долг к EBITDA):** how many years of EBITDA it would take to repay net debt. Below 2x is comfortable for most industries; above 4x is highly leveraged (с высокой долговой нагрузкой).\n- **Debt / Equity, D/E (долг к собственному капиталу):** the capital structure. Also expressed as debt-to-capital, D/(D+E).\n- **Interest coverage ratio, ICR (коэффициент покрытия процентов)** = EBIT / Interest expense. How many times operating profit covers interest. Below 1.5x the company is in trouble; rating agencies (рейтинговые агентства) watch it closely.\n- **Debt service coverage ratio, DSCR (коэффициент покрытия обслуживания долга)** = Cash available for debt service / (Interest + Principal). Used in project finance (проектное финансирование) and by banks.\n\n## Efficiency ratios\n\nEfficiency ratios (коэффициенты оборачиваемости, деловой активности) show how well the company uses its assets.\n\n- **Asset turnover (оборачиваемость активов)** = Revenue / Average assets.\n- **Inventory turnover (оборачиваемость запасов)** = COGS / Average inventory. In days: DIO (Topic 4).\n- **Receivables turnover (оборачиваемость дебиторской задолженности)** = Revenue / Average receivables. In days: DSO.\n- **Payables days, DPO** and the **cash conversion cycle** complete the picture.\n\n## Market ratios\n\nMarket ratios (рыночные коэффициенты) link the share price with fundamentals: P/E, P/B, EV/EBITDA (Topic 9), dividend yield (дивидендная доходность) and payout ratio (коэффициент выплат) = Dividends / Net income. A payout ratio above 100% means the company pays more than it earns, which cannot last unless FCF is higher than profit.\n\n## Reading ratios like an analyst\n\n1. **Trend (динамика):** three to five years. Direction matters more than one number.\n2. **Peers:** compare with the industry median.\n3. **Consistency:** if margins rise but cash flow falls, dig deeper.\n4. **Context:** a utility can carry 4x Net debt/EBITDA because its cash flows are stable; a miner cannot.\n5. **Red flags (тревожные сигналы):** receivables growing faster than revenue, inventory piling up, interest coverage falling, frequent \"adjusted\" numbers, auditor changes.\n\n## A short example\n\nCompany X: revenue 1,000, net income 80, assets 800, equity 400, net debt 300, EBITDA 200, interest 40.\n\n- Net margin 8%, asset turnover 1.25, equity multiplier 2.0 → ROE = 8% × 1.25 × 2 = 20%.\n- Net debt / EBITDA = 1.5x, interest coverage = EBI
