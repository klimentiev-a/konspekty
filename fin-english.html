T / 40; if EBIT is 150, ICR = 3.75x.\n- Conclusion: profitable, moderately leveraged, comfortable coverage.\n\n> **Remember.** Four families: profitability, liquidity, leverage, efficiency. ROE = margin × turnover × leverage. ROIC above WACC means value is created. A ratio without a benchmark is just a number.","words":[{"w":"ratio analysis","t":"коэффициентный анализ","x":"Ratio analysis compares companies of different sizes."},{"w":"benchmark","t":"ориентир, база для сравнения","x":"Industry median is the usual benchmark."},{"w":"profitability","t":"рентабельность, прибыльность","x":"Profitability improved on higher prices."},{"w":"return on equity (ROE)","t":"рентабельность собственного капитала","x":"The bank targets ROE above 20%."},{"w":"return on assets (ROA)","t":"рентабельность активов","x":"ROA is low in capital-intensive industries."},{"w":"return on invested capital (ROIC)","t":"рентабельность инвестированного капитала","x":"ROIC above WACC creates value."},{"w":"economic value added (EVA)","t":"экономическая добавленная стоимость","x":"EVA is positive when ROIC exceeds WACC."},{"w":"DuPont analysis","t":"формула Дюпона","x":"DuPont analysis splits ROE into three drivers."},{"w":"asset turnover","t":"оборачиваемость активов","x":"Retailers have high asset turnover."},{"w":"equity multiplier","t":"мультипликатор капитала","x":"A high equity multiplier means high leverage."},{"w":"current ratio","t":"коэффициент текущей ликвидности","x":"The current ratio is 1.8."},{"w":"quick ratio (acid test)","t":"коэффициент быстрой ликвидности","x":"The quick ratio excludes inventory."},{"w":"interest coverage ratio (ICR)","t":"коэффициент покрытия процентов","x":"Interest coverage fell to 2x."},{"w":"debt service coverage ratio (DSCR)","t":"коэффициент покрытия обслуживания долга","x":"Lenders require a DSCR of at least 1.2x."},{"w":"highly leveraged","t":"с высокой долговой нагрузкой","x":"Highly leveraged firms suffer when rates rise."},{"w":"inventory turnover","t":"оборачиваемость запасов","x":"Inventory turnover slowed to five times a year."},{"w":"payout ratio","t":"коэффициент дивидендных выплат","x":"The payout ratio is 50% of net income."},{"w":"dividend yield","t":"дивидендная доходность","x":"The dividend yield is 9%."},{"w":"red flag","t":"тревожный сигнал","x":"Fast-growing receivables are a red flag."},{"w":"trend","t":"динамика, тренд","x":"Look at the trend over five years, not one quarter."}]},{"n":11,"title":"Stocks and equity markets","short":"Что такое акция и чем обыкновенная отличается от привилегированной, IPO и SPO, индексы, дивиденды, байбэк, бычий и медвежий рынок","level":"B1","unit":3,"min":9,"id":"stocks","theory":"## What a share is\n\nA share, also called a stock (акция; в США чаще stock, в Британии share) is a piece of ownership in a company. If a company has 1,000 shares and you own 10, you own 1% of it. Shareholders (акционеры) have two rights: a share of the profit, paid as dividends (дивиденды), and a vote (голос) at the general meeting (общее собрание акционеров), where they elect the board of directors (совет директоров).\n\nCommon shares (обыкновенные акции) carry votes and receive what is left after everyone else is paid. Preferred shares (привилегированные акции, «префы») usually have no vote but a fixed or priority dividend, and stand before common shares if the company is liquidated (ликвидируется). In Russia, Sberbank and Surgutneftegas have both types; the preferred shares of Surgutneftegas are famous for their dividends tied to foreign-exchange gains.\n\n## Why share prices move\n\nIn the long run a share is worth the present value of the cash it will bring (Topic 8). In the short run the price moves on news (новости), earnings releases (отчёты о результатах), interest rates (процентные ставки), and sentiment (настроение рынка). Analysts say a stock rallies (растёт, «ралли») or sells off (распродаётся), that the market is bullish (бычий, растущий) or bearish (медвежий, падающий). A correction (коррекция) is a fall of about 10% from the peak; a bear market (медвежий рынок) is a fall of 20% or more.\n\n## Market capitalization\n\nMarket capitalization, market cap (рыночная капитализация) = share price × shares outstanding (акции в обращении). Companies are grouped as large-cap (крупная капитализация), mid-cap and small-cap. Free float (акции в свободном обращении) is the share of stock available to public investors, excluding the state, founders and strategic holders (стратегические акционеры). Low free float means low liquidity (ликвидность) and bigger price swings. Index providers weight companies by free-float market cap.\n\n## Primary market: IPO and SPO\n\nAn initial public offering, IPO (первичное публичное размещение) is the first sale of shares to the public, after which the company is listed (котируется) on an exchange. Investment banks act as underwriters (андеррайтеры): they organise the deal, build the order book (книга заявок) in a process called bookbuilding (сбор заявок), and set the offer price (цена размещения). The prospectus (проспект эмиссии) describes the company and its risks. A lock-up (период запрета на продажу) stops insiders from selling for several months after the IPO.\n\nA secondary public offering, SPO (вторичное размещение) is a later sale of existing shares by current owners; a follow-on offering (дополнительная эмиссия) sells new shares and brings money to the company. Many Russian IPOs since 2023 are small by global standards, but the vocabulary is the same.\n\n## Dividends and buybacks\n\nA dividend (дивиденд) is a cash payment to shareholders, usually once or several times a year. Important dates: the record date (дата закрытия реестра), when you must own the shares to receive the dividend, and the ex-dividend date (экс-дивидендная дата), the first day the stock trades without the dividend. On that day the price drops by roughly the dividend amount: the dividend gap (дивидендный гэп). The dividend yield (дивидендная доходность) = dividend per share, DPS (дивиденд на акцию) / price. Russian stocks are known for high yields, often 8–15%.\n\nA share buyback (обратный выкуп) is the company buying its own shares on the market. It returns cash to shareholders indirectly: fewer shares mean higher EPS and often a higher price. Shares bought back become treasury shares (казначейские акции) and may be cancelled (погашены).\n\n## Stock indices\n\nA stock index (фондовый индекс) tracks a basket of shares. The MOEX Russia Index, IMOEX (индекс Мосбиржи) covers the largest Russian companies in roubles; the RTS Index (индекс РТС) is the same basket in dollars. In the US: the S&P 500 (500 largest companies), the Dow Jones (30 industrial names), the Nasdaq Composite (technology-heavy). Europe: FTSE 100, DAX, CAC 40. Asia: Nikkei 225, Hang Seng. Index funds and exchange-traded funds, ETFs (биржевые фонды) copy an index cheaply; this is passive investing (пассивное инвестирование), as opposed to active (активное).\n\n## Growth, value and other styles\n\nInvestors sort stocks into styles. Growth stocks (акции роста) are companies expected to grow fast; they trade at high multiples and pay little or no dividend: technology, biotech. Value stocks (акции стоимости) are cheap relative to earnings or assets: banks, oil, utilities. Blue chips (голубые фишки) are large, stable, well-known companies. Defensive stocks (защитные акции) such as utilities and food retailers hold up in a downturn; cyclical stocks (циклические акции) such as metals and cars follow the economy. A rotation (ротация) is money moving from one style or sector to another.\n\n## Long, short and leverage\n\nTo go long (купить, открыть длинную позицию) means to buy and hope the price rises. To go short (зашортить, открыть короткую позицию) means to borrow shares, sell them, and buy them back cheaper later; a short seller (шортист) profits from a fall. Margin trading (маржинальная торговля) uses borrowed money from the broker; a margin call (маржин-колл) is the broker's demand to add money when losses grow.\n\n## Reading a quote\n\nA quote (котировка) shows the last price, the change in percent, the bid (цена спроса, покупка) and the ask (цена предложения, продажа), the spread (спред) between them, and the volume (объём торгов). A ticker (тикер) is the short code: SBER, GAZP, AAPL. \"Sber closed up 1.2% at 310 roubles on heavy volume\" is a typical market report sentence.\n\n> **Remember.** A share = ownership + dividend + vote. Market cap = price × shares. IPO is the first sale, SPO a later one. Dividends and buybacks return cash. Bull = up, bear = down.","words":[{"w":"share / stock","t":"акция","x":"She bought 100 shares of Sberbank."},{"w":"common shares","t":"обыкновенные акции","x":"Common shares carry voting rights."},{"w":"preferred shares","t":"привилегированные акции","x":"Preferred shares get a priority dividend."},{"w":"board of directors","t":"совет директоров","x":"The board of directors recommended a dividend."},{"w":"market capitalization","t":"рыночная капитализация","x":"Market capitalization exceeded 7 trillion roubles."},{"w":"free float","t":"акции в свободном обращении","x":"Low free float limits liquidity."},{"w":"IPO","t":"первичное публичное размещение","x":"The company raised 10 billion roubles in its IPO."},{"w":"underwriter","t":"андеррайтер","x":"The underwriter guaranteed the placement."},{"w":"bookbuilding","t":"сбор заявок","x":"Bookbuilding closed with the book covered three times."},{"w":"lock-up","t":"период запрета на продажу","x":"The lock-up expires in six months."},{"w":"dividend per share (DPS)","t":"дивиденд на акцию","x":"DPS rose to 35 roubles."},{"w":"record date","t":"дата закрытия реестра","x":"You must hold the shares on the record date."},{"w":"ex-dividend date","t":"экс-дивидендная дата","x":"The stock fell on the ex-dividend date."},{"w":"share buyback","t":"обратный выкуп акций","x":"The buyback supported the share price."},{"w":"stock index","t":"фондовый индекс","x":"The index fell 2% after the rate decision."},{"w":"ETF","t":"биржевой фонд","x":"An ETF tracks the index at low cost."},{"w":"growth stock / value stock","t":"акция роста / акция стоимости","x":"Investors rotated from growth to value stocks."},{"w":"blue chip","t":"голубая фишка","x":"Lukoil is a Russian blue chip."},{"w":"go long / go short","t":"купить / зашортить","x":"Hedge funds went short on the airline."},{"w":"margin call","t":"маржин-колл","x":"A margin call forced him to sell."},{"w":"bid / ask / spread","t":"цена спроса / предложения / спред","x":"The bid-ask spread widened in thin trading."},{"w":"volume","t":"объём торгов","x":"Volume doubled on the news."}]},{"n":12,"title":"Bonds, yields and interest rates","short":"Номинал, купон, доходность к погашению, почему цена падает при росте ставок, дюрация, кредитный спред и рейтинги, кривая доходности","level":"B2","unit":3,"min":10,"id":"bonds","theory":"## What a bond is\n\nA bond (облигация) is a loan cut into pieces and sold to investors. The issuer (эмитент), a government or a company, borrows money and promises two things: to pay interest, called the coupon (купон), on fixed dates, and to repay the face value, also called par or principal (номинал, основная сумма долга), at maturity (погашение, дата погашения).\n\nExample: a 1,000-rouble bond with a 12% annual coupon and three years to maturity pays 120 each year and 1,000 at the end. The coupon rate (купонная ставка) is fixed at issue; what changes is the price.\n\nGovernment bonds (государственные облигации) in Russia are called OFZ (ОФЗ, облигации федерального займа); in the US, Treasuries (казначейские облигации); in the UK, gilts. Corporate bonds (корпоративные облигации) are issued by companies. Bonds with maturity under a year are bills (векселя, краткосрочные бумаги); long ones, up to 30 years, are often called long bonds.\n\n## Price and yield move in opposite directions\n\nThis is the most important rule of the bond market. If market interest rates (рыночные ставки) rise, new bonds pay higher coupons, so old bonds with lower coupons become less attractive and their prices fall. When rates fall, old bond prices rise.\n\nBond prices are quoted as a percentage of par: 95 means 950 roubles for a 1,000 bond. A bond below 100 trades at a discount (с дисконтом); above 100, at a premium (с премией).\n\nThe yield to maturity, YTM (доходность к погашению) is the total return you get if you buy the bond today and hold it to maturity, with all coupons reinvested. It is the IRR of the bond's cash flows (Topic 6). Current yield (текущая доходность) is simpler: coupon / price. If a 12% coupon bond trades at 95, current yield is 12.6% and YTM is higher still, because you also gain 5 points when it is repaid at par.\n\n## Duration: sensitivity to rates\n\nDuration (дюрация) measures how much a bond's price changes when yields change. Modified duration (модифицированная дюрация) of 5 means the price falls about 5% if yields rise by 1 percentage point. Longer maturity and lower coupon mean higher duration. Long OFZ with 15 years to maturity have a duration around 7–8, so they are very sensitive to the key rate (ключевая ставка); short OFZ barely move. Investors who expect rates to fall buy long duration; those who fear rate rises stay short.\n\n## Credit risk, ratings and spreads\n\nA government that prints its own currency almost never defaults (объявляет дефолт) on local-currency bonds, so its yield is the risk-free rate (безрисковая ставка). A company might default, so investors demand extra yield: the credit spread (кредитный спред), measured in basis points, bps (базисные пункты; 1 bp = 0.01%). \"The bond trades at 300 bps over OFZ\" means its yield is 3 percentage points above the government curve.\n\nCredit rating agencies (рейтинговые агентства) grade issuers. Globally: S&P, Moody's, Fitch; in Russia: ACRA (АКРА) and Expert RA (Эксперт РА). Ratings from AAA down to BBB− are investment grade (инвестиционный уровень); BB+ and below are high yield or junk (высокодоходные, «мусорные»). A downgrade (понижение рейтинга) widens the spread and lowers the price.\n\nOther risks: liquidity risk (риск ликвидности), the inability to sell quickly; reinvestment risk (риск реинвестирования), coupons reinvested at lower rates; inflation risk (инфляционный риск), fixed coupons losing purchasing power.\n\n## Types of bonds\n\n| Type | Feature | Russian |\n|---|---|---|\n| Fixed-rate bond | Coupon fixed for life | Облигация с постоянным купоном |\n| Floating-rate note, floater | Coupon tied to a reference rate, for example RUONIA or key rate + spread | Флоатер, облигация с плавающим купоном |\n| Inflation-linked bond | Principal grows with inflation (OFZ-IN, US TIPS) | Облигация с индексируемым номиналом, линкер |\n| Zero-coupon bond | No coupon, sold at a deep discount | Бескупонная облигация |\n| Callable bond | Issuer may repay early | Облигация с правом досрочного выкупа эмитентом (колл-опцион) |\n| Puttable bond | Investor may demand early repayment, in Russia via an offer (оферта) | Облигация с офертой (пут-опцион) |\n| Convertible bond | Can be exchanged for shares | Конвертируемая облигация |\n| Eurobond | Issued outside the home country, usually in dollars or euros | Еврооблигация |\n\nIn 2024–2025 floaters became very popular in Russia because the key rate was high and uncertain: their coupons rise with the rate, so their prices stay near par.\n\n## The yield curve\n\nThe yield curve (кривая доходности) plots yields of government bonds against maturity. A normal curve (нормальная кривая) slopes upward: long bonds yield more, because investors want compensation for time and uncertainty. An inverted curve (инвертированная кривая), where short yields are above long ones, usually appears when the central bank has raised rates sharply and the market expects cuts later; it is a classic recession (рецессия) signal in the US. The Russian curve was inverted through much of 2024–2025 for exactly that reason: short OFZ yielded more than long ones.\n\nBond indices: the RGBI (индекс государственных облигаций Мосбиржи) tracks OFZ prices. When RGBI rises, bonds are getting more expensive and yields are falling.\n\n## Accrued interest and settlement\n\nBetween coupon dates the seller is owed part of the next coupon. The buyer pays the clean price (чистая цена) plus accrued interest (накопленный купонный доход, НКД). The total is the dirty price (грязная цена). Russian brokers show NKD separately on every quote.\n\n## How bonds are talked about\n\n\"OFZ yields rose 30 bps along the curve after the hawkish (жёсткое, «ястребиное») statement.\" \"The issuer placed a three-year bond at a coupon of 15.5%, 150 bps over OFZ.\" \"Investors extended duration (увеличили дюрацию) ahead of the expected rate cut.\" Hawkish means favouring higher rates; dovish (мягкое, «голубиное») means favouring lower rates.\n\n> **Remember.** Price and yield move in opposite directions. Duration = sensitivity to rates. Spread over the risk-free rate = payment for credit risk. YTM is the bond's IRR.","words":[{"w":"bond","t":"облигация","x":"The company issued a five-year bond."},{"w":"issuer","t":"эмитент","x":"The issuer is rated AA by ACRA."},{"w":"coupon","t":"купон","x":"The bond pays a 12% coupon twice a year."},{"w":"face value (par, principal)","t":"номинал","x":"Par value is 1,000 roubles."},{"w":"maturity","t":"срок погашения","x":"The bond matures in 2030."},{"w":"yield to maturity (YTM)","t":"доходность к погашению","x":"YTM is 15.2%."},{"w":"current yield","t":"текущая доходность","x":"Current yield equals coupon divided by price."},{"w":"at a discount / at a premium","t":"с дисконтом / с премией","x":"The bond trades at a discount to par."},{"w":"duration","t":"дюрация","x":"Long duration means high rate sensitivity."},{"w":"credit spread","t":"кредитный спред","x":"The credit spread widened to 400 bps."},{"w":"basis point (bp)","t":"базисный пункт","x":"Yields fell 25 basis points."},{"w":"credit rating","t":"кредитный рейтинг","x":"A downgrade of the credit rating hurt the price."},{"w":"investment grade / high yield","t":"инвестиционный уровень / высокодоходные бумаги","x":"Pension funds buy only investment-grade bonds."},{"w":"default","t":"дефолт","x":"The issuer defaulted on its coupon."},{"w":"floating-rate note (floater)","t":"флоатер","x":"Floaters protect against rising rates."},{"w":"inflation-linked bond","t":"облигация с индексируемым номиналом","x":"Inflation-linked bonds hedge purchasing power."},{"w":"convertible bond","t":"конвертируемая облигация","x":"The convertible bond can be exchanged for shares."},{"w":"yield curve","t":"кривая доходности","x":"An inverted yield curve signals expected rate cuts."},{"w":"accrued interest","t":"накопленный купонный доход (НКД)","x":"The buyer pays the price plus accrued interest."},{"w":"hawkish / dovish","t":"жёсткий / мягкий (о политике ЦБ)","x":"The central bank's tone was hawkish."}]},{"n":13,"title":"Derivatives: futures, options and swaps","short":"Форварды и фьючерсы, колл и пут, внутренняя и временная стоимость, греки и Блэк-Шоулз простыми словами, процентные свопы и хеджирование","level":"C1","unit":3,"min":10,"id":"derivatives","theory":"## What a derivative is\n\nA derivative (дериватив, производный финансовый инструмент) is a contract whose value depends on the price of something else, the underlying asset (базовый актив): a share, an index, oil, a currency, an interest rate. Derivatives are used for two opposite purposes: hedging (хеджирование), reducing a risk you already have, and speculation (спекуляция), taking a risk to earn a profit. A third use is arbitrage (арбитраж), earning a riskless profit from price differences.\n\n## Forwards and futures\n\nA forward contract (форвард) is an agreement to buy or sell an asset at a fixed price on a future date. An exporter who will receive dollars in three months can sell them forward today at a known rate and remove currency risk (валютный риск). Forwards are over-the-counter, OTC (внебиржевые): private contracts between two parties, with counterparty risk (риск контрагента) that the other side will not pay.\n\nA futures contract (фьючерс) is a standardised forward traded on an exchange (биржа). The exchange's clearing house (клиринговый центр) stands between buyer and seller, so there is no counterparty risk. Instead, both sides post margin (гарантийное обеспечение, маржа) and gains and losses are settled daily: mark-to-market (переоценка по рынку). On the Moscow Exchange the most traded futures are on the dollar-rouble and yuan-rouble rates, the MOEX index, Brent oil and gold. Futures let you control a large position with a small deposit: this is leverage (плечо, рычаг).\n\nThe forward price (форвардная цена) of a financial asset is roughly the spot price (спотовая цена, текущая) plus the cost of carry (стоимость удержания позиции): interest minus any income the asset pays. When futures are above spot the market is in contango (контанго); below spot, in backwardation (бэквордация).\n\n## Options: the right, not the obligation\n\nAn option (опцион) gives the buyer the right, but not the obligation, to buy or sell the underlying at a fixed price, the strike price (цена исполнения, страйк), before or on the expiry date (дата экспирации). The buyer pays a premium (премия) for this right; the seller, called the writer (продавец опциона), receives the premium and takes on the obligation.\n\n- A **call option (колл-опцион)** is the right to buy. You buy calls if you expect the price to rise.\n- A **put option (пут-опцион)** is the right to sell. You buy puts if you expect a fall, or to insure a portfolio.\n\nExample: Sber trades at 300. You buy a call with strike 320 for a premium of 10. If Sber rises to 350, you exercise (исполняете): buy at 320, worth 350, gain 30 minus the 10 premium = 20. If Sber stays below 320, you let the option expire (истечь) and lose only the premium. The buyer's loss is limited to the premium; the seller's loss can be unlimited for a call.\n\nAn option is in the money (в деньгах) when exercising it would be profitable, at the money (около денег) when strike equals the price, out of the money (вне денег) otherwise. American options (американские опционы) can be exercised any time before expiry; European options (европейские опционы) only on the expiry date.\n\n## What an option is worth\n\nThe premium has two parts. Intrinsic value (внутренняя стоимость) is what you would get by exercising now: for a call, price minus strike if positive. Time value (временная стоимость) is the extra paid for the chance that the price moves further before expiry. Time value melts as expiry approaches: this is time decay (временной распад).\n\nThe Black-Scholes model (модель Блэка-Шоулза) prices European options from five inputs: the underlying price, the strike, time to expiry, the risk-free rate, and volatility (волатильность), the expected size of price swings. Volatility is the key: the more the price can move, the more the right to buy or sell is worth. Implied volatility (подразумеваемая волатильность) is the volatility that the market price of the option implies; the VIX index (индекс VIX, «индекс страха») is implied volatility of S&P 500 options.\n\nThe Greeks (греки) describe sensitivity: delta (дельта), how much the option price moves per 1 unit of the underlying; gamma (гамма), how fast delta changes; theta (тета), the daily time decay; vega (вега), sensitivity to volatility. Traders hedge their delta (делают дельта-хеджирование) to stay neutral to small price moves.\n\n## Swaps\n\nA swap (своп) is an exchange of cash flows. In an interest rate swap, IRS (процентный своп) one party pays a fixed rate and receives a floating rate (плавающая ставка), the other does the opposite. A company with a floating-rate loan that fears rising rates can swap into fixed. In a currency swap (валютный своп) the parties exchange principal and interest in two currencies. A credit default swap, CDS (кредитный дефолтный своп) is insurance against a borrower's default: the buyer pays an annual spread, the seller pays the loss if default happens. CDS spreads on a country are a quick measure of its perceived risk.\n\n## Hedging in practice\n\n- An airline buys oil futures to fix fuel costs (hedges its input price).\n- A gold miner sells gold forward to lock in revenue.\n- An exporter sells dollars forward to protect rouble income.\n- A fund buys index puts as portfolio insurance (страховка портфеля) before an event.\n\nHedging costs money or gives up upside (отказ от потенциальной прибыли); the point is certainty, not profit. Companies disclose hedges in their reports, and analysts check whether a \"profit\" came from the business or from derivatives.\n\n## Risks and famous disasters\n\nDerivatives are dangerous because of leverage: a small move in the underlying is a large move in the position. Losses on derivatives sank Barings Bank in 1995 and contributed to the 2008 crisis through mortgage derivatives and CDS. The lesson for a reader of reports: a company with large derivative positions may have risks that do not appear in revenue or EBITDA.\n\n> **Remember.** Forward/futures = obligation to trade at a fixed price. Option = right, not obligation; the buyer risks only the premium. Call = right to buy, put = right to sell. Swap = exchange of cash flows. Volatility is the price of an option.","words":[{"w":"derivative","t":"дериватив, производный инструмент","x":"Derivatives derive their value from an underlying asset."},{"w":"underlying asset","t":"базовый актив","x":"The underlying asset is Brent crude."},{"w":"hedging","t":"хеджирование","x":"The exporter uses forwards for hedging."},{"w":"forward contract","t":"форвард","x":"They sold dollars three months forward."},{"w":"futures contract","t":"фьючерс","x":"Futures are traded on the exchange with daily settlement."},{"w":"over-the-counter (OTC)","t":"внебиржевой","x":"Forwards are OTC contracts."},{"w":"counterparty risk","t":"риск контрагента","x":"The clearing house removes counterparty risk."},{"w":"margin","t":"гарантийное обеспечение","x":"The broker asked for additional margin."},{"w":"mark-to-market","t":"переоценка по рыночной цене","x":"Futures are marked to market every day."},{"w":"contango / backwardation","t":"контанго / бэквордация","x":"The oil curve moved into backwardation."},{"w":"option","t":"опцион","x":"An option gives a right, not an obligation."},{"w":"call / put","t":"колл / пут","x":"She bought puts to protect her portfolio."},{"w":"strike price","t":"цена исполнения, страйк","x":"The strike price is 320 roubles."},{"w":"expiry (expiration)","t":"экспирация, истечение","x":"The option expires on the third Friday."},{"w":"premium","t":"премия (по опциону)","x":"The option premium is 10 roubles."},{"w":"in / at / out of the money","t":"в деньгах / около денег / вне денег","x":"The call is out of the money."},{"w":"volatility","t":"волатильность","x":"Implied volatility jumped before the earnings release."},{"w":"time decay","t":"временной распад","x":"Time decay works against the option buyer."},{"w":"interest rate swap","t":"процентный своп","x":"The company entered an interest rate swap to fix its cost of debt."},{"w":"credit default swap (CDS)","t":"кредитный дефолтный своп","x":"CDS spreads widened as the crisis deepened."}]},{"n":14,"title":"Portfolio theory and risk","short":"Доходность и риск, диверсификация, корреляция, граница эффективности, бета и альфа, коэффициент Шарпа, VaR и как измеряют риск","level":"C1","unit":3,"min":9,"id":"portfolio-risk","theory":"## Risk is measurable\n\nIn everyday speech risk means danger. In finance, risk (риск) is the uncertainty of returns, and it is measured. The standard measure is volatility (волатильность): the standard deviation (стандартное отклонение) of returns, usually annualised (в годовом выражении). A stock with 30% volatility typically moves within plus or minus 30% of its expected return in two years out of three. Government bonds have volatility of a few percent; bitcoin, 60–80%.\n\nExpected return (ожидаемая доходность) is the average return you expect over time. The whole of portfolio theory is about getting the most expected return for a given level of risk.\n\n## Diversification: the only free lunch\n\nDiversification (диверсификация) means holding many different assets so that their individual risks partly cancel out. If one stock falls because of a factory fire, another is unaffected. The key is correlation (корреляция): how much two assets move together, from +1 (always together) to −1 (always opposite). Combining assets with low or negative correlation lowers portfolio volatility without lowering expected return. Harry Markowitz called this the only free lunch in finance (единственный бесплатный обед в финансах), and his modern portfolio theory, MPT (современная портфельная теория) won a Nobel Prize.\n\nRisk has two parts. Unsystematic risk, also called specific or idiosyncratic risk (несистематический, специфический риск) belongs to one company and can be diversified away with 20–30 stocks. Systematic risk, market risk (систематический, рыночный риск) affects everything, such as a recession or a rate hike, and cannot be diversified away. Because investors can remove specific risk for free, the market rewards only systematic risk. That is the logic behind beta and the CAPM (Topic 7).\n\n## The efficient frontier\n\nFor every level of risk there is a portfolio with the highest possible expected return. Plotted on a chart with risk on the horizontal axis and return on the vertical, these portfolios form a curve: the efficient frontier (граница эффективности). Any portfolio below the curve is inefficient: you could get more return for the same risk. Adding a risk-free asset (безрисковый актив) such as short government bonds turns the curve into a straight line, the capital market line (линия рынка капитала). The best risky portfolio for everyone is the market portfolio (рыночный портфель); investors choose how much of it to hold versus cash.\n\n## Beta and alpha\n\nBeta (бета) measures an asset's systematic risk: how much it moves with the market. The market has a beta of 1. A portfolio of beta 1.3 is expected to rise 13% when the market rises 10% and fall 13% when it falls 10%.\n\nAlpha (альфа) is the return above what beta explains: the manager's skill, or luck. If the market returns 10%, the portfolio has beta 1.3, and the risk-free rate is 5%, CAPM expects 5% + 1.3 × 5% = 11.5%. If the portfolio actually returns 14%, alpha is 2.5%. Active managers (активные управляющие) are paid to produce alpha; most do not, after fees (после вычета комиссий), which is why passive index funds (пассивные индексные фонды) have grown.\n\n## Risk-adjusted return\n\nComparing returns alone is unfair: a fund with 20% return and 40% volatility may be worse than one with 12% and 10%. Risk-adjusted measures (показатели доходности с учётом риска) fix this.\n\n- **Sharpe ratio (коэффициент Шарпа)** = (Return − Risk-free rate) / Volatility. Excess return per unit of total risk. Above 1 is good, above 2 is excellent.\n- **Sortino ratio (коэффициент Сортино)** uses only downside volatility (волатильность вниз), because investors do not mind upward surprises.\n- **Treynor ratio (коэффициент Трейнора)** = Excess return / Beta.\n- **Information ratio (информационный коэффициент)** = Alpha / Tracking error (ошибка слежения), the volatility of the difference from the benchmark (бенчмарк, эталонный индекс).\n- **Maximum drawdown (максимальная просадка)**: the largest fall from a peak to the next low. Investors feel drawdowns, not standard deviations.\n\n## Value at risk\n\nValue at risk, VaR (стоимостная мера риска) answers: \"How much can I lose over a given period with a given confidence (доверительный уровень)?\" A one-day 99% VaR of 10 million roubles means that on 99 days out of 100 the loss will not exceed 10 million. Banks use VaR for regulatory capital (регуляторный капитал). Its weakness: it says nothing about the worst 1%. Expected shortfall, also called conditional VaR (ожидаемые потери при превышении VaR) measures the average loss in those bad cases. Stress tests (стресс-тесты) simulate specific disasters: oil at 30 dollars, the rouble at 150.\n\n## Asset allocation and rebalancing\n\nAsset allocation (распределение активов) is the split between asset classes (классы активов): equities (акции), bonds, cash, real estate (недвижимость), gold, alternatives (альтернативные инвестиции). Studies show it explains most of a portfolio's long-run result, more than picking individual stocks. A classic rule is 60/40: 60% equities, 40% bonds. Rebalancing (ребалансировка) means periodically selling what grew and buying what fell to return to the target weights; it forces you to sell high and buy low.\n\nThe time horizon (горизонт инвестирования) and risk tolerance (терпимость к риску) of the investor decide the allocation: a 25-year-old saving for retirement can hold mostly equities; a pension fund paying benefits next year cannot.\n\n## Behavioural traps\n\nBehavioural finance (поведенческие финансы) shows that people are not rational. Loss aversion (неприятие потерь): a loss hurts about twice as much as an equal gain pleases, so investors hold losers too long. Herding (стадное поведение): buying because everyone buys. Overconfidence (самоуверенность): trading too much. Anchoring (якорение): fixating on the price you paid. Knowing the names helps a little; rules and rebalancing help more.\n\n> **Remember.** Risk = volatility. Diversification removes specific risk, not market risk. Beta = market risk, alpha = skill. Sharpe = return per unit of risk. VaR = loss at a confidence level.","words":[{"w":"volatility","t":"волатильность","x":"Volatility rose sharply during the sell-off."},{"w":"standard deviation","t":"стандартное отклонение","x":"Standard deviation of returns measures risk."},{"w":"expected return","t":"ожидаемая доходность","x":"The expected return on equities is about 10%."},{"w":"diversification","t":"диверсификация","x":"Diversification reduces specific risk."},{"w":"correlation","t":"корреляция","x":"Gold has low correlation with equities."},{"w":"systematic (market) risk","t":"систематический (рыночный) риск","x":"Systematic risk cannot be diversified away."},{"w":"unsystematic (specific) risk","t":"несистематический (специфический) риск","x":"Specific risk disappears in a large portfolio."},{"w":"efficient frontier","t":"граница эффективности","x":"Portfolios on the efficient frontier maximise return for a given risk."},{"w":"market portfolio","t":"рыночный портфель","x":"The index fund approximates the market portfolio."},{"w":"alpha","t":"альфа","x":"The manager delivered 3% of alpha last year."},{"w":"risk-adjusted return","t":"доходность с учётом риска","x":"Compare funds by risk-adjusted return."},{"w":"Sharpe ratio","t":"коэффициент Шарпа","x":"A Sharpe ratio above 1 is considered good."},{"w":"drawdown","t":"просадка","x":"The maximum drawdown was 35% in 2022."},{"w":"benchmark","t":"бенчмарк, эталонный индекс","x":"The fund beat its benchmark by two points."},{"w":"tracking error","t":"ошибка слежения","x":"Index funds aim for minimal tracking error."},{"w":"value at risk (VaR)","t":"стоимостная мера риска","x":"One-day VaR is 2% of the portfolio."},{"w":"stress test","t":"стресс-тест","x":"The stress test assumed oil at 30 dollars."},{"w":"asset allocation","t":"распределение активов","x":"Asset allocation drives long-term results."},{"w":"rebalancing","t":"ребалансировка","x":"Annual rebalancing restores the 60/40 split."},{"w":"risk tolerance","t":"терпимость к риску","x":"Her risk tolerance is low, so she holds bonds."},{"w":"loss aversion","t":"неприятие потерь","x":"Loss aversion makes investors keep losing stocks."}]},{"n":15,"title":"How markets work: exchanges, brokers and liquidity","short":"Кто участвует в торгах, как устроена биржа и клиринг, типы заявок, маркетмейкеры, ликвидность, регуляторы и инсайдерская торговля","level":"B2","unit":3,"min":9,"id":"market-structure","theory":"## The players\n\nA financial market (финансовый рынок) brings together those who have money and those who need it. The main participants (участники):\n\n- **Issuers (эмитенты):** companies and governments that sell securities (ценные бумаги).\n- **Investors (инвесторы):** retail investors (частные, розничные инвесторы), ordinary people with brokerage accounts, and institutional investors (институциональные инвесторы): pension funds (пенсионные фонды), insurance companies (страховые компании), mutual funds (паевые фонды), hedge funds (хедж-фонды), sovereign wealth funds (суверенные фонды).\n- **Intermediaries (посредники):** brokers (брокеры), who execute orders for clients; dealers (дилеры), who trade for their own account; investment banks (инвестиционные банки), which do both and advise.\n- **Infrastructure (инфраструктура):** exchanges, clearing houses, depositories.\n- **Regulators (регуляторы):** in Russia the Bank of Russia (Банк России, ЦБ) supervises the whole financial market; in the US the Securities and Exchange Commission, SEC (Комиссия по ценным бумагам и биржам) oversees securities and the Federal Reserve (ФРС) oversees banks.\n\n## The exchange and what happens after a trade\n\nA stock exchange (фондовая биржа) is a marketplace with rules where buyers and sellers meet. Today it is a computer that runs an order book (биржевой стакан, книга заявок): a list of buy orders, bids (заявки на покупку), and sell orders, asks or offers (заявки на продажу), sorted by price. When a bid and an ask match, a trade (сделка) is executed (исполняется). The difference between the best bid and the best ask is the bid-ask spread (спред).\n\nAfter the trade come clearing (клиринг) and settlement (расчёты). The clearing house, or central counterparty, CCP (центральный контрагент) becomes the buyer to every seller and the seller to every buyer, guaranteeing that the trade will be completed even if one party fails. Settlement is the actual exchange of securities for money; on the Moscow Exchange stocks settle on T+1, one business day after the trade. The central securities depository, CSD (центральный депозитарий; в России НРД, Национальный расчётный депозитарий) keeps the records of who owns what.\n\nThe Moscow Exchange Group (Московская биржа) owns the exchange, the clearing house (NCC, НКЦ) and the depository (NSD, НРД), and earns fees (комиссии) on every trade plus interest on client balances, which is why its profit rises when the key rate is high.\n\n## Order types\n\n- **Market order (рыночная заявка):** buy or sell now at the best available price. Fast, but in a thin market the price can be bad.\n- **Limit order (лимитная заявка):** buy no higher, or sell no lower, than a stated price. May never execute.\n- **Stop order, stop-loss (стоп-заявка, стоп-лосс):** becomes a market order when the price reaches a trigger level; used to limit losses.\n- **Take-profit (тейк-профит):** the opposite, to lock in a gain.\n- **Iceberg order (айсберг-заявка):** shows only part of the size, hiding a large trade.\n\n## Liquidity and market makers\n\nLiquidity (ликвидность) is the ability to buy or sell quickly without moving the price much. A liquid stock has a tight spread, deep order book (глубокий стакан) and high turnover (оборот). An illiquid (неликвидный) one has wide spreads and jumps on small orders. Liquidity is why big investors stick to large caps and why the free float matters.\n\nA market maker (маркетмейкер) is a firm that continuously quotes bid and ask prices and earns the spread. Exchanges pay or require market makers to keep small stocks tradable. High-frequency trading, HFT (высокочастотная торговля) firms are the modern market makers, trading in microseconds with algorithms (алгоритмы). Algorithmic trading (алгоритмическая торговля) is now most of the volume in developed markets.\n\n## Trading sessions and halts\n\nThe Moscow Exchange runs a main session (основная сессия) from 10:00 to 18:50 Moscow time, plus morning and evening sessions (утренняя и вечерняя сессии). The closing price (цена закрытия) is set by a closing auction (аукцион закрытия). If a stock moves too fast, the exchange may impose a trading halt (приостановка торгов) or a discrete auction (дискретный аукцион) to calm the market; US exchanges use circuit breakers (автоматические остановки торгов) when the index falls 7%, 13% or 20% in a day.\n\n## OTC, dark pools and the money market\n\nNot everything trades on an exchange. Over-the-counter, OTC (внебиржевой рынок) trading happens directly between dealers: most bonds, currencies and derivatives trade OTC. Dark pools (тёмные пулы) are private venues where large orders are matched without showing them to the market. The money market (денежный рынок) is the market for short-term borrowing, under a year: repo (репо, сделка с обратным выкупом), where a bank sells securities and buys them back tomorrow, is the main instrument; the RUONIA rate (ставка RUONIA) is the average overnight rate at which Russian banks lend to each other, and floaters are often tied to it.\n\n## Rules of the game\n\nInsider trading (инсайдерская торговля), buying or selling on non-public information, is illegal everywhere. Market manipulation (манипулирование рынком), for example pump and dump (разгон и сброс) of a small stock in Telegram channels, is also illegal and the Bank of Russia prosecutes it. Public companies must disclose (раскрывать) material information (существенная информация) to everyone at the same time. Rules about who can buy what are called investor protection (защита инвесторов): in Russia, a qualified investor (квалифицированный инвестор) status is required for complex or foreign instruments, and unqualified investors must pass a test (тестирование).\n\nKnow-your-customer, KYC (идентификация клиента) and anti-money-laundering, AML (противодействие отмыванию денег) rules make brokers check who their clients are and where the money comes from.\n\n> **Remember.** Exchange matches orders, clearing house guarantees them, depository records ownership. Market order = now at any price, limit order = at my price or better. Liquidity = tight spread and depth. Insider trading is a crime.","words":[{"w":"retail investor","t":"частный (розничный) инвестор","x":"Retail investors now dominate trading on MOEX."},{"w":"institutional investor","t":"институциональный инвестор","x":"Pension funds are long-term institutional investors."},{"w":"broker","t":"брокер","x":"The broker executes orders for a commission."},{"w":"dealer","t":"дилер","x":"A dealer trades for its own account."},{"w":"hedge fund","t":"хедж-фонд","x":"Hedge funds can go short and use leverage."},{"w":"regulator","t":"регулятор","x":"The regulator fined the broker for mis-selling."},{"w":"order book","t":"биржевой стакан","x":"The order book shows bids and asks by price."},{"w":"execute (a trade)","t":"исполнить (сделку)","x":"The order was executed at 310.5."},{"w":"clearing","t":"клиринг","x":"Clearing guarantees that both sides deliver."},{"w":"settlement","t":"расчёты по сделке","x":"Settlement takes place on T+1."},{"w":"central counterparty (CCP)","t":"центральный контрагент","x":"The central counterparty absorbs default risk."},{"w":"depository","t":"депозитарий","x":"The depository records share ownership."},{"w":"market order / limit order","t":"рыночная / лимитная заявка","x":"Use a limit order in an illiquid stock."},{"w":"stop-loss","t":"стоп-лосс","x":"She set a stop-loss 5% below the entry price."},{"w":"liquidity","t":"ликвидность","x":"Liquidity dried up during the panic."},{"w":"market maker","t":"маркетмейкер","x":"The market maker keeps the spread tight."},{"w":"high-frequency trading (HFT)","t":"высокочастотная торговля","x":"HFT firms trade in microseconds."},{"w":"trading halt","t":"приостановка торгов","x":"A trading halt followed the 20% drop."},{"w":"repo","t":"репо","x":"Banks fund themselves overnight through repo."},{"w":"insider trading","t":"инсайдерская торговля","x":"Insider trading carries criminal penalties."},{"w":"disclosure","t":"раскрытие информации","x":"Disclosure rules require timely reporting of material events."},{"w":"qualified investor","t":"квалифицированный инвестор","x":"Only qualified investors may buy these notes."}]},{"n":16,"title":"Mergers and acquisitions","short":"Зачем компании покупают друг друга, этапы сделки от NDA до закрытия, синергии и премия, accretion/dilution, враждебные поглощения и защита","level":"C1","unit":4,"min":10,"id":"m-and-a","theory":"## Mergers, acquisitions and why they happen\n\nMergers and acquisitions, M&A (слияния и поглощения) is the business of combining companies. In a merger (слияние) two companies join to form one, often as equals. In an acquisition (поглощение, покупка) one company, the acquirer or buyer (покупатель), buys another, the target (целевая компания, объект сделки). In practice almost every deal is an acquisition; \"merger of equals\" (слияние равных) is usually a polite word.\n\nWhy buy a company instead of growing yourself? The main reasons:\n\n- **Synergies (синергии):** the combined company earns more or spends less than the two separately. Cost synergies (синергии по затратам): one head office, bigger purchasing discounts. Revenue synergies (синергии по выручке): selling each other's products. Cost synergies are real more often than revenue synergies.\n- **Market share (доля рынка)** and pricing power.\n- **Speed:** buying a technology or a licence is faster than building it.\n- **Vertical integration (вертикальная интеграция):** buying a supplier or a distributor. Horizontal integration (горизонтальная интеграция): buying a competitor. A conglomerate (конгломерат) buys unrelated businesses.\n- **Undervaluation:** the target is cheap.\n\nA strategic buyer (стратегический покупатель) is a company in the same or related industry, which can pay for synergies. A financial buyer (финансовый покупатель), such as a private equity fund, buys for returns alone (Topic 17).\n\n## The deal process\n\nA typical sell-side process (процесс продажи) run by an investment bank:\n\n1. **Preparation.** The bank writes a teaser (тизер), a short anonymous description, and a confidential information memorandum, CIM (информационный меморандум), a long document with financials. Potential buyers sign a non-disclosure agreement, NDA (соглашение о неразглашении).\n2. **First round.** Buyers submit non-binding offers (необязывающие предложения) with an indicative price range.\n3. **Due diligence (комплексная проверка, дью-дилидженс).** Selected buyers get access to a data room (комната данных) and check financial, legal, tax and operational details with their advisers (консультанты): lawyers, auditors, consultants.\n4. **Binding offers (обязывающие предложения)** and negotiation of the share purchase agreement, SPA (договор купли-продажи акций).\n5. **Signing (подписание)** of the SPA. Conditions precedent (отлагательные условия) must then be met: antitrust approval (одобрение антимонопольного органа; в России ФАС), shareholder votes, regulatory consents.\n6. **Closing (закрытие сделки):** money changes hands, ownership transfers. Between signing and closing can be months.\n\nLetter of intent, LOI (письмо о намерениях) and term sheet (основные условия сделки) are the documents that fix the main terms before lawyers write the full agreement.\n\n## Price and premium\n\nThe acquirer usually pays more than the market price: the control premium (премия за контроль), typically 20–40% over the undisturbed price (цена до появления слухов о сделке). The premium is justified by synergies: if the buyer pays a premium of 100 and expects synergies worth 150 in present value, the deal creates value for its shareholders; if synergies turn out to be 50, value was transferred to the target's shareholders. Studies show that most of the gains in M&A go to the sellers.\n\nThe price can be paid in cash (денежная сделка), in the acquirer's shares (сделка с оплатой акциями), or a mix. In a share deal the exchange ratio (коэффициент обмена) says how many acquirer shares each target share gets. An earn-out (отложенный платёж по результатам) pays part of the price later if the target hits targets, which helps when buyer and seller disagree about the future.\n\n## Accretion and dilution\n\nThe question every board asks: will the deal increase or decrease our earnings per share, EPS? If EPS goes up, the deal is accretive (увеличивает прибыль на акцию); if down, dilutive (размывает прибыль на акцию). The quick test for an all-stock deal: if the acquirer's P/E is higher than the target's, the deal is accretive, because the buyer pays with \"expensive\" shares for \"cheap\" earnings. For a cash deal, compare the target's earnings yield with the after-tax cost of the debt used to pay: if the target yields more than the debt costs, accretive. Accretion is not the same as value creation, but markets watch it.\n\n## Goodwill and purchase price allocation\n\nWhen the buyer pays more than the fair value (справедливая стоимость) of the target's net assets, the difference is recorded as goodwill (гудвил) on the buyer's balance sheet. Purchase price allocation, PPA (распределение цены покупки) assigns the price to identifiable assets first, such as brands and customer lists, and the rest to goodwill. Goodwill is not amortised under IFRS but tested for impairment (обесценение) every year; a big write-off means the company admits it overpaid.\n\n## Hostile takeovers and defences\n\nMost deals are friendly (дружественные): the target's board agrees. In a hostile takeover (враждебное поглощение) the acquirer goes directly to shareholders with a tender offer (публичная оферта о выкупе акций) or tries to replace the board through a proxy fight (борьба за голоса акционеров). Defences include the poison pill (ядовитая пилюля): a plan that lets other shareholders buy shares cheaply if anyone crosses a threshold, diluting the raider; the white knight (белый рыцарь): a friendlier buyer invited by the target; staggered boards (ступенчатый совет директоров), golden parachutes (золотые парашюты) for managers, and simply buying back shares. In Russia a buyer who crosses 30%, 50% or 75% of a public company must make a mandatory offer (обязательное предложение) to all other shareholders at the same price.\n\n## Divestitures and spin-offs\n\nThe opposite of acquisition: a divestiture (продажа подразделения) sells a business unit; a spin-off (выделение) gives shareholders shares in a new independent company; a carve-out (частичное выделение с IPO) sells part of a subsidiary to the public. These deals are common when a conglomerate discount (дисконт конгломерата) makes the parts worth more than the whole.\n\n> **Remember.** M&A = buying growth and synergies. Process: teaser → NDA → due diligence → SPA → signing → closing. Premium is paid for control and synergies. Accretive if EPS rises. Overpaying shows up later as goodwill impairment.","words":[{"w":"merger / acquisition","t":"слияние / поглощение","x":"The acquisition was announced on Monday."},{"w":"acquirer / target","t":"покупатель / целевая компания","x":"The acquirer offered a 30% premium for the target."},{"w":"synergies","t":"синергии","x":"Cost synergies of 2 billion roubles are expected."},{"w":"strategic buyer / financial buyer","t":"стратегический / финансовый покупатель","x":"A strategic buyer can pay for synergies."},{"w":"due diligence","t":"комплексная проверка","x":"Due diligence revealed tax risks."},{"w":"non-disclosure agreement (NDA)","t":"соглашение о неразглашении","x":"Bidders signed an NDA before receiving the memorandum."},{"w":"data room","t":"комната данных","x":"The data room contains all contracts."},{"w":"non-binding / binding offer","t":"необязывающее / обязывающее предложение","x":"Binding offers are due on Friday."},{"w":"share purchase agreement (SPA)","t":"договор купли-продажи акций","x":"The SPA was signed after three months of talks."},{"w":"signing / closing","t":"подписание / закрытие сделки","x":"Closing is expected in the second quarter."},{"w":"conditions precedent","t":"отлагательные условия","x":"Antitrust approval is a condition precedent."},{"w":"control premium","t":"премия за контроль","x":"The control premium was 35%."},{"w":"exchange ratio","t":"коэффициент обмена","x":"The exchange ratio is 0.8 acquirer shares per target share."},{"w":"earn-out","t":"отложенный платёж по результатам","x":"Part of the price is an earn-out tied to 2027 EBITDA."},{"w":"accretive / dilutive","t":"увеличивающий / размывающий прибыль на акцию","x":"The deal is accretive from the first year."},{"w":"goodwill","t":"гудвил","x":"Goodwill of 10 billion roubles was recorded."},{"w":"hostile takeover","t":"враждебное поглощение","x":"The board rejected the hostile takeover bid."},{"w":"tender offer","t":"публичная оферта о выкупе","x":"The tender offer was priced at 400 roubles per share."},{"w":"poison pill","t":"«ядовитая пилюля»","x":"The poison pill would dilute any hostile bidder."},{"w":"spin-off","t":"выделение (компании)","x":"The spin-off created a separately listed company."},{"w":"mandatory offer","t":"обязательное предложение","x":"Crossing 30% triggers a mandatory offer in Russia."}]},{"n":17,"title":"Leveraged buyouts and private equity","short":"Как фонд покупает компанию на заёмные деньги и зарабатывает: структура LBO, источники и использование средств, выход, IRR и мультипликатор денег, откуда берётся доходность","level":"C1","unit":4,"min":10,"id":"lbo-private-equity","theory":"## What private equity does\n\nPrivate equity, PE (прямые инвестиции, фонды прямых инвестиций) is the business of buying whole companies, or large stakes, that are not traded on an exchange, holding them for 3–7 years, improving them, and selling at a profit. The money comes from a fund (фонд) raised from limited partners, LPs (ограниченные партнёры, инвесторы фонда): pension funds, endowments, insurers, wealthy families. The fund is managed by the general partner, GP (управляющий партнёр), the PE firm itself. Famous names: KKR, Blackstone, Carlyle, Apollo; in Russia, the market is small and dominated by local groups and family offices.\n\nThe GP charges a management fee (комиссия за управление), usually 2% of committed capital, and carried interest, carry (вознаграждение за успех), usually 20% of profits above a hurdle rate (пороговая доходность) of about 8%. This is the \"2 and 20\" model.\n\n## The leveraged buyout\n\nA leveraged buyout, LBO (выкуп с использованием заёмных средств) is the main tool of private equity: buying a company mostly with borrowed money, where the debt is secured (обеспечен) by the company's own assets and repaid from its own cash flows. The fund puts in equity (собственные средства фонда) of 30–50% of the price; banks and bond investors lend the rest.\n\nThe logic is like buying a flat with a mortgage: if the flat rises 20% in value and you paid 30% down, your equity has risen almost 70%. Leverage magnifies returns, and also losses.\n\n## What makes a good LBO target\n\n- **Stable, predictable cash flows (стабильные, предсказуемые денежные потоки)** to service the debt: no cyclical swings.\n- **Low existing debt**, so there is room to add more.\n- **Hard assets (материальные активы)** that can serve as collateral (обеспечение, залог).\n- **Low capex needs**, so cash goes to debt repayment.\n- **Room for improvement:** costs to cut, a weak management team to replace, non-core assets (непрофильные активы) to sell.\n- **A clear exit (выход)** in a few years.\n\nMature businesses in boring industries are ideal: packaging, retail chains, business services. Fast-growing tech companies with losses are not, which is why they go to venture capital, VC (венчурный капитал) instead.\n\n## Sources and uses\n\nEvery LBO model starts with a sources and uses table (таблица источников и использования средств).\n\n| Uses (куда идут деньги) | | Sources (откуда деньги) | |\n|---|---|---|---|\n| Purchase of equity | 800 | Senior debt (bank loans) | 450 |\n| Refinancing of existing debt | 150 | Subordinated debt / mezzanine | 150 |\n| Transaction fees | 50 | Sponsor equity | 400 |\n| **Total** | **1,000** | **Total** | **1,000** |\n\nSenior debt (старший долг) is repaid first and is cheapest; it is usually bank term loans (срочные кредиты) secured on assets. Subordinated or junior debt (субординированный, младший долг), high-yield bonds and mezzanine (мезонин), a hybrid of debt and equity, are riskier and more expensive. The PE fund is called the sponsor (спонсор сделки). Total leverage of 4–6x EBITDA is typical in the US and Europe; in Russia, with high rates, far less.\n\n## Where the return comes from\n\nOver the holding period (период владения) the sponsor earns from three sources:\n\n1. **Debt paydown (погашение долга, делеверидж):** the company's cash flow repays debt, so the equity share of the same enterprise value grows. This is the classic LBO engine.\n2. **EBITDA growth (рост EBITDA):** operational improvements (операционные улучшения), bolt-on acquisitions (дополняющие поглощения), price increases. The modern PE story is \"value creation\", not just financial engineering (финансовый инжиниринг).\n3. **Multiple expansion (рост мультипликатора):** selling at a higher EV/EBITDA than the entry multiple, for example because the market is hotter. The least reliable source; a good model assumes exit multiple equals entry multiple.\n\n## Exit\n\nThe exit (выход из инвестиции) can be a sale to a strategic buyer (trade sale, продажа стратегу), a sale to another PE fund (secondary buyout, вторичный выкуп), an IPO, or a dividend recapitalization (дивидендная рекапитализация), where the company borrows again to pay the sponsor a large dividend without a sale.\n\n## Returns: IRR and MOIC\n\nPE measures success with two numbers. Internal rate of return, IRR (внутренняя норма доходности) is the annualised return; funds target 20–25%. Multiple of invested capital, MOIC, also called money multiple or cash-on-cash (мультипликатор вложенного капитала) is how many times the equity was returned: 400 in, 1,000 out is 2.5x. The two must be read together: 2.5x in three years is a great IRR; 2.5x in ten years is not.\n\nQuick mental rule: 2x in 3 years ≈ 26% IRR; 3x in 5 years ≈ 25% IRR; 2x in 5 years ≈ 15% IRR.\n\n## A sketch of an LBO model\n\nEntry: EBITDA 100, entry multiple 8x, EV 800, debt 500, equity 300. Over five years EBITDA grows to 130 and debt is paid down to 250. Exit at 8x: EV 1,040, minus debt 250 = equity 790. MOIC = 790 / 300 = 2.6x, IRR ≈ 21%. The model then runs sensitivities (чувствительность) on exit multiple, EBITDA growth and leverage.\n\n## Risks and criticism\n\nLeverage cuts both ways: a recession can push an LBO company into default (дефолт) and restructuring (реструктуризация), as happened to many retailers. Critics say PE loads companies with debt, cuts jobs and takes fees. Supporters say PE forces discipline and that the returns, net of fees, have beaten public markets for decades. Both are partly right.\n\n> **Remember.** LBO = buy with mostly borrowed money, repay from the company's cash flow, sell in 3–7 years. Returns come from debt paydown, EBITDA growth and multiple expansion. Measure with IRR and MOIC together.","words":[{"w":"private equity (PE)","t":"прямые инвестиции","x":"Private equity funds hold companies for about five years."},{"w":"limited partner (LP) / general partner (GP)","t":"инвестор фонда / управляющий партнёр","x":"LPs commit capital, the GP manages it."},{"w":"management fee","t":"комиссия за управление","x":"The management fee is 2% a year."},{"w":"carried interest (carry)","t":"вознаграждение за успех","x":"Carry is 20% of profits above the hurdle."},{"w":"leveraged buyout (LBO)","t":"выкуп с использованием заёмных средств","x":"The LBO was financed with 60% debt."},{"w":"sponsor","t":"спонсор сделки (фонд)","x":"The sponsor contributed 400 million of equity."},{"w":"collateral","t":"обеспечение, залог","x":"The loans are secured by collateral."},{"w":"senior debt","t":"старший долг","x":"Senior debt is repaid first."},{"w":"subordinated (junior) debt","t":"субординированный (младший) долг","x":"Subordinated debt carries a higher coupon."},{"w":"mezzanine","t":"мезонинное финансирование","x":"Mezzanine sits between debt and equity."},{"w":"sources and uses","t":"источники и использование средств","x":"The sources and uses table balances at 1 billion."},{"w":"holding period","t":"период владения","x":"The average holding period is five years."},{"w":"debt paydown (deleveraging)","t":"погашение долга, делеверидж","x":"Debt paydown drove most of the return."},{"w":"operational improvements","t":"операционные улучшения","x":"Operational improvements lifted margins by three points."},{"w":"bolt-on acquisition","t":"дополняющее поглощение","x":"The company made three bolt-on acquisitions."},{"w":"multiple expansion","t":"рост мультипликатора","x":"Returns relied on multiple expansion."},{"w":"exit","t":"выход из инвестиции","x":"The fund exited through an IPO."},{"w":"trade sale","t":"продажа стратегическому инвестору","x":"A trade sale to a competitor is the likely exit."},{"w":"dividend recapitalization","t":"дивидендная рекапитализация","x":"A dividend recap returned half the equity early."},{"w":"MOIC (money multiple)","t":"мультипликатор вложенного капитала","x":"The deal returned 2.5x MOIC."},{"w":"venture capital (VC)","t":"венчурный капитал","x":"Venture capital backs early-stage start-ups."}]},{"n":18,"title":"Debt financing: loans, covenants and ratings","short":"Виды долга от банковского кредита до евробондов, обеспечение и старшинство, ковенанты, рейтинги, рефинансирование, дефолт и реструктуризация","level":"B2","unit":4,"min":9,"id":"debt-financing","theory":"## Why companies borrow\n\nDebt (долг, заёмный капитал) is cheaper than equity: lenders take less risk and interest is tax-deductible (Topic 7). Borrowing also lets owners keep control (контроль), because lenders get no votes. The price is obligation: interest must be paid and principal (основная сумма долга) repaid whatever happens to the business. A company's debt capacity (долговая ёмкость) is how much it can borrow safely, usually judged by Net debt / EBITDA and interest coverage (Topic 10).\n\n## Types of debt\n\n| Instrument | Who lends | Features | Russian |\n|---|---|---|---|\n| Bank loan, term loan | A bank | Fixed schedule of repayments, often secured, covenants | Банковский кредит, срочный кредит |\n| Revolving credit facility, revolver | A bank | A credit line: borrow, repay, borrow again up to a limit | Возобновляемая кредитная линия |\n| Syndicated loan | A group of banks | Large loans shared among banks, one lead arranger | Синдицированный кредит |\n| Bonds | Investors on the market | Tradable, longer maturities, less flexible terms | Облигации |\n| Eurobonds | International investors | Issued outside the home market, usually in dollars or euros | Еврооблигации |\n| Commercial paper | Money-market investors | Unsecured short-term notes under one year | Коммерческие бумаги |\n| Leasing | A leasing company | Finance equipment without owning it | Лизинг |\n| Project finance | Banks, development institutions | Debt repaid only from a specific project's cash flows | Проектное финансирование |\n| Convertible bonds | Investors | Can turn into shares; lower coupon | Конвертируемые облигации |\n\nA bilateral loan (двусторонний кредит) is from one bank; a club deal (клубная сделка) from a few; a syndicated loan (синдицированный кредит) from many. In Russia, bank loans still dominate corporate borrowing, and the bond market is growing, especially floaters (флоатеры).\n\n## Interest: fixed or floating\n\nA fixed rate (фиксированная ставка) stays the same for the life of the loan. A floating rate (плавающая ставка) is a reference rate plus a margin (маржа, спред): in Russia, key rate + 3%, or RUONIA + spread; internationally, SOFR for dollars and EURIBOR for euros replaced the old LIBOR. Floating-rate borrowers suffer when the central bank raises rates; in 2024–2025 many Russian companies saw interest costs double. Interest rate swaps (Topic 13) can convert floating to fixed.\n\n## Security and seniority\n\nSecured debt (обеспеченный долг) is backed by collateral (залог, обеспечение): property, equipment, shares, receivables. If the borrower defaults, the lender can seize and sell the collateral. Unsecured debt (необеспеченный долг) relies only on the borrower's promise and gets paid after secured creditors.\n\nSeniority (старшинство, очерёдность) is the order of repayment in bankruptcy (банкротство): senior secured first, then senior unsecured, then subordinated (субординированный), then preferred shares, then common shareholders, who usually get nothing. This order is called the waterfall (водопад выплат). A guarantee (поручительство, гарантия) from a parent company (материнская компания) makes a subsidiary's debt safer.\n\n## Covenants\n\nA covenant (ковенант) is a promise in the loan agreement. Financial covenants (финансовые ковенанты) are the important ones: keep Net debt / EBITDA below 3.5x, keep interest coverage above 3x, keep equity above a minimum. Negative covenants (запретительные ковенанты) forbid actions: no new debt above a limit, no dividends above a share of profit, no sale of key assets, no change of control (смена контроля) without consent. Positive covenants (обязывающие ковенанты) require things: audited accounts, insurance.\n\nBreaking a covenant is a covenant breach (нарушение ковенанта). It is a technical default (технический дефолт) even if interest is paid on time, and lets lenders demand early repayment (досрочное погашение). Usually they negotiate instead: a waiver (отказ от применения санкций) for a fee, or amended terms. Covenant-lite loans (кредиты с мягкими ковенантами) with few restrictions were common in the US LBO market before 2022.\n\n## Credit ratings\n\nA credit rating (кредитный рейтинг) is an independent opinion on the probability of default (вероятность дефолта). International agencies: S&P, Moody's, Fitch; Russian: ACRA (АКРА), Expert RA (Эксперт РА), NCR (НКР), NRA (НРА). Scales run from AAA (highest) to D (default). The line between BBB− and BB+ divides investment grade (инвестиционный уровень) from speculative grade (спекулятивный уровень). Many funds may only hold investment-grade paper, so a downgrade (понижение рейтинга) below the line, called becoming a fallen angel (падший ангел), forces selling and raises borrowing costs. The outlook (прогноз по рейтингу) is positive, stable or negative; a watch (пересмотр) means a change is likely soon.\n\n## Refinancing and maturity profile\n\nRefinancing (рефинансирование) means replacing old debt with new, usually at better terms or to extend maturities. The maturity profile or debt wall (график погашений, «стена погашений») shows how much is due each year; a big amount in one year is refinancing risk (риск рефинансирования), especially when markets are closed. Good treasurers (казначеи) spread maturities and keep undrawn credit lines (невыбранные кредитные линии) as a liquidity cushion (подушка ликвидности).\n\n## Default and restructuring\n\nA default (дефолт) is a missed payment. A grace period (льготный период) of a few days usually applies. After that, lenders can accelerate (потребовать досрочного погашения) the debt and start bankruptcy proceedings (процедура банкротства). More often, the parties negotiate a restructuring (реструктуризация): extending maturities (продление сроков), lowering the rate, a haircut (списание части долга) where lenders accept less than par, or a debt-for-equity swap (конвертация долга в акции) where lenders become shareholders. Distressed debt (проблемный долг) investors buy such bonds cheaply hoping to profit from the restructuring.\n\n> **Remember.** Debt is cheap but mandatory. Secured before unsecured, senior before subordinated. Covenants are the lender's early-warning system. Rating = opinion on default risk. Spread maturities to avoid a debt wall.","words":[{"w":"principal","t":"основная сумма долга","x":"Principal is repaid at maturity."},{"w":"debt capacity","t":"долговая ёмкость","x":"The company has limited debt capacity at current rates."},{"w":"revolving credit facility","t":"возобновляемая кредитная линия","x":"The revolver is undrawn."},{"w":"syndicated loan","t":"синдицированный кредит","x":"Five banks joined the syndicated loan."},{"w":"commercial paper","t":"коммерческие бумаги","x":"Commercial paper funds short-term needs."},{"w":"fixed / floating rate","t":"фиксированная / плавающая ставка","x":"The loan carries a floating rate of key rate plus 3%."},{"w":"reference rate","t":"базовая (референсная) ставка","x":"RUONIA is the reference rate for the floater."},{"w":"secured / unsecured","t":"обеспеченный / необеспеченный","x":"Unsecured bonds yield more than secured loans."},{"w":"seniority","t":"старшинство долга","x":"Seniority decides who is paid first in bankruptcy."},{"w":"guarantee","t":"гарантия, поручительство","x":"The parent provided a guarantee for the loan."},{"w":"covenant","t":"ковенант","x":"The loan has a leverage covenant of 3.5x."},{"w":"covenant breach","t":"нарушение ковенанта","x":"A covenant breach triggered talks with lenders."},{"w":"waiver","t":"отказ от применения санкций (по ковенанту)","x":"Lenders granted a waiver for a fee."},{"w":"credit rating agency","t":"рейтинговое агентство","x":"ACRA is a Russian credit rating agency."},{"w":"downgrade / upgrade","t":"понижение / повышение рейтинга","x":"The downgrade raised the cost of borrowing."},{"w":"outlook","t":"прогноз по рейтингу","x":"The outlook was changed to negative."},{"w":"refinancing","t":"рефинансирование","x":"Refinancing extended maturities to 2030."},{"w":"maturity profile (debt wall)","t":"график погашений","x":"The debt wall in 2027 is a concern."},{"w":"haircut","t":"списание части долга","x":"Bondholders accepted a 40% haircut."},{"w":"debt-for-equity swap","t":"конвертация долга в акции","x":"The restructuring included a debt-for-equity swap."},{"w":"distressed debt","t":"проблемный долг","x":"Distressed debt funds bought the bonds at 30 cents."}]},{"n":19,"title":"Macroeconomics for markets: inflation, central banks and FX","short":"ВВП, инфляция, ключевая ставка и как ЦБ её выбирает, передача ставки в экономику, валютный курс, бюджет и как макро двигает акции и облигации","level":"B2","unit":4,"min":10,"id":"macro","theory":"## Why investors read macro\n\nMacroeconomics (макроэкономика) is the study of the whole economy: growth, prices, employment, interest rates, exchange rates. Markets react to macro data every day, because it changes two inputs of every valuation: expected cash flows and the discount rate. A rate hike (повышение ставки) raises discount rates and lowers asset prices; a recession (рецессия) lowers cash flows.\n\n## GDP and the business cycle\n\nGross domestic product, GDP (валовой внутренний продукт, ВВП) is the value of everything produced in a country in a year. Real GDP growth (реальный рост ВВП) is growth after inflation. GDP per capita (ВВП на душу населения) compares living standards; at purchasing power parity, PPP (по паритету покупательной способности) it adjusts for price levels between countries.\n\nThe business cycle (экономический цикл) runs through expansion (подъём), peak (пик), contraction or recession (спад, рецессия), and trough (дно). A technical recession is two consecutive quarters (два квартала подряд) of falling GDP. Leading indicators (опережающие индикаторы) such as the purchasing managers' index, PMI (индекс деловой активности), new orders and the yield curve move before GDP; lagging indicators (запаздывающие индикаторы) such as unemployment (безработица) move after. \"Soft landing\" (мягкая посадка) means slowing inflation without a recession; \"hard landing\" (жёсткая посадка) means a recession.\n\n## Inflation\n\nInflation (инфляция) is the general rise in prices; the consumer price index, CPI (индекс потребительских цен, ИПЦ) measures it for a basket of goods. Core inflation (базовая инфляция) excludes volatile food and energy prices. Headline inflation (общая инфляция) includes everything. Economists distinguish demand-pull inflation (инфляция спроса), when the economy overheats (перегревается), and cost-push inflation (инфляция издержек), when input prices rise, for example after a currency devaluation. Disinflation (дезинфляция) is slowing inflation; deflation (дефляция) is falling prices, which sounds nice but is dangerous because people delay spending. Inflation expectations (инфляционные ожидания), measured by surveys, matter because they become self-fulfilling.\n\n## Central banks and the key rate\n\nA central bank (центральный банк) controls the money supply (денежная масса) and sets the policy rate, in Russia the key rate (ключевая ставка), in the US the federal funds rate (ставка по федеральным фондам). Most central banks follow inflation targeting (таргетирование инфляции): the Bank of Russia targets 4%, the Fed and the ECB 2%. When inflation is above target, they tighten (ужесточают политику) by raising rates; when the economy weakens, they ease (смягчают) by cutting. A hawk (ястреб) favours high rates, a dove (голубь) low rates. Forward guidance (сигнал о будущей политике) is the central bank's hint about future moves.\n\nThe transmission mechanism (трансмиссионный механизм) is how the rate reaches the economy: higher key rate → higher deposit and loan rates → less borrowing and more saving → less demand → slower price growth. It takes 3–6 quarters, which is why central banks act in advance. Other tools: reserve requirements (нормативы резервирования), open market operations (операции на открытом рынке), quantitative easing, QE (количественное смягчение), where the central bank buys bonds to push long rates down, and quantitative tightening, QT (количественное ужесточение), the reverse.\n\nReal interest rate (реальная процентная ставка) = nominal rate − inflation. With a key rate of 14% and inflation of 7%, the real rate is 7%, extremely tight by world standards; that is the Bank of Russia's choice for fighting inflation after 2023.\n\n## Exchange rates\n\nThe exchange rate (валютный курс) is the price of one currency in another. A currency appreciates (укрепляется) or depreciates (ослабевает); a sharp official cut is a devaluation (девальвация). What moves it: interest rate differentials (разница процентных ставок), because high rates attract capital (carry trade, керри-трейд); the current account (счёт текущих операций), exports minus imports plus income flows; capital flows (потоки капитала); and risk sentiment. For Russia the main driver is the trade balance (торговый баланс): oil and gas export revenues against import demand, plus capital controls (ограничения на движение капитала) after 2022. A floating exchange rate (плавающий курс) is set by the market; a fixed or pegged rate (фиксированный курс, привязка) is held by the central bank through interventions (валютные интервенции). The Bank of Russia floats the rouble but buys and sells yuan under the budget rule (бюджетное правило).\n\nA strong rouble helps importers and consumers but hurts exporters and the budget; a weak rouble does the opposite. That is why oil companies' shares rise when the rouble falls.\n\n## Fiscal policy\n\nFiscal policy (бюджетная, фискальная политика) is government spending and taxes. A budget deficit (дефицит бюджета) is spending above revenue, financed by borrowing: in Russia through OFZ. Public debt (государственный долг) is the accumulated total; Russia's is small, about 15–20% of GDP, while Japan's exceeds 200% and the US is above 120%. Large deficits push up bond yields and can feed inflation, so fiscal and monetary policy (денежно-кредитная политика) pull in opposite directions when the government spends heavily and the central bank fights inflation.\n\n## How macro moves markets\n\n| Event | Bonds | Stocks | Currency |\n|---|---|---|---|\n| Rate hike | Prices fall, yields rise | Fall, especially growth and indebted companies | Strengthens |\n| Rate cut | Prices rise | Rise | Weakens |\n| Inflation above forecast | Fall (more hikes expected) | Mixed, usually down | Mixed |\n| Strong GDP data | Fall (hikes more likely) | Rise | Strengthens |\n| Oil price jump | Russia: rouble bonds fine | Oil stocks up, airlines down | Rouble strengthens |\n\nThe calendar: the Bank of Russia's board meets eight times a year, the Fed's FOMC (Федеральный комитет по операциям на открытом рынке) eight times; inflation data come weekly in Russia and monthly in the US (CPI), and the US jobs report, non-farm payrolls (данные по занятости вне сельского хозяйства), lands on the first Friday of the month.\n\n> **Remember.** Central bank fights inflation with the key rate; the real rate is nominal minus inflation. Higher rates: bonds down, stocks down, currency up. For the rouble, watch oil and the trade balance. Fiscal deficits push yields up.","words":[{"w":"gross domestic product (GDP)","t":"валовой внутренний продукт","x":"GDP grew 1.5% in real terms."},{"w":"business cycle","t":"экономический цикл","x":"The economy is late in the business cycle."},{"w":"recession","t":"рецессия","x":"Two quarters of contraction mean a technical recession."},{"w":"leading indicator","t":"опережающий индикатор","x":"PMI is a leading indicator of activity."},{"w":"consumer price index (CPI)","t":"индекс потребительских цен","x":"CPI rose 0.4% in the month."},{"w":"core inflation","t":"базовая инфляция","x":"Core inflation excludes food and energy."},{"w":"inflation expectations","t":"инфляционные ожидания","x":"Inflation expectations fell to 13%."},{"w":"inflation targeting","t":"таргетирование инфляции","x":"The Bank of Russia targets 4% inflation."},{"w":"tighten / ease","t":"ужесточать / смягчать (политику)","x":"The central bank tightened policy by 100 bps."},{"w":"rate hike / rate cut","t":"повышение / снижение ставки","x":"Markets price in a rate cut in spring."},{"w":"forward guidance","t":"сигнал о будущей политике","x":"Forward guidance pointed to a long pause."},{"w":"transmission mechanism","t":"трансмиссионный механизм","x":"The transmission mechanism works with a lag."},{"w":"real interest rate","t":"реальная процентная ставка","x":"The real rate is 7%, among the highest in the world."},{"w":"quantitative easing (QE)","t":"количественное смягчение","x":"QE pushed long-term yields down."},{"w":"appreciate / depreciate","t":"укрепляться / ослабевать (о валюте)","x":"The rouble appreciated on strong oil prices."},{"w":"current account","t":"счёт текущих операций","x":"A current account surplus supports the currency."},{"w":"intervention","t":"валютная интервенция","x":"The central bank sold yuan in an intervention."},{"w":"budget deficit","t":"дефицит бюджета","x":"The budget deficit is 2% of GDP."},{"w":"public debt","t":"государственный долг","x":"Russia's public debt is low by global standards."},{"w":"monetary / fiscal policy","t":"денежно-кредитная / бюджетная политика","x":"Fiscal policy was loose while monetary policy was tight."},{"w":"soft landing","t":"мягкая посадка","x":"Investors hope for a soft landing."}]},{"n":20,"title":"The Russian market in English","short":"Как рассказать о российском рынке иностранцу или на собеседовании: Мосбиржа, индексы, ОФЗ и ключевая ставка, крупнейшие эмитенты, дивиденды, санкции и особенности после 2022 года","level":"B2","unit":4,"min":10,"id":"russian-market","theory":"## The infrastructure\n\nThe Russian equity market (российский рынок акций) is concentrate
