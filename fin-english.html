d on one venue: the Moscow Exchange, MOEX (Московская биржа), formed in 2011 from the merger of MICEX and RTS. The group owns the exchange, the clearing house NCC (Национальный клиринговый центр, НКЦ) and the central depository NSD (Национальный расчётный депозитарий, НРД). The St Petersburg Exchange, SPB (СПБ Биржа) used to trade foreign shares; after sanctions in 2023 that business largely stopped.\n\nThe regulator (регулятор) is the Bank of Russia (Банк России, ЦБ РФ), which is both the central bank and the supervisor of banks, brokers, insurers and the stock market: a mega-regulator (мегарегулятор). Trading is in roubles, settlement T+1, main session 10:00–18:50 Moscow time, plus morning and evening sessions.\n\n## The indices\n\nThe MOEX Russia Index, IMOEX (индекс Мосбиржи) is the rouble benchmark of about 40–50 largest and most liquid stocks, weighted by free-float market cap with a cap on single names. The RTS Index (индекс РТС) is the same basket in dollars, so it falls when the rouble weakens. Sector indices (отраслевые индексы) cover oil and gas, financials, metals and mining, IT, consumer, electricity, transport. The RGBI (индекс государственных облигаций) tracks OFZ prices; the RUCBI family tracks corporate bonds.\n\n## The main issuers\n\nRussian blue chips (голубые фишки) are dominated by commodities and state-linked companies.\n\n| Sector | Companies | What to know |\n|---|---|---|\n| Oil and gas | Lukoil, Rosneft, Gazprom, Novatek, Surgutneftegas, Tatneft, Gazprom Neft | Largest weight; earnings follow oil prices and the rouble; Surgutneftegas preferred shares pay dividends from FX gains |\n| Banks | Sberbank, VTB, T-Technologies (T-Bank), Sovcombank, Bank Saint Petersburg | Sber is the most traded stock and the biggest dividend payer |\n| Metals and mining | Norilsk Nickel, Polyus, Severstal, NLMK, MMK, Rusal, Alrosa | Exporters, cyclical, sensitive to sanctions and China |\n| Technology and internet | Yandex, Ozon, VK, HeadHunter, Positive Technologies, Astra | Growth names; many re-domiciled (переехали в российскую юрисдикцию) in 2023–2024 |\n| Consumer | X5 Group, Magnit, Lenta, Fix Price | Domestic demand, inflation beneficiaries |\n| Telecom, utilities, transport | MTS, Rostelecom, Inter RAO, Aeroflot, Transneft | Stable cash flows, regulated tariffs |\n\nState-owned enterprises, SOEs (государственные компании) such as Gazprom, Rosneft, Sberbank and VTB make up a large share of the index; the government requires them to pay 50% of IFRS net income as dividends, which is a key driver of the market's dividend culture.\n\n## Dividends: the main story\n\nRussian stocks are among the highest-yielding in the world: dividend yields (дивидендная доходность) of 8–15% are common. Companies publish a dividend policy (дивидендная политика) linking payouts to net income or free cash flow; the board recommends (совет директоров рекомендует), the general meeting approves (собрание акционеров утверждает), and the stock drops by the dividend on the ex-dividend date (экс-дивидендная дата): the dividend gap (дивидендный гэп). Retail investors (частные инвесторы), who became the majority of trading volume after 2022, watch the dividend calendar closely.\n\n## Bonds and the key rate\n\nThe government bond market is OFZ (ОФЗ, federal loan bonds), issued by the Ministry of Finance (Минфин) at weekly auctions (аукционы). Types: OFZ-PD with fixed coupon (с постоянным доходом), OFZ-PK floaters (с переменным купоном) tied to RUONIA, OFZ-IN inflation-linked (с индексируемым номиналом). Corporate bonds (корпоративные облигации) are mostly rouble-denominated; after 2022 replacement bonds (замещающие облигации) took the place of Eurobonds, and yuan bonds (юаневые облигации) appeared for exporters.\n\nThe key rate (ключевая ставка) of the Bank of Russia drives everything: it rose from 7.5% in mid-2023 to 21% in late 2024, the highest in two decades, then came down in 2025–2026 as inflation slowed. Floaters, money-market funds (фонды денежного рынка) and deposits (вклады) became the favourite instruments of retail investors during the high-rate period, drawing money away from stocks.\n\n## Currency and capital controls\n\nThe rouble (рубль) floats, but with capital controls (ограничения на движение капитала) since 2022: limits on foreign-currency transfers abroad, mandatory sale of export revenue (обязательная продажа валютной выручки) at times, and a yuan-centred FX market (валютный рынок) because dollar and euro trading on MOEX stopped in June 2024 after US sanctions on the exchange. The official rate (официальный курс) is now set by the Bank of Russia from OTC data. The yuan (юань) is the main foreign currency traded; the dollar-rouble rate still drives sentiment.\n\n## Sanctions and the post-2022 landscape\n\nAfter February 2022 the market changed structurally. Foreign investors (иностранные инвесторы) from unfriendly countries (недружественные страны) had their holdings frozen in type-C accounts (счета типа «С»); their shares, about half of the free float, no longer trade. Depositary receipts (депозитарные расписки) on Russian companies were delisted from London and New York, and many companies converted them into local shares or re-domiciled (перерегистрировались) from Cyprus, the Netherlands and other jurisdictions to Russia or special administrative regions (специальные административные районы). Western banks and the Big Four left; local brokers and rating agencies grew. Disclosure (раскрытие информации) was partly suspended, and some companies still publish limited data, which makes analysis harder. Secondary sanctions (вторичные санкции) affect payments with China, Turkey and other partners.\n\nThe result: a market owned mostly by domestic retail investors, pension funds and local institutions, trading at low multiples (P/E around 4–6) with high dividend yields, highly sensitive to geopolitics (геополитика), oil and the key rate.\n\n## Useful phrases for interviews\n\n- \"The Russian market is a dividend and commodity story: low valuations, high yields, high sensitivity to oil and the key rate.\"\n- \"Sber is the proxy for the whole market: the most liquid stock with the largest weight in the index.\"\n- \"OFZ yields reflect the Bank of Russia's policy; the curve was inverted while the key rate stayed above 15%.\"\n- \"After 2022 the investor base shifted to domestic retail; foreign holdings are frozen in type-C accounts.\"\n- \"The rouble is driven by the trade balance and capital controls rather than by interest rate differentials.\"\n\n> **Remember.** One exchange, one regulator, one benchmark (IMOEX). Commodity-heavy and state-heavy index, huge dividend culture, OFZ for the risk-free rate, key rate as the main driver. Post-2022: domestic retail, frozen foreigners, yuan instead of dollar.","words":[{"w":"Moscow Exchange (MOEX)","t":"Московская биржа","x":"Trading on the Moscow Exchange starts at 10:00."},{"w":"mega-regulator","t":"мегарегулятор","x":"The Bank of Russia acts as a mega-regulator."},{"w":"MOEX Russia Index (IMOEX)","t":"индекс Мосбиржи","x":"The IMOEX fell 1% on the rate decision."},{"w":"RTS Index","t":"индекс РТС","x":"The RTS is the dollar version of the market index."},{"w":"sector index","t":"отраслевой индекс","x":"The oil and gas sector index outperformed."},{"w":"state-owned enterprise (SOE)","t":"государственная компания","x":"SOEs must pay out 50% of net income."},{"w":"dividend policy","t":"дивидендная политика","x":"The dividend policy ties payouts to free cash flow."},{"w":"dividend gap","t":"дивидендный гэп","x":"The dividend gap closed within two weeks."},{"w":"federal loan bonds (OFZ)","t":"облигации федерального займа","x":"OFZ are the risk-free benchmark in roubles."},{"w":"Ministry of Finance","t":"Министерство финансов","x":"The Ministry of Finance placed OFZ at auction."},{"w":"replacement bonds","t":"замещающие облигации","x":"Replacement bonds took over from Eurobonds."},{"w":"money-market fund","t":"фонд денежного рынка","x":"Money-market funds attracted record inflows."},{"w":"capital controls","t":"ограничения на движение капитала","x":"Capital controls limit transfers abroad."},{"w":"mandatory sale of export revenue","t":"обязательная продажа валютной выручки","x":"Exporters faced mandatory sale of export revenue."},{"w":"official exchange rate","t":"официальный курс","x":"The official rate is set from OTC data."},{"w":"unfriendly countries","t":"недружественные страны","x":"Investors from unfriendly countries cannot sell."},{"w":"type-C account","t":"счёт типа «С»","x":"Foreign holdings are frozen in type-C accounts."},{"w":"depositary receipt","t":"депозитарная расписка","x":"Depositary receipts were converted into local shares."},{"w":"re-domiciliation","t":"редомициляция, смена юрисдикции","x":"Re-domiciliation to Russia unlocked dividends."},{"w":"secondary sanctions","t":"вторичные санкции","x":"Secondary sanctions complicate payments with Chinese banks."},{"w":"geopolitics","t":"геополитика","x":"Geopolitics drives the market more than earnings."}]}],"units":{"1":["Statements and cash","Отчётность и денежные потоки"],"2":["Valuation","Оценка компаний"],"3":["Markets and instruments","Рынки и инструменты"],"4":["Deals, debt and the big picture","Сделки, долг и макро"]}}</script>

<script>
(function(){
'use strict';
(function(){
  var k='lasthash:'+(location.pathname.split('/').pop()||'index.html');
  try{
    if(!location.hash){var h=localStorage.getItem(k);if(h&&h.length>1)history.replaceState(null,'',location.pathname+location.search+h)}
    var sv=function(){try{if(location.hash.length>1&&!/^#home$/.test(location.hash))localStorage.setItem(k,location.hash);else localStorage.removeItem(k)}catch(e){}};
    window.addEventListener('hashchange',sv);sv();
  }catch(e){}
})();
var root=document.documentElement;
function $(s,e){return (e||document).querySelector(s)}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var view=$('#view');
var D=JSON.parse($('#edata').textContent),LS=D.lessons,UN=D.units,BYID={};
LS.forEach(function(l,i){l.i=i;BYID[l.id]=l});
var PROF='artem';

/* оформление (общее с разделом «Финансы») */
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme')}
var SKINS=[['auto','Как в системе','#F4F1E8','#1F6B57',''],['ocean','Океан','#E9F0F6','#1A5FA8','light'],
  ['dark','Ночь','#171611','#5FC2A3','dark'],['graphite','Графит','#15171B','#7BA7F5','dark'],['news','Газета','#161512','#E0483B','dark']];
function applySkin(id){
  var sk=SKINS.filter(function(x){return x[0]===id})[0];if(!sk){id='auto';sk=SKINS[0]}
  if(id==='auto'){root.removeAttribute('data-skin');applyTheme('')}
  else if(id==='light'||id==='dark'){root.removeAttribute('data-skin');applyTheme(id)}
  else{root.setAttribute('data-skin',id);applyTheme(sk[4])}
  try{var bg=getComputedStyle(root).getPropertyValue('--bg').trim();$$('meta[name=theme-color]').forEach(function(m){if(bg)m.setAttribute('content',bg)})}catch(e){}
}
function skinGet(){var v=store('fin:skin');if(v)return v;var t=store('theme');return t==='dark'||t==='light'?t:'auto'}
applySkin(skinGet());
function skinMenu(open){
  var m=document.getElementById('thm');
  if(!open){if(m)m.remove();return}
  if(m){m.remove();return}
  var cur=skinGet();m=document.createElement('div');m.id='thm';m.className='thm';m.setAttribute('role','menu');
  m.innerHTML='<p>Оформление</p>'+SKINS.map(function(x,i){return (i===1||i===3?'<div class="sep"></div>':'')+'<button type="button" role="menuitemradio" aria-checked="'+(x[0]===cur)+'" class="'+(x[0]===cur?'on':'')+'" data-skin="'+x[0]+'"><span class="skw" style="background:'+x[2]+'"><i style="background:'+x[3]+'"></i></span>'+x[1]+'</button>'}).join('');
  document.body.appendChild(m);
}

/* прогресс: только отметки «прочитано» */
var P=(function(){try{return JSON.parse(store('feng:'+PROF)||'{}')||{}}catch(e){return {}}})();
P.done=P.done||{};
function pSave(){store('feng:'+PROF,JSON.stringify(P))}

/* markdown */
marked.use({gfm:true,breaks:false,renderer:{
  table:function(h,b){return '<div class="tablewrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
function md(s){return marked.parse(s||'')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9а-яё]+/g,'-').replace(/^-|-$/g,'')}

function nextLesson(){for(var i=0;i<LS.length;i++)if(!P.done[LS[i].id])return LS[i];return null}
function lessonRow(l){
  var d=!!P.done[l.id];
  return '<a class="lrow'+(d?' done':'')+'" href="#t/'+l.id+'" data-q="'+esc((l.title+' '+l.short+' '+l.words.map(function(w){return w.w+' '+w.t}).join(' ')).toLowerCase())+'"><span class="ln">'+(d?'✓':l.n)+'</span><span class="lt"><b>'+esc(l.title)+'</b><small>'+esc(l.short)+'</small></span><span class="lm"><span class="tag">'+esc(l.level)+'</span><span class="tag">≈ '+l.min+' мин</span></span></a>';
}
function renderHome(){
  document.title='Английский · Финансы';
  var done=Object.keys(P.done).filter(function(k){return BYID[k]}).length,tot=LS.length,nx=nextLesson(),words=LS.reduce(function(s,l){return s+l.words.length},0);
  var h='<h1 class="pg">Finance English</h1><p class="lead">'+tot+' тем по 7–10 минут: теория финансов по-английски, как её объясняют в учебниках и на собеседованиях. Русский перевод у каждого термина в скобках, список слов с примерами в конце темы. Без заданий: читай и отмечай прочитанное.</p>';
  h+='<div class="hero"><div class="box"><h3>Прогресс</h3><div class="big">'+done+' <small>из '+tot+' тем</small></div><div class="bar2"><i style="width:'+Math.round(done/tot*100)+'%"></i></div>'
    +'<div class="stats"><span>Слов в курсе: <b>'+words+'</b></span><span>Уровень: <b>B1 → C1</b></span></div></div>';
  h+= nx?'<a class="box cont" href="#t/'+nx.id+'"><h3>'+(done?'Продолжить':'Начать')+'</h3><b>'+nx.n+'. '+esc(nx.title)+'</b><small>'+esc(nx.short)+'</small><span class="btn sm" style="align-self:flex-start">Открыть тему</span></a>'
    : '<div class="box"><h3>Курс прочитан</h3><b style="font:600 19px var(--serif)">Все темы отмечены</b><p class="lead" style="margin:6px 0 0">Перечитывай слова: в конце каждой темы есть список.</p></div>';
  h+='</div>';
  h+='<div class="tools"><input type="search" id="lq" placeholder="Найти тему или слово: WACC, облигации, leverage…" aria-label="Поиск темы"></div>';
  for(var u=1;u<=4;u++){var ls=LS.filter(function(l){return l.unit===u});if(!ls.length)continue;
    h+='<div class="unit" data-u="'+u+'"><h2>'+esc(UN[u][0])+'</h2><span>'+esc(UN[u][1])+' · '+ls.length+' '+plural(ls.length,['тема','темы','тем'])+'</span></div><div data-ul="'+u+'">'+ls.map(lessonRow).join('')+'</div>'}
  h+='<div class="empty" id="lnone" hidden>Ничего не найдено.</div>';
  view.innerHTML=h;
}
function filterHome(){
  var q=($('#lq')||{}).value||'';q=q.toLowerCase().trim();var any=false;
  $$('.lrow').forEach(function(a){var ok=!q||a.getAttribute('data-q').indexOf(q)>=0;a.hidden=!ok;if(ok)any=true});
  $$('.unit').forEach(function(u){var box=$('[data-ul="'+u.getAttribute('data-u')+'"]');var vis=$$('.lrow',box).some(function(a){return !a.hidden});u.hidden=!vis;box.hidden=!vis});
  var n=$('#lnone');if(n)n.hidden=any;
}
function plural(n,f){var m=n%10,c=n%100;return m===1&&c!==11?f[0]:(m>=2&&m<=4&&(c<10||c>=20)?f[1]:f[2])}

function renderLesson(id,sub){
  var l=BYID[id];if(!l){location.hash='#home';return}
  document.title=l.title+' · Finance English';store('feng:last:'+PROF,id);
  var done=!!P.done[l.id],pv=LS[l.i-1],nx=LS[l.i+1];
  var body=md(l.theory),tmp=document.createElement('div');tmp.innerHTML=body;
  var heads=[];$$('h2',tmp).forEach(function(h2){var s='s-'+slug(h2.textContent);h2.id=s;heads.push([s,h2.textContent])});
  body=tmp.innerHTML;
  var h='<a class="crumb" href="#home">← Все темы</a><h1 class="pg">'+l.n+'. '+esc(l.title)+'</h1>'
   +'<div class="lh"><span class="tag">'+esc(l.level)+'</span><span class="tag">≈ '+l.min+' мин</span><span>'+esc(UN[l.unit][0])+'</span>'+(done?'<span class="tag sc">прочитано</span>':'')+'</div>'
   +'<p class="lead">'+esc(l.short)+'</p>';
  if(heads.length)h+='<nav class="snav" id="snav">'+heads.map(function(x){return '<button type="button" class="chip" data-go="'+x[0]+'">'+esc(x[1])+'</button>'}).join('')+'<button type="button" class="chip" data-go="s-words">Words</button></nav>';
  h+='<div class="prose" id="theory">'+body+'</div>';
  h+='<section class="sec" id="s-words"><h2>Words <small style="font:500 14px var(--sans);color:var(--muted)">'+l.words.length+'</small></h2><div class="tools"><button type="button" class="btn sm ghost" data-hidet>Скрыть переводы</button></div>'
   +'<div class="tablewrap" id="wbox"><table class="wt"><thead><tr><th>Term</th><th>Перевод</th><th>Example</th></tr></thead><tbody>'
   +l.words.map(function(w){return '<tr><td>'+esc(w.w)+'</td><td class="tr">'+esc(w.t)+'</td><td class="ex">'+esc(w.x)+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  h+='<div class="done-bar'+(done?' ok':'')+'" id="donebar"><button type="button" class="btn" data-done="'+l.id+'">'+(done?'✓ Прочитано (снять отметку)':'Отметить прочитанным')+'</button></div>';
  h+='<div class="pager">'+(pv?'<a class="pv" href="#t/'+pv.id+'"><small>← Предыдущая</small><b>'+pv.n+'. '+esc(pv.title)+'</b></a>':'<span></span>')+(nx?'<a class="nx" href="#t/'+nx.id+'"><small>Следующая →</small><b>'+nx.n+'. '+esc(nx.title)+'</b></a>':'')+'</div>';
  view.innerHTML=h;
  var hh=$('#top').offsetHeight;root.style.setProperty('--hh',hh+'px');
  if(sub){var el=document.getElementById(sub);if(el)setTimeout(function(){el.scrollIntoView({block:'start'});el.classList.add('pulse')},30)}
}

var lastRoute='';
function route(){
  var h=decodeURIComponent(location.hash.slice(1)||'home'),p=h.split('/');lastRoute=h;
  skinMenu(false);
  if(p[0]==='t'){renderLesson(p[1],p[2])}
  else renderHome();
  if(!(p[0]==='t'&&p[2]))window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(!t.closest)return;
  if(t.closest('#b-theme')){e.stopPropagation();skinMenu(true);return}
  if(b=t.closest('#thm [data-skin]')){var id=b.getAttribute('data-skin');store('fin:skin',id);if(id==='light'||id==='dark')store('theme',id);applySkin(id);skinMenu(false);return}
  if(document.getElementById('thm')&&!t.closest('#thm'))skinMenu(false);
  if(b=t.closest('[data-sz]')){if(window.siteZoom)window.siteZoom(+b.getAttribute('data-sz'));return}
  if(b=t.closest('[data-go]')){var el=document.getElementById(b.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b=t.closest('[data-hidet]')){var bx=$('#wbox').parentNode;bx.classList.toggle('hidet');b.textContent=bx.classList.contains('hidet')?'Показать переводы':'Скрыть переводы';return}
  if(b=t.closest('.hidet .tr')){b.classList.toggle('show');return}
  if(b=t.closest('[data-done]')){var l2=BYID[b.getAttribute('data-done')];if(P.done[l2.id]){delete P.done[l2.id]}else{P.done[l2.id]=Date.now()}pSave();var bar=$('#donebar'),dn=!!P.done[l2.id];bar.classList.toggle('ok',dn);b.textContent=dn?'✓ Прочитано (снять отметку)':'Отметить прочитанным';return}
});
document.addEventListener('input',function(e){if(e.target.id==='lq')filterHome()});
route();
})();
</script>
</body></html>
