вых активов, чтобы выдержать потери", "x": "<code>Н1 = Капитал банка / RWA<\/code><br><span class=\"fx\">где: Норматив достаточности капитала ЦБ. Чем выше, тем устойчивее банк<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Налог на прибыль", "f": "", "d": "Налог на прибыль организаций. Ставка 20% по общему правилу, с 2025 года 25% (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Налоговый вычет", "f": "", "d": "Сумма, которая уменьшает налогооблагаемый доход или налог. Для инвесторов — вычеты по ИИС (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "НДС", "f": "Налог на добавленную стоимость", "d": "Налог на продажи. Основная ставка 20% (сверить). Компания платит разницу между НДС с продаж и НДС с закупок.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "НДФЛ", "f": "Налог на доходы физических лиц", "d": "Налог на доходы людей, в том числе от инвестиций. Ставка зависит от размера дохода (условия сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Недружественные страны", "f": "", "d": "Перечень государств, введённый правительством РФ в 2022 году. Сделки с их резидентами требуют разрешений (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Нерезидент", "f": "", "d": "Лицо или компания, не являющиеся резидентами РФ по валютному или налоговому закону. Для них есть ограничения на сделки с 2022 года (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "НКД", "f": "Накопленный купонный доход", "d": "Часть купона, которая набежала с последней выплаты до сегодняшнего дня. Если купон платят раз в полгода, то при покупке облигации через три месяца после выплаты покупатель компенсирует продавцу набежавшую половину", "x": "<code>НКД = Купон × Дней с даты выплаты / Дней в купонном периоде<\/code><br><span class=\"fx\">где: Купон — размер выплаты за период. Часть купона, накопленная продавцом облигации<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "НКЦ", "f": "Национальный клиринговый центр", "d": "Клиринг и центральный контрагент на Мосбирже: гарантирует исполнение сделок.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "НПФ", "f": "Негосударственный пенсионный фонд", "d": "Организация, которая копит и инвестирует пенсионные деньги людей и платит накопленное при выходе на пенсию.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "НРД", "f": "Национальный расчётный депозитарий", "d": "Хранит ценные бумаги и проводит расчёты по сделкам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Отсечка (record date)", "f": "Дата фиксации реестра", "d": "Кто владеет акцией на эту дату, тот получит дивиденд. Купить надо раньше с учётом T+1.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ОФЗ", "f": "Облигации федерального займа", "d": "Облигации, которые выпускает государство РФ. Государство берёт у людей и организаций в долг и обещает вернуть с процентами. Считаются самыми надёжными в рублях", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ОФЗ-ИН", "f": "ОФЗ с индексируемым номиналом", "d": "Номинал растёт вместе с инфляцией. Защищает от обесценения.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ОФЗ-ПД", "f": "ОФЗ с постоянным доходом", "d": "Обычные ОФЗ с фиксированным купоном.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ОФЗ-ПК", "f": "ОФЗ с переменным купоном", "d": "Купон привязан к ставке денежного рынка (RUONIA), поэтому растёт вместе со ставками.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Параллельный импорт", "f": "", "d": "Ввоз товаров без разрешения правообладателя, разрешённый в РФ с 2022 года для определённых брендов (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ПДН", "f": "Показатель долговой нагрузки", "d": "Какая доля доходов заёмщика уходит на платежи по кредитам (его регулирует ЦБ). Если человек зарабатывает 100 и платит по кредитам 40, ПДН равен 40%. Чем он выше, тем рискованнее для банка", "x": "<code>ПДН = Платежи по долгам в месяц / Доход в месяц<\/code><br><span class=\"fx\">где: Какую часть дохода клиент тратит на обслуживание всех кредитов<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "ПИФ", "f": "Паевой инвестиционный фонд", "d": "Российский паевой фонд. Покупаешь пай, управляющая компания вкладывает деньги в бумаги. Взимает комиссию за управление.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Плечо", "f": "Кредитное плечо", "d": "Отношение позиции к своим деньгам. Плечо 1:5 — на 100 рублей своих открыта позиция на 500.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Правкомиссия", "f": "Правительственная комиссия по контролю за иностранными инвестициями", "d": "Орган, который разрешает сделки с нерезидентами из недружественных стран, в том числе продажу бизнеса с дисконтом (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Редомициляция", "f": "", "d": "Перенос компании из одной юрисдикции в другую без ликвидации. Российские компании переезжают с Кипра и из Нидерландов в САР (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "РСБУ", "f": "Российские стандарты бухучёта", "d": "Российские правила, по которым компании ведут бухгалтерский учёт и составляют отчётность. Нужны для налогов и отчётов внутри страны, а МСФО — для сравнения с зарубежными компаниями", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "САР", "f": "Специальный административный район", "d": "Острова Русский и Октябрьский, где зарегистрированные компании получают налоговые льготы. Российские «офшоры» (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "СБП", "f": "Система быстрых платежей", "d": "Российская система ЦБ для мгновенных переводов по номеру телефона и оплаты по QR.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Спред (bid-ask)", "f": "Разница котировок", "d": "Разница между лучшей ценой продажи и покупки: скрытая стоимость сделки.", "x": "<code>Spread = Ask − Bid<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Стакан", "f": "", "d": "Таблица заявок на покупку и продажу по ценам. То же, что order book.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Счёт типа «С»", "f": "", "d": "Специальный счёт, на который зачисляют выплаты нерезидентам из недружественных стран. Вывести деньги с него ограниченно (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Тикер", "f": "", "d": "Короткий код бумаги на бирже: SBER, GAZP, AAPL.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ФАС", "f": "Федеральная антимонопольная служба", "d": "Одобряет крупные сделки слияния, следит за конкуренцией.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ФНБ", "f": "Фонд национального благосостояния", "d": "Резервный фонд государства РФ: деньги от нефтегазовых доходов, которые копят на трудные времена и пенсионные нужды.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ФСО", "f": "Федеральные стандарты оценки", "d": "Стандарты оценочной деятельности РФ. Это обязательные правила, по которым оценщики определяют стоимость имущества и бизнеса", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ЦБ РФ", "f": "Банк России", "d": "Центральный банк: ставит ключевую ставку, регулирует банки и рынок, хранит резервы.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Цифровой рубль", "f": "", "d": "Третья форма рубля (кроме наличного и безналичного), которую выпускает ЦБ РФ. Хранится на платформе ЦБ.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ЦФА", "f": "Цифровые финансовые активы", "d": "Российские цифровые права на блокчейне: можно выпустить аналог облигации или права на товар. Регулируются законом о ЦФА (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Эмитент", "f": "", "d": "Компания или государство, выпустившие ценные бумаги.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Юанизация", "f": "", "d": "Рост доли юаня в расчётах, вкладах и долге российских компаний после 2022 года.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Чистый долг (Net Debt)", "f": "", "d": "Всё, что компания должна, минус деньги, которые у неё уже есть на счетах. Пример: долг 100 млн, на счетах 30 млн — чистый долг 70 млн. Если денег больше, чем долга, чистый долг отрицательный — это хорошо.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Оборотный капитал (NWC)", "f": "", "d": "Деньги, застрявшие в повседневных делах компании: товар на складе плюс то, что должны нам покупатели, минус то, что мы должны поставщикам. Чем больше этих денег «заморожено», тем меньше свободных денег остаётся у компании.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дебиторская задолженность", "f": "", "d": "Деньги, которые покупатели ещё не заплатили за товар, уже полученный от компании. Пример: отгрузили товар на 100 тыс. ₽ с оплатой через месяц — эти 100 тыс. ₽ пока «висят» как долг покупателя.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Кредиторская задолженность", "f": "", "d": "Деньги, которые сама компания должна поставщикам за уже полученный товар. Это как беспроцентный кредит: пока не заплатили, можно пользоваться чужими деньгами бесплатно.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Амортизация (D&A)", "f": "", "d": "Постепенное «списание» стоимости оборудования и других долгих покупок. Пример: станок за 1 млн, служит 10 лет — каждый год в расходы идёт 100 тыс. ₽, хотя деньги реально потратили один раз. Из-за этого прибыль и налог меньше, а деньги в кассе остаются.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Выручка (Revenue)", "f": "", "d": "Все деньги, которые компания заработала продажами за период, до вычета расходов (без налога НДС). Это самая первая, «верхняя» строка отчёта о прибылях и убытках.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Себестоимость (COGS)", "f": "", "d": "Сколько стоило сделать то, что компания продала: сырьё, зарплата рабочих на производстве, электричество. Пример: продали куртку за 5 000 ₽, на её пошив ушло 3 000 ₽ — себестоимость 3 000 ₽.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Чистая прибыль (Net Income)", "f": "", "d": "Сколько остаётся у компании после вычета всех расходов, процентов по долгам и налогов. Эта прибыль принадлежит владельцам (акционерам), из неё им выплачивают дивиденды.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Рыночная капитализация", "f": "", "d": "Сколько стоит вся компания на бирже: цена одной акции, умноженная на число акций. Пример: акция 100 ₽, акций 1 млн — компания стоит 100 млн ₽.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дисконтирование", "f": "", "d": "Пересчёт будущих денег в сегодняшние: 100 ₽ через год стоят меньше, чем 100 ₽ сейчас, ведь сегодняшние можно вложить и заработать. Пример: при ставке 10% 110 ₽ через год равны 100 ₽ сегодня. Чем дальше срок и выше ставка, тем дешевле будущие деньги.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Ставка дисконтирования", "f": "", "d": "Процент в год, который инвестор хочет получать за риск вложения. Чем рискованнее, тем он выше. Для всей компании это WACC (средняя цена всех денег компании), для владельцев — Ke (доходность, которую ждут акционеры).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Терминальная стоимость (TV)", "f": "", "d": "Оценка всего, что компания заработает после последнего года прогноза (обычно прогноз рисуют на 5–10 лет). Считают по формуле Гордона или через мультипликатор выхода (во сколько раз прибыль обычно оценивают при продаже). Часто это 60–80% всей оценки компании.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Модель Гордона", "f": "", "d": "Формула, которая оценивает бесконечный поток денег, растущий каждый год на одну и ту же долю g: первый платёж делим на (r − g), где r — требуемая доходность. Пример: платёж 10, r = 15%, g = 5% дают 10 / 0,10 = 100. Работает, только если r больше g.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Бета (β)", "f": "", "d": "Показывает, насколько акция «качается» вместе с рынком. Бета = 1 — движется как рынок, 1,5 — в полтора раза сильнее (и вверх, и вниз), меньше 1 — спокойнее рынка.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Премия за риск (ERP)", "f": "", "d": "Дополнительная доходность, которую инвесторы ждут от акций сверх безопасных вложений (например, гособлигаций) — плата за риск. В США около 3,7% (Дамодаран, сентябрь 2026).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Безрисковая ставка (Rf)", "f": "", "d": "Доходность самого надёжного вложения — государственных облигаций в той же валюте и на тот же срок. В России это ОФЗ на 10 лет (около 16,6% в октябре 2026), в США — казначейские облигации на 10 лет (около 5,2%).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Стоимость собственного капитала (Ke)", "f": "", "d": "Сколько процентов в год хотят получать владельцы компании за риск вложения в её акции. Обычно считают по формуле CAPM: безопасная ставка + бета × премия за риск (Rf + β × ERP).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Стоимость долга (Kd)", "f": "", "d": "Процент, под который компания берёт в долг. В расчётах берут его после налога: Kd × (1 − t), где t — ставка налога, потому что проценты по долгу уменьшают налог. Пример: 20% при налоге 25% дают 15%.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Налоговый щит", "f": "", "d": "Экономия на налоге благодаря тому, что проценты по долгу вычитаются из налогооблагаемой прибыли. Пример: проценты 100 тыс. ₽, налог 25% — компания экономит 25 тыс. ₽. Поэтому долг для компании чуть дешевле, чем кажется.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Мультипликатор", "f": "", "d": "Во сколько раз цена компании больше её показателя: прибыли, выручки и т. д. (примеры: P/E, EV/EBITDA). Пример: компания стоит 700 млн, прибыль 100 млн — мультипликатор 7, то есть рынок платит 7 ₽ за каждый рубль прибыли.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Премия за контроль", "f": "", "d": "Наценка сверх биржевой цены, которую покупатель платит, чтобы получить контроль над компанией: право решать, как ею управлять. Обычно 20–40%. Пример: акция стоит 100 ₽ — покупатель готов заплатить 130 ₽.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Синергии", "f": "", "d": "Эффект «1 + 1 = 3»: после объединения двух компаний вместе они зарабатывают больше или тратят меньше, чем по отдельности. Пример: слили две бухгалтерии и сэкономили на зарплатах.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Гудвил (Goodwill)", "f": "", "d": "Сколько покупатель переплатил за компанию сверх стоимости её реального имущества (за вычетом долгов). Пример: имущество стоит 80 млн, купили за 100 млн — гудвил 20 млн (за бренд, клиентов, команду). Раз в год проверяют, не обесценился ли он.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Доли меньшинства (NCI)", "f": "", "d": "Часть дочерней компании, которая принадлежит не нам, а другим владельцам. Пример: мы владеем 80% дочки — остальные 20% это доля меньшинства. Когда считаем стоимость акций материнской компании, эту часть вычитают.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Доходность к погашению (YTM)", "f": "", "d": "Сколько процентов в год вы заработаете, если купите облигацию по сегодняшней цене и продержите до дня погашения (когда вам вернут номинал). Это удобный способ сравнить разные облигации между собой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Купон", "f": "", "d": "Регулярная выплата процентов по облигации, обычно считается от её номинала. Пример: облигация номиналом 1 000 ₽ с купоном 10% в год приносит 100 ₽ в год.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Номинал облигации", "f": "", "d": "Сумма, которую выпустивший облигацию вернёт владельцу в день погашения, обычно 1 000 ₽. Цену облигации на бирже указывают в процентах от номинала: цена 95% значит 950 ₽.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Оферта (по облигации)", "f": "", "d": "Дата, когда выпустивший облигацию обязан выкупить её по желанию владельца (или сам может погасить досрочно). Доходность часто считают именно до этой даты, потому что деньги вернутся раньше срока.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Спред", "f": "", "d": "Разница между двумя ставками доходности. Кредитный спред — это разница между доходностью облигации компании и ОФЗ (гособлигаций) того же срока: надбавка за то, что компания может не вернуть долг. Пример: 18% − 15% = спред 3 п.п.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Ковенант", "f": "", "d": "Условие в кредитном договоре или в условиях облигации, которое компания обязана соблюдать. Пример: долг не должен превышать прибыль (EBITDA) более чем в 3 раза. Если нарушила, кредитор вправе потребовать вернуть деньги досрочно.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Ключевая ставка", "f": "", "d": "Главная ставка Банка России (ЦБ): под этот процент он даёт деньги банкам и принимает у них вклады. От неё зависят ставки по вкладам, кредитам и облигациям во всей стране. Сейчас 14% (с 27.07.2026).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Кривая доходности", "f": "", "d": "График, который показывает, сколько процентов платят по гособлигациям на разные сроки. Обычно чем дольше срок, тем выше процент — это норма. Если короткие ставки выше длинных (инвертированная кривая), рынок ждёт, что ставки снизятся.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дивидендная доходность", "f": "", "d": "Сколько процентов в год составляют дивиденды (выплаты владельцам) от цены акции. Пример: дивиденд 10 ₽ в год, акция стоит 100 ₽ — доходность 10%.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Байбэк (buyback)", "f": "", "d": "Компания покупает на бирже собственные акции. Это ещё один способ вернуть деньги владельцам, как дивиденды. Акций становится меньше, поэтому прибыль на одну акцию (EPS) растёт.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Волатильность (σ)", "f": "", "d": "Насколько сильно и часто скачет цена актива. Измеряют в % за год: чем больше число, тем рискованнее актив. Пример: волатильность 30% — цена в течение года обычно отклоняется от среднего примерно на треть.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Ликвидность", "f": "", "d": "Насколько быстро и без потери в цене актив можно превратить в деньги. Наличные — самые ликвидные, квартиру продать сложнее. Для компании это ещё и способность вовремя платить по срочным долгам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Инфляция (π)", "f": "", "d": "Рост цен в стране: на те же деньги со временем можно купить меньше. В России в сентябре 2026 цены выросли на 6,35% за год, цель ЦБ — 4%.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Опцион", "f": "", "d": "Договор, который даёт право (но не обязывает) купить или продать актив по заранее оговорённой цене до определённой даты. Право купить — колл, право продать — пут. Пример: колл на акцию по 100 ₽ выгоден, если акция подорожает до 120 ₽.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Форвард / фьючерс", "f": "", "d": "Договор купить или продать что-то в будущем по цене, которую согласовали сегодня. Форвард — частная договорённость, фьючерс — такой же договор, но стандартный и торгуется на бирже.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Стейблкоин", "f": "", "d": "Криптовалюта, цена которой привязана к обычной валюте, чаще к доллару (USDT, USDC), поэтому не скачет, как биткоин. Её выпускает компания, которая держит резервы в обеспечение.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "МСФО (IFRS)", "f": "", "d": "Международные стандарты финансовой отчётности (на английском IFRS): единые правила, по которым компании составляют отчёты. По ним удобно сравнивать публичные компании, то есть те, чьи акции торгуются на бирже.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Маржа", "f": "", "d": "Какая доля выручки превращается в прибыль. Пример: выручка 100 ₽, прибыль 15 ₽ — маржа 15%. Бывает валовая (после себестоимости), по EBITDA и чистая (после всех расходов и налогов).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "КБД (кривая бескупонной доходности)", "f": "", "d": "Кривая бескупонной доходности: график, который строят ЦБ и Мосбиржа и который показывает, сколько процентов приносят ОФЗ на разные сроки. По нему определяют безопасную ставку и считают надбавки за риск (спреды).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Индекс Мосбиржи (IMOEX)", "f": "", "d": "Главный показатель российского рынка акций в рублях. Он считается по 40–50 крупнейшим компаниям, которые легко купить и продать; чем компания дороже на бирже и чем больше её акций в свободном обращении (free float), тем сильнее она влияет на индекс. Если индекс растёт, акции в среднем дорожают.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "S&P 500", "f": "", "d": "Индекс 500 крупнейших американских компаний. По нему смотрят, как в целом дела на рынке акций США: если индекс растёт, акции в среднем дорожают.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Асват Дамодаран", "f": "", "d": "Профессор Нью-Йоркского университета (NYU Stern), самый известный специалист по оценке компаний. Бесплатно публикует нужные данные: премию за риск, беты и мультипликаторы по отраслям и странам.", "x": "", "u": "finance.html#learn/glossariy"}];
var RU='йцукенгшщзхъфывапролджэячсмитьбю',EN="qwertyuiop[]asdfghjkl;'zxcvbnm,.";
var TR={а:'a',б:'b',в:'[wv]',г:'g',д:'d',е:'[ei]',ё:'e',ж:'(?:zh|j)',з:'z',и:'[ie]',й:'[yji]',к:'[kc]',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'[sc]',т:'t',у:'[uy]',ф:'(?:f|ph)',х:'[hx]',ц:'c',ч:'(?:ch|c)',ш:'(?:sh|s)',щ:'(?:sh|s)',ы:'[yi]',э:'e',ю:'(?:yu|u)',я:'(?:ya|a)',ь:'',ъ:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lc(x){return String(x||'').toLowerCase().replace(/ё/g,'е')}
function plain(h){return String(h||'').replace(/<[^>]+>/g,'')}
function escRe(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function isCyr(q){return /[а-яё]/i.test(q)&&!/[a-z]/i.test(q)}
function layout(q){return Array.from(q.toLowerCase()).map(function(c){var k=RU.indexOf(c);return k>=0?EN[k]:c}).join('').replace(/[\[\];',.]/g,'')}
function tsrc(q){var pv='';return '\\b'+Array.from(lc(q).replace(/\s+/g,'')).map(function(c){var r=TR[c]!=null?TR[c]:escRe(c);if(c===pv&&r)r=r+'?';pv=c;return r}).join('')}
D.forEach(function(e){var h=e.t.split(/\s[—-]\s/)[0];e.head=lc(h);e.all=lc(e.t+' '+e.f);e.words=e.all.split(/[^a-zа-я0-9&]+/).filter(Boolean)});
function local(q){
  var ql=lc(q.trim()),out=[];if(ql.length<2)return out;
  var rxs=[new RegExp('^'+escRe(ql))];
  var alts=[ql];
  if(isCyr(q)){var lf=layout(q);if(/^[a-z0-9 ]{2,}$/.test(lf))alts.push(lf);}
  D.forEach(function(e){
    var sc=0;
    alts.forEach(function(a){
      if(e.head===a)sc=Math.max(sc,100);
      else if(e.head.indexOf(a)===0&&a.length>=2)sc=Math.max(sc,70-Math.min(30,e.head.length-a.length));
      else if(e.words.indexOf(a)>=0)sc=Math.max(sc,60);
      else if(a.length>=4&&e.all.indexOf(a)>=0)sc=Math.max(sc,35)});
    if(!sc&&isCyr(q)&&ql.replace(/\s+/g,'').length>=3){var rx=new RegExp(tsrc(q),'i');if(rx.test(e.head)&&e.head.length<=Math.max(8,ql.length*2+2))sc=80;else if(e.words.some(function(w){return rx.test(w)&&w.length<=ql.length*2+2}))sc=45}
    if(!sc&&ql.length>=4){var st=ql.length>5?ql.slice(0,-2):ql;if(e.all.indexOf(st)>=0)sc=25}
    if(sc)out.push({e:e,sc:sc})});
  out.sort(function(a,b){return b.sc-a.sc});return out.slice(0,5);
}
function card(e){
  var h='<div class="tk"><h2>'+esc(e.t.split(/\s[—-]\s/)[0])+'</h2>';
  if(e.f)h+='<div class="en">'+esc(e.f)+'</div>';
  else if(e.t.indexOf(' — ')>0)h+='<div class="en">'+esc(e.t.split(' — ').slice(1).join(' — '))+'</div>';
  h+='<div class="lb">Суть</div><p>'+esc(e.d)+'</p>';
  if(e.x)h+='<div class="lb">Формула</div>'+e.x.replace(/<code>/g,'<code>').replace(/<span class="fx">/g,'<span class="fx">');
  h+='<a href="'+esc(e.u)+'">Разобрано в курсе →</a></div>';return h}
var box=document.getElementById('sr'),web=document.getElementById('web'),inp=document.getElementById('q'),tmr=null,seq=0;
function wiki(q){
  var my=++seq,cy=isCyr(q),lang=cy?'ru':'en',other=cy?'en':'ru';
  web.innerHTML='<div class="sh">Из интернета (Википедия)</div><p class="sm">Ищу…</p>';
  var u='https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&gsrsearch='+encodeURIComponent(q+(cy?' финансы':' finance'))+'&prop=extracts|langlinks|info&exintro=1&explaintext=1&exchars=650&lllang='+other+'&lllimit=1&inprop=url';
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    if(my!==seq)return;var pg=j.query&&j.query.pages?Object.keys(j.query.pages).map(function(k){return j.query.pages[k]}).sort(function(a,b){return a.index-b.index}):[];
    if(!pg.length){web.innerHTML='<div class="sh">Из интернета (Википедия)</div><p class="sm">Ничего не нашлось. Попробуй написать по-английски или иначе.</p>';return}
    web.innerHTML='<div class="sh">Из интернета (Википедия)</div>'+pg.map(function(p){
      var ll=p.langlinks&&p.langlinks[0]?p.langlinks[0]['*']:'';
      return '<div class="tk web"><h2>'+esc(p.title)+'</h2>'+(ll?'<div class="en">'+(cy?'По-английски':'По-русски')+': '+esc(ll)+'</div>':'')+'<div class="lb">Суть</div><p>'+esc(p.extract||'')+'</p><div class="src">Википедия, не проверено по курсу. Формул здесь нет — их смотри в карточках выше.</div><a href="'+esc(p.fullurl)+'" target="_blank" rel="noopener">Открыть статью →</a></div>'}).join('')})
  .catch(function(){if(my!==seq)return;web.innerHTML='<div class="sh">Из интернета (Википедия)</div><p class="sm">Не получилось достучаться до Википедии. Проверь интернет.</p>'});
}
function run(){
  var q=inp.value.trim();
  if(q.length<2){box.innerHTML='<p class="sm">Напиши термин по-русски или по-английски: «WACC», «вакк», «чистый долг», «accretion», «ebitda». Покажу расшифровку, перевод, суть и формулу из курса, а ниже — что есть в Википедии.</p>';web.innerHTML='';seq++;return}
  var r=local(q);
  box.innerHTML=r.length?'<div class="sh">Из курса</div>'+r.map(function(x){return card(x.e)}).join(''):'<div class="sh">Из курса</div><p class="sm">В курсе такого термина нет. Напиши мне в чат — добавлю.</p>';
  clearTimeout(tmr);tmr=setTimeout(function(){wiki(q)},450);
}
