(function(){
  var SK=[['auto','Как в системе','#F4F1E8','#1F6B57',''],['sepia','Сепия','#EFE3C8','#8A4B14','light'],['ocean','Океан','#E9F0F6','#1A5FA8','light'],['dark','Ночь','#171611','#5FC2A3','dark'],['graphite','Графит','#15171B','#7BA7F5','dark'],['terminal','Терминал','#0A0A08','#FFB000','dark'],['violet','Ультрафиолет','#130F22','#B794FF','dark'],['amber','Янтарь','#17110D','#F0A35C','dark']];
  var d=document.documentElement;
  function st(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
  function cur(){var v=st('hub:skin');if(v)return v;return st('theme')==='dark'?'dark':'auto'}
  function apply(id){
    var x=SK.filter(function(a){return a[0]===id})[0];if(!x){id='auto';x=SK[0]}
    if(id==='auto'){d.removeAttribute('data-skin');d.removeAttribute('data-theme')}
    else if(id==='dark'){d.removeAttribute('data-skin');d.setAttribute('data-theme',id)}
    else{d.setAttribute('data-skin',id);d.setAttribute('data-theme',x[4])}
    try{var bg=getComputedStyle(d).getPropertyValue('--bg').trim();document.querySelectorAll('meta[name=theme-color]').forEach(function(m){if(bg)m.setAttribute('content',bg)})}catch(e){}
  }
  function menu(open){
    var m=document.getElementById('skm');if(m){m.remove();if(open)return}
    if(!open)return;
    var c=cur();m=document.createElement('div');m.id='skm';m.className='skm';m.setAttribute('role','menu');

орректировки EBITDA", "d": "Статьи, которые добавляют к EBITDA, чтобы получить Adjusted EBITDA. Часть нормальна (разовые расходы), часть завышает базу.", "x": "Проверяйте детализацию и лимиты в договоре", "u": "finance.html#learn/glossariy"}, {"t": "Add-on", "f": "Добавочная покупка", "d": "Покупка небольшой компании, чтобы присоединить её к уже купленной платформе.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Adjusted EBITDA", "f": "Скорректированная EBITDA", "d": "EBITDA без разовых и нетипичных статей (реструктуризация, судебные издержки). Компании любят «приукрасить», поэтому корректировки надо проверять.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ADR / GDR", "f": "Депозитарные расписки", "d": "Бумаги, которые торгуются на иностранной бирже и представляют акции российской или другой компании. ADR — на американской, GDR — на других.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "AFFO", "f": "Adjusted FFO", "d": "FFO за вычетом обязательных вложений в содержание объектов. Лучше показывает, сколько REIT может раздать.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Agency problem", "f": "Проблема агента", "d": "Интересы менеджеров (агентов) и акционеров (принципалов) не совпадают: менеджер хочет больше бонусов и меньше риска.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Alpha", "f": "Альфа", "d": "Доходность управляющего сверх той, которую можно было ожидать при его уровне риска. Показывает мастерство.", "x": "<code>α = Доходность портфеля − (Rf + β × (Rm − Rf))<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Altman Z-score", "f": "Z-модель Альтмана", "d": "Формула из пяти коэффициентов, которая предсказывает банкротство. Ниже 1,8 — зона риска.", "x": "<code>Z = 1,2×A + 1,4×B + 3,3×C + 0,6×D + 1,0×E<\/code><br><span class=\"fx\">где: A — NWC/Активы. B — Нераспр. прибыль/Активы. C — EBIT/Активы. D — Капитализация/Обязательства. E — Выручка/Активы.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "AML", "f": "Anti-Money Laundering", "d": "Правила против отмывания денег. В РФ — закон 115-ФЗ (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Amortization", "f": "Амортизация (нематериальных активов)", "d": "То же списание, но для нематериальных вещей: программ, лицензий, патентов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Anchoring", "f": "Якорение", "d": "Привязка к первому увиденному числу: цена покупки, прошлый максимум. Мешает оценивать трезво.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Annuity", "f": "Аннуитет", "d": "Ряд одинаковых платежей через равные промежутки: ипотека, аренда, купоны.", "x": "<code>PV = C × (1 − (1 + r)^−n) / r<\/code><br><span class=\"fx\">где: C — платёж за период. r — ставка. n — число платежей.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Anti-dilution", "f": "Защита от размытия", "d": "Если следующий раунд проходит дешевле предыдущего, инвестор получает дополнительные акции, чтобы сохранить свою долю.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "APA", "f": "Asset Purchase Agreement", "d": "Договор покупки активов, а не акций. Покупатель берёт только выбранное имущество и не наследует все долги.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "APT", "f": "Arbitrage Pricing Theory", "d": "Теория арбитражного ценообразования: доходность определяется несколькими факторами (инфляция, ВВП и т. п.), а не одной бетой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "APV", "f": "Adjusted Present Value", "d": "Сначала считают стоимость компании так, будто долга нет, потом прибавляют сегодняшнюю стоимость (PV) налоговой экономии от процентов по долгу (налогового щита). Проценты по кредиту уменьшают налог, и эту выгоду учитывают отдельной строкой", "x": "<code>APV = NPV<sub>без долга<\/sub> + PV(налоговый щит)<\/code><br><span class=\"fx\">где: NPV без долга — стоимость бизнеса, будто долгов нет. PV налогового щита — приведённая выгода от вычета процентов из налога<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Arbitrage", "f": "Арбитраж", "d": "Покупка и продажа одного и того же актива на разных рынках, чтобы без риска забрать разницу цен. Такие возможности быстро исчезают.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ARPU", "f": "Average Revenue Per User", "d": "Сколько выручки в среднем приносит один пользователь (телеком, интернет). Если оператор за месяц получил 1000 рублей от 10 абонентов, ARPU равен 100 рублей", "x": "<code>ARPU = Выручка / Число пользователей<\/code><br><span class=\"fx\">где: Выручка за период, делённая на среднее число пользователей за тот же период<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "ARR", "f": "Annual Recurring Revenue", "d": "Выручка за год, которая повторяется из года в год, например по подписке (SaaS — программы по подписке). Похоже на абонемент в спортзал: деньги приходят регулярно, а не разово", "x": "<code>ARR = MRR × 12<\/code><br><span class=\"fx\">где: MRR — ежемесячная повторяющаяся выручка по подпискам. Умножаем на 12 месяцев<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Asset turnover", "f": "Оборачиваемость активов", "d": "Сколько рублей выручки приносит каждый рубль активов.", "x": "<code>Asset turnover = Выручка / Средние активы<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Audit opinion", "f": "Аудиторское заключение", "d": "Вывод аудитора: отчётность достоверна (чистое заключение), с оговоркой, отрицательное или отказ.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Backwardation", "f": "Бэквордация", "d": "Фьючерсы на более поздний срок дешевле ближайших. Означает дефицит товара сейчас.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Balance check", "f": "Проверка баланса", "d": "Строка в модели: активы минус обязательства минус капитал. Должна быть ноль во всех годах.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Balance sheet", "f": "Баланс", "d": "Снимок компании на одну дату: что у неё есть (активы) и откуда это взялось (долг и капитал).", "x": "<code>Активы = Обязательства + Капитал<\/code><br><span class=\"fx\">где: Активы — всё, чем владеет компания. Обязательства — всё, что она должна. Капитал — доля владельцев.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Balloon payment", "f": "Баллонный платёж", "d": "Последний платёж по кредиту намного больше предыдущих. До него платят мало.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Bankruptcy", "f": "Банкротство", "d": "Состояние, когда должник не может платить по долгам. Имущество продают, деньги делят по очереди.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Basel III", "f": "Базель III", "d": "Международные правила для банков: сколько капитала и ликвидности держать, чтобы пережить кризис.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Basis", "f": "База для сравнения", "d": "Эффект низкой базы: рост выглядит большим, потому что в прошлом периоде было мало.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Basis point (б.п.)", "f": "", "d": "Базисный пункт = 0,01%. 50 б.п. = 0,5 п.п. (п.п. — процентный пункт). Это очень мелкая единица, чтобы точно говорить о небольших изменениях ставок", "x": "<code>1 б.п. = 0,01% = 0,0001<\/code><br><span class=\"fx\">где: Сотая доля процента. Рост ставки с 10% до 10,5% — это +50 б.п.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Behavioral finance", "f": "Поведенческие финансы", "d": "Направление о том, как люди реально принимают финансовые решения: с ошибками, страхом и жадностью, а не как «рациональные агенты».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Benchmark", "f": "Бенчмарк", "d": "Индекс, с которым сравнивают результат управляющего. Обыграл индекс — молодец.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Beneficial owner", "f": "Бенефициарный владелец", "d": "Человек, который в итоге владеет компанией или контролирует её, даже через цепочку фирм.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Beneish M-score", "f": "Модель Бениша", "d": "Формула из восьми коэффициентов, которая оценивает вероятность манипуляций с отчётностью.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Beta (β)", "f": "", "d": "Показывает, насколько сильно акция реагирует на движения рынка. Бета 1 значит «двигается как рынок», больше 1 — «качается сильнее», меньше 1 — «спокойнее»", "x": "<code>β = Cov(R<sub>акции<\/sub>, R<sub>рынка<\/sub>) / Var(R<sub>рынка<\/sub>)<\/code><br><span class=\"fx\">где: Cov — ковариация доходностей акции и рынка (двигаются вместе или нет). Var — дисперсия доходности рынка. β>1 значит акция колеблется сильнее рынка<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Bitcoin", "f": "Биткоин", "d": "Первая и крупнейшая криптовалюта. Ограниченное предложение: 21 млн монет.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Black-Scholes", "f": "Модель Блэка — Шоулза", "d": "Формула справедливой цены европейского опциона. Использует цену актива, страйк, срок, ставку и волатильность.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Blue chip", "f": "«Голубые фишки»", "d": "Акции крупнейших стабильных компаний с долгой историей. В России: Сбербанк, Газпром, Лукойл.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "BNPL", "f": "Buy Now Pay Later", "d": "Оплата частями без процентов: сервис платит магазину сразу, покупатель платит сервису по частям.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Board of directors", "f": "Совет директоров", "d": "Орган, который назначает менеджмент, одобряет стратегию и крупные сделки от имени акционеров.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Bond", "f": "Облигация", "d": "Долговая бумага: ты одалживаешь деньги эмитенту, он платит проценты (купоны) и в конце возвращает номинал.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Book building", "f": "Сбор заявок", "d": "Сбор заявок инвесторов по цене и количеству, по которому определяют цену и распределение акций при размещении.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Book value", "f": "Балансовая стоимость", "d": "Сколько стоит актив или вся компания по записям в балансе.", "x": "<code>Book value of equity = Активы − Обязательства<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Bookrunner", "f": "", "d": "Банк, который собирает заявки инвесторов при размещении акций или облигаций. Он ведёт «книгу заявок»: список, кто сколько готов купить и по какой цене", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Break fee", "f": "Termination fee", "d": "Неустойка, которую платит цель, если выходит из сделки ради другого предложения. Неустойка — это штраф за срыв договорённости. Цель — компания, которую покупают", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Break-even", "f": "Точка безубыточности", "d": "Объём продаж, при котором прибыль равна нулю: маржинальный доход как раз покрыл постоянные расходы.", "x": "<code>Break-even (штук) = Постоянные расходы / (Цена − Переменные расходы на штуку)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Brent", "f": "Brent", "d": "Эталонный сорт нефти для мировых цен. Его цену берут за основу при оценке других сортов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Bridge", "f": "Мост", "d": "Разложение изменения показателя на причины: «EBITDA выросла на 10: +15 цена, −3 объём, −2 расходы».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Broker", "f": "Брокер", "d": "Посредник, через которого частный инвестор торгует на бирже. Берёт комиссию.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Bubble", "f": "Пузырь", "d": "Цены растут далеко выше справедливой стоимости на ожиданиях дальнейшего роста. Потом лопается.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Budget deficit", "f": "Дефицит бюджета", "d": "Расходы государства больше доходов. Покрывается займами или резервами.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Bull / Bear market", "f": "Рынок быков / медведей", "d": "Бычий рынок — растущий, медвежий — падающий (обычно от пика минус 20% и больше).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Bullet repayment", "f": "Погашение разом", "d": "Весь основной долг возвращают одним платежом в конце срока, до этого платят только проценты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Burn rate", "f": "Скорость сжигания денег", "d": "Сколько денег в месяц компания тратит сверх того, что зарабатывает. Характерно для стартапов.", "x": "<code>Burn = Расходы − Выручка (в месяц)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Business judgment rule", "f": "Правило делового решения", "d": "Суд не наказывает директора за неудачное, но добросовестное и обоснованное решение.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CAC", "f": "Customer Acquisition Cost", "d": "Сколько стоит привлечь одного клиента: вся реклама и продажи, делённые на новых клиентов.", "x": "<code>CAC = Расходы на маркетинг и продажи / Число новых клиентов<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "CAGR", "f": "Compound Annual Growth Rate", "d": "Средний рост за год с учётом «процента на процент»: (Конец/Начало)^(1/n) − 1. Здесь n — число лет. Это та единая годовая скорость роста, которая из начальной суммы даёт конечную", "x": "<code>CAGR = (V<sub>кон<\/sub> / V<sub>нач<\/sub>)<sup>1/n<\/sup> − 1<\/code><br><span class=\"fx\">где: V<sub>кон<\/sub> — конечное значение, V<sub>нач<\/sub> — начальное, n — число лет. Показывает среднегодовой темп роста с учётом сложного процента<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Call option", "f": "Опцион колл", "d": "Право, но не обязанность купить актив по цене страйк в будущем. Выигрыш при росте цены.", "x": "<code>Выплата = max(S − K; 0)<\/code><br><span class=\"fx\">где: S — цена актива. K — страйк.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Callable bond", "f": "Облигация с правом досрочного погашения", "d": "Эмитент может выкупить её раньше срока по заранее оговорённой цене. Он делает это, когда ставки упали.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Candlestick", "f": "Японская свеча", "d": "Способ рисовать цену: тело показывает открытие и закрытие, тени — максимум и минимум.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cannibalization", "f": "Каннибализация", "d": "Новый продукт отбирает продажи у старого продукта той же компании. Это минус в приростных потоках.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cap rate", "f": "Ставка капитализации", "d": "Доходность недвижимости: годовой чистый доход, делённый на цену объекта. Чем ниже cap rate, тем дороже объект.", "x": "<code>Cap rate = NOI / Цена<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Cap table", "f": "Таблица капитализации", "d": "Список всех владельцев компании: кому какая доля принадлежит, включая опционы.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CAPEX", "f": "Capital Expenditures", "d": "Капитальные затраты: траты на покупку и обновление оборудования и других основных средств (ОС). Основные средства — это то, что служит много лет: станки, здания, машины. Например, пекарня покупает новую печь", "x": "<code>CAPEX = ΔОС + Амортизация<\/code><br><span class=\"fx\">где: ΔОС — изменение основных средств за период (конец минус начало). Амортизация добавляется, потому что она уменьшила стоимость ОС без покупок<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Capital call", "f": "Вызов капитала", "d": "Фонд не берёт все обещанные деньги сразу: он просит их у LP по мере необходимости, когда находит сделку.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Capital market line", "f": "Линия рынка капитала", "d": "Прямая из безрисковой ставки в рыночный портфель. Показывает доходность портфелей, смешанных из безрисковых вложений и рынка.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Capital rationing", "f": "", "d": "Ограниченный бюджет на инвестиции: проекты выстраивают по PI и берут лучшие, пока деньги не кончатся. Как поход в магазин с ограниченной суммой: сначала берёшь самое выгодное", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Capital structure", "f": "Структура капитала", "d": "Из чего компания финансируется: сколько долга и сколько собственных денег.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Capitalization vs expensing", "f": "Капитализация или расход", "d": "Потраченное можно списать в расходы сразу или признать активом и списывать годами. Второе повышает текущую прибыль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CAPM", "f": "Capital Asset Pricing Model", "d": "Модель, которая считает, какую доходность ждут от акции: Ke = Rf + β × ERP. Ke — требуемая доходность, Rf — безрисковая ставка, β — чувствительность акции к рынку, ERP — премия за риск акций. То есть «надёжная ставка плюс плата за риск»", "x": "<code>Ke = Rf + β × (Rm − Rf)<\/code><br><span class=\"fx\">где: Ke — стоимость собственного капитала. Rf — безрисковая ставка. β — чувствительность акции к рынку. Rm − Rf — премия за риск рынка (ERP)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Carbon credit", "f": "Углеродная единица", "d": "Право выбросить тонну CO2 или подтверждение, что тонну сократили. Торгуется.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Carried interest", "f": "Carry", "d": "Доля прибыли фонда, которую получает управляющий (GP), обычно 20%, если превышен hurdle rate.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Carry trade", "f": "Керри-трейд", "d": "Занять в валюте с низкой ставкой, вложить в валюту с высокой и заработать разницу. Рискует резким изменением курса.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Carve-out", "f": "Выделение", "d": "Компания продаёт часть бизнеса или выводит его на IPO отдельно, оставляя себе контроль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cash basis", "f": "Кассовый метод", "d": "Доходы и расходы записывают только когда деньги реально пришли или ушли. Проще, но картина по прибыли искажается. По МСФО и РСБУ для крупных компаний используют начисление.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cash conversion cycle", "f": "Цикл конверсии денег", "d": "Сколько дней деньги «заморожены» в операциях: от оплаты поставщику до получения денег от клиента.", "x": "<code>CCC = DIO + DSO − DPO<\/code><br><span class=\"fx\">где: DIO — дни запасов. DSO — дни дебиторки. DPO — дни кредиторки.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Cash flow statement", "f": "Отчёт о движении денег (ОДДС)", "d": "Показывает, откуда пришли и куда ушли реальные деньги за период, в трёх блоках: операционном, инвестиционном и финансовом.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cash ratio", "f": "Коэффициент абсолютной ликвидности", "d": "Самая жёсткая проверка: только деньги и их эквиваленты против краткосрочных долгов.", "x": "<code>Cash ratio = Деньги / Краткосрочные обязательства<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Cash sweep", "f": "Погашение долга из избытка денег", "d": "Условие: весь свободный остаток денег идёт на досрочное погашение долга.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cash-free debt-free", "f": "Без денег и без долга", "d": "Цена названа за бизнес как будто без денег и без долга. На закрытии к ней прибавляют деньги и вычитают долг.", "x": "<code>Цена за акции = EV + Деньги − Долг ± Корректировка NWC<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "CBDC", "f": "Central Bank Digital Currency", "d": "Цифровая валюта центрального банка. В РФ — цифровой рубль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CDS", "f": "Credit Default Swap", "d": "Страховка от дефолта: покупатель регулярно платит, а если заёмщик не вернёт долг, продавец покрывает убыток. Цена CDS показывает, как рынок оценивает риск.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CET1", "f": "Common Equity Tier 1", "d": "Самый надёжный капитал банка: акции и нераспределённая прибыль (Базель III). Это собственные деньги банка, которыми он в первую очередь покрывает убытки", "x": "<code>CET1 = Основной капитал / RWA<\/code><br><span class=\"fx\">где: Основной капитал — акции и нераспределённая прибыль. RWA — активы, взвешенные на риск<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "CEX / DEX", "f": "", "d": "CEX — централизованная криптобиржа, хранит твои деньги (Binance). DEX — децентрализованная, сделки идут прямо из кошелька.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CFADS", "f": "Cash Flow Available for Debt Service", "d": "Деньги проекта, доступные для платежей по долгу. На них делят платежи, чтобы получить DSCR.", "x": "<code>DSCR = CFADS / (Проценты + Основной долг)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "CFF", "f": "Cash Flow from Financing", "d": "Финансовый поток: движение денег по долгу, дивидендам, байбэкам (выкупу своих акций) и выпуску новых акций. Это деньги, которые пришли от кредиторов и акционеров или ушли к ним", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CFI", "f": "Cash Flow from Investing", "d": "Инвестиционный поток: деньги на CAPEX, а также от покупки и продажи активов и компаний. Обычно он отрицательный: компания тратит деньги на развитие", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CFO", "f": "Cash Flow from Operations", "d": "Операционный денежный поток: деньги, которые компания получила от основной работы. Например, деньги магазина от продажи товаров за вычетом оплаты поставщикам и зарплат", "x": "<code>CFO = Чистая прибыль + D&A ± ΔNWC<\/code><br><span class=\"fx\">где: D&A — амортизация (не денежные расходы, возвращаем). ΔNWC — изменение чистого оборотного капитала (рост NWC уменьшает денежный поток)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Change of control", "f": "Смена контроля", "d": "Условие в договорах: при смене владельца компании контрагент или банк вправе расторгнуть договор или потребовать долг досрочно.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Channel stuffing", "f": "Затоваривание каналов", "d": "Компания впихивает дистрибьюторам больше товара, чем они продадут, чтобы показать выручку сейчас.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Churn", "f": "Отток клиентов", "d": "Доля клиентов, которые ушли за период.", "x": "<code>Churn = Ушедшие клиенты / Клиенты в начале периода<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "CIM", "f": "Confidential Information Memorandum", "d": "Подробное закрытое описание продаваемой компании для покупателей. Как подробное объявление о продаже квартиры с планом, документами и историей, которое показывают только серьёзным покупателям", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CIR", "f": "Cost-to-Income Ratio", "d": "Какую долю доходов банка съедают его расходы: расходы / доходы. Если на каждые 100 рублей дохода уходит 40 рублей расходов, CIR равен 40%", "x": "<code>CIR = Операционные расходы / Операционные доходы<\/code><br><span class=\"fx\">где: Расходы банка (персонал, офисы, IT) делим на его доходы. Чем ниже, тем эффективнее банк<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Circularity", "f": "Циклическая ссылка", "d": "В модели проценты зависят от долга, а долг от денежного потока, который зависит от процентов. Excel зацикливается, поэтому включают итерации или упрощают.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Claim", "f": "Страховой случай / выплата", "d": "Требование клиента выплатить деньги по договору страхования.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Clawback", "f": "Возврат бонусов", "d": "Право компании забрать выплаченный бонус, если позже выяснилось, что результаты были завышены.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Clean / Dirty price", "f": "Чистая / грязная цена", "d": "Чистая цена — без накопленного купонного дохода. Грязная — вместе с ним, то есть реально платишь.", "x": "<code>Dirty = Clean + НКД<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Clearing", "f": "Клиринг", "d": "Сверка и расчёт взаимных обязательств по сделкам, чтобы обе стороны выполнили условия. На Мосбирже этим занимается НКЦ.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CLO", "f": "Collateralized Loan Obligation", "d": "Бумаги, обеспеченные пулом корпоративных кредитов и разделённые на транши с разным риском.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Closing", "f": "Закрытие сделки", "d": "Момент, когда переходят акции и платят деньги. Подписание (signing) может быть задолго до закрытия.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Club deal", "f": "", "d": "Кредит нескольких банков без широкой синдикации (то есть без привлечения множества участников). Узкий круг банков договаривается между собой, как в закрытом клубе", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Collateral", "f": "Залог", "d": "Имущество, которое банк заберёт, если заёмщик не вернёт кредит.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Combined ratio", "f": "", "d": "(Убытки + расходы) / премии у страховщика. Если меньше 100%, страхование само по себе прибыльно. Премии — взносы клиентов. Собрали 100, выплатили и потратили 90: показатель 90%", "x": "<code>Combined = Убыточность + Расходность<\/code><br><span class=\"fx\">где: Убыточность — выплаты / премии. Расходность — расходы на ведение дела / премии. Ниже 100% — страховщик в прибыли<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Common stock", "f": "Обыкновенные акции", "d": "Главный вид акций: даёт право голоса и долю в прибыли, но при ликвидации платят после кредиторов и держателей привилегированных.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Completion accounts", "f": "Отчётность на закрытие", "d": "Механизм цены: после закрытия считают реальный долг и оборотный капитал и корректируют цену. Противоположность locked box.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Compliance", "f": "Комплаенс", "d": "Система внутри компании, которая следит за соблюдением законов и правил.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Compounding", "f": "Сложный процент", "d": "Проценты начисляют не только на вложенную сумму, но и на уже набежавшие проценты. Чем дольше срок, тем сильнее эффект.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Comps", "f": "Comparable companies", "d": "Таблица похожих компаний и их мультипликаторов. Мультипликатор — это «во сколько раз цена больше показателя» (прибыли, выручки). Так оценивают компанию по аналогии, как квартиру по цене соседних", "x": "<code>Цена = Метрика цели × Медианный мультипликатор аналогов<\/code><br><span class=\"fx\">где: Метрика — например, EBITDA. Мультипликатор берётся у похожих публичных компаний<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Conditions precedent (CP)", "f": "Отлагательные условия", "d": "Что должно случиться до закрытия: одобрение ФАС, согласие банка, выход партнёров.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Confirmation bias", "f": "Предвзятость подтверждения", "d": "Искать только факты, подтверждающие своё мнение, и не замечать остальные.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Consensus", "f": "Консенсус", "d": "Средний прогноз аналитиков по показателю. Если отчёт лучше консенсуса, акция обычно растёт.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Consolidation", "f": "Консолидация", "d": "Сложение отчётов материнской компании и дочерних в один, как будто это одна компания. Взаимные сделки внутри группы вычёркивают.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Contango", "f": "Контанго", "d": "Фьючерсы на более поздний срок дороже ближайших. Нормальная ситуация, когда хранение стоит денег.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Contingent liability", "f": "Условное обязательство", "d": "Возможный долг, который появится, только если случится событие (например, проиграют суд). Его описывают в примечаниях, а в баланс не ставят, если вероятность невысокая.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Contribution margin", "f": "Маржинальный доход", "d": "Что остаётся от выручки после переменных расходов. Идёт на покрытие постоянных расходов и на прибыль.", "x": "<code>Маржинальный доход = Выручка − Переменные расходы<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Convertible bond", "f": "Конвертируемая облигация", "d": "Облигация, которую можно обменять на акции эмитента по заранее оговорённой цене. Поэтому купон у неё ниже обычного.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Convexity", "f": "Выпуклость", "d": "Поправка к дюрации: показывает, что цена облигации реагирует на падение ставки сильнее, чем на такой же рост.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cookie jar reserves", "f": "«Резервы в банке с печеньем»", "d": "Завышение резервов в хорошие годы, чтобы распустить их в плохие и сгладить прибыль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CoR", "f": "Cost of Risk", "d": "Цена кредитного риска: сколько денег банк отложил на возможные потери по кредитам (резервы / кредиты). Это «страховой запас» на случай, что часть клиентов не вернёт долг", "x": "<code>CoR = Резервы под потери за год / Средний кредитный портфель<\/code><br><span class=\"fx\">где: Резервы — сумма, отложенная на плохие кредиты. Показывает, какая доля портфеля «сгорает» за год<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Core inflation", "f": "Базовая инфляция", "d": "Инфляция без самых скачущих цен (еда, энергия). Показывает устойчивый тренд.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Cornerstone investor", "f": "Якорный инвестор", "d": "Крупный инвестор, который заранее обещает купить большую долю в IPO. Его участие успокаивает остальных.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Corporate governance", "f": "Корпоративное управление", "d": "Система правил, по которым компания управляется и контролируется: совет, аудит, права акционеров, раскрытие.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Correlation", "f": "Корреляция", "d": "Нормированная ковариация от −1 до +1. +1 — активы двигаются синхронно, 0 — независимо, −1 — зеркально. Чем меньше корреляция, тем сильнее диверсификация.", "x": "<code>ρ = Cov(A,B) / (σA × σB)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Cost of preferred", "f": "Стоимость привилегированных акций", "d": "Цена денег от привилегированных акций: дивиденд, делённый на цену акции.", "x": "<code>Kp = Дивиденд / Цена<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Cost of risk (CoR)", "f": "Стоимость риска", "d": "Резервы банка за год к кредитному портфелю. Показывает, сколько процентов портфеля «сгорает».", "x": "<code>CoR = Резервы за год / Средний кредитный портфель<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Covariance", "f": "Ковариация", "d": "Показывает, движутся ли два актива в одну сторону. Положительная — вместе, отрицательная — в разные стороны.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Covenant", "f": "", "d": "Условие кредитного договора, которое заёмщик обязан соблюдать (например, ND/EBITDA ≤ 3×). ND/EBITDA — это чистый долг, делённый на EBITDA. То есть «долг не должен быть больше годовой прибыли в 3 раза». При нарушении банк может потребовать вернуть деньги", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Covenant-lite", "f": "Кредит без финансовых тестов", "d": "Кредит без регулярных (maintenance) ковенантов, остаются только условия при действии (incurrence).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Coverage", "f": "Покрытие", "d": "Компании, по которым аналитик регулярно пишет отчёты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Coverage ratio (банк)", "f": "Покрытие резервами", "d": "Насколько резервы покрывают проблемные кредиты.", "x": "<code>Coverage = Резервы / NPL<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Covered interest parity", "f": "Покрытый паритет ставок", "d": "Форвардный курс не даёт заработать без риска: разница ставок уже в нём заложена.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CPI", "f": "Индекс потребительских цен", "d": "Показывает, как изменилась цена корзины товаров, которую покупают семьи. Через него считают инфляцию.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Crack spread", "f": "Крэк-спред", "d": "Разница между ценой нефтепродуктов и нефти. Показывает маржу нефтепереработки.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Credit rating", "f": "Кредитный рейтинг", "d": "Оценка способности заёмщика вернуть долг. Агентства: S&P, Moody's, Fitch, в России — АКРА и «Эксперт РА».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Credit spread", "f": "", "d": "Кредитный спред: доходность облигации компании минус доходность госбумаги того же срока. Это плата за то, что компания надёжна хуже государства. Чем больше разница, тем рискованнее компания", "x": "<code>Spread = Доходность облигации − Доходность госбумаги<\/code><br><span class=\"fx\">где: Доплата за кредитный риск. Измеряется в б.п.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Crossover rate", "f": "Ставка пересечения", "d": "Ставка, при которой NPV двух проектов равны. Выше неё лучше один, ниже — другой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "CRP", "f": "Country Risk Premium", "d": "Надбавка к доходности за то, что вложения в конкретной стране рискованнее. Инвестор требует больше за вложения туда, где больше политических и экономических неожиданностей", "x": "<code>Ke = Rf + β × ERP + CRP<\/code><br><span class=\"fx\">где: CRP — добавка к ставке за риск страны. Остальное как в CAPM<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Currency peg", "f": "Привязка курса", "d": "Центробанк удерживает курс валюты на фиксированном уровне к другой валюте, например к доллару.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Currency risk", "f": "Валютный риск", "d": "Риск потерять из-за изменения курса: выручка в рублях, долг в долларах.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Current account", "f": "Счёт текущих операций", "d": "Разница между тем, сколько страна получила от остального мира за экспорт и доходы, и сколько заплатила. Положительный — экспортёр.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Current ratio", "f": "Коэффициент текущей ликвидности", "d": "Хватит ли оборотных активов, чтобы закрыть краткосрочные долги. Выше 1 — запас есть.", "x": "<code>Current ratio = Оборотные активы / Краткосрочные обязательства<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Current yield", "f": "Текущая доходность", "d": "Купоны за год, делённые на цену облигации. Не учитывает разницу цены и номинала.", "x": "<code>Current yield = Годовой купон / Цена<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Custodian", "f": "Депозитарий / кастодиан", "d": "Организация, которая хранит бумаги клиентов и фиксирует права на них. В России — НРД.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "D&A", "f": "Depreciation & Amortization", "d": "Амортизация: постепенное списание стоимости основных средств (ОС) и нематериальных активов (НМА) в расходы. Купили станок за 100 на 10 лет: каждый год в расходы идёт по 10, хотя деньги заплатили один раз. НМА — то, что нельзя потрогать: лицензии, программы, бренд", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Data room", "f": "Комната данных", "d": "Защищённое хранилище документов компании, куда пускают покупателей для проверки. Сейчас почти всегда виртуальная (VDR).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Data table", "f": "Таблица данных (Excel)", "d": "Инструмент Excel «Анализ что-если», который считает результат при переборе двух вводных. Так строят таблицы чувствительности.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DCF", "f": "Discounted Cash Flow", "d": "Оценка компании по будущим денежным потокам, пересчитанным в сегодняшние деньги (дисконтированным). Идея: рубль сегодня ценнее рубля через год, поэтому будущие деньги «уценивают»", "x": "<code>EV = Σ FCF<sub>t<\/sub> / (1+WACC)<sup>t<\/sup> + TV / (1+WACC)<sup>n<\/sup><\/code><br><span class=\"fx\">где: FCF<sub>t<\/sub> — свободный денежный поток года t. WACC — ставка дисконтирования. TV — терминальная стоимость после прогноза. n — последний год прогноза<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "DCM", "f": "Debt Capital Markets", "d": "Рынок, на котором компании занимают деньги, выпуская облигации. Облигация — это долговая расписка: компания берёт деньги у многих людей и обещает вернуть с процентами", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DDM", "f": "Dividend Discount Model", "d": "Оценка акции по будущим дивидендам, пересчитанным в сегодняшние деньги. Дивиденд — это часть прибыли, которую компания платит владельцам акций", "x": "<code>P = DPS<sub>1<\/sub> / (Ke − g)<\/code><br><span class=\"fx\">где: DPS<sub>1<\/sub> — дивиденд на акцию в следующем году. Ke — требуемая доходность. g — вечный темп роста дивидендов (модель Гордона)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Deadlock", "f": "Тупик", "d": "Ситуация, когда партнёры 50/50 не могут договориться. В корпоративном договоре заранее пишут выход: «русская рулетка», «техасская перестрелка», медиация.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Debt / Equity", "f": "Долг к капиталу", "d": "Сколько долга приходится на рубль собственных денег. Мера финансового рычага.", "x": "<code>D/E = Долг / Капитал<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Debt capacity", "f": "Долговая ёмкость", "d": "Максимум долга, который компания может нести без угрозы платежеспособности.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Debt schedule", "f": "График долга", "d": "Таблица в модели: сколько долга на начало года, сколько взяли и погасили, сколько осталось и какие проценты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Debt service", "f": "Обслуживание долга", "d": "Проценты плюс погашение основного долга за период.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Deferred revenue", "f": "Доходы будущих периодов", "d": "Деньги, которые клиент уже заплатил, а услугу или товар компания ещё не отдала. Это обязательство: пока не отдала, выручкой это не считается.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DeFi", "f": "Decentralized Finance", "d": "Финансовые сервисы на блокчейне без банков: кредиты, обмен, ставки, всё через смарт-контракты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Deflation", "f": "Дефляция", "d": "Цены в экономике падают. Выглядит приятно, но люди откладывают покупки и экономика замедляется.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Delta", "f": "Дельта", "d": "Насколько изменится цена опциона, если цена актива сдвинется на 1. У колла от 0 до 1.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Depreciation", "f": "Амортизация (основных средств)", "d": "Постепенное списание стоимости оборудования, зданий и т. п. на расходы за все годы их службы. Деньги не уходят, но прибыль уменьшается.", "x": "<code>Амортизация в год = (Стоимость − Остаточная стоимость) / Срок службы<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Devaluation", "f": "Девальвация", "d": "Намеренное или вынужденное снижение курса национальной валюты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Diluted EPS", "f": "Разводнённая прибыль на акцию", "d": "EPS с учётом всех бумаг, которые можно превратить в акции: опционов, конвертируемых облигаций.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Dilution", "f": "Размытие доли", "d": "Когда выпускают новые акции, доля каждого старого акционера уменьшается.", "x": "<code>Новая доля = Старая доля × Старое число акций / Новое число акций<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Direct listing", "f": "Прямой листинг", "d": "Выход на биржу без привлечения новых денег: акции просто начинают торговаться.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Disclosure", "f": "Раскрытие информации", "d": "Обязанность публичной компании публиковать отчётность и существенные факты. В РФ правила ЦБ и закон о рынке ценных бумаг (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Discount factor", "f": "Коэффициент дисконтирования", "d": "Число меньше единицы, на которое умножают будущую сумму, чтобы получить сегодняшнюю.", "x": "<code>DF = 1 / (1 + r)^n<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Discounted payback", "f": "Дисконтированный срок окупаемости", "d": "За сколько лет дисконтированные потоки вернут вложения. Честнее обычного payback.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Disposition effect", "f": "Эффект диспозиции", "d": "Продавать растущие бумаги слишком рано и держать падающие слишком долго.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Distressed debt", "f": "Проблемный долг", "d": "Долг компании в тяжёлом положении, торгуется с большим дисконтом. Фонды скупают его, надеясь на выкуп или реструктуризацию.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Diversification", "f": "Диверсификация", "d": "Не класть все яйца в одну корзину. Разные активы падают не одновременно, поэтому риск портфеля меньше риска отдельных бумаг.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Divestiture", "f": "Продажа бизнеса", "d": "Компания продаёт неосновной бизнес целиком. Деньги идут на долг, дивиденды или основной бизнес.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Dividend policy", "f": "Дивидендная политика", "d": "Правила, по которым компания решает, сколько прибыли выплатить акционерам, а сколько оставить.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Dividend recap", "f": "Рекапитализация ради дивиденда", "d": "Компания берёт новый долг и выплачивает деньги акционерам. Фонд так возвращает часть вложений до продажи.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DLOM", "f": "Discount for Lack of Marketability", "d": "Скидка за низкую ликвидность: долю в частной компании трудно быстро продать по справедливой цене.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Down round", "f": "Раунд по сниженной оценке", "d": "Компания привлекает деньги дешевле, чем в прошлый раз. Плохой знак для старых инвесторов и для сотрудников с опционами.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DPI / TVPI / RVPI", "f": "", "d": "Метрики фонда. DPI — сколько денег уже вернули инвесторам, RVPI — сколько ещё стоят оставшиеся вложения, TVPI — их сумма.", "x": "<code>TVPI = DPI + RVPI<\/code><br><span class=\"fx\">где: Каждая метрика — на рубль вложенных денег.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "DPS", "f": "Dividend Per Share", "d": "Сколько дивидендов приходится на одну акцию. Если компания выплатила 1000 и акций 100, то DPS равен 10", "x": "<code>DPS = Дивиденды / Число акций<\/code><br><span class=\"fx\">где: Все выплаченные дивиденды делим на число акций в обращении<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Drag-along", "f": "Право принудительной продажи", "d": "Если крупные акционеры продают компанию, они могут заставить продать и миноритариев на тех же условиях.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Driver", "f": "Драйвер", "d": "Вводная, от которой считается строка модели: рост выручки, маржа, дни дебиторки.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Dry powder", "f": "«Сухой порох»", "d": "Деньги, которые фонд уже собрал, но ещё не вложил.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DSCR", "f": "Debt Service Coverage Ratio", "d": "Денежный поток для обслуживания долга / (проценты + плановое погашение). Показывает, во сколько раз заработок больше платежей по долгу. Если DSCR меньше 1, денег на платёж не хватает", "x": "<code>DSCR = CFADS / (Проценты + Погашение основного долга)<\/code><br><span class=\"fx\">где: CFADS — денежный поток для обслуживания долга. Ниже 1 — денег на платежи не хватает<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "DSO / DIO / DPO", "f": "Days Sales / Inventory / Payables Outstanding", "d": "За сколько дней в среднем оборачиваются: дебиторка (долги клиентов), запасы, кредиторка (долги перед поставщиками). Например, DSO 30 дней значит, что клиенты платят в среднем через месяц после продажи", "x": "<code>DSO = Дебиторка / Выручка × 365; DIO = Запасы / COGS × 365; DPO = Кредиторка / COGS × 365<\/code><br><span class=\"fx\">где: Дебиторка — долги покупателей. Запасы — товары на складе. Кредиторка — долги поставщикам. COGS — себестоимость. Результат в днях. Цикл денег: DSO + DIO − DPO<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "DSRA", "f": "Debt Service Reserve Account", "d": "Резервный счёт проекта: на нём лежат деньги на несколько платежей по долгу.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DTA / DTL", "f": "Отложенные налоговые активы / обязательства", "d": "Разница между налогом по учёту и налогом по закону. DTL — налог, который заплатят позже; DTA — налог, который заплатили вперёд и потом вернут через уменьшение налога.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Dual-class shares", "f": "Акции двух классов", "d": "Акции основателей дают больше голосов, чем обычные. Основатели сохраняют контроль с небольшой долей.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Due diligence (DD)", "f": "", "d": "Тщательная проверка компании перед сделкой: покупатель смотрит документы, финансы и риски. Как осмотр квартиры и проверка документов перед покупкой", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DuPont", "f": "Разложение ROE по Дюпону", "d": "ROE делят на три части: маржа, оборачиваемость активов, рычаг. Видно, за счёт чего прибыльность: хорошая маржа, быстрые продажи или долг.", "x": "<code>ROE = (Прибыль/Выручка) × (Выручка/Активы) × (Активы/Капитал)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Dutch disease", "f": "«Голландская болезнь»", "d": "Рост добычи сырья укрепляет валюту и делает остальные отрасли неконкурентными.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "DV01", "f": "", "d": "Сколько рублей меняется цена позиции при смещении доходности на 1 б.п.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "EAD", "f": "Exposure at Default", "d": "Сумма, которую банк потеряет под риском в момент дефолта заёмщика.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "EAR / APR", "f": "Эффективная и номинальная годовая ставка", "d": "APR — ставка «по бумагам», без учёта частоты начисления. EAR — реальная годовая с учётом сложного процента.", "x": "<code>EAR = (1 + APR/m)^m − 1<\/code><br><span class=\"fx\">где: m — число начислений в год.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Earn-out", "f": "", "d": "Часть цены сделки, которую платят позже, если компания достигнет оговорённых результатов. Продавец получает доплату, только если бизнес оправдает его обещания", "x": "<code>Цена = Фиксированная часть + Отложенная часть, если цель достигнута<\/code><br><span class=\"fx\">где: Отложенная часть зависит от результатов бизнеса после сделки<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Earnings surprise", "f": "Сюрприз по прибыли", "d": "Разница между фактической прибылью и консенсусом.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "EBIT", "f": "Earnings Before Interest & Taxes", "d": "Операционная прибыль: заработок до вычета процентов и налогов. Показывает, сколько приносит сам бизнес, без влияния кредитов и налогов", "x": "<code>EBIT = Выручка − COGS − Операционные расходы<\/code><br><span class=\"fx\">где: COGS — себестоимость проданного. Операционные расходы — SG&A, R&D и т. п. Прибыль до процентов и налогов<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "EBITDA", "f": "Earnings Before Interest, Taxes, D&A", "d": "Прибыль до вычета процентов, налогов и амортизации; грубо показывает, сколько компания зарабатывает на своей основной работе. Это EBIT, к которому прибавили амортизацию", "x": "<code>EBITDA = EBIT + D&A<\/code><br><span class=\"fx\">где: EBIT — операционная прибыль. D&A — амортизация и износ. Маржа EBITDA = EBITDA / Выручка<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "EBITDA margin", "f": "Маржа EBITDA", "d": "Какая доля выручки превращается в EBITDA. Удобно сравнивать компании одной отрасли.", "x": "<code>EBITDA margin = EBITDA / Выручка<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "EBITDAR", "f": "", "d": "EBITDA до арендных расходов. Нужна для сравнения компаний, где часть бизнеса арендована, а часть куплена (ритейл, авиа, рестораны).", "x": "<code>EBITDAR = EBITDA + Аренда<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "ECL", "f": "Expected Credit Loss", "d": "Ожидаемые кредитные потери, которые банк резервирует по МСФО 9 заранее.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ECM", "f": "Equity Capital Markets", "d": "Рынок, на котором компании привлекают деньги, продавая свои акции (IPO, SPO). Акция — доля в компании, и тот, кто её купил, становится совладельцем", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Efficient frontier", "f": "Эффективная граница", "d": "Линия на графике «риск — доходность»: лучшие портфели, где нельзя поднять доходность без роста риска.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Efficient market hypothesis", "f": "Гипотеза эффективного рынка", "d": "Цены уже учитывают всю доступную информацию, поэтому стабильно обыгрывать рынок нельзя. Три формы: слабая, средняя, сильная.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Embedded value", "f": "Встроенная стоимость", "d": "Оценка страховщика жизни: капитал плюс сегодняшняя стоимость прибыли по уже заключённым договорам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Enterprise value (в сделке)", "f": "Стоимость бизнеса", "d": "Цена за весь бизнес до учёта того, как он финансируется.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "EPC", "f": "Engineering, Procurement, Construction", "d": "Договор, по которому подрядчик проектирует, закупает и строит объект под ключ за фиксированную цену.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "EPS", "f": "Earnings Per Share", "d": "Сколько чистой прибыли приходится на одну акцию. Чистая прибыль — то, что осталось после всех расходов и налогов", "x": "<code>EPS = (Чистая прибыль − Дивиденды по привилегированным) / Средневзвешенное число акций<\/code><br><span class=\"fx\">где: Прибыль, которая приходится на одну обыкновенную акцию<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Equity", "f": "Акционерный капитал / акции", "d": "Доля владельцев в компании. Может означать и сам капитал, и ценные бумаги, которые его представляют.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Equity method", "f": "Метод долевого участия", "d": "Как учитывают долю в компании, где у тебя 20–50% и нет контроля: не складывают её отчёт по строкам, а показывают одну строку «доля в прибыли».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Equity multiplier", "f": "Мультипликатор капитала", "d": "Активы к собственному капиталу. Часть разложения Дюпона.", "x": "<code>Equity multiplier = Активы / Капитал<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Equity Value", "f": "", "d": "Стоимость акционерного капитала (для публичной компании — капитализация). Это цена только той части бизнеса, которая принадлежит владельцам, без долга", "x": "<code>Equity Value = EV − Net Debt − NCI − Привилегированные<\/code><br><span class=\"fx\">где: EV — стоимость бизнеса. Вычитаем долги и права других держателей. Остаток принадлежит акционерам<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Equivalent annual annuity", "f": "Эквивалентный годовой аннуитет", "d": "Способ сравнить проекты разной длительности: NPV каждого пересчитывают в одинаковый годовой платёж.", "x": "<code>EAA = NPV × r / (1 − (1 + r)^−n)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "ERP", "f": "Equity Risk Premium", "d": "Дополнительная доходность, которую инвесторы требуют за то, что вкладываются в акции, а не в безрисковые бумаги. Это плата за то, что акции могут и упасть в цене", "x": "<code>ERP = Rm − Rf<\/code><br><span class=\"fx\">где: Rm — ожидаемая доходность рынка акций. Rf — безрисковая ставка. Это доплата за то, что вложились в рынок, а не в госбумаги<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Escrow", "f": "Эскроу", "d": "Часть цены кладут на специальный счёт у третьей стороны и отдают продавцу позже, если не всплыли проблемы.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ESG", "f": "Environmental, Social, Governance", "d": "Оценка компании по экологии, отношению к людям и качеству управления. Влияет на доступ к деньгам крупных фондов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ESOP", "f": "Employee Stock Option Plan", "d": "Программа, по которой сотрудники получают опционы или акции компании. Привязывает команду к росту стоимости.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ETF", "f": "Exchange Traded Fund", "d": "Фонд, чьи паи торгуются на бирже как акции. Обычно повторяет индекс и берёт небольшую комиссию.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Ethereum", "f": "Эфириум", "d": "Блокчейн со смарт-контрактами. Монета ETH платит комиссии за операции.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Eurobond", "f": "Еврооблигация", "d": "Облигация, выпущенная в иностранной валюте за пределами страны, где живёт эмитент.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "EV", "f": "Enterprise Value", "d": "Стоимость всего бизнеса целиком: капитал + чистый долг + … Представь цену квартиры целиком: и твоя часть, и часть, которую ты ещё должен банку по ипотеке", "x": "<code>EV = Капитализация + Долг + NCI + Привилегированные − Деньги<\/code><br><span class=\"fx\">где: Капитализация — цена всех акций. NCI — доля миноритариев в дочках. Деньги вычитаем, ими можно сразу погасить часть долга<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "EV to Equity bridge", "f": "Мост от EV к стоимости акций", "d": "Из стоимости компании вычитают долг и доли меньшинства, прибавляют деньги, получают стоимость акций.", "x": "<code>Equity = EV − Чистый долг − NCI − Привилегированные + Доли в ассоциированных<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "EV/EBIT", "f": "", "d": "Стоимость компании к операционной прибыли. Учитывает амортизацию, поэтому лучше для капиталоёмких отраслей.", "x": "<code>EV/EBIT = EV / EBIT<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "EV/EBITDA", "f": "", "d": "Главный мультипликатор оценки: стоимость компании в целом к её EBITDA. Не зависит от долговой нагрузки, поэтому подходит для сравнения.", "x": "<code>EV/EBITDA = EV / EBITDA<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "EV/Sales", "f": "", "d": "Стоимость компании к выручке. Используют, когда прибыли ещё нет (быстрорастущие компании).", "x": "<code>EV/Sales = EV / Выручка<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "EVA", "f": "Economic Value Added", "d": "Экономическая добавленная стоимость: (ROIC − WACC) × Инвестированный капитал. Показывает, сколько денег компания заработала сверх того, что требуют те, кто в неё вложился", "x": "<code>EVA = NOPAT − WACC × Инвестированный капитал<\/code><br><span class=\"fx\">где: NOPAT — операционная прибыль после налога. Вычитаем плату за капитал. Положительная EVA — компания создаёт стоимость<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Exchange rate", "f": "Валютный курс", "d": "Цена одной валюты в другой. Прямая котировка: сколько рублей за доллар.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Exclusivity", "f": "Эксклюзивность", "d": "Продавец обязуется на срок переговоров не вести переговоры с другими покупателями.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Exit multiple", "f": "Мультипликатор выхода", "d": "Мультипликатор, по которому оценивают компанию в последнем году прогноза, чтобы получить терминальную стоимость. Альтернатива модели Гордона.", "x": "<code>TV = EBITDA(последний год) × Exit multiple<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Expected loss", "f": "Ожидаемые потери", "d": "Сколько банк в среднем теряет по кредитам из-за дефолтов.", "x": "<code>EL = PD × LGD × EAD<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Expense ratio", "f": "Коэффициент расходов", "d": "Расходы страховщика на ведение дела к собранным премиям. Вместе с loss ratio даёт combined ratio.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fair value", "f": "Справедливая стоимость", "d": "Цена, по которой актив можно продать в обычной сделке между участниками рынка на дату оценки.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fairness opinion", "f": "Заключение о справедливости цены", "d": "Письмо банка совету директоров: цена в сделке справедлива с финансовой точки зрения. Защита совета от претензий акционеров.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fama–French", "f": "Модель Фамы — Френча", "d": "Добавляет к CAPM ещё факторы: размер компании и «дешевизну» (value). Лучше объясняет реальную доходность акций.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "FCF", "f": "Free Cash Flow", "d": "Свободный денежный поток: деньги, которые остаются после операционных расходов, налогов и инвестиций. Это деньги, которые можно свободно потратить: выплатить владельцам или вернуть долг", "x": "<code>FCF = CFO − CAPEX<\/code><br><span class=\"fx\">где: CFO — денежный поток от операций. CAPEX — инвестиции в основные средства<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "FCFE", "f": "Free Cash Flow to Equity", "d": "Свободный поток только акционерам (после долга). Дисконтируется по Ke. То есть это деньги, которые могут достаться владельцам, когда кредиторы уже получили своё", "x": "<code>FCFE = FCFF − Проценты × (1−t) + Новый долг − Погашение долга<\/code><br><span class=\"fx\">где: Проценты × (1−t) — проценты после налогового щита. Новый долг и погашение — чистое заимствование. Остаётся акционерам<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "FCFF", "f": "Free Cash Flow to Firm", "d": "Свободный поток всем инвесторам (до долга), то есть и кредиторам, и акционерам: EBIT×(1−t) + D&A − CAPEX − ΔNWC. Здесь t — налоговая ставка, ΔNWC — прирост оборотного капитала. Дисконтируется по WACC", "x": "<code>FCFF = EBIT × (1−t) + D&A − CAPEX − ΔNWC<\/code><br><span class=\"fx\">где: t — ставка налога. D&A — амортизация. CAPEX — инвестиции. ΔNWC — прирост оборотного капитала. Поток, доступный и кредиторам, и акционерам<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "FDV", "f": "Fully Diluted Valuation", "d": "Капитализация криптотокена, если посчитать по максимальному числу токенов, которое можно выпустить. Токен — цифровая единица, которую выпускает проект. FDV показывает «потолок» оценки, когда все токены уже будут выпущены", "x": "<code>FDV = Цена токена × Максимальное число токенов<\/code><br><span class=\"fx\">где: Цена текущая, число токенов — всё, что будет выпущено, включая ещё не выданные<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Fed funds rate", "f": "Ставка ФРС", "d": "Ключевая ставка США: по ней банки одалживают друг другу деньги на ночь.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fee income", "f": "Комиссионный доход", "d": "Доход банка не от процентов: комиссии за переводы, карты, обслуживание.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "FFO", "f": "Funds From Operations", "d": "Денежная прибыль REIT (фонда, который владеет недвижимостью). Сюда не включают бумажное списание стоимости зданий, поэтому цифра ближе к реальным деньгам от аренды", "x": "<code>FFO = Чистая прибыль + D&A − Прибыль от продажи недвижимости<\/code><br><span class=\"fx\">где: Используется для REIT: амортизацию возвращаем, разовую прибыль от продаж убираем<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Fiduciary duty", "f": "Фидуциарная обязанность", "d": "Обязанность директоров действовать добросовестно и в интересах компании, а не в своих. В РФ — ст. 53.1 ГК (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "FIFO", "f": "Первым пришёл — первым ушёл", "d": "Способ учёта запасов: при продаже в себестоимость идёт самая ранняя партия. При росте цен прибыль выше, чем по LIFO.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Finance lease", "f": "Финансовая аренда (лизинг)", "d": "Аренда, по сути равная покупке в рассрочку: актив числится у арендатора, платежи считаются долгом.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Financial DD", "f": "Финансовая проверка", "d": "Проверка качества прибыли, долга, оборотного капитала и прогнозов перед сделкой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Financial leverage", "f": "Финансовый рычаг", "d": "Использование долга. Увеличивает доходность для владельцев при хорошей работе и усиливает потери при плохой.", "x": "<code>Fin. leverage = Активы / Капитал<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Fintech", "f": "Финтех", "d": "Технологические компании в финансах: платежи, кредиты онлайн, инвестиции через приложения.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fiscal policy", "f": "Бюджетная политика", "d": "Налоги и расходы государства. Влияет на экономику через спрос.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fixed charge coverage", "f": "Покрытие фиксированных платежей", "d": "Покрытие не только процентов, но и аренды и других обязательных платежей.", "x": "<code>FCCR = (EBIT + Фикс. платежи) / (Проценты + Фикс. платежи)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Float (страхование)", "f": "Страховой флоут", "d": "Деньги, которые страховщик собрал как премии и держит до выплат. Их можно инвестировать. Так зарабатывает Berkshire.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Football field", "f": "«Футбольное поле»", "d": "График на слайде, где полосами показаны диапазоны оценки по разным методам: DCF, мультипликаторы, сделки. Видно, где методы сходятся.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Forward rate (FX)", "f": "Форвардный курс", "d": "Курс для обмена в будущем, зафиксированный сегодня. Определяется разницей ставок двух валют.", "x": "<code>F = S × (1 + r_руб) / (1 + r_долл)<\/code><br><span class=\"fx\">где: S — курс сегодня.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Free float", "f": "", "d": "Какая доля акций свободно торгуется на бирже. Остальное держат крупные владельцы и не продают", "x": "<code>Free float = Акции в свободном обращении / Все акции<\/code><br><span class=\"fx\">где: Без долей стратегических держателей, государства и менеджмента<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "FRN", "f": "Floating Rate Note", "d": "Облигация с плавающим купоном: он привязан к ставке, например к ключевой или RUONIA, и растёт вместе с ней.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Front running", "f": "Опережающая сделка", "d": "Брокер знает о крупной заявке клиента и сначала покупает для себя. Нарушение.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fulcrum security", "f": "", "d": "Уровень долга, на котором заканчивается стоимость бизнеса. Его держатели получают контроль при реструктуризации. Реструктуризация — это пересмотр долгов, чтобы компания смогла выжить", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Fundamental analysis", "f": "Фундаментальный анализ", "d": "Оценка бумаги через бизнес: отчётность, отрасль, менеджмент, макро.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Future value (FV)", "f": "Будущая стоимость", "d": "Во что превратится сегодняшняя сумма через n периодов под ставку r.", "x": "<code>FV = PV × (1 + r)^n<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "FX swap", "f": "Валютный своп", "d": "Обменять валюту сейчас и обязаться обменять обратно позже по оговорённому курсу. Краткосрочное фондирование в валюте.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "G-spread", "f": "", "d": "Спред доходности облигации к кривой госбумаг (КБД) на том же сроке. Показывает, на сколько облигация доходнее госбумаги с тем же сроком. КБД объяснена ниже", "x": "<code>G-spread = YTM облигации − YTM госбумаги того же срока<\/code><br><span class=\"fx\">где: Спред к кривой гособлигаций<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Gamma", "f": "Гамма", "d": "Как быстро меняется дельта при движении цены актива.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "GDP", "f": "Валовой внутренний продукт", "d": "Стоимость всех товаров и услуг, произведённых в стране за год. Главный показатель размера экономики.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Gearing", "f": "Долговая нагрузка (брит.)", "d": "Британский термин для рычага: доля долга в капитале.", "x": "<code>Gearing = Чистый долг / (Чистый долг + Капитал)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "GMV", "f": "Gross Merchandise Value", "d": "Общая сумма всех продаж через платформу (маркетплейс). Это не выручка платформы: ей достаётся только комиссия.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Goal seek", "f": "Подбор параметра", "d": "Инструмент Excel: подобрать вводную так, чтобы результат стал равен нужному числу. Например, какую цену заплатить, чтобы IRR была 20%.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Going concern", "f": "Непрерывность деятельности", "d": "Допущение, что компания проработает ещё минимум год. Если аудитор сомневается, он пишет об этом в заключении.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Golden parachute", "f": "«Золотой парашют»", "d": "Крупная компенсация топ-менеджерам при увольнении после поглощения. Делает покупку дороже и снижает интерес врага.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Goodwill", "f": "", "d": "Переплата при покупке компании: на сколько цена покупки больше справедливой стоимости её чистых активов. Например, купили за 150 компанию, чьё имущество за вычетом долгов стоит 100: гудвилл равен 50. Это плата за бренд, клиентов, репутацию", "x": "<code>Goodwill = Цена покупки − Справедливая стоимость чистых активов<\/code><br><span class=\"fx\">где: Переплата за бренд, клиентов и команду сверх стоимости активов<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "GP / LP", "f": "General / Limited Partner", "d": "GP — управляющий фондом, принимает решения. LP — инвестор, даёт деньги и не управляет.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Green bond", "f": "Зелёная облигация", "d": "Облигация, деньги от которой идут на экологические проекты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Greenshoe", "f": "", "d": "Право организатора размещения продать дополнительные акции (до 15%), чтобы удерживать цену на стабильном уровне. Это «запасной» объём: если спрос высокий, продают больше, а если цена падает, организатор выкупает акции и поддерживает цену", "x": "<code>Допразмещение ≤ 15% от основного объёма<\/code><br><span class=\"fx\">где: Опцион андеррайтера выкупить дополнительные акции по цене IPO, чтобы стабилизировать курс<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Greenwashing", "f": "Гринвошинг", "d": "Компания выдаёт себя за более «зелёную», чем есть.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Gross margin", "f": "Валовая маржа", "d": "Какая доля выручки остаётся после себестоимости.", "x": "<code>Gross margin = Валовая прибыль / Выручка<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Gross profit", "f": "Валовая прибыль", "d": "Выручка минус себестоимость. Сколько остаётся на всё остальное: зарплаты, аренду, проценты, налоги.", "x": "<code>Валовая прибыль = Выручка − Себестоимость<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Growing perpetuity", "f": "Растущий перпетуитет", "d": "Платёж, который растёт каждый год на g навсегда. Основа модели Гордона и терминальной стоимости.", "x": "<code>PV = C / (r − g)<\/code><br><span class=\"fx\">где: Работает только при r больше g.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Growth capex", "f": "Инвестиции в рост", "d": "Траты на расширение: новые заводы, магазины, мощности. Их можно отложить, не ломая текущий бизнес.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Growth investing", "f": "Инвестирование в рост", "d": "Покупать быстро растущие компании, даже если мультипликаторы высокие, ожидая, что рост окупит цену.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Guidance", "f": "Прогноз компании", "d": "Ориентир по выручке и прибыли, который компания сама даёт рынку на год или квартал.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Haircut", "f": "", "d": "Списание части долга: кредитор получает меньше номинала. Номинал — сумма долга по договору. Например, долг 100, а кредитор согласился на 70", "x": "<code>Залог = Рыночная стоимость × (1 − Haircut)<\/code><br><span class=\"fx\">где: Haircut — скидка к рыночной цене залога. При 20% бумага за 100 принимается как залог на 80<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Halving", "f": "Халвинг", "d": "Раз в 4 года награда майнерам за блок биткоина падает вдвое. Предложение растёт медленнее.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Hard currency", "f": "Твёрдая валюта", "d": "Валюта, которую охотно принимают по всему миру: доллар, евро, франк.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Hardcode", "f": "Жёстко вбитое число", "d": "Число, введённое в ячейку руками, а не формулой. В моделях выделяют синим, чтобы видеть вводные.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Hedging", "f": "Хеджирование", "d": "Сделка, которая страхует от неприятного движения цены: например, продать фьючерс, чтобы защитить стоимость товара на складе.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Herding", "f": "Стадное поведение", "d": "Покупать потому, что все покупают. Так надуваются пузыри.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "HFT", "f": "High-Frequency Trading", "d": "Высокочастотная торговля: алгоритмы совершают тысячи сделок в секунду, зарабатывая на крошечных разницах цен.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "High yield", "f": "Высокодоходные облигации", "d": "Облигации компаний с низким рейтингом и высокой ставкой. Иначе «мусорные».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Historical cost", "f": "Первоначальная стоимость", "d": "Актив записан по цене покупки и не пересматривается вверх вместе с рынком (только амортизируется).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Holdback", "f": "Удержание", "d": "Покупатель удерживает часть цены на срок, чтобы покрыть возможные претензии. Как эскроу, но без третьей стороны.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Hostile takeover", "f": "Недружественное поглощение", "d": "Покупатель обращается напрямую к акционерам, минуя совет директоров целевой компании.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Hurdle rate", "f": "", "d": "Минимальная доходность, которую должен дать проект, чтобы в него стоило вкладываться (часто WACC + премия). «Hurdle» значит «барьер»: проект должен через него перепрыгнуть", "x": "<code>Hurdle = Минимальная требуемая доходность проекта<\/code><br><span class=\"fx\">где: Если IRR проекта ниже, проект не берут. Часто равна WACC плюс запас<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "IC memo", "f": "Investment committee memo", "d": "Документ для инвестиционного комитета фонда: тезис, оценка, риски, доходность.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ICR", "f": "Interest Coverage Ratio", "d": "Покрытие процентов: во сколько раз прибыль больше процентов (EBIT / проценты). Если прибыль 90, а проценты 30, ICR равен 3: денег втрое больше, чем нужно на проценты", "x": "<code>ICR = EBIT / Проценты к уплате<\/code><br><span class=\"fx\">где: Во сколько раз операционная прибыль покрывает проценты. Ниже 1,5–2 — тревожно<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "IFRS / МСФО", "f": "International Financial Reporting Standards", "d": "Международные правила составления финансовой отчётности. Они нужны, чтобы компании из разных стран считали и показывали свои цифры одинаково", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "IFRS 16", "f": "Стандарт об аренде", "d": "По МСФО почти любая аренда показывается в балансе: актив (право пользования) и долг на сумму будущих платежей. Из-за этого у арендаторов выросли EBITDA и долг.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "IFRS 9 stages", "f": "Стадии по МСФО 9", "d": "Кредиты делят на три стадии: 1 — всё хорошо, 2 — риск вырос, 3 — дефолт. Чем выше стадия, тем больше резерв.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Impairment", "f": "Обесценение", "d": "Когда актив оказался стоит меньше, чем записан в балансе, его списывают до реальной цены. Убыток разовый и бумажный, деньги не уходят.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Implied multiple", "f": "Подразумеваемый мультипликатор", "d": "Мультипликатор, который «зашит» в полученной оценке. Помогает проверить DCF: если вышло EV/EBITDA = 30, что-то не так.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Implied volatility", "f": "Подразумеваемая волатильность", "d": "Волатильность, которую «закладывает» рынок в цену опциона. Растёт в страх.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Income statement (P&L)", "f": "Отчёт о прибылях и убытках", "d": "Показывает за период, сколько компания заработала и потратила: от выручки сверху до чистой прибыли внизу.", "x": "<code>Чистая прибыль = Выручка − Расходы − Проценты − Налоги<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Incremental cash flow", "f": "Приростный денежный поток", "d": "Только те деньги, которые появятся или исчезнут из-за проекта. Остальное в оценку проекта не входит.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Indemnity", "f": "Возмещение потерь", "d": "Обязательство продавца покрыть конкретные убытки покупателя, например по налоговой проверке за прошлые годы. В РФ — ст. 406.1 ГК (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Independent director", "f": "Независимый директор", "d": "Член совета, не связанный с компанией и крупными акционерами. Должен защищать интересы всех акционеров.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Index", "f": "Индекс", "d": "Число, показывающее, как ведёт себя группа бумаг. IMOEX — российские акции, S&P 500 — американские.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Inflation-linked bond", "f": "Облигация, привязанная к инфляции", "d": "Номинал или купон растёт вместе с инфляцией. Защита от обесценения денег. В России — ОФЗ-ИН.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Information ratio", "f": "Информационный коэффициент", "d": "Насколько постоянно управляющий обыгрывает бенчмарк, с учётом отклонения от него.", "x": "<code>IR = (Rp − Rb) / Tracking error<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Insider trading", "f": "Инсайдерская торговля", "d": "Сделки с бумагами на основе непубличной информации. Запрещена. В РФ — закон 224-ФЗ (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Intangible assets", "f": "Нематериальные активы", "d": "Активы без вещественной формы: патенты, лицензии, бренды, программы, гудвил.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Interchange", "f": "Интерчейндж", "d": "Часть комиссии за оплату картой, которую банк магазина платит банку покупателя.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Interest coverage", "f": "Покрытие процентов", "d": "Во сколько раз операционная прибыль больше процентов по долгу. Ниже 1,5 — тревожно.", "x": "<code>ICR = EBIT / Проценты<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Interest expense", "f": "Процентные расходы", "d": "Сколько компания заплатила процентов по своим долгам за период.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Interested party transaction", "f": "Сделка с заинтересованностью", "d": "Сделка, в которой у директора или крупного акционера есть личный интерес. Нужно раскрытие и, по требованию, одобрение. В РФ — глава XI закона об АО (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Intrinsic value", "f": "Внутренняя стоимость опциона", "d": "Сколько опцион стоил бы, если бы его исполнили прямо сейчас.", "x": "<code>Call: max(S − K; 0)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Inventory", "f": "Запасы", "d": "Сырьё, незавершёнка и готовая продукция на складе. Пока не продано, лежит в балансе как актив.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Inventory turnover", "f": "Оборачиваемость запасов", "d": "Сколько раз за год запасы «проходят» через продажи.", "x": "<code>Inventory turnover = Себестоимость / Средние запасы<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Investment grade", "f": "Инвестиционный рейтинг", "d": "Рейтинг не ниже BBB− по шкале S&P: считается, что компания скорее вернёт долг. Всё ниже — high yield.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "IPO", "f": "Initial Public Offering", "d": "Первичное публичное размещение: компания впервые продаёт свои акции на бирже. После этого любой человек может купить долю в такой компании", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "IRR", "f": "Internal Rate of Return", "d": "Внутренняя норма доходности: годовая доходность проекта, то есть ставка, при которой NPV = 0. Проще говоря, «под какой годовой процент работают вложенные деньги»", "x": "<code>0 = Σ CF<sub>t<\/sub> / (1+IRR)<sup>t<\/sup><\/code><br><span class=\"fx\">где: CF<sub>t<\/sub> — денежный поток года t (включая начальную инвестицию с минусом).
