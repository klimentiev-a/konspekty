ution", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "Accretion / Dilution", "hs": "Accretion / dilution: модель слияния пошагово"}, {"t": "Accrual accounting", "f": "Метод начисления", "d": "Доходы и расходы записывают, когда они случились, а не когда пришли или ушли деньги. Продал товар в долг — выручка есть сразу, хотя денег ещё нет.", "x": "", "u": "finance.html#learn/glossariy/Accrual%20accounting", "g": "finance.html#learn/glossariy/Accrual%20accounting"}, {"t": "Accrued interest", "f": "Накопленный купонный доход", "d": "См. НКД", "x": "<code>Accrued = Купон × Дней с выплаты / Дней в периоде<\/code><br><span class=\"fx\">где: То же, что НКД<\/span>", "u": "finance.html#learn/glossariy/Accrued%20interest", "g": "finance.html#learn/glossariy/Accrued%20interest"}, {"t": "Acquiring", "f": "Эквайринг", "d": "Услуга банка магазину: принимать оплату картами. Банк берёт комиссию с каждой покупки.", "x": "", "u": "finance.html#learn/glossariy/Acquiring", "g": "finance.html#learn/glossariy/Acquiring"}, {"t": "Add-backs", "f": "Корректировки EBITDA", "d": "Статьи, которые добавляют к EBITDA, чтобы получить Adjusted EBITDA. Часть нормальна (разовые расходы), часть завышает базу.", "x": "Проверяйте детализацию и лимиты в договоре", "u": "finance.html#learn/leveraged-finance", "g": "finance.html#learn/glossariy/Add-backs", "ut": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом", "hq": "Add-backs", "hs": "Adjusted EBITDA и add-backs"}, {"t": "Adjusted EBITDA", "f": "Скорректированная EBITDA (EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)", "d": "EBITDA без разовых и нетипичных статей (реструктуризация, судебные издержки). Компании любят «приукрасить», поэтому корректировки надо проверять.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/Adjusted%20EBITDA", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "Adjusted EBITDA", "hs": "Раскрытия для оценки: чистый долг и adjusted EBITDA"}, {"t": "ADR / GDR", "f": "Депозитарные расписки (ADR — American Depositary Receipt; GDR — Global Depositary Receipt)", "d": "Бумаги, которые торгуются на иностранной бирже и представляют акции российской или другой компании. ADR — на американской, GDR — на других.", "x": "", "u": "finance.html#learn/glossariy/ADR%20%2F%20GDR", "g": "finance.html#learn/glossariy/ADR%20%2F%20GDR"}, {"t": "Agency problem", "f": "Проблема агента", "d": "Интересы менеджеров (агентов) и акционеров (принципалов) не совпадают: менеджер хочет больше бонусов и меньше риска.", "x": "", "u": "finance.html#learn/glossariy/Agency%20problem", "g": "finance.html#learn/glossariy/Agency%20problem"}, {"t": "Alpha", "f": "Альфа", "d": "Доходность управляющего сверх той, которую можно было ожидать при его уровне риска. Показывает мастерство.", "x": "<code>α = Доходность портфеля − (Rf + β × (Rm − Rf))<\/code>", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy/Alpha", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "Альфа", "hs": "8. Альфа и оценка управляющих"}, {"t": "Altman Z-score", "f": "Z-модель Альтмана", "d": "Формула из пяти коэффициентов, которая предсказывает банкротство. Ниже 1,8 — зона риска.", "x": "<code>Z = 1,2×A + 1,4×B + 3,3×C + 0,6×D + 1,0×E<\/code><br><span class=\"fx\">где: A — NWC/Активы. B — Нераспр. прибыль/Активы. C — EBIT/Активы. D — Капитализация/Обязательства. E — Выручка/Активы.<\/span>", "u": "finance.html#learn/glossariy/Altman%20Z-score", "g": "finance.html#learn/glossariy/Altman%20Z-score"}, {"t": "AML", "f": "Anti-Money Laundering", "d": "Правила против отмывания денег. В РФ — закон 115-ФЗ (сверить).", "x": "", "u": "finance.html#learn/glossariy/AML", "g": "finance.html#learn/glossariy/AML"}, {"t": "Amortization", "f": "Амортизация (нематериальных активов)", "d": "То же списание, но для нематериальных вещей: программ, лицензий, патентов.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/Amortization", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Амортизация", "hs": "Шаг 6. CAPEX и амортизация (PP&E schedule)"}, {"t": "Amortization of goodwill", "f": "Амортизация гудвила", "d": "По МСФО гудвил не амортизируют, а проверяют на обесценение. По РСБУ амортизируют 20 лет (сверить).", "x": "", "u": "finance.html#learn/glossariy/Amortization%20of%20goodwill", "g": "finance.html#learn/glossariy/Amortization%20of%20goodwill"}, {"t": "Annuity", "f": "Аннуитет", "d": "Ряд одинаковых платежей через равные промежутки: ипотека, аренда, купоны.", "x": "<code>PV = C × (1 − (1 + r)^−n) / r<\/code><br><span class=\"fx\">где: C — платёж за период. r — ставка. n — число платежей.<\/span>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Annuity", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Аннуитет", "hs": "Аннуитет и перпетуитет"}, {"t": "Anti-dilution", "f": "Защита от размытия", "d": "Если следующий раунд проходит дешевле предыдущего, инвестор получает дополнительные акции, чтобы сохранить свою долю.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Anti-dilution", "ut": "Венчур и стартапы", "hq": "Anti-dilution", "hs": "Anti-dilution: защита от «раунда вниз»"}, {"t": "APT", "f": "Arbitrage Pricing Theory", "d": "Теория арбитражного ценообразования: доходность определяется несколькими факторами (инфляция, ВВП и т. п.), а не одной бетой.", "x": "", "u": "finance.html#learn/glossariy/APT", "g": "finance.html#learn/glossariy/APT"}, {"t": "APV", "f": "Adjusted Present Value", "d": "Сначала считают стоимость компании так, будто долга нет, потом прибавляют сегодняшнюю стоимость (PV) налоговой экономии от процентов по долгу (налогового щита). Проценты по кредиту уменьшают налог, и эту выгоду учитывают отдельной строкой", "x": "<code>APV = NPV<sub>без долга<\/sub> + PV(налоговый щит)<\/code><br><span class=\"fx\">где: NPV без долга — стоимость бизнеса, будто долгов нет. PV налогового щита — приведённая выгода от вычета процентов из налога<\/span>", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy/APV", "ut": "DCF: оценка по дисконтированным потокам", "hq": "APV", "hs": "Варианты DCF"}, {"t": "Arbitrage", "f": "Арбитраж", "d": "Покупка и продажа одного и того же актива на разных рынках, чтобы без риска забрать разницу цен. Такие возможности быстро исчезают.", "x": "", "u": "finance.html#learn/povedencheskie-esg", "g": "finance.html#learn/glossariy/Arbitrage", "ut": "Поведенческие финансы и ESG", "hq": "Арбитраж", "hs": "Аномалии и пределы арбитража"}, {"t": "ARPU", "f": "Average Revenue Per User", "d": "Сколько выручки в среднем приносит один пользователь (телеком, интернет). Если оператор за месяц получил 1000 рублей от 10 абонентов, ARPU равен 100 рублей", "x": "<code>ARPU = Выручка / Число пользователей<\/code><br><span class=\"fx\">где: Выручка за период, делённая на среднее число пользователей за тот же период<\/span>", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/ARPU", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "ARPU", "hs": "Телеком"}, {"t": "ARR", "f": "Annual Recurring Revenue", "d": "Выручка за год, которая повторяется из года в год, например по подписке (SaaS — программы по подписке). Похоже на абонемент в спортзал: деньги приходят регулярно, а не разово", "x": "<code>ARR = MRR × 12<\/code><br><span class=\"fx\">где: MRR — ежемесячная повторяющаяся выручка по подпискам. Умножаем на 12 месяцев<\/span>", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/ARR", "ut": "Венчур и стартапы", "hq": "ARR", "hs": "Другие подходы"}, {"t": "Asset management", "f": "Управление активами", "d": "Бизнес по управлению чужими деньгами за комиссию: ПИФы, ДУ, пенсионные деньги.", "x": "", "u": "finance.html#learn/glossariy/Asset%20management", "g": "finance.html#learn/glossariy/Asset%20management"}, {"t": "Asset turnover", "f": "Оборачиваемость активов", "d": "Сколько рублей выручки приносит каждый рубль активов.", "x": "<code>Asset turnover = Выручка / Средние активы<\/code>", "u": "finance.html#learn/glossariy/Asset%20turnover", "g": "finance.html#learn/glossariy/Asset%20turnover"}, {"t": "Audit opinion", "f": "Аудиторское заключение", "d": "Вывод аудитора: отчётность достоверна (чистое заключение), с оговоркой, отрицательное или отказ.", "x": "", "u": "finance.html#learn/analiz-otchetnosti", "g": "finance.html#learn/glossariy/Audit%20opinion", "ut": "Анализ отчётности: качество прибыли и красные флаги", "hq": "Аудиторское заключение", "hs": "8. Аудиторское заключение"}, {"t": "AUM", "f": "Assets Under Management", "d": "Сколько денег находится под управлением компании. Комиссия считается от AUM.", "x": "", "u": "finance.html#learn/glossariy/AUM", "g": "finance.html#learn/glossariy/AUM"}, {"t": "Backlog", "f": "Портфель заказов", "d": "Подписанные, но ещё не выполненные заказы. Показывает будущую выручку строителей и машиностроителей.", "x": "", "u": "finance.html#learn/glossariy/Backlog", "g": "finance.html#learn/glossariy/Backlog"}, {"t": "Backwardation", "f": "Бэквордация", "d": "Фьючерсы на более поздний срок дешевле ближайших. Означает дефицит товара сейчас.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Backwardation", "ut": "Альтернативные инвестиции", "hq": "Backwardation", "hs": "Сырьё и товарные фонды"}, {"t": "Balance check", "f": "Проверка баланса", "d": "Строка в модели: активы минус обязательства минус капитал. Должна быть ноль во всех годах.", "x": "", "u": "finance.html#learn/glossariy/Balance%20check", "g": "finance.html#learn/glossariy/Balance%20check"}, {"t": "Balance sheet", "f": "Баланс", "d": "Снимок компании на одну дату: что у неё есть (активы) и откуда это взялось (долг и капитал).", "x": "<code>Активы = Обязательства + Капитал<\/code><br><span class=\"fx\">где: Активы — всё, чем владеет компания. Обязательства — всё, что она должна. Капитал — доля владельцев.<\/span>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/Balance%20sheet", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "Баланс", "hs": "Отчётность: P&L, баланс, cash flow"}, {"t": "Balloon payment", "f": "Баллонный платёж", "d": "Последний платёж по кредиту намного больше предыдущих. До него платят мало.", "x": "", "u": "finance.html#learn/glossariy/Balloon%20payment", "g": "finance.html#learn/glossariy/Balloon%20payment"}, {"t": "Bankruptcy", "f": "Банкротство", "d": "Состояние, когда должник не может платить по долгам. Имущество продают, деньги делят по очереди.", "x": "", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Bankruptcy", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "Банкротство", "hs": "Реструктуризация, банкротство и distressed-ситуации"}, {"t": "Basel III", "f": "Базель III", "d": "Международные правила для банков: сколько капитала и ликвидности держать, чтобы пережить кризис.", "x": "", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/Basel%20III", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "Базель III", "hs": "Капитал и регулирование"}, {"t": "Basis", "f": "База для сравнения", "d": "Эффект низкой базы: рост выглядит большим, потому что в прошлом периоде было мало.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Basis", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Basis", "hs": "Покрытый паритет (CIP) — безарбитражное условие"}, {"t": "Basis point (б.п.)", "f": "Базисный пункт", "d": "Базисный пункт = 0,01%. 50 б.п. = 0,5 п.п. (п.п. — процентный пункт). Это очень мелкая единица, чтобы точно говорить о небольших изменениях ставок", "x": "<code>1 б.п. = 0,01% = 0,0001<\/code><br><span class=\"fx\">где: Сотая доля процента. Рост ставки с 10% до 10,5% — это +50 б.п.<\/span>", "u": "finance.html#learn/glossariy/Basis%20point%20%28%D0%B1.%D0%BF.%29", "g": "finance.html#learn/glossariy/Basis%20point%20%28%D0%B1.%D0%BF.%29"}, {"t": "Behavioral finance", "f": "Поведенческие финансы", "d": "Направление о том, как люди реально принимают финансовые решения: с ошибками, страхом и жадностью, а не как «рациональные агенты».", "x": "", "u": "finance.html#learn/povedencheskie-esg", "g": "finance.html#learn/glossariy/Behavioral%20finance", "ut": "Поведенческие финансы и ESG", "hq": "Поведенческие финансы", "hs": "Поведенческие финансы и ESG"}, {"t": "Benchmark", "f": "Бенчмарк", "d": "Индекс, с которым сравнивают результат управляющего. Обыграл индекс — молодец.", "x": "", "u": "finance.html#learn/otraslevoy-analiz", "g": "finance.html#learn/glossariy/Benchmark", "ut": "Отраслевой анализ: как разобраться в отрасли за день", "hq": "Бенчмарк", "hs": "Шаг 6. Бенчмарк конкурентов"}, {"t": "Beneficial owner", "f": "Бенефициарный владелец", "d": "Человек, который в итоге владеет компанией или контролирует её, даже через цепочку фирм.", "x": "", "u": "finance.html#learn/glossariy/Beneficial%20owner", "g": "finance.html#learn/glossariy/Beneficial%20owner"}, {"t": "Beta (β)", "f": "Бета-коэффициент", "d": "Показывает, насколько сильно акция реагирует на движения рынка. Бета 1 значит «двигается как рынок», больше 1 — «качается сильнее», меньше 1 — «спокойнее»", "x": "<code>β = Cov(R<sub>акции<\/sub>, R<sub>рынка<\/sub>) / Var(R<sub>рынка<\/sub>)<\/code><br><span class=\"fx\">где: Cov — ковариация доходностей акции и рынка (двигаются вместе или нет). Var — дисперсия доходности рынка. β>1 значит акция колеблется сильнее рынка<\/span>", "u": "finance.html#learn/glossariy/Beta%20%28%CE%B2%29", "g": "finance.html#learn/glossariy/Beta%20%28%CE%B2%29"}, {"t": "Big Four", "f": "Большая четвёрка", "d": "Четыре крупнейшие в мире компании, которые проверяют отчётность других компаний (аудит) и дают налоговые и консалтинговые услуги: Deloitte (Делойт), PwC (ПрайсуотерхаусКуперс), EY (Эрнст энд Янг), KPMG (КПМГ). В 2022 году ушли из России; бывшие российские офисы теперь называются «Деловые решения и технологии» (бывш. Deloitte), «Технологии Доверия» (бывш. PwC), Б1 (бывш. EY), Kept (бывш. KPMG).", "x": "", "u": "finance.html#learn/glossariy/Big%20Four", "g": "finance.html#learn/glossariy/Big%20Four"}, {"t": "Black-Scholes", "f": "Модель Блэка — Шоулза", "d": "Формула справедливой цены европейского опциона. Использует цену актива, страйк, срок, ставку и волатильность.", "x": "", "u": "finance.html#learn/glossariy/Black-Scholes", "g": "finance.html#learn/glossariy/Black-Scholes"}, {"t": "Blue chip", "f": "«Голубые фишки»", "d": "Акции крупнейших стабильных компаний с долгой историей. В России: Сбербанк, Газпром, Лукойл.", "x": "", "u": "finance.html#learn/glossariy/Blue%20chip", "g": "finance.html#learn/glossariy/Blue%20chip"}, {"t": "BNPL", "f": "Buy Now Pay Later", "d": "Оплата частями без процентов: сервис платит магазину сразу, покупатель платит сервису по частям.", "x": "", "u": "finance.html#learn/glossariy/BNPL", "g": "finance.html#learn/glossariy/BNPL"}, {"t": "Board of directors", "f": "Совет директоров", "d": "Орган, который назначает менеджмент, одобряет стратегию и крупные сделки от имени акционеров.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Board%20of%20directors", "ut": "Венчур и стартапы", "hq": "Совет директоров", "hs": "Другие ключевые условия term sheet"}, {"t": "Bond", "f": "Облигация", "d": "Долговая бумага: ты одалживаешь деньги эмитенту, он платит проценты (купоны) и в конце возвращает номинал.", "x": "", "u": "finance.html#learn/rynki-kapitala", "g": "finance.html#learn/glossariy/Bond", "ut": "Рынки капитала: облигации, акции, деривативы, крипта", "hq": "Облигация", "hs": "Рынки капитала: облигации, акции, деривативы, крипта"}, {"t": "Book building", "f": "Сбор заявок", "d": "Сбор заявок инвесторов по цене и количеству, по которому определяют цену и распределение акций при размещении.", "x": "", "u": "finance.html#learn/ipo-v-rossii", "g": "finance.html#learn/glossariy/Book%20building", "ut": "IPO и SPO в России: как выходят на биржу и что получается", "hq": "Book building", "hs": "Шаг 4. Book building"}, {"t": "Book value", "f": "Балансовая стоимость", "d": "Сколько стоит актив или вся компания по записям в балансе.", "x": "<code>Book value of equity = Активы − Обязательства<\/code>", "u": "finance.html#learn/metody", "g": "finance.html#learn/glossariy/Book%20value", "ut": "Другие методы оценки", "hq": "Балансовая стоимость", "hs": "Затратный подход"}, {"t": "Book-to-bill", "f": "Заказы к выручке", "d": "Новые заказы за период к выручке за него. Выше 1 — портфель растёт.", "x": "", "u": "finance.html#learn/glossariy/Book-to-bill", "g": "finance.html#learn/glossariy/Book-to-bill"}, {"t": "Bookrunner", "f": "Ведущий организатор размещения", "d": "Банк, который собирает заявки инвесторов при размещении акций или облигаций. Он ведёт «книгу заявок»: список, кто сколько готов купить и по какой цене", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Bookrunner", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Bookrunner", "hs": "Синдикация"}, {"t": "BoP / EoP", "f": "Beginning / End of Period (начало / конец периода)", "d": "Остаток на начало и на конец периода. В моделях строки долга, основных средств и аренды считают по цепочке: конец периода — это начало плюс приход минус расход, а конец одного года становится началом следующего.", "x": "<code>Остаток EoP = Остаток BoP + Поступления − Выбытия<\/code><br><span class=\"fx\">где: BoP — на начало года, EoP — на конец года<\/span>", "u": "finance.html#learn/glossariy/BoP%20%2F%20EoP", "g": "finance.html#learn/glossariy/BoP%20%2F%20EoP"}, {"t": "Break fee", "f": "Termination fee", "d": "Неустойка, которую платит цель, если выходит из сделки ради другого предложения. Неустойка — это штраф за срыв договорённости. Цель — компания, которую покупают", "x": "", "u": "finance.html#learn/vrazhdebnye-sdelki", "g": "finance.html#learn/glossariy/Break%20fee", "ut": "Враждебные поглощения, защита и регулирование сделок", "hq": "Break fee", "hs": "Защита условий сделки (deal protections)"}, {"t": "Break-even", "f": "Точка безубыточности", "d": "Объём продаж, при котором прибыль равна нулю: маржинальный доход как раз покрыл постоянные расходы.", "x": "<code>Break-even (штук) = Постоянные расходы / (Цена − Переменные расходы на штуку)<\/code>", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy/Break-even", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "Break-even", "hs": "Break-even синергий"}, {"t": "Bridge", "f": "Мост", "d": "Разложение изменения показателя на причины: «EBITDA выросла на 10: +15 цена, −3 объём, −2 расходы».", "x": "", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Bridge", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Мост", "hs": "Деньги во времени: NPV, IRR, окупаемость"}, {"t": "Broker", "f": "Брокер", "d": "Посредник, через которого частный инвестор торгует на бирже. Берёт комиссию.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Broker", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Брокер", "hs": "Брокеры, дилеры, маркет-мейкеры, биржи"}, {"t": "Budget deficit", "f": "Дефицит бюджета", "d": "Расходы государства больше доходов. Покрывается займами или резервами.", "x": "", "u": "finance.html#learn/glossariy/Budget%20deficit", "g": "finance.html#learn/glossariy/Budget%20deficit"}, {"t": "Bulge bracket", "f": "Крупнейшие инвестбанки", "d": "Крупнейшие глобальные инвестбанки: Goldman Sachs, Morgan Stanley, JPMorgan, Bank of America, Citi.", "x": "", "u": "finance.html#learn/glossariy/Bulge%20bracket", "g": "finance.html#learn/glossariy/Bulge%20bracket"}, {"t": "Bull / Bear market", "f": "Рынок быков / медведей", "d": "Бычий рынок — растущий, медвежий — падающий (обычно от пика минус 20% и больше).", "x": "", "u": "finance.html#learn/glossariy/Bull%20%2F%20Bear%20market", "g": "finance.html#learn/glossariy/Bull%20%2F%20Bear%20market"}, {"t": "Bullet repayment", "f": "Погашение разом", "d": "Весь основной долг возвращают одним платежом в конце срока, до этого платят только проценты.", "x": "", "u": "finance.html#learn/glossariy/Bullet%20repayment", "g": "finance.html#learn/glossariy/Bullet%20repayment"}, {"t": "Burn rate", "f": "Скорость сжигания денег", "d": "Сколько денег в месяц компания тратит сверх того, что зарабатывает. Характерно для стартапов.", "x": "<code>Burn = Расходы − Выручка (в месяц)<\/code>", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Burn%20rate", "ut": "Венчур и стартапы", "hq": "Burn rate", "hs": "Метрики стартапа"}, {"t": "Business judgment rule", "f": "Правило делового решения", "d": "Суд не наказывает директора за неудачное, но добросовестное и обоснованное решение.", "x": "", "u": "finance.html#learn/glossariy/Business%20judgment%20rule", "g": "finance.html#learn/glossariy/Business%20judgment%20rule"}, {"t": "CAC", "f": "Customer Acquisition Cost", "d": "Сколько стоит привлечь одного клиента: вся реклама и продажи, делённые на новых клиентов.", "x": "<code>CAC = Расходы на маркетинг и продажи / Число новых клиентов<\/code>", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/CAC", "ut": "Венчур и стартапы", "hq": "CAC", "hs": "Метрики стартапа"}, {"t": "CAGR", "f": "Compound Annual Growth Rate", "d": "Средний рост за год с учётом «процента на процент»: (Конец/Начало)^(1/n) − 1. Здесь n — число лет. Это та единая годовая скорость роста, которая из начальной суммы даёт конечную", "x": "<code>CAGR = (V<sub>кон<\/sub> / V<sub>нач<\/sub>)<sup>1/n<\/sup> − 1<\/code><br><span class=\"fx\">где: V<sub>кон<\/sub> — конечное значение, V<sub>нач<\/sub> — начальное, n — число лет. Показывает среднегодовой темп роста с учётом сложного процента<\/span>", "u": "finance.html#learn/glossariy/CAGR", "g": "finance.html#learn/glossariy/CAGR"}, {"t": "Call option", "f": "Опцион колл", "d": "Право, но не обязанность купить актив по цене страйк в будущем. Выигрыш при росте цены.", "x": "<code>Выплата = max(S − K; 0)<\/code><br><span class=\"fx\">где: S — цена актива. K — страйк.<\/span>", "u": "finance.html#learn/glossariy/Call%20option", "g": "finance.html#learn/glossariy/Call%20option"}, {"t": "Callable bond", "f": "Облигация с правом досрочного погашения", "d": "Эмитент может выкупить её раньше срока по заранее оговорённой цене. Он делает это, когда ставки упали.", "x": "", "u": "finance.html#learn/glossariy/Callable%20bond", "g": "finance.html#learn/glossariy/Callable%20bond"}, {"t": "Cap rate", "f": "Ставка капитализации", "d": "Доходность недвижимости: годовой чистый доход, делённый на цену объекта. Чем ниже cap rate, тем дороже объект.", "x": "<code>Cap rate = NOI / Цена<\/code>", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Cap%20rate", "ut": "Альтернативные инвестиции", "hq": "Cap rate", "hs": "Типичные ошибки"}, {"t": "Cap table", "f": "Таблица капитализации", "d": "Список всех владельцев компании: кому какая доля принадлежит, включая опционы.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Cap%20table", "ut": "Венчур и стартапы", "hq": "Cap table", "hs": "Pre-money, post-money и cap table на 3 раунда"}, {"t": "CAPEX", "f": "Capital Expenditures", "d": "Капитальные затраты: траты на покупку и обновление оборудования и других основных средств (ОС). Основные средства — это то, что служит много лет: станки, здания, машины. Например, пекарня покупает новую печь", "x": "<code>CAPEX = ΔОС + Амортизация<\/code><br><span class=\"fx\">где: ΔОС — изменение основных средств за период (конец минус начало). Амортизация добавляется, потому что она уменьшила стоимость ОС без покупок<\/span>", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/CAPEX", "ut": "Модель трёх отчётов шаг за шагом", "hq": "CAPEX", "hs": "Шаг 6. CAPEX и амортизация (PP&E schedule)"}, {"t": "Capex intensity", "f": "Капиталоёмкость", "d": "Инвестиции к выручке. У телекома и энергетики 15–25%, у IT-сервисов близко к нулю.", "x": "<code>Capex / Выручка<\/code>", "u": "finance.html#learn/glossariy/Capex%20intensity", "g": "finance.html#learn/glossariy/Capex%20intensity"}, {"t": "Capital call", "f": "Вызов капитала", "d": "Фонд не берёт все обещанные деньги сразу: он просит их у LP по мере необходимости, когда находит сделку.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Capital%20call", "ut": "Альтернативные инвестиции", "hq": "Capital call", "hs": "Структура фонда: GP, LP, J-кривая, IRR, TVPI, DPI"}, {"t": "Capital market line", "f": "Линия рынка капитала", "d": "Прямая из безрисковой ставки в рыночный портфель. Показывает доходность портфелей, смешанных из безрисковых вложений и рынка.", "x": "", "u": "finance.html#learn/glossariy/Capital%20market%20line", "g": "finance.html#learn/glossariy/Capital%20market%20line"}, {"t": "Capital rationing", "f": "Ограничение капитала для проектов", "d": "Ограниченный бюджет на инвестиции: проекты выстраивают по PI и берут лучшие, пока деньги не кончатся. Как поход в магазин с ограниченной суммой: сначала берёшь самое выгодное", "x": "", "u": "finance.html#learn/glossariy/Capital%20rationing", "g": "finance.html#learn/glossariy/Capital%20rationing"}, {"t": "Capital structure", "f": "Структура капитала", "d": "Из чего компания финансируется: сколько долга и сколько собственных денег.", "x": "", "u": "finance.html#learn/struktura-kapitala", "g": "finance.html#learn/glossariy/Capital%20structure", "ut": "Структура капитала и дивиденды", "hq": "Структура капитала", "hs": "Структура капитала и дивиденды"}, {"t": "Capitalization vs expensing", "f": "Капитализация или расход", "d": "Потраченное можно списать в расходы сразу или признать активом и списывать годами. Второе повышает текущую прибыль.", "x": "", "u": "finance.html#learn/glossariy/Capitalization%20vs%20expensing", "g": "finance.html#learn/glossariy/Capitalization%20vs%20expensing"}, {"t": "CAPM", "f": "Capital Asset Pricing Model", "d": "Модель, которая считает, какую доходность ждут от акции: Ke = Rf + β × ERP. Ke — требуемая доходность, Rf — безрисковая ставка, β — чувствительность акции к рынку, ERP — премия за риск акций. То есть «надёжная ставка плюс плата за риск»", "x": "<code>Ke = Rf + β × (Rm − Rf)<\/code><br><span class=\"fx\">где: Ke — стоимость собственного капитала. Rf — безрисковая ставка. β — чувствительность акции к рынку. Rm − Rf — премия за риск рынка (ERP)<\/span>", "u": "finance.html#learn/wacc", "g": "finance.html#learn/glossariy/CAPM", "ut": "Стоимость капитала: CAPM и WACC", "hq": "CAPM", "hs": "Стоимость капитала: CAPM и WACC"}, {"t": "Carried interest", "f": "Carry", "d": "Доля прибыли фонда, которую получает управляющий (GP), обычно 20%, если превышен hurdle rate.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Carried%20interest", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Carry", "hs": "Carry trade"}, {"t": "Carry trade", "f": "Керри-трейд", "d": "Занять в валюте с низкой ставкой, вложить в валюту с высокой и заработать разницу. Рискует резким изменением курса.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Carry%20trade", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Carry trade", "hs": "Carry trade"}, {"t": "Carve-out", "f": "Выделение", "d": "Компания продаёт часть бизнеса или выводит его на IPO отдельно, оставляя себе контроль.", "x": "", "u": "finance.html#learn/glossariy/Carve-out", "g": "finance.html#learn/glossariy/Carve-out"}, {"t": "Cash basis", "f": "Кассовый метод", "d": "Доходы и расходы записывают только когда деньги реально пришли или ушли. Проще, но картина по прибыли искажается. По МСФО и РСБУ для крупных компаний используют начисление.", "x": "", "u": "finance.html#learn/glossariy/Cash%20basis", "g": "finance.html#learn/glossariy/Cash%20basis"}, {"t": "Cash conversion cycle", "f": "Цикл конверсии денег", "d": "Сколько дней деньги «заморожены» в операциях: от оплаты поставщику до получения денег от клиента.", "x": "<code>CCC = DIO + DSO − DPO<\/code><br><span class=\"fx\">где: DIO — дни запасов. DSO — дни дебиторки. DPO — дни кредиторки.<\/span>", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy/Cash%20conversion%20cycle", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "Цикл конверсии денег", "hs": "Оборотный капитал и цикл конверсии денег (CCC)"}, {"t": "Cash cost", "f": "Денежная себестоимость", "d": "Прямые денежные затраты на единицу продукции без амортизации. Для горняков и металлургов.", "x": "", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/Cash%20cost", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "Cash cost", "hs": "Металлы и добыча"}, {"t": "Cash flow statement", "f": "Отчёт о движении денег (ОДДС)", "d": "Показывает, откуда пришли и куда ушли реальные деньги за период, в трёх блоках: операционном, инвестиционном и финансовом.", "x": "", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/Cash%20flow%20statement", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "Cash flow statement", "hs": "3. Отчёт о движении денежных средств (Cash Flow Statement)"}, {"t": "Cash ratio", "f": "Коэффициент абсолютной ликвидности", "d": "Самая жёсткая проверка: только деньги и их эквиваленты против краткосрочных долгов.", "x": "<code>Cash ratio = Деньги / Краткосрочные обязательства<\/code>", "u": "finance.html#learn/glossariy/Cash%20ratio", "g": "finance.html#learn/glossariy/Cash%20ratio"}, {"t": "Cash sweep", "f": "Погашение долга из избытка денег", "d": "Условие: весь свободный остаток денег идёт на досрочное погашение долга.", "x": "", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/Cash%20sweep", "ut": "LBO пошагово: paper LBO и модель", "hq": "Cash sweep", "hs": "Шаг 3. Денежный поток и cash sweep"}, {"t": "Cash-free debt-free", "f": "Без денег и без долга", "d": "Цена названа за бизнес как будто без денег и без долга. На закрытии к ней прибавляют деньги и вычитают долг.", "x": "<code>Цена за акции = EV + Деньги − Долг ± Корректировка NWC<\/code>", "u": "finance.html#learn/glossariy/Cash-free%20debt-free", "g": "finance.html#learn/glossariy/Cash-free%20debt-free"}, {"t": "CDS", "f": "Credit Default Swap", "d": "Страховка от дефолта: покупатель регулярно платит, а если заёмщик не вернёт долг, продавец покрывает убыток. Цена CDS показывает, как рынок оценивает риск.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/CDS", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "CDS", "hs": "CDS — кредитный дефолтный своп"}, {"t": "CET1", "f": "Common Equity Tier 1", "d": "Самый надёжный капитал банка: акции и нераспределённая прибыль (Базель III). Это собственные деньги банка, которыми он в первую очередь покрывает убытки", "x": "<code>Норматив CET1 = Базовый капитал (CET1) / RWA<\/code><br><span class=\"fx\">где: Основной капитал — акции и нераспределённая прибыль. RWA — активы, взвешенные на риск<\/span>", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/CET1", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "CET1", "hs": "Капитал и регулирование"}, {"t": "CFADS", "f": "Cash Flow Available for Debt Service", "d": "Деньги проекта, доступные для платежей по долгу. На них делят платежи, чтобы получить DSCR.", "x": "<code>DSCR = CFADS / (Проценты + Основной долг)<\/code>", "u": "finance.html#learn/glossariy/CFADS", "g": "finance.html#learn/glossariy/CFADS"}, {"t": "CFF", "f": "Cash Flow from Financing", "d": "Финансовый поток: движение денег по долгу, дивидендам, байбэкам (выкупу своих акций) и выпуску новых акций. Это деньги, которые пришли от кредиторов и акционеров или ушли к ним", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/CFF", "ut": "Модель трёх отчётов шаг за шагом", "hq": "CFF", "hs": "ДДС"}, {"t": "CFI", "f": "Cash Flow from Investing", "d": "Инвестиционный поток: деньги на CAPEX, а также от покупки и продажи активов и компаний. Обычно он отрицательный: компания тратит деньги на развитие", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/CFI", "ut": "Модель трёх отчётов шаг за шагом", "hq": "CFI", "hs": "ДДС"}, {"t": "CFO", "f": "Cash Flow from Operations", "d": "Операционный денежный поток: деньги, которые компания получила от основной работы. Например, деньги магазина от продажи товаров за вычетом оплаты поставщикам и зарплат", "x": "<code>CFO = Чистая прибыль + D&A ± ΔNWC<\/code><br><span class=\"fx\">где: D&A — амортизация (не денежные расходы, возвращаем). ΔNWC — изменение чистого оборотного капитала (рост NWC уменьшает денежный поток)<\/span>", "u": "finance.html#learn/analiz-otchetnosti", "g": "finance.html#learn/glossariy/CFO", "ut": "Анализ отчётности: качество прибыли и красные флаги", "hq": "CFO", "hs": "2. Качество прибыли: деньги против начислений"}, {"t": "Chapter 11", "f": "Глава 11 Кодекса о банкротстве США", "d": "Реорганизация: компания продолжает работать под защитой суда и договаривается с кредиторами о плане.", "x": "", "u": "finance.html#learn/glossariy/Chapter%2011", "g": "finance.html#learn/glossariy/Chapter%2011"}, {"t": "Churn", "f": "Отток клиентов", "d": "Доля клиентов, которые ушли за период.", "x": "<code>Churn = Ушедшие клиенты / Клиенты в начале периода<\/code>", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/Churn", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "Churn", "hs": "Телеком"}, {"t": "CIM", "f": "Confidential Information Memorandum", "d": "Подробное закрытое описание продаваемой компании для покупателей. Как подробное объявление о продаже квартиры с планом, документами и историей, которое показывают только серьёзным покупателям", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/CIM", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "CIM", "hs": "2. Маркетинг (3–5 недель)"}, {"t": "CIR", "f": "Cost-to-Income Ratio", "d": "Какую долю доходов банка съедают его расходы: расходы / доходы. Если на каждые 100 рублей дохода уходит 40 рублей расходов, CIR равен 40%", "x": "<code>CIR = Операционные расходы / Операционные доходы<\/code><br><span class=\"fx\">где: Расходы банка (персонал, офисы, IT) делим на его доходы. Чем ниже, тем эффективнее банк<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/CIR", "ut": "Финансовые коэффициенты", "hq": "CIR", "hs": "Банки"}, {"t": "Circularity", "f": "Циклическая ссылка", "d": "В модели проценты зависят от долга, а долг от денежного потока, который зависит от процентов. Excel зацикливается, поэтому включают итерации или упрощают.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/Circularity", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Циклическая ссылка", "hs": "Циклическая ссылка"}, {"t": "Claim", "f": "Страховой случай / выплата", "d": "Требование клиента выплатить деньги по договору страхования.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Claim", "ut": "Венчур и стартапы", "hq": "выплата", "hs": "Водопад выплат по нашему cap table"}, {"t": "Clean / Dirty price", "f": "Чистая / грязная цена", "d": "Чистая цена — без накопленного купонного дохода. Грязная — вместе с ним, то есть реально платишь.", "x": "<code>Dirty = Clean + НКД<\/code>", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy/Clean%20%2F%20Dirty%20price", "ut": "Облигации глубоко", "hq": "Чистая", "hs": "3. НКД, чистая и грязная цена"}, {"t": "Clearing", "f": "Клиринг", "d": "Сверка и расчёт взаимных обязательств по сделкам, чтобы обе стороны выполнили условия. На Мосбирже этим занимается НКЦ.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Clearing", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Клиринг", "hs": "Клиринг и расчёты"}, {"t": "Closing", "f": "Закрытие сделки", "d": "Момент, когда переходят акции и платят деньги. Подписание (signing) может быть задолго до закрытия.", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Closing", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Closing", "hs": "6. Подписание (signing) → закрытие (closing)"}, {"t": "Club deal", "f": "Клубная сделка (покупка группой фондов)", "d": "Кредит нескольких банков без широкой синдикации (то есть без привлечения множества участников). Узкий круг банков договаривается между собой, как в закрытом клубе", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Club%20deal", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Club deal", "hs": "Синдикация"}, {"t": "CoD", "f": "Cost of Debt (стоимость долга)", "d": "Ставка, по которой компания занимает: доходность её облигаций (YTM, Yield to Maturity) и ставки по кредитам. В WACC берут после налога, потому что проценты уменьшают налог на прибыль.", "x": "<code>CoD после налога = CoD × (1 − t)<\/code><br><span class=\"fx\">где: t — ставка налога на прибыль<\/span>", "u": "finance.html#learn/wacc", "g": "finance.html#learn/glossariy/CoD", "ut": "Стоимость капитала: CAPM и WACC", "hq": "стоимость долга", "hs": "Стоимость долга"}, {"t": "CoE", "f": "Cost of Equity (стоимость собственного капитала)", "d": "Доходность, которую требуют акционеры за риск вложения в акции компании. Чем рискованнее бизнес, тем выше. В DCF (Discounted Cash Flow) это ставка для денег акционеров, а в WACC (Weighted Average Cost of Capital) — доля собственного капитала.", "x": "<code>CoE = Rf + β × ERP + Size premium + Specific premium<\/code><br><span class=\"fx\">где: Rf (Risk-free rate) — безрисковая ставка, β (бета) — чувствительность акции к рынку, ERP (Equity Risk Premium) — премия за рыночный риск. Size premium — премия за размер, Specific premium — премия за риски именно этой компании<\/span>", "u": "finance.html#learn/wacc", "g": "finance.html#learn/glossariy/CoE", "ut": "Стоимость капитала: CAPM и WACC", "hq": "стоимость собственного капитала", "hs": "CAPM: стоимость собственного капитала"}, {"t": "Collateral", "f": "Залог", "d": "Имущество, которое банк заберёт, если заёмщик не вернёт кредит.", "x": "", "u": "finance.html#learn/leveraged-finance", "g": "finance.html#learn/glossariy/Collateral", "ut": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом", "hq": "Залог", "hs": "Защита кредитора"}, {"t": "Combined ratio", "f": "Комбинированный коэффициент (страхование)", "d": "(Убытки + расходы) / премии у страховщика. Если меньше 100%, страхование само по себе прибыльно. Премии — взносы клиентов. Собрали 100, выплатили и потратили 90: показатель 90%", "x": "<code>Combined = Убыточность + Расходность<\/code><br><span class=\"fx\">где: Убыточность — выплаты / премии. Расходность — расходы на ведение дела / премии. Ниже 100% — страховщик в прибыли<\/span>", "u": "finance.html#learn/sektory", "g": "finance.html#learn/glossariy/Combined%20ratio", "ut": "Какой метод к какому сектору", "hq": "Combined ratio", "hs": "Страховые компании"}, {"t": "Common stock", "f": "Обыкновенные акции", "d": "Главный вид акций: даёт право голоса и долю в прибыли, но при ликвидации платят после кредиторов и держателей привилегированных.", "x": "", "u": "finance.html#learn/glossariy/Common%20stock", "g": "finance.html#learn/glossariy/Common%20stock"}, {"t": "Completion accounts", "f": "Отчётность на закрытие", "d": "Механизм цены: после закрытия считают реальный долг и оборотный капитал и корректируют цену. Противоположность locked box.", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Completion%20accounts", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Completion accounts", "hs": "Механика цены: locked box vs completion accounts"}, {"t": "Compliance", "f": "Комплаенс", "d": "Система внутри компании, которая следит за соблюдением законов и правил.", "x": "", "u": "finance.html#learn/etika-regulirovanie", "g": "finance.html#learn/glossariy/Compliance", "ut": "Этика и регулирование: Кодекс CFA и российский рынок", "hq": "Комплаенс", "hs": "Комплаенс"}, {"t": "Compounding", "f": "Сложный процент", "d": "Проценты начисляют не только на вложенную сумму, но и на уже набежавшие проценты. Чем дольше срок, тем сильнее эффект.", "x": "", "u": "finance.html#learn/glossariy/Compounding", "g": "finance.html#learn/glossariy/Compounding"}, {"t": "Comps", "f": "Comparable companies", "d": "Таблица похожих компаний и их мультипликаторов. Мультипликатор — это «во сколько раз цена больше показателя» (прибыли, выручки). Так оценивают компанию по аналогии, как квартиру по цене соседних", "x": "<code>Цена = Метрика цели × Медианный мультипликатор аналогов<\/code><br><span class=\"fx\">где: Метрика — например, EBITDA. Мультипликатор берётся у похожих публичных компаний<\/span>", "u": "finance.html#learn/comps", "g": "finance.html#learn/glossariy/Comps", "ut": "Comps и прецеденты пошагово", "hq": "Comps", "hs": "Comps и прецеденты пошагово"}, {"t": "Conditions precedent (CP)", "f": "Отлагательные условия", "d": "Что должно случиться до закрытия: одобрение ФАС, согласие банка, выход партнёров.", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Conditions%20precedent%20%28CP%29", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Отлагательные условия", "hs": "6. Подписание (signing) → закрытие (closing)"}, {"t": "Consensus", "f": "Консенсус", "d": "Средний прогноз аналитиков по показателю. Если отчёт лучше консенсуса, акция обычно растёт.", "x": "", "u": "finance.html#learn/glossariy/Consensus", "g": "finance.html#learn/glossariy/Consensus"}, {"t": "Consolidation", "f": "Консолидация", "d": "Сложение отчётов материнской компании и дочерних в один, как будто это одна компания. Взаимные сделки внутри группы вычёркивают.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/Consolidation", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Консолидация", "hs": "Консолидация, гудвилл и распределение цены покупки (PPA)"}, {"t": "Contango", "f": "Контанго", "d": "Фьючерсы на более поздний срок дороже ближайших. Нормальная ситуация, когда хранение стоит денег.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Contango", "ut": "Альтернативные инвестиции", "hq": "Contango", "hs": "Сырьё и товарные фонды"}, {"t": "Contingent liability", "f": "Условное обязательство", "d": "Возможный долг, который появится, только если случится событие (например, проиграют суд). Его описывают в примечаниях, а в баланс не ставят, если вероятность невысокая.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/Contingent%20liability", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "Условное обязательство", "hs": "IAS 37. Резервы, условные обязательства и условные активы"}, {"t": "Contribution margin", "f": "Маржинальный доход", "d": "Что остаётся от выручки после переменных расходов. Идёт на покрытие постоянных расходов и на прибыль.", "x": "<code>Маржинальный доход = Выручка − Переменные расходы<\/code>", "u": "finance.html#learn/glossariy/Contribution%20margin", "g": "finance.html#learn/glossariy/Contribution%20margin"}, {"t": "Convertible bond", "f": "Конвертируемая облигация", "d": "Облигация, которую можно обменять на акции эмитента по заранее оговорённой цене. Поэтому купон у неё ниже обычного.", "x": "", "u": "finance.html#learn/glossariy/Convertible%20bond", "g": "finance.html#learn/glossariy/Convertible%20bond"}, {"t": "Convexity", "f": "Выпуклость", "d": "Поправка к дюрации: показывает, что цена облигации реагирует на падение ставки сильнее, чем на такой же рост.", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy/Convexity", "ut": "Облигации глубоко", "hq": "Выпуклость", "hs": "5. Выпуклость"}, {"t": "CoR", "f": "Cost of Risk", "d": "Цена кредитного риска: сколько денег банк отложил на возможные потери по кредитам (резервы / кредиты). Это «страховой запас» на случай, что часть клиентов не вернёт долг", "x": "<code>CoR = Резервы под потери за год / Средний кредитный портфель<\/code><br><span class=\"fx\">где: Резервы — сумма, отложенная на плохие кредиты. Показывает, какая доля портфеля «сгорает» за год<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/CoR", "ut": "Финансовые коэффициенты", "hq": "CoR", "hs": "Банки"}, {"t": "Core inflation", "f": "Базовая инфляция", "d": "Инфляция без самых скачущих цен (еда, энергия). Показывает устойчивый тренд.", "x": "", "u": "finance.html#learn/glossariy/Core%20inflation", "g": "finance.html#learn/glossariy/Core%20inflation"}, {"t": "Corporate governance", "f": "Корпоративное управление", "d": "Система правил, по которым компания управляется и контролируется: совет, аудит, права акционеров, раскрытие.", "x": "", "u": "finance.html#learn/ipo-v-rossii", "g": "finance.html#learn/glossariy/Corporate%20governance", "ut": "IPO и SPO в России: как выходят на биржу и что получается", "hq": "Корпоративное управление", "hs": "7. Почему российские IPO отличаются от западных"}, {"t": "Correlation", "f": "Корреляция", "d": "Нормированная ковариация от −1 до +1. +1 — активы двигаются синхронно, 0 — независимо, −1 — зеркально. Чем меньше корреляция, тем сильнее диверсификация.", "x": "<code>ρ = Cov(A,B) / (σA × σB)<\/code>", "u": "finance.html#learn/kolichestvennye-metody", "g": "finance.html#learn/glossariy/Correlation", "ut": "Количественные методы (по программе CFA Level 1)", "hq": "Корреляция", "hs": "7. Корреляция и простая линейная регрессия"}, {"t": "Cost of preferred", "f": "Стоимость привилегированных акций", "d": "Цена денег от привилегированных акций: дивиденд, делённый на цену акции.", "x": "<code>Kp = Дивиденд / Цена<\/code>", "u": "finance.html#learn/glossariy/Cost%20of%20preferred", "g": "finance.html#learn/glossariy/Cost%20of%20preferred"}, {"t": "Cost of risk (CoR)", "f": "Стоимость риска", "d": "Резервы банка за год к кредитному портфелю. Показывает, сколько процентов портфеля «сгорает».", "x": "<code>CoR = Резервы за год / Средний кредитный портфель<\/code>", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/Cost%20of%20risk%20%28CoR%29", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "Cost of risk (CoR)", "hs": "Как устроен банк"}, {"t": "Counterparty risk", "f": "Риск контрагента", "d": "Кредитный риск по деривативам и сделкам: другая сторона не исполнит обязательство.", "x": "", "u": "finance.html#learn/glossariy/Counterparty%20risk", "g": "finance.html#learn/glossariy/Counterparty%20risk"}, {"t": "Covariance", "f": "Ковариация", "d": "Показывает, движутся ли два актива в одну сторону. Положительная — вместе, отрицательная — в разные стороны.", "x": "", "u": "finance.html#learn/glossariy/Covariance", "g": "finance.html#learn/glossariy/Covariance"}, {"t": "Covenant", "f": "Ковенант (условие кредитного договора)", "d": "Условие кредитного договора, которое заёмщик обязан соблюдать (например, ND/EBITDA ≤ 3×). ND/EBITDA — это чистый долг, делённый на EBITDA. То есть «чистый долг не должен превышать годовую EBITDA больше чем в 3 раза». При нарушении банк может потребовать вернуть деньги", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Covenant", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Ковенант", "hs": "Ковенанты"}, {"t": "Covenant-lite", "f": "Кредит без финансовых тестов", "d": "Кредит без регулярных (maintenance) ковенантов, остаются только условия при действии (incurrence).", "x": "", "u": "finance.html#learn/leveraged-finance", "g": "finance.html#learn/glossariy/Covenant-lite", "ut": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом", "hq": "Covenant-lite", "hs": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом"}, {"t": "Coverage", "f": "Покрытие", "d": "Компании, по которым аналитик регулярно пишет отчёты.", "x": "", "u": "finance.html#learn/ib", "g": "finance.html#learn/glossariy/Coverage", "ut": "Инвестбанкинг: как всё устроено", "hq": "Coverage", "hs": "Направления (продукты)"}, {"t": "Coverage ratio (банк)", "f": "Покрытие резервами", "d": "Насколько резервы покрывают проблемные кредиты.", "x": "<code>Coverage = Резервы / NPL<\/code>", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Coverage%20ratio%20%28%D0%B1%D0%B0%D0%BD%D0%BA%29", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "банк", "hs": "Реструктуризация, банкротство и distressed-ситуации"}, {"t": "Covered interest parity", "f": "Покрытый паритет ставок", "d": "Форвардный курс не даёт заработать без риска: разница ставок уже в нём заложена.", "x": "", "u": "finance.html#learn/glossariy/Covered%20interest%20parity", "g": "finance.html#learn/glossariy/Covered%20interest%20parity"}, {"t": "CPI", "f": "Индекс потребительских цен (CPI — Consumer Price Index)", "d": "Показывает, как изменилась цена корзины товаров, которую покупают семьи. Через него считают инфляцию.", "x": "", "u": "finance.html#learn/makro", "g": "finance.html#learn/glossariy/CPI", "ut": "Макроэкономика для аналитика", "hq": "CPI", "hs": "Инфляция"}, {"t": "Cram-down", "f": "Принудительное утверждение плана", "d": "Суд утверждает план реструктуризации, даже если одна группа кредиторов против.", "x": "", "u": "finance.html#learn/glossariy/Cram-down", "g": "finance.html#learn/glossariy/Cram-down"}, {"t": "Credit rating", "f": "Кредитный рейтинг", "d": "Оценка способности заёмщика вернуть долг. Агентства: S&P, Moody's, Fitch, в России — АКРА и «Эксперт РА».", "x": "", "u": "finance.html#learn/glossariy/Credit%20rating", "g": "finance.html#learn/glossariy/Credit%20rating"}, {"t": "Credit risk", "f": "Кредитный риск", "d": "Риск, что контрагент не заплатит.", "x": "", "u": "finance.html#learn/shpargalka-obligatsii", "g": "finance.html#learn/glossariy/Credit%20risk", "ut": "Шпаргалка 5. Облигации и процентные ставки", "hq": "Кредитный риск", "hs": "5. Кредитный риск"}, {"t": "Credit spread", "f": "Кредитный спред", "d": "Кредитный спред: доходность облигации компании минус доходность госбумаги того же срока. Это плата за то, что компания надёжна хуже государства. Чем больше разница, тем рискованнее компания", "x": "<code>Spread = Доходность облигации − Доходность госбумаги<\/code><br><span class=\"fx\">где: Доплата за кредитный риск. Измеряется в б.п.<\/span>", "u": "finance.html#learn/rynki-kapitala", "g": "finance.html#learn/glossariy/Credit%20spread", "ut": "Рынки капитала: облигации, акции, деривативы, крипта", "hq": "Кредитный спред", "hs": "Спред и рейтинг"}, {"t": "Crossover rate", "f": "Ставка пересечения", "d": "Ставка, при которой NPV двух проектов равны. Выше неё лучше один, ниже — другой.", "x": "", "u": "finance.html#learn/glossariy/Crossover%20rate", "g": "finance.html#learn/glossariy/Crossover%20rate"}, {"t": "CRP", "f": "Country Risk Premium", "d": "Надбавка к доходности за то, что вложения в конкретной стране рискованнее. Инвестор требует больше за вложения туда, где больше политических и экономических неожиданностей", "x": "<code>Ke = Rf + β × ERP + CRP<\/code><br><span class=\"fx\">где: CRP — добавка к ставке за риск страны. Остальное как в CAPM<\/span>", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/CRP", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "CRP", "hs": "Страновой риск в оценке: CRP по Дамодарану"}, {"t": "Currency risk", "f": "Валютный риск", "d": "Риск потерять из-за изменения курса: выручка в рублях, долг в долларах.", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy/Currency%20risk", "ut": "Облигации глубоко", "hq": "Валютный риск", "hs": "12. Замещающие и валютные облигации"}, {"t": "Current account", "f": "Счёт текущих операций", "d": "Разница между тем, сколько страна получила от остального мира за экспорт и доходы, и сколько заплатила. Положительный — экспортёр.", "x": "", "u": "finance.html#learn/glossariy/Current%20account", "g": "finance.html#learn/glossariy/Current%20account"}, {"t": "Current ratio", "f": "Коэффициент текущей ликвидности", "d": "Хватит ли оборотных активов, чтобы закрыть краткосрочные долги. Выше 1 — запас есть.", "x": "<code>Current ratio = Оборотные активы / Краткосрочные обязательства<\/code>", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy/Current%20ratio", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "Current ratio", "hs": "Ликвидность: как не обанкротиться с прибылью"}, {"t": "Current yield", "f": "Текущая доходность", "d": "Купоны за год, делённые на цену облигации. Не учитывает разницу цены и номинала.", "x": "<code>Current yield = Годовой купон / Цена<\/code>", "u": "finance.html#learn/rynki-kapitala", "g": "finance.html#learn/glossariy/Current%20yield", "ut": "Рынки капитала: облигации, акции, деривативы, крипта", "hq": "Текущая доходность", "hs": "Облигации (DCM)"}, {"t": "Custodian", "f": "Депозитарий / кастодиан", "d": "Организация, которая хранит бумаги клиентов и фиксирует права на них. В России — НРД.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Custodian", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Депозитарий", "hs": "Брокеры, дилеры, маркет-мейкеры, биржи"}, {"t": "D&A", "f": "Depreciation & Amortization", "d": "Амортизация: постепенное списание стоимости основных средств (ОС) и нематериальных активов (НМА) в расходы. Купили станок за 100 на 10 лет: каждый год в расходы идёт по 10, хотя деньги заплатили один раз. НМА — то, что нельзя потрогать: лицензии, программы, бренд", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/D%26A", "ut": "Модель трёх отчётов шаг за шагом", "hq": "D&A", "hs": "Как три отчёта связаны"}, {"t": "Data room", "f": "Комната данных", "d": "Защищённое хранилище документов компании, куда пускают покупателей для проверки. Сейчас почти всегда виртуальная (VDR).", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Data%20room", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Data room", "hs": "4. Второй раунд: DD и management presentation (6–10 недель)"}, {"t": "DCF", "f": "Discounted Cash Flow", "d": "Оценка компании по будущим денежным потокам, пересчитанным в сегодняшние деньги (дисконтированным). Идея: рубль сегодня ценнее рубля через год, поэтому будущие деньги «уценивают»", "x": "<code>EV = Σ FCF<sub>t<\/sub> / (1+WACC)<sup>t<\/sup> + TV / (1+WACC)<sup>n<\/sup><\/code><br><span class=\"fx\">где: FCF<sub>t<\/sub> — свободный денежный поток года t. WACC — ставка дисконтирования. TV — терминальная стоимость после прогноза. n — последний год прогноза<\/span>", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy/DCF", "ut": "DCF: оценка по дисконтированным потокам", "hq": "DCF", "hs": "DCF: оценка по дисконтированным потокам"}, {"t": "DCM", "f": "Debt Capital Markets", "d": "Рынок, на котором компании занимают деньги, выпуская облигации. Облигация — это долговая расписка: компания берёт деньги у многих людей и обещает вернуть с процентами", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/DCM", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "DCM", "hs": "ECM и DCM: IPO, SPO и облигации"}, {"t": "DDM", "f": "Dividend Discount Model", "d": "Оценка акции по будущим дивидендам, пересчитанным в сегодняшние деньги. Дивиденд — это часть прибыли, которую компания платит владельцам акций", "x": "<code>P = DPS<sub>1<\/sub> / (Ke − g)<\/code><br><span class=\"fx\">где: DPS<sub>1<\/sub> — дивиденд на акцию в следующем году. Ke — требуемая доходность. g — вечный темп роста дивидендов (модель Гордона)<\/span>", "u": "finance.html#learn/metody", "g": "finance.html#learn/glossariy/DDM", "ut": "Другие методы оценки", "hq": "DDM", "hs": "Модель дисконтирования дивидендов (DDM)"}, {"t": "Deadlock", "f": "Тупик", "d": "Ситуация, когда партнёры 50/50 не могут договориться. В корпоративном договоре заранее пишут выход: «русская рулетка», «техасская перестрелка», медиация.", "x": "", "u": "finance.html#learn/glossariy/Deadlock", "g": "finance.html#learn/glossariy/Deadlock"}, {"t": "Debt / Equity", "f": "Долг к капиталу", "d": "Сколько долга приходится на рубль собственных денег. Мера финансового рычага.", "x": "<code>D/E = Долг / Капитал<\/code>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/Debt%20%2F%20Equity", "ut": "Финансовые коэффициенты", "hq": "Debt / Equity", "hs": "Долговая нагрузка"}, {"t": "Debt capacity", "f": "Долговая ёмкость", "d": "Максимум долга, который компания может нести без угрозы платежеспособности.", "x": "", "u": "finance.html#learn/leveraged-finance", "g": "finance.html#learn/glossariy/Debt%20capacity", "ut": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом", "hq": "Debt capacity", "hs": "Debt capacity: как подойти к вопросу «сколько долга»"}, {"t": "Debt schedule", "f": "График долга", "d": "Таблица в модели: сколько долга на начало года, сколько взяли и погасили, сколько осталось и какие проценты.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/Debt%20schedule", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Debt schedule", "hs": "Шаг 7. Долг и проценты (debt schedule)"}, {"t": "Debt service", "f": "Обслуживание долга", "d": "Проценты плюс погашение основного долга за период.", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Debt%20service", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Debt service", "hs": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование"}, {"t": "Debt-to-equity swap", "f": "Обмен долга на акции", "d": "Кредиторы прощают долг и получают взамен акции компании. Часто итог реструктуризации.", "x": "", "u": "finance.html#learn/glossariy/Debt-to-equity%20swap", "g": "finance.html#learn/glossariy/Debt-to-equity%20swap"}, {"t": "Deferred revenue", "f": "Доходы будущих периодов", "d": "Деньги, которые клиент уже заплатил, а услугу или товар компания ещё не отдала. Это обязательство: пока не отдала, выручкой это не считается.", "x": "", "u": "finance.html#learn/glossariy/Deferred%20revenue", "g": "finance.html#learn/glossariy/Deferred%20revenue"}, {"t": "Deferred tax asset / liability", "f": "Отложенный налоговый актив / обязательство", "d": "Разница между налогом по бухгалтерской и по налоговой отчётности. Актив — налог, который уже заплачен вперёд и уменьшит платежи позже. Обязательство — налог, который придётся заплатить позже. В оценке обычно не считаются долгом, но их движение объясняет разницу между расходом по налогу и уплаченным налогом.", "x": "", "u": "finance.html#learn/analiz-otchetnosti", "g": "finance.html#learn/glossariy/Deferred%20tax%20asset%20%2F%20liability", "ut": "Анализ отчётности: качество прибыли и красные флаги", "hq": "обязательство", "hs": "6. Забалансовые обязательства"}, {"t": "Deflation", "f": "Дефляция", "d": "Цены в экономике падают. Выглядит приятно, но люди откладывают покупки и экономика замедляется.", "x": "", "u": "finance.html#learn/glossariy/Deflation", "g": "finance.html#learn/glossariy/Deflation"}, {"t": "Delta", "f": "Дельта", "d": "Насколько изменится цена опциона, если цена актива сдвинется на 1. У колла от 0 до 1.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Delta", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Delta", "hs": "Греки"}, {"t": "Depreciation", "f": "Амортизация (основных средств)", "d": "Постепенное списание стоимости оборудования, зданий и т. п. на расходы за все годы их службы. Деньги не уходят, но прибыль уменьшается.", "x": "<code>Амортизация в год = (Стоимость − Остаточная стоимость) / Срок службы<\/code>", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/Depreciation", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Амортизация", "hs": "Шаг 6. CAPEX и амортизация (PP&E schedule)"}, {"t": "Devaluation", "f": "Девальвация", "d": "Намеренное или вынужденное снижение курса национальной валюты.", "x": "", "u": "finance.html#learn/glossariy/Devaluation", "g": "finance.html#learn/glossariy/Devaluation"}, {"t": "Diluted EPS", "f": "Разводнённая прибыль на акцию (EPS — Earnings Per Share)", "d": "EPS с учётом всех бумаг, которые можно превратить в акции: опционов, конвертируемых облигаций.", "x": "", "u": "finance.html#learn/glossariy/Diluted%20EPS", "g": "finance.html#learn/glossariy/Diluted%20EPS"}, {"t": "Dilution", "f": "Размытие доли", "d": "Когда выпускают новые акции, доля каждого старого акционера уменьшается.", "x": "<code>Новая доля = Старая доля × Старое число акций / Новое число акций<\/code>", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy/Dilution", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "Dilution", "hs": "Accretion / dilution: модель слияния пошагово"}, {"t": "Direct listing", "f": "Прямой листинг", "d": "Выход на биржу без привлечения новых денег: акции просто начинают торговаться.", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/Direct%20listing", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "Direct listing", "hs": "Глобальные IPO: ориентиры"}, {"t": "Disclosure", "f": "Раскрытие информации", "d": "Обязанность публичной компании публиковать отчётность и существенные факты. В РФ правила ЦБ и закон о рынке ценных бумаг (сверить).", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Disclosure", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Disclosure", "hs": "SPA и защита сторон"}, {"t": "Discount factor", "f": "Коэффициент дисконтирования", "d": "Число меньше единицы, на которое умножают будущую сумму, чтобы получить сегодняшнюю.", "x": "<code>DF = 1 / (1 + r)^n<\/code>", "u": "finance.html#learn/glossariy/Discount%20factor", "g": "finance.html#learn/glossariy/Discount%20factor"}, {"t": "Discount period", "f": "Период дисконтирования", "d": "Через сколько лет придёт денежный поток, по которому считают коэффициент дисконтирования. Для года в конце периода — 1, 2, 3; при допущении о середине года — 0,5; 1,5; 2,5. Первый прогнозный год от даты оценки может быть дробным.", "x": "<code>Дисконтированный поток = FCFF / (1 + WACC)^t<\/code><br><span class=\"fx\">где: FCFF — свободный денежный поток компании, WACC — ставка дисконтирования, t — период дисконтирования в годах<\/span>", "u": "finance.html#learn/glossariy/Discount%20period", "g": "finance.html#learn/glossariy/Discount%20period"}, {"t": "Discounted payback", "f": "Дисконтированный срок окупаемости", "d": "За сколько лет дисконтированные потоки вернут вложения. Честнее обычного payback.", "x": "", "u": "finance.html#learn/glossariy/Discounted%20payback", "g": "finance.html#learn/glossariy/Discounted%20payback"}, {"t": "Distressed debt", "f": "Проблемный долг", "d": "Долг компании в тяжёлом положении, торгуется с большим дисконтом. Фонды скупают его, надеясь на выкуп или реструктуризацию.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Distressed%20debt", "ut": "Альтернативные инвестиции", "hq": "Distressed debt", "hs": "Private equity и private debt"}, {"t": "Diversification", "f": "Диверсификация", "d": "Не класть все яйца в одну корзину. Разные активы падают не одновременно, поэтому риск портфеля меньше риска отдельных бумаг.", "x": "", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy/Diversification", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "Диверсификация", "hs": "Риск и доходность: портфель, CAPM, факторы"}, {"t": "Divestiture", "f": "Продажа бизнеса", "d": "Компания продаёт неосновной бизнес целиком. Деньги идут на долг, дивиденды или основной бизнес.", "x": "", "u": "finance.html#learn/glossariy/Divestiture", "g": "finance.html#learn/glossariy/Divestiture"}, {"t": "Dividend policy", "f": "Дивидендная политика", "d": "Правила, по которым компания решает, сколько прибыли выплатить акционерам, а сколько оставить.", "x": "", "u": "finance.html#learn/glossariy/Dividend%20policy", "g": "finance.html#learn/glossariy/Dividend%20policy"}, {"t": "Dividend recap", "f": "Рекапитализация ради дивиденда", "d": "Компания берёт новый долг и выплачивает деньги акционерам. Фонд так возвращает часть вложений до продажи.", "x": "", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/Dividend%20recap", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "Dividend recap", "hs": "Управление портфельной компанией"}, {"t": "DPI / TVPI / RVPI", "f": "DPI — Distributions to Paid-In Capital; TVPI — Total Value to Paid-In Capital; RVPI — Residual Value to Paid-In Capital", "d": "Метрики фонда. DPI — сколько денег уже вернули инвесторам, RVPI — сколько ещё стоят оставшиеся вложения, TVPI — их сумма.", "x": "<code>TVPI = DPI + RVPI<\/code><br><span class=\"fx\">где: Каждая метрика — на рубль вложенных денег.<\/span>", "u": "finance.html#learn/glossariy/DPI%20%2F%20TVPI%20%2F%20RVPI", "g": "finance.html#learn/glossariy/DPI%20%2F%20TVPI%20%2F%20RVPI"}, {"t": "DPS", "f": "Dividend Per Share", "d": "Сколько дивидендов приходится на одну акцию. Если компания выплатила 1000 и акций 100, то DPS равен 10", "x": "<code>DPS = Дивиденды / Число акций<\/code><br><span class=\"fx\">где: Все выплаченные дивиденды делим на число акций в обращении<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/DPS", "ut": "Финансовые коэффициенты", "hq": "DPS", "hs": "Для акционеров"}, {"t": "Drag-along", "f": "Право принудительной продажи", "d": "Если крупные акционеры продают компанию, они могут заставить продать и миноритариев на тех же условиях.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Drag-along", "ut": "Венчур и стартапы", "hq": "Drag-along", "hs": "Другие ключевые условия term sheet"}, {"t": "DSCR", "f": "Debt Service Coverage Ratio", "d": "Денежный поток для обслуживания долга / (проценты + плановое погашение). Показывает, во сколько раз заработок больше платежей по долгу. Если DSCR меньше 1, денег на платёж не хватает", "x": "<code>DSCR = CFADS / (Проценты + Погашение основного долга)<\/code><br><span class=\"fx\">где: CFADS — денежный поток для обслуживания долга. Ниже 1 — денег на платежи не хватает<\/span>", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/DSCR", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "DSCR", "hs": "Как банк решает, дать ли кредит"}, {"t": "DSO / DIO / DPO", "f": "Days Sales / Inventory / Payables Outstanding", "d": "За сколько дней в среднем оборачиваются: дебиторка (долги клиентов), запасы, кредиторка (долги перед поставщиками). Например, DSO 30 дней значит, что клиенты платят в среднем через месяц после продажи", "x": "<code>DSO = Дебиторка / Выручка × 365; DIO = Запасы / COGS × 365; DPO = Кредиторка / COGS × 365<\/code><br><span class=\"fx\">где: Дебиторка — долги покупателей. Запасы — товары на складе. Кредиторка — долги поставщикам. COGS — себестоимость. Результат в днях. Цикл денег: DSO + DIO − DPO<\/span>", "u": "finance.html#learn/glossariy/DSO%20%2F%20DIO%20%2F%20DPO", "g": "finance.html#learn/glossariy/DSO%20%2F%20DIO%20%2F%20DPO"}, {"t": "DTA / DTL", "f": "Отложенные налоговые активы / обязательства (DTA — Deferred Tax Asset; DTL — Deferred Tax Liability)", "d": "Разница между налогом по учёту и налогом по закону. DTL — налог, который заплатят позже; DTA — налог, который заплатили вперёд и потом вернут через уменьшение налога.", "x": "", "u": "finance.html#learn/glossariy/DTA%20%2F%20DTL", "g": "finance.html#learn/glossariy/DTA%20%2F%20DTL"}, {"t": "Dual-class shares", "f": "Акции двух классов", "d": "Акции основателей дают больше голосов, чем обычные. Основатели сохраняют контроль с небольшой долей.", "x": "", "u": "finance.html#learn/glossariy/Dual-class%20shares", "g": "finance.html#learn/glossariy/Dual-class%20shares"}, {"t": "Due diligence (DD)", "f": "Комплексная проверка компании", "d": "Тщательная проверка компании перед сделкой: покупатель смотрит документы, финансы и риски. Как осмотр квартиры и проверка документов перед покупкой", "x": "", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/Due%20diligence%20%28DD%29", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "Due diligence", "hs": "3. Due diligence"}, {"t": "DuPont", "f": "Разложение ROE по Дюпону", "d": "ROE делят на три части: маржа, оборачиваемость активов, рычаг. Видно, за счёт чего прибыльность: хорошая маржа, быстрые продажи или долг.", "x": "<code>ROE = (Прибыль/Выручка) × (Выручка/Активы) × (Активы/Капитал)<\/code>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/DuPont", "ut": "Финансовые коэффициенты", "hq": "DuPont", "hs": "Формула DuPont"}, {"t": "EAD", "f": "Exposure at Default", "d": "Сумма, которую банк потеряет под риском в момент дефолта заёмщика.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/EAD", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "EAD", "hs": "IFRS 9. Финансовые инструменты и ожидаемые кредитные убытки"}, {"t": "EAR / APR", "f": "Эффективная и номинальная годовая ставка (EAR — Effective Annual Rate; APR — Annual Percentage Rate)", "d": "APR — ставка «по бумагам», без учёта частоты начисления. EAR — реальная годовая с учётом сложного процента.", "x": "<code>EAR = (1 + APR/m)^m − 1<\/code><br><span class=\"fx\">где: m — число начислений в год.<\/span>", "u": "finance.html#learn/glossariy/EAR%20%2F%20APR", "g": "finance.html#learn/glossariy/EAR%20%2F%20APR"}, {"t": "Earn-out", "f": "Отложенная доплата за результат", "d": "Часть цены сделки, которую платят позже, если компания достигнет оговорённых результатов. Продавец получает доплату, только если бизнес оправдает его обещания", "x": "<code>Цена = Фиксированная часть + Отложенная часть, если цель достигнута<\/code><br><span class=\"fx\">где: Отложенная часть зависит от результатов бизнеса после сделки<\/span>", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Earn-out", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Earn-out", "hs": "SPA и защита сторон"}, {"t": "Earnings surprise", "f": "Сюрприз по прибыли", "d": "Разница между фактической прибылью и консенсусом.", "x": "", "u": "finance.html#learn/glossariy/Earnings%20surprise", "g": "finance.html#learn/glossariy/Earnings%20surprise"}, {"t": "EBIT", "f": "Earnings Before Interest & Taxes", "d": "Операционная прибыль: заработок до вычета процентов и налогов. Показывает, сколько приносит сам бизнес, без влияния кредитов и налогов. В учебниках и в этом конспекте EBIT и операционную прибыль считают одним и тем же; строго говоря, EBIT может включать ещё прочие (неоперационные) доходы и расходы, тогда он чуть отличается", "x": "<code>EBIT = Выручка − COGS − Операционные расходы<\/code><br><span class=\"fx\">где: COGS — себестоимость проданного. Операционные расходы — SG&A, R&D и т. п. Прибыль до процентов и налогов<\/span>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/EBIT", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "EBIT", "hs": "EBITDA, EBIT: зачем столько?"}, {"t": "EBITDA", "f": "Earnings Before Interest, Taxes, Depreciation and Amortization", "d": "Прибыль до вычета процентов, налогов и амортизации; грубо показывает, сколько компания зарабатывает на своей основной работе. Это EBIT, к которому прибавили амортизацию", "x": "<code>EBITDA = EBIT + D&A<\/code><br><span class=\"fx\">где: EBIT — операционная прибыль. D&A — амортизация и износ. Маржа EBITDA = EBITDA / Выручка<\/span>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/EBITDA", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "EBITDA", "hs": "EBITDA, EBIT: зачем столько?"}, {"t": "EBITDA margin", "f": "Маржа EBITDA (EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)", "d": "Какая доля выручки превращается в EBITDA. Удобно сравнивать компании одной отрасли.", "x": "<code>EBITDA margin = EBITDA / Выручка<\/code>", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/EBITDA%20margin", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Depreciation and Amortization)", "hs": "Как три отчёта связаны"}, {"t": "EBITDA per tonne", "f": "EBITDA на тонну (EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)", "d": "Метрика металлургов: прибыль на тонну продукции. Показывает позицию на кривой затрат.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/EBITDA%20per%20tonne", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Depreciation and Amortization)", "hs": "Как три отчёта связаны"}, {"t": "EBITDAR", "f": "EBITDAR — Earnings Before Interest, Taxes, Depreciation, Amortization and Rent", "d": "EBITDA до арендных расходов. Нужна для сравнения компаний, где часть бизнеса арендована, а часть куплена (ритейл, авиа, рестораны).", "x": "<code>EBITDAR = EBITDA + Аренда<\/code>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/EBITDAR", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "EBITDAR", "hs": "EBITDA, EBIT: зачем столько?"}, {"t": "ECL", "f": "Expected Credit Loss", "d": "Ожидаемые кредитные потери, которые банк резервирует по МСФО 9 заранее.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/ECL", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "ECL", "hs": "IFRS 9. Финансовые инструменты и ожидаемые кредитные убытки"}, {"t": "ECM", "f": "Equity Capital Markets", "d": "Рынок, на котором компании привлекают деньги, продавая свои акции (IPO, SPO). Акция — доля в компании, и тот, кто её купил, становится совладельцем", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/ECM", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "ECM", "hs": "ECM и DCM: IPO, SPO и облигации"}, {"t": "Economic capital", "f": "Экономический капитал", "d": "Сколько капитала нужно банку по его собственной оценке риска, а не по нормативам.", "x": "", "u": "finance.html#learn/glossariy/Economic%20capital", "g": "finance.html#learn/glossariy/Economic%20capital"}, {"t": "Effective tax rate", "f": "Эффективная ставка налога", "d": "Фактически уплаченный налог к прибыли до налога. Отличается от законной ставки из-за льгот и невычитаемых расходов.", "x": "<code>ETR = Налог на прибыль / Прибыль до налога<\/code>", "u": "finance.html#learn/glossariy/Effective%20tax%20rate", "g": "finance.html#learn/glossariy/Effective%20tax%20rate"}, {"t": "Efficient frontier", "f": "Эффективная граница", "d": "Линия на графике «риск — доходность»: лучшие портфели, где нельзя поднять доходность без роста риска.", "x": "", "u": "finance.html#learn/shpargalka-portfel-risk", "g": "finance.html#learn/glossariy/Efficient%20frontier", "ut": "Шпаргалка 7. Портфель и риск", "hq": "Эффективная граница", "hs": "2. Эффективная граница и оптимизация"}, {"t": "Efficient market hypothesis", "f": "Гипотеза эффективного рынка", "d": "Цены уже учитывают всю доступную информацию, поэтому стабильно обыгрывать рынок нельзя. Три формы: слабая, средняя, сильная.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Efficient%20market%20hypothesis", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Гипотеза эффективного рынка", "hs": "Гипотеза эффективного рынка (EMH)"}, {"t": "Enterprise value (в сделке)", "f": "Стоимость бизнеса", "d": "Цена за весь бизнес до учёта того, как он финансируется.", "x": "", "u": "finance.html#learn/teoriya-nwc", "g": "finance.html#learn/glossariy/Enterprise%20value%20%28%D0%B2%20%D1%81%D0%B4%D0%B5%D0%BB%D0%BA%D0%B5%29", "ut": "Оборотный капитал и оборачиваемость: теория", "hq": "в сделке", "hs": "8. NWC в сделках"}, {"t": "EPS", "f": "Earnings Per Share", "d": "Сколько чистой прибыли приходится на одну акцию. Чистая прибыль — то, что осталось после всех расходов и налогов", "x": "<code>EPS = (Чистая прибыль − Дивиденды по привилегированным) / Средневзвешенное число акций<\/code><br><span class=\"fx\">где: Прибыль, которая приходится на одну обыкновенную акцию<\/span>", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy/EPS", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "EPS", "hs": "Из чего складывается pro forma EPS"}, {"t": "Equity", "f": "Акционерный капитал / акции", "d": "Доля владельцев в компании. Может означать и сам капитал, и ценные бумаги, которые его представляют.", "x": "", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/Equity", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "Equity", "hs": "Private Equity в работе: от поиска сделки до выхода"}, {"t": "Equity method", "f": "Метод долевого участия", "d": "Как учитывают долю в компании, где у тебя 20–50% и нет контроля: не складывают её отчёт по строкам, а показывают одну строку «доля в прибыли».", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/Equity%20method", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Equity method", "hs": "Equity method и совместные предприятия"}, {"t": "Equity multiplier", "f": "Мультипликатор капитала", "d": "Активы к собственному капиталу. Часть разложения Дюпона.", "x": "<code>Equity multiplier = Активы / Капитал<\/code>", "u": "finance.html#learn/glossariy/Equity%20multiplier", "g": "finance.html#learn/glossariy/Equity%20multiplier"}, {"t": "Equity Value", "f": "Стоимость собственного капитала", "d": "Стоимость акционерного капитала (для публичной компании — капитализация). Это цена только той части бизнеса, которая принадлежит владельцам, без долга", "x": "<code>Equity Value = EV − Net Debt − NCI − Привилегированные<\/code><br><span class=\"fx\">где: EV — стоимость бизнеса. Вычитаем долги и права других держателей. Остаток принадлежит акционерам<\/span>", "u": "finance.html#learn/multiplikatory", "g": "finance.html#learn/glossariy/Equity%20Value", "ut": "Сравнительная оценка: мультипликаторы", "hq": "Equity Value", "hs": "EV и Equity Value"}, {"t": "Equivalent annual annuity", "f": "Эквивалентный годовой аннуитет", "d": "Способ сравнить проекты разной длительности: NPV каждого пересчитывают в одинаковый годовой платёж.", "x": "<code>EAA = NPV × r / (1 − (1 + r)^−n)<\/code>", "u": "finance.html#learn/glossariy/Equivalent%20annual%20annuity", "g": "finance.html#learn/glossariy/Equivalent%20annual%20annuity"}, {"t": "ERM", "f": "Enterprise Risk Management", "d": "Система управления всеми рисками компании целиком, а не по отдельности.", "x": "", "u": "finance.html#learn/glossariy/ERM", "g": "finance.html#learn/glossariy/ERM"}, {"t": "ERP", "f": "Equity Risk Premium", "d": "Дополнительная доходность, которую инвесторы требуют за то, что вкладываются в акции, а не в безрисковые бумаги. Это плата за то, что акции могут и упасть в цене", "x"
