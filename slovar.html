out", "d": "Задача на собеседовании: посчитать LBO на бумаге за 5 минут без Excel.", "x": "", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/Paper%20LBO", "ut": "LBO пошагово: paper LBO и модель", "hq": "Paper LBO", "hs": "LBO пошагово: paper LBO и модель"}, {"t": "Par / Premium / Discount", "f": "По номиналу / с премией / с дисконтом", "d": "Цена облигации: равна номиналу (par), выше (premium) или ниже (discount).", "x": "", "u": "finance.html#learn/comps", "g": "finance.html#learn/glossariy/Par%20%2F%20Premium%20%2F%20Discount", "ut": "Comps и прецеденты пошагово", "hq": "с дисконтом", "hs": "Российская специфика"}, {"t": "Payback", "f": "Срок окупаемости", "d": "Срок окупаемости: за сколько времени вложения вернутся. Потратил 100 и получаешь по 25 в год: окупишься за 4 года", "x": "<code>Payback = Инвестиции / Годовой денежный поток<\/code><br><span class=\"fx\">где: При равных потоках. Показывает, за сколько лет вложения вернутся (без учёта дисконтирования)<\/span>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Payback", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Payback", "hs": "Срок окупаемости (Payback)"}, {"t": "Payback (CAC)", "f": "Срок окупаемости клиента (CAC — Customer Acquisition Cost)", "d": "За сколько месяцев маржа от клиента вернёт стоимость его привлечения.", "x": "<code>CAC payback = CAC / (Месячная выручка × Маржа)<\/code>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Payback%20%28CAC%29", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Payback", "hs": "Срок окупаемости (Payback)"}, {"t": "Payment system", "f": "Платёжная система", "d": "Инфраструктура для переводов между банками: Visa, Mastercard, Мир, СБП.", "x": "", "u": "finance.html#learn/glossariy/Payment%20system", "g": "finance.html#learn/glossariy/Payment%20system"}, {"t": "Payout ratio", "f": "Коэффициент выплат", "d": "Какую часть чистой прибыли компания отдаёт в виде дивидендов.", "x": "<code>Payout = Дивиденды / Чистая прибыль<\/code>", "u": "finance.html#learn/glossariy/Payout%20ratio", "g": "finance.html#learn/glossariy/Payout%20ratio"}, {"t": "PD", "f": "Probability of Default", "d": "Вероятность того, что заёмщик не вернёт долг за период.", "x": "", "u": "finance.html#learn/glossariy/PD", "g": "finance.html#learn/glossariy/PD"}, {"t": "PE (Private Equity)", "f": "Прямые инвестиции", "d": "Фонды прямых инвестиций: они покупают компании, чтобы развить их и потом продать дороже. Похоже на покупку старой квартиры, ремонт и перепродажу, но с целыми компаниями", "x": "", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/PE%20%28Private%20Equity%29", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "Private Equity", "hs": "Private Equity в работе: от поиска сделки до выхода"}, {"t": "Pecking order", "f": "Иерархия источников", "d": "Компании сначала используют собственную прибыль, потом долг, и только в последнюю очередь выпускают акции.", "x": "", "u": "finance.html#learn/struktura-kapitala", "g": "finance.html#learn/glossariy/Pecking%20order", "ut": "Структура капитала и дивиденды", "hq": "Pecking order", "hs": "Теории структуры капитала"}, {"t": "PEG", "f": "Price/Earnings to Growth", "d": "P/E, делённый на темп роста EPS. Помогает понять, не переплачиваешь ли за быстрый рост. Меньше — лучше", "x": "<code>PEG = P/E / Темп роста EPS (в %)<\/code><br><span class=\"fx\">где: P/E скорректирован на рост прибыли. Около 1 — справедливо, ниже — дёшево<\/span>", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/PEG", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "PEG", "hs": "Режимы валютного курса"}, {"t": "Percentage of completion", "f": "Метод по мере готовности", "d": "Выручку по длинному контракту признают пропорционально выполненной части, а не в конце.", "x": "", "u": "finance.html#learn/glossariy/Percentage%20of%20completion", "g": "finance.html#learn/glossariy/Percentage%20of%20completion"}, {"t": "Percentile / Quartile", "f": "Перцентиль / квартиль", "d": "Значение, ниже которого лежит заданная доля данных. 25-й перцентиль (первый квартиль) — ниже него четверть значений, 75-й — три четверти. В таблице аналогов диапазон от 25-го до 75-го отсекает выбросы, а медиана — это 50-й перцентиль.", "x": "", "u": "finance.html#learn/comps", "g": "finance.html#learn/glossariy/Percentile%20%2F%20Quartile", "ut": "Comps и прецеденты пошагово", "hq": "квартиль", "hs": "Шаг 6. Статистика"}, {"t": "Perpetual bond", "f": "Вечная облигация", "d": "Облигация без срока погашения: проценты платят бесконечно.", "x": "", "u": "finance.html#learn/glossariy/Perpetual%20bond", "g": "finance.html#learn/glossariy/Perpetual%20bond"}, {"t": "Perpetuity", "f": "Перпетуитет (бессрочная рента)", "d": "Одинаковый платёж навсегда. Его сегодняшняя стоимость конечна.", "x": "<code>PV = C / r<\/code>", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy/Perpetuity", "ut": "DCF: оценка по дисконтированным потокам", "hq": "Perpetuity", "hs": "Метод Гордона (perpetuity growth)"}, {"t": "Phillips curve", "f": "Кривая Филлипса", "d": "Зависимость между безработицей и инфляцией: чем ниже безработица, тем выше инфляция.", "x": "", "u": "finance.html#learn/glossariy/Phillips%20curve", "g": "finance.html#learn/glossariy/Phillips%20curve"}, {"t": "PI", "f": "Profitability Index", "d": "Индекс прибыльности: PV потоков / инвестиции. PV — сегодняшняя стоимость будущих денег. Если индекс больше 1, проект окупается и приносит прибыль", "x": "<code>PI = PV будущих потоков / Начальные инвестиции<\/code><br><span class=\"fx\">где: PV — приведённая стоимость потоков. PI>1 значит проект выгоден. Нужен при ограниченном бюджете<\/span>", "u": "finance.html#learn/glossariy/PI", "g": "finance.html#learn/glossariy/PI"}, {"t": "PIK", "f": "Payment-in-Kind", "d": "Проценты, которые не выплачивают, а прибавляют к сумме долга. Сейчас платить легче, но долг растёт: на следующий год проценты начислят уже на большую сумму", "x": "", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/PIK", "ut": "LBO пошагово: paper LBO и модель", "hq": "PIK", "hs": "Шаг 2. Структура долга"}, {"t": "PMI", "f": "Purchasing Managers' Index", "d": "Опрос менеджеров по закупкам. Выше 50 — деловая активность растёт, ниже — падает.", "x": "", "u": "finance.html#learn/glossariy/PMI", "g": "finance.html#learn/glossariy/PMI"}, {"t": "PP&E", "f": "Основные средства (PP&E — Property, Plant & Equipment)", "d": "Здания, станки, оборудование, транспорт: всё, что служит больше года и не продаётся.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/PP%26E", "ut": "Модель трёх отчётов шаг за шагом", "hq": "PP&E", "hs": "Шаг 6. CAPEX и амортизация (PP&E schedule)"}, {"t": "PPA", "f": "Power Purchase Agreement", "d": "Долгосрочный договор на покупку электроэнергии по фиксированной цене. Гарантирует выручку проекту.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/PPA", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "PPA", "hs": "Консолидация, гудвилл и распределение цены покупки (PPA)"}, {"t": "Pre-IPO", "f": "IPO — Initial Public Offering", "d": "Покупка акций частной компании незадолго до выхода на биржу, обычно со скидкой и с риском, что IPO не будет.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Pre-IPO", "ut": "Венчур и стартапы", "hq": "Pre-IPO", "hs": "Стадии и кто инвестирует"}, {"t": "Pre-money / Post-money", "f": "Оценка до / после вложения", "d": "Оценка компании до вложения инвестора и после. После = До + Сумма инвестиции.", "x": "<code>Post-money = Pre-money + Инвестиция<\/code><br><span class=\"fx\">где: Доля инвестора = Инвестиция / Post-money.<\/span>", "u": "finance.html#learn/glossariy/Pre-money%20%2F%20Post-money", "g": "finance.html#learn/glossariy/Pre-money%20%2F%20Post-money"}, {"t": "Pre-pack", "f": "Заранее согласованное банкротство", "d": "План реструктуризации согласован с кредиторами до подачи в суд, процедура проходит быстро.", "x": "", "u": "finance.html#learn/glossariy/Pre-pack", "g": "finance.html#learn/glossariy/Pre-pack"}, {"t": "Precedent transactions", "f": "Сделки-аналоги", "d": "Сделки-аналоги: мультипликаторы, по которым прошли прошлые сделки M&A. Как узнать цену квартиры по тому, за сколько недавно продали похожие в этом доме", "x": "<code>Цена = Метрика цели × Мультипликатор прошлых сделок<\/code><br><span class=\"fx\">где: Похоже на Comps, но мультипликаторы взяты из реальных сделок M&A (включают премию за контроль)<\/span>", "u": "finance.html#learn/comps", "g": "finance.html#learn/glossariy/Precedent%20transactions", "ut": "Comps и прецеденты пошагово", "hq": "Precedent transactions", "hs": "Прецеденты (precedent transactions)"}, {"t": "Preferred return", "f": "Приоритетная доходность", "d": "Минимальная доходность, которую фонд должен принести инвесторам, прежде чем управляющий возьмёт свой carry.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Preferred%20return", "ut": "Альтернативные инвестиции", "hq": "Preferred return", "hs": "Private equity и private debt"}, {"t": "Preferred stock", "f": "Привилегированные акции", "d": "Акции, по которым дивиденд обычно фиксирован и платится раньше, чем по обычным, но права голоса, как правило, нет.", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Preferred%20stock", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Привилегированные акции", "hs": "Виды долга по старшинству"}, {"t": "Premium (страхование)", "f": "Страховая премия", "d": "Деньги, которые клиент платит за страховку.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Premium%20%28%D1%81%D1%82%D1%80%D0%B0%D1%85%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%29", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Premium", "hs": "Непокрытый паритет (UIP) — гипотеза об ожиданиях"}, {"t": "Present value (PV)", "f": "Приведённая стоимость", "d": "Сколько будущая сумма стоит сегодня, если её «уценить» по ставке.", "x": "<code>PV = FV / (1 + r)^n<\/code><br><span class=\"fx\">где: FV — будущая сумма. r — ставка за период. n — число периодов.<\/span>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Present%20value%20%28PV%29", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Приведённая стоимость", "hs": "NPV — чистая приведённая стоимость"}, {"t": "Pricing power", "f": "Ценовая власть", "d": "Способность поднимать цены без потери клиентов.", "x": "", "u": "finance.html#learn/mikroekonomika-rynki", "g": "finance.html#learn/glossariy/Pricing%20power", "ut": "Микроэкономика для финансиста (по программе CFA Level 1 Economics)", "hq": "Ценовая власть", "hs": "Ценовая власть и рвы (moat)"}, {"t": "Primary / Secondary market", "f": "Первичный / вторичный рынок", "d": "На первичном бумаги продаёт сам эмитент (деньги идут компании). На вторичном инвесторы продают их друг другу.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Primary%20%2F%20Secondary%20market", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Первичный", "hs": "Первичный и вторичный рынок"}, {"t": "Private banking", "f": "Частное банковское обслуживание", "d": "Банковское обслуживание состоятельных клиентов с персональным менеджером.", "x": "", "u": "finance.html#learn/glossariy/Private%20banking", "g": "finance.html#learn/glossariy/Private%20banking"}, {"t": "Pro forma", "f": "Проформа", "d": "Отчётность «как если бы»: как выглядела бы компания после сделки или события.", "x": "", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy/Pro%20forma", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "Pro forma", "hs": "Из чего складывается pro forma EPS"}, {"t": "Prospect theory", "f": "Теория перспектив", "d": "Модель Канемана и Тверски: люди оценивают выигрыши и потери относительно точки отсчёта и боятся потерь сильнее.", "x": "", "u": "finance.html#learn/povedencheskie-esg", "g": "finance.html#learn/glossariy/Prospect%20theory", "ut": "Поведенческие финансы и ESG", "hq": "Теория перспектив", "hs": "Теория перспектив"}, {"t": "Prospectus", "f": "Проспект эмиссии", "d": "Документ с описанием компании и рисков, который выдают инвесторам перед размещением.", "x": "", "u": "finance.html#learn/glossariy/Prospectus", "g": "finance.html#learn/glossariy/Prospectus"}, {"t": "Provision", "f": "Резерв (оценочное обязательство)", "d": "Расход, который компания записывает заранее, потому что почти уверена, что заплатит: например, по судебному иску.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Provision", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Резерв", "hs": "Резервные валюты"}, {"t": "Purchasing power parity", "f": "Паритет покупательной способности", "d": "Идея, что одна и та же корзина должна стоить одинаково в разных странах по обменному курсу. Если не стоит, валюта недо- или переоценена.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Purchasing%20power%20parity", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Паритет покупательной способности", "hs": "Паритет покупательной способности (ППС)"}, {"t": "Put / Call option (доли)", "f": "Опцион на долю", "d": "Право продать (пут) или купить (колл) долю партнёра по заранее оговорённой цене при наступлении условий.", "x": "", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy/Put%20%2F%20Call%20option%20%28%D0%B4%D0%BE%D0%BB%D0%B8%29", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "доли", "hs": "Обмен акциями: exchange ratio, доли и contribution"}, {"t": "Put option", "f": "Опцион пут", "d": "Право, но не обязанность продать актив по цене страйк. Выигрыш при падении цены, поэтому его используют как страховку.", "x": "<code>Выплата = max(K − S; 0)<\/code>", "u": "finance.html#learn/glossariy/Put%20option", "g": "finance.html#learn/glossariy/Put%20option"}, {"t": "QE / QT", "f": "Количественное смягчение / ужесточение (QE — Quantitative Easing; QT — Quantitative Tightening)", "d": "QE — центробанк печатает деньги и покупает бумаги, чтобы снизить ставки. QT — наоборот, сокращает баланс.", "x": "", "u": "finance.html#learn/glossariy/QE%20%2F%20QT", "g": "finance.html#learn/glossariy/QE%20%2F%20QT"}, {"t": "Quality of earnings", "f": "Качество прибыли", "d": "Насколько прибыль подкреплена деньгами и повторяема. Высокое качество: прибыль похожа на операционный денежный поток.", "x": "", "u": "finance.html#learn/analiz-otchetnosti", "g": "finance.html#learn/glossariy/Quality%20of%20earnings", "ut": "Анализ отчётности: качество прибыли и красные флаги", "hq": "Качество прибыли", "hs": "Анализ отчётности: качество прибыли и красные флаги"}, {"t": "Quick ratio", "f": "Коэффициент быстрой ликвидности", "d": "То же, но без запасов: их не всегда быстро продать.", "x": "<code>Quick ratio = (Оборотные активы − Запасы) / Краткосрочные обязательства<\/code>", "u": "finance.html#learn/glossariy/Quick%20ratio", "g": "finance.html#learn/glossariy/Quick%20ratio"}, {"t": "R&D capitalization", "f": "Капитализация НИОКР (R&D — Research & Development)", "d": "Расходы на разработку признают активом, если продукт точно будет. Исследования всегда идут в расходы.", "x": "", "u": "finance.html#learn/glossariy/R%26D%20capitalization", "g": "finance.html#learn/glossariy/R%26D%20capitalization"}, {"t": "RAB", "f": "Regulatory Asset Base", "d": "Регулируемая база активов: стоимость имущества (сетей, инфраструктуры), от которой государство считает допустимую прибыль. Например, у электросетей тариф устанавливает государство, чтобы владелец получал разумную доходность от стоимости сетей", "x": "<code>Выручка = RAB × Норма доходности + Амортизация + Расходы<\/code><br><span class=\"fx\">где: RAB — регулируемая база активов. Регулятор разрешает получать доход на эту базу<\/span>", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/RAB", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "RAB", "hs": "Электроэнергетика"}, {"t": "RAB-регулирование", "f": "RAB — Regulatory Asset Base", "d": "Тариф считают так, чтобы инвестор получал доходность на вложенный капитал. Применяется в сетях.", "x": "", "u": "finance.html#learn/glossariy/RAB-%D1%80%D0%B5%D0%B3%D1%83%D0%BB%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5", "g": "finance.html#learn/glossariy/RAB-%D1%80%D0%B5%D0%B3%D1%83%D0%BB%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5"}, {"t": "Ramp-up", "f": "Выход на плановую мощность", "d": "Новый магазин, завод или проект не сразу даёт зрелую выручку. В первый год это, например, 60% от выручки уже работающего магазина, дальше доля растёт. Без учёта ramp-up прогноз завышает выручку от новых открытий.", "x": "<code>Выручка нового магазина = Выручка зрелого × Коэффициент ramp-up<\/code><br><span class=\"fx\">где: Коэффициент ramp-up — доля от зрелого уровня в данный год жизни магазина<\/span>", "u": "finance.html#learn/glossariy/Ramp-up", "g": "finance.html#learn/glossariy/Ramp-up"}, {"t": "Random walk", "f": "Случайное блуждание", "d": "Идея, что движения цен непредсказуемы: завтрашнее изменение не зависит от вчерашнего.", "x": "", "u": "finance.html#learn/glossariy/Random%20walk", "g": "finance.html#learn/glossariy/Random%20walk"}, {"t": "RAROC", "f": "Risk-Adjusted Return on Capital", "d": "Прибыль банка к капиталу, выделенному под риск. Показывает, выгоден ли клиент с учётом риска.", "x": "", "u": "finance.html#learn/metody", "g": "finance.html#learn/glossariy/RAROC", "ut": "Другие методы оценки", "hq": "RAROC", "hs": "EVA (Economic Value Added, экономическая добавленная стоимость)"}, {"t": "Real options", "f": "Реальные опционы", "d": "Идея, что у менеджмента есть право выбрать: расширить, отложить или закрыть проект. Это право имеет цену, которую обычный DCF не видит.", "x": "", "u": "finance.html#learn/metody", "g": "finance.html#learn/glossariy/Real%20options", "ut": "Другие методы оценки", "hq": "Реальные опционы", "hs": "Реальные опционы"}, {"t": "Real vs nominal", "f": "Реальный и номинальный", "d": "Номинальное значение считают в текущих деньгах. Реальное очищают от инфляции.", "x": "<code>Реальная ставка ≈ Номинальная − Инфляция<\/code>", "u": "finance.html#learn/glossariy/Real%20vs%20nominal", "g": "finance.html#learn/glossariy/Real%20vs%20nominal"}, {"t": "Receivables turnover", "f": "Оборачиваемость дебиторки", "d": "Сколько раз за год компания собирает свою дебиторку.", "x": "<code>Receivables turnover = Выручка / Средняя дебиторка<\/code>", "u": "finance.html#learn/glossariy/Receivables%20turnover", "g": "finance.html#learn/glossariy/Receivables%20turnover"}, {"t": "Recession", "f": "Рецессия", "d": "Спад экономики, обычно два квартала подряд падения ВВП.", "x": "", "u": "finance.html#learn/glossariy/Recession", "g": "finance.html#learn/glossariy/Recession"}, {"t": "Recovery rate", "f": "Доля возврата долга", "d": "Доля номинала долга, которую кредитор вернёт при дефолте. Если из долга 100 вернули 40, recovery rate равен 40%", "x": "<code>Recovery = Возврат при дефолте / Номинал долга<\/code><br><span class=\"fx\">где: Доля долга, которую удалось вернуть<\/span>", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Recovery%20rate", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "Recovery rate", "hs": "Очерёдность расчётов"}, {"t": "Reinsurance", "f": "Перестрахование", "d": "Страховая передаёт часть риска другой страховой. Страховка для страховщика.", "x": "", "u": "finance.html#learn/glossariy/Reinsurance", "g": "finance.html#learn/glossariy/Reinsurance"}, {"t": "REIT", "f": "Real Estate Investment Trust", "d": "Компания, владеющая недвижимостью и обязанная раздавать большую часть дохода. Покупаешь акцию вместо квартиры.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/REIT", "ut": "Альтернативные инвестиции", "hq": "REIT", "hs": "Недвижимость и REIT"}, {"t": "Related party", "f": "Связанная сторона", "d": "Акционеры, менеджмент, их компании. Сделки с ними раскрывают отдельно, потому что они могут быть не по рынку.", "x": "", "u": "finance.html#learn/glossariy/Related%20party", "g": "finance.html#learn/glossariy/Related%20party"}, {"t": "Related-party lending", "f": "Кредитование связанных сторон", "d": "Банк выдаёт кредиты своим же акционерам. ЦБ ограничивает нормативом Н25 (сверить).", "x": "", "u": "finance.html#learn/glossariy/Related-party%20lending", "g": "finance.html#learn/glossariy/Related-party%20lending"}, {"t": "Relevering", "f": "Релеверинг беты (пересчёт на новую структуру капитала)", "d": "Берут бету аналогов, очищают от долга (Unlevered beta) и возвращают долг по целевому соотношению D/E (Debt / Equity, долг к капиталу) оцениваемой компании. Так бета отражает структуру капитала именно этой компании.", "x": "<code>β<sub>levered<\/sub> = β<sub>unlevered<\/sub> × (1 + (1 − t) × D/E)<\/code><br><span class=\"fx\">где: t — ставка налога, D/E — долг к собственному капиталу целевой структуры<\/span>", "u": "finance.html#learn/glossariy/Relevering", "g": "finance.html#learn/glossariy/Relevering"}, {"t": "Repo", "f": "Репо", "d": "Сделка, где продают бумаги и обязуются выкупить их обратно позже по более высокой цене. По сути краткосрочный кредит под залог.", "x": "", "u": "finance.html#learn/moex-infrastruktura", "g": "finance.html#learn/glossariy/Repo", "ut": "Российский рынок ценных бумаг: инфраструктура, участники, налоги", "hq": "Репо", "hs": "2. Московская биржа: рынки и режимы"}, {"t": "Reps & warranties", "f": "Заверения и гарантии", "d": "Утверждения продавца о компании в договоре: отчётность верна, судов нет, налоги заплачены. Если неправда, покупатель требует возмещение. В РФ — заверения об обстоятельствах, ст. 431.2 ГК (сверить).", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Reps%20%26%20warranties", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Заверения и гарантии", "hs": "SPA и защита сторон"}, {"t": "Reserve currency", "f": "Резервная валюта", "d": "Валюта, в которой центробанки держат запасы. Главные: доллар, евро, юань.", "x": "", "u": "finance.html#learn/glossariy/Reserve%20currency", "g": "finance.html#learn/glossariy/Reserve%20currency"}, {"t": "Reserves vs resources", "f": "Запасы и ресурсы", "d": "Запасы — то, что точно выгодно добыть. Ресурсы — то, что есть в земле, но пока не доказано, что добыча окупится.", "x": "", "u": "finance.html#learn/glossariy/Reserves%20vs%20resources", "g": "finance.html#learn/glossariy/Reserves%20vs%20resources"}, {"t": "Restructuring", "f": "Реструктуризация долга", "d": "Изменение условий: удлинить срок, снизить ставку, списать часть. Должник получает облегчение, кредитор надеется вернуть хоть что-то.", "x": "", "u": "finance.html#learn/ib", "g": "finance.html#learn/glossariy/Restructuring", "ut": "Инвестбанкинг: как всё устроено", "hq": "Restructuring", "hs": "Направления (продукты)"}, {"t": "Retained earnings", "f": "Нераспределённая прибыль", "d": "Прибыль, накопленная за все годы, которую не выплатили акционерам, а оставили в компании.", "x": "<code>Нераспр. прибыль (конец) = Нераспр. прибыль (начало) + Чистая прибыль − Дивиденды<\/code>", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/Retained%20earnings", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Retained earnings", "hs": "Как три отчёта связаны"}, {"t": "Retention", "f": "Удержание", "d": "Доля пользователей, которые остались через неделю, месяц, год.", "x": "", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/Retention", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "Retention", "hs": "IT и интернет"}, {"t": "Retention ratio", "f": "Коэффициент удержания", "d": "Какая часть прибыли остаётся в компании. Дополняет payout ratio до 100%.", "x": "<code>Retention = 1 − Payout<\/code>", "u": "finance.html#learn/glossariy/Retention%20ratio", "g": "finance.html#learn/glossariy/Retention%20ratio"}, {"t": "Revenue recognition", "f": "Признание выручки", "d": "Правило, когда именно продажу можно записать в выручку. По IFRS 15 это момент, когда клиент получил контроль над товаром или услугой.", "x": "", "u": "finance.html#learn/analiz-otchetnosti", "g": "finance.html#learn/glossariy/Revenue%20recognition", "ut": "Анализ отчётности: качество прибыли и красные флаги", "hq": "Признание выручки", "hs": "3. Признание выручки (МСФО 15)"}, {"t": "Reverse merger", "f": "Обратное слияние", "d": "Частная компания выходит на биржу, сливаясь с уже торгуемой «пустой» компанией. Быстрее и дешевле, чем IPO.", "x": "", "u": "finance.html#learn/glossariy/Reverse%20merger", "g": "finance.html#learn/glossariy/Reverse%20merger"}, {"t": "Reverse split", "f": "Консолидация акций", "d": "Несколько акций объединяют в одну: цена растёт, число акций падает. Стоимость компании не меняется.", "x": "", "u": "finance.html#learn/glossariy/Reverse%20split", "g": "finance.html#learn/glossariy/Reverse%20split"}, {"t": "Revolver", "f": "Револьверная кредитная линия", "d": "Кредитная линия: взял, вернул, снова взял в пределах лимита. Закрывает кассовые разрывы.", "x": "", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/Revolver", "ut": "LBO пошагово: paper LBO и модель", "hq": "Revolver", "hs": "Шаг 2. Структура долга"}, {"t": "Rf", "f": "Risk-free rate", "d": "Безрисковая ставка: доходность вложений, в которых риск практически отсутствует. Обычно это доходность государственных облигаций", "x": "<code>Rf ≈ Доходность госбумаг<\/code><br><span class=\"fx\">где: Берут доходность ОФЗ/Treasuries на срок, близкий к горизонту проекта<\/span>", "u": "finance.html#learn/glossariy/Rf", "g": "finance.html#learn/glossariy/Rf"}, {"t": "RI", "f": "Residual Income", "d": "Остаточная прибыль: ЧП − Ke × Капитал (то, что осталось после того, как акционерам заплатили «положенную» доходность). ЧП — чистая прибыль, Ke — доходность, которую ждут акционеры. Если результат положительный, компания зарабатывает больше, чем от неё требуют", "x": "<code>RI = Чистая прибыль − Ke × Балансовый капитал<\/code><br><span class=\"fx\">где: Ke — стоимость собственного капитала. Прибыль сверх требуемой акционерами доходности<\/span>", "u": "finance.html#learn/metody", "g": "finance.html#learn/glossariy/RI", "ut": "Другие методы оценки", "hq": "Residual Income", "hs": "Модель остаточной прибыли (Residual Income, RI, модель Эдвардса–Белла–Ольсона)"}, {"t": "Rights issue", "f": "Выпуск акций с правом первоочередного приобретения", "d": "Новые акции предлагают сначала текущим акционерам, чтобы их доля не размылась.", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/Rights%20issue", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "Rights issue", "hs": "SPO, ABO и другие сделки с акциями"}, {"t": "Risk appetite", "f": "Риск-аппетит", "d": "Сколько риска компания готова принять. Фиксируется советом директоров.", "x": "", "u": "finance.html#learn/glossariy/Risk%20appetite", "g": "finance.html#learn/glossariy/Risk%20appetite"}, {"t": "Risk-adjusted return", "f": "Доходность с поправкой на риск", "d": "Доходность, пересчитанная на взятый риск. Коэффициенты Шарпа, Сортино.", "x": "", "u": "finance.html#learn/glossariy/Risk-adjusted%20return", "g": "finance.html#learn/glossariy/Risk-adjusted%20return"}, {"t": "ROA", "f": "Return on Assets", "d": "Чистая прибыль / активы. Для банков нормой считается 1–3%. Показывает, сколько прибыли приносит каждый рубль имущества компании", "x": "<code>ROA = Чистая прибыль / Активы<\/code><br><span class=\"fx\">где: Эффективность использования всех активов<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/ROA", "ut": "Финансовые коэффициенты", "hq": "ROA", "hs": "Рентабельность"}, {"t": "Roadshow", "f": "Роад-шоу", "d": "Серия презентаций компании крупным инвесторам перед IPO. Здесь собирают отзывы и определяют цену.", "x": "", "u": "finance.html#learn/ipo-v-rossii", "g": "finance.html#learn/glossariy/Roadshow", "ut": "IPO и SPO в России: как выходят на биржу и что получается", "hq": "Roadshow", "hs": "Шаг 3. Pre-marketing и roadshow"}, {"t": "ROCE", "f": "Return on Capital Employed", "d": "EBIT / (активы − краткосрочные обязательства). Показывает, сколько операционной прибыли приносит весь капитал, работающий в компании", "x": "<code>ROCE = EBIT / (Активы − Краткосрочные обязательства)<\/code><br><span class=\"fx\">где: Доходность капитала, задействованного в бизнесе, до налогов<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/ROCE", "ut": "Финансовые коэффициенты", "hq": "ROCE", "hs": "Рентабельность"}, {"t": "ROE", "f": "Return on Equity", "d": "Чистая прибыль / собственный капитал. Показывает доходность денег акционеров. Вложили 100, прибыль 15: ROE равен 15%", "x": "<code>ROE = Чистая прибыль / Собственный капитал<\/code><br><span class=\"fx\">где: Сколько прибыли на рубль капитала акционеров<\/span>", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/ROE", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "ROE", "hs": "Как устроен банк"}, {"t": "ROIC", "f": "Return on Invested Capital", "d": "NOPAT / инвестированный капитал. Если ROIC > WACC, компания создаёт стоимость. Проще говоря, если бизнес зарабатывает на вложенные деньги больше, чем стоят эти деньги, он выгоден", "x": "<code>ROIC = NOPAT / (Долг + Капитал − Деньги)<\/code><br><span class=\"fx\">где: NOPAT — операционная прибыль после налога. В знаменателе — инвестированный капитал<\/span>", "u": "finance.html#learn/mikroekonomika-rynki", "g": "finance.html#learn/glossariy/ROIC", "ut": "Микроэкономика для финансиста (по программе CFA Level 1 Economics)", "hq": "ROIC", "hs": "Микроэкономика для финансиста (по программе CFA Level 1 Economics)"}, {"t": "Roll-up", "f": "Консолидация рынка", "d": "Стратегия: купить много мелких компаний одной отрасли и объединить. Выигрыш — в масштабе и в повышении оценки.", "x": "", "u": "finance.html#learn/glossariy/Roll-up", "g": "finance.html#learn/glossariy/Roll-up"}, {"t": "ROTE", "f": "Return on Tangible Equity", "d": "ROE банка на материальный капитал, без гудвила. Основная мера прибыльности банков.", "x": "<code>ROTE = Чистая прибыль / Материальный капитал<\/code>", "u": "finance.html#learn/glossariy/ROTE", "g": "finance.html#learn/glossariy/ROTE"}, {"t": "RSI", "f": "Relative Strength Index", "d": "Индикатор от 0 до 100: выше 70 бумага считается перекупленной, ниже 30 — перепроданной.", "x": "", "u": "finance.html#learn/glossariy/RSI", "g": "finance.html#learn/glossariy/RSI"}, {"t": "Rule of 40", "f": "Правило 40", "d": "Для SaaS: рост выручки в % плюс маржа в % должны быть не меньше 40.", "x": "<code>Рост % + Маржа % ≥ 40<\/code>", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Rule%20of%2040", "ut": "Венчур и стартапы", "hq": "Rule of 40", "hs": "Метрики стартапа"}, {"t": "Rule of 72", "f": "Правило 72", "d": "Быстрая оценка: за сколько лет сумма удвоится. 72 делим на ставку в процентах.", "x": "<code>Лет до удвоения ≈ 72 / r(%)<\/code>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Rule%20of%2072", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Правило 72", "hs": "Правило 72"}, {"t": "Run-rate", "f": "Годовой пересчёт текущих показателей", "d": "Годовой показатель, который получают, умножив результат последнего периода (квартал × 4). Например, квартальная выручка 25 даёт run-rate 100 в год. Это грубая оценка «если так пойдёт и дальше»", "x": "<code> y/Second%20lien", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Second lien", "hs": "Виды долга по старшинству"}, {"t": "Secondary buyout", "f": "Вторичный выкуп", "d": "Один фонд прямого инвестирования продаёт компанию другому фонду.", "x": "", "u": "finance.html#learn/glossariy/Secondary%20buyout", "g": "finance.html#learn/glossariy/Secondary%20buyout"}, {"t": "Securitization", "f": "Секьюритизация", "d": "Много однотипных кредитов собирают в пул и продают инвесторам в виде бумаг. Платежи заёмщиков идут держателям.", "x": "", "u": "finance.html#learn/glossariy/Securitization", "g": "finance.html#learn/glossariy/Securitization"}, {"t": "Security market line", "f": "Линия рынка ценных бумаг", "d": "График CAPM: чем выше бета, тем выше требуемая доходность.", "x": "", "u": "finance.html#learn/glossariy/Security%20market%20line", "g": "finance.html#learn/glossariy/Security%20market%20line"}, {"t": "Seed", "f": "Посевной раунд", "d": "Самый ранний раунд: деньги на проверку идеи и первый продукт.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Seed", "ut": "Венчур и стартапы", "hq": "Seed", "hs": "После Seed (post-money $5 млн, цена $0,4375)"}, {"t": "Segment reporting", "f": "Сегментная отчётность", "d": "Разбивка выручки и прибыли по направлениям бизнеса или регионам.", "x": "", "u": "finance.html#learn/glossariy/Segment%20reporting", "g": "finance.html#learn/glossariy/Segment%20reporting"}, {"t": "Sell-side / Buy-side", "f": "Сторона продавца / сторона покупателя", "d": "Консультирование продавца (sell-side) или покупателя (buy-side) в сделке; также так называют брокеров (sell-side) и фонды (buy-side). Sell-side продаёт услуги и идеи, buy-side покупает ценные бумаги", "x": "", "u": "finance.html#learn/glossariy/Sell-side%20%2F%20Buy-side", "g": "finance.html#learn/glossariy/Sell-side%20%2F%20Buy-side"}, {"t": "Sell-side research", "f": "Аналитика брокеров", "d": "Отчёты с рекомендациями ательно объясняют и показывают в анализе чувствительности (Sensitivity analysis).", "x": "", "u": "finance.html#learn/glossariy/Specific%20risk%20premium", "g": "finance.html#learn/glossariy/Specific%20risk%20premium"}, {"t": "Spin-off", "f": "Спин-офф", "d": "Подразделение выделяют в отдельную компанию, а акции раздают текущим акционерам бесплатно.", "x": "", "u": "finance.html#learn/glossariy/Spin-off", "g": "finance.html#learn/glossariy/Spin-off"}, {"t": "SPO", "f": "Secondary Public Offering", "d": "Повторная продажа акций компании, которая уже торгуется на бирже. Например, компания хочет собрать ещё денег и выпускает дополнительные акции", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/SPO", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "SPO", "hs": "ECM и DCM: IPO, SPO и облигации"}, {"t": "Spot", "f": "Спот", "d": "Цена и сделка «на сегодня» с быстрой поставкой, в отличие от фьючерса.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Spot", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Спот", "hs": "Цена форварда: cost of carry"}, {"t": "SPV", "f": "Special Purpose Vehicle", "d": "Отдельная компания, созданная под одну цель: проект, секьюритизацию, сделку. Изолирует риск от основной компании.", "x": "", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/SPV", "ut": "LBO пошагово: paper LBO и модель", "hq": "SPV", "hs": "Российские особенности"}, {"t": "Squeeze-out", "f": "Принудительный выкуп акций миноритариев", "d": "Принудительный выкуп оставшихся акций покупателем с долей более 95%. Мелкие владельцы обязаны продать свои акции, чтобы не оставалось «хвостика»", "x": "", "u": "finance.html#learn/sdelki-v-rossii", "g": "finance.html#learn/glossariy/Squeeze-out", "ut": "Сделки в России: M&A, оферты, регулирование и особенности оценки", "hq": "Squeeze-out", "hs": "2. Обязательное предложение и права миноритариев"}, {"t": "Stage 3 loans", "f": "Кредиты третьей стадии", "d": "Кредиты в дефолте по МСФО 9. Аналог NPL.", "x": "", "u": "finance.html#learn/glossariy/Stage%203%20loans", "g": "finance.html#learn/glossariy/Stage%203%20loans"}, {"t": "Stagflation", "f": "Стагфляция", "d": "Одновременно высокая инфляция и застой в экономике с безработицей. Центральному банку трудно действовать.", "x": "", "u": "finance.html#learn/glossariy/Stagflation", "g": "finance.html#learn/glossariy/Stagflation"}, {"t": "Stakeholder", "f": "Стейкхолдер", "d": "Все, на кого влияет компания: акционеры, сотрудники, клиенты, государство, местные жители.", "x": "", "u": "finance.html#learn/moex-infrastruktura", "g": "finance.html#learn/glossariy/Stakeholder", "ut": "Российский рынок ценных бумаг: инфраструктура, участники, налоги", "hq": "Стейкхолдер", "hs": "3. Участники рынка и их роли"}, {"t": "Standard deviation", "f": "Стандартное отклонение", "d": "Мера разброса доходностей вокруг среднего. В финансах — то же, что волатильность.", "x": "", "u": "finance.html#learn/kolichestvennye-metody", "g": "finance.html#learn/glossariy/Standard%20deviation", "ut": "Количественные методы (по программе CFA Level 1)", "hq": "Стандартное отклонение", "hs": "2. Описательная статистика"}, {"t": "Standstill", "f": "Соглашение о приостановке", "d": "Кредиторы обязуются временно не требовать долг, пока идут переговоры.", "x": "", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Standstill", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "Standstill", "hs": "Два пути: вне суда и через суд"}, {"t": "Step-up", "f": "Переоценка базы", "d": "При покупке активов налоговая стоимость поднимается до цены покупки, и амортизация увеличивается. Выгода покупателя в asset deal.", "x": "", "u": "finance.html#learn/glossariy/Step-up", "g": "finance.html#learn/glossariy/Step-up"}, {"t": "Stock split", "f": "Сплит акций", "d": "Каждую акцию дробят на несколько. Цена одной падает, но стоимость компании не меняется.", "x": "",  "Theta", "f": "Тета", "d": "Сколько стоимости опцион теряет за один день просто от течения времени.", "x": "", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/Theta", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "Тета", "hs": "IC memo: документ для инвестиционного комитета"}, {"t": "Three-statement model", "f": "Трёхзвенная модель", "d": "Финансовая модель, где P&L, баланс и денежный поток связаны формулами: изменил выручку — поменялось всё.", "x": "", "u": "finance.html#learn/glossariy/Three-statement%20model", "g": "finance.html#learn/glossariy/Three-statement%20model"}, {"t": "Tier 1 / Tier 2", "f": "Основной / дополнительный капитал банка", "d": "Уровни капитала банка. Tier 1 — самый надёжный (акции, прибыль), Tier 2 — запасной (например, субординированный долг).", "x": "", "u": "finance.html#learn/buhuchet-s-nulya", "g": "finance.html#learn/glossariy/Tier%201%20%2F%20Tier%202", "ut": "Бухучёт с нуля: от проводки до баланса", "hq": "Основной", "hs": "Что получилось в отчётах"}, {"t": "Time value", "f": "Временна́я стоимость", "d": "Часть цены опциона сверх внутренней стоимости: плата за шанс, что цена ещё выгодно сдвинется. К дате экспирации сходит к нулю.", "x": "<code>Time value = Премия − Внутренняя стоимость<\/code>", "u": "finance.html#learn/glossariy/Time%20value", "g": "finance.html#learn/glossariy/Time%20value"}, {"t": "Time value of money", "f": "Стоимость денег во времени", "d": "Рубль сегодня дороже рубля завтра: сегодняшний можно вложить и получить проценты. На этой идее стоит вся оценка.", "x": "", "u": "finance.html#learn/glossariy/Time%20value%20of%20money", "g": "finance.html#learn/glossariy/Time%20value%20of%20money"}, {"t": "Top line / Bottom line", "f": "Верхняя / нижняя строка отчёта (выручка / прибыль)", "d": "Верхняя строка P&L — выручка, нижняя — чистая прибыль.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy/Top%20line%20%2F%20Bottom%20line", "ut": "Модель трёх отчётов шаг за шагом", "hq": "прибыль)", "hs": "Как три отчёта связаны"}, {"t": "Tracking error", "f": "Ошибка слежения", "d": "Насколько сильно доходность портфеля отклоняется от бенчмарка. Для индексного фонда должна быть маленькой.", "x": "", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy/Tracking%20error", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "Tracking error", "hs": "8. Альфа и оценка управляющих"}, {"t": "Trade-off theory", "f": "Компромиссная теория", "d": "Оптимальный долг находят, сравнивая выгоду от налогового щита и расходы на возможное банкротство.", "x": "", "u": "finance.html#learn/glossariy/Trade-off%20theory", "g": "finance.html#learn/glossariy/Trade-off%20theory"}, {"t": "Tranche", "f": "Транш", "d": "Часть выпуска или кредита с разным риском и доходом. Старший транш получает деньги первым и платит меньше.", "x": "", "u": "finance.html#learn/ma-lbo", "g": "finance.html#learn/glossariy/Tranche", "ut": "M&A и LBO", "hq": "Транш", "hs": "Долговые транши"}, {"t": "Transfer of risk", "f": "Передача риска", "d": "Переложить риск на другого: застраховать, захеджировать, включить в договор.", "x": "", "u": "finance.html#learn/glossariy/Transfer%20of%20risk", "g": "finance.html#learn/glossariy/Transfer%20of%20risk"}, {"t": "Translation vs transaction exposure", "f": "Пересчётный и операционный валютный риск", "d": "Пересчётный — бумажный, от перевода отчётности дочек в валюту материнской. Операционный — реальный, по конкретным платежам.", "x": "", "u": "finance.html#learn/glossariy/Translation%20vs%20transaction%20exposure", "g": "finance.html#learn/glossariy/Translation%20vs%20transaction%20exposure"}, {"t": "Treasury stock", "f": "Выкупленные собственные акции", "d": "Акции, которые компания выкупила у рынка. В балансе они вычитаются из капитала и не получают дивидендов.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Treasury%20stock", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Treasury stock", "hs": "Варранты и опционы менеджмента"}, {"t": "Treynor ratio", "f": "Коэффициент Трейнора", "d": "Избыточная доходность на единицу рыночного риска (беты).", "x": "<code>Treynor = (Rp − Rf) / β<\/code>", "u": "finance.html#learn/glossariy/Treynor%20ratio", "g": "finance.html#learn/glossariy/Treynor%20ratio"}, {"t": "TSR", "f": "Total Shareholder Return", "d": "Полная доходность акционера: рост цены акции + дивиденды. Это всё, что владелец акции заработал: и на подорожании, и на выплатах", "x": "<code>TSR = (P<sub>кон<\/sub> − P<sub>нач<\/sub> + Дивиденды) / P<sub>нач<\/sub><\/code><br><span class=\"fx\">где: P — цена акции в конце и в начале периода. Совокупный доход акционера: рост цены плюс дивиденды<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/TSR", "ut": "Финансовые коэффициенты", "hq": "TSR", "hs": "Для акционеров"}, {"t": "TV", "f": "Terminal Value", "d": "Терминальная (постпрогнозная) стоимость: стоимость бизнеса за пределами прогнозного периода. Прогноз обычно делают на 5–10 лет, а компания живёт дальше, и эту «остальную жизнь» оценивают одной суммой", "x": "<code>TV = FCF<sub>n<\/sub> × (1+g) / (WACC − g)<\/code><br><span class=\"fx\">где: FCF<sub>n<\/sub> — поток последнего прогнозного года. g — вечный рост. WACC — ставка дисконтирования (модель Гордона)<\/span>", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy/TV", "ut": "DCF: оценка по дисконтированным потокам", "hq": "Terminal Value", "hs": "Шаги DCF"}, {"t": "Underwriter", "f": "Андеррайтер", "d": "Банк, который организует выпуск бумаг, а иногда гарантирует выкуп непроданной части.", "x": "", "u": "finance.html#learn/glossariy/Underwriter", "g": "finance.html#learn/glossariy/Underwriter"}, {"t": "Underwriting (страхование)", "f": "Андеррайтинг", "d": "Оценка риска клиента и решение, страховать его или нет и по какой цене.", "x": "", "u": "finance.html#learn/sektory", "g": "finance.html#learn/glossariy/Underwriting%20%28%D1%81%D1%82%D1%80%D0%B0%D1%85%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%29", "ut": "Какой метод к какому сектору", "hq": "страхование", "hs": "Страховые компании"}, {"t": "Unit economics", "f": "Юнит-экономика", "d": "Прибыльность одной единицы бизнеса: одного клиента, заказа, магазина. Если на одной единице убыток, рост только увеличивает убытки.", "x": "", "u": "finance.html#learn/glossariy/Unit%20economics", "g": "finance.html#learn/glossariy/Unit%20economics"}, {"t": "Unitranche", "f": "Юнитранш", "d": "Один кредит, объединяющий старший и мезонинный долг, с одной ставкой. Любят кредитные фонды.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Unitranche", "ut": "Альтернативные инвестиции", "hq": "Unitranche", "hs": "Private equity и private debt"}, {"t": "Unlevered beta", "f": "Бета без долга", "d": "Бета бизнеса, очищенная от влияния долга. Нужна, чтобы сравнивать компании с разным долгом.", "x": "<code>βU = βL / (1 + (1 − t) × D/E)<\/code>", "u": "finance.html#learn/glossariy/Unlevered%20beta", "g": "finance.html#learn/glossariy/Unlevered%20beta"}, {"t": "Upside", "f": "Потенциал роста", "d": "Насколько справедливая стоимость акции выше текущей цены. Отрицательный потенциал — акция по модели дороже, чем стоит.", "x": "<code>Upside = Справедливая цена / Текущая цена − 1<\/code><br><span class=\"fx\">где: Справедливая цена — результат DCF или аналогов<\/span>", "u": "finance.html#learn/chuvstvitelnost-stsenarii", "g": "finance.html#learn/glossariy/Upside", "ut": "Чувствительность, сценарии и проверка модели", "hq": "Upside", "hs": "Сценарии"}, {"t": "Useful life", "f": "Срок полезного использования, СПИ", "d": "Сколько лет актив приносит пользу и списывается через амортизацию. От СПИ зависит годовая амортизация, а значит и прибыль. В моделях берут среднее историческое значение по группе активов.", "x": "<code>Амортизация в год = Первоначальная стоимость / СПИ<\/code><br><span class=\"fx\">где: Первоначальная стоимость — цена покупки актива, СПИ — срок полезного использования в годах<\/span>", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/Useful%20life", "ut": "US GAAP и МСФО: главные различия", "hq": "СПИ", "hs": "Разработка: капитализировать или списать"}, {"t": "Value investing", "f": "Стоимостное инвестирование", "d": "Покупать недооценённые компании: цена ниже, чем должна быть по прибыли и активам. Идея Грэма и Баффетта.", "x": "", "u": "finance.html#learn/glossariy/Value%20investing", "g": "finance.html#learn/glossariy/Value%20investing"}, {"t": "VaR", "f": "Value at Risk", "d": "Потеря, которую не превысят с заданной вероятностью за период.", "x": "<code>VaR = z × σ × Стоимость<\/code> (z = 1,65 для 95%)", "u": "finance.html#learn/kolichestvennye-metody", "g": "finance.html#learn/glossariy/VaR", "ut": "Количественные методы (по программе CFA Level 1)", "hq": "VaR", "hs": "4. Нормальное распределение и z-оценка"}, {"t": "Variance", "f": "Дисперсия", "d": "Квадрат стандартного отклонения. Показывает разброс значений.", "x": "", "u": "finance.html#learn/kolichestvennye-metody", "g": "finance.html#learn/glossariy/Variance", "ut": "Количественные методы (по программе CFA Level 1)", "hq": "Дисперсия", "hs": "2. Описательная статистика"}, {"t": "VDR", "f": "Virtual Data Room", "d": "Виртуальная комната данных: закрытое онлайн-хранилище документов для due diligence. Покупатели заходят туда и изучают документы, а продавец видит, кто что открывал", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/VDR", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "VDR", "hs": "4. Второй раунд: DD и management presentation (6–10 недель)"}, {"t": "Vega", "f": "Вега", "d": "Насколько изменится цена опциона при росте волатильности на 1 п. п.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Vega", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Vega", "hs": "Греки"}, {"t": "Vendor due diligence", "f": "Проверка от продавца", "d": "Продавец сам заказывает проверку компании и отдаёт отчёт всем покупателям. Ускоряет продажу.", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Vendor%20due%20diligence", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Vendor due diligence", "hs": "1. Подготовка (4–8 недель)"}, {"t": "Venture capital", "f": "Венчурный капитал", "d": "Деньги, которые вкладывают в молодые компании с высоким риском ради большого роста. Большинство вложений не окупается, пара — окупает всё.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Venture%20capital", "ut": "Венчур и стартапы", "hq": "Venture capital", "hs": "Стадии и кто инвестирует"}, {"t": "Vesting", "f": "Вестинг", "d": "Опционы или акции сотрудник получает постепенно, а не сразу. Обычно срок 4 года и «клифф» в год: уйдёшь раньше — ничего не получишь.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Vesting", "ut": "Венчур и стартапы", "hq": "Vesting", "hs": "Другие ключевые условия term sheet"}, {"t": "VIX", "f": "Индекс волатильности (VIX — CBOE Volatility Index)", "d": "«Индекс страха»: ожидаемая рынком волатильность S&P 500 на 30 дней. Растёт при панике.", "x": "", "u": "finance.html#learn/moex-infrastruktura", "g": "finance.html#learn/glossariy/VIX", "ut": "Российский рынок ценных бумаг: инфраструктура, участники, налоги", "hq": "Индекс волатильности", "hs": "7. Индексы и показатели"}, {"t": "Volume", "f": "Объём торгов", "d": "Сколько бумаг или денег прошло через сделки за период. Рост на большом объёме надёжнее.", "x": "", "u": "finance.html#learn/ma-lbo", "g": "finance.html#learn/glossariy/Volume", "ut": "M&A и LBO", "hq": "Volume", "hs": "Цена сделки"}, {"t": "WACC", "f": "Weighted Average Cost of Capital", "d": "Средневзвешенная стоимость капитала: средняя цена всех денег компании, и заёмных, и собственных. Заёмные деньги стоят процента по кредиту, собственные — доходности, которую ждут владельцы. Их усредняют по долям", "x": "<code>WACC = E/(D+E) × Ke + D/(D+E) × Kd × (1−t)<\/code><br><span class=\"fx\">где: E — капитал, D — долг. Ke — стоимость капитала, Kd — стоимость долга, t — налог. Средняя цена всех источников финансирования<\/span>", "u": "finance.html#learn/wacc", "g": "finance.html#learn/glossariy/WACC", "ut": "Стоимость капитала: CAPM и WACC", "hq": "WACC", "hs": "Стоимость капитала: CAPM и WACC"}, {"t": "Warrant", "f": "Варрант", "d": "Право купить акции компании по зафиксированной цене в течение срока. Часто выдают вместе с облигациями.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Warrant", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Варрант", "hs": "Варранты и опционы менеджмента"}, {"t": "Waterfall", "f": "Порядок распределения денег между инвесторами", "d": "Очерёдность выплат кредиторам и акционерам, когда делят деньги или компания банкротится. «Водопад»: деньги стекают сверху вниз, и нижние получают только то, что осталось после верхних", "x": "<code>Выплата = по очереди: долг → преференции → доходы остальных<\/code><br><span class=\"fx\">где: Распределение денег по приоритету. Следующий уровень получает деньги, только когда предыдущий полностью выплачен<\/span>", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Waterfall", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "Waterfall", "hs": "Очерёдность расчётов"}, {"t": "WC peg", "f": "WC — Working Capital", "d": "Нормальный уровень оборотного капитала, от которого корректируют цену сделки. Если на момент закрытия оборотных денег меньше нормы, цену снижают, если больше — повышают", "x": "<code>Корректировка цены = NWC на закрытие − WC peg<\/code><br><span class=\"fx\">где: WC peg — согласованный уровень оборотного капитала. Недостаток снижает цену, избыток повышает<\/span>", "u": "finance.html#learn/glossariy/WC%20peg", "g": "finance.html#learn/glossariy/WC%20peg"}, {"t": "Wealth management", "f": "Управление благосостоянием", "d": "Обслуживание богатых клиентов: инвестиции, налоги, наследство, структуры владения.", "x": "", "u": "finance.html#learn/glossariy/Wealth%20management", "g": "finance.html#learn/glossariy/Wealth%20management"}, {"t": "Weighted average cost", "f": "Средневзвешенная стоимость", "d": "Способ учёта запасов: берут среднюю цену всех партий.", "x": "<code>Средняя цена = Стоимость всех партий / Количество всех партий<\/code>", "u": "finance.html#learn/glossariy/Weighted%20average%20cost", "g": "finance.html#learn/glossariy/Weighted%20average%20cost"}, {"t": "Withholding tax", "f": "Налог у источника", "d": "Налог, который удерживают при выплате за рубеж: дивиденды, проценты, роялти. Ставку снижают соглашения об избежании двойного налогообложения.", "x": "", "u": "finance.html#learn/glossariy/Withholding%20tax", "g": "finance.html#learn/glossariy/Withholding%20tax"}, {"t": "Working capital", "f": "Рабочий капитал", "d": "То же, что оборотный капитал: деньги, застрявшие в операциях. См. NWC.", "x": "", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/Working%20capital", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "Working capital", "hs": "4. Оборотный капитал (Working Capital)"}, {"t": "Working capital adjustment", "f": "Корректировка на оборотный капитал", "d": "В сделке цену меняют, если на закрытии оборотный капитал отличается от целевого.", "x": "", "u": "finance.html#learn/glossariy/Working%20capital%20adjustment", "g": "finance.html#learn/glossariy/Working%20capital%20adjustment"}, {"t": "XNPV / XIRR", "f": "XNPV — Extended Net Present Value; XIRR — Extended Internal Rate of Return", "d": "Версии NPV и IRR в Excel, которые учитывают точные даты потоков, а не равные периоды.", "x": "", "u": "finance.html#learn/glossariy/XNPV%20%2F%20XIRR", "g": "finance.html#learn/glossariy/XNPV%20%2F%20XIRR"}, {"t": "Y икам. Чем больше этих денег «заморожено», тем меньше свободных денег остаётся у компании.", "x": "", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "Оборотный капитал", "hs": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство"}, {"t": "Дебиторская задолженность", "f": "", "d": "Деньги, которые покупатели ещё не заплатили за товар, уже полученный от компании. Пример: отгрузили товар на 100 тыс. ₽ с оплатой через месяц — эти 100 тыс. ₽ пока «висят» как долг покупателя.", "x": "", "u": "finance.html#learn/teoriya-nwc", "g": "finance.html#learn/glossariy", "ut": "Оборотный капитал и оборачиваемость: теория", "hq": "Дебиторская задолженность", "hs": "2. Из чего состоит NWC"}, {"t": "Кредиторская задолженность", "f": "", "d": "Деньги, которые сама компания должна поставщикам за уже полученный товар. Это как беспроцентный кредит: пока не заплатили, можно пользоваться чужими деньгами бесплатно.", "x": "", "u": "finance.html#learn/teoriya-nwc", "g": "finance.html#learn/glossariy", "ut": "Оборотный капитал и оборачиваемость: теория", "hq": "Кредиторская задолженность", "hs": "2. Из чего состоит NWC"}, {"t": "Амортизация (D&A)", "f": "", "d": "Постепенное «списание» стоимости оборудования и других долгих покупок. Пример: станок за 1 млн, служит 10 лет — каждый год в расходы идёт 100 тыс. ₽, хотя деньги реально потратили один раз. Из-за этого прибыль и налог меньше, а деньги в кассе остаются.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Амортизация", "hs": "Шаг 6. CAPEX и амортизация (PP&E schedule)"}, {"t": "Выручка (Revenue)", "f": "", "d": "Все деньги, которые компания заработала продажами за период, до вычета расходов (без налога НДС). Это самая первая, «верхняя» строка отчёта о прибылях и убытках.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Выручка", "hs": "Шаг 3. Выручка"}, {"t": "Себестоимость (COGS)", "f": "", "d": "Сколько стоило сделать то, что компания продала: сырьё, зарплата рабочих на производстве, электричество. Пример: продали куртку за 5 000 ₽, на её пошив ушло 3 000 ₽ — себестоимость 3 000 ₽.", "x": "", "u": "finance.html#learn/teoriya-nwc", "g": "finance.html#learn/glossariy", "ut": "Оборотный капитал и оборачиваемость: теория", "hq": "Себестоимость", "hs": "Оборотный капитал и оборачиваемость: теория"}, {"t": "Чистая прибыль (Net Income)", "f": "", "d": "Сколько остаётся у компании после вычета всех расходов, процентов по долгам и налогов. Эта прибыль принадлежит владельцам (акционерам), из неё им выплачивают дивиденды.", "x": "", "u": "finance.html#learn/model-3-otchetov", "g": "finance.html#learn/glossariy", "ut": "Модель трёх отчётов шаг за шагом", "hq": "Чистая прибыль", "hs": "Как три отчёта связаны"}, {"t": "Рыночная капитализация", "f": "", "d": "Сколько стоит вся компания на бирже: цена одной акции, умноженная на число акций. Пример: акция 100 ₽, акций 1 млн — компания стоит 100 млн ₽.", "x": "", "u": "finance.html#learn/glossariy", "g": "finance.html#learn/glossariy"}, {"t": "Дисконтирование", "f": "", "d": "Пересчёт будущих денег в сегодняшние: 100 ₽ через год стоят меньше, чем 100 ₽ сейчас, ведь сегодняшние можно вложить и заработать. Пример: при ставке 10% 110 ₽ через год равны 100 ₽ сегодня. Чем дальше срок и выше ставка, тем дешевле будущие деньги.", "x": "", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Дисконтирование", "hs": "Mid-year convention (дисконтирование середины года)"}, {"t": "Ставка дисконтирования", "f": "", "d": "Процент в год, который инвестор хочет получать за риск вложения. Чем рискованнее, тем он выше. Для всей компании это WACC (средняя цена всех денег компании), для владельцев — Ke (доходность, которую ждут акционеры).", "x": "", "u": "finance.html#learn/project-black", "g": "finance.html#learn/glossariy", "ut": "Разбор домашки: Project Black", "hq": "Ставка дисконтирования", "hs": "4. Ставка дисконтирования (WACC)"}, {"t": "Терминальная стоимость (TV)", "f": "", "d": "Оценка всего, что компания заработает после последнего года прогноза (обычно прогноз рисуют на 5–10 лет). Считают по формуле Гордона или через мультипликатор выхода (во сколько раз прибыль обычно оценивают при продаже). Часто это 60–80% всей оценки компании.", "x": "", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy", "ut": "DCF: оценка по дисконтированным потокам", "hq": "Терминальная стоимость", "hs": "Терминальная стоимость"}, {"t": "Модель Гордона", "f": "", "d": "Формула, которая оценивает бесконечный поток денег, растущий каждый год на одну и ту же долю g: первый платёж делим на (r − g), где r — требуемая доходность. Пример: платёж 10, r = 15%, g = 5% дают 10 / 0,10 = 100. Работает, только если r больше g.", "x": "", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy", "ut": "DCF: оценка по дисконтированным потокам", "hq": "Гордон", "hs": "Метод Гордона (perpetuity growth)"}, {"t": "Бета (β)", "f": "", "d": "Показывает, насколько акция «качается» вместе с рынком. Бета = 1 — движется как рынок, 1,5 — в полтора раза сильнее (и вверх, и вниз), меньше 1 — спокойнее рынка.", "x": "", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "Бета", "hs": "5. CAPM и бета"}, {"t": "Премия за риск (ERP)", "f": "", "d": "Дополнительная доходность, которую инвесторы ждут от акций сверх безопасных вложений (например, гособлигаций) — плата за риск. В США около 3,7% (Дамодаран, сентябрь 2026).", "x": "", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "ERP", "hs": "6. Премия за риск рынка (ERP)"}, {"t": "Безрисковая ставка (Rf)", "f": "", "d": "Доходность самого надёжного вложения — государственных облигаций в той же валюте и на тот же срок. В России это ОФЗ на 10 лет (около 16,6% в октябре 2026), в США — казначейские облигации на 10 лет (около 5,2%).", "x": "", "u": "finance.html#learn/glossariy", "g": "finance.html#learn/glossariy"}, {"t": "Стоимость собственного капитала (Ke)", "f": "", "d": "Сколько процентов в год хотят получать владельцы компании за риск вложения в её акции. Обычно считают по формуле CAPM: безопасная ставка + бета × премия за риск (Rf + β × ERP).", "x": "", "u": "finance.html#learn/wacc", "g": "finance.html#learn/glossariy", "ut": "Стоимость капитала: CAPM и WACC", "hq": "Стоимость собственного капитала", "hs": "CAPM: стоимость собственного капитала"}, {"t": "Стоимость долга (Kd)", "f": "", "d": "Процент, под который компания берёт в долг. В расчётах берут его после налога: Kd × (1 − t), где t — ставка налога, потому что проценты по долгу уменьшают налог. Пример: 20% при налоге 25% дают 15%.", "x": "", "u": "finance.html#learn/wacc", "g": "finance.html#learn/glossariy", "ut": "Стоимость капитала: CAPM и WACC", "hq": "Стоимость долга", "hs": "Стоимость долга"}, {"t": "Налоговый щит", "f": "", "d": "Экономия на налоге благодаря тому, что проценты по долгу вычитаются из налогооблагаемой прибыли. Пример: проценты 100 тыс. ₽, налог 25% — компания экономит 25 тыс. ₽. Поэтому долг для компании чуть дешевле, чем кажется.", "x": "", "u": "finance.html#learn/glossariy", "g": "finance.html#learn/glossariy"}, {"t": "Мультипликатор", "f": "", "d": "Во сколько раз цена компании больше её показателя: прибыли, выручки и т. д. (примеры: P/E, EV/EBITDA). Пример: компания стоит 700 млн, прибыль 100 млн — мультипликатор 7, то есть рынок платит 7 ₽ за каждый рубль прибыли.", "x": "", "u": "finance.html#learn/multiplikatory", "g": "finance.html#learn/glossariy", "ut": "Сравнительная оценка: мультипликаторы", "hq": "Мультипликатор", "hs": "Сравнительная оценка: мультипликаторы"}, {"t": "Премия за контроль", "f": "", "d": "Наценка сверх биржевой цены, которую покупатель платит, чтобы получить контроль над компанией: право решать, как ею управлять. Обычно 20–40%. Пример: акция стоит 100 ₽ — покупатель готов заплатить 130 ₽.", "x": "", "u": "finance.html#learn/comps", "g": "finance.html#learn/glossariy", "ut": "Comps и прецеденты пошагово", "hq": "Премия за контроль", "hs": "Почему прецеденты дороже comps"}, {"t": "Синергии", "f": "", "d": "Эффект «1 + 1 = 3»: после объединения двух компаний вместе они зарабатывают больше или тратят меньше, чем по отдельности. Пример: слили две бухгалтерии и сэкономили на зарплатах.", "x": "", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "Синергии", "hs": "Break-even синергий"}, {"t": "Гудвил (Goodwill)", "f": "", "d": "Сколько покупатель переплатил за компанию сверх стоимости её реального имущества (за вычетом долгов). Пример: имущество стоит 80 млн, купили за 100 млн — гудвил 20 млн (за бренд, клиентов, команду). Раз в год проверяют, не обесценился ли он.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Гудвил", "hs": "Консолидация, гудвилл и распределение цены покупки (PPA)"}, {"t": "Доли меньшинства (NCI)", "f": "", "d": "Часть дочерней компании, которая принадлежит не нам, а другим владельцам. Пример: мы владеем 80% дочки — остальные 20% это доля меньшинства. Когда считаем стоимость акций материнской компании, эту часть вычитают.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "NCI", "hs": "Покупка 70%: неконтрольная доля"}, {"t": "Доходность к погашению (YTM)", "f": "", "d": "Сколько процентов в год вы заработаете, если купите облигацию по сегодняшней цене и продержите до дня погашения (когда вам вернут номинал). Это удобный способ сравнить разные облигации между собой.", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy", "ut": "Облигации глубоко", "hq": "Доходность к погашению", "hs": "2. Цена и доходность к погашению"}, {"t": "Купон", "f": "", "d": "Регулярная выплата процентов по облигации, обычно считается от её номинала. Пример: облигация номиналом 1 000 ₽ с купоном 10% в год приносит 100 ₽ в год.", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy", "ut": "Облигации глубоко", "hq": "Купон", "hs": "1. Анатомия выпуска"}, {"t": "Номинал облигации", "f": "", "d": "Сумма, которую выпустивший облигацию вернёт владельцу в день погашения, обычно 1 000 ₽. Цену облигации на бирже указывают в процентах от номинала: цена 95% значит 950 ₽.", "x": "", "u": "finance.html#learn/glossariy", "g": "finance.html#learn/glossariy"}, {"t": "Оферта (по облигации)", "f": "", "d": "Дата, когда выпустивший облигацию обязан выкупить её по желанию владельца (или сам может погасить досрочно). Доходность часто считают именно до этой даты, потому что деньги вернутся раньше срока.", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy", "ut": "Облигации глубоко", "hq": "Оферта", "hs": "1. Анатомия выпуска"}, {"t": "Спред", "f": "", "d": "Разница между двумя ставками доходности. Кредитный спред — это разница между доходностью облигации компании и ОФЗ (гособлигаций) того же срока: надбавка за то, что компания может не вернуть долг. Пример: 18% − 15% = спред 3 п.п.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Спред", "hs": "Консолидация, гудвилл и распределение цены покупки (PPA)"}, {"t": "Ковенант", "f": "", "d": "Условие в кредитном договоре или в условиях облигации, которое компания обязана соблюдать. Пример: долг не должен превышать прибыль (EBITDA) более чем в 3 раза. Если нарушила, кредитор вправе потребовать вернуть деньги досрочно.", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Ковенант", "hs": "Ковенанты"}, {"t": "Ключевая ставка", "f": "", "d": "Главная ставка Банка России (ЦБ): под этот процент он даёт деньги банкам и принимает у них вклады. От неё зависят ставки по вкладам, кредитам и облигациям во всей стране. Сейчас 14% (с 27.07.2026).", "x": "", "u": "finance.html#learn/rossiya", "g": "finance.html#learn/glossariy", "ut": "Россия: ставки, налоги, специфика", "hq": "Ключевая ставка", "hs": "Ключевая ставка Банка России"}, {"t": "Кривая доходности", "f": "", "d": "График, который показывает, сколько процентов платят по гособлигациям на разные сроки. Обычно чем дольше срок, тем выше процент — это норма. Если короткие ставки выше длинных (инвертированная кривая), рынок ждёт, что ставки снизятся.", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy", "ut": "Облигации глубоко", "hq": "Кривая доходности", "hs": "6. Кривая доходности"}, {"t": "Дивидендная доходность", "f": "", "d": "Сколько процентов в год составляют дивиденды (выплаты владельцам) от цены акции. Пример: дивиденд 10 ₽ в год, акция стоит 100 ₽ — доходность 10%.", "x": "", "u": "finance.html#learn/glossariy", "g": "finance.html#learn/glossariy"}, {"t": "Байбэк (buyback)", "f": "", "d": "Компания покупает на бирже собственные акции. Это ещё один способ вернуть деньги владельцам, как дивиденды. Акций становится меньше, поэтому прибыль на одну акцию (EPS) растёт.", "x": "", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "buyback", "hs": "Дивиденды и buyback в России: практика"}, {"t": "Волатильность (σ)", "f": "", "d": "Насколько сильно и часто скачет цена актива. Измеряют в % за год: чем больше число, тем рискованнее актив. Пример: волатильность 30% — цена в течение года обычно отклоняется от среднего примерно на треть.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Волатильность", "hs": "Греки"}, {"t": "Ликвидность", "f": "", "d": "Насколько быстро и без потери в цене актив можно превратить в деньги. Наличные — самые ликвидные, квартиру продать сложнее. Для компании это ещё и способность вовремя платить по срочным долгам.", "x": "", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "Ликвидность", "hs": "Ликвидность: как не обанкротиться с прибылью"}, {"t": "Инфляция (π)", "f": "", "d": "Рост цен в стране: на те же деньги со временем можно купить меньше. В России в сентябре 2026 цены выросли на 6,35% за год, цель ЦБ — 4%.", "x": "", "u": "finance.html#learn/makro", "g": "finance.html#learn/glossariy", "ut": "Макроэкономика для аналитика", "hq": "Инфляция", "hs": "Инфляция"}, {"t": "Опцион", "f": "", "d": "Договор, который даёт право (но не обязывает) купить или продать актив по заранее оговорённой цене до определённой даты. Право купить — колл, право продать — пут. Пример: колл на акцию по 100 ₽ выгоден, если акция подорожает до 120 ₽.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Опцион", "hs": "Деривативы: форварды, фьючерсы, свопы, опционы"}, {"t": "Форвард / фьючерс", "f": "", "d": "Договор купить или продать что-то в будущем по цене, которую согласовали сегодня. Форвард — частная договорённость, фьючерс — такой же договор, но стандартный и торгуется на бирже.", "x": "", "u": "finance.html#learn/rynki-kapitala", "g": "finance.html#learn/glossariy
