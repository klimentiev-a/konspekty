 IRR — ставка, при которой NPV равна нулю. Подбирается итерациями<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "IRS", "f": "Interest Rate Swap", "d": "Процентный своп: стороны меняются платежами по фиксированной и плавающей ставке на одну и ту же сумму. Применяют, чтобы превратить плавающий долг в фиксированный.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "J-curve", "f": "J-кривая", "d": "Доходность фонда в первые годы отрицательна (комиссии, неокупившиеся вложения), потом растёт. График по форме похож на букву J.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Joint venture", "f": "Совместное предприятие", "d": "Две компании создают общую, делят расходы, риски и прибыль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "KYC", "f": "Know Your Customer", "d": "Процедура проверки клиента банком или брокером: кто он, откуда деньги.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "LBO", "f": "Leveraged Buyout", "d": "Покупка компании в основном на заёмные деньги. Как купить квартиру в ипотеку с маленьким первым взносом. Долг потом гасят из прибыли самой купленной компании", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "LCR", "f": "Liquidity Coverage Ratio", "d": "Хватит ли у банка ликвидных активов, чтобы пережить отток денег за 30 дней. Должен быть не ниже 100%.", "x": "<code>LCR = Ликвидные активы / Чистый отток за 30 дней<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Legal DD", "f": "Юридическая проверка", "d": "Проверка прав на акции и активы, договоров, судов, лицензий, трудовых вопросов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Leverage", "f": "", "d": "Финансовый рычаг: использование долга. Часто его измеряют как ND/EBITDA. Долг усиливает и прибыль, и убытки, как рычаг: чем длиннее, тем сильнее эффект", "x": "<code>Леверидж = Net Debt / EBITDA<\/code><br><span class=\"fx\">где: Net Debt — долг минус деньги. Показывает, за сколько лет EBITDA погасит долг<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Levered beta", "f": "Бета с учётом долга", "d": "Бета акций компании, как она есть: включает риск самого бизнеса и риск долга.", "x": "<code>βL = βU × (1 + (1 − t) × D/E)<\/code><br><span class=\"fx\">где: βU — бета без долга. t — налог. D/E — долг к капиталу.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "LGD", "f": "Loss Given Default", "d": "Доля потерь при дефолте = 1 − recovery rate. Если кредитор вернул 40% долга, потеря составила 60%", "x": "<code>LGD = 1 − Recovery rate<\/code><br><span class=\"fx\">где: Recovery rate — доля долга, которую вернули при дефолте. LGD — доля потерь<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "LIFO", "f": "Последним пришёл — первым ушёл", "d": "Способ учёта: в себестоимость идёт самая свежая партия. Разрешён в US GAAP, запрещён в МСФО.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "LIFO reserve", "f": "Резерв LIFO", "d": "Разница между запасами по FIFO и по LIFO. Нужна, чтобы пересчитать отчёт американской компании в FIFO.", "x": "<code>Запасы FIFO = Запасы LIFO + LIFO reserve<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Lifting cost", "f": "Себестоимость добычи", "d": "Сколько стоит достать баррель нефти из скважины.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Like-for-like (LFL)", "f": "Сопоставимые продажи", "d": "Рост выручки только по тем магазинам или объектам, которые работали и в прошлом году. Убирает эффект открытий.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Limit order", "f": "Лимитная заявка", "d": "Купить или продать не хуже указанной цены. Может не исполниться, если рынок не дошёл.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Liquidation preference", "f": "Приоритет при ликвидации", "d": "Право инвестора первым забрать свои деньги (иногда с кратным умножением) при продаже или закрытии компании, до основателей.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "LLCR", "f": "Loan Life Cover Ratio", "d": "NPV потоков проекта за срок кредита / остаток долга. Показывает, хватит ли денег проекта, чтобы погасить весь кредит. Если меньше 1, не хватит", "x": "<code>LLCR = NPV(CFADS за срок кредита) / Остаток долга<\/code><br><span class=\"fx\">где: CFADS — денежный поток, доступный для обслуживания долга. NPV берётся по ставке кредита<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Loan loss provision", "f": "Резерв на возможные потери по ссудам", "d": "Деньги, которые банк откладывает на случай, что часть кредитов не вернут. Уменьшает прибыль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Loan-to-deposit", "f": "Кредиты к депозитам", "d": "Сколько кредитов банк выдал на рубль вкладов. Выше 100% — банк зависит от рыночного фондирования.", "x": "<code>LDR = Кредиты / Депозиты<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Lock-up", "f": "", "d": "Запрет продавать свои акции после IPO (обычно 180 дней). Нужен, чтобы владельцы не бросились продавать сразу и не обвалили цену", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Locked box", "f": "", "d": "Способ определить цену сделки: её фиксируют по балансу на прошлую дату, и дальше цена не пересчитывается. Покупатель знает цену заранее, а продавец обещает, что до закрытия сделки деньги из компании не уйдут", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "LOI / MoU", "f": "Письмо о намерениях / меморандум", "d": "Предварительный документ с основными условиями. Обычно необязательный, кроме эксклюзивности и конфиденциальности.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Long-stop date", "f": "Крайний срок", "d": "Дата, после которой любая сторона может выйти из договора, если сделка не закрылась.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Loss aversion", "f": "Неприятие потерь", "d": "Потеря ощущается сильнее, чем такая же по размеру прибыль. Из-за этого люди держат убыточные позиции слишком долго.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Loss ratio", "f": "Коэффициент убыточности", "d": "Какую долю премий страховщик выплатил как возмещение.", "x": "<code>Loss ratio = Выплаты / Премии<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "LTM / TTM / NTM", "f": "Last / Trailing / Next Twelve Months", "d": "Последние 12 месяцев (LTM, TTM) или следующие 12 месяцев (NTM). Так считают показатели за «скользящий» год, а не за календарный", "x": "<code>LTM = Год<sub>прошлый<\/sub> + YTD<sub>тек<\/sub> − YTD<sub>прош<\/sub><\/code><br><span class=\"fx\">где: YTD — с начала года до отчётной даты. Берём прошлый год, добавляем текущий YTD и вычитаем YTD прошлого года. Получаем последние 12 месяцев<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "LTV (клиент)", "f": "Customer Lifetime Value", "d": "Сколько денег клиент принесёт за всё время, пока пользуется продуктом.", "x": "<code>LTV = Средний чек × Покупок за период × Срок жизни клиента × Маржа<\/code><br><span class=\"fx\">где: Хорошо, когда LTV / CAC больше 3.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "LTV (кредит)", "f": "Loan-to-Value", "d": "Какую долю от стоимости залога составляет кредит. Чем ниже, тем безопаснее банк.", "x": "<code>LTV = Кредит / Стоимость залога<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "M&A", "f": "Mergers & Acquisitions", "d": "Слияния и поглощения компаний. Слияние — две компании становятся одной, поглощение — одна покупает другую", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "M2", "f": "Денежная масса M2", "d": "Наличные, деньги на счетах и на срочных вкладах. Показывает, сколько денег в экономике.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MAC / MAE", "f": "Material Adverse Change / Effect", "d": "Условие, по которому покупатель может отказаться от сделки, если случится существенное негативное событие. Например, пожар на главном заводе до закрытия сделки", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MACD", "f": "", "d": "Индикатор на разнице двух скользящих средних. Показывает смену тренда.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Maintenance capex", "f": "Поддерживающие инвестиции", "d": "Деньги, которые надо тратить, чтобы бизнес просто не развалился: ремонт, замена оборудования.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Major transaction", "f": "Крупная сделка", "d": "Сделка на 25% и больше балансовых активов. Требует одобрения совета или собрания. В РФ — глава X закона об АО (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Majority shareholder", "f": "Мажоритарий", "d": "Акционер с контрольной долей. В РФ по закону об АО есть пороги прав: 1%, 2%, 10%, 25%, 30%, 50%, 75%, 95% (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Make-whole", "f": "Компенсация при досрочном погашении", "d": "Платёж, равный приведённой стоимости всех недополученных платежей по облигации.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Management fee", "f": "Комиссия за управление", "d": "Ежегодная плата фонду за управление деньгами, часто 1,5–2% от капитала. Выплачивается независимо от результата.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Mandatory offer", "f": "Обязательное предложение", "d": "Кто перешёл порог 30% голосующих акций ПАО, обязан предложить остальным выкупить их акции. В РФ — ст. 84.2 закона об АО (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Margin call", "f": "Маржин-колл", "d": "Требование брокера добавить денег на счёт, когда убытки по позиции с плечом съели обеспечение. Не добавил — позицию закроют принудительно.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Mark-to-market", "f": "Переоценка по рынку", "d": "Оценка позиции по сегодняшней рыночной цене, а не по цене покупки. Прибыль и убыток видны каждый день.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Market maker", "f": "Маркетмейкер", "d": "Участник, который постоянно выставляет и цену покупки, и цену продажи, давая рынку ликвидность. Зарабатывает на спреде.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Market manipulation", "f": "Манипулирование рынком", "d": "Искусственное движение цены: ложные заявки, сговор, распространение слухов. Запрещено.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Market order", "f": "Рыночная заявка", "d": "Купить или продать сразу по лучшей доступной цене. Исполнится, но цена может отличаться от ожидаемой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Materiality", "f": "Существенность", "d": "Порог, ниже которого ошибка или событие не меняет решения читателя отчётности. Аудитор проверяет только существенное.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Max drawdown", "f": "Максимальная просадка", "d": "Самое глубокое падение портфеля от пика до дна за период. Показывает, сколько можно потерять в плохой момент.", "x": "<code>Drawdown = (Дно − Пик) / Пик<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "MBO", "f": "Management Buyout", "d": "Выкуп компании самим менеджментом, обычно вместе с фондом и за счёт долга.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MBS", "f": "Mortgage-Backed Security", "d": "Бумага, обеспеченная пулом ипотечных кредитов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Merger arbitrage", "f": "Арбитраж слияний", "d": "Покупка акций цели по цене чуть ниже цены сделки. Заработок, если сделка закроется, убыток, если сорвётся.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Mezzanine", "f": "Мезонинное финансирование", "d": "Дорогой долг между обычным долгом и акциями. Платят выше, чем по кредитам, зато при банкротстве возвращают позже.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Mid-year convention", "f": "Допущение о середине года", "d": "Денежные потоки приходят равномерно в течение года, поэтому их дисконтируют не на конец года, а на середину. Оценка получается выше.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Minority discount", "f": "Скидка за миноритарность", "d": "Доля без контроля стоит дешевле пропорциональной доли компании, потому что владелец не может решать.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Minority shareholder", "f": "Миноритарий", "d": "Акционер с небольшой долей, без контроля. Защищён законом: право на информацию, выкуп при крупных сделках.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MIRR", "f": "Modified IRR", "d": "IRR с реалистичным допущением: промежуточные потоки реинвестируют по стоимости капитала, а не по самой IRR.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Modified duration", "f": "Модифицированная дюрация", "d": "Приблизительно на сколько процентов изменится цена облигации при изменении доходности на 1 п. п.", "x": "<code>ΔP/P ≈ −D_mod × Δy<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Modigliani–Miller", "f": "Теорема Модильяни — Миллера", "d": "В идеальном мире без налогов стоимость компании не зависит от структуры капитала. В реальности есть налоговый щит и риск банкротства, поэтому структура важна.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MoM / MOIC", "f": "Multiple of Money / Multiple on Invested Capital", "d": "Во сколько раз выросли вложенные деньги. Вложили 100, получили 250: MoM равен 2,5×", "x": "<code>MOIC = Выручка от выхода / Вложенный капитал<\/code><br><span class=\"fx\">где: Сколько раз вернулись вложения. MOIC 3x значит, что на 1 вложенный пришло 3<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Momentum", "f": "Моментум", "d": "Стратегия: покупать то, что росло недавно, продавать то, что падало. Работает до разворота.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Monetary policy", "f": "Денежно-кредитная политика", "d": "Действия центробанка по ставке и количеству денег, чтобы держать инфляцию в цели и поддерживать экономику.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Monte Carlo", "f": "Метод Монте-Карло", "d": "Тысячи прогонов модели со случайными значениями вводных. На выходе не одно число, а распределение результатов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Moving average", "f": "Скользящая средняя", "d": "Средняя цена за последние N дней. Сглаживает график, показывает тренд.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MRR", "f": "Monthly Recurring Revenue", "d": "Ежемесячная повторяющаяся выручка от подписок. Годовая версия — ARR.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Mutual fund", "f": "Паевой фонд (ПИФ)", "d": "Фонд, где деньги многих инвесторов объединены и управляются управляющей компанией. Пай можно купить и погасить по цене, зависящей от стоимости активов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "MVA", "f": "Market Value Added", "d": "Рыночная стоимость компании минус вложенный в неё капитал. Показывает, сколько стоимости компания создала сверх вложенных в неё денег", "x": "<code>MVA = Рыночная стоимость компании − Инвестированный капитал<\/code><br><span class=\"fx\">где: Сколько стоимости компания добавила сверх вложенных в неё денег<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Natural hedge", "f": "Естественный хедж", "d": "Защита от валютного риска без деривативов: выручка и расходы в одной валюте.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NAV", "f": "Net Asset Value", "d": "Стоимость чистых активов: что останется, если из имущества вычесть долги. Как стоимость квартиры за вычетом остатка ипотеки", "x": "<code>NAV = Активы − Обязательства<\/code><br><span class=\"fx\">где: Для фонда: стоимость активов по рынку минус долги. На пай: NAV / число паёв<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "NBO / BO", "f": "(Non-) Binding Offer", "d": "Предложение о покупке: необязывающее (NBO) или обязывающее (BO). Необязывающее — это «пока намерение», от него можно отказаться. Обязывающее — это уже обещание, за отказ от которого могут быть последствия", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NCI", "f": "Non-Controlling Interest", "d": "Доли меньшинства: часть дочерней компании, которая принадлежит другим владельцам, а не материнской компании. Например, материнская компания владеет 80% дочерней, а остальные 20% — это NCI", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NDA", "f": "Non-Disclosure Agreement", "d": "Соглашение о конфиденциальности: стороны обещают не раскрывать полученные сведения. Его подписывают до того, как покупатель увидит внутренние данные компании", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NDF", "f": "Non-Deliverable Forward", "d": "Форвард без поставки валюты: стороны платят только разницу курсов. Для валют с ограничениями, в том числе рубля на внешнем рынке.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Neobank", "f": "Необанк", "d": "Банк без отделений, только приложение. В России — Тинькофф (Т-Банк).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Net Debt", "f": "", "d": "Чистый долг = Долг − Денежные средства. Если у тебя долг 100 и 30 на счёте, то чистый долг равен 70: на столько ты реально должен", "x": "<code>Net Debt = Долг − Деньги и эквиваленты<\/code><br><span class=\"fx\">где: Долг — кредиты и облигации. Деньги вычитаем, потому что их можно использовать для погашения<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Net Debt / EBITDA", "f": "Чистый долг к EBITDA", "d": "За сколько лет компания расплатилась бы с долгом, если бы вся EBITDA шла на долг. Главная мера долговой нагрузки.", "x": "<code>ND/EBITDA = (Долг − Деньги) / EBITDA<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Net interest income", "f": "Чистый процентный доход", "d": "Проценты, которые банк получил по кредитам, минус проценты, которые заплатил по вкладам.", "x": "<code>NII = Процентные доходы − Процентные расходы<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Net margin", "f": "Чистая маржа", "d": "Какая доля выручки доходит до чистой прибыли.", "x": "<code>Net margin = Чистая прибыль / Выручка<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Netback", "f": "Нетбэк", "d": "Цена на рынке сбыта минус все расходы на доставку. Сколько реально остаётся производителю на заводе.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NFT", "f": "Non-Fungible Token", "d": "Уникальный токен, подтверждающий владение конкретным цифровым объектом. Не взаимозаменяем.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NIM", "f": "Net Interest Margin", "d": "Чистая процентная маржа банка: «наценка» банка на разнице между ставками по кредитам и по депозитам. Банк платит вкладчикам 8%, берёт с заёмщиков 12%, и разница в 4% — его маржа", "x": "<code>NIM = (Процентные доходы − Процентные расходы) / Активы, приносящие доход<\/code><br><span class=\"fx\">где: Чистая процентная маржа банка: сколько он зарабатывает на разнице между ставками по кредитам и депозитам<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "NOI", "f": "Net Operating Income", "d": "Чистый операционный доход объекта: аренда минус расходы на содержание, без процентов и амортизации.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Nominal rate", "f": "Номинальная ставка", "d": "Ставка без поправки на инфляцию. Реальная получается по формуле Фишера.", "x": "<code>(1 + номинальная) = (1 + реальная) × (1 + инфляция)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Non-cash items", "f": "Неденежные статьи", "d": "Расходы и доходы, которые не двигают деньги: амортизация, обесценение, переоценка, опционы сотрудникам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Non-compete", "f": "Запрет конкуренции", "d": "Продавец обязуется несколько лет не создавать конкурирующий бизнес и не переманивать сотрудников.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Non-recourse", "f": "Без регресса", "d": "Кредит, который проект гасит только за счёт своих денег. Если проект не выручил, банк не требует остальное с владельцев.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NOPAT", "f": "Net Operating Profit After Tax", "d": "Операционная прибыль после налога: EBIT × (1 − t). Здесь t — налоговая ставка. Показывает, сколько останется от прибыли основной работы после уплаты налога, если бы долга не было", "x": "<code>NOPAT = EBIT × (1 − t)<\/code><br><span class=\"fx\">где: EBIT — операционная прибыль. t — ставка налога. Прибыль после налога, но без учёта долга<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Normalization", "f": "Нормализация", "d": "Очистка показателя от разовых и нетипичных статей, чтобы видеть устойчивый уровень.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Notes to accounts", "f": "Примечания к отчётности", "d": "Самая содержательная часть отчёта: учётная политика, разбивка долга, аренда, риски, сделки со связанными сторонами.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NPL", "f": "Non-Performing Loans", "d": "Проблемные кредиты: те, по которым заёмщик перестал платить. Обычно так называют кредиты с просрочкой больше 90 дней", "x": "<code>NPL ratio = Просроченные кредиты (90+ дней) / Кредитный портфель<\/code><br><span class=\"fx\">где: Доля кредитов, по которым платежи просрочены более 90 дней<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "NPV", "f": "Net Present Value", "d": "Чистая приведённая стоимость: сегодняшняя стоимость будущих денег минус вложения. Если NPV больше нуля, проект приносит больше, чем стоит, и в него стоит вкладываться", "x": "<code>NPV = Σ CF<sub>t<\/sub> / (1+r)<sup>t<\/sup> − I<sub>0<\/sub><\/code><br><span class=\"fx\">где: CF<sub>t<\/sub> — поток года t. r — ставка дисконтирования. I<sub>0<\/sub> — начальные вложения. NPV>0 значит проект выгоден<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "NSFR", "f": "Net Stable Funding Ratio", "d": "Достаточно ли у банка устойчивых источников денег (долгие вклады, капитал) относительно долгих активов. Не ниже 100%.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "NWC", "f": "Net Working Capital", "d": "Чистый оборотный капитал: деньги, которые «застряли» в повседневной работе (запасы и долги клиентов минус долги перед поставщиками). Это деньги, которыми компания «кредитует» собственный бизнес", "x": "<code>NWC = Дебиторка + Запасы − Кредиторка<\/code><br><span class=\"fx\">где: Оборотные операционные активы минус операционные обязательства. Рост NWC «замораживает» деньги<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "NWC peg", "f": "Целевой оборотный капитал", "d": "Уровень NWC, зафиксированный в договоре сделки: отклонение на дату закрытия меняет цену.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "OAS", "f": "Option-Adjusted Spread", "d": "Спред облигации с учётом встроенных опционов (например, права досрочного погашения).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Off-balance sheet", "f": "Внебалансовые статьи", "d": "Обязательства или активы, которых нет в самом балансе, но они влияют на компанию: гарантии, часть аренды, SPV.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Offtake", "f": "Договор на закупку продукции", "d": "Покупатель обещает забирать продукцию проекта по оговорённой цене. Банки требуют его для кредита.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "OID", "f": "Original issue discount", "d": "Скидка к номиналу при выдаче долга. Добавляет доходность кредитору.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "One-off items", "f": "Разовые статьи", "d": "Расходы и доходы, которые не повторятся: продажа актива, штраф, реструктуризация.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Open banking", "f": "Открытый банкинг", "d": "Банки обязаны отдавать данные клиента по его согласию другим сервисам через API.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Operating income", "f": "Операционная прибыль", "d": "То же, что EBIT: прибыль от основной деятельности до процентов и налогов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Operating lease", "f": "Операционная аренда", "d": "Аренда, при которой актив возвращают владельцу. По старым правилам платежи шли в расходы; по IFRS 16 почти любая аренда стала долгом.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Operating leverage", "f": "Операционный рычаг", "d": "Чем больше у бизнеса постоянных расходов, тем сильнее прибыль растёт при росте выручки и тем сильнее падает при снижении.", "x": "<code>DOL = Маржинальный доход / EBIT<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Operating margin", "f": "Операционная маржа", "d": "Доля выручки, которая остаётся после всех операционных расходов, до процентов и налогов.", "x": "<code>Operating margin = EBIT / Выручка<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "OPEX", "f": "Operating Expenses", "d": "Операционные расходы: траты на повседневную работу. Зарплаты, аренда, электричество, реклама", "x": "<code>OPEX = SG&A + R&D + Прочие операционные расходы<\/code><br><span class=\"fx\">где: Текущие расходы на ведение бизнеса, без капитальных затрат<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Opportunity cost", "f": "Альтернативные издержки", "d": "Что ты теряешь, выбирая этот вариант вместо лучшего из остальных. Ставка дисконтирования — это альтернативные издержки капитала.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Option premium", "f": "Премия по опциону", "d": "Цена самого опциона: деньги, которые покупатель платит продавцу за право.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Order book", "f": "Книга заявок (стакан)", "d": "Список всех заявок на покупку и продажу с ценами и объёмами.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Organic growth", "f": "Органический рост", "d": "Рост бизнеса без покупок других компаний.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "OTC", "f": "Over-the-counter", "d": "Внебиржевой рынок: стороны договариваются напрямую, без общего стакана.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Output gap", "f": "Разрыв выпуска", "d": "Разница между фактическим ВВП и тем, что экономика может выдать без перегрева.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Overconfidence", "f": "Самоуверенность", "d": "Переоценка своих прогнозов. Ведёт к слишком частым сделкам и недостаточной диверсификации.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Oversubscription", "f": "Переподписка", "d": "Заявок на IPO больше, чем бумаг. Бумаги делят между инвесторами пропорционально.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "P/B", "f": "Price to Book", "d": "Капитализация / балансовый собственный капитал. Главный мультипликатор для банков. Показывает, во сколько раз рынок оценивает компанию дороже, чем стоят её собственные деньги по балансу", "x": "<code>P/B = Капитализация / Балансовый капитал<\/code><br><span class=\"fx\">где: Балансовый капитал — активы минус обязательства. P/B<1 значит, что рынок оценивает компанию ниже книжной стоимости<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "P/E", "f": "Price to Earnings", "d": "Капитализация / чистая прибыль (= цена / EPS). Показывает, за сколько лет прибыли окупится покупка компании. Капитализация — это цена всех акций компании на бирже. P/E равно 10: цена в десять раз больше годовой прибыли", "x": "<code>P/E = Цена акции / EPS = Капитализация / Чистая прибыль<\/code><br><span class=\"fx\">где: Сколько лет прибыли содержится в цене. EPS — прибыль на акцию<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "P/FFO", "f": "", "d": "Цена к денежному потоку от операций, мультипликатор для REIT и недвижимости.", "x": "<code>P/FFO = Капитализация / FFO<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "P/S", "f": "Price to Sales", "d": "Капитализация / выручка. Подходит для убыточных и быстрорастущих компаний. Выручка — все деньги от продаж, до вычета расходов. Прибыли у таких компаний ещё нет, поэтому сравнивают по выручке", "x": "<code>P/S = Капитализация / Выручка<\/code><br><span class=\"fx\">где: Во сколько раз цена компании больше годовой выручки<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "P2P lending", "f": "Кредитование между людьми", "d": "Платформа сводит тех, кто хочет одолжить, с теми, кто хочет занять, без банка.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Par / Premium / Discount", "f": "", "d": "Цена облигации: равна номиналу (par), выше (premium) или ниже (discount).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Payback", "f": "", "d": "Срок окупаемости: за сколько времени вложения вернутся. Потратил 100 и получаешь по 25 в год: окупишься за 4 года", "x": "<code>Payback = Инвестиции / Годовой денежный поток<\/code><br><span class=\"fx\">где: При равных потоках. Показывает, за сколько лет вложения вернутся (без учёта дисконтирования)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Payment system", "f": "Платёжная система", "d": "Инфраструктура для переводов между банками: Visa, Mastercard, Мир, СБП.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Payout ratio", "f": "Коэффициент выплат", "d": "Какую часть чистой прибыли компания отдаёт в виде дивидендов.", "x": "<code>Payout = Дивиденды / Чистая прибыль<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "PD", "f": "Probability of Default", "d": "Вероятность того, что заёмщик не вернёт долг за период.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "PE (Private Equity)", "f": "", "d": "Фонды прямых инвестиций: они покупают компании, чтобы развить их и потом продать дороже. Похоже на покупку старой квартиры, ремонт и перепродажу, но с целыми компаниями", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Pecking order", "f": "Иерархия источников", "d": "Компании сначала используют собственную прибыль, потом долг, и только в последнюю очередь выпускают акции.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "PEG", "f": "P/E to Growth", "d": "P/E, делённый на темп роста EPS. Помогает понять, не переплачиваешь ли за быстрый рост. Меньше — лучше", "x": "<code>PEG = P/E / Темп роста EPS (в %)<\/code><br><span class=\"fx\">где: P/E скорректирован на рост прибыли. Около 1 — справедливо, ниже — дёшево<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Penny stock", "f": "«Пенни-сток»", "d": "Дешёвая акция малой компании. Ликвидность низкая, цена скачет, мошенничество встречается чаще.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Perpetual bond", "f": "Вечная облигация", "d": "Облигация без срока погашения: проценты платят бесконечно.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Perpetuity", "f": "Перпетуитет (бессрочная рента)", "d": "Одинаковый платёж навсегда. Его сегодняшняя стоимость конечна.", "x": "<code>PV = C / r<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Phillips curve", "f": "Кривая Филлипса", "d": "Зависимость между безработицей и инфляцией: чем ниже безработица, тем выше инфляция.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "PI", "f": "Profitability Index", "d": "Индекс прибыльности: PV потоков / инвестиции. PV — сегодняшняя стоимость будущих денег. Если индекс больше 1, проект окупается и приносит прибыль", "x": "<code>PI = PV будущих потоков / Начальные инвестиции<\/code><br><span class=\"fx\">где: PV — приведённая стоимость потоков. PI>1 значит проект выгоден. Нужен при ограниченном бюджете<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "PIK", "f": "Payment-in-Kind", "d": "Проценты, которые не выплачивают, а прибавляют к сумме долга. Сейчас платить легче, но долг растёт: на следующий год проценты начислят уже на большую сумму", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Piotroski F-score", "f": "F-модель Пиотроски", "d": "Девять да/нет-признаков финансового здоровья: прибыль, денежный поток, долг, маржа. Чем больше баллов, тем крепче компания.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Pitchbook", "f": "", "d": "Презентация банка для клиента: идея сделки, оценка, аналоги. Так банк «продаёт» клиенту свою идею и показывает, почему сделка выгодна", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Plug", "f": "«Затычка»", "d": "Строка, которая балансирует модель: обычно деньги или револьвер. Если баланс не сходится, ищут ошибку, а не ставят плаг.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "PMI", "f": "Purchasing Managers' Index", "d": "Опрос менеджеров по закупкам. Выше 50 — деловая активность растёт, ниже — падает.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Poison pill", "f": "Shareholder rights plan", "d": "Защита цели от поглощения: если покупатель набрал акций больше порога, остальные акционеры получают право купить акции со скидкой. Доля покупателя размывается, и враждебная покупка теряет смысл. «Ядовитая таблетка»", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "PP&E", "f": "Основные средства", "d": "Здания, станки, оборудование, транспорт: всё, что служит больше года и не продаётся.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "PPA", "f": "Power Purchase Agreement", "d": "Долгосрочный договор на покупку электроэнергии по фиксированной цене. Гарантирует выручку проекту.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Pre-money / Post-money", "f": "", "d": "Оценка компании до вложения инвестора и после. После = До + Сумма инвестиции.", "x": "<code>Post-money = Pre-money + Инвестиция<\/code><br><span class=\"fx\">где: Доля инвестора = Инвестиция / Post-money.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Precedent transactions", "f": "", "d": "Сделки-аналоги: мультипликаторы, по которым прошли прошлые сделки M&A. Как узнать цену квартиры по тому, за сколько недавно продали похожие в этом доме", "x": "<code>Цена = Метрика цели × Мультипликатор прошлых сделок<\/code><br><span class=\"fx\">где: Похоже на Comps, но мультипликаторы взяты из реальных сделок M&A (включают премию за контроль)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Preferred return", "f": "Приоритетная доходность", "d": "Минимальная доходность, которую фонд должен принести инвесторам, прежде чем управляющий возьмёт свой carry.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Preferred stock", "f": "Привилегированные акции", "d": "Акции, по которым дивиденд обычно фиксирован и платится раньше, чем по обычным, но права голоса, как правило, нет.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Premium (страхование)", "f": "Страховая премия", "d": "Деньги, которые клиент платит за страховку.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Present value (PV)", "f": "Приведённая стоимость", "d": "Сколько будущая сумма стоит сегодня, если её «уценить» по ставке.", "x": "<code>PV = FV / (1 + r)^n<\/code><br><span class=\"fx\">где: FV — будущая сумма. r — ставка за период. n — число периодов.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Primary / Secondary market", "f": "Первичный / вторичный рынок", "d": "На первичном бумаги продаёт сам эмитент (деньги идут компании). На вторичном инвесторы продают их друг другу.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Pro forma", "f": "Проформа", "d": "Отчётность «как если бы»: как выглядела бы компания после сделки или события.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Prospect theory", "f": "Теория перспектив", "d": "Модель Канемана и Тверски: люди оценивают выигрыши и потери относительно точки отсчёта и боятся потерь сильнее.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Prospectus", "f": "Проспект эмиссии", "d": "Документ с описанием компании и рисков, который выдают инвесторам перед размещением.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Provision", "f": "Резерв (оценочное обязательство)", "d": "Расход, который компания записывает заранее, потому что почти уверена, что заплатит: например, по судебному иску.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Proxy fight", "f": "Борьба за голоса", "d": "Группа акционеров собирает голоса других акционеров, чтобы сменить совет директоров или отклонить сделку.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Pump and dump", "f": "«Накачка и сброс»", "d": "Разогнать цену малоликвидной бумаги слухами, продать на пике, оставить остальных с убытком.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Purchasing power parity", "f": "Паритет покупательной способности", "d": "Идея, что одна и та же корзина должна стоить одинаково в разных странах по обменному курсу. Если не стоит, валюта недо- или переоценена.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Put / Call option (доли)", "f": "Опцион на долю", "d": "Право продать (пут) или купить (колл) долю партнёра по заранее оговорённой цене при наступлении условий.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Put option", "f": "Опцион пут", "d": "Право, но не обязанность продать актив по цене страйк. Выигрыш при падении цены, поэтому его используют как страховку.", "x": "<code>Выплата = max(K − S; 0)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "QE / QT", "f": "Количественное смягчение / ужесточение", "d": "QE — центробанк печатает деньги и покупает бумаги, чтобы снизить ставки. QT — наоборот, сокращает баланс.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Quality of earnings", "f": "Качество прибыли", "d": "Насколько прибыль подкреплена деньгами и повторяема. Высокое качество: прибыль похожа на операционный денежный поток.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Quick ratio", "f": "Коэффициент быстрой ликвидности", "d": "То же, но без запасов: их не всегда быстро продать.", "x": "<code>Quick ratio = (Оборотные активы − Запасы) / Краткосрочные обязательства<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Quiet period", "f": "Период тишины", "d": "Время перед и после IPO, когда компания и банки не вправе делать оптимистичные публичные заявления.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "R&D capitalization", "f": "Капитализация НИОКР", "d": "Расходы на разработку признают активом, если продукт точно будет. Исследования всегда идут в расходы.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "RAB", "f": "Regulatory Asset Base", "d": "Регулируемая база активов: стоимость имущества (сетей, инфраструктуры), от которой государство считает допустимую прибыль. Например, у электросетей тариф устанавливает государство, чтобы владелец получал разумную доходность от стоимости сетей", "x": "<code>Выручка = RAB × Норма доходности + Амортизация + Расходы<\/code><br><span class=\"fx\">где: RAB — регулируемая база активов. Регулятор разрешает получать доход на эту базу<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Random walk", "f": "Случайное блуждание", "d": "Идея, что движения цен непредсказуемы: завтрашнее изменение не зависит от вчерашнего.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Real options", "f": "Реальные опционы", "d": "Идея, что у менеджмента есть право выбрать: расширить, отложить или закрыть проект. Это право имеет цену, которую обычный DCF не видит.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Real vs nominal", "f": "Реальный и номинальный", "d": "Номинальное значение считают в текущих деньгах. Реальное очищают от инфляции.", "x": "<code>Реальная ставка ≈ Номинальная − Инфляция<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Receivables turnover", "f": "Оборачиваемость дебиторки", "d": "Сколько раз за год компания собирает свою дебиторку.", "x": "<code>Receivables turnover = Выручка / Средняя дебиторка<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Recession", "f": "Рецессия", "d": "Спад экономики, обычно два квартала подряд падения ВВП.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Recovery rate", "f": "", "d": "Доля номинала долга, которую кредитор вернёт при дефолте. Если из долга 100 вернули 40, recovery rate равен 40%", "x": "<code>Recovery = Возврат при дефолте / Номинал долга<\/code><br><span class=\"fx\">где: Доля долга, которую удалось вернуть<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Red flag report", "f": "Отчёт о красных флагах", "d": "Короткий результат due diligence: только найденные проблемы, без описания всего бизнеса.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Reinsurance", "f": "Перестрахование", "d": "Страховая передаёт часть риска другой страховой. Страховка для страховщика.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "REIT", "f": "Real Estate Investment Trust", "d": "Компания, владеющая недвижимостью и обязанная раздавать большую часть дохода. Покупаешь акцию вместо квартиры.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Related party", "f": "Связанная сторона", "d": "Акционеры, менеджмент, их компании. Сделки с ними раскрывают отдельно, потому что они могут быть не по рынку.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Related-party lending", "f": "Кредитование связанных сторон", "d": "Банк выдаёт кредиты своим же акционерам. ЦБ ограничивает нормативом Н25 (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Repo", "f": "Репо", "d": "Сделка, где продают бумаги и обязуются выкупить их обратно позже по более высокой цене. По сути краткосрочный кредит под залог.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Reps & warranties", "f": "Заверения и гарантии", "d": "Утверждения продавца о компании в договоре: отчётность верна, судов нет, налоги заплачены. Если неправда, покупатель требует возмещение. В РФ — заверения об обстоятельствах, ст. 431.2 ГК (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Reserve currency", "f": "Резервная валюта", "d": "Валюта, в которой центробанки держат запасы. Главные: доллар, евро, юань.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Restructuring", "f": "Реструктуризация долга", "d": "Изменение условий: удлинить срок, снизить ставку, списать часть. Должник получает облегчение, кредитор надеется вернуть хоть что-то.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Retained earnings", "f": "Нераспределённая прибыль", "d": "Прибыль, накопленная за все годы, которую не выплатили акционерам, а оставили в компании.", "x": "<code>Нераспр. прибыль (конец) = Нераспр. прибыль (начало) + Чистая прибыль − Дивиденды<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Retention ratio", "f": "Коэффициент удержания", "d": "Какая часть прибыли остаётся в компании. Дополняет payout ratio до 100%.", "x": "<code>Retention = 1 − Payout<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Revenue recognition", "f": "Признание выручки", "d": "Правило, когда именно продажу можно записать в выручку. По IFRS 15 это момент, когда клиент получил контроль над товаром или услугой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Reverse merger", "f": "Обратное слияние", "d": "Частная компания выходит на биржу, сливаясь с уже торгуемой «пустой» компанией. Быстрее и дешевле, чем IPO.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Reverse split", "f": "Консолидация акций", "d": "Несколько акций объединяют в одну: цена растёт, число акций падает. Стоимость компании не меняется.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Revolver", "f": "Револьверная кредитная линия", "d": "Кредитная линия: взял, вернул, снова взял в пределах лимита. Закрывает кассовые разрывы.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Rf", "f": "Risk-free rate", "d": "Безрисковая ставка: доходность вложений, в которых риск практически отсутствует. Обычно это доходность государственных облигаций", "x": "<code>Rf ≈ Доходность госбумаг<\/code><br><span class=\"fx\">где: Берут доходность ОФЗ/Treasuries на срок, близкий к горизонту проекта<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "RI", "f": "Residual Income", "d": "Остаточная прибыль: ЧП − Ke × Капитал (то, что осталось после того, как акционерам заплатили «положенную» доходность). ЧП — чистая прибыль, Ke — доходность, которую ждут акционеры. Если результат положительный, компания зарабатывает больше, чем от неё требуют", "x": "<code>RI = Чистая прибыль − Ke × Балансовый капитал<\/code><br><span class=\"fx\">где: Ke — стоимость собственного капитала. Прибыль сверх требуемой акционерами доходности<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Rights issue", "f": "Выпуск акций с правом первоочередного приобретения", "d": "Новые акции предлагают сначала текущим акционерам, чтобы их доля не размылась.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ROA", "f": "Return on Assets", "d": "Чистая прибыль / активы. Для банков нормой считается 1–3%. Показывает, сколько прибыли приносит каждый рубль имущества компании", "x": "<code>ROA = Чистая прибыль / Активы<\/code><br><span class=\"fx\">где: Эффективность использования всех активов<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Roadshow", "f": "Роад-шоу", "d": "Серия презентаций компании крупным инвесторам перед IPO. Здесь собирают отзывы и определяют цену.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Robo-advisor", "f": "Робоэдвайзер", "d": "Сервис, который автоматически собирает портфель по анкете клиента.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ROCE", "f": "Return on Capital Employed", "d": "EBIT / (активы − краткосрочные обязательства). Показывает, сколько операционной прибыли приносит весь капитал, работающий в компании", "x": "<code>ROCE = EBIT / (Активы − Краткосрочные обязательства)<\/code><br><span class=\"fx\">где: Доходность капитала, задействованного в бизнесе, до налогов<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "ROE", "f": "Return on Equity", "d": "Чистая прибыль / собственный капитал. Показывает доходность денег акционеров. Вложили 100, прибыль 15: ROE равен 15%", "x": "<code>ROE = Чистая прибыль / Собственный капитал<\/code><br><span class=\"fx\">где: Сколько прибыли на рубль капитала акционеров<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "ROFR / ROFO", "f": "Право первого отказа / первого предложения", "d": "ROFR: прежде чем продать долю чужому, предложи её партнёрам на тех же условиях. ROFO: сначала предложи партнёрам, потом ищи чужого.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ROIC", "f": "Return on Invested Capital", "d": "NOPAT / инвестированный капитал. Если ROIC > WACC, компания создаёт стоимость. Проще говоря, если бизнес зарабатывает на вложенные деньги больше, чем стоят эти деньги, он выгоден", "x": "<code>ROIC = NOPAT / (Долг + Капитал − Деньги)<\/code><br><span class=\"fx\">где: NOPAT — операционная прибыль после налога. В знаменателе — инвестированный капитал<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Roll-up", "f": "Консолидация рынка", "d": "Стратегия: купить много мелких компаний одной отрасли и объединить. Выигрыш — в масштабе и в повышении оценки.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ROTE", "f": "Return on Tangible Equity", "d": "ROE банка на материальный капитал, без гудвила. Основная мера прибыльности банков.", "x": "<code>ROTE = Чистая прибыль / Материальный капитал<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "RSI", "f": "Relative Strength Index", "d": "Индикатор от 0 до 100: выше 70 бумага считается перекупленной, ниже 30 — перепроданной.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Rule of 72", "f": "Правило 72", "d": "Быстрая оценка: за сколько лет сумма удвоится. 72 делим на ставку в процентах.", "x": "<code>Лет до удвоения ≈ 72 / r(%)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Run-rate", "f": "", "d": "Годовой показатель, который получают, умножив результат последнего периода (квартал × 4). Например, квартальная выручка 25 даёт run-rate 100 в год. Это грубая оценка «если так пойдёт и дальше»", "x": "<code>Run-rate = Показатель за период × (12 / Месяцев в периоде)<\/code><br><span class=\"fx\">где: Например, выручка за месяц × 12 даёт годовой run-rate<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Run-rate (годовой)", "f": "Годовой темп", "d": "Показатель за последний месяц или квартал, умноженный до года. Показывает текущий масштаб, но скрывает сезонность.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Runway", "f": "Запас хода", "d": "На сколько месяцев хватит денег при текущем burn rate.", "x": "<code>Runway = Деньги на счёте / Burn<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "RUONIA", "f": "", "d": "Российская индикативная ставка овернайт. Привязывают к ней плавающие облигации и кредиты.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Russian roulette", "f": "«Русская рулетка»", "d": "Выход из тупика: один партнёр называет цену, второй обязан либо купить его долю, либо продать свою по этой цене.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "RWA", "f": "Risk-Weighted Assets", "d": "Активы банка, взвешенные на риск (чем рискованнее актив, тем больше вес). На них делят капитал при расчёте коэффициентов капитала. Кредит надёжному заёмщику «весит» меньше, чем рискованному", "x": "<code>RWA = Σ Актив<sub>i<\/sub> × Вес риска<sub>i<\/sub><\/code><br><span class=\"fx\">где: Каждый актив умножается на вес риска (например, госбумаги 0%, корпоративные кредиты 100%)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "SAFE", "f": "Simple Agreement for Future Equity", "d": "Договор, по которому инвестор отдаёт деньги сейчас, а акции получит позже, в следующем раунде, по скидке.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sanctions", "f": "Санкции", "d": "Ограничения государств на сделки с определёнными лицами, компаниями, отраслями. SDN-список США — самый жёсткий.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Say on pay", "f": "Голосование по вознаграждению", "d": "Право акционеров голосовать по зарплате топ-менеджеров.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Scenario analysis", "f": "Сценарный анализ", "d": "Расчёт модели в нескольких сценариях: базовый, оптимистичный, пессимистичный. Показывает вилку возможных результатов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Seasonality", "f": "Сезонность", "d": "Регулярные колебания внутри года: ритейл зарабатывает в декабре, сельское хозяйство — после урожая.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Second lien", "f": "Второй залог", "d": "Долг, обеспеченный тем же залогом, что и старший, но с очередью после него.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Secondary buyout", "f": "Вторичный выкуп", "d": "Один фонд прямого инвестирования продаёт компанию другому фонду.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Securitization", "f": "Секьюритизация", "d": "Много однотипных кредитов собирают в пул и продают инвесторам в виде бумаг. Платежи заёмщиков идут держателям.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Security market line", "f": "Линия рынка ценных бумаг", "d": "График CAPM: чем выше бета, тем выше требуемая доходность.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Seed", "f": "Посевной раунд", "d": "Самый ранний раунд: деньги на проверку идеи и первый продукт.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Segment reporting", "f": "Сегментная отчётность", "d": "Разбивка выручки и прибыли по направлениям бизнеса или регионам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sell-side / Buy-side", "f": "", "d": "Консультирование продавца (sell-side) или покупателя (buy-side) в сделке; также так называют брокеров (sell-side) и фонды (buy-side). Sell-side продаёт услуги и идеи, buy-side покупает ценные бумаги", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sell-side research", "f": "Аналитика брокеров", "d": "Отчёты с рекомендациями «покупать / держать / продавать» и целевой ценой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Senior debt", "f": "Старший долг", "d": "Долг, который при банкротстве возвращают первым. Самый дешёвый и самый защищённый.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sensitivity analysis", "f": "Анализ чувствительности", "d": "Таблица, где меняют одну-две вводные (например, WACC и g) и смотрят, как меняется оценка.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Series A / B / C", "f": "", "d": "Последовательные раунды: A — масштабирование уже работающей идеи, B — рост, C и дальше — выход на большой рынок или подготовка к IPO.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Settlement", "f": "Расчёты по сделке", "d": "Обмен деньгами и бумагами. T+1 означает «на следующий рабочий день после сделки».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "SG&A", "f": "Selling, General & Administrative", "d": "Коммерческие и управленческие расходы: на продажи и на содержание офиса и управления. Например, реклама, зарплата менеджеров и бухгалтеров", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Share / Stock", "f": "Акция", "d": "Ценная бумага, дающая долю в компании и право на часть прибыли (дивиденды).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Share deal vs asset deal", "f": "Сделка с акциями или с активами", "d": "Покупка акций — покупаешь компанию целиком со всеми обязательствами. Покупка активов — только выбранное, но дольше и сложнее по налогам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Shareholders' agreement", "f": "Корпоративный договор", "d": "Соглашение между акционерами: как голосуют, как продают доли, кто назначает директоров. В РФ — ст. 67.2 ГК (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sharpe ratio", "f": "Коэффициент Шарпа", "d": "Сколько избыточной доходности получено на единицу общего риска. Чем выше, тем лучше.", "x": "<code>Sharpe = (Rp − Rf) / σp<\/code><br><span class=\"fx\">где: Rp — доходность портфеля. Rf — безрисковая ставка. σp — волатильность портфеля.<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Short selling", "f": "Короткая продажа", "d": "Берут бумагу в долг, продают, а потом выкупают дешевле и возвращают. Заработок при падении цены. Убыток при росте не ограничен.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Short squeeze", "f": "Шорт-сквиз", "d": "Цена растёт, шортисты вынуждены закрываться покупкой, что толкает цену ещё выше.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Signing", "f": "Подписание", "d": "Стороны подписали договор, но сделка ещё не закрыта: ждут одобрения регулятора, согласий, финансирования.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Size premium", "f": "Премия за размер", "d": "Добавка к ставке для малых компаний: считается, что они рискованнее больших.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Slippage", "f": "Проскальзывание", "d": "Разница между ожидаемой ценой сделки и реальной, когда заявка исполняется по частям по худшим ценам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Smart contract", "f": "Смарт-контракт", "d": "Программа на блокчейне, которая сама исполняет условия, без посредника.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "SOFR", "f": "Secured Overnight Financing Rate", "d": "Американская ставка овернайт под залог гособлигаций. Заменила LIBOR в долларовых кредитах.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Solvency II", "f": "Платёжеспособность II", "d": "Европейские правила капитала для страховых. Российский аналог — нормативы ЦБ (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sortino ratio", "f": "Коэффициент Сортино", "d": "Как Шарп, но учитывает только риск падения: рост цен не считается плохим.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "SOTP", "f": "Sum of the Parts", "d": "Оценка по частям: каждую часть бизнеса оценивают отдельно и складывают. Как оценить дом, оценив отдельно каждую квартиру", "x": "<code>Стоимость = Σ (Метрика<sub>i<\/sub> × Мультипликатор<sub>i<\/sub>)<\/code><br><span class=\"fx\">где: Каждый бизнес-сегмент оценивается своим мультипликатором, результаты суммируются<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "SPA", "f": "Share Purchase Agreement", "d": "Договор купли-продажи акций. Главный документ сделки, в нём цена, условия и гарантии", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "SPAC", "f": "Special Purpose Acquisition Company", "d": "Пустая компания, которая выходит на биржу, собирает деньги и потом ищет, какую компанию купить. Её называют «компанией с чистым чеком».", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Spin-off", "f": "Спин-офф", "d": "Подразделение выделяют в отдельную компанию, а акции раздают текущим акционерам бесплатно.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "SPO", "f": "Secondary Public Offering", "d": "Повторная продажа акций компании, которая уже торгуется на бирже. Например, компания хочет собрать ещё денег и выпускает дополнительные акции", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Spot", "f": "Спот", "d": "Цена и сделка «на сегодня» с быстрой поставкой, в отличие от фьючерса.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "SPV", "f": "Special Purpose Vehicle", "d": "Отдельная компания, созданная под одну цель: проект, секьюритизацию, сделку. Изолирует риск от основной компании.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Squeeze-out", "f": "", "d": "Принудительный выкуп оставшихся акций покупателем с долей более 95%. Мелкие владельцы обязаны продать свои акции, чтобы не оставалось «хвостика»", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stage 3 loans", "f": "Кредиты третьей стадии", "d": "Кредиты в дефолте по МСФО 9. Аналог NPL.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stagflation", "f": "Стагфляция", "d": "Одновременно высокая инфляция и застой в экономике с безработицей. Центральному банку трудно действовать.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stakeholder", "f": "Стейкхолдер", "d": "Все, на кого влияет компания: акционеры, сотрудники, клиенты, государство, местные жители.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Staking", "f": "Стейкинг", "d": "Блокируешь монеты, помогаешь работе сети и получаешь вознаграждение.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Standard deviation", "f": "Стандартное отклонение", "d": "Мера разброса доходностей вокруг среднего. В финансах — то же, что волатильность.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stock split", "f": "Сплит акций", "d": "Каждую акцию дробят на несколько. Цена одной падает, но стоимость компании не меняется.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stock-based compensation", "f": "Оплата акциями", "d": "Вознаграждение сотрудникам опционами и акциями. Это расход в P&L, но не деньги, поэтому его часто добавляют обратно в EBITDA.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stop-loss", "f": "Стоп-лосс", "d": "Заявка, которая автоматически закрывает позицию, если цена дошла до заданного убытка.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Strike price", "f": "Цена исполнения (страйк)", "d": "Цена, по которой по опциону можно купить или продать актив.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Stub period", "f": "Неполный период", "d": "Остаток текущего года до даты оценки. Первый год прогноза берут только за эту часть.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Subordinated debt", "f": "Субординированный долг", "d": "Долг, который возвращают после старшего. Риск выше, ставка выше. У банков может засчитываться в капитал.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sunk cost", "f": "Невозвратные затраты", "d": "Деньги, которые уже потрачены и не вернутся. В решении о будущем их учитывать нельзя.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Support / Resistance", "f": "Поддержка / сопротивление", "d": "Уровни цены, от которых график раньше отскакивал. Трейдеры ждут отскока снова.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sustainability-linked bond", "f": "Облигация, привязанная к целям устойчивости", "d": "Купон растёт, если компания не выполнила обещанные цели по ESG.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Sustainable growth rate", "f": "Устойчивый рост", "d": "Максимальный рост, который компания может обеспечить без новых акций и без роста долговой нагрузки.", "x": "<code>g = ROE × Retention<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Swap", "f": "Своп", "d": "Договор обменяться денежными потоками. Например, платить фиксированную ставку, а получать плавающую.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Synergies", "f": "", "d": "Синергии: дополнительная стоимость, которая появляется от объединения компаний. Например, две компании сливаются и сокращают общие расходы: вместе получается выгоднее, чем по отдельности", "x": "<code>Value = PV(экономии затрат + прироста выручки) − Затраты на интеграцию<\/code><br><span class=\"fx\">где: PV — приведённая стоимость. Эффект от объединения двух компаний<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Tag-along", "f": "Право присоединения", "d": "Если крупный акционер продаёт долю, миноритарий вправе продать свою на тех же условиях.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Take rate", "f": "Комиссия платформы", "d": "Какую долю от GMV платформа оставляет себе.", "x": "<code>Take rate = Выручка платформы / GMV<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "TAM / SAM / SOM", "f": "Размеры рынка", "d": "Весь возможный рынок / часть, которую можно обслужить / часть, которую реально займёшь.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Tangible book value", "f": "Материальная балансовая стоимость", "d": "Капитал без нематериальных активов и гудвила. Сколько останется владельцам, если продать только «вещи».", "x": "<code>Tangible BV = Капитал − Гудвил − Нематер. активы<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Target price", "f": "Целевая цена", "d": "Цена, до которой, по мнению аналитика, дойдёт акция за 12 месяцев.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Tax DD", "f": "Налоговая проверка", "d": "Поиск налоговых рисков за прошлые периоды: что могут доначислить.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Taylor rule", "f": "Правило Тейлора", "d": "Формула, по которой оценивают подходящую ставку центробанка исходя из инфляции и отклонения ВВП от потенциала.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Teaser", "f": "", "d": "Короткое анонимное описание компании, которое рассылают потенциальным покупателям. Название скрыто, нужно лишь, чтобы заинтересовать. Как объявление «продаётся бизнес в сфере…» без адреса", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Technical analysis", "f": "Технический анализ", "d": "Прогноз цены по графику и объёмам, без изучения бизнеса. Академическая наука к нему скептична.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Tender offer", "f": "", "d": "Публичное предложение ко всем акционерам: продайте нам свои акции по этой цене. Как объявление «куплю у всех желающих по такой-то цене до такой-то даты»", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Term Loan A / B", "f": "TLA / TLB", "d": "Старший кредит. Кредит A амортизируется (гасится частями) и обычно выдан банками. Кредит B почти не амортизируется и выдан инвесторами. Старший значит, что его возвращают первым. Кредит B дороже, потому что основную сумму отдают в конце", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Term sheet", "f": "Условия сделки", "d": "Короткий документ с главными условиями инвестиции или покупки. Юридически обязывает только частично, но потом по нему пишут договор.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Terminal growth", "f": "Темп роста в бесконечности", "d": "Постоянный рост денежных потоков после прогноза. Берут не выше долгосрочного роста экономики и инфляции.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Theta", "f": "Тета", "d": "Сколько стоимости опцион теряет за один день просто от течения времени.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Three-statement model", "f": "Трёхзвенная модель", "d": "Финансовая модель, где P&L, баланс и денежный поток связаны формулами: изменил выручку — поменялось всё.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Tier 1 / Tier 2", "f": "", "d": "Уровни капитала банка. Tier 1 — самый надёжный (акции, прибыль), Tier 2 — запасной (например, субординированный долг).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Time value", "f": "Временна́я стоимость", "d": "Часть цены опциона сверх внутренней стоимости: плата за шанс, что цена ещё выгодно сдвинется. К дате экспирации сходит к нулю.", "x": "<code>Time value = Премия − Внутренняя стоимость<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Time value of money", "f": "Стоимость денег во времени", "d": "Рубль сегодня дороже рубля завтра: сегодняшний можно вложить и получить проценты. На этой идее стоит вся оценка.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Token", "f": "Токен", "d": "Цифровая единица на блокчейне. Может быть валютой, долей, доступом к сервису.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Top line / Bottom line", "f": "", "d": "Верхняя строка P&L — выручка, нижняя — чистая прибыль.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Tracking error", "f": "Ошибка слежения", "d": "Насколько сильно доходность портфеля отклоняется от бенчмарка. Для индексного фонда должна быть маленькой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Trade-off theory", "f": "Компромиссная теория", "d": "Оптимальный долг находят, сравнивая выгоду от налогового щита и расходы на возможное банкротство.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Tranche", "f": "Транш", "d": "Часть выпуска или кредита с разным риском и доходом. Старший транш получает деньги первым и платит меньше.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Translation vs transaction exposure", "f": "Пересчётный и операционный валютный риск", "d": "Пересчётный — бумажный, от перевода отчётности дочек в валюту материнской. Операционный — реальный, по конкретным платежам.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Treasury stock", "f": "Выкупленные собственные акции", "d": "Акции, которые компания выкупила у рынка. В балансе они вычитаются из капитала и не получают дивидендов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Treynor ratio", "f": "Коэффициент Трейнора", "d": "Избыточная доходность на единицу рыночного риска (беты).", "x": "<code>Treynor = (Rp − Rf) / β<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "TSR", "f": "Total Shareholder Return", "d": "Полная доходность акционера: рост цены акции + дивиденды. Это всё, что владелец акции заработал: и на подорожании, и на выплатах", "x": "<code>TSR = (P<sub>кон<\/sub> − P<sub>нач<\/sub> + Дивиденды) / P<sub>нач<\/sub><\/code><br><span class=\"fx\">где: P — цена акции в конце и в начале периода. Совокупный доход акционера: рост цены плюс дивиденды<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "TV", "f": "Terminal Value", "d": "Терминальная (постпрогнозная) стоимость: стоимость бизнеса за пределами прогнозного периода. Прогноз обычно делают на 5–10 лет, а компания живёт дальше, и эту «остальную жизнь» оценивают одной суммой", "x": "<code>TV = FCF<sub>n<\/sub> × (1+g) / (WACC − g)<\/code><br><span class=\"fx\">где: FCF<sub>n<\/sub> — поток последнего прогнозного года. g — вечный рост. WACC — ставка дисконтирования (модель Гордона)<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "TVL", "f": "Total Value Locked", "d": "Сколько денег лежит в DeFi-протоколе. Показывает его размер.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Underwriter", "f": "Андеррайтер", "d": "Банк, который организует выпуск бумаг, а иногда гарантирует выкуп непроданной части.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Underwriting (страхование)", "f": "Андеррайтинг", "d": "Оценка риска клиента и решение, страховать его или нет и по какой цене.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Unicorn", "f": "Единорог", "d": "Частная компания, оценённая дороже 1 млрд долларов.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Unit economics", "f": "Юнит-экономика", "d": "Прибыльность одной единицы бизнеса: одного клиента, заказа, магазина. Если на одной единице убыток, рост только увеличивает убытки.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Unitranche", "f": "Юнитранш", "d": "Один кредит, объединяющий старший и мезонинный долг, с одной ставкой. Любят кредитные фонды.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Unlevered beta", "f": "Бета без долга", "d": "Бета бизнеса, очищенная от влияния долга. Нужна, чтобы сравнивать компании с разным долгом.", "x": "<code>βU = βL / (1 + (1 − t) × D/E)<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Urals", "f": "Urals", "d": "Российская экспортная нефть. Продаётся со скидкой к Brent.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Value investing", "f": "Стоимостное инвестирование", "d": "Покупать недооценённые компании: цена ниже, чем должна быть по прибыли и активам. Идея Грэма и Баффетта.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "VaR", "f": "Value at Risk", "d": "Потеря, которую не превысят с заданной вероятностью за период.", "x": "<code>VaR = z × σ × Стоимость<\/code> (z = 1,65 для 95%)", "u": "finance.html#learn/glossariy"}, {"t": "Variance", "f": "Дисперсия", "d": "Квадрат стандартного отклонения. Показывает разброс значений.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "VDR", "f": "Virtual Data Room", "d": "Виртуальная комната данных: закрытое онлайн-хранилище документов для due diligence. Покупатели заходят туда и изучают документы, а продавец видит, кто что открывал", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Vega", "f": "Вега", "d": "Насколько изменится цена опциона при росте волатильности на 1 п. п.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Vendor due diligence", "f": "Проверка от продавца", "d": "Продавец сам заказывает проверку компании и отдаёт отчёт всем покупателям. Ускоряет продажу.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Venture capital", "f": "Венчурный капитал", "d": "Деньги, которые вкладывают в молодые компании с высоким риском ради большого роста. Большинство вложений не окупается, пара — окупает всё.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Vesting", "f": "Вестинг", "d": "Опционы или акции сотрудник получает постепенно, а не сразу. Обычно срок 4 года и «клифф» в год: уйдёшь раньше — ничего не получишь.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Vintage", "f": "Винтаж фонда", "d": "Год, когда фонд начал вкладывать. Результаты фондов одного винтажа сравнивают между собой.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "VIX", "f": "Индекс волатильности", "d": "«Индекс страха»: ожидаемая рынком волатильность S&P 500 на 30 дней. Растёт при панике.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Volume", "f": "Объём торгов", "d": "Сколько бумаг или денег прошло через сделки за период. Рост на большом объёме надёжнее.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "WACC", "f": "Weighted Average Cost of Capital", "d": "Средневзвешенная стоимость капитала: средняя цена всех денег компании, и заёмных, и собственных. Заёмные деньги стоят процента по кредиту, собственные — доходности, которую ждут владельцы. Их усредняют по долям", "x": "<code>WACC = E/(D+E) × Ke + D/(D+E) × Kd × (1−t)<\/code><br><span class=\"fx\">где: E — капитал, D — долг. Ke — стоимость капитала, Kd — стоимость долга, t — налог. Средняя цена всех источников финансирования<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Warrant", "f": "Варрант", "d": "Право купить акции компании по зафиксированной цене в течение срока. Часто выдают вместе с облигациями.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Waterfall", "f": "", "d": "Очерёдность выплат кредиторам и акционерам, когда делят деньги или компания банкротится. «Водопад»: деньги стекают сверху вниз, и нижние получают только то, что осталось после верхних", "x": "<code>Выплата = по очереди: долг → преференции → доходы остальных<\/code><br><span class=\"fx\">где: Распределение денег по приоритету. Следующий уровень получает деньги, только когда предыдущий полностью выплачен<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Waterfall chart", "f": "Каскадная диаграмма", "d": "График, где показан путь от одной величины к другой через плюсы и минусы: от EBITDA к чистой прибыли, от EV к цене акции.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "WC peg", "f": "", "d": "Нормальный уровень оборотного капитала, от которого корректируют цену сделки. Если на момент закрытия оборотных денег меньше нормы, цену снижают, если больше — повышают", "x": "<code>Корректировка цены = NWC на закрытие − WC peg<\/code><br><span class=\"fx\">где: WC peg — согласованный уровень оборотного капитала. Недостаток снижает цену, избыток повышает<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Weighted average cost", "f": "Средневзвешенная стоимость", "d": "Способ учёта запасов: берут среднюю цену всех партий.", "x": "<code>Средняя цена = Стоимость всех партий / Количество всех партий<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "White knight", "f": "«Белый рыцарь»", "d": "Дружественный покупатель, которого целевая компания находит, чтобы уйти от враждебного поглощения.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Window dressing", "f": "«Наведение лоска»", "d": "Приёмы, чтобы отчётность на дату выглядела лучше: погасить долг за день до конца года, ускорить продажи.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Working capital", "f": "Рабочий капитал", "d": "То же, что оборотный капитал: деньги, застрявшие в операциях. См. NWC.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Working capital adjustment", "f": "Корректировка на оборотный капитал", "d": "В сделке цену меняют, если на закрытии оборотный капитал отличается от целевого.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "WTI", "f": "West Texas Intermediate", "d": "Американский эталон нефти. Торгуется на бирже в Нью-Йорке.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "XNPV / XIRR", "f": "", "d": "Версии NPV и IRR в Excel, которые учитывают точные даты потоков, а не равные периоды.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Yield curve inversion", "f": "Инверсия кривой доходности", "d": "Короткие ставки выше длинных. Считается признаком будущей рецессии.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "YoY / QoQ / MoM", "f": "", "d": "Сравнение с тем же периодом год, квартал или месяц назад.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "YTM", "f": "Yield to Maturity", "d": "Доходность к погашению: сколько заработает покупатель облигации, если продержит её до конца срока. Выражается в процентах годовых", "x": "<code>P = Σ C / (1+YTM)<sup>t<\/sup> + N / (1+YTM)<sup>n<\/sup><\/code><br><span class=\"fx\">где: P — цена облигации. C — купон. N — номинал. n — срок. YTM — ставка, при которой приведённые платежи равны цене. Подбирается итерациями<\/span>", "u": "finance.html#learn/glossariy"}, {"t": "Z-spread", "f": "Z-спред", "d": "Постоянная добавка к безрисковой кривой, при которой облигация стоит как на рынке. Показывает кредитный риск.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Zero-coupon bond", "f": "Бескупонная облигация", "d": "Купонов нет: покупают дешевле номинала, а при погашении получают номинал целиком.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Антимонопольное одобрение", "f": "", "d": "Согласие ФАС на сделку, если активы или выручка сторон выше порогов (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "БПИФ", "f": "Биржевой ПИФ", "d": "ПИФ, паи которого торгуются на бирже, как ETF. Российский аналог ETF.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Валютный контроль", "f": "", "d": "Правила государства о валютных операциях: что можно переводить за рубеж, обязательна ли продажа выручки. В РФ — закон 173-ФЗ (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Голосующие акции", "f": "", "d": "Акции, дающие право голоса. Обыкновенные всегда, привилегированные обычно нет.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Делистинг", "f": "", "d": "Исключение бумаги с биржи: по решению компании или из-за нарушений.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дефолт", "f": "", "d": "Неисполнение обязательств по долгу: компания не выплатила купон или не погасила долг. Купон — регулярный процентный платёж по облигации. Проще говоря, должник не заплатил вовремя", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дивидендный аристократ", "f": "", "d": "Компания, которая много лет подряд повышает дивиденды. В США — не менее 25 лет.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дивидендный гэп", "f": "", "d": "Падение цены акции на размер дивиденда на следующий день после отсечки.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Длинные деньги", "f": "", "d": "Долгосрочные источники: пенсионные накопления, страхование жизни. Их не хватает российскому рынку.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Дюрация", "f": "Duration", "d": "Средневзвешенный срок денежных потоков облигации, мера чувствительности цены к ставке.", "x": "<code>ΔP/P ≈ −D_mod × Δy<\/code>", "u": "finance.html#learn/glossariy"}, {"t": "Замещающие облигации", "f": "", "d": "Рублёвые или валютные облигации российских компаний, выпущенные взамен еврооблигаций, чтобы платить держателям в России.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "ИИС", "f": "Индивидуальный инвестиционный счёт", "d": "Брокерский счёт с налоговыми льготами для частного инвестора (условия и типы сверять в актуальных правилах).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "КБД", "f": "Кривая бескупонной доходности", "d": "Кривая доходности ОФЗ (ЦБ, Мосбиржа): показывает, какую доходность дают госбумаги на разные сроки. Это «эталон» безрисковой ставки для каждого срока, от которого отсчитывают ставки остальных бумаг", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Квал", "f": "Квалифицированный инвестор", "d": "Особый статус, который открывает доступ к сложным инструментам. Его присваивают по критериям ЦБ (размер активов, опыт сделок, образование и др.). Считается, что такой человек лучше понимает риски", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Квалифицированный инвестор", "f": "", "d": "Инвестор, которому разрешены более рискованные продукты. Нужен достаточный капитал или опыт (условия сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Листинг", "f": "", "d": "Допуск бумаги к торгам на бирже. На Мосбирже три уровня, первый самый строгий.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Ломбардная ставка", "f": "", "d": "Ставка, по которой ЦБ даёт банкам кредит под залог ценных бумаг.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Лонг / Шорт", "f": "", "d": "Лонг — купил в ожидании роста. Шорт — продал без покрытия в ожидании падения.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Лот", "f": "", "d": "Минимальное число бумаг в одной сделке. У Сбербанка лот 10 акций (сверить).", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Маржинальная торговля", "f": "", "d": "Торговля на деньги или бумаги, взятые у брокера в долг. Усиливает и прибыль, и убыток.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "МКПАО", "f": "Международная компания публичное акционерное общество", "d": "Форма компании, переехавшей в САР.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Мосбиржа", "f": "Московская биржа", "d": "Главная российская площадка торгов акциями, облигациями, валютой и производными.", "x": "", "u": "finance.html#learn/glossariy"}, {"t": "Н1", "f": "Норматив достаточности капитала", "d": "Требование ЦБ к капиталу банков. Банк обязан держать собственных денег не меньше определённой доли от своих риско
