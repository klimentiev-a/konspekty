: "<code>ERP = Rm − Rf<\/code><br><span class=\"fx\">где: Rm — ожидаемая доходность рынка акций. Rf — безрисковая ставка. Это доплата за то, что вложились в рынок, а не в госбумаги<\/span>", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy/ERP", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "ERP", "hs": "6. Премия за риск рынка (ERP)"}, {"t": "Escrow", "f": "Эскроу", "d": "Часть цены кладут на специальный счёт у третьей стороны и отдают продавцу позже, если не всплыли проблемы.", "x": "", "u": "finance.html#learn/vrazhdebnye-sdelki", "g": "finance.html#learn/glossariy/Escrow", "ut": "Враждебные поглощения, защита и регулирование сделок", "hq": "Escrow", "hs": "Защита условий сделки (deal protections)"}, {"t": "ESG", "f": "Environmental, Social, Governance", "d": "Оценка компании по экологии, отношению к людям и качеству управления. Влияет на доступ к деньгам крупных фондов.", "x": "", "u": "finance.html#learn/povedencheskie-esg", "g": "finance.html#learn/glossariy/ESG", "ut": "Поведенческие финансы и ESG", "hq": "ESG", "hs": "Поведенческие финансы и ESG"}, {"t": "ETF", "f": "Exchange Traded Fund", "d": "Фонд, чьи паи торгуются на бирже как акции. Обычно повторяет индекс и берёт небольшую комиссию.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/ETF", "ut": "Альтернативные инвестиции", "hq": "ETF", "hs": "Сырьё и товарные фонды"}, {"t": "Eurobond", "f": "Еврооблигация", "d": "Облигация, выпущенная в иностранной валюте за пределами страны, где живёт эмитент.", "x": "", "u": "finance.html#learn/glossariy/Eurobond", "g": "finance.html#learn/glossariy/Eurobond"}, {"t": "EV", "f": "Enterprise Value", "d": "Стоимость всего бизнеса целиком: капитал + чистый долг + … Представь цену квартиры целиком: и твоя часть, и часть, которую ты ещё должен банку по ипотеке", "x": "<code>EV = Капитализация + Долг + NCI + Привилегированные − Деньги<\/code><br><span class=\"fx\">где: Капитализация — цен сходы страховщика на ведение дела к собранным премиям. Вместе с loss ratio даёт combined ratio.", "x": "", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/Expense%20ratio", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "Expense ratio", "hs": "Страховые компании"}, {"t": "Fair value", "f": "Справедливая стоимость", "d": "Цена, по которой актив можно продать в обычной сделке между участниками рынка на дату оценки.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/Fair%20value", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "Справедливая стоимость", "hs": "IFRS 9. Финансовые инструменты и ожидаемые кредитные убытки"}, {"t": "Fairness opinion", "f": "Заключение о справедливости цены", "d": "Письмо банка совету директоров: цена в сделке справедлива с финансовой точки зрения. Защита совета от претензий акционеров.", "x": "", "u": "finance.html#learn/vrazhdebnye-sdelki", "g": "finance.html#learn/glossariy/Fairness%20opinion", "ut": "Враждебные поглощения, защита и регулирование сделок", "hq": "Fairness opinion", "hs": "Где это в работе банкира"}, {"t": "Fama–French", "f": "Модель Фамы — Френча", "d": "Добавляет к CAPM ещё факторы: размер компании и «дешевизну» (value). Лучше объясняет реальную доходность акций.", "x": "", "u": "finance.html#learn/glossariy/Fama%E2%80%93French", "g": "finance.html#learn/glossariy/Fama%E2%80%93French"}, {"t": "FCF", "f": "Free Cash Flow", "d": "Свободный денежный поток: деньги, которые остаются после операционных расходов, налогов и инвестиций. Это деньги, которые можно свободно потратить: выплатить владельцам или вернуть долг. Оговорка: CFO обычно уже после уплаты процентов, поэтому такой FCF ближе к FCFE (потоку акционерам); поток до выплат кредиторам — это FCFF, см. ниже", "x": "<code>FCF = CFO − CAPEX<\/code><br><span class=\"fx\">где: CFO — денежный поток от операций. CAPEX — инвестиции в основные средства<\/span>", "u": "finance.html#learn/teoriya-nwc", "g": "finance.html#learn/glossariy/FCF", "ut": "Оборотный капитал и оборачиваемость: теория", "hq": "FCF", "hs": "6. Влияние на денежный поток: связь с FCF"}, {"t": "FCFE", "f": "Free Cash Flow to Equity", "d": "Свободный поток только акционерам (после долга). Дисконтируется по Ke. То есть это деньги, которые могут достаться владельцам, когда кредиторы уже получили своё", "x": "<code>FCFE = FCFF − Проценты × (1−t) + Новый долг − Погашение долга<\/code><br><span class=\"fx\">где: Проценты × (1−t) — проценты после налогового щита. Новый долг и погашение — чистое заимствование. Остаётся акционерам<\/span>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/FCFE", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "FCFE", "hs": "5. Свободный денежный поток (FCF)"}, {"t": "FCFF", "f": "Free Cash Flow to Firm", "d": "Свободный поток всем инвесторам (до долга), то есть и кредиторам, и акционерам: EBIT×(1−t) + D&A − CAPEX − ΔNWC. Здесь t — налоговая ставка, ΔNWC — прирост оборотного капитала. Дисконтируется по WACC", "x": "<code>FCFF = EBIT × (1−t) + D&A − CAPEX − ΔNWC<\/code><br><span class=\"fx\">где: t — ставка налога. D&A — амортизация. CAPEX — инвестиции. ΔNWC — прирост оборотного капитала. Поток, доступный и кредиторам, и акционерам<\/span>", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy/FCFF", "ut": "DCF: оценка по дисконтированным потокам", "hq": "FCFF", "hs": "Шаги DCF"}, {"t": "Fed funds rate", "f": "Ставка ФРС", "d": "Ключевая ставка США: по ней банки одалживают друг другу деньги на ночь.", "x": "", "u": "finance.html#learn/glossariy/Fed%20funds%20rate", "g": "finance.html#learn/glossariy/Fed%20funds%20rate"}, {"t": "Fee income", "f": "Комиссионный доход", "d": "Доход банка не от процентов: комиссии за переводы, карты, обслуживание.", "x": "", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/Fee%20income", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "Комиссионный доход", "hs": "Банки"}, {"t": "FFO", "f": "Funds From Operations", "d": "Денежная прибыль REIT (фонда, который владеет недвижимостью). Сюда не включают бумажное списание стоимости зданий, поэтому цифра ближе к реальным деньгам от аренды", "x": "<code>FFO = Чистая прибыль + D&A − Прибыль от продажи недвижимости<\/code><br><span class=\"fx\">где: Используется для REIT: амортизацию возвращаем, разовую прибыль от продаж убираем<\/span>", "u": "finance.html#learn/sektory", "g": "finance.html#learn/glossariy/FFO", "ut": "Какой метод к какому сектору", "hq": "FFO", "hs": "Девелопмент и REIT"}, {"t": "Fiduciary duty", "f": "Фидуциарная обязанность", "d": "Обязанность директоров действовать добросовестно и в интересах компании, а не в своих. В РФ — ст. 53.1 ГК (сверить).", "x": "", "u": "finance.html#learn/glossariy/Fiduciary%20duty", "g": "finance.html#learn/glossariy/Fiduciary%20duty"}, {"t": "FIFO", "f": "Первым пришёл — первым ушёл (FIFO — First In, First Out)", "d": "Способ учёта запасов: при продаже в себестоимость идёт самая ранняя партия. При росте цен прибыль выше, чем по LIFO.", "x": "", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/FIFO", "ut": "US GAAP и МСФО: главные различия", "hq": "FIFO", "hs": "Запасы: LIFO и FIFO"}, {"t": "Finance lease", "f": "Финансовая аренда (лизинг)", "d": "Аренда, по сути равная покупке в рассрочку: актив числится у арендатора, платежи считаются долгом.", "x": "", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/Finance%20lease", "ut": "US GAAP и МСФО: главные различия", "hq": "Финансовая аренда", "hs": "Аренда: ASC 842 против IFRS 16"}, {"t": "Financial DD", "f": "Финансовая проверка (DD — Due Diligence)", "d": "Проверка качества прибыли, долга, оборотного капитала и прогнозов перед сделкой.", "x": "", "u": "finance.html#learn/glossariy/Financial%20DD", "g": "finance.html#learn/glossariy/Financial%20DD"}, {"t": "Financial leverage", "f": "Финансовый рычаг", "d": "Использование долга. Увеличивает доходность для владельцев при хорошей работе и усиливает потери при плохой.", "x": "<code>Fin. leverage = Активы / Капитал<\/code>", "u": "finance.html#learn/glossariy/Financial%20leverage", "g": "finance.html#learn/glossariy/Financial%20leverage"}, {"t": "Fintech", "f": "Финтех", "d": "Технологические компании в финансах: платежи, кредиты онлайн, инвестиции через приложения.", "x": "", "u": "finance.html#learn/glossariy/Fintech", "g": "finance.html#learn/glossariy/Fintech"}, {"t": "Fiscal policy", "f": "Бюджетная политика", "d": "Налоги и расходы государства. Влияет на экономику через спрос.", "x": "", "u": "finance.html#learn/glossariy/Fiscal%20policy", "g": "finance.html#learn/glossariy/Fiscal%20policy"}, {"t": "Fixed charge coverage", "f": "Покрытие фиксированных платежей", "d": "Покрытие не только процентов, но и аренды и других обязательных платежей.", "x": "<code>FCCR = (EBIT + Фикс. платежи) / (Проценты + Фикс. платежи)<\/code><br><span class=\"fx\">где: Фикс. платежи — аренда и похожие обязательные платежи. В кредитных договорах LevFin считают иначе: (EBITDA − CapEx) / (проценты + обязательные погашения долга), как в главе Leveraged Finance<\/span>", "u": "finance.html#learn/glossariy/Fixed%20charge%20coverage", "g": "finance.html#learn/glossariy/Fixed%20charge%20coverage"}, {"t": "Floater", "f": "Floating Rate Note (облигация с плавающим купоном, флоатер)", "d": "Облигация, у которой купон меняется: ключевая ставка или RUONIA (Russian Overnight Index Average) плюс постоянный спред. Когда ставки растут, купон растёт, поэтому цена почти не падает. В моделях долг по флоатерам считают как «ставка ЦБ + спред».", "x": "<code>Купон = Ключевая ставка (или RUONIA) + Спред<\/code><br><span class=\"fx\">где: Спред — надбавка за риск эмитента, фиксируется при выпуске<\/span>", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy/Floater", "ut": "Облигации глубоко", "hq": "флоатер)", "hs": "10. Флоатеры: ОФЗ‑ПК и корпоративные «КС + спред»"}, {"t": "Football field", "f": "«Футбольное поле»", "d": "График на слайде, где полосами показаны диапазоны оценки по разным методам: DCF, мультипликаторы, сделки. Видно, где методы сходятся.", "x": "", "u": "finance.html#learn/comps", "g": "finance.html#learn/glossariy/Football%20field", "ut": "Comps и прецеденты пошагово", "hq": "Football field", "hs": "Football field"}, {"t": "Forward rate (FX)", "f": "Форвардный курс (FX — Foreign Exchange)", "d": "Курс для обмена в будущем, зафиксированный сегодня. Определяется разницей ставок двух валют.", "x": "<code>F = S × (1 + r_руб) / (1 + r_долл)<\/code><br><span class=\"fx\">где: S — курс сегодня.<\/span>", "u": "finance.html#learn/glossariy/Forward%20rate%20%28FX%29", "g": "finance.html#learn/glossariy/Forward%20rate%20%28FX%29"}, {"t": "Free float", "f": "Акции в свободном обращении", "d": "Какая доля акций свободно торгуется на бирже. Остальное держат крупные владельцы и не продают", "x": "<code>Free float = Акции в свободном обращении / Все акции<\/code><br><span class=\"fx\">где: Без долей стратегических держателей, государства и менеджмента<\/span>", "u": "finance.html#learn/ipo-v-rossii", "g": "finance.html#learn/glossariy/Free%20float", "ut": "IPO и SPO в России: как выходят на биржу и что получается", "hq": "Free float", "hs": "Шаг 2. Оценка и диапазон цены"}, {"t": "FRN", "f": "Floating Rate Note", "d": "Облигация с плавающим купоном: он привязан к ставке, например к ключевой или RUONIA, и растёт вместе с ней.", "x": "", "u": "finance.html#learn/glossariy/FRN", "g": "finance.html#learn/glossariy/FRN"}, {"t": "Fundamental analysis", "f": "Фундаментальный анализ", "d": "Оценка бумаги через бизнес: отчётность, отрасль, менеджмент, макро.", "x": "", "u": "finance.html#learn/glossariy/Fundamental%20analysis", "g": "finance.html#learn/glossariy/Fundamental%20analysis"}, {"t": "Future value (FV)", "f": "Будущая стоимость", "d": "Во что превратится сегодняшняя сумма через n периодов под ставку r.", "x": "<code>FV = PV × (1 + r)^n<\/code>", "u": "finance.html#learn/glossariy/Future%20value%20%28FV%29", "g": "finance.html#learn/glossariy/Future%20value%20%28FV%29"}, {"t": "FX swap", "f": "Валютный своп (FX — Foreign Exchange)", "d": "Обменять валюту сейчас и обязаться обменять обратно позже по оговорённому курсу. Краткосрочное фондирование в валюте.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/FX%20swap", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "FX swap", "hs": "Валютные свопы"}, {"t": "Gamma", "f": "Гамма", "d": "Как быстро меняется дельта при движении цены актива.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Gamma", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Gamma", "hs": "Греки"}, {"t": "GDP", "f": "Валовой внутренний продукт (GDP — Gross Domestic Product)", "d": "Стоимость всех товаров и услуг, произведённых в стране за год. Главный показатель размера экономики.", "x": "", "u": "finance.html#learn/glossariy/GDP", "g": "finance.html#learn/glossariy/GDP"}, {"t": "Gearing", "f": "Долговая нагрузка (брит.)", "d": "Британский термин для рычага: доля долга в капитале.", "x": "<code>Gearing = Чистый долг / (Чистый долг + Капитал)<\/code>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/Gearing", "ut": "Финансовые коэффициенты", "hq": "Долговая нагрузка", "hs": "Долговая нагрузка"}, {"t": "GMV", "f": "Gross Merchandise Value", "d": "Общая сумма всех продаж через платформу (маркетплейс). Это не выручка платформы: ей достаётся только комиссия.", "x": "", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/GMV", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "GMV", "hs": "IT и интернет"}, {"t": "Going concern", "f": "Непрерывность деятельности", "d": "Допущение, что компания проработает ещё минимум год. Если аудитор сомневается, он пишет об этом в заключении.", "x": "", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Going%20concern", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "Going concern", "hs": "Оценка в кризисе"}, {"t": "Goodwill", "f": "Гудвилл (деловая репутация)", "d": "Переплата при покупке компании: на сколько цена покупки больше справедливой стоимости её чистых активов. Например, купили за 150 компанию, чьё имущество за вычетом долгов стоит 100: гудвилл равен 50. Это плата за бренд, клиентов, репутацию", "x": "<code>Goodwill = Цена покупки − Справедливая стоимость чистых активов<\/code><br><span class=\"fx\">где: Переплата за бренд, клиентов и команду сверх стоимости активов<\/span>", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/Goodwill", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Гудвилл", "hs": "Консолидация, гудвилл и распределение цены покупки (PPA)"}, {"t": "Gordon growth model", "f": "Модель Гордона", "d": "Стоимость актива, который приносит поток, растущий вечно с постоянным темпом g. Используют в двух местах: для оценки акции по дивидендам (DDM) и для терминальной стоимости в DCF. Работает только если ставка больше роста.", "x": "<code>P₀ = DPS₁ / (Ke − g);  TV = FCF₁ / (WACC − g) = FCF₀ × (1+g) / (WACC − g)<\/code><br><span class=\"fx\">где: DPS₁ — дивиденд следующего года. Ke — стоимость собственного капитала. g — темп роста. FCF — свободный денежный поток. Если g ≥ ставки, формула ломается; g берут не выше роста экономики<\/span>", "u": "finance.html#learn/dcf", "g": "finance.html#learn/glossariy/Gordon%20growth%20model", "ut": "DCF: оценка по дисконтированным потокам", "hq": "Гордон", "hs": "Метод Гордона (perpetuity growth)"}, {"t": "GP / LP", "f": "General / Limited Partner", "d": "GP — управляющий фондом, принимает решения. LP — инвестор, даёт деньги и не управляет.", "x": "", "u": "finance.html#learn/glossariy/GP%20%2F%20LP", "g": "finance.html#learn/glossariy/GP%20%2F%20LP"}, {"t": "Green bond", "f": "Зелёная облигация", "d": "Облигация, деньги от которой идут на экологические проекты.", "x": "", "u": "finance.html#learn/povedencheskie-esg", "g": "finance.html#learn/glossariy/Green%20bond", "ut": "Поведенческие финансы и ESG", "hq": "Green bond", "hs": "Зелёные облигации и таксономия РФ"}, {"t": "Greenshoe", "f": "Опцион доразмещения", "d": "Право организатора размещения продать дополнительные акции (до 15%), чтобы удерживать цену на стабильном уровне. Это «запасной» объём: если спрос высокий, продают больше, а если цена падает, организатор выкупает акции и поддерживает цену", "x": "<code>Допразмещение ≤ 15% от основного объёма<\/code><br><span class=\"fx\">где: Опцион андеррайтера выкупить дополнительные акции по цене IPO, чтобы стабилизировать курс<\/span>", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/Greenshoe", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "Greenshoe", "hs": "5. Стабилизация и lock-up"}, {"t": "Gross margin", "f": "Валовая маржа", "d": "Какая доля выручки остаётся после себестоимости.", "x": "<code>Gross margin = Валовая прибыль / Выручка<\/code>", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/Gross%20margin", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "Валовая маржа", "hs": "Ритейл"}, {"t": "Gross profit", "f": "Валовая прибыль", "d": "Выручка минус себестоимость. Сколько остаётся на всё остальное: зарплаты, аренду, проценты, налоги.", "x": "<code>Валовая прибыль = Выручка − Себестоимость<\/code>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/Gross%20profit", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "Gross profit", "hs": "1. Отчёт о прибылях и убытках (P&L, Income Statement, ОПиУ)"}, {"t": "Growing perpetuity", "f": "Растущий перпетуитет", "d": "Платёж, который растёт каждый год на g навсегда. Основа модели Гордона и терминальной стоимости.", "x": "<code>PV = C / (r − g)<\/code><br><span class=\"fx\">где: Работает только при r больше g.<\/span>", "u": "finance.html#learn/glossariy/Growing%20perpetuity", "g": "finance.html#learn/glossariy/Growing%20perpetuity"}, {"t": "Growth capex", "f": "Инвестиции в рост", "d": "Траты на расширение: новые заводы, магазины, мощности. Их можно отложить, не ломая текущий бизнес.", "x": "", "u": "finance.html#learn/glossariy/Growth%20capex", "g": "finance.html#learn/glossariy/Growth%20capex"}, {"t": "Growth investing", "f": "Инвестирование в рост", "d": "Покупать быстро растущие компании, даже если мультипликаторы высокие, ожидая, что рост окупит цену.", "x": "", "u": "finance.html#learn/glossariy/Growth%20investing", "g": "finance.html#learn/glossariy/Growth%20investing"}, {"t": "Guidance", "f": "Прогноз компании", "d": "Ориентир по выручке и прибыли, который компания сама даёт рынку на год или квартал.", "x": "", "u": "finance.html#learn/glossariy/Guidance", "g": "finance.html#learn/glossariy/Guidance"}, {"t": "Haircut", "f": "Дисконт к стоимости залога", "d": "Скидка к рыночной стоимости залога или бумаги в сделке: кредитор принимает актив не по полной цене, а с запасом на случай её падения. Например, бумагу за 100 засчитывают как залог на 80. Второе значение — списание части долга при реструктуризации, см. следующую строку", "x": "<code>Залог = Рыночная стоимость × (1 − Haircut)<\/code><br><span class=\"fx\">где: Haircut — скидка к рыночной цене залога. При 20% бумага за 100 принимается как залог на 80<\/span>", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Haircut", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "Haircut", "hs": "Два пути: вне суда и через суд"}, {"t": "Haircut (реструктуризация)", "f": "Списание части долга", "d": "Кредиторы соглашаются получить меньше номинала.", "x": "", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/Haircut%20%28%D1%80%D0%B5%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%29", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "реструктуризация", "hs": "Реструктуризация, банкротство и distressed-ситуации"}, {"t": "Hard currency", "f": "Твёрдая валюта", "d": "Валюта, которую охотно принимают по всему миру: доллар, евро, франк.", "x": "", "u": "finance.html#learn/glossariy/Hard%20currency", "g": "finance.html#learn/glossariy/Hard%20currency"}, {"t": "Hedge fund", "f": "Хедж-фонд", "d": "Фонд для квалифицированных инвесторов с широкими стратегиями: шорты, плечо, деривативы. Берёт 2% за управление и 20% от прибыли.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Hedge%20fund", "ut": "Альтернативные инвестиции", "hq": "Хедж-фонд", "hs": "Хедж-фонды"}, {"t": "Hedging", "f": "Хеджирование", "d": "Сделка, которая страхует от неприятного движения цены: например, продать фьючерс, чтобы защитить стоимость товара на складе.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Hedging", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Хеджирование", "hs": "5. Хеджирование экспортёра: форвард, пут или коллар"}, {"t": "High yield", "f": "Высокодоходные облигации", "d": "Облигации компаний с низким рейтингом и высокой ставкой. Иначе «мусорные».", "x": "", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/High%20yield", "ut": "LBO пошагово: paper LBO и модель", "hq": "High yield", "hs": "Шаг 2. Структура долга"}, {"t": "Historical cost", "f": "Первоначальная стоимость", "d": "Актив записан по цене покупки и не пересматривается вверх вместе с рынком (только амортизируется).", "x": "", "u": "finance.html#learn/glossariy/Historical%20cost", "g": "finance.html#learn/glossariy/Historical%20cost"}, {"t": "Holdback", "f": "Удержание", "d": "Покупатель удерживает часть цены на срок, чтобы покрыть возможные претензии. Как эскроу, но без третьей стороны.", "x": "", "u": "finance.html#learn/vrazhdebnye-sdelki", "g": "finance.html#learn/glossariy/Holdback", "ut": "Враждебные поглощения, защита и регулирование сделок", "hq": "Holdback", "hs": "Защита условий сделки (deal protections)"}, {"t": "Holding company", "f": "Холдинг", "d": "Компания, владеющая долями в других компаниях и управляющая ими.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/Holding%20company", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Холдинг", "hs": "Сквозной пример: «Альфа-Холдинг» покупает «Волга-Пак»"}, {"t": "Hostile takeover", "f": "Недружественное поглощение", "d": "Покупатель обращается напрямую к акционерам, минуя совет директоров целевой компании.", "x": "", "u": "finance.html#learn/glossariy/Hostile%20takeover", "g": "finance.html#learn/glossariy/Hostile%20takeover"}, {"t": "Hurdle rate", "f": "Минимальная доходность фонда", "d": "Минимальная доходность, которую должен дать проект, чтобы в него стоило вкладываться (часто WACC + премия). «Hurdle» значит «барьер»: проект должен через него перепрыгнуть", "x": "<code>Hurdle = Минимальная требуемая доходность проекта<\/code><br><span class=\"fx\">где: Если IRR проекта ниже, проект не берут. Часто равна WACC плюс запас<\/span>", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/Hurdle%20rate", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "Hurdle rate", "hs": "Как устроен фонд"}, {"t": "IAS 17", "f": "International Accounting Standard 17 «Leases» (международный стандарт об аренде, до 2019 года)", "d": "Старые правила аренды: операционную аренду не показывали в балансе, платежи шли в операционные расходы. После перехода на IFRS 16 (International Financial Reporting Standard 16) компании считают EBITDA «по IAS 17», чтобы сравнивать с прошлыми годами и с теми, кто так считает. Тогда арендные платежи вычитают из EBITDA, а аренду не включают в долг.", "x": "<code>EBITDA IAS 17 = EBITDA IFRS 16 − Платежи по аренде<\/code><br><span class=\"fx\">где: EBITDA IFRS 16 — прибыль до процентов, налогов и амортизации по новому стандарту, где аренда вынесена из расходов<\/span>", "u": "finance.html#learn/glossariy/IAS%2017", "g": "finance.html#learn/glossariy/IAS%2017"}, {"t": "IC memo", "f": "Investment committee memo", "d": "Документ для инвестиционного комитета фонда: тезис, оценка, риски, доходность.", "x": "", "u": "finance.html#learn/private-equity-v-rabote", "g": "finance.html#learn/glossariy/IC%20memo", "ut": "Private Equity в работе: от поиска сделки до выхода", "hq": "IC memo", "hs": "IC memo: документ для инвестиционного комитета"}, {"t": "ICR", "f": "Interest Coverage Ratio", "d": "Покрытие процентов: во сколько раз операционная прибыль больше процентов (EBIT / проценты; в кредитном анализе и ковенантах чаще берут EBITDA / проценты, как в главах про долг). Если прибыль 90, а проценты 30, ICR равен 3: денег втрое больше, чем нужно на проценты", "x": "<code>ICR = EBIT / Проценты к уплате<\/code><br><span class=\"fx\">где: Во сколько раз операционная прибыль покрывает проценты. Ниже 1,5–2 — тревожно<\/span>", "u": "finance.html#learn/lbo-poshagovo", "g": "finance.html#learn/glossariy/ICR", "ut": "LBO пошагово: paper LBO и модель", "hq": "ICR", "hs": "Типичные ошибки"}, {"t": "Idiosyncratic risk", "f": "Специфический риск", "d": "Риск одной компании, который убирается диверсификацией.", "x": "", "u": "finance.html#learn/portfel-capm", "g": "finance.html#learn/glossariy/Idiosyncratic%20risk", "ut": "Риск и доходность: портфель, CAPM, факторы", "hq": "Специфический риск", "hs": "3. Много активов: систематический и специфический риск"}, {"t": "IFRS / МСФО", "f": "International Financial Reporting Standards", "d": "Международные правила составления финансовой отчётности. Они нужны, чтобы компании из разных стран считали и показывали свои цифры одинаково", "x": "", "u": "finance.html#learn/glossariy/IFRS%20%2F%20%D0%9C%D0%A1%D0%A4%D0%9E", "g": "finance.html#learn/glossariy/IFRS%20%2F%20%D0%9C%D0%A1%D0%A4%D0%9E"}, {"t": "IFRS 16", "f": "Стандарт об аренде (IFRS — International Financial Reporting Standards)", "d": "По МСФО почти любая аренда показывается в балансе: актив (право пользования) и долг на сумму будущих платежей. Из-за этого у арендаторов выросли EBITDA и долг.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/IFRS%2016", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "IFRS 16", "hs": "IFRS 16. Аренда"}, {"t": "IFRS 9 stages", "f": "Стадии по МСФО 9 (IFRS — International Financial Reporting Standards)", "d": "Кредиты делят на три стадии: 1 — всё хорошо, 2 — риск вырос, 3 — дефолт. Чем выше стадия, тем больше резерв.", "x": "", "u": "finance.html#learn/glossariy/IFRS%209%20stages", "g": "finance.html#learn/glossariy/IFRS%209%20stages"}, {"t": "Impairment", "f": "Обесценение", "d": "Когда актив оказался стоит меньше, чем записан в балансе, его списывают до реальной цены. Убыток разовый и бумажный, деньги не уходят.", "x": "", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/Impairment", "ut": "US GAAP и МСФО: главные различия", "hq": "Обесценение", "hs": "Переоценка, обесценение и его отыгрыш"}, {"t": "Implied multiple", "f": "Подразумеваемый мультипликатор", "d": "Мультипликатор, который «зашит» в полученной оценке. Помогает проверить DCF: если вышло EV/EBITDA = 30, что-то не так.", "x": "", "u": "finance.html#learn/glossariy/Implied%20multiple", "g": "finance.html#learn/glossariy/Implied%20multiple"}, {"t": "Implied volatility", "f": "Подразумеваемая волатильность", "d": "Волатильность, которую «закладывает» рынок в цену опциона. Растёт в страх.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/Implied%20volatility", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "Implied volatility", "hs": "Греки"}, {"t": "Income statement (P&L)", "f": "Отчёт о прибылях и убытках (P&L — Profit & Loss)", "d": "Показывает за период, сколько компания заработала и потратила: от выручки сверху до чистой прибыли внизу.", "x": "<code>Чистая прибыль = Выручка − Расходы − Проценты − Налоги<\/code>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/Income%20statement%20%28P%26L%29", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "P&L", "hs": "Отчётность: P&L, баланс, cash flow"}, {"t": "Incremental cash flow", "f": "Приростный денежный поток", "d": "Только те деньги, которые появятся или исчезнут из-за проекта. Остальное в оценку проекта не входит.", "x": "", "u": "finance.html#learn/glossariy/Incremental%20cash%20flow", "g": "finance.html#learn/glossariy/Incremental%20cash%20flow"}, {"t": "Indemnity", "f": "Возмещение потерь", "d": "Обязательство продавца покрыть конкретные убытки покупателя, например по налоговой проверке за прошлые годы. В РФ — ст. 406.1 ГК (сверить).", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Indemnity", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Возмещение потерь", "hs": "SPA и защита сторон"}, {"t": "Independent director", "f": "Независимый директор", "d": "Член совета, не связанный с компанией и крупными акционерами. Должен защищать интересы всех акционеров.", "x": "", "u": "finance.html#learn/glossariy/Independent%20director", "g": "finance.html#learn/glossariy/Independent%20director"}, {"t": "Index", "f": "Индекс", "d": "Число, показывающее, как ведёт себя группа бумаг. IMOEX — российские акции, S&P 500 — американские.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Index", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Индекс", "hs": "Организация рынков, индексы, эффективность и инвестиционная политика"}, {"t": "Inflation-linked bond", "f": "Облигация, привязанная к инфляции", "d": "Номинал или купон растёт вместе с инфляцией. Защита от обесценения денег. В России — ОФЗ-ИН.", "x": "", "u": "finance.html#learn/rynki-kapitala", "g": "finance.html#learn/glossariy/Inflation-linked%20bond", "ut": "Рынки капитала: облигации, акции, деривативы, крипта", "hq": "Облигация", "hs": "Рынки капитала: облигации, акции, деривативы, крипта"}, {"t": "Information ratio", "f": "Информационный коэффициент", "d": "Насколько постоянно управляющий обыгрывает бенчмарк, с учётом отклонения от него.", "x": "<code>IR = (Rp − Rb) / Tracking error<\/code>", "u": "finance.html#learn/glossariy/Information%20ratio", "g": "finance.html#learn/glossariy/Information%20ratio"}, {"t": "Insider trading", "f": "Инсайдерская торговля", "d": "Сделки с бумагами на основе непубличной информации. Запрещена. В РФ — закон 224-ФЗ (сверить).", "x": "", "u": "finance.html#learn/glossariy/Insider%20trading", "g": "finance.html#learn/glossariy/Insider%20trading"}, {"t": "Intangible assets", "f": "Нематериальные активы", "d": "Активы без вещественной формы: патенты, лицензии, бренды, программы, гудвил.", "x": "", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/Intangible%20assets", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "Нематериальные активы", "hs": "IAS 16 и IAS 38. Основные средства и нематериальные активы"}, {"t": "Interchange", "f": "Интерчейндж", "d": "Часть комиссии за оплату картой, которую банк магазина платит банку покупателя.", "x": "", "u": "finance.html#learn/glossariy/Interchange", "g": "finance.html#learn/glossariy/Interchange"}, {"t": "Interest coverage", "f": "Покрытие процентов", "d": "Во сколько раз операционная прибыль (EBIT, в кредитном анализе часто EBITDA) больше процентов по долгу. Ниже 1,5 — тревожно.", "x": "<code>ICR = EBIT / Проценты<\/code>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/Interest%20coverage", "ut": "Финансовые коэффициенты", "hq": "Interest coverage", "hs": "Долговая нагрузка"}, {"t": "Interest expense", "f": "Процентные расходы", "d": "Сколько компания заплатила процентов по своим долгам за период.", "x": "", "u": "finance.html#learn/glossariy/Interest%20expense", "g": "finance.html#learn/glossariy/Interest%20expense"}, {"t": "Interested party transaction", "f": "Сделка с заинтересованностью", "d": "Сделка, в которой у директора или крупного акционера есть личный интерес. Нужно раскрытие и, по требованию, одобрение. В РФ — глава XI закона об АО (сверить).", "x": "", "u": "finance.html#learn/glossariy/Interested%20party%20transaction", "g": "finance.html#learn/glossariy/Interested%20party%20transaction"}, {"t": "Internal audit", "f": "Внутренний аудит", "d": "Служба внутри компании, проверяющая процессы и контроли. Подчиняется совету, а не менеджменту.", "x": "", "u": "finance.html#learn/glossariy/Internal%20audit", "g": "finance.html#learn/glossariy/Internal%20audit"}, {"t": "Intrinsic value", "f": "Внутренняя стоимость опциона", "d": "Сколько опцион стоил бы, если бы его исполнили прямо сейчас.", "x": "<code>Call: max(S − K; 0)<\/code>", "u": "finance.html#learn/glossariy/Intrinsic%20value", "g": "finance.html#learn/glossariy/Intrinsic%20value"}, {"t": "Inventory", "f": "Запасы", "d": "Сырьё, незавершёнка и готовая продукция на складе. Пока не продано, лежит в балансе как актив.", "x": "", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/Inventory", "ut": "US GAAP и МСФО: главные различия", "hq": "Запасы", "hs": "Запасы: LIFO и FIFO"}, {"t": "Inventory turnover", "f": "Оборачиваемость запасов", "d": "Сколько раз за год запасы «проходят» через продажи.", "x": "<code>Inventory turnover = Себестоимость / Средние запасы<\/code>", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/Inventory%20turnover", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "Оборачиваемость запасов", "hs": "Ритейл"}, {"t": "Investment grade", "f": "Инвестиционный рейтинг", "d": "Рейтинг не ниже BBB− по шкале S&P: считается, что компания скорее вернёт долг. Всё ниже — high yield.", "x": "", "u": "finance.html#learn/glossariy/Investment%20grade", "g": "finance.html#learn/glossariy/Investment%20grade"}, {"t": "IPO", "f": "Initial Public Offering", "d": "Первичное публичное размещение: компания впервые продаёт свои акции на бирже. После этого любой человек может купить долю в такой компании", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/IPO", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "IPO", "hs": "ECM и DCM: IPO, SPO и облигации"}, {"t": "IRR", "f": "Internal Rate of Return", "d": "Внутренняя норма доходности: годовая доходность проекта, то есть ставка, при которой NPV = 0. Проще говоря, «под какой годовой процент работают вложенные деньги»", "x": "<code>0 = Σ CF<sub>t<\/sub> / (1+IRR)<sup>t<\/sup><\/code><br><span class=\"fx\">где: CF<sub>t<\/sub> — денежный поток года t (включая начальную инвестицию с минусом). IRR — ставка, при которой NPV равна нулю. Подбирается итерациями<\/span>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/IRR", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "IRR", "hs": "Деньги во времени: NPV, IRR, окупаемость"}, {"t": "IRS", "f": "Interest Rate Swap", "d": "Процентный своп: стороны меняются платежами по фиксированной и плавающей ставке на одну и ту же сумму. Применяют, чтобы превратить плавающий долг в фиксированный.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/IRS", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "IRS", "hs": "Процентный своп (IRS)"}, {"t": "J-curve", "f": "J-кривая", "d": "Доходность фонда в первые годы отрицательна (комиссии, неокупившиеся вложения), потом растёт. График по форме похож на букву J.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/J-curve", "ut": "Венчур и стартапы", "hq": "J-curve", "hs": "J-curve"}, {"t": "Joint venture", "f": "Совместное предприятие", "d": "Две компании создают общую, делят расходы, риски и прибыль.", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/Joint%20venture", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "Совместное предприятие", "hs": "Equity method и совместные предприятия"}, {"t": "Key rate", "f": "Ключевая ставка Банка России", "d": "Главная ставка, по которой Банк России кредитует банки. От неё зависят ставки по депозитам, кредитам, ОФЗ (облигации федерального займа) и купоны флоатеров. Высокая ставка удорожает долг компаний и снижает оценки в DCF.", "x": "", "u": "finance.html#learn/rossiya", "g": "finance.html#learn/glossariy/Key%20rate", "ut": "Россия: ставки, налоги, специфика", "hq": "Ключевая ставка Банка России", "hs": "Ключевая ставка Банка России"}, {"t": "KYC", "f": "Know Your Customer", "d": "Процедура проверки клиента банком или брокером: кто он, откуда деньги.", "x": "", "u": "finance.html#learn/glossariy/KYC", "g": "finance.html#learn/glossariy/KYC"}, {"t": "LBO", "f": "Leveraged Buyout", "d": "Покупка компании в основном на заёмные деньги. Как купить квартиру в ипотеку с маленьким первым взносом. Долг потом гасят из прибыли самой купленной компании", "x": "", "u": "finance.html#learn/ma-lbo", "g": "finance.html#learn/glossariy/LBO", "ut": "M&A и LBO", "hq": "LBO", "hs": "M&A и LBO"}, {"t": "LCR", "f": "Liquidity Coverage Ratio", "d": "Хватит ли у банка ликвидных активов, чтобы пережить отток денег за 30 дней. Должен быть не ниже 100%.", "x": "<code>LCR = Ликвидные активы / Чистый отток за 30 дней<\/code>", "u": "finance.html#learn/glossariy/LCR", "g": "finance.html#learn/glossariy/LCR"}, {"t": "Legal DD", "f": "Юридическая проверка (DD — Due Diligence)", "d": "Проверка прав на акции и активы, договоров, судов, лицензий, трудовых вопросов.", "x": "", "u": "finance.html#learn/glossariy/Legal%20DD", "g": "finance.html#learn/glossariy/Legal%20DD"}, {"t": "Leverage", "f": "Финансовый рычаг", "d": "Финансовый рычаг: использование долга. Часто его измеряют как ND/EBITDA. Долг усиливает и прибыль, и убытки, как рычаг: чем длиннее, тем сильнее эффект", "x": "<code>Леверидж = Net Debt / EBITDA<\/code><br><span class=\"fx\">где: Net Debt — долг минус деньги. Показывает, за сколько лет EBITDA погасит долг<\/span>", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Leverage", "ut": "Альтернативные инвестиции", "hq": "Leverage", "hs": "Что такое «альтернативы» и зачем они в портфеле"}, {"t": "Levered beta", "f": "Бета с учётом долга", "d": "Бета акций компании, как она есть: включает риск самого бизнеса и риск долга.", "x": "<code>βL = βU × (1 + (1 − t) × D/E)<\/code><br><span class=\"fx\">где: βU — бета без долга. t — налог. D/E — долг к капиталу.<\/span>", "u": "finance.html#learn/glossariy/Levered%20beta", "g": "finance.html#learn/glossariy/Levered%20beta"}, {"t": "LFL", "f": "Like-for-Like (сопоставимые продажи)", "d": "Рост продаж только в магазинах, которые работали в обоих сравниваемых периодах. Отсекает эффект от новых открытий и показывает, растёт ли сам магазин. Делится на трафик (число покупателей) и средний чек.", "x": "<code>(1 + LFL продаж) = (1 + LFL трафик) × (1 + LFL чек)<\/code><br><span class=\"fx\">где: LFL трафик — рост числа чеков в сопоставимых магазинах, LFL чек — рост среднего чека (обычно ≈ инфляции на продукты)<\/span>", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/LFL", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "LFL", "hs": "Ритейл"}, {"t": "LGD", "f": "Loss Given Default", "d": "Доля потерь при дефолте = 1 − recovery rate. Если кредитор вернул 40% долга, потеря составила 60%", "x": "<code>LGD = 1 − Recovery rate<\/code><br><span class=\"fx\">где: Recovery rate — доля долга, которую вернули при дефолте. LGD — доля потерь<\/span>", "u": "finance.html#learn/restrukturizatsiya", "g": "finance.html#learn/glossariy/LGD", "ut": "Реструктуризация, банкротство и distressed-ситуации", "hq": "LGD", "hs": "Очерёдность расчётов"}, {"t": "LIFO", "f": "Последним пришёл — первым ушёл (LIFO — Last In, First Out)", "d": "Способ учёта: в себестоимость идёт самая свежая партия. Разрешён в US GAAP, запрещён в МСФО.", "x": "", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/LIFO", "ut": "US GAAP и МСФО: главные различия", "hq": "LIFO", "hs": "Запасы: LIFO и FIFO"}, {"t": "Limit order", "f": "Лимитная заявка", "d": "Купить или продать не хуже указанной цены. Может не исполниться, если рынок не дошёл.", "x": "", "u": "finance.html#learn/glossariy/Limit%20order", "g": "finance.html#learn/glossariy/Limit%20order"}, {"t": "Liquidation preference", "f": "Приоритет при ликвидации", "d": "Право инвестора первым забрать свои деньги (иногда с кратным умножением) при продаже или закрытии компании, до основателей.", "x": "", "u": "finance.html#learn/venchur", "g": "finance.html#learn/glossariy/Liquidation%20preference", "ut": "Венчур и стартапы", "hq": "Liquidation preference", "hs": "Ликвидационные привилегии (liquidation preference)"}, {"t": "Liquidity risk", "f": "Риск ликвидности", "d": "Не суметь быстро продать актив или найти деньги для платежа.", "x": "", "u": "finance.html#learn/glossariy/Liquidity%20risk", "g": "finance.html#learn/glossariy/Liquidity%20risk"}, {"t": "LLCR", "f": "Loan Life Cover Ratio", "d": "NPV потоков проекта за срок кредита / остаток долга. Показывает, хватит ли денег проекта, чтобы погасить весь кредит. Если меньше 1, не хватит", "x": "<code>LLCR = NPV(CFADS за срок кредита) / Остаток долга<\/code><br><span class=\"fx\">где: CFADS — денежный поток, доступный для обслуживания долга. NPV берётся по ставке кредита<\/span>", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/LLCR", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "LLCR", "hs": "Проектное финансирование"}, {"t": "Loan loss provision", "f": "Резерв на возможные потери по ссудам", "d": "Деньги, которые банк откладывает на случай, что часть кредитов не вернут. Уменьшает прибыль.", "x": "", "u": "finance.html#learn/glossariy/Loan%20loss%20provision", "g": "finance.html#learn/glossariy/Loan%20loss%20provision"}, {"t": "Loan-to-deposit", "f": "Кредиты к депозитам", "d": "Сколько кредитов банк выдал на рубль вкладов. Выше 100% — банк зависит от рыночного фондирования.", "x": "<code>LDR = Кредиты / Депозиты<\/code>", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/Loan-to-deposit", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "Loan-to-deposit", "hs": "Как устроен банк"}, {"t": "Lock-up", "f": "Запрет на продажу акций", "d": "Запрет продавать свои акции после IPO (обычно 180 дней). Нужен, чтобы владельцы не бросились продавать сразу и не обвалили цену", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/Lock-up", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "Lock-up", "hs": "5. Стабилизация и lock-up"}, {"t": "Locked box", "f": "Фиксированная дата баланса в сделке", "d": "Способ определить цену сделки: её фиксируют по балансу на прошлую дату, и дальше цена не пересчитывается. Покупатель знает цену заранее, а продавец обещает, что до закрытия сделки деньги из компании не уйдут", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/Locked%20box", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Locked box", "hs": "Механика цены: locked box vs completion accounts"}, {"t": "LOI / MoU", "f": "Письмо о намерениях / меморандум (LOI — Letter of Intent; MoU — Memorandum of Understanding)", "d": "Предварительный документ с основными условиями. Обычно необязательный, кроме эксклюзивности и конфиденциальности.", "x": "", "u": "finance.html#learn/glossariy/LOI%20%2F%20MoU", "g": "finance.html#learn/glossariy/LOI%20%2F%20MoU"}, {"t": "Long/short equity", "f": "Стратегия «лонг / шорт» по акциям", "d": "Стратегия хедж-фонда: покупать недооценённые акции, шортить переоценённые.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Long%2Fshort%20equity", "ut": "Альтернативные инвестиции", "hq": "Long/short equity", "hs": "Хедж-фонды"}, {"t": "Loss aversion", "f": "Неприятие потерь", "d": "Потеря ощущается сильнее, чем такая же по размеру прибыль. Из-за этого люди держат убыточные позиции слишком долго.", "x": "", "u": "finance.html#learn/povedencheskie-esg", "g": "finance.html#learn/glossariy/Loss%20aversion", "ut": "Поведенческие финансы и ESG", "hq": "Неприятие потерь", "hs": "Теория перспектив"}, {"t": "Loss ratio", "f": "Коэффициент убыточности", "d": "Какую долю премий страховщик выплатил как возмещение.", "x": "<code>Loss ratio = Выплаты / Премии<\/code>", "u": "finance.html#learn/banki-fig", "g": "finance.html#learn/glossariy/Loss%20ratio", "ut": "Банки и страховые (FIG): капитал, регулирование и оценка", "hq": "Loss ratio", "hs": "Страховые компании"}, {"t": "LSE / HKEX / SGX", "f": "LSE — London Stock Exchange; HKEX — Hong Kong Exchanges and Clearing; SGX — Singapore Exchange", "d": "Биржи Лондона, Гонконга, Сингапура. Российские компании размещали GDR в Лондоне до 2022 года.", "x": "", "u": "finance.html#learn/glossariy/LSE%20%2F%20HKEX%20%2F%20SGX", "g": "finance.html#learn/glossariy/LSE%20%2F%20HKEX%20%2F%20SGX"}, {"t": "LTGR", "f": "Long-Term Growth Rate (долгосрочный темп роста)", "d": "Темп роста денежных потоков после прогнозного периода. Идёт в формулу терминальной стоимости (TV, Terminal Value). Не должен превышать рост экономики в номинальном выражении: иначе компания «съест» всю экономику. Для России обычно близок к долгосрочной инфляции.", "x": "<code>TV = FCFF × (1 + g) / (WACC − g)<\/code><br><span class=\"fx\">где: g = LTGR, FCFF — свободный денежный поток последнего прогнозного года, WACC — ставка дисконтирования<\/span>", "u": "finance.html#learn/glossariy/LTGR", "g": "finance.html#learn/glossariy/LTGR"}, {"t": "LTM / TTM / NTM", "f": "Last / Trailing / Next Twelve Months", "d": "Последние 12 месяцев (LTM, TTM) или следующие 12 месяцев (NTM). Так считают показатели за «скользящий» год, а не за календарный", "x": "<code>LTM = Год<sub>прошлый<\/sub> + YTD<sub>тек<\/sub> − YTD<sub>прош<\/sub><\/code><br><span class=\"fx\">где: YTD — с начала года до отчётной даты. Берём прошлый год, добавляем текущий YTD и вычитаем YTD прошлого года. Получаем последние 12 месяцев<\/span>", "u": "finance.html#learn/glossariy/LTM%20%2F%20TTM%20%2F%20NTM", "g": "finance.html#learn/glossariy/LTM%20%2F%20TTM%20%2F%20NTM"}, {"t": "LTV (клиент)", "f": "Customer Lifetime Value", "d": "Сколько денег клиент принесёт за всё время, пока пользуется продуктом.", "x": "<code>LTV = Средний чек × Покупок за период × Срок жизни клиента × Маржа<\/code><br><span class=\"fx\">где: Хорошо, когда LTV / CAC больше 3.<\/span>", "u": "finance.html#learn/etika-regulirovanie", "g": "finance.html#learn/glossariy/LTV%20%28%D0%BA%D0%BB%D0%B8%D0%B5%D0%BD%D1%82%29", "ut": "Этика и регулирование: Кодекс CFA и российский рынок", "hq": "клиент", "hs": "Кейс 4. Билеты от клиента"}, {"t": "LTV (кредит)", "f": "Loan-to-Value", "d": "Какую долю от стоимости залога составляет кредит. Чем ниже, тем безопаснее банк.", "x": "<code>LTV = Кредит / Стоимость залога<\/code>", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/LTV%20%28%D0%BA%D1%80%D0%B5%D0%B4%D0%B8%D1%82%29", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "кредит", "hs": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование"}, {"t": "M&A", "f": "Mergers & Acquisitions", "d": "Слияния и поглощения компаний. Слияние — две компании становятся одной, поглощение — одна покупает другую", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/M%26A", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "M&A", "hs": "Процесс M&A сделки: от мандата до закрытия"}, {"t": "M2", "f": "Денежная масса M2", "d": "Наличные, деньги на счетах и на срочных вкладах. Показывает, сколько денег в экономике.", "x": "", "u": "finance.html#learn/glossariy/M2", "g": "finance.html#learn/glossariy/M2"}, {"t": "MAC / MAE", "f": "Material Adverse Change / Effect", "d": "Условие, по которому покупатель может отказаться от сделки, если случится существенное негативное событие. Например, пожар на главном заводе до закрытия сделки", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/MAC%20%2F%20MAE", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "MAC / MAE", "hs": "SPA и защита сторон"}, {"t": "MACD", "f": "MACD — Moving Average Convergence Divergence", "d": "Индикатор на разнице двух скользящих средних. Показывает смену тренда.", "x": "", "u": "finance.html#learn/glossariy/MACD", "g": "finance.html#learn/glossariy/MACD"}, {"t": "Maintenance capex", "f": "Поддерживающие инвестиции", "d": "Деньги, которые надо тратить, чтобы бизнес просто не развалился: ремонт, замена оборудования.", "x": "", "u": "finance.html#learn/glossariy/Maintenance%20capex", "g": "finance.html#learn/glossariy/Maintenance%20capex"}, {"t": "Major transaction", "f": "Крупная сделка", "d": "Сделка на 25% и больше балансовых активов. Требует одобрения совета или собрания. В РФ — глава X закона об АО (сверить).", "x": "", "u": "finance.html#learn/glossariy/Major%20transaction", "g": "finance.html#learn/glossariy/Major%20transaction"}, {"t": "Majority shareholder", "f": "Мажоритарий", "d": "Акционер с контрольной долей. В РФ по закону об АО есть пороги прав: 1%, 2%, 10%, 25%, 30%, 50%, 75%, 95% (сверить).", "x": "", "u": "finance.html#learn/glossariy/Majority%20shareholder", "g": "finance.html#learn/glossariy/Majority%20shareholder"}, {"t": "Make-whole", "f": "Компенсация при досрочном погашении", "d": "Платёж, равный приведённой стоимости всех недополученных платежей по облигации.", "x": "", "u": "finance.html#learn/leveraged-finance", "g": "finance.html#learn/glossariy/Make-whole", "ut": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом", "hq": "Make-whole", "hs": "Защита кредитора"}, {"t": "Management fee", "f": "Комиссия за управление", "d": "Ежегодная плата фонду за управление деньгами, часто 1,5–2% от капитала. Выплачивается независимо от результата.", "x": "", "u": "finance.html#learn/ecm-dcm", "g": "finance.html#learn/glossariy/Management%20fee", "ut": "ECM и DCM: IPO, SPO и облигации", "hq": "Management fee", "hs": "Комиссии банков (ориентиры)"}, {"t": "Mandatory offer", "f": "Обязательное предложение", "d": "Кто перешёл порог 30% голосующих акций ПАО, обязан предложить остальным выкупить их акции. В РФ — ст. 84.2 закона об АО (сверить).", "x": "", "u": "finance.html#learn/sdelki-v-rossii", "g": "finance.html#learn/glossariy/Mandatory%20offer", "ut": "Сделки в России: M&A, оферты, регулирование и особенности оценки", "hq": "Обязательное предложение", "hs": "2. Обязательное предложение и права миноритариев"}, {"t": "Margin call", "f": "Маржин-колл", "d": "Требование брокера добавить денег на счёт, когда убытки по позиции с плечом съели обеспечение. Не добавил — позицию закроют принудительно.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Margin%20call", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Margin call", "hs": "Маржинальная торговля и короткие продажи"}, {"t": "Marginal tax rate", "f": "Предельная ставка", "d": "Ставка на следующий рубль дохода. Для налогового щита важна она.", "x": "", "u": "finance.html#learn/glossariy/Marginal%20tax%20rate", "g": "finance.html#learn/glossariy/Marginal%20tax%20rate"}, {"t": "Mark-to-market", "f": "Переоценка по рынку", "d": "Оценка позиции по сегодняшней рыночной цене, а не по цене покупки. Прибыль и убыток видны каждый день.", "x": "", "u": "finance.html#learn/glossariy/Mark-to-market", "g": "finance.html#learn/glossariy/Mark-to-market"}, {"t": "Market maker", "f": "Маркетмейкер", "d": "Участник, который постоянно выставляет и цену покупки, и цену продажи, давая рынку ликвидность. Зарабатывает на спреде.", "x": "", "u": "finance.html#learn/glossariy/Market%20maker", "g": "finance.html#learn/glossariy/Market%20maker"}, {"t": "Market manipulation", "f": "Манипулирование рынком", "d": "Искусственное движение цены: ложные заявки, сговор, распространение слухов. Запрещено.", "x": "", "u": "finance.html#learn/etika-regulirovanie", "g": "finance.html#learn/glossariy/Market%20manipulation", "ut": "Этика и регулирование: Кодекс CFA и российский рынок", "hq": "Манипулирование рынком", "hs": "Манипулирование рынком"}, {"t": "Market order", "f": "Рыночная заявка", "d": "Купить или продать сразу по лучшей доступной цене. Исполнится, но цена может отличаться от ожидаемой.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Market%20order", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Рыночная заявка", "hs": "Типичные ошибки"}, {"t": "Market risk", "f": "Рыночный риск", "d": "Потери от движения цен, ставок, курсов.", "x": "", "u": "finance.html#learn/glossariy/Market%20risk", "g": "finance.html#learn/glossariy/Market%20risk"}, {"t": "Materiality", "f": "Существенность", "d": "Порог, ниже которого ошибка или событие не меняет решения читателя отчётности. Аудитор проверяет только существенное.", "x": "", "u": "finance.html#learn/glossariy/Materiality", "g": "finance.html#learn/glossariy/Materiality"}, {"t": "Max drawdown", "f": "Максимальная просадка", "d": "Самое глубокое падение портфеля от пика до дна за период. Показывает, сколько можно потерять в плохой момент.", "x": "<code>Drawdown = (Дно − Пик) / Пик<\/code>", "u": "finance.html#learn/glossariy/Max%20drawdown", "g": "finance.html#learn/glossariy/Max%20drawdown"}, {"t": "MBO", "f": "Management Buyout", "d": "Выкуп компании самим менеджментом, обычно вместе с фондом и за счёт долга.", "x": "", "u": "finance.html#learn/glossariy/MBO", "g": "finance.html#learn/glossariy/MBO"}, {"t": "MBS", "f": "Mortgage-Backed Security", "d": "Бумага, обеспеченная пулом ипотечных кредитов.", "x": "", "u": "finance.html#learn/glossariy/MBS", "g": "finance.html#learn/glossariy/MBS"}, {"t": "Merger arbitrage", "f": "Арбитраж слияний", "d": "Покупка акций цели по цене чуть ниже цены сделки. Заработок, если сделка закроется, убыток, если сорвётся.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Merger%20arbitrage", "ut": "Альтернативные инвестиции", "hq": "Арбитраж слияний", "hs": "Хедж-фонды"}, {"t": "Mezzanine", "f": "Мезонинное финансирование", "d": "Дорогой долг между обычным долгом и акциями. Платят выше, чем по кредитам, зато при банкротстве возвращают позже.", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Mezzanine", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Mezzanine", "hs": "Виды долга по старшинству"}, {"t": "Mid-year convention", "f": "Допущение о середине года", "d": "Денежные потоки приходят равномерно в течение года, поэтому их дисконтируют не на конец года, а на середину. Оценка получается выше.", "x": "", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/Mid-year%20convention", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "Mid-year convention", "hs": "Mid-year convention (дисконтирование середины года)"}, {"t": "Minority discount", "f": "Скидка за миноритарность", "d": "Доля без контроля стоит дешевле пропорциональной доли компании, потому что владелец не может решать.", "x": "", "u": "finance.html#learn/glossariy/Minority%20discount", "g": "finance.html#learn/glossariy/Minority%20discount"}, {"t": "Minority shareholder", "f": "Миноритарий", "d": "Акционер с небольшой долей, без контроля. Защищён законом: право на информацию, выкуп при крупных сделках.", "x": "", "u": "finance.html#learn/sdelki-v-rossii", "g": "finance.html#learn/glossariy/Minority%20shareholder", "ut": "Сделки в России: M&A, оферты, регулирование и особенности оценки", "hq": "Миноритарий", "hs": "2. Обязательное предложение и права миноритариев"}, {"t": "MIRR", "f": "Modified Internal Rate of Return", "d": "IRR с реалистичным допущением: промежуточные потоки реинвестируют по стоимости капитала, а не по самой IRR.", "x": "", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/MIRR", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "MIRR", "hs": "IRR — внутренняя норма доходности"}, {"t": "Moat", "f": "«Ров»", "d": "Устойчивое преимущество, которое защищает бизнес: бренд, сеть, лицензия, низкие затраты. Термин Баффетта.", "x": "", "u": "finance.html#learn/mikroekonomika-rynki", "g": "finance.html#learn/glossariy/Moat", "ut": "Микроэкономика для финансиста (по программе CFA Level 1 Economics)", "hq": "Moat", "hs": "Ценовая власть и рвы (moat)"}, {"t": "Modified duration", "f": "Модифицированная дюрация", "d": "Приблизительно на сколько процентов изменится цена облигации при изменении доходности на 1 п. п.", "x": "<code>ΔP/P ≈ −D_mod × Δy<\/code>", "u": "finance.html#learn/glossariy/Modified%20duration", "g": "finance.html#learn/glossariy/Modified%20duration"}, {"t": "Modigliani–Miller", "f": "Теорема Модильяни — Миллера", "d": "В идеальном мире без налогов стоимость компании не зависит от структуры капитала. В реальности есть налоговый щит и риск банкротства, поэтому структура важна.", "x": "", "u": "finance.html#learn/glossariy/Modigliani%E2%80%93Miller", "g": "finance.html#learn/glossariy/Modigliani%E2%80%93Miller"}, {"t": "MoM / MOIC", "f": "Multiple of Money / Multiple on Invested Capital", "d": "Во сколько раз выросли вложенные деньги. Вложили 100, получили 250: MoM равен 2,5×", "x": "<code>MOIC = Деньги, полученные при выходе / Вложенный капитал<\/code><br><span class=\"fx\">где: Сколько раз вернулись вложения. MOIC 3x значит, что на 1 вложенный пришло 3<\/span>", "u": "finance.html#learn/glossariy/MoM%20%2F%20MOIC", "g": "finance.html#learn/glossariy/MoM%20%2F%20MOIC"}, {"t": "Momentum", "f": "Моментум", "d": "Стратегия: покупать то, что росло недавно, продавать то, что падало. Работает до разворота.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Momentum", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "Моментум", "hs": "Гипотеза эффективного рынка (EMH)"}, {"t": "Monetary policy", "f": "Денежно-кредитная политика", "d": "Действия центробанка по ставке и количеству денег, чтобы держать инфляцию в цели и поддерживать экономику.", "x": "", "u": "finance.html#learn/makro", "g": "finance.html#learn/glossariy/Monetary%20policy", "ut": "Макроэкономика для аналитика", "hq": "Денежно-кредитная политика", "hs": "Денежно-кредитная политика"}, {"t": "Monte Carlo", "f": "Метод Монте-Карло", "d": "Тысячи прогонов модели со случайными значениями вводных. На выходе не одно число, а распределение результатов.", "x": "", "u": "finance.html#learn/glossariy/Monte%20Carlo", "g": "finance.html#learn/glossariy/Monte%20Carlo"}, {"t": "Moving average", "f": "Скользящая средняя", "d": "Средняя цена за последние N дней. Сглаживает график, показывает тренд.", "x": "", "u": "finance.html#learn/glossariy/Moving%20average", "g": "finance.html#learn/glossariy/Moving%20average"}, {"t": "MRR", "f": "Monthly Recurring Revenue", "d": "Ежемесячная повторяющаяся выручка от подписок. Годовая версия — ARR.", "x": "", "u": "finance.html#learn/kpi", "g": "finance.html#learn/glossariy/MRR", "ut": "Отраслевые KPI: что смотреть в каждом секторе", "hq": "MRR", "hs": "IT и интернет"}, {"t": "Mutual fund", "f": "Паевой фонд (ПИФ)", "d": "Фонд, где деньги многих инвесторов объединены и управляются управляющей компанией. Пай можно купить и погасить по цене, зависящей от стоимости активов.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/Mutual%20fund", "ut": "Альтернативные инвестиции", "hq": "ПИФ", "hs": "Недвижимость и REIT"}, {"t": "NASDAQ / NYSE", "f": "NASDAQ — National Association of Securities Dealers Automated Quotations; NYSE — New York Stock Exchange", "d": "Две главные биржи США. NYSE — старейшая, NASDAQ — технологические компании.", "x": "", "u": "finance.html#learn/glossariy/NASDAQ%20%2F%20NYSE", "g": "finance.html#learn/glossariy/NASDAQ%20%2F%20NYSE"}, {"t": "Natural hedge", "f": "Естественный хедж", "d": "Защита от валютного риска без деривативов: выручка и расходы в одной валюте.", "x": "", "u": "finance.html#learn/mezhdunarodnye", "g": "finance.html#learn/glossariy/Natural%20hedge", "ut": "Международные финансы: валюты, паритеты, платёжный баланс", "hq": "Естественный хедж", "hs": "Инструменты"}, {"t": "NAV", "f": "Net Asset Value", "d": "Стоимость чистых активов: что останется, если из имущества вычесть долги. Как стоимость квартиры за вычетом остатка ипотеки", "x": "<code>NAV = Активы − Обязательства<\/code><br><span class=\"fx\">где: Для фонда: стоимость активов по рынку минус долги. На пай: NAV / число паёв<\/span>", "u": "finance.html#learn/metody", "g": "finance.html#learn/glossariy/NAV", "ut": "Другие методы оценки", "hq": "NAV", "hs": "NAV (Net Asset Value, стоимость чистых активов)"}, {"t": "NBO / BO", "f": "(Non-) Binding Offer", "d": "Предложение о покупке: необязывающее (NBO) или обязывающее (BO). Необязывающее — это «пока намерение», от него можно отказаться. Обязывающее — это уже обещание, за отказ от которого могут быть последствия", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/NBO%20%2F%20BO", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "Binding Offer", "hs": "3. Индикативные предложения (non-binding offers, IOI)"}, {"t": "NCI", "f": "Non-Controlling Interest", "d": "Доли меньшинства: часть дочерней компании, которая принадлежит другим владельцам, а не материнской компании. Например, материнская компания владеет 80% дочерней, а остальные 20% — это NCI", "x": "", "u": "finance.html#learn/konsolidatsiya-goodwill", "g": "finance.html#learn/glossariy/NCI", "ut": "Консолидация, гудвилл и распределение цены покупки (PPA)", "hq": "NCI", "hs": "Покупка 70%: неконтрольная доля"}, {"t": "NDA", "f": "Non-Disclosure Agreement", "d": "Соглашение о конфиденциальности: стороны обещают не раскрывать полученные сведения. Его подписывают до того, как покупатель увидит внутренние данные компании", "x": "", "u": "finance.html#learn/process-sdelki", "g": "finance.html#learn/glossariy/NDA", "ut": "Процесс M&A сделки: от мандата до закрытия", "hq": "NDA", "hs": "2. Маркетинг (3–5 недель)"}, {"t": "NDF", "f": "Non-Deliverable Forward", "d": "Форвард без поставки валюты: стороны платят только разницу курсов. Для валют с ограничениями, в том числе рубля на внешнем рынке.", "x": "", "u": "finance.html#learn/glossariy/NDF", "g": "finance.html#learn/glossariy/NDF"}, {"t": "Net Debt", "f": "Чистый долг", "d": "Чистый долг = Долг − Денежные средства. Если у тебя долг 100 и 30 на счёте, то чистый долг равен 70: на столько ты реально должен", "x": "<code>Net Debt = Долг − Деньги и эквиваленты<\/code><br><span class=\"fx\">где: Долг — кредиты и облигации. Деньги вычитаем, потому что их можно использовать для погашения<\/span>", "u": "finance.html#learn/msfo-standarty", "g": "finance.html#learn/glossariy/Net%20Debt", "ut": "МСФО: ключевые стандарты для аналитика", "hq": "Чистый долг", "hs": "Раскрытия для оценки: чистый долг и adjusted EBITDA"}, {"t": "Net Debt / EBITDA", "f": "Чистый долг к EBITDA (EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)", "d": "За сколько лет компания расплатилась бы с долгом, если бы вся EBITDA шла на долг. Главная мера долговой нагрузки.", "x": "<code>ND/EBITDA = (Долг − Деньги) / EBITDA<\/code>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/Net%20Debt%20%2F%20EBITDA", "ut": "Финансовые коэффициенты", "hq": "Net Debt / EBITDA", "hs": "Долговая нагрузка"}, {"t": "Net debt incl. leases", "f": "Чистый долг с арендой (Net Debt — чистый долг)", "d": "Чистый долг плюс обязательства по аренде. Нужен при оценке по IFRS 16 (International Financial Reporting Standard 16): аренда там долг, значит и в мост от EV (Enterprise Value) к стоимости акций её надо вычесть. При оценке по IAS 17 аренду в долг не включают.", "x": "<code>Net Debt incl. leases = Кредиты и облигации + Обязательства по аренде − Денежные средства<\/code><br><span class=\"fx\">где: Все значения на дату оценки<\/span>", "u": "finance.html#learn/glossariy/Net%20debt%20incl.%20leases", "g": "finance.html#learn/glossariy/Net%20debt%20incl.%20leases"}, {"t": "Net interest income", "f": "Чистый процентный доход", "d": "Проценты, которые банк получил по кредитам, минус проценты, которые заплатил по вкладам.", "x": "<code>NII = Процентные доходы − Процентные расходы<\/code>", "u": "finance.html#learn/glossariy/Net%20interest%20income", "g": "finance.html#learn/glossariy/Net%20interest%20income"}, {"t": "Net margin", "f": "Чистая маржа", "d": "Какая доля выручки доходит до чистой прибыли.", "x": "<code>Net margin = Чистая прибыль / Выручка<\/code>", "u": "finance.html#learn/glossariy/Net%20margin", "g": "finance.html#learn/glossariy/Net%20margin"}, {"t": "Network effect", "f": "Сетевой эффект", "d": "Чем больше пользователей, тем полезнее продукт каждому. Создаёт защиту от конкурентов.", "x": "", "u": "finance.html#learn/glossariy/Network%20effect", "g": "finance.html#learn/glossariy/Network%20effect"}, {"t": "NIM", "f": "Net Interest Margin", "d": "Чистая процентная маржа банка: «наценка» банка на разнице между ставками по кредитам и по депозитам. Банк платит вкладчикам 8%, берёт с заёмщиков 12%, и разница в 4% — его маржа", "x": "<code>NIM = (Процентные доходы − Процентные расходы) / Активы, приносящие доход<\/code><br><span class=\"fx\">где: Чистая процентная маржа банка: сколько он зарабатывает на разнице между ставками по кредитам и депозитам<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/NIM", "ut": "Финансовые коэффициенты", "hq": "NIM", "hs": "Банки"}, {"t": "NOI", "f": "Net Operating Income", "d": "Чистый операционный доход объекта: аренда минус расходы на содержание, без процентов и амортизации.", "x": "", "u": "finance.html#learn/alternativnye-investitsii", "g": "finance.html#learn/glossariy/NOI", "ut": "Альтернативные инвестиции", "hq": "NOI", "hs": "Недвижимость и REIT"}, {"t": "Nominal rate", "f": "Номинальная ставка", "d": "Ставка без поправки на инфляцию. Реальная получается по формуле Фишера.", "x": "<code>(1 + номинальная) = (1 + реальная) × (1 + инфляция)<\/code>", "u": "finance.html#learn/glossariy/Nominal%20rate", "g": "finance.html#learn/glossariy/Nominal%20rate"}, {"t": "Non-cash items", "f": "Неденежные статьи", "d": "Расходы и доходы, которые не двигают деньги: амортизация, обесценение, переоценка, опционы сотрудникам.", "x": "", "u": "finance.html#learn/glossariy/Non-cash%20items", "g": "finance.html#learn/glossariy/Non-cash%20items"}, {"t": "Non-compete", "f": "Запрет конкуренции", "d": "Продавец обязуется несколько лет не создавать конкурирующий бизнес и не переманивать сотрудников.", "x": "", "u": "finance.html#learn/glossariy/Non-compete", "g": "finance.html#learn/glossariy/Non-compete"}, {"t": "Non-core assets", "f": "Непрофильные активы", "d": "Активы, которые не участвуют в основном бизнесе и не дают денег в FCFF (Free Cash Flow to Firm): инвестиционная недвижимость, доли в других компаниях, займы связанным сторонам. Их оценивают отдельно и прибавляют в мосте от EV (Enterprise Value) к стоимости акций.", "x": "", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy/Non-core%20assets", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "Непрофильные активы", "hs": "Кейс: ключевая ставка 21% и долговая нагрузка компаний (2024–2025)"}, {"t": "Non-recourse", "f": "Без регресса", "d": "Кредит, который проект гасит только за счёт своих денег. Если проект не выручил, банк не требует остальное с владельцев.", "x": "", "u": "finance.html#learn/dolgovoe-finansirovanie", "g": "finance.html#learn/glossariy/Non-recourse", "ut": "Долговое финансирование: кредиты, leveraged finance, проектное финансирование", "hq": "Non-recourse", "hs": "Проектное финансирование"}, {"t": "NOPAT", "f": "Net Operating Profit After Tax", "d": "Операционная прибыль после налога: EBIT × (1 − t). Здесь t — налоговая ставка. Показывает, сколько останется от прибыли основной работы после уплаты налога, если бы долга не было", "x": "<code>NOPAT = EBIT × (1 − t)<\/code><br><span class=\"fx\">где: EBIT — операционная прибыль. t — ставка налога. Прибыль после налога, но без учёта долга<\/span>", "u": "finance.html#learn/otchetnost", "g": "finance.html#learn/glossariy/NOPAT", "ut": "Отчётность: P&L, баланс, cash flow", "hq": "NOPAT", "hs": "5. Свободный денежный поток (FCF)"}, {"t": "Normalization", "f": "Нормализация", "d": "Очистка показателя от разовых и нетипичных статей, чтобы видеть устойчивый уровень.", "x": "", "u": "finance.html#learn/analiz-otchetnosti", "g": "finance.html#learn/glossariy/Normalization", "ut": "Анализ отчётности: качество прибыли и красные флаги", "hq": "Нормализация", "hs": "1. Нормализация EBITDA"}, {"t": "Notes to accounts", "f": "Примечания к отчётности", "d": "Самая содержательная часть отчёта: учётная политика, разбивка долга, аренда, риски, сделки со связанными сторонами.", "x": "", "u": "finance.html#learn/glossariy/Notes%20to%20accounts", "g": "finance.html#learn/glossariy/Notes%20to%20accounts"}, {"t": "NPL", "f": "Non-Performing Loans", "d": "Проблемные кредиты: те, по которым заёмщик перестал платить. Обычно так называют кредиты с просрочкой больше 90 дней", "x": "<code>NPL ratio = Просроченные кредиты (90+ дней) / Кредитный портфель<\/code><br><span class=\"fx\">где: Доля кредитов, по которым платежи просрочены более 90 дней<\/span>", "u": "finance.html#learn/koeffitsienty", "g": "finance.html#learn/glossariy/NPL", "ut": "Финансовые коэффициенты", "hq": "NPL", "hs": "Банки"}, {"t": "NPV", "f": "Net Present Value", "d": "Чистая приведённая стоимость: сегодняшняя стоимость будущих денег минус вложения. Если NPV больше нуля, проект приносит больше, чем стоит, и в него стоит вкладываться", "x": "<code>NPV = Σ CF<sub>t<\/sub> / (1+r)<sup>t<\/sup> − I<sub>0<\/sub><\/code><br><span class=\"fx\">где: CF<sub>t<\/sub> — поток года t. r — ставка дисконтирования. I<sub>0<\/sub> — начальные вложения. NPV>0 значит проект выгоден<\/span>", "u": "finance.html#learn/npv-irr", "g": "finance.html#learn/glossariy/NPV", "ut": "Деньги во времени: NPV, IRR, окупаемость", "hq": "NPV", "hs": "Деньги во времени: NPV, IRR, окупаемость"}, {"t": "NSFR", "f": "Net Stable Funding Ratio", "d": "Достаточно ли у банка устойчивых источников денег (долгие вклады, капитал) относительно долгих активов. Не ниже 100%.", "x": "", "u": "finance.html#learn/glossariy/NSFR", "g": "finance.html#learn/glossariy/NSFR"}, {"t": "NWC", "f": "Net Working Capital", "d": "Чистый оборотный капитал: деньги, которые «застряли» в повседневной работе (запасы и долги клиентов минус долги перед поставщиками). Это деньги, которыми компания «кредитует» собственный бизнес", "x": "<code>NWC = Дебиторка + Запасы − Кредиторка<\/code><br><span class=\"fx\">где: Оборотные операционные активы минус операционные обязательства. Рост NWC «замораживает» деньги<\/span>", "u": "finance.html#learn/oborotny-kapital", "g": "finance.html#learn/glossariy/NWC", "ut": "Корпоративные финансы изнутри: оборотный капитал, бюджет, казначейство", "hq": "NWC", "hs": "NWC в модели"}, {"t": "NWC peg", "f": "Целевой оборотный капитал (NWC — Net Working Capital)", "d": "Уровень NWC, зафиксированный в договоре сделки: отклонение на дату закрытия меняет цену.", "x": "", "u": "finance.html#learn/glossariy/NWC%20peg", "g": "finance.html#learn/glossariy/NWC%20peg"}, {"t": "OAS", "f": "Option-Adjusted Spread", "d": "Спред облигации с учётом встроенных опционов (например, права досрочного погашения).", "x": "", "u": "finance.html#learn/obligatsii", "g": "finance.html#learn/glossariy/OAS", "ut": "Облигации глубоко", "hq": "OAS", "hs": "7. Спреды"}, {"t": "Off-balance sheet", "f": "Внебалансовые статьи", "d": "Обязательства или активы, которых нет в самом балансе, но они влияют на компанию: гарантии, часть аренды, SPV.", "x": "", "u": "finance.html#learn/glossariy/Off-balance%20sheet", "g": "finance.html#learn/glossariy/Off-balance%20sheet"}, {"t": "Offer", "f": "Оффер", "d": "Предложение о работе с условиями.", "x": "", "u": "finance.html#learn/vrazhdebnye-sdelki", "g": "finance.html#learn/glossariy/Offer", "ut": "Враждебные поглощения, защита и регулирование сделок", "hq": "Offer", "hs": "Способы войти"}, {"t": "Offshore", "f": "Офшор", "d": "Юрисдикция с низкими налогами и закрытой информацией о владельцах. Кипр, БВО, Каймановы острова.", "x": "", "u": "finance.html#learn/glossariy/Offshore", "g": "finance.html#learn/glossariy/Offshore"}, {"t": "OID", "f": "Original issue discount", "d": "Скидка к номиналу при выдаче долга. Добавляет доходность кредитору.", "x": "", "u": "finance.html#learn/leveraged-finance", "g": "finance.html#learn/glossariy/OID", "ut": "Leveraged Finance: кредиты и облигации для сделок с высоким долгом", "hq": "OID", "hs": "Цена долга"}, {"t": "One-off items", "f": "Разовые статьи", "d": "Расходы и доходы, которые не повторятся: продажа актива, штраф, реструктуризация.", "x": "", "u": "finance.html#learn/glossariy/One-off%20items", "g": "finance.html#learn/glossariy/One-off%20items"}, {"t": "Operating income", "f": "Операционная прибыль", "d": "То же, что EBIT: прибыль от основной деятельности до процентов и налогов.", "x": "", "u": "finance.html#learn/glossariy/Operating%20income", "g": "finance.html#learn/glossariy/Operating%20income"}, {"t": "Operating lease", "f": "Операционная аренда", "d": "Аренда, при которой актив возвращают владельцу. По старым правилам платежи шли в расходы; по IFRS 16 почти любая аренда стала долгом.", "x": "", "u": "finance.html#learn/us-gaap-vs-msfo", "g": "finance.html#learn/glossariy/Operating%20lease", "ut": "US GAAP и МСФО: главные различия", "hq": "Операционная аренда", "hs": "Аренда: ASC 842 против IFRS 16"}, {"t": "Operating leverage", "f": "Операционный рычаг", "d": "Чем больше у бизнеса постоянных расходов, тем сильнее прибыль растёт при росте выручки и тем сильнее падает при снижении.", "x": "<code>DOL = Маржинальный доход / EBIT<\/code>", "u": "finance.html#learn/mikroekonomika-rynki", "g": "finance.html#learn/glossariy/Operating%20leverage", "ut": "Микроэкономика для финансиста (по программе CFA Level 1 Economics)", "hq": "Операционный рычаг", "hs": "Издержки"}, {"t": "Operating margin", "f": "Операционная маржа", "d": "Доля выручки, которая остаётся после всех операционных расходов, до процентов и налогов.", "x": "<code>Operating margin = EBIT / Выручка<\/code>", "u": "finance.html#learn/glossariy/Operating%20margin", "g": "finance.html#learn/glossariy/Operating%20margin"}, {"t": "Operational risk", "f": "Операционный риск", "d": "Потери из-за ошибок людей, систем, процессов или мошенничества.", "x": "", "u": "finance.html#learn/keysy", "g": "finance.html#learn/glossariy/Operational%20risk", "ut": "Реальные кейсы: сделки и истории 2025–2026", "hq": "Операционный риск", "hs": "Кейс 5. Удары по дата-центрам Яндекса (операционный риск)"}, {"t": "OPEX", "f": "Operating Expenses", "d": "Операционные расходы: траты на повседневную работу. Зарплаты, аренда, электричество, реклама", "x": "<code>OPEX = SG&A + R&D + Прочие операционные расходы<\/code><br><span class=\"fx\">где: Текущие расходы на ведение бизнеса, без капитальных затрат<\/span>", "u": "finance.html#learn/project-black", "g": "finance.html#learn/glossariy/OPEX", "ut": "Разбор домашки: Project Black", "hq": "OPEX", "hs": "6. Затраты (OPEX)"}, {"t": "Opportunity cost", "f": "Альтернативные издержки", "d": "Что ты теряешь, выбирая этот вариант вместо лучшего из остальных. Ставка дисконтирования — это альтернативные издержки капитала.", "x": "", "u": "finance.html#learn/glossariy/Opportunity%20cost", "g": "finance.html#learn/glossariy/Opportunity%20cost"}, {"t": "Option premium", "f": "Премия по опциону", "d": "Цена самого опциона: деньги, которые покупатель платит продавцу за право.", "x": "", "u": "finance.html#learn/glossariy/Option%20premium", "g": "finance.html#learn/glossariy/Option%20premium"}, {"t": "Order book", "f": "Книга заявок (стакан)", "d": "Список всех заявок на покупку и продажу с ценами и объёмами.", "x": "", "u": "finance.html#learn/organizatsiya-rynkov", "g": "finance.html#learn/glossariy/Order%20book", "ut": "Организация рынков, индексы, эффективность и инвестиционная политика", "hq": "стакан", "hs": "Типы заявок"}, {"t": "Organic growth", "f": "Органический рост", "d": "Рост бизнеса без покупок других компаний.", "x": "", "u": "finance.html#learn/glossariy/Organic%20growth", "g": "finance.html#learn/glossariy/Organic%20growth"}, {"t": "OTC", "f": "Over-the-counter", "d": "Внебиржевой рынок: стороны договариваются напрямую, без общего стакана.", "x": "", "u": "finance.html#learn/derivativy", "g": "finance.html#learn/glossariy/OTC", "ut": "Деривативы: форварды, фьючерсы, свопы, опционы", "hq": "OTC", "hs": "1. Кто и зачем торгует деривативами"}, {"t": "Output gap", "f": "Разрыв выпуска", "d": "Разница между фактическим ВВП и тем, что экономика может выдать без перегрева.", "x": "", "u": "finance.html#learn/glossariy/Output%20gap", "g": "finance.html#learn/glossariy/Output%20gap"}, {"t": "Oversubscription", "f": "Переподписка", "d": "Заявок на IPO больше, чем бумаг. Бумаги делят между инвесторами пропорционально.", "x": "", "u": "finance.html#learn/ipo-v-rossii", "g": "finance.html#learn/glossariy/Oversubscription", "ut": "IPO и SPO в России: как выходят на биржу и что получается", "hq": "Oversubscription", "hs": "9. Как оценить успешность IPO"}, {"t": "P/B", "f": "Price to Book", "d": "Капитализация / балансовый собственный капитал. Главный мультипликатор для банков. Показывает, во сколько раз рынок оценивает компанию дороже, чем стоят её собственные деньги по балансу", "x": "<code>P/B = Капитализация / Балансовый капитал<\/code><br><span class=\"fx\">где: Балансовый капитал — активы минус обязательства. P/B<1 значит, что рынок оценивает компанию ниже книжной стоимости<\/span>", "u": "finance.html#learn/sektory", "g": "finance.html#learn/glossariy/P%2FB", "ut": "Какой метод к какому сектору", "hq": "P/B", "hs": "Почему банки «особенные» (самое частое на собесе)"}, {"t": "P/E", "f": "Price to Earnings", "d": "Капитализация / чистая прибыль (= цена / EPS). Показывает, за сколько лет прибыли окупится покупка компании. Капитализация — это цена всех акций компании на бирже. P/E равно 10: цена в десять раз больше годовой прибыли", "x": "<code>P/E = Цена акции / EPS = Капитализация / Чистая прибыль<\/code><br><span class=\"fx\">где: Сколько лет прибыли содержится в цене. EPS — прибыль на акцию<\/span>", "u": "finance.html#learn/accretion-dilution", "g": "finance.html#learn/glossariy/P%2FE", "ut": "Accretion / dilution: модель слияния пошагово", "hq": "P/E", "hs": "Быстрые правила: P/E и доходность прибыли"}, {"t": "P/FFO", "f": "FFO — Funds From Operations", "d": "Цена к денежному потоку от операций, мультипликатор для REIT и недвижимости.", "x": "<code>P/FFO = Капитализация / FFO<\/code>", "u": "finance.html#learn/glossariy/P%2FFFO", "g": "finance.html#learn/glossariy/P%2FFFO"}, {"t": "P/S", "f": "Price to Sales", "d": "Капитализация / выручка. Подходит для убыточных и быстрорастущих компаний. Выручка — все деньги от продаж, до вычета расходов. Прибыли у таких компаний ещё нет, поэтому сравнивают по выручке", "x": "<code>P/S = Капитализация / Выручка<\/code><br><span class=\"fx\">где: Во сколько раз цена компании больше годовой выручки<\/span>", "u": "finance.html#learn/multiplikatory", "g": "finance.html#learn/glossariy/P%2FS", "ut": "Сравнительная оценка: мультипликаторы", "hq": "P/S", "hs": "Основные мультипликаторы"}, {"t": "Paper LBO", "f": "LBO — Leveraged Buy
