function mkPerson(g,age,sn,par){var p={id:S.nid++,fn:pick(g?FN_F:FN_M),sn:sn,g:g,b:S.t-Math.round(age*MIN_Y)-ri(0,MIN_Y-1),home:-1,job:-1,sal:0,cash:0,mood:clamp(58+ri(-12,12),20,90),health:ri(70,100),sp:-1,par:par||[-1,-1],preg:0,pan:rnd()*4,rest:60+rnd()*30,fun:40+rnd()*40,soc:40+rnd()*40,wear:rnd()*100,groom:rnd()*100,m:newPM(),lm:null,inj:0,skill:+clamp(1+(rnd()+rnd()+rnd()-1.5)*.45,.75,1.35).toFixed(2),loc:-1,dest:-1};

    for(var i=0;i<n;i++){if(ka>=0)ad(rnd()<.5?1:0,ka,[m.id,f.id]);ka-=ri(1,5)}}
  else if(r<.52)ad(rnd()<.5?1:0,ri(19,62));

/* ============ маршруты ============ */
function field(gx,gy){var k=gy*N+gx,f=FC[k];if(f)return f;f=new Int16Array(N*N).fill(-1);var q=[k];f[k]=0;for(var h=0;h<q.length;h++){var c=q[h],cx=c%N,cy=(c/N)|0,dd=[[1,0],[-1,0],[0,1],[0,-1]];for(var i=0;i<4;i++){var nx=cx+dd[i][0],ny=cy+dd[i][1];if(nx<0||ny<0||nx>=N||ny>=N||!isRoad(nx,ny))continue;var n=ny*N+nx;if(f[n]<0){f[n]=f[c]+1;q.push(n)}}}FC[k]=f;return f}
function route(sx,sy,gx,gy){var f=field(gx,gy),out=[[sx,sy]],x=sx,y=sy,dx=0,dy=0,g=240;
  while(g-->0&&!(x===gx&&y===gy)){var cur=f[y*N+x];if(cur<=0)break;var c=[[dx,dy],[1,0],[-1,0],[0,1],[0,-1]],nx=-1,ny=-1;
    for(var i=0;i<5;i++){var ax=c[i][0],ay=c[i][1];if(!ax&&!ay)continue;var X=x+ax,Y=y+ay;if(X<0||Y<0||X>=N||Y>=N)continue;if(f[Y*N+X]===cur-1){nx=X;ny=Y;dx=ax;dy=ay;break}}
    if(nx<0)break;x=nx;y=ny;out.push([x,y])}
  return out}
function go(p,dst){if(dst<0||p.loc===dst)return;var sx,sy;
  if(p.loc>=0){var L=S.lots[p.loc];L.in--;sx=L.dx;sy=L.dy;p._x=sx+.5+p._ox;p._y=sy+.5+p._oy}else{sx=clamp(Math.floor(p._x),0,N-1);sy=clamp(Math.floor(p._y),0,N-1)}
  p.loc=-1;p.dest=dst;var G=S.lots[dst];p._path=route(sx,sy,G.dx,G.dy);p._pi2=0}
function goTile(p,gx,gy){var sx,sy;if(p.loc>=0){var L=S.lots[p.loc];L.in--;sx=L.dx;sy=L.dy;p._x=sx+.5+p._ox;p._y=sy+.5+p._oy}else{sx=clamp(Math.floor(p._x),0,N-1);sy=clamp(Math.floor(p._y),0,N-1)}
  p.loc=-1;p.dest=-2;p._path=route(sx,sy,gx,gy);p._pi2=0}
function move(p,dt){var pa=p._path;if(!pa)return;var d=SPD*dt;
  while(d>0&&p._pi2<pa.length){var n=pa[p._pi2],tx=n[0]+.5+p._ox,ty=n[1]+.5+p._oy,dx=tx-p._x,dy=ty-p._y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<=d){p._x=tx;p._y=ty;d-=dist;p._pi2++}else{p._x+=dx/dist*d;p._y+=dy/dist*d;d=0}}
  if(p._pi2>=pa.length)arrive(p)}
function arrive(p){p._path=null;if(p.dest===-2){p.loc=-2;return}var L=S.lots[p.dest];p.loc=p.dest;L.in++;if(L.type==='shop')shopVisit(p,L);else if(L.type==='park'){p.fun=Math.min(100,p.fun+22);p.soc=Math.min(100,p.soc+12)}}
function shopVisit(p,L){var tod=S.t%1440,a=ageOf(p),sb=SUB[L.sub||'grocery'];if(tod<600||tod>1290||L.cl||L.dmg>S.t||a<14||p.cash<=0)return;
  var pr=L.pr||1,K=S.infl,sk=clamp((pr-1)*sb.el,0,.9),cat=sb.cat,base,amt;L.vis=(L.vis||0)+1;if(rnd()<sk)return;
  if(L.sub==='grocery'){if(a<18)return;var kids=[],hm=S.lots[p.home],nad=1;if(hm){nad=0;hm.res.forEach(function(id){var q=P(id);if(q){if(ageOf(q)<18)kids.push(q);else nad++}})}
    var shr=1+kids.length*.6/Math.max(1,nad),days=Math.max(1,6-p.pan);base=days*FOOD_D*K*shr*(.9+rnd()*.2);
    amt=Math.min(base*pr,Math.max(0,p.cash)*.8);if(amt<=0)return;p.pan=Math.min(8,p.pan+amt/(base*pr)*days);kids.forEach(function(q){q.pan=Math.max(q.pan,p.pan)});
    p.cash-=amt;p.m.food+=amt;L.rev+=amt;L.cash+=amt;L.cg+=amt/pr*sb.cogs;return}
  base=sb.tick*K*(.6+rnd()*.8)*(sb.cat==='hlt'?1:1+Math.min(p.cash/(300000*K),1.5)*.5);if(L.sub==='electronics'&&p.cash<60000*K)return;

  p.cash-=amt;p.m[cat]+=amt;L.rev+=amt;L.cash+=amt;L.cg+=base*f*sb.cogs;

  else if(L.sub==='clothes'){p.wear=100;p.fun=Math.min(100,p.fun+12)}
  else if(L.sub==='pharmacy'){p.health=Math.min(100,p.health+6)}
  else if(L.sub==='electronics'){p.fun=Math.min(100,p.fun+40)}
  else if(L.sub==='barber'){p.groom=100;p.soc=Math.min(100,p.soc+6);p.mood=Math.min(98,p.mood+2)}}

function rebuildIdx(){IDX={shop:[],park:[],school:[],hospital:[],sub:{}};Object.keys(SUB).forEach(function(k){IDX.sub[k]=[]});S.lots.forEach(function(L){if(IDX[L.type]&&!L.cl&&!(L.dmg>S.t)){IDX[L.type].push(L.id);if(L.type==='shop')(IDX.sub[L.sub||'grocery']||(IDX.sub[L.sub]=[])).push(L.id)}});
  var parks=IDX.park.map(function(i){return S.lots[i]});S.lots.forEach(function(L){if(!BT[L.type].cap){L._pk=0;return}var n=0;parks.forEach(function(q){if(Math.abs(q.x-L.x)+Math.abs(q.y-L.y)<=9)n++});L._pk=Math.min(3,n)*1.8})}
function calcStats(){var sm=0,emp=0,seek=0,ret=0,kids=0,ws=0,pol=0,hos=0,n=S.people.length;
  S.people.forEach(function(p){sm+=p.mood;var a=ageOf(p);if(a<18)kids++;else if(a>=retA(p))ret++;else if(p.job>=0){emp++;ws+=p.sal}else seek++});
  S.lots.forEach(function(l){if(l.cl||l.dmg>S.t)return;if(l.type==='police')pol+=l.staff.length;if(l.type==='hospital')hos+=l.staff.length});
  var st=S.st;st.pop=n;st.mood=n?sm/n:0;st.emp=emp;st.seek=seek;st.ret=ret;st.kids=kids;st.unemp=(emp+seek)?seek/(emp+seek):0;st.avgW=emp?ws/emp:0;
  st.pc=clamp(pol/Math.max(1,n/60),0,1.2);st.hc=clamp(hos/Math.max(1,n/40),0,1.2);
  S.safety=(Math.min(1,st.pc)-.6)*10;S.health=(Math.min(1,st.hc)-.6)*6}
function nearest(type,from){var arr=IDX[type];if(!arr||!arr.length)return -1;var F=S.lots[from];if(!F)return arr[ri(0,arr.length-1)];var b=[];for(var i=0;i<arr.length;i++){var L=S.lots[arr[i]];b.push([Math.abs(L.x-F.x)+Math.abs(L.y-F.y),L.id])}b.sort(function(a,c){return a[0]-c[0]});return b[Math.min(b.length-1,ri(0,2))][1]}
function nearSub(sub,from){var arr=(IDX.sub&&IDX.sub[sub])||[];if(!arr.length)return -1;var F=S.lots[from]||S.lots[arr[0]],tot=0,ws=arr.map(function(id){var L=S.lots[id],d=Math.abs(L.x-F.x)+Math.abs(L.y-F.y),w=1/Math.pow(d+4,1.3)/Math.pow(L.pr||1,3);tot+=w;return w});var r=rnd()*tot,k=0;for(;k<ws.length-1;k++){r-=ws[k];if(r<=0)break}return arr[k]}
function errands(p,a){var o=[];if(a<14)return o;if(a>=18&&p.pan<1.6&&rnd()<.93)o.push('grocery');
  var sick=p.health<72||p.inj>S.t||(S.flu>S.t&&rnd()<.4),K=S.infl,w;
  if(a<18)w={cafe:.1,clothes:p.wear<30?.15:0};else w={cafe:.17+(p.fun<45?.2:0)+(p.soc<45?.16:0),clothes:p.wear<30?.4:.012,pharmacy:sick?.1:.035,electronics:p.cash>60000*K?.008+Math.min(.014,p.cash/2e7):0,barber:p.groom<35?.35:.01};
  var r=rnd(),k;for(k in w){r-=w[k];if(r<0){o.push(k);break}}return o}
function commute(a,b){var A=S.lots[a],B=S.lots[b];if(!A||!B)return 40;return Math.round((Math.abs(A.x-B.x)+Math.abs(A.y-B.y)+4)/SPD*1.05)+8}

function planDay(p){
  var t=S.t,dow=dateOf(t).getUTCDay(),wk=dow>=1&&dow<=5,di=Math.floor(t/1440),a=ageOf(p),pl=[],H=p.home,J=p.job;
  function add(m,d){if(d>=0)pl.push([clamp(Math.round(m),0,1439),d])}
  function trip(from,m){var er=errands(p,a),cur=from,t=m,did=0;er.forEach(function(sb){var sh=nearSub(sb,cur);if(sh>=0){add(t,sh);t+=ri(25,60)+commute(cur,sh)*.5;cur=sh;did=1}});return did?t:null}
  function leisure(){var t0=trip(H,ri(600,1100));if(t0!=null)add(t0,H);if(rnd()<.18+(p.fun<50?.25:0)+(p.soc<50?.15:0)){var pk=nearest('park',H),m2=ri(600,1080);if(pk>=0){add(m2,pk);add(m2+ri(60,160),H)}}}
  if(H<0){var pk0=nearest('park',-1);if(pk0>=0){add(ri(480,720),pk0);add(ri(900,1200),pk0)}}
  else if(p.inj>t){var hs=nearest('hospital',H);add(0,hs>=0?hs:H)}
  else if(S.flu>t&&rnd()<.18)add(0,H);
  else if(a<7){add(0,H);if(rnd()<.2){var pk1=nearest('park',H),m3=ri(600,960);if(pk1>=0){add(m3,pk1);add(m3+ri(60,120),H)}}}
  else if(a<18){
    if(wk){var sc=nearest('school',H);if(sc>=0&&S.lots[sc].stu<80){S.lots[sc].stu++;add(450+ri(0,40),sc);add(840+ri(0,100),H);if(rnd()<.3){var pk2=nearest('park',sc);if(pk2>=0){add(840+ri(0,100),pk2);add(1080+ri(0,60),H)}}}else add(0,H)}
    else{if(rnd()<.4){var pk3=nearest('park',H),m4=ri(600,960);if(pk3>=0){add(m4,pk3);add(m4+ri(60,160),H)}}}
  }else if(J>=0&&a<retA(p)){
    var L=S.lots[J],T=BT[L.type],com=commute(H,J),idx=L.staff.indexOf(p.id),st,en,night=false,off=false;
    if(L.type==='hospital'||L.type==='police'){night=idx%2===1;st=night?1230:480;en=night?480:1230;off=((p.id+di)%7)<2}
    else if(L.type==='shop'){var late=idx%2===1;st=late?750:600;en=late?1260:1110;off=((p.id+di)%7)<1}
    else{st=L.type==='factory'?480:540;en=st+(L.type==='school'?500:540);off=!wk}
    if(off||L.cl||L.dmg>t)leisure();
    else if(night){add(480,H);if(p.pan<2){var tn=trip(H,620);if(tn!=null)add(tn,H)}add(Math.max(0,st-com),J)}
    else{add(Math.max(0,st-com),J);var r=rnd(),e=en+ri(0,30);
      if(((r<.45&&L.type!=='shop')||p.pan<2)){var t2=trip(J,e);if(t2!=null)add(t2,H);else add(e,H)}
      else if(r<.55){var pk4=nearest('park',J);if(pk4>=0){add(e,pk4);add(e+ri(50,110),H)}else add(e,H)}
      else add(e+commute(J,H)*.2,H)}
