<script>
(function(){
'use strict';

/* открывать там, где остановился: последний раздел страницы (hash) */
(function(){
  var k='lasthash:'+(location.pathname.split('/').pop()||'index.html'),skip=/^#(words\/study|placement)/;
  try{
    if(!location.hash){var h=localStorage.getItem(k);if(h&&h.length>1&&!skip.test(h))history.replaceState(null,'',location.pathname+location.search+h)}
    var sv=function(){try{if(location.hash.length>1&&!/^#home$/.test(location.hash))localStorage.setItem(k,location.hash);else localStorage.removeItem(k)}catch(e){}};
    window.addEventListener('hashchange',sv);sv();
  }catch(e){}
})();
var root=document.documentElement;
function $(s,e){return (e||document).querySelector(s)}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var view=$('#view');
var D=JSON.parse($('#edata').textContent),LS=D.lessons,RF=D.refs,BYID={};
LS.forEach(function(l,i){l.i=i;BYID[l.id]=l});
var PROF='nastya';
$('#b-back').setAttribute('href',PROF+'.html');

/* ---------- оформление (общее с разделом «Финансы») ---------- */
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme')}
var SKINS=[['auto','Как в системе','#F4F1E8','#1F6B57',''],['sepia','Сепия','#EFE3C8','#8A4B14','light'],['ocean','Океан','#E9F0F6','#1A5FA8','light'],
  ['dark','Ночь','#171611','#5FC2A3','dark'],['graphite','Графит','#15171B','#7BA7F5','dark'],['terminal','Терминал','#0A0A08','#FFB000','dark']];
function applySkin(id){
  var sk=SKINS.filter(function(x){return x[0]===id})[0];if(!sk){id='auto';sk=SKINS[0]}
  if(id==='auto'){root.removeAttribute('data-skin');applyTheme('')}
  else if(id==='light'||id==='dark'){root.removeAttribute('data-skin');applyTheme(id)}
  else{root.setAttribute('data-skin',id);applyTheme(sk[4])}
  try{var bg=getComputedStyle(root).getPropertyValue('--bg').trim();$$('meta[name=theme-color]').forEach(function(m){if(bg)m.setAttribute('content',bg)})}catch(e){}
}
function skinGet(){var v=store('fin:skin');if(v)return v;var t=store('theme');return t==='dark'||t==='light'?t:'auto'}
applySkin(skinGet());
function skinMenu(open){
  var m=document.getElementById('thm');
  if(!open){if(m)m.remove();return}
  if(m){m.remove();return}
  var cur=skinGet();m=document.createElement('div');m.id='thm';m.className='thm';m.setAttribute('role','menu');
  m.innerHTML='<p>Оформление</p>'+SKINS.map(function(x,i){return (i===1||i===3?'<div class="sep"></div>':'')+'<button type="button" role="menuitemradio" aria-checked="'+(x[0]===cur)+'" class="'+(x[0]===cur?'on':'')+'" data-skin="'+x[0]+'"><span class="skw" style="background:'+x[2]+'"><i style="background:'+x[3]+'"></i></span>'+x[1]+'</button>'}).join('');
  document.body.appendChild(m);
}

/* ---------- прогресс ---------- */
var P=(function(){try{var o=JSON.parse(store('eng:'+PROF)||'{}')||{};return {done:o.done||{},test:o.test||{},ex:o.ex||{},cards:o.cards||{},days:o.days||{},mode:o.mode||'en',start:o.start||13,pl:o.pl||null}}catch(e){return {done:{},test:{},ex:{},cards:{},days:{},mode:'en',start:1,pl:null}}})();
function pSave(){store('eng:'+PROF,JSON.stringify(P))}
function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
function act(n){var d=today();P.days[d]=(P.days[d]||0)+(n||1);var ks=Object.keys(P.days);if(ks.length>400){ks.sort(function(a,b){return a-b}).slice(0,ks.length-400).forEach(function(k){delete P.days[k]})}}
function streak(){var d=today(),n=0;if(!P.days[d])d--;while(P.days[d]){n++;d--}return n}
var INT=[0,1,2,4,7,15,30,60];
function ckey(l,w){return l.id+'|'+w.w.toLowerCase()}
function cardAdd(l){var n=0;l.words.forEach(function(w){var k=ckey(l,w);if(!P.cards[k]){P.cards[k]={b:0,d:today()};n++}});return n}
function dueList(filter){var d=today(),out=[];LS.forEach(function(l){if(filter&&filter!==l.id)return;l.words.forEach(function(w){var c=P.cards[ckey(l,w)];if(c&&c.d<=d)out.push({l:l,w:w,c:c,k:ckey(l,w)})})});return out}
function dueCount(){return dueList().length}
function allCards(){var n=0;for(var k in P.cards)n++;return n}
function badge(){var n=dueCount(),b=$('#bd');b.hidden=!n;b.textContent=n>99?'99+':n}

/* ---------- markdown ---------- */
marked.use({gfm:true,breaks:false,renderer:{
  table:function(h,b){return '<div class="tablewrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
function md(s){return marked.parse(s||'')}

/* ---------- проверка ответов ---------- */
function nrm(s){return String(s==null?'':s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/[,;:]/g,' ').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim().replace(/\s+/g,' ')}
function fillOk(item,v){var x=nrm(v);if(!x)return false;return item.a.some(function(a){return nrm(a)===x})}

/* ---------- состояние упражнений текущего урока ---------- */
var RS=null; /* {l:lesson, sets:{key:{checked,items:[{ok,forced,val}]}}} */
function setKey(si){return si==='T'?'T':'s'+si}
function itemsOf(l,si){return si==='T'?l.test:l.sets[si].items}

function itemHTML(it,si,ii){
  var id='e'+setKey(si)+'-'+ii,h='<div class="it" id="'+id+'" data-si="'+si+'" data-ii="'+ii+'"><span class="no">'+(ii+1)+'.</span><div class="bd2">';
  if(it.t==='c'){
    var q=esc(it.q).replace(/___/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
    h+='<div>'+q+'</div><div class="eo-w">'+it.o.map(function(o,j){return '<button type="button" class="eo" data-eo="'+j+'">'+esc(o)+'</button>'}).join('')+'</div>';
  }else{
    var parts=it.q.split('___');
    if(parts.length===2)h+=esc(parts[0])+'<input class="ei" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Ответ '+(ii+1)+'">'+esc(parts[1]);
    else h+='<div>'+esc(it.q)+'</div><input class="ei wide" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Ответ '+(ii+1)+'">';
  }
  return h+'<div class="fb" hidden></div></div></div>';
}
function setHTML(l,si){
  var items=itemsOf(l,si),h='';
  h+=items.map(function(it,ii){return itemHTML(it,si,ii)}).join('');
  var allc=l.id!=='_pl'&&items.every(function(x){return x.t==='c'});
  h+='<div class="sf">'+(allc?'':'<button type="button" class="btn sm" data-chk="'+si+'">Проверить</button>')+'<button type="button" class="btn sm ghost" data-rst="'+si+'" hidden>Ещё раз</button><span class="sc" id="sc'+setKey(si)+'"></span></div>';

    h+='<div class="tools">'+(dueCount()?'<button type="button" class="btn" data-restudy>Ещё 20</button>':'')+'<a class="btn ghost" href="#words">К словам</a></div>';
    view.innerHTML=h;badge();return;
  }
  var c=ST.q[0],w=c.w,front=P.mode==='en'?w.w:w.t,back=P.mode==='en'?w.t:w.w;
  var h='<a class="crumb" href="#words">← Слова</a><div class="pg-bar"><i style="width:'+Math.round((ST.n-ST.q.length)/ST.n*100)+'%"></i></div><div class="fc-wrap"><div class="fc" data-flip>'
   +'<div class="w">'+esc(front)+'</div>';
  if(ST.flip){h+='<div class="t">'+esc(back)+'</div><div class="x">'+esc(w.x)+'</div><div class="xr">'+esc(w.xr)+'</div>'}
  else{h+='<div class="hint">Вспомни, потом нажми на карточку</div>'}
  h+='</div>';
  if(ST.flip)h+='<div class="fc-b"><button type="button" class="btn red" data-rate="0">Не помню</button><button type="button" class="btn ghost" data-rate="1">Помню</button><button type="button" class="btn grn" data-rate="2">Легко</button></div>';
  else h+='<div class="fc-b" style="grid-template-columns:1fr"><button type="button" class="btn" data-flip>Показать ответ</button></div>';
  h+='<p class="lead" style="text-align:center;margin-top:12px;font-size:13.5px">Урок '+c.l.n+' · осталось '+ST.q.length+'</p></div>';
  view.innerHTML=h;
}
function rate(r){
  var c=ST.q.shift();var cd=P.cards[c.k];
  if(r===0){cd.b=0;cd.d=today();ST.again++;ST.q.splice(Math.min(3,ST.q.length),0,c)}
  else{cd.b=Math.min(INT.length-1,cd.b+(r===2?2:1));cd.d=today()+INT[cd.b];ST.ok++}
  act(1);pSave();ST.flip=false;badge();studyDraw();
}
var WL={q:'',n:60};
function wordsList(){
  setNav('words');document.title='Все слова · English';
  var h='<a class="crumb" href="#words">← Слова</a><h1 class="pg">Все слова</h1><div class="tools"><input type="search" id="wq" placeholder="Найти слово или перевод" value="'+esc(WL.q)+'" aria-label="Поиск слова"></div><div id="wlist"></div>';
  view.innerHTML=h;drawWL();
}
function drawWL(){
  var q=WL.q.toLowerCase().trim(),out=[];
  LS.forEach(function(l){l.words.forEach(function(w){if(!q||w.w.toLowerCase().indexOf(q)>=0||w.t.toLowerCase().indexOf(q)>=0)out.push({l:l,w:w})})});
  var shown=out.slice(0,WL.n);
  $('#wlist').innerHTML=shown.map(function(o){var k=ckey(o.l,o.w),c=P.cards[k];return '<div class="wl"><span><b>'+esc(o.w.w)+'</b><small>урок '+o.l.n+'</small></span><span>'+esc(o.w.t)+'<small>'+esc(o.w.x)+'</small></span>'+(c?'<span class="tag sc">в карточках</span>':'<button type="button" class="btn sm ghost" data-addone="'+esc(k)+'">+</button>')+'</div>'}).join('')
   +(out.length>shown.length?'<div class="tools" style="margin-top:12px"><button type="button" class="btn ghost" data-more>Показать ещё ('+(out.length-shown.length)+')</button></div>':'')+(out.length?'':'<div class="empty">Ничего не найдено.</div>');
}
function renderRef(id){
  setNav('ref');
  if(!id){document.title='Справочник · English';
    view.innerHTML='<h1 class="pg">Справочник</h1><p class="lead">Таблицы и списки, к которым удобно возвращаться: времена, неправильные глаголы, артикли, предлоги, фразовые глаголы, слова по темам и разговорные фразы.</p><div class="refs">'
     +RF.filter(function(r){return !/alfavit/.test(r.id)}).map(function(r){return '<a href="#ref/'+r.id+'"><b>'+esc(r.title)+'</b><small>'+esc(r.short)+'</small></a>'}).join('')+'</div>';return}
  var r=RF.filter(function(x){return x.id===id})[0];if(!r){location.hash='#ref';return}
  document.title=r.title+' · English';
  var i=RF.indexOf(r),pv=RF[i-1],nx=RF[i+1];
  view.innerHTML='<a class="crumb" href="#ref">← Справочник</a><h1 class="pg">'+esc(r.title)+'</h1><p class="lead">'+esc(r.short)+'</p><div class="prose">'+md(r.md.replace(/^#\s.*\n/,''))+'</div>'
   +'<div class="pager">'+(pv?'<a class="pv" href="#ref/'+pv.id+'"><small>← Назад</small><b>'+esc(pv.title)+'</b></a>':'<span></span>')+(nx?'<a class="nx" href="#ref/'+nx.id+'"><small>Дальше →</small><b>'+esc(nx.title)+'</b></a>':'')+'</div>';
}

/* ---------- маршруты ---------- */
var lastRoute='';
function route(){
  var h=location.hash.slice(1)||'home',p=h.split('/'),same=h===lastRoute;lastRoute=h;badge();
  skinMenu(false);
  if(p[0]==='lesson'){renderLesson(p[1],p[2])}
  else if(p[0]==='placement'){renderPlacement()}
  else if(p[0]==='words'){if(p[1]==='study'){studyStart()}else if(p[1]==='list'){wordsList()}else wordsDash()}
  else if(p[0]==='ref'){renderRef(p[1])}
  else renderHome();
  if(!(p[0]==='lesson'&&p[2]))window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(!t.closest)return;
  if(t.closest('#b-theme')){e.stopPropagation();skinMenu(true);return}
  if(b=t.closest('#thm [data-skin]')){var id=b.getAttribute('data-skin');store('fin:skin',id);if(id==='light'||id==='dark')store('theme',id);applySkin(id);skinMenu(false);return}
  if(document.getElementById('thm')&&!t.closest('#thm'))skinMenu(false);
  if(b=t.closest('[data-sz]')){if(window.siteZoom)window.siteZoom(+b.getAttribute('data-sz'));return}
  if(b=t.closest('[data-go]')){var el=document.getElementById(b.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b=t.closest('[data-showbase]')){SHOWBASE=!SHOWBASE;filterHome();return}
  if(b=t.closest('[data-hf]')){HOME_F=b.getAttribute('data-hf');$$('[data-hf]').forEach(function(x){x.classList.toggle('on',x===b)});filterHome();return}
  if(b=t.closest('[data-eo]')){pickOpt(b);return}
  if(b=t.closest('[data-chk]')){var si=b.getAttribute('data-chk');checkSet(si==='T'?'T':+si);return}
  if(b=t.closest('[data-rst]')){var s2=b.getAttribute('data-rst');resetSet(s2==='T'?'T':+s2);return}
  if(b=t.closest('[data-force]')){var q=b.getAttribute('data-force').split(':');forceItem(q[0],+q[1]);return}
  if(b=t.closest('[data-addw]')){var l=BYID[b.getAttribute('data-addw')],n=cardAdd(l);act(1);pSave();b.disabled=true;b.textContent='✓ Слова в карточках';badge();return}
  if(b=t.closest('[data-hidet]')){var bx=$('#wbox').parentNode;bx.classList.toggle('hidet');b.textContent=bx.classList.contains('hidet')?'Показать переводы':'Скрыть переводы';return}
  if(b=t.closest('.hidet .tr,.hidet .xr')){b.classList.toggle('show');return}
  if(b=t.closest('[data-hrus]')){var d=$('#dbox').parentNode;d.classList.toggle('hiderus');b.textContent=d.classList.contains('hiderus')?'Показать перевод':'Скрыть перевод';return}
  if(b=t.closest('[data-done]')){var l2=BYID[b.getAttribute('data-done')];if(P.done[l2.id]){delete P.done[l2.id]}else{P.done[l2.id]=Date.now();cardAdd(l2);act(2)}pSave();badge();var bar=$('#donebar'),dn=!!P.done[l2.id];bar.classList.toggle('ok',dn);b.textContent=dn?'✓ Урок пройден (снять отметку)':'Отметить урок пройденным';return}
  if(b=t.closest('[data-mode]')){P.mode=b.getAttribute('data-mode');pSave();wordsDash();return}
  if(b=t.closest('[data-flip]')){if(ST&&ST.q.length&&!ST.flip){ST.flip=true;studyDraw()}return}
  if(b=t.closest('[data-rate]')){rate(+b.getAttribute('data-rate'));return}
  if(t.closest('[data-restudy]')){studyStart();return}
  if(b=t.closest('[data-addone]')){var k=b.getAttribute('data-addone');P.cards[k]={b:0,d:today()};pSave();badge();var sp=document.createElement('span');sp.className='tag sc';sp.textContent='в карточках';b.replaceWith(sp);return}
  if(t.closest('[data-more]')){WL.n+=60;drawWL();return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='lq')filterHome();
  else if(t.id==='wq'){WL.q=t.value;WL.n=60;drawWL()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')skinMenu(false);
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ei')){
    e.preventDefault();var it=e.target.closest('.it'),all=$$('.ei',it.closest('.set')),i=all.indexOf(e.target);
    if(all[i+1]&&!all[i+1].readOnly)all[i+1].focus();else{var cb=$('[data-chk]',it.closest('.set'));if(cb&&!cb.hidden)cb.click()}
  }
});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
route();
})();
</script>
</body></html>
