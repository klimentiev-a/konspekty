<style>
:root{
  --bg:#F4F1E8;--rail:#ECE8DB;--surface:#FBF9F3;--fg:#25221C;--muted:#665F52;--faint:#857E6E;
  --line:#D9D3C2;--line2:#E5E0D2;--accent:#1F6B57;--accent2:#A93D28;--mark:#F5DC94;--up:#1E7B45;--down:#B3261E;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171611;--rail:#1D1C16;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;
  --line:#33312A;--line2:#292820;--accent:#5FC2A3;--accent2:#E8886B;--mark:#5B4A17;--up:#4CC17E;--down:#F07167;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171611;--rail:#1D1C16;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;
  --line:#33312A;--line2:#292820;--accent:#5FC2A3;--accent2:#E8886B;--mark:#5B4A17;--up:#4CC17E;--down:#F07167;color-scheme:dark}
/* оформления: data-skin (плюс data-theme=light|dark, чтобы карта и графики брали нужную палитру) */
:root[data-skin="sepia"]{--bg:#EFE3C8;--rail:#E6D8B9;--surface:#F7EDD7;--fg:#3B2F1E;--muted:#6F5E45;--faint:#8E7C60;--line:#D2C09A;--line2:#DECDAA;--accent:#8A4B14;--accent2:#A33B2A;--mark:#F0CF7A;--up:#2E6B2E;--down:#A8321F}
:root[data-skin="ocean"]{--bg:#E9F0F6;--rail:#DCE7F0;--surface:#F7FAFD;--fg:#14283A;--muted:#4B6277;--faint:#7289A0;--line:#C5D4E1;--line2:#D6E1EB;--accent:#1A5FA8;--accent2:#C2561F;--mark:#FFE08A;--up:#1B7A47;--down:#B3261E}
:root[data-skin="graphite"]{--bg:#15171B;--rail:#1B1E23;--surface:#1F2227;--fg:#E6E8EC;--muted:#9AA1AD;--faint:#6F7683;--line:#2E3239;--line2:#262A30;--accent:#7BA7F5;--accent2:#F2A65A;--mark:#3C4A66;--up:#4FC27F;--down:#F07167}
:root[data-skin="terminal"]{--bg:#0A0A08;--rail:#11100C;--surface:#15140F;--fg:#F0D9A0;--muted:#B79A55;--faint:#7E6A3A;--line:#3A3115;--line2:#2A240F;--accent:#FFB000;--accent2:#FF6A3D;--mark:#5A4300;--up:#7DDB6A;--down:#FF6B5B;--sans:var(--mono)}
:root[data-skin="violet"]{--bg:#130F22;--rail:#0E0A1A;--surface:#1B1530;--fg:#E6E0F5;--muted:#AFA5CC;--faint:#8174A6;--line:#342A55;--line2:#251D40;--accent:#B794FF;--accent2:#FF7AC6;--mark:#4A2E80;--up:#5FD08A;--down:#FF7A8A}
:root[data-skin="amber"]{--bg:#17110D;--rail:#110C09;--surface:#211812;--fg:#EFE3D3;--muted:#B9A58E;--faint:#8C7A65;--line:#3D2E22;--line2:#2B2018;--accent:#F0A35C;--accent2:#E8D27A;--mark:#6B4220;--up:#8FCB6A;--down:#F0745A}
.thm{position:fixed;z-index:80;top:calc(54px + env(safe-area-inset-top,0px));right:10px;width:min(280px,calc(100vw - 20px));padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.thm p{margin:6px 8px 8px;font:600 13px/1.2 var(--sans);color:var(--muted)}
.thm button{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;font:500 15px/1.2 var(--sans);color:var(--fg)}
.thm button:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.thm button.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.thm button.on::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:700}
.thm .skw{flex:none;width:34px;height:24px;border-radius:7px;border:1px solid rgba(128,128,128,.35);position:relative;overflow:hidden}
.thm .skw i{position:absolute;right:0;bottom:0;width:16px;height:12px;border-top-left-radius:6px}
.thm .sep{height:1px;margin:6px 4px;background:var(--line2)}
[hidden]{display:none!important}
*{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}a,button,summary,label,input,select{touch-action:manipulation}
@media(hover:none){a,button,summary,.chip,.card{transition:opacity .16s ease,transform .16s ease,background-color .2s ease}a:active,button:active,summary:active,.chip:active{opacity:.62}.card:active{transform:scale(.985)}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--mark)}


/* нижнее меню на телефоне */
.bnav{display:none}
@media (max-width:760px){
  #sw{display:none}.top .zm{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bg);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--faint);font:500 11px/1.1 var(--sans)}
  .bnav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bnav a.on{color:var(--accent)}.bnav a.on svg{stroke-width:2.1}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  #totop{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .hero{padding-top:20px}.hero>p{display:none}.hero .howto p{font-size:13.5px}
  html.wfs-lock .bnav{display:none}
}
/* главная */
.hm{padding-top:22px}.hm h1{margin:0;font:600 clamp(30px,6vw,44px)/1.1 var(--serif);letter-spacing:-.02em}.hm .hm-sub{margin:8px 0 0;color:var(--muted);font:400 16px/1.5 var(--serif)}
.hm-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
@media (min-width:900px){.hm-cards{grid-template-columns:repeat(4,1fr)}}
.hm-card{display:flex;flex-direction:column;gap:6px;min-height:132px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;color:var(--fg)}
.hm-card:hover{border-color:var(--faint)}
.hm-card svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hm-card b{font:600 18px/1.2 var(--serif)}.hm-card span{font:400 13.5px/1.4 var(--sans);color:var(--muted)}.hm-card em{margin-top:auto;font:600 12.5px/1.2 var(--sans);font-style:normal;color:var(--accent)}
.hm-resume{display:flex;flex-direction:column;gap:3px;margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:var(--surface);text-decoration:none}
.hm-resume small{font:500 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.hm-resume b{font:600 17px/1.3 var(--serif)}
.hm-sec{margin-top:28px}.hm-sec h2{margin:0 0 6px;font:600 13px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.hm-list{display:grid;grid-template-columns:1fr;gap:0 24px}@media (min-width:700px){.hm-list{grid-template-columns:1fr 1fr}}
.hm-list a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--line2);text-decoration:none;font:500 16px/1.3 var(--sans)}
.hm-list a small{display:block;margin-top:2px;font:400 13px/1.3 var(--sans);color:var(--muted)}.hm-list a::after{content:"›";color:var(--faint);font-size:20px}
.hm-set{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:8px;color:var(--muted);font:400 14px var(--sans)}
.hm-set .zm{display:flex}
/* блоки обучения сворачиваются */
.trk-nav{display:flex;gap:8px;overflow-x:auto;margin:22px calc(var(--gut)*-1) 0;padding:2px var(--gut);scrollbar-width:none}.trk-nav::-webkit-scrollbar{display:none}
.trk-nav a{flex:none;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);text-decoration:none;font:500 13.5px/1 var(--sans);color:var(--muted);white-space:nowrap}
.trk-nav a:hover{border-color:var(--faint);color:var(--fg)}
.track{scroll-margin-top:110px}

/* шапка */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:4px;max-width:1180px;margin:0 auto;padding:6px 8px 0 var(--gut);min-height:52px}
.home{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;border-radius:10px;color:var(--muted);text-decoration:none}
.home:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.home svg,.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand{margin-right:auto;font:600 21px/1 var(--serif);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.top .zm{display:none}.zm{display:flex;align-items:center;margin-right:4px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.zm button{height:32px;padding:0 9px;font:600 13px/1 var(--sans);color:var(--muted)}
.zm button:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.zm .szv{min-width:44px;padding:0 4px;font-weight:500;font-size:12px;border-inline:1px solid var(--line2)}
@media (max-width:420px){.zm .szv{display:none}.zm button{padding:0 8px}}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.ibtn:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.sw{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:4px var(--gut) 0}
.sw a{position:relative;padding:10px 12px 12px;text-decoration:none;color:var(--muted);font:600 15px/1 var(--sans)}
.sw a.on{color:var(--fg)}
.sw a.out{margin-left:auto;color:var(--accent2);white-space:nowrap}
@media (max-width:520px){.sw{gap:0;padding-left:8px;padding-right:8px}.sw a{padding:10px 8px 12px;font-size:14px}}
.sw{overflow-x:auto;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}.sw a{flex:none}
.sw a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.search{display:none;align-items:center;gap:8px;max-width:1180px;margin:4px auto 8px;padding:0 var(--gut)}
.search.on{display:flex}
.search input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:400 16px var(--sans);outline:0}
.search input:focus{border-color:var(--faint)}

main{max-width:1180px;margin:0 auto;padding:0 var(--gut) 96px;min-width:0}
.sub{display:flex;gap:8px;overflow-x:auto;margin:16px calc(var(--gut)*-1) 0;padding:0 var(--gut) 4px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg a{display:flex;flex-direction:column;gap:2px;padding:10px 8px;text-align:center;text-decoration:none;color:var(--muted);border-left:1px solid var(--line)}
.seg a:first-child{border-left:0}.seg a b{font:600 15px/1.2 var(--sans)}.seg a small{font:400 11.5px/1.25 var(--sans);color:var(--faint)}
.seg a.on{background:var(--fg);color:var(--bg)}.seg a.on small{color:var(--bg);opacity:.75}
.sub2{margin-top:10px}
.cglabel{margin:14px 0 0;font:600 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.fold{border-top:1px solid var(--line)}.fold:last-child{border-bottom:1px solid var(--line)}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.fold>summary::-webkit-details-marker{display:none}.fold>summary h2{margin:0;font:600 17px/1.3 var(--serif)}
.fold>summary::after{content:"+";font:400 22px/1 var(--sans);color:var(--faint)}.fold[open]>summary::after{content:"–"}
.fold[open]>summary{padding-bottom:6px}.fold>.tiles{margin-bottom:14px}
@media (max-width:420px){.seg a small{display:none}.seg a{padding:12px 6px}}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font:500 14px/1.2 var(--sans);white-space:nowrap;background:none;min-height:40px;display:inline-flex;align-items:center}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip:hover:not(.on){color:var(--fg);border-color:var(--faint)}

/* обучение: оглавление */
.hero{padding:34px 0 8px}
.hero h1{margin:0;font:600 clamp(26px,6vw,46px)/1.1 var(--serif);letter-spacing:-.02em}
.hero p{margin:12px 0 0;max-width:60ch;font:400 17px/1.55 var(--serif);color:var(--muted)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:26px}
.ch{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;min-width:0}
.ch:hover{border-color:var(--faint)}
.ch .n{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:600 14px/1 var(--mono)}
.ch b{display:block;font:600 17px/1.3 var(--serif)}
.ch i{display:block;margin-top:3px;font:400 13.5px/1.4 var(--sans);font-style:normal;color:var(--muted)}

/* глава */
.doc{display:grid;grid-template-columns:minmax(0,1fr);gap:0 56px;padding-top:28px}
.art{min-width:0;max-width:760px;width:100%;margin:0 auto}
.art.wide{max-width:1080px}
.art.wide .prose table{table-layout:fixed}
.art.wide .prose th:nth-child(1){width:17%}.art.wide .prose th:nth-child(2){width:17%}.art.wide .prose th:nth-child(3){width:34%}
.art.wide .prose td code{display:block;white-space:normal;font:600 .95em var(--mono);padding:7px 10px;border-radius:8px;background:var(--rail);border:1px solid var(--line2);line-height:1.5;overflow-wrap:anywhere}
.art.wide .prose td .fx{display:block;margin-top:6px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.art.wide .prose tr.flash td{background:rgba(255,200,0,.22);transition:background .6s}
@media (max-width:760px){.art.wide .prose table{table-layout:auto}}
.doc:has(.art.wide){grid-template-columns:minmax(0,1080px);justify-content:center}.doc:has(.art.wide) .side{display:none}
.eyebrow{margin:0 0 10px;font:500 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:var(--accent);text-decoration:none}
.art h1{margin:0 0 22px;font:600 clamp(28px,5vw,40px)/1.15 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.toc{margin:0 0 26px;border-block:1px solid var(--line)}
.toc summary{list-style:none;padding:12px 0;cursor:pointer;font:500 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toc summary::-webkit-details-marker{display:none}
.toc a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);font:400 14.5px/1.4 var(--sans)}
.toc a:hover{color:var(--fg)}
.toc nav{padding-bottom:10px}
.side{display:none}
.prose{font:400 17px/1.7 var(--sans);overflow-wrap:break-word}
.prose>:first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose h2{margin:2.2em 0 .7em;padding-top:1.1em;border-top:1px solid var(--line);font:600 24px/1.25 var(--serif);scroll-margin-top:120px}
.prose h3{margin:1.8em 0 .6em;font:600 19px/1.35 var(--serif);scroll-margin-top:120px}
.prose h4{margin:1.5em 0 .5em;font:600 17px/1.35 var(--sans)}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:650}
.prose a{color:var(--accent);text-underline-offset:3px}
.prose blockquote{margin:1.3em 0;padding:12px 16px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.prose blockquote p:last-child{margin:0}
.prose code{font:.86em var(--mono);padding:.1em .35em;border-radius:5px;background:var(--rail)}
.f{margin:1.1em 0 1.3em;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);font:500 14.5px/1.75 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.prose table,.dt{width:100%;border-collapse:collapse;font:400 14.5px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.prose th,.prose td,.dt th,.dt td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
.prose th,.dt th{font:600 11.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--rail);border-bottom:1px solid var(--line)}
.prose td{min-width:6em}
.prose tr:last-child td,.dt tr:last-child td{border-bottom:0}
details.qa{border-bottom:1px solid var(--line)}
details.qa:first-of-type{border-top:1px solid var(--line)}
details.qa>summary{list-style:none;display:flex;gap:12px;padding:13px 0;cursor:pointer;font:500 16px/1.45 var(--sans)}
details.qa>summary::-webkit-details-marker{display:none}
details.qa>summary span{flex:none;min-width:2em;color:var(--faint);font:500 13px/1.6 var(--mono)}
details.qa[open]>summary{color:var(--accent)}

function bondCalc(){

  if(!(fv>0&&c>=0&&n>0&&p>0))return '<p class="note">Заполни поля.</p>';
  var N=Math.max(1,Math.round(n*m)),cp=fv*c/m;
  function price(r){var s=0;for(var t=1;t<=N;t++)s+=cp/Math.pow(1+r,t);return s+fv/Math.pow(1+r,N)}
  var lo=-0.99,hi=5;for(var i=0;i<200;i++){var mid=(lo+hi)/2;if(price(mid)>p)lo=mid;else hi=mid}

  for(var i=0;i<200;i++){var m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2;
}

  function bars(o){var k=Object.keys(o).sort(function(p,q){return o[q]-o[p]}),m=o[k[0]]||1;return k.slice(0,10).map(function(n){return '<div class="rk-cnt"><span>'+esc(n)+'</span><div><i style="width:'+(o[n]/m*100)+'%"></i></div><b>'+o[n]+'</b></div>'}).join('')}

function lfDraw(){

    '<div class="lf-h">'+th('n','Страна')+th('g','Зарплата, $')+th('t','Налог')+th('net','На руках, $')+'</div>';

  var W=WM.wages;h+='<details class="wcalc wsrcd"><summary>ⓘ Откуда цифры и что учесть</summary>'+esc((W&&W.countries&&W.countries.definition)||'')+'<br><br>Налоги: '+esc((LF.tax&&LF.tax.source)||'')+'. '+esc((LF.tax&&LF.tax.def)||'')+' '+esc((LF.tax&&LF.tax.note)||'')+'<br><br>Зарплата и налоги — за разные годы и по разным определениям, а курс и ППС — отдельные ряды, поэтому небольшие расхождения нормальны. «На руках» — это зарплата минус налоги и взносы работника, без цен на жильё и услуги и без налогов работодателя. Считается для средней зарплаты, а не для любой суммы: налоги растут вместе с доходом.</details>';
  el.innerHTML=h}

/* ---------- запоминаем место чтения ---------- */
(function(){
  var SK='scrollpos',hold=0,tgt=null,st=0;
  try{history.scrollRestoration='manual'}catch(e){}
  function rd(){try{var o=JSON.parse(localStorage.getItem(SK)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}}
  function wr(o){try{var ks=Object.keys(o);if(ks.length>80){ks.sort(function(a,b){return (o[a].t||0)-(o[b].t||0)});ks.slice(0,ks.length-80).forEach(function(k){delete o[k]})}localStorage.setItem(SK,JSON.stringify(o))}catch(e){}}
  function key(){return window.__scrollKey?window.__scrollKey():location.pathname.split('/').pop()+location.hash}
  function save(){
    if(Date.now()<hold)return;var k=key();if(!k)return;
    var y=Math.round(window.scrollY),o=rd();if(y<120)delete o[k];else o[k]={y:y,t:Date.now()};wr(o);
  }
  window.addEventListener('scroll',function(){clearTimeout(st);st=setTimeout(save,250)},{passive:true});
  ['touchstart','wheel','keydown','mousedown'].forEach(function(ev){window.addEventListener(ev,function(){hold=0;tgt=null},{passive:true,capture:true})});
  window.addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
  window.__holdScroll=function(){hold=Date.now()+600};
  window.__restoreScroll=function(){
    var k=key(),e=k&&rd()[k];hold=Date.now()+2500;tgt=e&&e.y>0?e.y:null;
    if(tgt===null){hold=Date.now()+300;return false}
    var tries=0;
    (function go(){
      if(tgt===null)return;
      var max=document.documentElement.scrollHeight-window.innerHeight;
      window.scrollTo({top:Math.min(tgt,Math.max(0,max)),behavior:'instant'});
      if(max>=tgt-2){hold=Date.now()+400;return}
      if(++tries>20){hold=0;return}
      setTimeout(go,150);
    })();
    return true;
  };
})();

  }else if(sec==='world'){

    else if(p[1]==='companies'){renderScreener();document.title='Компании · Мир · Финансы'}

    else if(p[1]==='sectors'){var sc=SEC.filter(function(x){return x.id===p[2]})[0];
      if(sc){renderChapter(sc);document.title=sc.title+' · Сектора · Финансы'}else{renderSectors();document.title='Сектора мировой экономики · Финансы'}}
    else{WDEEP=(p[1]==='country'&&p[2])?{country:p[2]}:(p[1]&&p[1]!=='map'&&p[2])?{layer:p[1],name:p.slice(2).join('/')}:null;if(!WDEEP){WS.layer='countries';WS.sel=null}renderWorld();document.title='Карта мира · Финансы'}
  }else{

    if(c){renderChapter(c);document.title=c.title+' · Финансы';store('fin:last',c.id);if(c.id==='glossariy'&&p[2])glFocus(p.slice(2).join('/'))}else{renderLearn();document.title='Финансы'}
