<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<!--GATE-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Рынок: что шарить · Терминал</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#F4F4F0;--surface:#FFFFFF;--fg:#191A17;--muted:#5E6058;--faint:#8C8E85;--line:#DCDCD3;--accent:#B86E00;--up:#127A43;--dn:#C0352B;--ru:#B4472F;--w:#2F5DA8;--head:#ECECE5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0C0A;--surface:#121410;--fg:#DCE0D4;--muted:#9AA08F;--faint:#6B7062;--line:#262A22;--accent:#FFB000;--up:#4FD18B;--dn:#FF6B5B;--ru:#FF8F6B;--w:#7FB2FF;--head:#191C16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0C0A;--surface:#121410;--fg:#DCE0D4;--muted:#9AA08F;--faint:#6B7062;--line:#262A22;--accent:#FFB000;--up:#4FD18B;--dn:#FF6B5B;--ru:#FF8F6B;--w:#7FB2FF;--head:#191C16;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14.5px/1.5 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.tick,table td.n,h1,.tabs button,.th{font-family:'IBM Plex Mono',ui-monospace,monospace}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.bar .meta{color:var(--faint);font-size:12px}
.tb{margin-left:auto;width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.tick{display:flex;gap:22px;overflow-x:auto;white-space:nowrap;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;background:var(--head);scrollbar-width:none}
.tick::-webkit-scrollbar{display:none}.tick span b{color:var(--muted);font-weight:500;margin-right:6px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;background:var(--surface);position:sticky;top:0;z-index:5;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--muted);padding:12px 12px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pane{max-width:1280px;margin:0 auto;padding:16px 16px 90px}
.sc{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:600 11px/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:9px 10px;background:var(--head);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
td.w{min-width:240px;color:var(--muted)}
td:first-child{font-weight:600;min-width:150px}
.up{color:var(--up)}.dn{color:var(--dn)}
.rg{font:600 10.5px/1 'IBM Plex Mono',monospace;padding:2px 5px;border-radius:3px;color:var(--c);border:1px solid var(--c)}
.srcl{font-size:11.5px;color:var(--faint);margin-right:8px;text-decoration:none;border-bottom:1px dotted var(--line)}
.th{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:10px}
.th>div{padding:10px 12px}
.th .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--head)}
.th .hd b{font-size:14px;color:var(--fg)}.th .hd span{color:var(--c);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.th .bd{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px}
@media(max-width:800px){.th .bd{grid-template-columns:1fr}}
.th ul{margin:0;padding-left:16px}.th li{margin:3px 0}
.th .ch{color:var(--muted);font-size:12.5px;margin-top:8px}.th .ch em{font-style:normal;color:var(--accent)}
.th .say{border-left:2px solid var(--accent);padding-left:10px;margin-top:8px}
.lbl{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
h2{font:600 13px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px}
.dd{color:var(--faint);font-size:12px}
ul.pl{padding-left:18px}ul.pl li{margin:6px 0}
</style>
<!--ZOOM-->
</head><body>
<div class="bar"><h1>RYNOK&gt; что шарить</h1><span class="meta" id="meta"></span><button class="tb" id="tb" type="button" aria-label="Тема"></button></div>
<div class="tick" id="tick"></div>
<div class="tabs" id="tabs"><button data-t="sum" class="on">Сводка</button><button data-t="ru">Россия</button><button data-t="world">Мир</button><button data-t="co">Компании</button><button data-t="cal">Календарь</button><button data-t="say">Фразы</button><button data-t="src">Источники</button></div>
<div class="pane" id="pane"></div>
<!--COMMON-->
<script>
(function(){
var $=function(i){return document.getElementById(i)},E=R.esc,LV=null,TAB='sum';
R.themeBtn($('tb'));$('meta').textContent='снимок '+D.asof;
function col(r){return r==='ru'?'var(--ru)':'var(--w)'}
function rg(r){return '<span class="rg" style="--c:'+col(r)+'">'+(r==='ru'?'RU':'WORLD')+'</span>'}
function tick(){$('tick').innerHTML=D.kpi.map(function(k){var l=LV&&LV[k.id];var ch=l&&l.ch!=null?' <span class="'+(l.ch>=0?'up':'dn')+'">'+R.pct(l.ch)+'</span>':'';return '<span><b>'+E(k.en)+'</b>'+E(l?l.txt:k.value)+ch+'</span>'}).join('')}
function sum(){return '<h2>Индикаторы</h2><div class="sc"><table><tr><th>Показатель</th><th></th><th>Значение</th><th>Изм.</th><th>Дата</th><th>Что значит</th><th>Источник</th></tr>'+
 D.kpi.map(function(k){var l=LV&&LV[k.id];return '<tr><td>'+E(k.label)+'<div class="dd">'+E(k.en)+'</div></td><td>'+rg(k.region)+'</td><td class="n">'+E(l?l.txt:k.value)+'</td><td class="n '+(l&&l.ch!=null?(l.ch>=0?'up':'dn'):'')+'">'+(l&&l.ch!=null?R.pct(l.ch):'<span class="dd">'+E(k.delta)+'</span>')+'</td><td class="n dd">'+E(l?'сейчас':k.date)+'</td><td class="w">'+E(k.why)+'</td><td>'+R.links(k.src)+'</td></tr>'}).join('')+'</table></div>'+
 '<h2>Коротко за 60 секунд</h2><ul class="pl">'+D.pitch.map(function(p){return '<li>'+E(p)+'</li>'}).join('')+'</ul>'+
 '<h2>Темы</h2><div class="sc"><table><tr><th>Тема</th><th></th><th>Суть</th></tr>'+D.themes.map(function(t){return '<tr><td>'+E(t.title)+'</td><td>'+rg(t.region)+'</td><td class="w">'+E(t.lead)+'</td></tr>'}).join('')+'</table></div>'}
function themes(r){return D.themes.filter(function(t){return t.region===r}).map(function(t){return '<div class="th" style="--c:'+col(t.region)+'"><div class="hd"><span>'+E(t.tag)+'</span><b>'+E(t.title)+'</b></div><div class="bd"><div><p style="margin:0 0 8px">'+E(t.lead)+'</p><ul>'+t.facts.map(function(f){return '<li>'+E(f)+'</li>'}).join('')+'</ul></div>'+
 '<div><p class="lbl">Цепочка</p><div class="ch">'+t.chain.map(E).join(' <em>→</em> ')+'</div><p class="lbl" style="margin-top:12px">Вывод</p><div>'+E(t.so)+'</div><div class="say">'+E(t.say)+'</div><div style="margin-top:8px">'+R.links(t.src)+'</div></div></div></div>'}).join('')}
function co(){return '<div class="sc"><table><tr><th>Компания</th><th>Тикер</th><th>Факт</th><th>Важно</th><th>Источник</th></tr>'+D.companies.map(function(c){return '<tr><td>'+E(c.name)+'</td><td class="n">'+E(c.tic)+'</td><td>'+E(c.fact)+'</td><td class="w">'+E(c.note)+'</td><td>'+R.links([c.src])+'</td></tr>'}).join('')+'</table></div>'}
function cal(){return '<div class="sc"><table><tr><th>Дата</th><th>Дней</th><th></th><th>Событие</th><th>Почему важно</th></tr>'+D.calendar.map(function(c){var d=R.days(c.date);return '<tr><td class="n">'+(c.approx?E(c.approx):R.dateRu(c.date))+'</td><td class="n">'+(d>0?d:'—')+'</td><td>'+rg(c.region)+'</td><td>'+E(c.title)+'</td><td class="w">'+E(c.why)+'</td></tr>'}).join('')+'</table></div>'}
function say(){return '<h2>Фразы</h2><ul class="pl">'+D.phrases.map(function(p){return '<li>'+E(p)+'</li>'}).join('')+'</ul><h2>Вопрос → ответ</h2><div class="sc"><table><tr><th>Вопрос</th><th>Ответ</th></tr>'+D.themes.map(function(t){return '<tr><td>'+E(t.q)+'</td><td class="w" style="color:var(--fg)">'+E(t.a)+'</td></tr>'}).join('')+'</table></div>'+
 '<h2>Форумы и аналитики</h2><ul class="pl">'+D.forum.map(function(f){return '<li>'+E(f.text)+' '+R.links([f.src])+'</li>'}).join('')+'</ul>'}
function src(){return '<ol class="pl">'+D.sources.map(function(s){return '<li><a href="'+E(s.u)+'" target="_blank" rel="noopener" style="color:inherit">'+E(s.t)+'</a></li>'}).join('')+'</ol>'}
function draw(){tick();$('pane').innerHTML=TAB==='sum'?sum():TAB==='ru'?'<h2>Россия</h2>'+themes('ru'):TAB==='world'?'<h2>Мир</h2>'+themes('world'):TAB==='co'?'<h2>Компании</h2>'+co():TAB==='cal'?'<h2>Календарь</h2>'+cal():TAB==='say'?say():'<h2>Источники</h2>'+src()}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;[].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});try{history.replaceState(null,'','#'+TAB)}catch(er){}draw();window.scrollTo(0,0)});
var h=(location.hash||'').slice(1);if(/^(sum|ru|world|co|cal|say|src)$/.test(h)){TAB=h;[].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x.dataset.t===h)})}
draw();R.live(function(L,u){if(L){LV=L;$('meta').textContent='снимок '+D.asof+' · цены '+u;draw()}});
})();
</script>
</body></html>
