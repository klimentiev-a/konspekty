<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<!--GATE-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Рынок: что шарить · Карточки</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#EEF2F4;--surface:#FFFFFF;--fg:#14202A;--muted:#5A6873;--faint:#8794A0;--line:#DCE3E8;--accent:#1F6B57;--ru:#B4472F;--w:#2F5DA8;--up:#17804F;--dn:#C23A2B;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1418;--surface:#172027;--fg:#E3EAEE;--muted:#9BA9B3;--faint:#6F7D88;--line:#25313A;--accent:#5FC2A3;--ru:#F08B6E;--w:#7FA8F0;--up:#5ED39A;--dn:#FF8A78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1418;--surface:#172027;--fg:#E3EAEE;--muted:#9BA9B3;--faint:#6F7D88;--line:#25313A;--accent:#5FC2A3;--ru:#F08B6E;--w:#7FA8F0;--up:#5ED39A;--dn:#FF8A78;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15.5px/1.5 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 90px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{margin:0;font:700 clamp(26px,4vw,38px)/1.1 'IBM Plex Sans',sans-serif;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:4px}
.tb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;cursor:pointer}
.upd{font-size:12.5px;color:var(--faint);margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.k .l{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.k .l i{font-style:normal;font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.k .v{font:700 25px/1.15 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.k .d{font-size:12.5px;font-weight:600}.k .w{font-size:12.5px;color:var(--muted);line-height:1.4}
.up{color:var(--up)}.dn{color:var(--dn)}.nt{color:var(--faint)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 12px;position:sticky;top:0;z-index:5;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:600 13.5px/1 inherit;cursor:pointer;min-height:36px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;border-top:4px solid var(--c);min-width:0}
.c .tg{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}.c .tg b{color:var(--c);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.c h3{margin:0;font:700 19px/1.25 'IBM Plex Sans',sans-serif;letter-spacing:-.01em}
.c p{margin:0}
.c details{border-top:1px solid var(--line);padding-top:8px}
.c summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent);list-style:none;min-height:28px;display:flex;align-items:center}
.c summary::-webkit-details-marker{display:none}.c summary::before{content:'▸';margin-right:6px;transition:transform .15s}.c details[open] summary::before{transform:rotate(90deg)}
.c ul{margin:6px 0 0;padding-left:18px;font-size:14.5px}.c li{margin:4px 0}
.c .so{font-size:14px;color:var(--muted)}
.say{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-radius:12px;padding:10px 12px;font-size:14.5px;position:relative}
.say b{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.cp{border:0;background:none;color:var(--accent);font:600 12px/1 inherit;cursor:pointer;padding:4px 0;text-transform:none;letter-spacing:0}
.srcl{font-size:12px;color:var(--faint);margin-right:9px;text-decoration:none;border-bottom:1px dotted var(--line)}
h2{font:700 20px/1.2 'IBM Plex Sans',sans-serif;margin:36px 0 12px}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.co{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px}.co b{font-size:15px}.co code{font:600 11px/1 ui-monospace,monospace;color:var(--faint);margin-left:6px}.co div{margin-top:3px}.co small{color:var(--muted)}
.cal{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ev{flex:0 0 220px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:11px 13px;font-size:14px}
.ev .dt{font-weight:700;font-size:15px}.ev .dd{font-size:12px;color:var(--faint)}.ev p{margin:5px 0 0}.ev small{color:var(--muted)}
.phr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.phr div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.src2{columns:2 320px;font-size:12.5px;color:var(--muted);padding-left:18px}.src2 a{color:var(--muted)}.src2 li{break-inside:avoid;margin:3px 0}
</style>
<!--ZOOM-->
</head><body>
<div class="wrap">
  <div class="top"><div><h1 id="t"></h1><div class="sub" id="sub"></div></div><button class="tb" id="tb" type="button" aria-label="Тема"></button></div>
  <div class="upd" id="upd"></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar" id="bar"><button class="chip on" data-f="all">Все темы</button><button class="chip" data-f="ru">Россия</button><button class="chip" data-f="world">Мир</button></div>
  <div class="cards" id="cards"></div>
  <h2>Компании недели</h2><div class="cos" id="cos"></div>
  <h2>Что впереди</h2><div class="cal" id="cal"></div>
  <h2>Готовые фразы</h2><div class="phr" id="phr"></div>
  <h2>Источники</h2><ol class="src2" id="srcs"></ol>
</div>
<!--COMMON-->
<script>
(function(){
var $=function(i){return document.getElementById(i)},E=R.esc;
function col(r){return r==='ru'?'var(--ru)':'var(--w)'}
$('t').textContent=D.title;$('sub').textContent=D.sub;R.themeBtn($('tb'));
$('upd').textContent='Снимок на '+D.asof+'. Живые цены подтягиваются из рынков Hub.';
function kp(L){$('kpis').innerHTML=D.kpi.map(function(k){var l=L&&L[k.id];var d=l&&l.ch!=null?'<div class="d '+(l.ch>=0?'up':'dn')+'">'+R.pct(l.ch)+' за день</div>':'<div class="d nt">'+E(k.delta)+'</div>';
  return '<div class="k" style="--c:'+col(k.region)+'"><div class="l">'+E(k.label)+'<i>'+R.region(k.region)+'</i></div><div class="v">'+E(l?l.txt:k.value)+'</div>'+d+'<div class="w">'+E(k.why)+'</div></div>'}).join('')}
kp(null);R.live(function(L,u){if(L){kp(L);$('upd').textContent='Снимок на '+D.asof+' · цены обновлены '+u}});
function card(t){return '<article class="c" data-r="'+t.region+'" style="--c:'+col(t.region)+'"><div class="tg"><b>'+E(t.tag)+'</b>· '+R.region(t.region)+'</div><h3>'+E(t.title)+'</h3><p>'+E(t.lead)+'</p>'+
 '<details><summary>Факты и цифры</summary><ul>'+t.facts.map(function(f){return '<li>'+E(f)+'</li>'}).join('')+'</ul></details>'+
 '<p class="so">'+E(t.so)+'</p><div class="say"><b>Фраза для собеседования <button class="cp" type="button">Копировать</button></b><span>'+E(t.say)+'</span></div><div>'+R.links(t.src)+'</div></article>'}
$('cards').innerHTML=D.themes.map(card).join('');
$('cards').addEventListener('click',function(e){var b=e.target.closest('.cp');if(b)R.copy(b.closest('.say').querySelector('span').textContent,b)});
$('bar').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;[].forEach.call($('bar').children,function(x){x.classList.toggle('on',x===b)});var f=b.dataset.f;
  [].forEach.call($('cards').children,function(c){c.hidden=f!=='all'&&c.dataset.r!==f})});
$('cos').innerHTML=D.companies.map(function(c){return '<div class="co"><b>'+E(c.name)+'</b><code>'+E(c.tic)+'</code><div>'+E(c.fact)+'</div><small>'+E(c.note)+'</small></div>'}).join('');
$('cal').innerHTML=D.calendar.map(function(c){var d=R.days(c.date);return '<div class="ev" style="--c:'+col(c.region)+'"><div class="dt">'+(c.approx?E(c.approx):R.dateRu(c.date))+'</div><div class="dd">'+(d>0?'через '+d+' дн.':d===0?'сегодня':'прошло')+' · '+R.region(c.region)+'</div><p>'+E(c.title)+'</p><small>'+E(c.why)+'</small></div>'}).join('');
$('phr').innerHTML=D.phrases.map(function(p){return '<div>'+E(p)+'</div>'}).join('');
$('srcs').innerHTML=D.sources.map(function(s){return '<li><a href="'+E(s.u)+'" target="_blank" rel="noopener">'+E(s.t)+'</a></li>'}).join('');
})();
</script>
</body></html>
