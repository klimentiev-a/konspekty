<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<!--GATE-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Рынок: что шарить · Газета</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..800;1,7..72,400&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#F6F2E9;--surface:#FBF8F1;--fg:#1F1C17;--muted:#5F584B;--faint:#8A8273;--line:#D8D0BE;--accent:#9E2B1E;--up:#1F6B47;--dn:#A3301F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151410;--surface:#1E1D17;--fg:#ECE7DA;--muted:#ACA493;--faint:#7C7566;--line:#34322A;--accent:#E9826A;--up:#6CC79A;--dn:#F08A73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151410;--surface:#1E1D17;--fg:#ECE7DA;--muted:#ACA493;--faint:#7C7566;--line:#34322A;--accent:#E9826A;--up:#6CC79A;--dn:#F08A73;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 'Literata',Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px}
.mast{border-bottom:3px double var(--fg);padding:28px 0 12px;text-align:center;position:relative}
.mast .kick{font:600 12px/1 'IBM Plex Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.mast h1{margin:10px 0 6px;font:800 clamp(34px,6vw,64px)/1.02 'Literata',serif;letter-spacing:-.02em}
.mast .sub{font-style:italic;color:var(--muted);font-size:16px}
.tb{position:absolute;right:0;top:22px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;cursor:pointer}
.dateline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--fg);padding:7px 0;font:500 13px/1.3 'IBM Plex Sans',sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;margin-top:28px}
@media(max-width:900px){.grid{grid-template-columns:1fr;gap:26px}}
.lead p{margin:0 0 12px}
.lead p:first-child::first-letter{float:left;font:800 64px/.82 'Literata',serif;padding:6px 8px 0 0;color:var(--accent)}
.lead{font-size:18.5px;border-bottom:1px solid var(--line);padding-bottom:18px}
.sec{margin-top:34px}
.sec>h2{font:600 13px/1 'IBM Plex Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border-top:2px solid var(--fg);padding-top:10px;margin:0 0 4px}
.art{padding:20px 0;border-bottom:1px solid var(--line)}
.art .tag{font:600 11.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.art h3{margin:6px 0 8px;font:700 26px/1.2 'Literata',serif;letter-spacing:-.01em}
.art .ld{margin:0 0 10px;font-size:17.5px}
.art ul{margin:0 0 12px;padding-left:20px}.art li{margin:4px 0}
.art .so{margin:0 0 12px;color:var(--muted)}
.pq{margin:14px 0 8px;padding:12px 0 12px 18px;border-left:3px solid var(--accent);font-style:italic;font-size:18px}
.pq b{display:block;font:600 11.5px/1 'IBM Plex Sans',sans-serif;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.srcs{font:400 12.5px/1.6 'IBM Plex Sans',sans-serif;color:var(--faint)}.srcs a{color:var(--faint);margin-right:10px;text-decoration-color:var(--line)}
aside .box{border-top:2px solid var(--fg);padding-top:10px;margin-bottom:28px}
aside h4{margin:0 0 8px;font:600 13px/1 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase}
@media(min-width:901px){aside{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}}
.kt{width:100%;border-collapse:collapse;font:400 14px/1.35 'IBM Plex Sans',sans-serif}
.kt td{padding:7px 0;border-bottom:1px dotted var(--line);vertical-align:top}
.kt td:last-child{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.kt small{display:block;color:var(--faint);font-weight:400;font-size:11.5px}
.kt td:first-child{width:55%;padding-right:10px}.kt td:last-child small{white-space:normal}
.up{color:var(--up)}.dn{color:var(--dn)}
.cal{list-style:none;margin:0;padding:0;font:400 14px/1.4 'IBM Plex Sans',sans-serif}
.cal li{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line)}
.cal b{font-weight:600}.cal span{color:var(--muted);font-size:12.5px;display:block}
.ph{list-style:none;counter-reset:p;margin:0;padding:0}.ph li{counter-increment:p;padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--line);font-size:16.5px}
.ph li::before{content:counter(p);position:absolute;left:0;top:8px;font:700 22px/1 'Literata',serif;color:var(--accent)}
.fr p{margin:0 0 10px;font-size:15px}.fr p::before{content:'— ';color:var(--accent)}
.foot{margin-top:40px;font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:var(--muted)}
.foot ol{padding-left:20px}.foot a{color:var(--muted)}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
</style>
<!--ZOOM-->
</head><body>
<div class="wrap">
  <header class="mast">
    <div class="kick">Hub · брифинг для собеседования</div>
    <h1 id="t"></h1>
    <div class="sub" id="sub"></div>
    <button class="tb" id="tb" type="button" aria-label="Тема"></button>
  </header>
  <div class="dateline"><span id="asof"></span><span id="upd">Цены: снимок на дату выпуска</span></div>
  <div class="grid">
    <main>
      <section class="lead" id="lead"></section>
      <section class="sec"><h2>Россия</h2><div id="ru"></div></section>
      <section class="sec"><h2>Мир</h2><div id="world"></div></section>
      <section class="sec"><h2>Что сказать на собеседовании</h2><ol class="ph" id="ph"></ol></section>
      <section class="sec"><h2>О чём говорят инвесторы</h2><div class="fr" id="fr"></div></section>
    </main>
    <aside>
      <div class="box"><h4>Цифры дня</h4><table class="kt" id="kt"></table></div>
      <div class="box"><h4>Календарь</h4><ul class="cal" id="cal"></ul></div>
      <div class="box"><h4>Компании</h4><table class="kt" id="co"></table></div>
    </aside>
  </div>
  <footer class="foot"><b>Источники</b><ol id="srcs"></ol></footer>
</div>
<!--COMMON-->
<script>
(function(){
var $=function(i){return document.getElementById(i)},E=R.esc;
$('t').textContent=D.title;$('sub').textContent=D.sub;$('asof').textContent='Данные на '+D.asof;
R.themeBtn($('tb'));
$('lead').innerHTML=D.pitch.map(function(p){return '<p>'+E(p)+'</p>'}).join('');
function art(t){return '<article class="art" id="'+t.id+'"><div class="tag">'+E(t.tag)+'</div><h3>'+E(t.title)+'</h3><p class="ld">'+E(t.lead)+'</p><ul>'+t.facts.map(function(f){return '<li>'+E(f)+'</li>'}).join('')+'</ul><p class="so">'+E(t.so)+'</p><div class="pq"><b>Как сказать</b>'+E(t.say)+'</div><div class="srcs">'+R.links(t.src)+'</div></article>'}
$('ru').innerHTML=D.themes.filter(function(t){return t.region==='ru'}).map(art).join('');
$('world').innerHTML=D.themes.filter(function(t){return t.region==='world'}).map(art).join('');
$('ph').innerHTML=D.phrases.map(function(p){return '<li>'+E(p)+'</li>'}).join('');
$('fr').innerHTML=D.forum.map(function(f){return '<p>'+E(f.text)+'</p>'}).join('');
function kt(L){$('kt').innerHTML=D.kpi.map(function(k){var l=L&&L[k.id],ch=l&&l.ch!=null?'<small class="'+(l.ch>=0?'up':'dn')+'">'+R.pct(l.ch)+' за день</small>':'<small>'+E(k.delta)+'</small>';
  return '<tr><td>'+E(k.label)+'<small>'+E(k.en)+' · '+E(l?'сейчас':k.date)+'</small></td><td>'+E(l?l.txt:k.value)+ch+'</td></tr>'}).join('')}
kt(null);R.live(function(L,u){if(L){kt(L);$('upd').textContent='Цены обновлены: '+u}});
$('cal').innerHTML=D.calendar.map(function(c){return '<li><b>'+(c.approx?'≈ ':'')+R.dateShort(c.date)+'</b><div>'+E(c.title)+'<span>'+E(c.why)+'</span></div></li>'}).join('');
$('co').innerHTML=D.companies.map(function(c){return '<tr><td>'+E(c.name)+'<small>'+E(c.note)+'</small></td><td style="white-space:normal;max-width:150px;font-weight:500">'+E(c.fact)+'</td></tr>'}).join('');
$('srcs').innerHTML=D.sources.map(function(s){return '<li><a href="'+E(s.u)+'" target="_blank" rel="noopener">'+E(s.t)+'</a></li>'}).join('');
})();
</script>
</body></html>
