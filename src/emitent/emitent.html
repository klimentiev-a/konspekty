<script>try{var t=localStorage.getItem('theme');if(!localStorage.getItem('hub:skin')&&(t==='dark'||t==='light'))document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#F4F1E8;--surface:#FBF9F3;--fg:#25221C;--muted:#665F52;--faint:#857E6E;--line:#D9D3C2;--a1:#A93D28;--a2:#1F6B57;--warn:#B0662A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171611;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;--line:#33312A;--a1:#E8886B;--a2:#5FC2A3;--warn:#E3A062;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171611;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;--line:#33312A;--a1:#E8886B;--a2:#5FC2A3;--warn:#E3A062;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header a.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
h1{font-size:22px;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin:2px 0 12px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--a2);border-color:var(--a2);color:#fff}
.chip[disabled]{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--fg);border-bottom-color:var(--a2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:22px;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--faint)}
.neg{color:var(--a1)}.pos{color:var(--a2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .note{color:var(--muted);font-size:13px;margin:0 0 8px}
.chart{height:280px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{color:var(--muted);font-weight:500;font-size:12px}
td.l,th.l{text-align:left;white-space:normal}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--faint);margin-left:4px}
.chk{color:var(--warn);font-size:12px}
ul.pl{padding-left:18px;margin:6px 0}
ul.pl li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.src{font-size:12px;color:var(--faint);line-height:1.6}
.src a{color:var(--faint)}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.chart{height:240px}h1{font-size:19px}.kpi b{font-size:19px}}
</style>

<header><a class="back" href="artem.html">← Назад</a><h1>Аналитика эмитента</h1></header>

<script>
(function(){
"use strict";
/* ===== ДАННЫЕ. Всё из открытых источников (список внизу страницы). «сверить» = нет второго источника или цифры расходятся. ===== */
var E={
 whoosh:{
  name:"ВУШ Холдинг (Whoosh)",ticker:"WUSH",
  sub:"Кикшеринг (аренда электросамокатов): Россия, СНГ, Латинская Америка. Отчётность МСФО, млрд ₽, если не сказано иное.",
  periods:[
   {k:"2024",rev:14.3,ebitda:6.05,ni:1.99,nd:10.3,lev:1.7},
   {k:"1П 2025",rev:5.37,ebitda:1.0,ni:-1.9,nd:12.9,lev:2.99},
   {k:"2025",rev:12.45,ebitda:3.6,ni:-2.9,nd:13.1,lev:null,levCalc:3.6},
   {k:"1П 2026",rev:5.56,ebitda:1.44,ni:-1.77,nd:null,lev:3.4}
  ]
 }
};
var TABS=[["overview","Обзор"],["fin","Отчётность"],["debt","Долг и облигации"],["market","Рынок и конкуренты"],["method","Методология и риски"]];
var cur="whoosh",tab="overview",charts=[];
function $(s){return document.querySelector(s)}
function f(n,d){return n==null?"—":n.toLocaleString("ru-RU",{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})}
function cls(n){return n==null?"":n<0?"neg":"pos"}
function kpi(l,v,s,c){return '<div class="kpi"><small>'+l+'</small><b class="'+(c||"")+'">'+v+'</b><span>'+(s||"")+'</span></div>'}
function panel(h,n,body){return '<div class="panel"><h3>'+h+'</h3>'+(n?'<p class="note">'+n+'</p>':'')+body+'</div>'}
function table(head,rows){return '<div class="tw"><table><thead><tr>'+head.map(function(h,i){return '<th'+(i?'':' class="l"')+'>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i?'':' class="l"')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function txt(c){return '<td class="l">'+c+'</td>'}

/* ===== Вкладки ===== */
var V={};
V.overview=function(){
 var P=E[cur].periods,a=P[2],b=P[3],h=P[1];
 var ltm=a.ebitda-h.ebitda+b.ebitda;
 return '<div class="grid">'
  +kpi("Выручка 2025",f(a.rev,2),"−14,9% к 2024 (14,3)","neg")
  +kpi("EBITDA 2025",f(a.ebitda,2),"−43% к 2024 (6,05)","neg")
  +kpi("Чистый убыток 2025",f(a.ni,1),"2024: прибыль +1,99","neg")
  +kpi("Чистый долг 2025",f(a.nd,1),"2024: 10,3")
  +kpi("1П 2026: выручка",f(b.rev,2),"+4% г/г","pos")
  +kpi("1П 2026: EBITDA",f(b.ebitda,2),"+43% г/г · маржа 26%","pos")
  +kpi("1П 2026: чистый убыток",f(b.ni,2),"−6,7% к 1П 2025","neg")
  +kpi("Долг / EBITDA (1П 2026)","3,4×","оценка аналитиков <span class=chk>(сверить)</span>","neg")
  +'</div>'
  +panel("Что происходит","",'<ul class="pl">'
   +'<li><b>2025 — провальный год.</b> Спрос на самокаты в России просел (погода, отключения мобильного интернета, макро), а парк и расходы росли под больший сезон. Выручка −15%, EBITDA почти вдвое ниже, прибыль сменилась убытком.</li>'
   +'<li><b>2026 — стабилизация, но не отскок.</b> За 1П выручка +4%, EBITDA +43% за счёт экономии на ремонте и логистике и перераспределения парка. Число поездок за 9 мес. −5% (113 млн).</li>'
   +'<li><b>Долг — главный вопрос.</b> Чистый долг ≈ 13 млрд при LTM EBITDA ≈ '+f(ltm,1)+' млрд (расчёт: 2025 − 1П 2025 + 1П 2026). Проценты по облигациям за 1П 2026 — 1,21 млрд при EBITDA 1,44 млрд (1П — низкий сезон).</li>'
   +'<li><b>Растущий кусок — Латинская Америка:</b> около 20% выручки 1П 2026 (1,13 млрд, +22%), парк 27,8 тыс. СИМ против 11 тыс. год назад.</li>'
   +'<li><b>Ориентир менеджмента на 2026:</b> EBITDA ≈ 4,5 млрд, положительный свободный денежный поток, Net Debt/EBITDA ниже 3×. Выручка «свыше 14 млрд» под вопросом — компания сама допускает недобор.</li></ul>')
  +panel("Выручка и EBITDA по периодам","Годовые и полугодовые периоды — разные столбцы, не сравнивать 1П с годом напрямую.",'<div class="chart" id="c1"></div>');
};
V.fin=function(){
 var P=E[cur].periods;
 var rows=[
  ["Выручка, млрд ₽"].concat(P.map(function(p){return f(p.rev,2)})),
  ["EBITDA, млрд ₽"].concat(P.map(function(p){return f(p.ebitda,2)})),
  ["Рентабельность EBITDA, %"].concat(P.map(function(p){return f(p.ebitda/p.rev*100,1)})),
  ["Чистая прибыль (убыток), млрд ₽"].concat(P.map(function(p){return '<span class="'+cls(p.ni)+'">'+f(p.ni,2)+'</span>'})),
  ["Чистый долг, млрд ₽"].concat(P.map(function(p){return f(p.nd,1)})),
  ["Net Debt / EBITDA, ×"].concat(P.map(function(p){return p.lev!=null?f(p.lev,2).replace(",00",""):(p.levCalc?f(p.levCalc,1)+' <span class="tag">расчёт</span>':"—")}))
 ];
 return panel("Ключевые показатели МСФО","Рентабельность посчитана как EBITDA / выручка. 2024: EBITDA «кикшеринга» 6,05–6,1 млрд в разных публикациях (сверить).",table(["Показатель"].concat(P.map(function(p){return p.k})),rows))
 +panel("Квартал, который выбивается: 3К 2025","Сезонность: третий квартал — пик. Это объясняет, почему 1П всегда слабее года.",table(["3К 2025","Значение"],[
  ["Выручка","5,4 млрд ₽ (−13% г/г)"],["EBITDA","2,7 млрд ₽ (−28% г/г), маржа 49,8%"],["Чистая прибыль","0,73 млрд ₽ (в 3,6 раза ниже г/г)"],["Net Debt / EBITDA","3,59× (год назад 1,22×)"]]))
 +panel("Выручка на поездку (расчёт)","Выручка МСФО группы / поездки группы (включая Латинскую Америку). Грубая оценка, не метрика компании.",table(["Период","Выручка, млрд ₽","Поездки, млн","₽ на поездку"],[
  ["1П 2025","5,37","56,5","≈95"],["1П 2026","5,56","56,5","≈98"]]))
 +panel("Как получены цифры","",'<p class="note">Данные взяты из публикаций компании и пересказов в прессе, не из самих файлов МСФО. Для точного разбора по статьям нужен парсер отчётности с e-disclosure.ru (следующий шаг).</p>');
};
V.debt=function(){
 var bonds=[
  ["001P-02","RU000A106HB4","4,0","погашен"],
  ["001P-03 (флоатер)","RU000A109HX2","4,0","28.08.2027"],
  ["001P-04","RU000A10BS76","5,0","—"],
  ["001P-05","RU000A10E6D0","—","19.01.2028"],
  ["001P-06","RU000A10EYU8","0,67","12.04.2029"],
  ["001P-07","RU000A10FGU2","0,80","—"],
  ["001P-08","—","—","—"]
 ];
 return '<div class="grid">'
  +kpi("Чистый долг, конец 2025","13,1","млрд ₽ · 2024: 10,3","neg")
  +kpi("Net Debt / EBITDA","3,4×","1П 2026 <span class=chk>(сверить)</span>","neg")
  +kpi("Проценты по облигациям","1,21","млрд ₽ за 1П 2026")
  +kpi("Рейтинг (НРА)","BBB+","по шкале ru; дата <span class=chk>сверить</span>")
  +'</div>'
  +panel("Чистый долг и Net Debt/EBITDA","Конец периода. Для 1П 2026 абсолютный чистый долг в найденных источниках не указан.",'<div class="chart" id="c2"></div>')
  +panel("Облигации ООО «ВУШ» (биржевые, серия 001P)","Объёмы и даты взяты из карточек Cbonds/Investmint; номиналы 1000 ₽. Пустое «—» = источник не показал. Часть выпусков уже погашена.",table(["Выпуск","ISIN","Объём, млрд ₽","Погашение"],bonds))
  +panel("События по рефинансированию","",'<ul class="pl">'
   +'<li>Январь 2026: размещён небольшой выпуск на 1 млрд ₽ под ≈22% годовых.</li>'
   +'<li>Июль 2026: ближайшая крупная проверка — погашение облигаций на 4,1 млрд ₽ (по состоянию на март 2026). <span class="chk">Исход не проверен — смотреть на e-disclosure / Мосбирже.</span></li>'
   +'<li>Проценты по облигациям за 1П 2026 составили 1,21 млрд ₽ — это ≈84% EBITDA периода.</li></ul>')
  +panel("Что смотреть дальше","",'<ul class="pl"><li>Кривая доходности выпусков ВУШ против рейтинга BBB+ (карточки выпусков в «Облигации»).</li><li>График выплат 2026–2029: пики 2027 (001P-03) и 2028.</li><li>Ковенанты и условия оферт из эмиссионных документов — пока не разобраны.</li></ul>');
};
V.market=function(){
 return panel("Операторы","Whoosh — единственный, кто раскрывает отчётность по самокатам отдельно; у МТС Юрент и Яндекс Go цифры только из прессы.",table(["","Whoosh","МТС Юрент","Яндекс Go"],[
  ["Парк в Москве, ≈ тыс. СИМ","20","20","20"],
  ["Доля по поездкам в РФ","&gt;45% (оценка компании)","—","—"],
  ["Выручка 2025, млрд ₽","12,45 (МСФО, группа)","15,5 <span class=chk>(сверить)</span>","не раскрывает"],
  ["Поездки 1П 2026","56,5 млн (≈0%)","+5,4% (янв–авг)","не раскрывает"],
  ["География","81 локация + Латам","≈175 городов <span class=chk>(сверить)</span>","расширение: +28 городов в 2025"],
  ["Возраст пользователя","от 16 лет","от 18","от 18"]
 ]))
 +'<div class="two">'
 +panel("Рынок кикшеринга России","",table(["Год","Объём, млрд ₽"],[["2022","13,3"],["2023","22,3 (+67,5%)"],["2025 (Москва)","8,4 (+14%)"],["2026 (Москва, прогноз)","9,5–10,5"]]))
 +panel("Спрос в 2026 (Чек индекс, янв–авг)","",table(["Показатель","Россия"],[["Число поездок","+3%"],["Средний чек","+14% → 207 ₽"],["Москва, средний чек","+12% → 311 ₽"],["Москва, поездки","+3%"]]))
 +'</div>'
 +panel("Вывод для ВУШ","",'<ul class="pl">'
  +'<li>Рынок выходит из перенасыщения: поездок почти поровну, а прирост даёт чек (цена поездки), а не объём. У Whoosh выручка на поездку ≈ 98 ₽ против ≈ 95 ₽ год назад.</li>'
  +'<li>Операторы делят Москву примерно поровну по парку, у Whoosh главный запас роста — регионы и Латинская Америка, но там пока 20% выручки.</li>'
  +'<li>Рост «через флот» закончился: Whoosh сократил парк в РФ более чем на 6% и не закупал самокаты в 1П 2026 — отсюда лучший свободный денежный поток.</li></ul>')
 +panel("Чего не хватает для полноценной картины","",'<ul class="pl"><li>Реальная выручка и EBITDA Юрента и Яндекс Go из их отчётности (МТС: сегмент, Яндекс: сегмент «Go»).</li><li>Помесячная динамика поездок и загрузки самокатов (поездок на самокат в сутки).</li><li>Региональная разбивка Whoosh.</li></ul>');
};
V.method=function(){
 return panel("Методология: как читать кикшеринг","",'<ul class="pl">'
  +'<li><b>Драйверы выручки:</b> парк × поездки на самокат × выручка на поездку. Рост парка без роста загрузки — прямой путь к убытку (2025).</li>'
  +'<li><b>Сезонность:</b> пик — 3К, слабый — 1К и 4К. Долговые коэффициенты на конец 1П всегда выглядят хуже; корректнее смотреть на LTM (последние 12 мес.).</li>'
  +'<li><b>Операционные расходы:</b> зарядка, перевозка, ремонт и обслуживание, оплата труда. Их доля в выручке определяет маржу EBITDA (в 3К 2025 — 49,8%, в 1П — 19–26%).</li>'
  +'<li><b>Капитальные затраты:</b> покупка самокатов — главный CAPEX; пауза в закупках временно улучшает свободный денежный поток.</li>'
  +'<li><b>Долг:</b> оценивать Net Debt / EBITDA по LTM и покрытие процентов (EBITDA / процентные расходы). Здесь покрытие 1П 2026 ≈ 1,2× по облигациям — на грани, спасает сезон.</li></ul>')
 +panel("Риски","",'<ul class="pl">'
  +'<li><b>Рефинансирование:</b> несколько выпусков с погашением 2027–2029, ставка последнего размещения ≈22%.</li>'
  +'<li><b>Регулирование:</b> обсуждаются требования к правам и запрет езды по тротуарам <span class="chk">(сверить, одна публикация)</span>.</li>'
  +'<li><b>Отключения мобильного интернета</b> в ключевых городах бьют по спросу (в МСФО прямо названы причиной падения 2025).</li>'
  +'<li><b>Курс:</b> укрепление рубля уменьшает выручку Латинской Америки в рублях.</li>'
  +'<li><b>Концентрация:</b> Москва ≈ треть выручки всего рынка.</li></ul>')
 +panel("Не подтверждено","",'<ul class="pl"><li>Заявка Whoosh в ФАС на объединение с Urent (конец 2025) — упоминание в одной публикации, исход неизвестен.</li><li>Выручка Юрента 15,5 млрд ₽ выше всего московского рынка (8,4 млрд) — вероятно, другая география или методика.</li></ul>')
 +panel("Источники","",'<div class="src">'
  +'<a href="https://expert.ru/news/whoosh-zavershil-2025-god-s-chistym-ubytkom-pochti-v-3-mlrd-rubley">Эксперт — итоги 2025</a> · '
  +'<a href="https://www.kommersant.ru/doc/8909368">Коммерсантъ — 1П 2026</a> · '
  +'<a href="https://rb.ru/news/whoosh-otchitalsya-o-finansovyh-itogah-za-i-polugodie-2026-goda-ubytok-kompanii-sokratilsya-na-67/">RB.ru — 1П 2026</a> · '

/* ===== Графики ===== */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
 charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[];
 if(!window.echarts)return;
 var P=E[cur].periods,ax={axisLine:{lineStyle:{color:css("--line")}},axisLabel:{color:css("--muted")},splitLine:{lineStyle:{color:css("--line")}}};
 var n1=$("#c1");
 if(n1){var c=echarts.init(n1);charts.push(c);c.setOption({animation:false,grid:{left:44,right:12,top:56,bottom:26},legend:{top:0,left:'center',textStyle:{color:css("--muted")}},tooltip:{trigger:"axis"},
  xAxis:Object.assign({type:"category",data:P.map(function(p){return p.k})},ax),yAxis:Object.assign({type:"value",name:"млрд ₽"},ax,{nameTextStyle:{color:css("--muted")}}),
  series:[{name:"Выручка",type:"bar",data:P.map(function(p){return p.rev}),itemStyle:{color:css("--a2")},barMaxWidth:36},{name:"EBITDA",type:"bar",data:P.map(function(p){return p.ebitda}),itemStyle:{color:css("--warn")},barMaxWidth:36}]})}
 var n2=$("#c2");
 if(n2){var d=echarts.init(n2);charts.push(d);var lv=P.map(function(p){return p.lev!=null?p.lev:(p.levCalc!=null?p.levCalc:null)});
  d.setOption({animation:false,grid:{left:44,right:44,top:56,bottom:26},legend:{top:0,left:'center',textStyle:{color:css("--muted")}},tooltip:{trigger:"axis"},
  xAxis:Object.assign({type:"category",data:P.map(function(p){return p.k})},ax),
  yAxis:[Object.assign({type:"value",name:"млрд ₽"},ax,{nameTextStyle:{color:css("--muted")}}),Object.assign({type:"value",name:"×"},ax,{splitLine:{show:false},nameTextStyle:{color:css("--muted")}})],
  series:[{name:"Чистый долг",type:"bar",data:P.map(function(p){return p.nd}),itemStyle:{color:css("--a1")},barMaxWidth:36},{name:"Net Debt/EBITDA",type:"line",yAxisIndex:1,data:lv,connectNulls:true,itemStyle:{color:css("--fg")},lineStyle:{width:2}}]})}
}
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize()}catch(e){}})});

/* ===== Каркас ===== */
function render(){
 var e=E[cur];
 $("#pick").innerHTML=Object.keys(E).map(function(k){return '<button class="chip on" data-k="'+k+'">'+E[k].name+'</button>'}).join('')+'<button class="chip" disabled title="Добавим следующими">+ ещё эмитенты</button>';
 $("#sub").textContent=e.sub;
 $("#tabs").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('');
 $("#view").innerHTML=V[tab]();
 document.title=e.name+" — Аналитика эмитента";
 setTimeout(draw,0);
}
$("#tabs").onclick=function(ev){var b=ev.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;history.replaceState(null,"","#"+tab);render();window.scrollTo(0,0)};
var h=(location.hash||"").slice(1);if(V[h])tab=h;
if(window.MutationObserver)new MutationObserver(function(){setTimeout(draw,0)}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme","data-skin"]});
window.addEventListener("hashchange",function(){var x=(location.hash||"").slice(1);if(V[x]&&x!==tab){tab=x;render()}});
render();
})();
</script>
