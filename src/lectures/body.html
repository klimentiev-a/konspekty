<div class="lw" id="lw">
  <!--TOPBAR-->
  <section id="lv-list">
    <h1>Лекции</h1>
    <p class="lead">Презентации по материалам курсов: только то, чего нет в учебнике. Листай стрелками или свайпом, <kbd>F</kbd> — на весь экран, <kbd>G</kbd> — все слайды.</p>
    <label class="lsrch"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="lq" type="search" placeholder="Найти лекцию или тему" autocomplete="off" enterkeyhint="search"></label>
    <div class="lchips" id="lchips" role="group" aria-label="Тема"></div>
    <div id="lcont"></div>
    <div id="lall"></div>
    <p class="lempty" id="lempty" hidden>Ничего не нашлось. Попробуй другое слово или сбрось тему.</p>
  </section>

  <section id="lv-deck" hidden>
    <div class="dh"><span class="dg" id="dg"></span><h2 id="dt"></h2></div>
    <div class="stage" id="stage">
      <div class="slide" id="slide" tabindex="0" aria-live="polite"></div>
      <button type="button" class="nv p" id="np" aria-label="Предыдущий слайд"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="nv n" id="nn" aria-label="Следующий слайд"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="sbar" id="sbar"><i id="sbi"></i></div>
    </div>
    <div class="dbar">
      <div class="dots" id="dots" role="tablist" aria-label="Слайды"></div>
      <span class="cnt" id="cnt"></span>
      <button type="button" class="lb" id="bgrid">Все слайды</button>
      <button type="button" class="lb" id="bfs">На весь экран</button>
    </div>
    <div class="notes" id="notes" hidden></div>
    <div class="rel" id="rel"></div>
    <div class="ovw" id="ovw" hidden role="dialog" aria-label="Все слайды"></div>
  </section>
</div>
