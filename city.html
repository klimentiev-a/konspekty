function chartB(){var c=$('#chB');if(!c)return;var g=c.getContext('2d'),w=c.width,h=c.height,hs=S.hist.slice(-48);g.clearRect(0,0,w,h);if(hs.length<2){g.fillStyle=getComputedStyle(document.body).color;g.font='14px system-ui';g.fillText('График появится после первого месяца',12,h/2);return}
  var vs=hs.map(function(x){return x.bal}),mn=Math.min.apply(null,vs.concat([0])),mx=Math.max.apply(null,vs.concat([1])),css=getComputedStyle(document.documentElement),ac=css.getPropertyValue('--accent').trim()||'#1f6b57',ln=css.getPropertyValue('--line').trim()||'#ccc';
  var yy=function(v){return h-14-(v-mn)/(mx-mn||1)*(h-28)};g.strokeStyle=ln;g.lineWidth=1;g.beginPath();g.moveTo(0,yy(0));g.lineTo(w,yy(0));g.stroke();
  g.strokeStyle=ac;g.lineWidth=2.5;g.beginPath();hs.forEach(function(x,i){var X0=8+i/(hs.length-1)*(w-16);i?g.lineTo(X0,yy(x.bal)):g.moveTo(X0,yy(x.bal))});g.stroke();
  g.fillStyle=css.getPropertyValue('--muted').trim()||'#666';g.font='12px system-ui';g.fillText('Казна, последние '+hs.length+' мес.: '+money(vs[vs.length-1]),8,12)}
SH.people=function(){var h='<input class="q" id="pq" placeholder="Поиск по имени" value="'+esc(qtxt)+'"><div class="chips">';[['all','Все'],['work','Работают'],['unemp','Безработные'],['ret','Пенсионеры'],['kids','Дети'],['sad','Недовольные'],['poor','В долгах']].forEach(function(c){h+='<button class="chip'+(flt===c[0]?' on':'')+'" data-a="flt" data-f="'+c[0]+'">'+c[1]+'</button>'});h+='</div><div id="plist">'+plist()+'</div>';return h};
function plist(){var q=qtxt.toLowerCase(),a=S.people.filter(function(p){var ag=ageOf(p);if(q&&dsp(p).toLowerCase().indexOf(q)<0)return false;
  switch(flt){case'work':return p.job>=0;case'unemp':return p.job<0&&ag>=18&&ag<retA(p);case'ret':return ag>=retA(p);case'kids':return ag<18;case'sad':return p.mood<40;case'poor':return p.cash<0}return true});
  a.sort(function(x,y){return dsp(x)<dsp(y)?-1:1});var n=a.length,h='<p style="color:var(--muted);margin:2px 0">Найдено: '+n+'</p>';
  a.slice(0,120).forEach(function(p){var ag=ageOf(p),J=S.lots[p.job];h+='<button class="row" data-a="p" data-i="'+p.id+'"><span class="d" style="background:'+moodCol(p.mood)+'"></span><span class="m"><b>'+esc(dsp(p))+'</b><small>'+ag+' '+ruN(ag,'год','года','лет')+' · '+(J?esc(J.name):ag<18?'учится':ag>=retA(p)?'пенсия':'без работы')+'</small></span><span class="e">'+(p.job>=0?Math.round(p.sal/1000)+' тыс':'')+'</span></button>'});
  if(n>120)h+='<p style="color:var(--muted)">Показаны первые 120. Уточни поиск.</p>';return h}
SH.log=function(){if(!S.log.length)return '<p style="color:var(--muted)">Пока тихо.</p>';var cl={bad:'#d64a3a',warn:'#e0a21f',good:'#2f9e5b',info:'#8a8a8a'};
  return S.log.map(function(e,i){return '<button class="row" data-a="fly" data-i="'+i+'"><span class="d" style="background:'+(cl[e.k]||cl.info)+'"></span><span class="m"><b style="font-weight:500">'+esc(e.txt)+'</b><small>'+fmtD(e.t)+', '+fmtHM(e.t)+'</small></span></button>'}).join('')};
SH.build=function(){var emp=S.lots.filter(function(L){return L.type==='empty'}),h='<p style="margin:4px 0 10px">Пустых участков: <b>'+emp.length+'</b>. Нажми на пустой участок на карте (они мигают жёлтым) и выбери, что построить. В казне: <b>'+money(S.money)+'</b>.</p>';
  if(emp.length)h+='<div class="btns"><button class="bt pr" data-a="toempty">Показать пустой участок</button></div>';
  h+='<h4>Цены</h4><table class="t">';BUILDABLE.forEach(function(t){var B=BT[t];h+='<tr><td>'+B.n+'<br><small style="color:var(--muted)">'+(B.cap?'жильё на '+B.cap+' чел.':B.jobs?B.jobs+' мест · зарплата '+Math.round(B.wage/1000)+' тыс':'настроение рядом')+(B.up?' · содержание '+Math.round(B.up/1000)+' тыс/мес':'')+'</small></td><td>'+money(B.cost)+'</td></tr>'});
  return h+'</table><p style="color:var(--muted);font-size:12.5px">Если снести здание, жильцы лишаются дома, а работники — работы. Закрытое (обанкротившееся) предприятие можно открыть заново за 30% цены.</p>'};
SH.move=function(){var p=P(S.mvId);if(!p)return '';var F=S.lots[p.home]||S.lots[0],op=S.lots.filter(function(L){return jobsOpen(L)>0&&L.id!==p.job});
  op.sort(function(a,b){return BT[b.type].wage-BT[a.type].wage});if(!op.length)return '<p>Свободных вакансий нет. Построй новые рабочие места.</p>';
  return '<p style="margin:2px 0 6px">'+esc(dsp(p))+' (навык ×'+p.skill+')</p>'+op.map(function(L){var T=BT[L.type],sal=Math.round(T.wage*p.skill/500)*500;return '<button class="row" data-a="mv" data-i="'+p.id+'" data-l="'+L.id+'"><span class="m"><b>'+esc(L.name)+'</b><small>'+T.n+' · свободно '+jobsOpen(L)+' · от дома '+(Math.abs(L.x-F.x)+Math.abs(L.y-F.y))+' кл.</small></span><span class="e">≈ '+Math.round(sal/1000)+' тыс</span></button>'}).join('')};

/* ============ интерфейс ============ */
var toastT=0,toastPos=null;
function toast(txt,k,u,v){var t=$('#toast');t.textContent=txt;t.className='on '+(k||'');toastPos=u!==undefined?[u,v]:null;clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},k==='bad'?7000:4200)}
$('#toast').addEventListener('click',function(){if(toastPos)flyTo(toastPos[0],toastPos[1],1.3);this.classList.remove('on')});
function setSpeed(i){S.spd=i;[].forEach.call(document.querySelectorAll('.spd[data-s]'),function(b){b.classList.toggle('on',+b.dataset.s===i)})}
function initHud(){var h='';SLBL.forEach(function(l,i){h+='<button class="spd'+(i===S.spd?' on':'')+'" data-a="spd" data-s="'+i+'">'+l+'</button>'});h+='<button class="spd skip" data-a="skipm" aria-label="Пропуск времени">⏩</button>';$('#spds').innerHTML=h;
  $('#skipm').innerHTML='<button data-a="skip" data-m="morning">До утра</button><button data-a="skip" data-m="1440">+1 день</button><button data-a="skip" data-m="10080">+1 неделя</button><button data-a="skip" data-m="43200">+1 месяц</button><button data-a="skip" data-m="525600">+1 год</button>'}
function updHud(){var d=dateOf(S.t),c=$('#clock');c.innerHTML=fmtHM(S.t)+'<small>'+DOW[d.getUTCDay()]+', '+fmtD(S.t)+'</small>';$('#pPop').textContent='👥 '+S.people.length;var pm=$('#pMoney');pm.textContent='₽ '+money(S.money).replace(' ₽','');pm.classList.toggle('neg',S.money<0)}
var FF=null;
function startFF(mins){FF={left:mins,all:mins};$('#skipm').classList.remove('on');$('#ff').classList.add('on')}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b){if(!e.target.closest('#skipm'))$('#skipm').classList.remove('on');return}var a=b.dataset.a,i=+b.dataset.i;
  switch(a){
   case'sheet':openSheet(b.dataset.n);break;case'sclose':closeSheet();break;case'close':selClear();break;
   case'p':{var p=P(i);if(p){selP(p);if(cur)closeSheet();var ps=pPos(p);flyTo(ps[0],ps[1],Math.max(cam.s,1.3))}break}
   case'l':{var L=S.lots[i];if(L){selL(L);if(cur)closeSheet();flyTo(L.x+1,L.y+1,Math.max(cam.s,1.2))}break}
   case'follow':follow=follow===i?-1:i;refreshCard(true);break;
   case'fire':{var q=P(i);if(q){setJob(q,null);q.mood-=10;refreshCard(true);calcStats()}break}
   case'raise':case'cut':{var r=P(i);if(r&&r.job>=0){r.sal=Math.round(r.sal*(a==='raise'?1.1:.9)/500)*500;refreshCard(true)}break}
   case'move':S.mvId=i;openSheet('move');break;
   case'mv':{var m=P(i),T=S.lots[+b.dataset.l];if(m&&T&&jobsOpen(T)>0){setJob(m,T);m.mood+=6;calcStats();closeSheet();refreshCard(true);planDay(m)}break}
   case'build':build(S.lots[+b.dataset.l],b.dataset.t);break;case'demo':if(confirm('Снести здание?'))demolish(S.lots[i]);break;case'reopen':reopen(S.lots[i]);break;
   case'spd':setSpeed(+b.dataset.s);break;
   case'skipm':$('#skipm').classList.toggle('on');break;
   case'skip':{var mm=b.dataset.m;if(mm==='morning'){var tod=S.t%1440,tg=6*60;mm=tod<tg?tg-tod:1440-tod+tg}else mm=+mm;startFF(mm);break}
   case'flt':flt=b.dataset.f;shB.innerHTML=SH.people();break;
   case'fly':{var ev=S.log[i];if(ev&&ev.u!==undefined){closeSheet();flyTo(ev.u,ev.v,1.3)}break}
   case'toempty':{var em=S.lots.filter(function(L){return L.type==='empty'});if(em.length){var L2=pick(em);closeSheet();S.build={hint:1};flyTo(L2.x+1,L2.y+1,1.4);selL(L2)}break}
   case'zoom':zoomAt(W/2,H/2,cam.s*(+b.dataset.d>0?1.35:1/1.35));break;case'recenter':fitCam();follow=-1;break;
   case'newcity':if(confirm('Удалить этот город и начать заново?')){try{localStorage.removeItem('city:save')}catch(er){}FF=null;closeSheet();selClear();newCity();buildStatic();setSpeed(S.spd);fitCam()}break}});
shB.addEventListener('input',function(e){var el=e.target;if(el.id==='pq'){qtxt=el.value;var pl2=$('#plist');if(pl2)pl2.innerHTML=plist();return}var k=el.dataset.k;if(!k)return;var v=+el.value;if(k==='ndfl'||k==='profit'||k==='prop')S.tax[k]=v;else S[k]=v;
  var o=$('#o_'+k);if(o)o.textContent=k==='prop'?v.toFixed(1).replace('.',',')+'%':(k==='ndfl'||k==='profit')?v+'%':mfull(v)});

/* ============ сохранение ============ */
function save(){try{var o=JSON.stringify(S,function(k,v){return k&&k[0]==='_'||k==='sel'||k==='fx'||k==='mvId'||k==='build'?undefined:v});localStorage.setItem('city:save',o)}catch(e){}}
function load(){try{var j=localStorage.getItem('city:save');if(!j)return false;var o=JSON.parse(j);if(!o||o.v!==1||!o.lots||o.lots.length!==144||!o.people)return false;S=o;byId.clear();FC={};S.people.forEach(reg);S.ev=S.ev||{b:[],d:[]};S.st=S.st||{births:0,deaths:0};if(S.spd==null)S.spd=3;
  S.lots.forEach(function(L){L._w=null;L.in=0});S.people.forEach(function(p){if(p.c0==null)p.c0=p.cash});
  rebuildIdx();calcStats();S.people.forEach(planDay);placeAll();return true}catch(e){return false}}

/* ============ главный цикл ============ */
var last=performance.now(),lastHud=0,lastSave=0,lastCard=0;
function frame(now){var dt=Math.min(.25,(now-last)/1000);last=now;
  if(FF){var t0=performance.now();while(FF.left>0&&performance.now()-t0<14){advance(1);FF.left--}if(FF.left<=0){FF=null;$('#ff').classList.remove('on')}else $('#ff').textContent='⏩ Перемотка… '+Math.round((1-FF.left/FF.all)*100)+'%'}
  else if(S.spd>0)advance(dt*SPEEDS[S.spd]);
  stepFly();stepFollow();draw();
  if(now-lastHud>250){lastHud=now;updHud()}
  if(now-lastCard>600){lastCard=now;if(S.sel)refreshCard();if(cur==='city'||cur==='log'||cur==='build')renderSheet()}
  if(now-lastSave>20000){lastSave=now;save()}
  requestAnimationFrame(frame)}
window.addEventListener('resize',function(){resize()});
document.addEventListener('visibilitychange',function(){if(document.hidden)save();else last=performance.now()});window.addEventListener('pagehide',save);
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT')return;if(e.key===' '){e.preventDefault();setSpeed(S.spd?0:3)}else if(e.key==='+'||e.key==='=')zoomAt(W/2,H/2,cam.s*1.25);else if(e.key==='-')zoomAt(W/2,H/2,cam.s/1.25);else if(e.key==='Escape'){if(cur)closeSheet();else selClear()}});
function boot(){initGround();if(!load())newCity();buildStatic();initHud();setSpeed(S.spd);resize();fitCam();updHud();requestAnimationFrame(frame)}
window.CITY={get S(){return S},step:function(min){for(var i=0;i<min;i++)advance(1)},stats:function(){calcStats();return S.st},hist:function(){return S.hist},newCity:function(){newCity();buildStatic()},riot:riot,terror:terror,cam:cam,X:X,Y:Y,pPos:pPos,flyTo:flyTo,fitCam:fitCam,fire:fire,build:build,speed:setSpeed};
boot();
})();
