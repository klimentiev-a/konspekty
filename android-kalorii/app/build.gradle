plugins { id 'com.android.application' }

def vc = (project.findProperty('versionCode') ?: '1') as int

android {
    namespace 'io.github.sherlockkka.kalorii'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.sherlockkka.kalorii'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1.${vc}"
    }
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'hubapp2026'
            keyAlias 'hub'
            keyPassword 'hubapp2026'
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
