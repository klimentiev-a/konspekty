<script>
(function(){
'use strict';
(function(){
  var k='lasthash:'+(location.pathname.split('/').pop()||'index.html');
  try{
    if(!location.hash){var h=localStorage.getItem(k);if(h&&h.length>1)history.replaceState(null,'',location.pathname+location.search+h)}
    var sv=function(){try{if(location.hash.length>1&&!/^#home$/.test(location.hash))localStorage.setItem(k,location.hash);else localStorage.removeItem(k)}catch(e){}};
    window.addEventListener('hashchange',sv);sv();
  }catch(e){}
})();
var root=document.documentElement;
function $(s,e){return (e||document).querySelector(s)}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var view=$('#view');
var D=JSON.parse($('#edata').textContent),LS=D.lessons,BYID={};
LS.forEach(function(l,i){l.i=i;BYID[l.id]=l});
var PROF='artem';

/* оформление (общее с разделом «Финансы») */
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme')}
var SKINS=[['auto','Как в системе','#F4F1E8','#1F6B57',''],['ocean','Океан','#E9F0F6','#1A5FA8','light'],
  ['dark','Ночь','#171611','#5FC2A3','dark'],['graphite','Графит','#15171B','#7BA7F5','dark'],['news','Газета','#161512','#E0483B','dark']];
function applySkin(id){
  var sk=SKINS.filter(function(x){return x[0]===id})[0];if(!sk){id='auto';sk=SKINS[0]}
  if(id==='auto'){root.removeAttribute('data-skin');applyTheme('')}
  else if(id==='light'||id==='dark'){root.removeAttribute('data-skin');applyTheme(id)}
  else{root.setAttribute('data-skin',id);applyTheme(sk[4])}
  try{var bg=getComputedStyle(root).getPropertyValue('--bg').trim();$$('meta[name=theme-color]').forEach(function(m){if(bg)m.setAttribute('content',bg)})}catch(e){}
}
function skinGet(){var v=store('fin:skin');if(v)return v;var t=store('theme');return t==='dark'||t==='light'?t:'auto'}
applySkin(skinGet(),true);
function skinMenu(open){
  var m=document.getElementById('thm');
  if(!open){if(m)m.remove();return}
  if(m){m.remove();return}
  var cur=skinGet();m=document.createElement('div');m.id='thm';m.className='thm';m.setAttribute('role','menu');
  m.innerHTML='<p>Оформление</p>'+SKINS.map(function(x,i){return (i===1||i===3?'<div class="sep"></div>':'')+'<button type="button" role="menuitemradio" aria-checked="'+(x[0]===cur)+'" class="'+(x[0]===cur?'on':'')+'" data-skin="'+x[0]+'"><span class="skw" style="background:'+x[2]+'"><i style="background:'+x[3]+'"></i></span>'+x[1]+'</button>'}).join('');
  document.body.appendChild(m);
}

/* прогресс: только отметки «прочитано» */
var P=(function(){try{return JSON.parse(store('bcamp:'+PROF)||'{}')||{}}catch(e){return {}}})();
P.done=P.done||{};
function pSave(){store('bcamp:'+PROF,JSON.stringify(P))}

/* markdown */
marked.use({gfm:true,breaks:false,renderer:{
  table:function(h,b){return '<div class="tablewrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>\n'},
  code:function(code,lang){if(lang==='f')return '<div class="f">'+esc(code)+'</div>\n';return '<pre><code>'+esc(code)+'</code></pre>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
function md(s){return marked.parse(s||'')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9а-яё]+/g,'-').replace(/^-|-$/g,'')}

function nextLesson(){for(var i=0;i<LS.length;i++)if(!P.done[LS[i].id])return LS[i];return null}
function plural(n,f){var m=n%10,c=n%100;return m===1&&c!==11?f[0]:(m>=2&&m<=4&&(c<10||c>=20)?f[1]:f[2])}
/* поиск по тексту занятий: основы слов (окончания), е=ё */
function lc(x){return String(x==null?'':x).toLowerCase().replace(/ё/g,'е')}
function toks(q){return lc(q).split(/[\s,;]+/).filter(Boolean).map(function(t){return t.length>5&&/[а-я]/.test(t)?t.slice(0,t.length-2):t})}
LS.forEach(function(l){l.lq=lc(l.title+' '+l.short+' '+l.text)});
function snippet(l,tk){
  var x=l.text,xl=lc(x),i=-1;for(var k=0;k<tk.length&&i<0;k++)i=xl.indexOf(tk[k]);
  if(i<0)return esc(l.short);
  var a=Math.max(0,i-70),b=Math.min(x.length,i+150);
  var sa=x.indexOf(' ',a);if(a>0&&sa>-1&&sa<i)a=sa+1;var sb=x.lastIndexOf(' ',b);if(b<x.length&&sb>i)b=sb;
  var t=esc(x.slice(a,b));
  tk.forEach(function(w){t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]'),'gi'),function(m){return '<mark class="hl">'+m+'</mark>'})});
  return (a>0?'…':'')+t+(b<x.length?'…':'');
}
function lessonRow(l,tk){
  var d=!!P.done[l.id];
  return '<a class="lrow'+(d?' done':'')+'" href="#t/'+l.id+'" data-id="'+l.id+'"><span class="ln">'+(d?'✓':l.n)+'</span><span class="lt"><b>'+esc(l.title)+'</b><small>'+(tk?snippet(l,tk):esc(l.short))+'</small></span><span class="lm"><span class="tag">'+esc(l.date)+'</span><span class="tag">≈ '+l.min+' мин</span></span></a>';
}
function renderHome(){
  document.title='ИИ-курс · конспекты';
  var done=Object.keys(P.done).filter(function(k){return BYID[k]}).length,tot=LS.length,nx=nextLesson(),mins=LS.reduce(function(s,l){return s+l.min},0);
  var h='<h1 class="pg">Введение в ИИ</h1><p class="lead">Конспекты '+tot+' занятий курса «Введение в искусственный интеллект: инструменты и промпты»: только теория и приёмы — как устроены модели, как писать промпты, работать с текстами, данными, изображениями, видео, ассистентами и безопасно применять ИИ. Данные о сервисах и законах — по состоянию на осень 2026, пометка «сверить» — проверить по источнику.</p>';
  h+='<div class="hero"><div class="box"><h3>Прогресс</h3><div class="big">'+done+' <small>из '+tot+' занятий</small></div><div class="bar2"><i style="width:'+Math.round(done/tot*100)+'%"></i></div>'
    +'<div class="stats"><span>Чтения: <b>≈ '+Math.round(mins/6)/10+' ч</b></span></div></div>';
  h+= nx?'<a class="box cont" href="#t/'+nx.id+'"><h3>'+(done?'Продолжить':'Начать')+'</h3><b>'+nx.n+'. '+esc(nx.title)+'</b><small>'+esc(nx.short)+'</small><span class="btn sm" style="align-self:flex-start">Открыть занятие</span></a>'
    : '<div class="box"><h3>Всё прочитано</h3><b style="font:600 19px var(--serif)">Все занятия отмечены</b><p class="lead" style="margin:6px 0 0">Перечитывай разделы «Главное» в конце каждого занятия.</p></div>';
  h+='</div>';
  h+='<div class="tools"><input type="search" id="lq" placeholder="Найти по занятиям: токен, RAG, промпт, рубрика…" aria-label="Поиск по занятиям"></div>';
  h+='<div id="llist">'+LS.map(function(l){return lessonRow(l)}).join('')+'</div><div class="empty" id="lnone" hidden>Ничего не найдено.</div>';
  view.innerHTML=h;
}
function filterHome(){
  var q=(($('#lq')||{}).value||'').trim(),tk=q.length>=2?toks(q):[];
  var list=LS.filter(function(l){return !tk.length||tk.every(function(t){return l.lq.indexOf(t)>=0})});
  $('#llist').innerHTML=list.map(function(l){return lessonRow(l,tk.length?tk:null)}).join('');
  $('#lnone').hidden=list.length>0;
}

function renderLesson(id,sub){
  var l=BYID[id];if(!l){location.hash='#home';return}
  document.title=l.title+' · ИИ-курс';store('bcamp:last:'+PROF,id);
  var done=!!P.done[l.id],pv=LS[l.i-1],nx=LS[l.i+1];
  var body=md(l.theory),tmp=document.createElement('div');tmp.innerHTML=body;
  var heads=[];$$('h2,h3',tmp).forEach(function(hd){var s='s-'+slug(hd.textContent);hd.id=s;if(hd.tagName==='H2')heads.push([s,hd.textContent])});
  body=tmp.innerHTML;
  var h='<a class="crumb" href="#home">← Все занятия</a><h1 class="pg">'+l.n+'. '+esc(l.title)+'</h1>'
   +'<div class="lh"><span class="tag">'+esc(l.date)+'</span><span class="tag">≈ '+l.min+' мин</span>'+(done?'<span class="tag sc">прочитано</span>':'')+'</div>'
   +'<p class="lead">'+esc(l.short)+'</p>';
  if(heads.length)h+='<nav class="snav" id="snav">'+heads.map(function(x){return '<button type="button" class="chip" data-go="'+x[0]+'">'+esc(x[1])+'</button>'}).join('')+'</nav>';
  h+='<div class="prose" id="theory">'+body+'</div>';
  h+='<div class="done-bar'+(done?' ok':'')+'" id="donebar"><button type="button" class="btn" data-done="'+l.id+'">'+(done?'✓ Прочитано (снять отметку)':'Отметить прочитанным')+'</button></div>';
  h+='<div class="pager">'+(pv?'<a class="pv" href="#t/'+pv.id+'"><small>← Предыдущее</small><b>'+pv.n+'. '+esc(pv.title)+'</b></a>':'<span></span>')+(nx?'<a class="nx" href="#t/'+nx.id+'"><small>Следующее →</small><b>'+nx.n+'. '+esc(nx.title)+'</b></a>':'')+'</div>';
  view.innerHTML=h;
  var hh=$('#top').offsetHeight;root.style.setProperty('--hh',hh+'px');
  if(sub){var el=document.getElementById(sub);if(el)setTimeout(function(){el.scrollIntoView({block:'start'});el.classList.add('pulse')},30)}
}

function setNav(s){$$('#sw a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===s)})}
var lastRoute='';
function route(){
  var h=decodeURIComponent(location.hash.slice(1)||'home'),p=h.split('/');lastRoute=h;
  skinMenu(false);
  if(p[0]==='t'){setNav('home');renderLesson(p[1],p[2])}
  else{setNav('home');renderHome()}
  if(!(p[0]==='t'&&p[2]))window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(!t.closest)return;
  if(t.closest('#b-theme')){e.stopPropagation();skinMenu(true);return}
  if(b=t.closest('#thm [data-skin]')){var id=b.getAttribute('data-skin');store('fin:skin',id);if(id==='light'||id==='dark')store('theme',id);applySkin(id);skinMenu(false);return}
  if(document.getElementById('thm')&&!t.closest('#thm'))skinMenu(false);
  if(b=t.closest('[data-sz]')){if(window.siteZoom)window.siteZoom(+b.getAttribute('data-sz'));return}
  if(b=t.closest('[data-go]')){var el=document.getElementById(b.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b=t.closest('[data-done]')){var l2=BYID[b.getAttribute('data-done')];if(P.done[l2.id]){delete P.done[l2.id]}else{P.done[l2.id]=Date.now()}pSave();var bar=$('#donebar'),dn=!!P.done[l2.id];bar.classList.toggle('ok',dn);b.textContent=dn?'✓ Прочитано (снять отметку)':'Отметить прочитанным';return}
});
document.addEventListener('input',function(e){if(e.target.id==='lq')filterHome()});
route();
})();
</script>
</body></html>
