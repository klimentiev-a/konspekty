жи правки списком: было → стало → почему». Если попросить всё сразу, модель перепишет текст целиком и потеряет ваш голос.\n\n Канцелярит (officialese)  — признаки: отглагольные существительные («осуществление», «проведение» → «делать», «провести»); цепочки родительных падежей («повышения эффективности осуществления деятельности»); пустые обороты («в целях», «в рамках», «было принято решение»). Пример: «В целях повышения эффективности… было принято решение о проведении мероприятия» → «Чтобы студентам было проще учиться, мы проведём занятие и покажем, как работают инструменты ИИ».\n\n  Модель плохо считает слова\n\nМодель работает с токенами, а пока пишет текст, не «видит» итоговую длину; поэтому «ровно 150 слов» превращается в 120 или 190. Что делать: просить диапазон («120–150 слов»), задавать структуру («3 абзаца по 2–3 предложения»), проверять счётчиком в редакторе, а лимит символов добирать итерациями.\n\n  Авторский голос\n\n1. Возьмите 2–3 своих текста.\n2. Попросите модель выделить 5–7 признаков вашего стиля.\n3. Отредактируйте описание — это  паспорт стиля (style passport)  — и сохраните в инструкциях или памяти.\n4. Черновик пишете вы; модель — редактор, правит форму, не мысль.\n\nПочему работает: это few shot для стиля. Ваши тексты — примеры, описание — правило; модель повторяет образец вместо «среднего голоса интернета».\n\n Промпт «паспорт стиля»:  «Ниже три моих текста. Опиши мой стиль как инструкцию для редактора: 1) длина предложений и абзацев; 2) любимые слова и обороты; 3) чего я избегаю; 4) как начинаю и заканчиваю; 5) формальность по шкале 1–5; 6) три типичные фразы. Не оценивай качество — только опиши». Проверьте описание: узнаёте ли себя; уберите то, что не нравится.\n\n  Признаки «шаблонного» текста\n\nНе «детектор ИИ», а признаки слабого текста — человеческого или машинного; их полезно убирать всегда:\n\n  Признак   Пример  \n \n  Пустое начало   «В современном мире…», «Ни для кого не секрет…» — первую фразу можно удалить  \n  Слова усилители   «ключевой», «играет важную роль» — оценка без фактов  \n  Всё по три   Три пункта, три прилагательных — симметрия вместо мысли  \n  Обобщения   «Многие эксперты считают», «исследования показывают» — кто? какие?  \n  Ровный ритм   Все предложения одного строения — монотонно  \n  Вывод = вступление   Заключение пересказывает начало, нового вывода нет  \n\n ИИ меняет язык науки.  Исследование Kobak и др. (Science Advances, 2025) по «избыточной лексике»: не менее 13,5% аннотаций биомедицинских статей PubMed за 2024 год обработаны с помощью LLM (до 40% в отдельных группах). Слова маркеры английского «машинного» стиля:  delve, underscore, pivotal, intricate, realm, meticulous, comprehensive, showcase, additionally/furthermore, testament . Вывод: «машинный» стиль заметен — его стоит редактировать, а использование ИИ раскрывать.\n\n  Детекторы ИИ текста\n\nИм нельзя доверять: детектор даёт вероятность, а не доказательство. OpenAI закрыла свой классификатор 20 июля 2023 года: он распознавал лишь 26% ИИ текстов и ошибочно помечал 9% человеческих. Детекторы в среднем приняли за ИИ 61% эссе людей, для которых английский не родной (Liang и др., 2023). Лучшая защита — честное раскрытие использования ИИ.\n\n  ИИ текст в учёбе: раскрытие\n\n(Правила НИУ ВШЭ «Правила использования искусственного интеллекта студентами»; в другой организации правила могут отличаться.)\n\n  Общего запрета на генеративные модели нет; допустимость в конкретной работе определяет преподаватель.\n  Если использование разрешено — его  раскрывают ; скрывать нельзя. Использовать ИИ, если преподаватель запретил, нельзя.\n  Раскрытие — не признание вины, а нормальная академическая практика. Если правку опечаток нужно раскрывать, достаточно одной строки: какая модель, какие части, цель.\n\n Описание применения ИИ — четыре пункта: \n\n1.  Какие части  — вся работа, разделы или фрагменты.\n2.  Цель и способ  — сгенерировано; сгенерировано и отредактировано; авторский текст с материалами ИИ.\n3.  Какая модель  — название и адрес сайта.\n4.  Насколько помогло  — оценка эффективности.\n\nПример: «Раздел 2: план — GigaChat (giga.chat), текст — автор. Аннотации сокращены в Алисе AI. Две выдуманные моделью статьи исключены».\n\n Серая зона: \n\n  Ситуация   Как поступить  \n \n  План эссе от ИИ, текст свой   Можно, если нет запрета; раскрыть  \n  Редактура своего текста с ИИ   Можно, если нет запрета; раскрыть  \n  Текст от ИИ сдан как свой   Нарушение академических норм  \n  Перевод статьи для понимания   Можно; цитировать — по оригиналу  \n  Список литературы от ИИ   Только с проверкой каждого источника  \n  ИИ на тесте, где он запрещён   Нарушение  \n\n  Как оценить текст, сделанный с ИИ\n\n1. Факты на месте: все цифры и имена из исходника, ничего не добавлено.\n2. Аудитория узнаёт себя: термины, длина, тон.\n3. Цель достигнута: читатель понимает, что от него нужно.\n4. Нет шаблонов: ни пустых начал, ни слов усилителей без фактов.\n5. Раскрытие конкретное, 2–3 строки.\n\n Лайфхаки:  сначала 5–7 тезисов, потом текст; три варианта начала — выбрать лучшее; «строгий рецензент: найди 5 слабых мест»; шкалы стиля; обратный перевод. Цифры и имена сверять, чужие персональные данные не вставлять, цитаты брать из реальных источников, длину проверять счётчиком.\n\n  Работа с документами\n\nС документами модель полезна, если опирается на текст и показывает, где это написано.\n\n  Что умеет ИИ\n\nКонспект (сжать статью до тезисов); ответы на вопросы по тексту (с цитатой и местом); извлечение фактов в таблицу (даты, суммы, условия); сравнение версий (что добавили, что убрали); поиск противоречий (цифры, сроки, формулировки); подготовка карточек «вопрос — ответ».\n\n  Три уровня сжатия конспекта\n\n  Уровень   Что   Объём  \n \n  Структурный конспект   По разделам, с номерами страниц/пунктов   1–2 страницы  \n  Тезисы   5–7 главных утверждений с опорой на раздел   полстраницы  \n  Аннотация   3 предложения: о чём, что сделано, что следует   абзац  \n\nСжимайте по шагам: каждый следующий уровень делайте из предыдущего, а не из исходника. Сначала просите самый подробный уровень с указанием разделов — сжимать проще, чем «развернуть».\n\n  Конспект зависит от цели\n\n  Цель   Что включать  \n \n  Для экзамена   Определения, формулы, примеры, типичные вопросы  \n  Для решения   Выводы, варианты, риски, сроки, стоимость  \n  Для обзора литературы   Вопрос, метод, выборка, результат, ограничения  \n  Для критики   Аргументы автора и слабые места, недостающие данные  \n  Для пересказа коллеге   Пять пунктов: что, почему, что изменится, что делать, где подробнее  \n\nНазовите цель в промпте — модель поймёт, что важно.\n\n  Шаблон: извлечение фактов в таблицу\n\n  Извлеки из документа все [ЧТО] в таблицу:   Факт   Цитата дословно   Раздел или страница  . Правила: только то, что есть в тексте; цитата — точная копия в кавычках; если раздел/страницу не видно — «не указано»; в конце перечисли, что искал, но не нашёл.\n\nЗачем каждое правило: запрет добавлять — защита от галлюцинаций; дословную цитату проверяют поиском Ctrl+F; «не указано» честнее выдуманной страницы; список ненайденного показывает пробелы. Строка «не найдено» — признак хорошего промпта, а не плохой модели; если модель «нашла» сумму, которой нет в документе, — это галлюцинация.\n\n  Длинный документ\n\nПринять файл ≠ одинаково внимательно его прочитать: модели хуже используют середину длинного текста («Lost in the Middle»). Поэтому:\n\n  инструкцию — в начало, ключевой вопрос повторить в конце, после документа;\n  большой файл — по главам, каждая глава отдельным запросом; факты из середины проверять особенно внимательно.\n\n Документ на 300 страниц:  1) попросить оглавление (разделы и объём); 2) конспект каждой главы отдельным запросом; 3) свести конспекты в один документ; 4) задавать вопросы к сводке и проверять цитаты в оригинале. Лайфхак: «Чего в этом документе НЕТ из того, что обычно бывает в документах такого типа?» — быстро видны пробелы (например, в договоре нет сроков или ответственности).\n\n  RAG: как ИИ отвечает по вашим файлам\n\n RAG (Retrieval Augmented Generation — генерация с опорой на найденные фрагменты)  описана Lewis и др., 2020.\n\n Подготовка (один раз):  документы (PDF, DOCX, страницы) → фрагменты (от абзаца до страницы) →  индекс  («числовой отпечаток» смысла каждого куска).\n\n Ответ (каждый раз):  вопрос → поиск 3–5 похожих фрагментов → модель получает вопрос + фрагменты → ответ по фрагментам со ссылками.\n\nОтвет можно проверить, но  ошибка поиска становится ошибкой ответа .\n\n Аналогия — экзамен:  без RAG — экзамен по памяти (модель не знает ваших документов, уверенно заполняет пробелы); с RAG — экзамен с учебником (сначала находит нужные страницы, отвечает с опорой, может показать источник), но ошибётся, если открыла не ту страницу или информация на странице неверна.\n\n Где встречается RAG:  поиск с ответом (ИИ ответ в поисковике), чат по файлу, режимы «Исследовать»/Deep Research, боты с базой знаний, чат боты банков и магазинов.\n\n  Что выбрать\n\n  Подход   Когда подходит   Ограничение  \n \n  Весь документ в чат   Один документ, помещается в контекст   Середина «теряется»  \n  RAG по файлам   Много документов, частые вопросы   Ответ хорош настолько, насколько хорош поиск  \n  Поиск в интернете   Свежие события, общедоступные факты   Разное качество источников — проверка  \n  Без источников   Объяснение понятий, идеи, черновики   Не годится для фактов, цифр, цитат  \n\n  Почему ответы по документам тоже ошибаются\n\n  Ошибка   Что делать  \n \n  Не нашёл — нужный фрагмент не попал в поиск, «в документе этого нет»   Переформулировать вопрос словами документа  \n  Нашёл не то — похожий, но другой пункт   Проверять цитату и раздел  \n  Склеил — смешал два фрагмента в «факт»   Просить цитату на каждое утверждение  \n  Источник устарел   Проверять дату и редакцию  \n  Додумал «общеизвестное» поверх текста   Запретить внешние знания  \n\n Номер страницы  модель генерирует как обычный текст: он может быть правдоподобным, но неверным (при извлечении текста из PDF номера страниц часто теряются). Опирайтесь на дословную цитату: находите её Ctrl+F и по ней устанавливайте страницу.\n\n  Проверка цитат и ссылок\n\n Ссылка для модели — такой же текст, как всё остальное:  она знает, как выглядит ссылка (фамилии, год, журнал, DOI — Digital Object Identifier, цифровой идентификатор объекта), и собирает правдоподобную на несуществующую статью. По Walters и Wilder (Scientific Reports, 2023): 55% ссылок GPT 3.5 и 18% ссылок GPT 4 были выдуманными, а 43% и 24% реальных ссылок содержали существенные ошибки (цифры для моделей 2023 года; режим поиска снижает риск, но не убирает).\n\n Мораль примера «юристы и ChatGPT»  (дело Mata v. Avianca, суд Нью Йорка): модель выдала несуществующие судебные решения, юристы сослались на них; 22 июня 2023 года суд оштрафовал юристов и фирму на 5000 долларов. Модель — не база данных.\n\n Проверка DOI:  добавьте DOI после адреса  doi.org/ : если открывается другая статья или ничего, ссылка выдумана или искажена; затем сверьте авторов, год, название и найдите цитату в тексте статьи.\n\n  Протокол проверки: четыре шага\n\n1.  Существует?  — по DOI, названию, в каталоге библиотеки.\n2.  Дословно?  — найти цитату поиском Ctrl+F.\n3.  В контексте?  — прочитать абзац до и после: не искажён ли смысл.\n4.  Оформлено?  — автор, год, страница по требованиям работы.\n\n  Что проверяем   Где  \n \n  Научная статья   doi.org, eLIBRARY.RU, КиберЛенинка, сайт журнала  \n  Закон   Официальный интернет портал правовой информации pravo.gov.ru  \n  Статистика   Сайт Росстата или первоисточника данных  \n\n Таблица проверки:  утверждение модели   цитата найдена дословно?   раздел/страница верны?   вывод (оставить / переписать / удалить). Хороший результат — не «модель нигде не ошиблась», а «все ошибки найдены и исправлены».\n\n  «База знаний» из доступных сервисов\n\n1. Подборка 3–5 проверенных источников по теме.\n2. Каждый источник — в отдельном чате, тезисы с цитатами.\n3. Сводка — один документ со всеми конспектами и ссылками.\n4. Вопросы — новый чат: сводка + правило «Отвечай только по текстам ниже. Каждое утверждение подтверждай цитатой в кавычках и источником [1], [2]. Если ответа нет, напиши: “В источниках этого нет”. Не используй общие знания».\n\n  Карточки для самопроверки\n\n«По конспекту составь 10 карточек: Вопрос — Ответ — Где в конспекте. Вопросы разного типа: определение, пример, сравнение, “почему”. Ответы только из конспекта». Тренировка: закрыть ответы и отвечать вслух; ошибки выписывать и повторять через день; попросить модель спрашивать по одному и оценивать ответы. Проверять карточки нужно по конспекту, а не по памяти модели.\n\n Ловушка проверка:  вопрос, ответа на который в документе нет. Честная модель скажет «в документе этого нет».\n\n  Лайфхаки для документов\n\n1. Сначала оглавление — решить, что читать подробно.\n2. Цитаты в кавычках — дословный фрагмент на каждое утверждение.\n3. «Чего здесь нет?» — находит недостающие условия.\n4. Сравнение версий — что добавлено, удалено, изменено.\n5. «Только по тексту» — «нет в документе — так и скажи».\n\nОсторожно: персональные данные и коммерческая тайна не загружаются; номера страниц проверять в оригинале; в сканах цифры сверять; проверять дату и редакцию.\n\n  Главное\n\n1. В тексте факты даёт человек, форму — модель; редактируйте по одной операции за запрос.\n2. Голос сохраняется паспортом стиля; шаблонные признаки убирают всегда.\n3. ИИ раскрывают: какие части, как, какая модель, насколько помогло.\n4. По документам — только дословные цитаты и «не найдено» вместо выдумки; большой файл — по главам.\n5. RAG: ошибка поиска = ошибка ответа; ссылки и цитаты проверяются в первоисточнике.","id":"teksty-i-dokumenty"},{"n":4,"title":"ИИ для аналитики и генерация изображений","short":"Кодирование ответов, расчёты и графики, диффузионные модели, промпт для картинки, права и маркировка","date":"Пары 7–8","min":14,"theory":"## Повтор занятия 3\n\n- **RAG** — модель находит нужные фрагменты в ваших документах и строит ответ по ним; она не переобучается, документы подаются в контекст как источник.\n- Перед вставкой цитаты в работу нужно найти первоисточник и сверить текст дословно: ссылка и цитата могут быть правдоподобными, но выдуманными.\n- Свой стиль при редактуре сохраняют так: даёте образец своего текста и просите минимальную правку с пометкой изменений. Без образца модель переписывает «под себя» — гладко, но безлико.\n\n## ИИ для аналитики\n\n**Главная идея:** языковая модель хорошо читает и размечает, а считать должны формула или код.\n\n**Почему чат-бот ошибается в сумме двадцати чисел, хотя пишет эссе.** Модель не считает, а предсказывает следующий токен; числа видит кусками и подбирает правдоподобные цифры; на длинных расчётах ошибки накапливаются. Числа доверяем формуле в таблице или коду, который модель пишет и запускает, а модель объясняет результат.\n\n### Аналитика как конвейер\n\n| Шаг | Что | Кто |\n|---|---|---|\n| 1. Сбор | Анкеты, отзывы, выгрузки, заметки | Человек |\n| 2. Очистка | Даты, названия, пропуски, дубли | LLM + проверка |\n| 3. Структурирование | Категории, тональность, сущности | LLM |\n| 4. Расчёт | Суммы, доли, средние, медианы | Формула или код |\n| 5. Визуализация | График под вопрос | Код или редактор |\n| 6. Вывод | Что это значит и что делать | Человек |\n\n### Два режима работы с данными\n\n| Модель читает | Программа считает | Человек решает |\n|---|---|---|\n| Отнести ответ к категории, определить тональность, вытащить даты и суммы, привести записи к одному виду, сформулировать суть | Суммы, доли, средние, медианы; сводные таблицы; проценты и динамика; графики; проверка числа строк и пропусков | Какие категории нужны; проверка выборки вручную; отличить закономерность от случайности; вывод и рекомендация; ответственность за результат |\n\n## Из текста — в таблицу\n\n### Шесть операций модели с текстом\n\n| Операция | Пример |\n|---|---|\n| **Кодирование (coding)** | Ответ → категория из списка: «Что мешает учиться?» → «нехватка времени» |\n| **Классификация** | Объект → тип по правилам: обращение → «возврат», «доставка», «оплата» |\n| **Тональность (sentiment)** | Позитивная, негативная, нейтральная, смешанная |\n| **Извлечение** | Текст → поля таблицы: письмо → дата, организация, сумма, срок |\n| **Нормализация** | «ВШЭ», «Вышка», «НИУ ВШЭ» → «НИУ ВШЭ» |\n| **Группировка** | 200 идей → 8 тем с примерами |\n\nКаждая операция — отдельный промпт.\n\n### Кодирование открытых ответов\n\n1. **Прочитать выборку** — 30–50 ответов глазами: какие темы встречаются.\n2. **Кодовая книга (codebook)** — категории, определения, примеры, правило «Другое».\n3. **Разметка** — модель размечает все ответы по кодовой книге.\n4. **Проверка** — человек сверяет случайные 10–20%.\n5. **Подсчёт** — частоты и доли формулой или кодом.\n\n**Кодовая книга** — список категорий с определениями и примерами. Она делает разметку воспроизводимой: тот же промпт через неделю даст сопоставимый результат, а коллега поймёт правила. ИИ не заменяет методологию, а ускоряет разметку; шаги 1, 2, 4 остаются за человеком.\n\n**Промпт разметки:** «Ты — ассистент социолога. Размечаешь ответы на вопрос “[ВОПРОС]”. Категории (ровно одна): 1. Время — …; 2. Техника — …; 3. Мотивация — …; 4. Другое; 5. Не определить. Формат: | ID | категория | цитата |. Новые категории не придумывай». Категории «Другое» и «Не определить» обязательны: без них модель натягивает ответы на неподходящие категории.\n\n**Было → стало.** «Проанализируй отзывы и скажи, что думают клиенты» даёт связный текст, который нельзя ни посчитать, ни проверить. Лучше: «Отнеси каждый отзыв к одной категории: вкус, цена, скорость, сервис, другое. Отметь тональность. Ответ — таблица: № | категория | тональность | цитата. Не добавляй отзывы, которых нет». **Сначала таблица, потом выводы.**\n\n### Где модель ошибается в тональности\n\n| Случай | Пример |\n|---|---|\n| Сарказм | «Отличная доставка, всего два часа ждали» — буквально позитив, по смыслу негатив |\n| Смешанный отзыв | «Курс полезный, но платформа постоянно падает» — нужна категория «смешанно» |\n| Отрицание | «Не сказал бы, что плохо» — двойное отрицание сбивает простые правила |\n| Контекст области | «Препарат вызвал реакцию» — в медицине может быть нейтральной констатацией |\n\nЛайфхак: добавьте категорию «смешанно» и требуйте цитату-основание.\n\n### Извлечение сущностей (entity extraction)\n\nПромпт: «Извлеки поля: дата, время, место, организатор, стоимость, дедлайн, ответственный. **Если поля нет в тексте — оставь пустым.** Ответ — таблица». Правило «если нет — пусто» не даёт модели досочинить. В реальных письмах ФИО и контакты — персональные данные: обезличивайте перед загрузкой.\n\n### Как проверить разметку, не перечитывая 300 ответов\n\n1. **Два прогона** — разметить те же ответы в двух ассистентах или двумя прогонами.\n2. **Совпадения** — посчитать долю ответов с одинаковой категорией.\n3. **Расхождения** — читать только спорные: там ошибки и пробелы кодовой книги.\n4. **Выборка** — вручную проверить 30 (10%) случайных ответов из совпавших.\n\nСлучайных, а не первых 30: в начале файла данные часто однороднее. Если ручная проверка часто расходится с моделью, дело обычно в кодовой книге: добавьте определения и примеры пограничных случаев и разметьте заново.\n\n## Таблицы, формулы, расчёты, графики\n\n**Персональные данные не нужны для среднего чека:** имена и телефоны (персональные данные по 152-ФЗ — Федеральному закону «О персональных данных») удалите или замените ID. Средний чек надёжнее посчитать формулой СРЗНАЧ в таблице: файл вообще не покинет компьютер. Часть задач ИИ не нужна вовсе.\n\n### Три надёжных способа посчитать с ИИ\n\n1. **Формула от ИИ** — модель пишет формулу, считает редактор (Excel, Р7-Офис, МойОфис, Яндекс Таблицы).\n2. **Интерпретатор кода (code interpreter)** — модель пишет и запускает код (GigaChat; «Исследовать» в Алисе AI).\n3. **ИИ внутри таблицы** — функция «АЛИСАПРО» в Яндекс Таблицах: команды на обычном языке (бесплатно 50 запросов в месяц).\n\nОбщая идея: модель пишет инструкцию, вычисляет программа.\n\n### Промпт для формулы: опишите таблицу\n\n«Таблица Excel, русская версия. Заголовки в строке 1. A — дата (ДД.ММ.ГГГГ), B — категория, C — сумма, ₽. Нужна формула для F2: сумма по категории из E2 за [МЕСЯЦ]. Русские названия функций, разделитель “;”. Объясни формулу и как её проверить». Четыре составляющие: **где** (лист и столбцы), **что** (типы и даты), **версия** (функции и «;»), **проверка**. В русской версии Excel названия функций русские, а аргументы разделяются точкой с запятой.\n\n### Формулы, которые полезно знать по названию\n\n| Задача | Функция |\n|---|---|\n| Условие | ЕСЛИ |\n| Сумма по условию | СУММЕСЛИ / СУММЕСЛИМН |\n| Подсчёт по условию | СЧЁТЕСЛИ / СЧЁТЕСЛИМН |\n| Среднее по условию | СРЗНАЧЕСЛИ |\n| Подтянуть из другой таблицы | ВПР |\n| Медиана (устойчива к выбросам) | МЕДИАНА |\n| Округление | ОКРУГЛ |\n\n### Интерпретатор кода: что происходит при загрузке файла\n\n1. Вы загружаете CSV или Excel и ставите задачу.\n2. Модель пишет код на Python.\n3. Код выполняется в **песочнице (sandbox)** отдельно от модели.\n4. Результат — таблица, число или график.\n5. Модель пересказывает результат словами.\n\n**Надёжно:** арифметика, подсчёты, сводные таблицы, графики. **Требует проверки:** какой столбец взят и как прочитаны даты; что сделано с пропусками; пересказ (модель может приукрасить).\n\n### Проверка расчёта за две минуты\n\n1. **Покажи код** — попросить вывести код и названия столбцов.\n2. **Число строк** — сверить с числом строк в файле.\n3. **Контрольная сумма** — один итог проверить самому формулой СУММ или СЧЁТ.\n4. **Пропуски** — спросить, сколько пустых ячеек и что с ними сделано.\n5. **Здравый смысл** — доли в сумме дают 100%? нет отрицательных возрастов?\n\n### Какой график выбрать\n\n| Задача | График | Вопрос |\n|---|---|---|\n| Сравнить категории | Столбчатая диаграмма | Какая категория жалоб самая частая? |\n| Динамика | Линейный график | Как менялись продажи по месяцам? |\n| Доли целого | Столбцы с процентами | Какая доля ответов в каждой теме? |\n| Связь двух величин | Точечная диаграмма | Связаны ли часы подготовки и балл? |\n| Разброс значений | Гистограмма | Как распределено время ответа? |\n\n**Заголовок графика = вывод:** «Жалобы на доставку выросли вдвое за осень».\n\n### Персональные данные: обезличить или сгенерировать\n\n| Обезличить реальные данные | Сгенерировать синтетические |\n|---|---|\n| ФИО → ID (Р001, Р002…); удалить телефоны, почту, адреса; возраст → группа (18–20, 21–23); редкие сочетания признаков обобщить; таблицу «ID — ФИО» хранить у себя | Попросить модель создать 50 правдоподобных строк с заданной структурой и разбросом; отладить на них промпт и формулы; **выводов о реальном мире по ним не делать** |\n\n**Промпт для синтетических данных:** количество и вопрос анкеты; кто респонденты; длина, стиль (иногда с опечатками); 5–6 разных причин, часть ответов с двумя; сарказм и «пустые» ответы; без реальных имён и контактов; формат таблицы. Разнообразие и «трудные» ответы нужны, иначе синтетика слишком гладкая.\n\n### Лайфхаки аналитика\n\n1. Сначала «опиши таблицу»: столбцы, типы, пропуски.\n2. От 20 строк к 2000: отладка на малом куске.\n3. Цитата-основание к каждой категории.\n4. Запасные категории «Другое» и «Не определить».\n5. Сохраняйте промпт (кодовая книга — в паспорт проекта).\n6. Числа — программой.\n\nОсторожно: модель может «дорисовать» пропуски; похожие столбцы путаются; длинная таблица может не влезть; **выводы модели — гипотезы**.\n\n### Типичные ошибки\n\n1. Категории пересекаются («Мотивация» и «Скучно») — объединить или развести определениями.\n2. Нет «Другого».\n3. Модель «считала в уме» — доли не сходятся в 100%; пересчитать формулой.\n4. Не тот столбец (взята «сумма со скидкой») — проверить код.\n5. Вывод без числа: «клиенты недовольны» → «38% жалоб — о доставке».\n\n**Пример аналитического конвейера:** синтетические ответы (Qwen) → разметка по кодовой книге (GigaChat + Алиса, проверка 30 случайных и доля совпадений) → подсчёт долей интерпретатором кода (контроль формулой СЧЁТЕСЛИ) → график с заголовком-выводом (проверка подписей осей и соответствия цифрам).\n\n## Генерация изображений\n\n### Как работает диффузионная модель (diffusion model)\n\n**Диффузия** — картинка из шума.\n\n- **Обучение:** к картинкам шаг за шагом добавляют шум, модель учится его убирать.\n- **Генерация:** идёт от чистого шума; на каждом шаге убирает шум, сверяясь с промптом (шум → контуры → формы → детали → картинка).\n\n**Откуда модель знает, как выглядит «кот в шляпе»:**\n\n1. Учится на миллиардах пар «картинка — подпись».\n2. **Текстовый кодировщик** превращает промпт в числовой вектор смысла.\n3. **Диффузия в сжатом (латентном) пространстве** — шум убирается не в пикселях, а в компактном представлении; так быстрее.\n4. **Декодер** разворачивает результат в полноценное изображение.\n\nПравило: модель знает только то, что часто встречалось в подписях. «Кот» и «акварель» понятны; внутренний мем вашей группы нужно описать словами.\n\nФакты: в классической работе о диффузионных моделях 1000 шагов зашумления (Ho и др., 2020); в открытом наборе LAION-5B 5,85 млрд пар «картинка — подпись» (2022); латентная диффузия (Rombach и др., 2022) сделала генерацию доступной.\n\n**Почему шесть пальцев и ошибки в надписях.** Модель восстанавливает изображение по статистике, а не по правилам: она не «знает», что пальцев пять, и не пишет буквы, а рисует похожие формы. Мелкие детали (руки, текст) даются труднее всего.\n\n### Формула промпта для изображения\n\n| Элемент | Пример |\n|---|---|\n| Объект | рыжий кот |\n| Детали (действие, одежда, предметы) | в шляпе, читает книгу |\n| Стиль | акварель (фото, 3D, плоская иллюстрация) |\n| Композиция | крупный план, вид сбоку |\n| Свет и цвет | тёплый вечерний свет |\n| Формат | 16:9 для слайда |\n\nНе все элементы обязательны, но каждый убирает одну «случайность».\n\n**Словарь визуальных терминов:** план (крупный / средний / общий); ракурс (сверху / снизу / на уровне глаз; снизу объект кажется больше); свет (мягкий дневной, вечерний); стиль (для инфографики — плоская иллюстрация); композиция (по центру, правило третей, «пустое место справа для текста»); палитра (пастельная, монохромная, фирменная — цвета можно задать кодами HEX).\n\n**Было → стало:** «картинка про экологию города» (случайный стиль и композиция) против «плоская иллюстрация: городской парк с велодорожкой, вид сверху под углом, палитра зелёный/белый/тёмно-синий, много пустого места слева для заголовка, 16:9, в кадре только деревья, дорожки и чистое небо» — готовый фон слайда.\n\n### Негативные указания\n\nОтрицание в промпте работает ненадёжно: слова «люди», «надписи» всё равно попадают в запрос и могут проявиться. Описывайте желаемое:\n\n| Рискованно | Надёжнее |\n|---|---|\n| «Улица без людей» | «Пустая утренняя улица» |\n| «Без надписей и логотипов» | «Чистый фон, гладкие поверхности» |\n| «Не делай мрачно» | «Светлая пастельная палитра, мягкий дневной свет» |\n\nЕсли результат упрямо повторяет лишнее — уберите слово совсем и опишите сцену иначе.\n\n### Итерации\n\nБазовый промпт (объект + стиль + формат) → несколько вариантов (в Алисе AI фраза «несколько вариантов» даёт 4 картинки) → выбор лучшего **по задаче**, а не «самого красивого» → точечная правка (меняем одну деталь) → финал (проверка деталей, текста, формата). Менять одно за раз.\n\n### Текст на картинке\n\n1. Надпись в кавычках: «ОТКРЫТАЯ ЛЕКЦИЯ».\n2. Проблемные слова заглавными.\n3. Длинный текст — несколькими короткими надписями или за несколько шагов.\n4. Для макетов с текстом — модели, сильные в типографике (например, Qwen-Image).\n5. **Самый надёжный путь:** фон без текста от ИИ + надпись в редакторе презентаций.\n\n### Редактирование и выбор сервиса\n\nВозможности: точечная правка (обвести область и изменить, удалить, заменить объект); сборка из нескольких фото (до 3 в Kandinsky 6.0); объединение двух фото (Алиса AI); реставрация и стилизация; «оживление» изображения в короткое видео; поиск референсов, если объект незнаком.\n\n| Сервис | Сильные стороны | Что учесть |\n|---|---|---|\n| GigaChat · Kandinsky 6.0 | Бесплатно, без лимита; правка области; до 3 фото | Формат кадра укажите явно |\n| Алиса AI · Alice AI ART | Соотношение сторон; 4 варианта; «оживление» | Без подписки хранение 14 дней |\n| Qwen Studio · Qwen-Image | Текст на изображении | Данные — за пределами России |\n\n(Данные на осень 2026 — сверить.) Для серии выбирайте один основной сервис и не меняйте его внутри серии.\n\n### Серия в едином стиле: стилевая карточка\n\n> СТИЛЕВАЯ КАРТОЧКА «[КОМАНДА]»: Стиль: плоская векторная иллюстрация. Палитра: #102D69, #BA88E4, #DCFF05, белый. Свет: ровный дневной. Композиция: объект по центру, много воздуха. Формат: 16:9. В кадре: только предметы и природа.\n\nКарточку вставляют в начало каждого промпта серии; меняется только объект; одна модель на всю серию. Если стиль «плывёт» — приложите удачную картинку как образец.\n\n### Лайфхаки\n\nФормат — сразу (16:9, 9:16, 1:1); место под текст («свободное место слева»); один параметр за раз; образец (референс) вместо слов; описывайте желаемое («пустая улица», а не «без людей»); промпты — в паспорт. Осторожно: реальные лица — с согласия; чужие логотипы и персонажи; руки и текст проверять; фотореализм подписывать.\n\n## Права и ответственность\n\n**Изображение человека.** Статья 152.1 ГК РФ (Гражданский кодекс Российской Федерации) — использовать изображение человека можно только с его согласия (сверить по источнику). Исключения: государственные, общественные или иные публичные интересы; публичные места, если человек не основной объект; позирование за плату. «Это же шутка» не меняет правовой оценки. Пример: сгенерировать декана в костюме супергероя без согласия нельзя; костюм известного героя — ещё и чужой персонаж. Надёжно: собственный герой-талисман или письменное согласие.\n\n**Товарные знаки и персонажи.** Логотипы и бренды — право правообладателя; сходство до степени смешения нарушает исключительное право; персонажи фильмов и игр чужие. Просите «оригинальный знак, не похожий на логотипы известных брендов» и сравнивайте с логотипами конкурентов. Ответственность несёт тот, кто использует, а не нейросеть.\n\n**Условия сервиса.** Права определяются правилами сервиса (в Алисе AI коммерческое использование — с подпиской «Алиса Плюс»).\n\n**Маркировка ИИ-контента.** По Федеральному закону от 26.07.2026 № 243-ФЗ (по слайдам курса, сверить): для автора маркировка изображения, аудио, видео, созданных с ИИ, — право, а не обязанность; крупная платформа (более 500 тыс. пользователей в сутки из России) с 1 марта 2027 года обязана дать техническую возможность маркировки. Подписывайте ИИ-изображения: это честно по отношению к зрителю.\n\n## Чек-лист готового изображения\n\nРешает задачу (слайд, пост, обложка); формат верный; детали в порядке (руки, предметы, лишние объекты); текст читается или его нет; нет чужого (реальных людей без согласия, брендов, персонажей); стиль единый с серией; подписано как ИИ-генерация; промпт сохранён.\n\n## Главное\n\n1. Модель читает и размечает, а считают формула или код.\n2. Кодовая книга — главный промпт аналитика; качество проверяем выборкой и долей совпадений.\n3. Персональные данные — только обезличенными, а лучше вообще без них.\n4. Картинка рождается из шума: формула промпта убирает случайность; описывайте желаемое, не запрещаемое.\n5. Чужие лица и бренды — только с правами; ИИ-контент подписываем.","text":"  Повтор занятия 3\n\n   RAG  — модель находит нужные фрагменты в ваших документах и строит ответ по ним; она не переобучается, документы подаются в контекст как источник.\n  Перед вставкой цитаты в работу нужно найти первоисточник и сверить текст дословно: ссылка и цитата могут быть правдоподобными, но выдуманными.\n  Свой стиль при редактуре сохраняют так: даёте образец своего текста и просите минимальную правку с пометкой изменений. Без образца модель переписывает «под себя» — гладко, но безлико.\n\n  ИИ для аналитики\n\n Главная идея:  языковая модель хорошо читает и размечает, а считать должны формула или код.\n\n Почему чат бот ошибается в сумме двадцати чисел, хотя пишет эссе.  Модель не считает, а предсказывает следующий токен; числа видит кусками и подбирает правдоподобные цифры; на длинных расчётах ошибки накапливаются. Числа доверяем формуле в таблице или коду, который модель пишет и запускает, а модель объясняет результат.\n\n  Аналитика как конвейер\n\n  Шаг   Что   Кто  \n \n  1. Сбор   Анкеты, отзывы, выгрузки, заметки   Человек  \n  2. Очистка   Даты, названия, пропуски, дубли   LLM + проверка  \n  3. Структурирование   Категории, тональность, сущности   LLM  \n  4. Расчёт   Суммы, доли, средние, медианы   Формула или код  \n  5. Визуализация   График под вопрос   Код или редактор  \n  6. Вывод   Что это значит и что делать   Человек  \n\n  Два режима работы с данными\n\n  Модель читает   Программа считает   Человек решает  \n \n  Отнести ответ к категории, определить тональность, вытащить даты и суммы, привести записи к одному виду, сформулировать суть   Суммы, доли, средние, медианы; сводные таблицы; проценты и динамика; графики; проверка числа строк и пропусков   Какие категории нужны; проверка выборки вручную; отличить закономерность от случайности; вывод и рекомендация; ответственность за результат  \n\n  Из текста — в таблицу\n\n  Шесть операций модели с текстом\n\n  Операция   Пример  \n \n   Кодирование (coding)    Ответ → категория из списка: «Что мешает учиться?» → «нехватка времени»  \n   Классификация    Объект → тип по правилам: обращение → «возврат», «доставка», «оплата»  \n   Тональность (sentiment)    Позитивная, негативная, нейтральная, смешанная  \n   Извлечение    Текст → поля таблицы: письмо → дата, организация, сумма, срок  \n   Нормализация    «ВШЭ», «Вышка», «НИУ ВШЭ» → «НИУ ВШЭ»  \n   Группировка    200 идей → 8 тем с примерами  \n\nКаждая операция — отдельный промпт.\n\n  Кодирование открытых ответов\n\n1.  Прочитать выборку  — 30–50 ответов глазами: какие темы встречаются.\n2.  Кодовая книга (codebook)  — категории, определения, примеры, правило «Другое».\n3.  Разметка  — модель размечает все ответы по кодовой книге.\n4.  Проверка  — человек сверяет случайные 10–20%.\n5.  Подсчёт  — частоты и доли формулой или кодом.\n\n Кодовая книга  — список категорий с определениями и примерами. Она делает разметку воспроизводимой: тот же промпт через неделю даст сопоставимый результат, а коллега поймёт правила. ИИ не заменяет методологию, а ускоряет разметку; шаги 1, 2, 4 остаются за человеком.\n\n Промпт разметки:  «Ты — ассистент социолога. Размечаешь ответы на вопрос “[ВОПРОС]”. Категории (ровно одна): 1. Время — …; 2. Техника — …; 3. Мотивация — …; 4. Другое; 5. Не определить. Формат:   ID   категория   цитата  . Новые категории не придумывай». Категории «Другое» и «Не определить» обязательны: без них модель натягивает ответы на неподходящие категории.\n\n Было → стало.  «Проанализируй отзывы и скажи, что думают клиенты» даёт связный текст, который нельзя ни посчитать, ни проверить. Лучше: «Отнеси каждый отзыв к одной категории: вкус, цена, скорость, сервис, другое. Отметь тональность. Ответ — таблица: №   категория   тональность   цитата. Не добавляй отзывы, которых нет».  Сначала таблица, потом выводы. \n\n  Где модель ошибается в тональности\n\n  Случай   Пример  \n \n  Сарказм   «Отличная доставка, всего два часа ждали» — буквально позитив, по смыслу негатив  \n  Смешанный отзыв   «Курс полезный, но платформа постоянно падает» — нужна категория «смешанно»  \n  Отрицание   «Не сказал бы, что плохо» — двойное отрицание сбивает простые правила  \n  Контекст области   «Препарат вызвал реакцию» — в медицине может быть нейтральной констатацией  \n\nЛайфхак: добавьте категорию «смешанно» и требуйте цитату основание.\n\n  Извлечение сущностей (entity extraction)\n\nПромпт: «Извлеки поля: дата, время, место, организатор, стоимость, дедлайн, ответственный.  Если поля нет в тексте — оставь пустым.  Ответ — таблица». Правило «если нет — пусто» не даёт модели досочинить. В реальных письмах ФИО и контакты — персональные данные: обезличивайте перед загрузкой.\n\n  Как проверить разметку, не перечитывая 300 ответов\n\n1.  Два прогона  — разметить те же ответы в двух ассистентах или двумя прогонами.\n2.  Совпадения  — посчитать долю ответов с одинаковой категорией.\n3.  Расхождения  — читать только спорные: там ошибки и пробелы кодовой книги.\n4.  Выборка  — вручную проверить 30 (10%) случайных ответов из совпавших.\n\nСлучайных, а не первых 30: в начале файла данные часто однороднее. Если ручная проверка часто расходится с моделью, дело обычно в кодовой книге: добавьте определения и примеры пограничных случаев и разметьте заново.\n\n  Таблицы, формулы, расчёты, графики\n\n Персональные данные не нужны для среднего чека:  имена и телефоны (персональные данные по 152 ФЗ — Федеральному закону «О персональных данных») удалите или замените ID. Средний чек надёжнее посчитать формулой СРЗНАЧ в таблице: файл вообще не покинет компьютер. Часть задач ИИ не нужна вовсе.\n\n  Три надёжных способа посчитать с ИИ\n\n1.  Формула от ИИ  — модель пишет формулу, считает редактор (Excel, Р7 Офис, МойОфис, Яндекс Таблицы).\n2.  Интерпретатор кода (code interpreter)  — модель пишет и запускает код (GigaChat; «Исследовать» в Алисе AI).\n3.  ИИ внутри таблицы  — функция «АЛИСАПРО» в Яндекс Таблицах: команды на обычном языке (бесплатно 50 запросов в месяц).\n\nОбщая идея: модель пишет инструкцию, вычисляет программа.\n\n  Промпт для формулы: опишите таблицу\n\n«Таблица Excel, русская версия. Заголовки в строке 1. A — дата (ДД.ММ.ГГГГ), B — категория, C — сумма, ₽. Нужна формула для F2: сумма по категории из E2 за [МЕСЯЦ]. Русские названия функций, разделитель “;”. Объясни формулу и как её проверить». Четыре составляющие:  где  (лист и столбцы),  что  (типы и даты),  версия  (функции и «;»),  проверка . В русской версии Excel названия функций русские, а аргументы разделяются точкой с запятой.\n\n  Формулы, которые полезно знать по названию\n\n  Задача   Функция  \n \n  Условие   ЕСЛИ  \n  Сумма по условию   СУММЕСЛИ / СУММЕСЛИМН  \n  Подсчёт по условию   СЧЁТЕСЛИ / СЧЁТЕСЛИМН  \n  Среднее по условию   СРЗНАЧЕСЛИ  \n  Подтянуть из другой таблицы   ВПР  \n  Медиана (устойчива к выбросам)   МЕДИАНА  \n  Округление   ОКРУГЛ  \n\n  Интерпретатор кода: что происходит при загрузке файла\n\n1. Вы загружаете CSV или Excel и ставите задачу.\n2. Модель пишет код на Python.\n3. Код выполняется в  песочнице (sandbox)  отдельно от модели.\n4. Результат — таблица, число или график.\n5. Модель пересказывает результат словами.\n\n Надёжно:  арифметика, подсчёты, сводные таблицы, графики.  Требует проверки:  какой столбец взят и как прочитаны даты; что сделано с пропусками; пересказ (модель может приукрасить).\n\n  Проверка расчёта за две минуты\n\n1.  Покажи код  — попросить вывести код и названия столбцов.\n2.  Число строк  — сверить с числом строк в файле.\n3.  Контрольная сумма  — один итог проверить самому формулой СУММ или СЧЁТ.\n4.  Пропуски  — спросить, сколько пустых ячеек и что с ними сделано.\n5.  Здравый смысл  — доли в сумме дают 100%? нет отрицательных возрастов?\n\n  Какой график выбрать\n\n  Задача   График   Вопрос  \n \n  Сравнить категории   Столбчатая диаграмма   Какая категория жалоб самая частая?  \n  Динамика   Линейный график   Как менялись продажи по месяцам?  \n  Доли целого   Столбцы с процентами   Какая доля ответов в каждой теме?  \n  Связь двух величин   Точечная диаграмма   Связаны ли часы подготовки и балл?  \n  Разброс значений   Гистограмма   Как распределено время ответа?  \n\n Заголовок графика = вывод:  «Жалобы на доставку выросли вдвое за осень».\n\n  Персональные данные: обезличить или сгенерировать\n\n  Обезличить реальные данные   Сгенерировать синтетические  \n \n  ФИО → ID (Р001, Р002…); удалить телефоны, почту, адреса; возраст → группа (18–20, 21–23); редкие сочетания признаков обобщить; таблицу «ID — ФИО» хранить у себя   Попросить модель создать 50 правдоподобных строк с заданной структурой и разбросом; отладить на них промпт и формулы;  выводов о реальном мире по ним не делать   \n\n Промпт для синтетических данных:  количество и вопрос анкеты; кто респонденты; длина, стиль (иногда с опечатками); 5–6 разных причин, часть ответов с двумя; сарказм и «пустые» ответы; без реальных имён и контактов; формат таблицы. Разнообразие и «трудные» ответы нужны, иначе синтетика слишком гладкая.\n\n  Лайфхаки аналитика\n\n1. Сначала «опиши таблицу»: столбцы, типы, пропуски.\n2. От 20 строк к 2000: отладка на малом куске.\n3. Цитата основание к каждой категории.\n4. Запасные категории «Другое» и «Не определить».\n5. Сохраняйте промпт (кодовая книга — в паспорт проекта).\n6. Числа — программой.\n\nОсторожно: модель может «дорисовать» пропуски; похожие столбцы путаются; длинная таблица может не влезть;  выводы модели — гипотезы .\n\n  Типичные ошибки\n\n1. Категории пересекаются («Мотивация» и «Скучно») — объединить или развести определениями.\n2. Нет «Другого».\n3. Модель «считала в уме» — доли не сходятся в 100%; пересчитать формулой.\n4. Не тот столбец (взята «сумма со скидкой») — проверить код.\n5. Вывод без числа: «клиенты недовольны» → «38% жалоб — о доставке».\n\n Пример аналитического конвейера:  синтетические ответы (Qwen) → разметка по кодовой книге (GigaChat + Алиса, проверка 30 случайных и доля совпадений) → подсчёт долей интерпретатором кода (контроль формулой СЧЁТЕСЛИ) → график с заголовком выводом (проверка подписей осей и соответствия цифрам).\n\n  Генерация изображений\n\n  Как работает диффузионная модель (diffusion model)\n\n Диффузия  — картинка из шума.\n\n   Обучение:  к картинкам шаг за шагом добавляют шум, модель учится его убирать.\n   Генерация:  идёт от чистого шума; на каждом шаге убирает шум, сверяясь с промптом (шум → контуры → формы → детали → картинка).\n\n Откуда модель знает, как выглядит «кот в шляпе»: \n\n1. Учится на миллиардах пар «картинка — подпись».\n2.  Текстовый кодировщик  превращает промпт в числовой вектор смысла.\n3.  Диффузия в сжатом (латентном) пространстве  — шум убирается не в пикселях, а в компактном представлении; так быстрее.\n4.  Декодер  разворачивает результат в полноценное изображение.\n\nПравило: модель знает только то, что часто встречалось в подписях. «Кот» и «акварель» понятны; внутренний мем вашей группы нужно описать словами.\n\nФакты: в классической работе о диффузионных моделях 1000 шагов зашумления (Ho и др., 2020); в открытом наборе LAION 5B 5,85 млрд пар «картинка — подпись» (2022); латентная диффузия (Rombach и др., 2022) сделала генерацию доступной.\n\n Почему шесть пальцев и ошибки в надписях.  Модель восстанавливает изображение по статистике, а не по правилам: она не «знает», что пальцев пять, и не пишет буквы, а рисует похожие формы. Мелкие детали (руки, текст) даются труднее всего.\n\n  Формула промпта для изображения\n\n  Элемент   Пример  \n \n  Объект   рыжий кот  \n  Детали (действие, одежда, предметы)   в шляпе, читает книгу  \n  Стиль   акварель (фото, 3D, плоская иллюстрация)  \n  Композиция   крупный план, вид сбоку  \n  Свет и цвет   тёплый вечерний свет  \n  Формат   16:9 для слайда  \n\nНе все элементы обязательны, но каждый убирает одну «случайность».\n\n Словарь визуальных терминов:  план (крупный / средний / общий); ракурс (сверху / снизу / на уровне глаз; снизу объект кажется больше); свет (мягкий дневной, вечерний); стиль (для инфографики — плоская иллюстрация); композиция (по центру, правило третей, «пустое место справа для текста»); палитра (пастельная, монохромная, фирменная — цвета можно задать кодами HEX).\n\n Было → стало:  «картинка про экологию города» (случайный стиль и композиция) против «плоская иллюстрация: городской парк с велодорожкой, вид сверху под углом, палитра зелёный/белый/тёмно синий, много пустого места слева для заголовка, 16:9, в кадре только деревья, дорожки и чистое небо» — готовый фон слайда.\n\n  Негативные указания\n\nОтрицание в промпте работает ненадёжно: слова «люди», «надписи» всё равно попадают в запрос и могут проявиться. Описывайте желаемое:\n\n  Рискованно   Надёжнее  \n \n  «Улица без людей»   «Пустая утренняя улица»  \n  «Без надписей и логотипов»   «Чистый фон, гладкие поверхности»  \n  «Не делай мрачно»   «Светлая пастельная палитра, мягкий дневной свет»  \n\nЕсли результат упрямо повторяет лишнее — уберите слово совсем и опишите сцену иначе.\n\n  Итерации\n\nБазовый промпт (объект + стиль + формат) → несколько вариантов (в Алисе AI фраза «несколько вариантов» даёт 4 картинки) → выбор лучшего  по задаче , а не «самого красивого» → точечная правка (меняем одну деталь) → финал (проверка деталей, текста, формата). Менять одно за раз.\n\n  Текст на картинке\n\n1. Надпись в кавычках: «ОТКРЫТАЯ ЛЕКЦИЯ».\n2. Проблемные слова заглавными.\n3. Длинный текст — несколькими короткими надписями или за несколько шагов.\n4. Для макетов с текстом — модели, сильные в типографике (например, Qwen Image).\n5.  Самый надёжный путь:  фон без текста от ИИ + надпись в редакторе презентаций.\n\n  Редактирование и выбор сервиса\n\nВозможности: точечная правка (обвести область и изменить, удалить, заменить объект); сборка из нескольких фото (до 3 в Kandinsky 6.0); объединение двух фото (Алиса AI); реставрация и стилизация; «оживление» изображения в короткое видео; поиск референсов, если объект незнаком.\n\n  Сервис   Сильные стороны   Что учесть  \n \n  GigaChat · Kandinsky 6.0   Бесплатно, без лимита; правка области; до 3 фото   Формат кадра укажите явно  \n  Алиса AI · Alice AI ART   Соотношение сторон; 4 варианта; «оживление»   Без подписки хранение 14 дней  \n  Qwen Studio · Qwen Image   Текст на изображении   Данные — за пределами России  \n\n(Данные на осень 2026 — сверить.) Для серии выбирайте один основной сервис и не меняйте его внутри серии.\n\n  Серия в едином стиле: стилевая карточка\n\n  СТИЛЕВАЯ КАРТОЧКА «[КОМАНДА]»: Стиль: плоская векторная иллюстрация. Палитра:  102D69,  BA88E4,  DCFF05, белый. Свет: ровный дневной. Композиция: объект по центру, много воздуха. Формат: 16:9. В кадре: только предметы и природа.\n\nКарточку вставляют в начало каждого промпта серии; меняется только объект; одна модель на всю серию. Если стиль «плывёт» — приложите удачную картинку как образец.\n\n  Лайфхаки\n\nФормат — сразу (16:9, 9:16, 1:1); место под текст («свободное место слева»); один параметр за раз; образец (референс) вместо слов; описывайте желаемое («пустая улица», а не «без людей»); промпты — в паспорт. Осторожно: реальные лица — с согласия; чужие логотипы и персонажи; руки и текст проверять; фотореализм подписывать.\n\n  Права и ответственность\n\n Изображение человека.  Статья 152.1 ГК РФ (Гражданский кодекс Российской Федерации) — использовать изображение человека можно только с его согласия (сверить по источнику). Исключения: государственные, общественные или иные публичные интересы; публичные места, если человек не основной объект; позирование за плату. «Это же шутка» не меняет правовой оценки. Пример: сгенерировать декана в костюме супергероя без согласия нельзя; костюм известного героя — ещё и чужой персонаж. Надёжно: собственный герой талисман или письменное согласие.\n\n Товарные знаки и персонажи.  Логотипы и бренды — право правообладателя; сходство до степени смешения нарушает исключительное право; персонажи фильмов и игр чужие. Просите «оригинальный знак, не похожий на логотипы известных брендов» и сравнивайте с логотипами конкурентов. Ответственность несёт тот, кто использует, а не нейросеть.\n\n Условия сервиса.  Права определяются правилами сервиса (в Алисе AI коммерческое использование — с подпиской «Алиса Плюс»).\n\n Маркировка ИИ контента.  По Федеральному закону от 26.07.2026 № 243 ФЗ (по слайдам курса, сверить): для автора маркировка изображения, аудио, видео, созданных с ИИ, — право, а не обязанность; крупная платформа (более 500 тыс. пользователей в сутки из России) с 1 марта 2027 года обязана дать техническую возможность маркировки. Подписывайте ИИ изображения: это честно по отношению к зрителю.\n\n  Чек лист готового изображения\n\nРешает задачу (слайд, пост, обложка); формат верный; детали в порядке (руки, предметы, лишние объекты); текст читается или его нет; нет чужого (реальных людей без согласия, брендов, персонажей); стиль единый с серией; подписано как ИИ генерация; промпт сохранён.\n\n  Главное\n\n1. Модель читает и размечает, а считают формула или код.\n2. Кодовая книга — главный промпт аналитика; качество проверяем выборкой и долей совпадений.\n3. Персональные данные — только обезличенными, а лучше вообще без них.\n4. Картинка рождается из шума: формула промпта убирает случайность; описывайте желаемое, не запрещаемое.\n5. Чужие лица и бренды — только с правами; ИИ контент подписываем.","id":"analitika-i-izobrazheniya"},{"n":5,"title":"Презентации, аудио и видео с ИИ","short":"Сторилайн и пирамида Минто, тексты слайдов, визуал, распознавание и синтез речи, сценарий и генерация видео","date":"Пары 9–10","min":15,"theory":"## Повтор занятия 4\n\n- Среднее по 500 строкам надёжнее посчитать **формулой или кодом**: расчёт можно проверить и повторить, а «в уме» модель угадывает правдоподобное число.\n- За расположение объектов в кадре в промпте изображения отвечает **композиция**; стиль — «как нарисовано», композиция — «что где стоит».\n- Афишу с логотипом известного бренда делать нельзя: чужие товарные знаки без согласия правообладателя использовать нельзя.\n- Диффузионная модель постепенно убирает шум: из случайного шума шаг за шагом проявляется изображение, соответствующее описанию.\n\n## Презентации\n\n**Главная мысль:** ИИ хорошо генерирует слайды, но плохо понимает, зачем вы выступаете. Это решаете вы.\n\n**Почему «Сделай презентацию про инфляцию» даёт скучный результат.** В запросе нет задачи, аудитории и главной мысли. Модель выбирает самое вероятное — учебник «Определение → Причины → Виды → Последствия → Выводы». Тот же запрос с ответами на четыре вопроса («для первокурсников-экономистов, 7 минут, хочу убедить, что инфляция бьёт по студентам сильнее, чем кажется») даёт сюжет, а не пересказ.\n\n### Путь презентации: кто что делает\n\n| Этап | Что | Кто |\n|---|---|---|\n| 1. Задача | Зачем выступаем | Человек |\n| 2. Аудитория | Кто слушает | Человек |\n| 3. Главная мысль | Одна фраза | Человек |\n| 4. Сторилайн (storyline) | Заголовки по порядку | ИИ ускоряет |\n| 5. Тексты и заметки | Тезисы и речь | ИИ ускоряет |\n| 6. Визуал | Схемы и картинки | ИИ ускоряет |\n| 7. Проверка | Факты и стиль | Человек |\n\nМодель не знает, зачем вы выступаете, поэтому цель, аудитория, главная мысль и проверка — за человеком.\n\n### Четыре вопроса до первого слайда\n\n1. **Кто слушает?** (однокурсники, комиссия, работодатель, школьники) — от этого зависят термины и глубина.\n2. **Что они уже знают?** (новички, в теме, эксперты) — что объяснять, а что пропустить.\n3. **Что они должны сделать после?** (поставить оценку, одобрить идею, запомнить три факта) — это цель выступления.\n4. **Сколько времени?** (5, 10, 20 минут) — число слайдов и глубина.\n\n**Сколько слайдов.** Ориентир для живого доклада — слайд на 1–2 минуты, то есть 5–10 слайдов плюс титульный. Для видеозащиты 5–8 минут — примерно слайд на 30–60 секунд. Важнее одна мысль на слайд.\n\n### Пирамида Минто (Minto pyramid)\n\nПринцип Барбары Минто (консультант McKinsey): **сначала вывод, потом доказательства.**\n\n1. **Главный вывод** — одна фраза.\n2. **3 ключевых аргумента** — каждый поддерживает вывод.\n3. **Факты, цифры, примеры** под каждым аргументом.\n\nПравила: вывод в начале, а не в конце; аргументы не пересекаются и вместе закрывают вывод; на уровне — 3 ± 1 пункта. Слушателю легче, когда он сначала знает вывод. Промпт-ключ: «Построй структуру по принципу пирамиды Минто: главный вывод, три аргумента, по два факта под каждым».\n\n### Заголовок-утверждение вместо заголовка-темы\n\n| Заголовки-темы | Заголовки-утверждения |\n|---|---|\n| Введение, Данные исследования, Результаты, Анализ, Выводы | «Студенты тратят на доставку еды треть бюджета», «Чем дальше от кампуса — тем больше заказов», «Главная причина — нехватка времени, а не цены» |\n\nТема говорит, о чём слайд, утверждение — что из него следует. **Тест:** прочитайте только заголовки подряд; если получился связный рассказ — сторилайн готов.\n\n### Структуры под жанр\n\n| Жанр | Логика | Финал |\n|---|---|---|\n| Учебный доклад | Вопрос → почему важно → 3 ответа → вывод | Тезис для запоминания |\n| Отчёт об исследовании | Вопрос → метод → результаты → ограничения | Что делать дальше |\n| Видеозащита проекта | Проблема → пользователь → решение → результат | Чему научились |\n| Питч идеи | Боль → решение → почему мы → что нужно | Конкретная просьба |\n| Разбор кейса | Ситуация → дилемма → варианты → выбор | Урок на будущее |\n\n### Промпт «сторилайн за один запрос»\n\n> Ты — редактор выступлений. Тема: [ТЕМА]. Жанр: [ЖАНР]. Время: [N] минут. Аудитория: [КТО], знают [ЧТО]. После выступления слушатели должны [ДЕЙСТВИЕ]. 1) Главная мысль — одной фразой. 2) Пирамида: вывод → 3 аргумента → по 2 факта. 3) Сторилайн: 6–8 слайдов, заголовки-утверждения до 10 слов. 4) Отметь данные, которые ты нашёл. Ответ — таблица: № | заголовок | содержание | источник.\n\nПочему так: действие слушателей задаёт цель; короткий заголовок успеют прочитать; пункт 4 защищает от выдуманных цифр; таблица легко переносится в редактор.\n\n## Тексты слайдов и заметки докладчика\n\n### Слайд — не текст выступления\n\n| Голос | Слайд |\n|---|---|\n| Объяснение и связки; примеры и истории; ответ на «почему это важно» | Заголовок-утверждение; схема, диаграмма, ключевая цифра; не больше 6 строк по 6–10 слов |\n\n**Принцип избыточности (redundancy principle, Ричард Майер):** когда слушатель одновременно читает и слышит один и тот же текст, внимание перегружается и запоминание хуже. Слайд дополняет речь, а не дублирует.\n\n**Простыня → тезисы.** «Сожми текст в тезисы: заголовок-утверждение до 10 слов и 2–3 пункта до 8 слов. Не добавляй новых фактов. Предложи визуал». Модель сжимает, а не придумывает.\n\n**Заметки докладчика:** «[N] секунд на слайд, разговорный стиль. Для каждого слайда: фраза-связка с предыдущим; 2–3 мысли, которых НЕТ на слайде; пример из жизни студента; вероятный вопрос и ответ». Ориентиры: спокойная речь — около 120–140 слов в минуту; минута на слайд — столько же слов заметок; проверять вслух с таймером. Связки превращают набор слайдов в рассказ.\n\n**Читать заметки с листа нельзя**: монотонно и без зрительного контакта. Заметки — опора: прочитать 2–3 раза, пересказать своими словами, оставить на экране докладчика только ключевые слова. Факты и цифры из заметок проверить: модель могла «досочинить».\n\n### ИИ-репетиция\n\nМодель в роли придирчивого слушателя:\n\n1. **Скептик** — «Ты — строгий преподаватель. Задай 5 неудобных вопросов».\n2. **Новичок** — «Ты — первокурсник другого факультета. Что непонятно?»\n3. **Таймер** — «Сколько минут займёт чтение? Что сократить до 7?»\n4. **Один вывод** — «Какую мысль запомнит слушатель?»\n5. **Слабое звено** — «Какой аргумент самый слабый?»\n\nВставляйте сторилайн или заметки целиком, просите конкретику («5 вопросов»), ответы на неудобные вопросы продумайте сами. Удобно в голосовом режиме.\n\n## Визуал, инфографика, сервисы\n\n**Диаграмма в слайде «Рынок вырос на 37%».** Считайте цифру непроверенной, пока не найден источник: спросите модель, откуда она, найдите первоисточник поиском и откройте. Нашли — поставьте ссылку под диаграммой; не нашли или цифра другая — удалите или замените. Генераторы слайдов часто «оживляют» слайды правдоподобными числами.\n\n### Какая диаграмма нужна мысли\n\n| Мысль | Тип визуала | Чего избегать |\n|---|---|---|\n| «А больше Б» (сравнение) | Столбчатая | 3D-эффектов и обрезанной оси |\n| «Росло, потом упало» | Линейный график | Больше 4–5 линий |\n| Части целого | Столбик 100% или одна доля | Круга с десятком долей |\n| «Чем больше, тем…» (связь) | Точечная | Выводов о причине |\n| Процесс или этапы | Схема со стрелками | Абзаца вместо схемы |\n| Одна ключевая цифра | Крупное число | Таблицы ради числа |\n\n### Что поручить ИИ в оформлении\n\nПалитру из 4 цветов с HEX-кодами; схему из текста (модель даёт структуру, рисуете вы в редакторе); таблицу данных для диаграммы (цифры из ваших источников); иллюстрации (Kandinsky в GigaChat, Шедеврум, Alice AI ART — один шаблон стиля); метафоры; проверку единого стиля (шрифты, цвета, выравнивание) по загруженному PDF.\n\n### Типичные провалы ИИ-презентаций\n\n| Провал | Что делать |\n|---|---|\n| Выдуманные цифры («рост на 37%» без источника) | Цифра только со ссылкой |\n| Текст на картинках искажён | Надписи в редакторе |\n| Разнобой стилей | Один шаблон стиля |\n| Слайд-простыня (10 строк мелким шрифтом) | Детали в заметки |\n| Общие слова («важно учитывать факторы») | Кто, сколько, когда |\n| Неверная диаграмма (круг из 12 долей) | Тип по мысли |\n\n### Три способа получить слайды\n\n1. **Генератор слайдов в чат-боте** (GigaChat: «Giga Проекты» → «Создать презентацию»; Qwen Studio: «+» → режим слайдов) — быстро, но стиль и факты проверять.\n2. **Структура от ИИ, сборка в редакторе** (PowerPoint, Р7-Офис, МойОфис, LibreOffice Impress) — полный контроль над стилем и данными. Для проекта чаще лучший.\n3. **Редактирование готового файла** — загрузить свою презентацию в чат-бот и попросить аудит (логика, факты, стиль); правки вносите сами.\n\n**GigaChat «Giga Проекты»:** источники (ссылки или файл до 80 МБ) → параметры (1–10 слайдов, тон) → план, который правится до генерации → встроенный редактор → экспорт в PPTX или PDF. Лайфхак: правьте план, а не слайды; вставьте в пожелания свой сторилайн.\n\n| | GigaChat | Qwen Studio | Алиса AI |\n|---|---|---|---|\n| Готовые слайды | Да | Да | Нет: текст и данные для диаграмм |\n| Иллюстрации | Kandinsky 6.0 | Генерация в чате | Alice AI ART |\n\nВ любом случае: факты — по источнику, стиль — в редакторе.\n\n### Чек-лист перед показом\n\nЗаголовки читаются как рассказ; одна мысль на слайде; у каждой цифры источник, который вы открыли сами; диаграмма подходит мысли; единый стиль; читается с последнего ряда; права на изображения (без чужих брендов и реальных людей); отрепетировано с таймером.\n\n**Оценка слайда за 30 секунд (0/1/2 по каждому):** заголовок (тема → утверждение длинное → утверждение до 10 слов); мысль (несколько → размыта → одна и понятна без докладчика); данные (без источника → источник не проверен → проверен и указан); визуал (текст вместо визуала → не по мысли → подходит); читаемость (мелко и много → с усилием → с последнего ряда). 8–10 — готов, 6–7 — доработать, меньше 6 — переделать.\n\n**Аудит с моделью:** «Ты — строгий редактор презентаций. Проверь слайды по пунктам: заголовок-утверждение, одна мысль, источники цифр, тип диаграммы, единый стиль, объём текста. Ответ — таблица: слайд | проблема | как исправить». Сверьте, что нашли оба, что только вы, что только модель; модель обычно пропускает выдуманные цифры и права на картинки.\n\n## Речь: от звука к тексту и обратно\n\n### Как машина распознаёт речь (ASR, Automatic Speech Recognition)\n\n1. **Звук** — колебания давления воздуха.\n2. **Спектрограмма** — звук разложен на частоты во времени, «картинка» речи.\n3. **Акустическая модель** — нейросеть сопоставляет фрагменты звука и токены текста.\n4. **Текст** — поток слов без знаков препинания.\n5. **Нормализация** — пунктуация, числа цифрами, разделение по говорящим.\n\nПримеры: GigaAM-v3 — открытые модели распознавания русской речи от Сбера (лицензия MIT), SpeechKit — распознавание и синтез речи Яндекса (Yandex AI Studio). (Данные на осень 2026, сверить.)\n\n**Где речь превращается в текст:** GigaChat (аудиофайл или голос, различает голоса); Алиса AI в Яндекс Браузере («Спросить по видео», ролики 40 с — 4 ч); перевод видео с английского в Яндекс Браузере с сохранением тембра; голосовой ввод; SpeechKit и GigaAM (локально — запись не уходит в облако).\n\n### Согласие и персональные данные\n\nПеред загрузкой записи интервью в чат-бот проверьте: есть ли согласие собеседника на запись и обработку (лучше письменное) и есть ли в записи персональные данные (ФИО, должность, названия, раскрывающие личность). По 152-ФЗ такие данные нельзя передавать сторонним сервисам без оснований. Безопасный путь — локальная расшифровка (например, GigaAM) или обезличенный текст.\n\n**Нельзя без согласия:** записывать собеседника тайно; загружать интервью с ФИО и телефонами без обезличивания; публиковать чужую лекцию или её расшифровку.\n\n### Конвейер «запись → конспект»\n\n1. **Запись** — с согласия говорящих, микрофон ближе к спикеру.\n2. **Согласие и данные** — персональные данные третьих лиц обезличить.\n3. **Расшифровка** — GigaChat, Алиса AI в Браузере, SpeechKit, GigaAM.\n4. **Структура** — промпт: тезисы, термины, вопросы, задачи.\n5. **Проверка** — цитаты и цифры по записи, на слух.\n\nПромпт: «Это расшифровка лекции. Термины курса: [СПИСОК]. 1) Исправь ошибки распознавания в терминах и именах; спорные места отметь [?]. 2) Составь конспект: 5–7 ключевых тезисов, определения терминов, примеры лектора. 3) Выпиши дословные цитаты с примерным временем. Ничего не добавляй от себя».\n\n### Где ошибается распознавание\n\n| Проблема | Что делать |\n|---|---|\n| Термины и имена («эластичность спроса» → «эластичность с проса») | Дать модели их список |\n| Цифры и даты («пятнадцать» и «пятьдесят» звучат похоже) | Сверять на слух |\n| Несколько голосов | Попросить разметить говорящих |\n| Шум и эхо | Улучшить запись |\n| Иностранные слова | Указать язык вставок |\n\n### Синтез речи (TTS, Text-To-Speech): текст для уха\n\nТекст для озвучки отличается от текста для чтения. Правила: фразы до 12–15 слов; числа словами, округлённо; без скобок и сокращений. Пример: «Доля студентов (ок. 63%), использующих ИИ-инструменты, выросла на 1,5 п. п.» → «Почти две трети студентов уже учатся с ИИ. / И таких становится больше с каждым годом.» Промпт: «Перепиши для озвучки: короткие фразы, числа словами, без скобок. Паузы отметь знаком /».\n\n## Видео: сценарий, генерация, монтаж\n\n**Главная мысль:** генераторы делают короткие фрагменты, а ролик собирает человек по сценарию.\n\n### Как генерируют видео\n\n**Диффузия во времени:** шум убирается сразу у последовательности кадров, которые должны быть согласованы друг с другом. Отсюда ограничения: ролики — секунды, а не минуты (чем длиннее, тем труднее удержать согласованность).\n\n| Получается хорошо | Получается плохо |\n|---|---|\n| Простое действие одного объекта; плавное движение камеры; природа, предметы, абстракции | Руки и пальцы, мелкая моторика; текст в кадре; несколько действий подряд; сложная физика взаимодействий |\n\n**Почему «плывут» руки.** Модель не знает анатомии, а воспроизводит статистику кадров; руки мелкие, часто частично скрыты и меняют форму, поэтому их сложнее всего удержать согласованными. Крупные планы рук в кадр не ставим, нужное действие показываем общим планом.\n\n**Сервисы** (осень 2026, сверить): GigaChat · Kandinsky 6.0 Video — ролик по тексту или первому кадру, до 5 с, до Full HD, со звуком; Алиса AI · «Оживить фото» — ролик 4 с; Qwen Studio · Video Generation (модели Wan).\n\n### От идеи до ролика: пять шагов\n\n1. **Идея** — одна мысль ролика и зритель.\n2. **Сценарий** — текст закадра и что видно в кадре.\n3. **Раскадровка (storyboard)** — кадры по 3–5 секунд: действие, камера, звук.\n4. **Генерация** — клипы по кадрам, по 2–3 варианта.\n5. **Монтаж** — склейка, озвучка, титры, музыка.\n\nГенерация — только четвёртый шаг; хороший ролик рождается на шагах 1–3. 15-секундный ролик — это 3–4 клипа, склеенных в редакторе.\n\n**Раскадровка** — таблица: кадр | время | что в кадре | камера | звук и текст. Логотипы и текст в кадре собираются в редакторе, генератору не поручаются.\n\n### Промпт для видео\n\nК промпту изображения добавляются: **движение** (одно действие), **камера** (наезд, панорама, статика), **темп**, **звук** (отдельной строкой), **длительность** (в пределах лимита), **первый кадр** (задаёт стиль). Пример: «Сцена: студентка с ноутбуком у окна в библиотеке, вечер. Движение: поднимает взгляд и улыбается. Камера: медленный наезд, средний план. Свет: тёплая лампа. Звук: шелест страниц, без музыки».\n\n**Лайфхаки:** сначала картинка, потом видео; одно действие на клип; звук отдельной строкой; черновик в SD, финал в Full HD; текст и логотипы в монтаже.\n\n### Монтаж: что остаётся за человеком\n\nСклейка (клипы по раскадровке, лишнее убрать); звук (закадровый голос, музыка с правом на использование); титры (текст и логотипы в редакторе); пометка ИИ в титрах («создано с помощью ИИ»); проверка — смотреть без звука и только со звуком: смысл понятен? ИИ помогает с субтитрами из расшифровки, текстом закадра «для уха» под длительность, порядком кадров и переходов.\n\n### Дипфейки и согласие\n\n**Дипфейк (deepfake)** — синтетическое видео или голос реального человека; вред в обмане: зритель верит, что это было на самом деле. Голос и изображение реального человека — только с его согласия (ст. 152.1 ГК РФ), даже ради шутки; безопасно использовать вымышленного персонажа и синтетический голос, не подражающий знакомым. Нельзя: лица и голоса реальных людей без согласия, чужие товарные знаки и персонажи, вымысел под видом реального события.\n\n**Маркировка.** Закон об ИИ (по слайдам — 243-ФЗ, сверить): с 1 марта 2027 года платформы с аудиторией более 500 тыс. пользователей в сутки из России обязаны дать техническую возможность пометить материалы, созданные с помощью ИИ; для авторов маркировка добровольная. Честная практика: подписывать «Видео создано с помощью ИИ».\n\n### Сценарий видеозащиты на 7 минут (пример раскладки)\n\n0:00 задача → 0:30 пользователь → 1:30 ИИ-конвейер и демонстрация → 4:00 результат → 5:30 риски и ограничения → 6:30 команда → 7:00. Готовить так: сторилайн → текст для уха → раскадровка; демонстрацию записывать экраном, а не камерой; записывать за 2 дня до срока — монтаж занимает время.\n\n## Главное\n\n1. Презентация начинается с задачи и аудитории — их решаете вы, а не модель.\n2. Заголовки-утверждения складываются в рассказ; одна мысль — один слайд.\n3. Каждая цифра на слайде — с источником, который вы открыли сами.\n4. Расшифровка — черновик: термины, цифры и цитаты сверяются с записью.\n5. Ролик собирается из коротких клипов по раскадровке; чужие лица и голоса — только с согласия.","text":"  Повтор занятия 4\n\n  Среднее по 500 строкам надёжнее посчитать  формулой или кодом : расчёт можно проверить и повторить, а «в уме» модель угадывает правдоподобное число.\n  За расположение объектов в кадре в промпте изображения отвечает  композиция ; стиль — «как нарисовано», композиция — «что где стоит».\n  Афишу с логотипом известного бренда делать нельзя: чужие товарные знаки без согласия правообладателя использовать нельзя.\n  Диффузионная модель постепенно убирает шум: из случайного шума шаг за шагом проявляется изображение, соответствующее описанию.\n\n  Презентации\n\n Главная мысль:  ИИ хорошо генерирует слайды, но плохо понимает, зачем вы выступаете. Это решаете вы.\n\n Почему «Сделай презентацию про инфляцию» даёт скучный результат.  В запросе нет задачи, аудитории и главной мысли. Модель выбирает самое вероятное — учебник «Определение → Причины → Виды → Последствия → Выводы». Тот же запрос с ответами на четыре вопроса («для первокурсников экономистов, 7 минут, хочу убедить, что инфляция бьёт по студентам сильнее, чем кажется») даёт сюжет, а не пересказ.\n\n  Путь презентации: кто что делает\n\n  Этап   Что   Кто  \n \n  1. Задача   Зачем выступаем   Человек  \n  2. Аудитория   Кто слушает   Человек  \n  3. Главная мысль   Одна фраза   Человек  \n  4. Сторилайн (storyline)   Заголовки по порядку   ИИ ускоряет  \n  5. Тексты и заметки   Тезисы и речь   ИИ ускоряет  \n  6. Визуал   Схемы и картинки   ИИ ускоряет  \n  7. Проверка   Факты и стиль   Человек  \n\nМодель не знает, зачем вы выступаете, поэтому цель, аудитория, главная мысль и проверка — за человеком.\n\n  Четыре вопроса до первого слайда\n\n1.  Кто слушает?  (однокурсники, комиссия, работодатель, школьники) — от этого зависят термины и глубина.\n2.  Что они уже знают?  (новички, в теме, эксперты) — что объяснять, а что пропустить.\n3.  Что они должны сделать после?  (поставить оценку, одобрить идею, запомнить три факта) — это цель выступления.\n4.  Сколько времени?  (5, 10, 20 минут) — число слайдов и глубина.\n\n Сколько слайдов.  Ориентир для живого доклада — слайд на 1–2 минуты, то есть 5–10 слайдов плюс титульный. Для видеозащиты 5–8 минут — примерно слайд на 30–60 секунд. Важнее одна мысль на слайд.\n\n  Пирамида Минто (Minto pyramid)\n\nПринцип Барбары Минто (консультант McKinsey):  сначала вывод, потом доказательства. \n\n1.  Главный вывод  — одна фраза.\n2.  3 ключевых аргумента  — каждый поддерживает вывод.\n3.  Факты, цифры, примеры  под каждым аргументом.\n\nПравила: вывод в начале, а не в конце; аргументы не пересекаются и вместе закрывают вывод; на уровне — 3 ± 1 пункта. Слушателю легче, когда он сначала знает вывод. Промпт ключ: «Построй структуру по принципу пирамиды Минто: главный вывод, три аргумента, по два факта под каждым».\n\n  Заголовок утверждение вместо заголовка темы\n\n  Заголовки темы   Заголовки утверждения  \n \n  Введение, Данные исследования, Результаты, Анализ, Выводы   «Студенты тратят на доставку еды треть бюджета», «Чем дальше от кампуса — тем больше заказов», «Главная причина — нехватка времени, а не цены»  \n\nТема говорит, о чём слайд, утверждение — что из него следует.  Тест:  прочитайте только заголовки подряд; если получился связный рассказ — сторилайн готов.\n\n  Структуры под жанр\n\n  Жанр   Логика   Финал  \n \n  Учебный доклад   Вопрос → почему важно → 3 ответа → вывод   Тезис для запоминания  \n  Отчёт об исследовании   Вопрос → метод → результаты → ограничения   Что делать дальше  \n  Видеозащита проекта   Проблема → пользователь → решение → результат   Чему научились  \n  Питч идеи   Боль → решение → почему мы → что нужно   Конкретная просьба  \n  Разбор кейса   Ситуация → дилемма → варианты → выбор   Урок на будущее  \n\n  Промпт «сторилайн за один запрос»\n\n  Ты — редактор выступлений. Тема: [ТЕМА]. Жанр: [ЖАНР]. Время: [N] минут. Аудитория: [КТО], знают [ЧТО]. После выступления слушатели должны [ДЕЙСТВИЕ]. 1) Главная мысль — одной фразой. 2) Пирамида: вывод → 3 аргумента → по 2 факта. 3) Сторилайн: 6–8 слайдов, заголовки утверждения до 10 слов. 4) Отметь данные, которые ты нашёл. Ответ — таблица: №   заголовок   содержание   источник.\n\nПочему так: действие слушателей задаёт цель; короткий заголовок успеют прочитать; пункт 4 защищает от выдуманных цифр; таблица легко переносится в редактор.\n\n  Тексты слайдов и заметки докладчика\n\n  Слайд — не текст выступления\n\n  Голос   Слайд  \n \n  Объяснение и связки; примеры и истории; ответ на «почему это важно»   Заголовок утверждение; схема, диаграмма, ключевая цифра; не больше 6 строк по 6–10 слов  \n\n Принцип избыточности (redundancy principle, Ричард Майер):  когда слушатель одновременно читает и слышит один и тот же текст, внимание перегружается и запоминание хуже. Слайд дополняет речь, а не дублирует.\n\n Простыня → тезисы.  «Сожми текст в тезисы: заголовок утверждение до 10 слов и 2–3 пункта до 8 слов. Не добавляй новых фактов. Предложи визуал». Модель сжимает, а не придумывает.\n\n Заметки докладчика:  «[N] секунд на слайд, разговорный стиль. Для каждого слайда: фраза связка с предыдущим; 2–3 мысли, которых НЕТ на слайде; пример из жизни студента; вероятный вопрос и ответ». Ориентиры: спокойная речь — около 120–140 слов в минуту; минута на слайд — столько же слов заметок; проверять вслух с таймером. Связки превращают набор слайдов в рассказ.\n\n Читать заметки с листа нельзя : монотонно и без зрительного контакта. Заметки — опора: прочитать 2–3 раза, пересказать своими словами, оставить на экране докладчика только ключевые слова. Факты и цифры из заметок проверить: модель могла «досочинить».\n\n  ИИ репетиция\n\nМодель в роли придирчивого слушателя:\n\n1.  Скептик  — «Ты — строгий преподаватель. Задай 5 неудобных вопросов».\n2.  Новичок  — «Ты — первокурсник другого факультета. Что непонятно?»\n3.  Таймер  — «Сколько минут займёт чтение? Что сократить до 7?»\n4.  Один вывод  — «Какую мысль запомнит слушатель?»\n5.  Слабое звено  — «Какой аргумент самый слабый?»\n\nВставляйте сторилайн или заметки целиком, просите конкретику («5 вопросов»), ответы на неудобные вопросы продумайте сами. Удобно в голосовом режиме.\n\n  Визуал, инфографика, сервисы\n\n Диаграмма в слайде «Рынок вырос на 37%».  Считайте цифру непроверенной, пока не найден источник: спросите модель, откуда она, найдите первоисточник поиском и откройте. Нашли — поставьте ссылку под диаграммой; не нашли или цифра другая — удалите или замените. Генераторы слайдов часто «оживляют» слайды правдоподобными числами.\n\n  Какая диаграмма нужна мысли\n\n  Мысль   Тип визуала   Чего избегать  \n \n  «А больше Б» (сравнение)   Столбчатая   3D эффектов и обрезанной оси  \n  «Росло, потом упало»   Линейный график   Больше 4–5 линий  \n  Части целого   Столбик 100% или одна доля   Круга с десятком долей  \n  «Чем больше, тем…» (связь)   Точечная   Выводов о причине  \n  Процесс или этапы   Схема со стрелками   Абзаца вместо схемы  \n  Одна ключевая цифра   Крупное число   Таблицы ради числа  \n\n  Что поручить ИИ в оформлении\n\nПалитру из 4 цветов с HEX кодами; схему из текста (модель даёт структуру, рисуете вы в редакторе); таблицу данных для диаграммы (цифры из ваших источников); иллюстрации (Kandinsky в GigaChat, Шедеврум, Alice AI ART — один шаблон стиля); метафоры; проверку единого стиля (шрифты, цвета, выравнивание) по загруженному PDF.\n\n  Типичные провалы ИИ презентаций\n\n  Провал   Что делать  \n \n  Выдуманные цифры («рост на 37%» без источника)   Цифра только со ссылкой  \n  Текст на картинках искажён   Надписи в редакторе  \n  Разнобой стилей   Один шаблон стиля  \n  Слайд простыня (10 строк мелким шрифтом)   Детали в заметки  \n  Общие слова («важно учитывать факторы»)   Кто, сколько, когда  \n  Неверная диаграмма (круг из 12 долей)   Тип по мысли  \n\n  Три способа получить слайды\n\n1.  Генератор слайдов в чат боте  (GigaChat: «Giga Проекты» → «Создать презентацию»; Qwen Studio: «+» → режим слайдов) — быстро, но стиль и факты проверять.\n2.  Структура от ИИ, сборка в редакторе  (PowerPoint, Р7 Офис, МойОфис, LibreOffice Impress) — полный контроль над стилем и данными. Для проекта чаще лучший.\n3.  Редактирование готового файла  — загрузить свою презентацию в чат бот и попросить аудит (логика, факты, стиль); правки вносите сами.\n\n GigaChat «Giga Проекты»:  источники (ссылки или файл до 80 МБ) → параметры (1–10 слайдов, тон) → план, который правится до генерации → встроенный редактор → экспорт в PPTX или PDF. Лайфхак: правьте план, а не слайды; вставьте в пожелания свой сторилайн.\n\n    GigaChat   Qwen Studio   Алиса AI  \n \n  Готовые слайды   Да   Да   Нет: текст и данные для диаграмм  \n  Иллюстрации   Kandinsky 6.0   Генерация в чате   Alice AI ART  \n\nВ любом случае: факты — по источнику, стиль — в редакторе.\n\n  Чек лист перед показом\n\nЗаголовки читаются как рассказ; одна мысль на слайде; у каждой цифры источник, который вы открыли сами; диаграмма подходит мысли; единый стиль; читается с последнего ряда; права на изображения (без чужих брендов и реальных людей); отрепетировано с таймером.\n\n Оценка слайда за 30 секунд (0/1/2 по каждому):  заголовок (тема → утверждение длинное → утверждение до 10 слов); мысль (несколько → размыта → одна и понятна без докладчика); данные (без источника → источник не проверен → проверен и указан); визуал (текст вместо визуала → не по мысли → подходит); читаемость (мелко и много → с усилием → с последнего ряда). 8–10 — готов, 6–7 — доработать, меньше 6 — переделать.\n\n Аудит с моделью:  «Ты — строгий редактор презентаций. Проверь слайды по пунктам: заголовок утверждение, одна мысль, источники цифр, тип диаграммы, единый стиль, объём текста. Ответ — таблица: слайд   проблема   как исправить». Сверьте, что нашли оба, что только вы, что только модель; модель обычно пропускает выдуманные цифры и права на картинки.\n\n  Речь: от звука к тексту и обратно\n\n  Как машина распознаёт речь (ASR, Automatic Speech Recognition)\n\n1.  Звук  — колебания давления воздуха.\n2.  Спектрограмма  — звук разложен на частоты во времени, «картинка» речи.\n3.  Акустическая модель  — нейросеть сопоставляет фрагменты звука и токены текста.\n4.  Текст  — поток слов без знаков препинания.\n5.  Нормализация  — пунктуация, числа цифрами, разделение по говорящим.\n\nПримеры: GigaAM v3 — открытые модели распознавания русской речи от Сбера (лицензия MIT), SpeechKit — распознавание и синтез речи Яндекса (Yandex AI Studio). (Данные на осень 2026, сверить.)\n\n Где речь превращается в текст:  GigaChat (аудиофайл или голос, различает голоса); Алиса AI в Яндекс Браузере («Спросить по видео», ролики 40 с — 4 ч); перевод видео с английского в Яндекс Браузере с сохранением тембра; голосовой ввод; SpeechKit и GigaAM (локально — запись не уходит в облако).\n\n  Согласие и персональные данные\n\nПеред загрузкой записи интервью в чат бот проверьте: есть ли согласие собеседника на запись и обработку (лучше письменное) и есть ли в записи персональные данные (ФИО, должность, названия, раскрывающие личность). По 152 ФЗ такие данные нельзя передавать сторонним сервисам без оснований. Безопасный путь — локальная расшифровка (например, GigaAM) или обезличенный текст.\n\n Нельзя без согласия:  записывать собеседника тайно; загружать интервью с ФИО и телефонами без обезличивания; публиковать чужую лекцию или её расшифровку.\n\n  Конвейер «запись → конспект»\n\n1.  Запись  — с согласия говорящих, микрофон ближе к спикеру.\n2.  Согласие и данные  — персональные данные третьих лиц обезличить.\n3.  Расшифровка  — GigaChat, Алиса AI в Браузере, SpeechKit, GigaAM.\n4.  Структура  — промпт: тезисы, термины, вопросы, задачи.\n5.  Проверка  — цитаты и цифры по записи, на слух.\n\nПромпт: «Это расшифровка лекции. Термины курса: [СПИСОК]. 1) Исправь ошибки распознавания в терминах и именах; спорные места отметь [?]. 2) Составь конспект: 5–7 ключевых тезисов, определения терминов, примеры лектора. 3) Выпиши дословные цитаты с примерным временем. Ничего не добавляй от себя».\n\n  Где ошибается распознавание\n\n  Проблема   Что делать  \n \n  Термины и имена («эластичность спроса» → «эластичность с проса»)   Дать модели их список  \n  Цифры и даты («пятнадцать» и «пятьдесят» звучат похоже)   Сверять на слух  \n  Несколько голосов   Попросить разметить говорящих  \n  Шум и эхо   Улучшить запись  \n  Иностранные слова   Указать язык вставок  \n\n  Синтез речи (TTS, Text To Speech): текст для уха\n\nТекст для озвучки отличается от текста для чтения. Правила: фразы до 12–15 слов; числа словами, округлённо; без скобок и сокращений. Пример: «Доля студентов (ок. 63%), использующих ИИ инструменты, выросла на 1,5 п. п.» → «Почти две трети студентов уже учатся с ИИ. / И таких становится больше с каждым годом.» Промпт: «Перепиши для озвучки: короткие фразы, числа словами, без скобок. Паузы отметь знаком /».\n\n  Видео: сценарий, генерация, монтаж\n\n Главная мысль:  генераторы делают короткие фрагменты, а ролик собирает человек по сценарию.\n\n  Как генерируют видео\n\n Диффузия во времени:  шум убирается сразу у последовательности кадров, которые должны быть согласованы друг с другом. Отсюда ограничения: ролики — секунды, а не минуты (чем длиннее, тем труднее удержать согласованность).\n\n  Получается хорошо   Получается плохо  \n \n  Простое действие одного объекта; плавное движение камеры; природа, предметы, абстракции   Руки и пальцы, мелкая моторика; текст в кадре; несколько действий подряд; сложная физика взаимодействий  \n\n Почему «плывут» руки.  Модель не знает анатомии, а воспроизводит статистику кадров; руки мелкие, часто частично скрыты и меняют форму, поэтому их сложнее всего удержать согласованными. Крупные планы рук в кадр не ставим, нужное действие показываем общим планом.\n\n Сервисы  (осень 2026, сверить): GigaChat · Kandinsky 6
