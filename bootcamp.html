<script type="application/json" id="edata">{"lessons":[{"n":1,"title":"Как устроены большие языковые модели и как с ними говорить","short":"Токены, вероятности, обучение, ошибки модели, проверка фактов, основы промпта","date":"Пары 1–2","min":12,"theory":"## Понятие\n\n**Большая языковая модель (LLM, Large Language Model)** — нейросеть, обученная на огромных массивах текста предсказывать следующий фрагмент текста. Она не ищет готовый ответ в базе, а по шагам собирает правдоподобный.\n\n**Промпт (prompt)** — запрос к модели. **Промпт-инжиниринг (prompt engineering)** — составление и доработка запросов, чтобы получить нужный результат.\n\nНейросеть — не «душа» и не «поисковик». Это инструмент: он не понимает вас, а продолжает текст; знает только то, на чём обучен; собирает ответ, а не находит.\n\n## Где LLM на карте ИИ\n\nКаждая следующая область — частный случай предыдущей:\n\n1. **Искусственный интеллект (AI)** — системы, решающие задачи, требующие «интеллекта».\n2. **Машинное обучение (ML, Machine Learning)** — правила не пишут вручную, модель учится на данных.\n3. **Глубокое обучение (Deep Learning)** — многослойные нейронные сети.\n4. **Генеративные модели (Generative models)** — создают новый контент: текст, картинки, звук.\n5. **LLM** — генеративные модели, работающие с текстом.\n\n## Как модель генерирует текст\n\n**Главная мысль:** LLM — машина, которая предсказывает следующий фрагмент текста. Человек сначала думает, что сказать, потом подбирает слова. Модель «думает» только в процессе подбора слов.\n\n**Цикл «токен за токеном»:**\n\n1. **Запрос** — ваш текст + история диалога.\n2. **Токенизация (tokenization)** — текст режется на токены, у каждого свой номер.\n3. **Вычисление** — параметры модели дают вероятность каждого следующего токена.\n4. **Выбор** — берётся один токен: самый вероятный или случайный с учётом температуры.\n5. **Дописывание** — токен добавляется к тексту, и всё повторяется, пока модель не выдаст сигнал конца ответа.\n\nМодель не планирует ответ целиком: первое слово уже выбрано, когда последнего ещё нет.\n\n### Токен (token)\n\n**Токен** — минимальный кусочек текста, с которым работает модель: целое слово, часть слова, символ или цифра. Частое слово — один токен, редкое — несколько («син-хро-фаз-отрон»), числа и знаки — отдельно. У каждой модели свой «словарь» токенов (токенизатор).\n\nПочему это важно на практике:\n\n| Что | Следствие |\n|---|---|\n| Лимиты и цена | Бесплатные лимиты и тарифы API (Application Programming Interface — программный интерфейс) считаются в токенах, а не в словах |\n| Длина контекста | Сколько текста модель «держит в голове», тоже измеряется в токенах |\n| Русский язык | Обычно делится на больше токенов, чем английский того же смысла, поэтому дороже |\n| Буквы | Модель видит куски слов, а не буквы: плохо считает буквы, путает анаграммы |\n\n### Параметры (parameters)\n\n**Параметры** — числа («веса» связей), которые модель подбирает при обучении. Она много раз пытается угадать следующее слово и после каждой ошибки чуть подстраивает параметры. После тысяч диалогов связь «как» + «дела» становится сильной, «как» + «стол» — слабой.\n\nПример: у DeepSeek-V3 около 671 млрд параметров, но для каждого токена работают 37 млрд. Это архитектура **MoE (Mixture of Experts — смесь экспертов)**: модель собрана из «экспертов», на каждом шаге включается их часть.\n\n### Температура (temperature)\n\nНасколько смело модель выбирает слова.\n\n| Температура | Результат | Когда |\n|---|---|---|\n| Низкая | Предсказуемо, однообразно | Факты, извлечение данных, код |\n| Высокая | Разнообразно, рискованно | Идеи, названия, творческие тексты |\n\nВ чатах температуру обычно не видно; в API и конструкторах агентов это настройка.\n\n### Как модель учится: три этапа\n\n| Этап | Что происходит | Результат |\n|---|---|---|\n| 1. **Предобучение (pretraining)** | Читает огромные массивы текстов, учится угадывать следующий токен | Знает язык и факты, но просто продолжает текст |\n| 2. **Дообучение на инструкциях (instruction tuning, SFT — Supervised Fine-Tuning)** | Люди пишут пары «запрос — хороший ответ» | Отвечает на вопросы, а не дописывает их |\n| 3. **Обучение на оценках людей (RLHF, Reinforcement Learning from Human Feedback)** | Люди сравнивают ответы, модель поощряют за понравившиеся | Вежливая, безопасная — и склонная соглашаться |\n\nОтсюда **угодничество (sycophancy)**: модель учили нравиться людям.\n\nГлавный вывод аналогии «язык инопланетян»: можно продолжать закономерности, не понимая смысла. Заметить закономерность — и есть «выучить параметр».\n\n### Контекстное окно (context window)\n\nМодель видит только то, что помещается в окно: инструкцию сервиса, историю диалога, прикреплённые файлы и ваш запрос. Что выпало из окна — модель «забыла».\n\n- Долгий чат «теряет» начало: важные условия повторяйте или начинайте новый чат.\n- Одна задача — один чат: старые темы сбивают модель.\n- Окна бывают огромными (от десятков тысяч до миллиона токенов и больше), но середину длинного текста модель «читает» хуже.\n\n### Обычная и рассуждающая модель\n\n| | Обычная | Рассуждающая (reasoning) |\n|---|---|---|\n| Как отвечает | Сразу, без черновика | Сначала пишет цепочку рассуждений |\n| Скорость и цена | Быстрая, дешёвая | Медленнее (секунды — часы), дороже |\n| Сильна в | Тексты, перевод, пересказ | Математика, логика, код, планирование |\n| «Думай пошагово» | Помогает | Не нужно, делает сама |\n\nРежим включается переключателем в сервисе (DeepSeek, Qwen и др.); названия кнопок меняются.\n\n## Где модель ошибается\n\n**Галлюцинация (hallucination)** — уверенный, гладкий и неверный ответ. Модель оптимизирует правдоподобие текста, а не истинность, поэтому уверенный тон ничего не гарантирует.\n\nПример с ложной предпосылкой: «Почему Хинтон не получил премию Тьюринга?» Модель придумывает объяснение, хотя Хинтон получил её за 2018 год (с Бенджио и Лекуном), а в 2024-м — Нобелевскую премию по физике (с Хопфилдом).\n\n**Шесть типичных ошибок:**\n\n| Ошибка | Суть |\n|---|---|\n| Выдуманные факты и ссылки | Несуществующие статьи, цитаты, законы, URL |\n| Устаревшие знания | Не знает событий после даты обучения, если нет поиска |\n| Арифметика и счёт | Ошибки в вычислениях и подсчёте букв без режима рассуждений |\n| Ложные предпосылки | Принимает неверное условие и объясняет его |\n| Угодничество | Соглашается, даже когда вы неправы |\n| Невоспроизводимость | Один запрос — разные ответы (из-за случайного выбора токенов) |\n\nЧто делать с невоспроизводимостью: творческая задача — просить 5–10 вариантов сразу; факт — сравнить 2–3 ответа или две модели; расхождение — сигнал проверить.\n\n### Можно ли доверять самопроверке?\n\nЧастично. Самопроверка ловит ошибки формата и логики («проверь, всё ли по условию»), но не факты, которых модель не знает: она уверенно подтвердит собственную выдумку.\n\n### Фактчекинг: три способа\n\n1. **Поисковая проверка** — ищете сами: конкретные факты, даты, числа, источники, на которые ссылается модель, «срок годности» информации.\n2. **Кросс-проверка** — тот же вопрос в новом чате, другими словами или другой модели. Расхождения — повод копать глубже.\n3. **Цепочка верификации (chain of verification)** — разбить ответ на отдельные утверждения, проверить каждое в новом чате, свести и сравнить с исходным.\n\nБез проверки фактов любой ответ — черновик.\n\n## Рабочее место\n\n**Три уровня доступа к сервисам** (с точки зрения пользователя из России):\n\n1. Российские сервисы — работают без VPN (Алиса AI, GigaChat).\n2. Зарубежные без VPN (Qwen, DeepSeek).\n3. Зарубежные с VPN (ChatGPT, Claude, Gemini) — по желанию; условия сервисов не поддерживают Россию, возможна блокировка аккаунта.\n\nВсе задания выполнимы на уровне 1. Статусы доступа меняются — проверяйте перед работой.\n\n**Три основных ассистента и их сильные стороны** (данные на октябрь 2026 — сверить с текущими):\n\n| | Алиса AI (Яндекс) | Qwen (Alibaba) | GigaChat (Сбер) |\n|---|---|---|---|\n| Сильнее всего | Связка с Поиском, Браузером, Картами; вопросы по видео до 4 часов; режим «Исследовать» | Рассуждения и код, Deep Research, генерация веб-страниц; открытые модели для своего компьютера | Русский текст и следование инструкциям; Kandinsky: картинки и видео бесплатно; бесплатный API |\n| Осторожно | Код слабее | Часто уверенно ошибается в фактах; данные обрабатываются вне РФ | Агентный код и финансовые расчёты слабее; учится на запросах, отключить нельзя |\n\n«Лучшего» ассистента нет — есть подходящий под задачу. Для важного ответа — второе мнение от другого ассистента.\n\n**Типичные режимы:** «рассуждать» (Thinking) — виден ход мысли, можно указать на неверный шаг; «исследовать» (Deep Research) — план, поиск источников, отчёт со ссылками (откройте 2–3 ключевых источника); интерпретатор кода — «посчитай и покажи код» для таблиц и графиков.\n\n**Как читать бенчмарки (benchmarks — стандартные наборы тестов):** чем независимее источник, тем больше доверия.\n\n1. Независимые тесты (Artificial Analysis, Epoch AI, MERA — открытый тест для русского языка).\n2. Заявления компаний — свои наборы задач, часть тестов создана самими компаниями.\n3. Неформальные тесты — блоги, один автор, десятки задач.\n\n### Гигиена данных\n\nВсё, что вы отправили, хранится у сервиса и может использоваться для обучения, если это не отключено. Посредники-агрегаторы видят запросы и файлы.\n\n**Нельзя отправлять:** персональные данные (паспорт, СНИЛС, адреса, телефоны — свои и чужие); пароли, коды из СМС, ключи API; чужие документы (под NDA — Non-Disclosure Agreement, соглашением о неразглашении; внутренние документы работодателя); данные других людей (переписки, оценки, фото без согласия).\n\n**Можно:** открытые тексты, свои учебные материалы, обезличенные или выдуманные данные. **Правило: не вводите то, что нельзя опубликовать.**\n\n## Основы промптинга\n\n**Без инструкции модель продолжает текст, с инструкцией — выполняет задачу.** «Небо сегодня…» → «…голубое…», а «Закончи предложение одним словом: “Небо сегодня…”» → «…ясное».\n\n### Восемь типов задач\n\nОткрытый вопрос; закрытый вопрос; создание текста; анализ и рассуждение; классификация; редактура и перевод; сводка и извлечение; код и формулы. Запоминать не нужно — нужно узнавать тип своей задачи: от него зависит, какие уточнения добавить.\n\n### Анатомия промпта: шесть элементов\n\n| Элемент | Вопрос | Пример |\n|---|---|---|\n| **Роль** | Кто отвечает? | «Ты — методист с опытом подготовки к экзаменам» |\n| **Задача** | Что сделать? | «Составь план подготовки к экзамену по статистике» |\n| **Контекст** | Для кого и зачем? | «Я второкурсник, до экзамена 10 дней, по 2 часа в день» |\n| **Формат** | Как оформить? | «Таблица: день — темы — задания — время» |\n| **Ограничения** | Чего нельзя? | «Не больше 3 тем в день, воскресенье — выходной» |\n| **Примеры** | Как выглядит хорошо? | «Вот как я планировал другой экзамен: …» |\n\n**Минимум для серьёзной задачи — задача, контекст и формат.** Остальное — по ситуации.\n\n**Было → стало.** «Сделай план подготовки к экзамену» — модель заполнит пробелы «средним по больнице». Версия с ролью, задачей, контекстом, форматом и ограничениями даёт план под вас.\n\n**Развенчанные мифы:**\n\n- **«Ты — эксперт» обязательно?** Нет. Роль задаёт стиль, уровень и лексику, но знаний не добавляет. Сильнее влияют контекст и критерии: для кого, какой длины, что считать хорошим результатом.\n- **Длинный или короткий?** Важна не длина, а полнота: всё нужное для задачи и ничего лишнего. Для простого вопроса хватит фразы, для письма или плана нужен абзац. Лишние детали вредят — модель теряет главное.\n- **Мотивация («это очень важно для карьеры!», «заплачу $200»).** На ранних моделях иногда немного улучшала ответ (EmotionPrompt, 2023), на современных эффект слабый и непостоянный. Вместо эмоций объясните, зачем вам ответ и как его будут использовать.\n\n### Zero-shot и few-shot\n\n| | Zero-shot (без примеров) | Few-shot (с примерами) |\n|---|---|---|\n| Что | Задача без примеров | Задача + 2–3 примера |\n| Когда | Простые, типовые задачи | Трудно описать критерий словами: тон, стиль, границы категорий |\n| Особенность | Ответ может быть в любой форме | Модель копирует формат и границы категорий из примеров |\n\nПример few-shot для тональности: «Прекрасный магазин! — позитивная», «Работают до 21:00 — нейтральная», «Ждал заказ две недели — негативная», затем новый отзыв.\n\n### Цепочка рассуждений (chain of thought)\n\nПросьба «рассуждай пошагово» помогает на многошаговых задачах. Пример: 23 яблока, 20 ушло, купили ещё 6. Ответ «сразу» может быть 27, а по шагам: 23 − 20 = 3; 3 + 6 = 9. Современные модели часто решают это и без подсказки, а рассуждающим моделям она не нужна.\n\n### Итеративный подход\n\n**Промпт → ответ → критика → правка.** Первый ответ — черновик.\n\n- Уточняйте, а не переписывайте: «сократи вдвое», «добавь пример», «убери канцелярит».\n- Одна задача — один чат.\n- Сохраняйте удачные промпты в личную библиотеку.\n\n### Приём «пусть модель сначала спросит вас»\n\nШаблон: «Я хочу [задача]. Прежде чем отвечать, задай мне до 5 уточняющих вопросов. Задавай по одному и жди ответа». Помогает, когда много скрытых условий (письмо, план, резюме), вы не знаете, что важно указать, или первый ответ получился «общим».\n\n## Ловушки для проверки модели\n\n| Вопрос | Правильный ответ | Механизм ошибки |\n|---|---|---|\n| Сколько букв «о» в слове «обороноспособность»? | 7 | Токены: модель видит куски слов, не буквы |\n| Что больше: 9.11 или 9.9? | 9.9 | Путает десятичные дроби с номерами версий |\n| Перескажи роман Чехова «Белый маяк» | Такого романа нет | Ложная предпосылка → галлюцинация |\n| Какое сегодня число? | Зависит от сервиса | Без часов и поиска модель не знает дату |\n\n## Чек-лист хорошего промпта\n\n- Задача сформулирована глаголом («составь», «сравни», «перепиши»).\n- Есть контекст: для кого, зачем, что уже известно.\n- Задан формат: список, таблица, длина, стиль.\n- Названы ограничения: чего не делать, объём, сроки.\n- Есть пример, если критерий трудно описать (few-shot).\n- Новая задача — новый чат.\n- Факты проверены по первоисточнику или второй моделью.\n\n## Главное\n\n1. LLM не ищет ответ, а предсказывает следующий токен по вероятностям.\n2. Модель видит токены, а не буквы, и помнит только то, что в контекстном окне.\n3. Уверенный тон ничего не гарантирует: факты проверяем всегда.\n4. Хороший промпт = задача + контекст + формат, остальное — по ситуации.\n5. Первый ответ — черновик: итерации, один чат на задачу.","text":"  Понятие\n\n Большая языковая модель (LLM, Large Language Model)  — нейросеть, обученная на огромных массивах текста предсказывать следующий фрагмент текста. Она не ищет готовый ответ в базе, а по шагам собирает правдоподобный.\n\n Промпт (prompt)  — запрос к модели.  Промпт инжиниринг (prompt engineering)  — составление и доработка запросов, чтобы получить нужный результат.\n\nНейросеть — не «душа» и не «поисковик». Это инструмент: он не понимает вас, а продолжает текст; знает только то, на чём обучен; собирает ответ, а не находит.\n\n  Где LLM на карте ИИ\n\nКаждая следующая область — частный случай предыдущей:\n\n1.  Искусственный интеллект (AI)  — системы, решающие задачи, требующие «интеллекта».\n2.  Машинное обучение (ML, Machine Learning)  — правила не пишут вручную, модель учится на данных.\n3.  Глубокое обучение (Deep Learning)  — многослойные нейронные сети.\n4.  Генеративные модели (Generative models)  — создают новый контент: текст, картинки, звук.\n5.  LLM  — генеративные модели, работающие с текстом.\n\n  Как модель генерирует текст\n\n Главная мысль:  LLM — машина, которая предсказывает следующий фрагмент текста. Человек сначала думает, что сказать, потом подбирает слова. Модель «думает» только в процессе подбора слов.\n\n Цикл «токен за токеном»: \n\n1.  Запрос  — ваш текст + история диалога.\n2.  Токенизация (tokenization)  — текст режется на токены, у каждого свой номер.\n3.  Вычисление  — параметры модели дают вероятность каждого следующего токена.\n4.  Выбор  — берётся один токен: самый вероятный или случайный с учётом температуры.\n5.  Дописывание  — токен добавляется к тексту, и всё повторяется, пока модель не выдаст сигнал конца ответа.\n\nМодель не планирует ответ целиком: первое слово уже выбрано, когда последнего ещё нет.\n\n  Токен (token)\n\n Токен  — минимальный кусочек текста, с которым работает модель: целое слово, часть слова, символ или цифра. Частое слово — один токен, редкое — несколько («син хро фаз отрон»), числа и знаки — отдельно. У каждой модели свой «словарь» токенов (токенизатор).\n\nПочему это важно на практике:\n\n  Что   Следствие  \n \n  Лимиты и цена   Бесплатные лимиты и тарифы API (Application Programming Interface — программный интерфейс) считаются в токенах, а не в словах  \n  Длина контекста   Сколько текста модель «держит в голове», тоже измеряется в токенах  \n  Русский язык   Обычно делится на больше токенов, чем английский того же смысла, поэтому дороже  \n  Буквы   Модель видит куски слов, а не буквы: плохо считает буквы, путает анаграммы  \n\n  Параметры (parameters)\n\n Параметры  — числа («веса» связей), которые модель подбирает при обучении. Она много раз пытается угадать следующее слово и после каждой ошибки чуть подстраивает параметры. После тысяч диалогов связь «как» + «дела» становится сильной, «как» + «стол» — слабой.\n\nПример: у DeepSeek V3 около 671 млрд параметров, но для каждого токена работают 37 млрд. Это архитектура  MoE (Mixture of Experts — смесь экспертов) : модель собрана из «экспертов», на каждом шаге включается их часть.\n\n  Температура (temperature)\n\nНасколько смело модель выбирает слова.\n\n  Температура   Результат   Когда  \n \n  Низкая   Предсказуемо, однообразно   Факты, извлечение данных, код  \n  Высокая   Разнообразно, рискованно   Идеи, названия, творческие тексты  \n\nВ чатах температуру обычно не видно; в API и конструкторах агентов это настройка.\n\n  Как модель учится: три этапа\n\n  Этап   Что происходит   Результат  \n \n  1.  Предобучение (pretraining)    Читает огромные массивы текстов, учится угадывать следующий токен   Знает язык и факты, но просто продолжает текст  \n  2.  Дообучение на инструкциях (instruction tuning, SFT — Supervised Fine Tuning)    Люди пишут пары «запрос — хороший ответ»   Отвечает на вопросы, а не дописывает их  \n  3.  Обучение на оценках людей (RLHF, Reinforcement Learning from Human Feedback)    Люди сравнивают ответы, модель поощряют за понравившиеся   Вежливая, безопасная — и склонная соглашаться  \n\nОтсюда  угодничество (sycophancy) : модель учили нравиться людям.\n\nГлавный вывод аналогии «язык инопланетян»: можно продолжать закономерности, не понимая смысла. Заметить закономерность — и есть «выучить параметр».\n\n  Контекстное окно (context window)\n\nМодель видит только то, что помещается в окно: инструкцию сервиса, историю диалога, прикреплённые файлы и ваш запрос. Что выпало из окна — модель «забыла».\n\n  Долгий чат «теряет» начало: важные условия повторяйте или начинайте новый чат.\n  Одна задача — один чат: старые темы сбивают модель.\n  Окна бывают огромными (от десятков тысяч до миллиона токенов и больше), но середину длинного текста модель «читает» хуже.\n\n  Обычная и рассуждающая модель\n\n    Обычная   Рассуждающая (reasoning)  \n \n  Как отвечает   Сразу, без черновика   Сначала пишет цепочку рассуждений  \n  Скорость и цена   Быстрая, дешёвая   Медленнее (секунды — часы), дороже  \n  Сильна в   Тексты, перевод, пересказ   Математика, логика, код, планирование  \n  «Думай пошагово»   Помогает   Не нужно, делает сама  \n\nРежим включается переключателем в сервисе (DeepSeek, Qwen и др.); названия кнопок меняются.\n\n  Где модель ошибается\n\n Галлюцинация (hallucination)  — уверенный, гладкий и неверный ответ. Модель оптимизирует правдоподобие текста, а не истинность, поэтому уверенный тон ничего не гарантирует.\n\nПример с ложной предпосылкой: «Почему Хинтон не получил премию Тьюринга?» Модель придумывает объяснение, хотя Хинтон получил её за 2018 год (с Бенджио и Лекуном), а в 2024 м — Нобелевскую премию по физике (с Хопфилдом).\n\n Шесть типичных ошибок: \n\n  Ошибка   Суть  \n \n  Выдуманные факты и ссылки   Несуществующие статьи, цитаты, законы, URL  \n  Устаревшие знания   Не знает событий после даты обучения, если нет поиска  \n  Арифметика и счёт   Ошибки в вычислениях и подсчёте букв без режима рассуждений  \n  Ложные предпосылки   Принимает неверное условие и объясняет его  \n  Угодничество   Соглашается, даже когда вы неправы  \n  Невоспроизводимость   Один запрос — разные ответы (из за случайного выбора токенов)  \n\nЧто делать с невоспроизводимостью: творческая задача — просить 5–10 вариантов сразу; факт — сравнить 2–3 ответа или две модели; расхождение — сигнал проверить.\n\n  Можно ли доверять самопроверке?\n\nЧастично. Самопроверка ловит ошибки формата и логики («проверь, всё ли по условию»), но не факты, которых модель не знает: она уверенно подтвердит собственную выдумку.\n\n  Фактчекинг: три способа\n\n1.  Поисковая проверка  — ищете сами: конкретные факты, даты, числа, источники, на которые ссылается модель, «срок годности» информации.\n2.  Кросс проверка  — тот же вопрос в новом чате, другими словами или другой модели. Расхождения — повод копать глубже.\n3.  Цепочка верификации (chain of verification)  — разбить ответ на отдельные утверждения, проверить каждое в новом чате, свести и сравнить с исходным.\n\nБез проверки фактов любой ответ — черновик.\n\n  Рабочее место\n\n Три уровня доступа к сервисам  (с точки зрения пользователя из России):\n\n1. Российские сервисы — работают без VPN (Алиса AI, GigaChat).\n2. Зарубежные без VPN (Qwen, DeepSeek).\n3. Зарубежные с VPN (ChatGPT, Claude, Gemini) — по желанию; условия сервисов не поддерживают Россию, возможна блокировка аккаунта.\n\nВсе задания выполнимы на уровне 1. Статусы доступа меняются — проверяйте перед работой.\n\n Три основных ассистента и их сильные стороны  (данные на октябрь 2026 — сверить с текущими):\n\n    Алиса AI (Яндекс)   Qwen (Alibaba)   GigaChat (Сбер)  \n \n  Сильнее всего   Связка с Поиском, Браузером, Картами; вопросы по видео до 4 часов; режим «Исследовать»   Рассуждения и код, Deep Research, генерация веб страниц; открытые модели для своего компьютера   Русский текст и следование инструкциям; Kandinsky: картинки и видео бесплатно; бесплатный API  \n  Осторожно   Код слабее   Часто уверенно ошибается в фактах; данные обрабатываются вне РФ   Агентный код и финансовые расчёты слабее; учится на запросах, отключить нельзя  \n\n«Лучшего» ассистента нет — есть подходящий под задачу. Для важного ответа — второе мнение от другого ассистента.\n\n Типичные режимы:  «рассуждать» (Thinking) — виден ход мысли, можно указать на неверный шаг; «исследовать» (Deep Research) — план, поиск источников, отчёт со ссылками (откройте 2–3 ключевых источника); интерпретатор кода — «посчитай и покажи код» для таблиц и графиков.\n\n Как читать бенчмарки (benchmarks — стандартные наборы тестов):  чем независимее источник, тем больше доверия.\n\n1. Независимые тесты (Artificial Analysis, Epoch AI, MERA — открытый тест для русского языка).\n2. Заявления компаний — свои наборы задач, часть тестов создана самими компаниями.\n3. Неформальные тесты — блоги, один автор, десятки задач.\n\n  Гигиена данных\n\nВсё, что вы отправили, хранится у сервиса и может использоваться для обучения, если это не отключено. Посредники агрегаторы видят запросы и файлы.\n\n Нельзя отправлять:  персональные данные (паспорт, СНИЛС, адреса, телефоны — свои и чужие); пароли, коды из СМС, ключи API; чужие документы (под NDA — Non Disclosure Agreement, соглашением о неразглашении; внутренние документы работодателя); данные других людей (переписки, оценки, фото без согласия).\n\n Можно:  открытые тексты, свои учебные материалы, обезличенные или выдуманные данные.  Правило: не вводите то, что нельзя опубликовать. \n\n  Основы промптинга\n\n Без инструкции модель продолжает текст, с инструкцией — выполняет задачу.  «Небо сегодня…» → «…голубое…», а «Закончи предложение одним словом: “Небо сегодня…”» → «…ясное».\n\n  Восемь типов задач\n\nОткрытый вопрос; закрытый вопрос; создание текста; анализ и рассуждение; классификация; редактура и перевод; сводка и извлечение; код и формулы. Запоминать не нужно — нужно узнавать тип своей задачи: от него зависит, какие уточнения добавить.\n\n  Анатомия промпта: шесть элементов\n\n  Элемент   Вопрос   Пример  \n \n   Роль    Кто отвечает?   «Ты — методист с опытом подготовки к экзаменам»  \n   Задача    Что сделать?   «Составь план подготовки к экзамену по статистике»  \n   Контекст    Для кого и зачем?   «Я второкурсник, до экзамена 10 дней, по 2 часа в день»  \n   Формат    Как оформить?   «Таблица: день — темы — задания — время»  \n   Ограничения    Чего нельзя?   «Не больше 3 тем в день, воскресенье — выходной»  \n   Примеры    Как выглядит хорошо?   «Вот как я планировал другой экзамен: …»  \n\n Минимум для серьёзной задачи — задача, контекст и формат.  Остальное — по ситуации.\n\n Было → стало.  «Сделай план подготовки к экзамену» — модель заполнит пробелы «средним по больнице». Версия с ролью, задачей, контекстом, форматом и ограничениями даёт план под вас.\n\n Развенчанные мифы: \n\n   «Ты — эксперт» обязательно?  Нет. Роль задаёт стиль, уровень и лексику, но знаний не добавляет. Сильнее влияют контекст и критерии: для кого, какой длины, что считать хорошим результатом.\n   Длинный или короткий?  Важна не длина, а полнота: всё нужное для задачи и ничего лишнего. Для простого вопроса хватит фразы, для письма или плана нужен абзац. Лишние детали вредят — модель теряет главное.\n   Мотивация («это очень важно для карьеры!», «заплачу $200»).  На ранних моделях иногда немного улучшала ответ (EmotionPrompt, 2023), на современных эффект слабый и непостоянный. Вместо эмоций объясните, зачем вам ответ и как его будут использовать.\n\n  Zero shot и few shot\n\n    Zero shot (без примеров)   Few shot (с примерами)  \n \n  Что   Задача без примеров   Задача + 2–3 примера  \n  Когда   Простые, типовые задачи   Трудно описать критерий словами: тон, стиль, границы категорий  \n  Особенность   Ответ может быть в любой форме   Модель копирует формат и границы категорий из примеров  \n\nПример few shot для тональности: «Прекрасный магазин! — позитивная», «Работают до 21:00 — нейтральная», «Ждал заказ две недели — негативная», затем новый отзыв.\n\n  Цепочка рассуждений (chain of thought)\n\nПросьба «рассуждай пошагово» помогает на многошаговых задачах. Пример: 23 яблока, 20 ушло, купили ещё 6. Ответ «сразу» может быть 27, а по шагам: 23 − 20 = 3; 3 + 6 = 9. Современные модели часто решают это и без подсказки, а рассуждающим моделям она не нужна.\n\n  Итеративный подход\n\n Промпт → ответ → критика → правка.  Первый ответ — черновик.\n\n  Уточняйте, а не переписывайте: «сократи вдвое», «добавь пример», «убери канцелярит».\n  Одна задача — один чат.\n  Сохраняйте удачные промпты в личную библиотеку.\n\n  Приём «пусть модель сначала спросит вас»\n\nШаблон: «Я хочу [задача]. Прежде чем отвечать, задай мне до 5 уточняющих вопросов. Задавай по одному и жди ответа». Помогает, когда много скрытых условий (письмо, план, резюме), вы не знаете, что важно указать, или первый ответ получился «общим».\n\n  Ловушки для проверки модели\n\n  Вопрос   Правильный ответ   Механизм ошибки  \n \n  Сколько букв «о» в слове «обороноспособность»?   7   Токены: модель видит куски слов, не буквы  \n  Что больше: 9.11 или 9.9?   9.9   Путает десятичные дроби с номерами версий  \n  Перескажи роман Чехова «Белый маяк»   Такого романа нет   Ложная предпосылка → галлюцинация  \n  Какое сегодня число?   Зависит от сервиса   Без часов и поиска модель не знает дату  \n\n  Чек лист хорошего промпта\n\n  Задача сформулирована глаголом («составь», «сравни», «перепиши»).\n  Есть контекст: для кого, зачем, что уже известно.\n  Задан формат: список, таблица, длина, стиль.\n  Названы ограничения: чего не делать, объём, сроки.\n  Есть пример, если критерий трудно описать (few shot).\n  Новая задача — новый чат.\n  Факты проверены по первоисточнику или второй моделью.\n\n  Главное\n\n1. LLM не ищет ответ, а предсказывает следующий токен по вероятностям.\n2. Модель видит токены, а не буквы, и помнит только то, что в контекстном окне.\n3. Уверенный тон ничего не гарантирует: факты проверяем всегда.\n4. Хороший промпт = задача + контекст + формат, остальное — по ситуации.\n5. Первый ответ — черновик: итерации, один чат на задачу.","id":"llm-i-prompty"},{"n":2,"title":"Продвинутый промптинг и оценка качества ответов","short":"Декомпозиция и цепочки, формат ответа, шаблоны и память, рубрики, модель-судья, A/B-тест промптов","date":"Пары 3–4","min":12,"theory":"## Повтор занятия 1\n\n- Модель видит токены, а не буквы, поэтому «посчитай символы» лучше решать кодом или проверять вручную.\n- Минимум промпта: задача, контекст, формат.\n- Уверенный пересказ несуществующего — галлюцинация (здесь — от ложной предпосылки).\n- Температура меняет смелость выбора следующего токена: низкая — предсказуемо, высокая — разнообразно и рискованно.\n\n## Сложные задачи: разбить и связать\n\n### Почему один большой промпт проигрывает\n\nЗапрос «проанализируй рынок кофеен, сравни конкурентов, придумай концепцию, посчитай бюджет и напиши питч» одним сообщением плох:\n\n- модель распределяет внимание на всё сразу;\n- ошибка в начале незаметно портит конец;\n- нельзя проверить промежуточные результаты;\n- длинный ответ трудно править по частям.\n\n**Цепочка промптов (prompt chain)** — задача из шагов, где выход одного шага — вход следующего. После каждого шага человек проверяет и правит; ошибка исправляется там, где возникла.\n\n**Когда цепочка лишняя:** задача решается за один шаг и легко проверяется целиком (перевести абзац, придумать заголовок). Делить нужно, если в задаче несколько разных действий (найти, сравнить, написать) или промежуточный результат должен проверить человек.\n\n### Декомпозиция (decomposition) — дерево задачи\n\nПример: обзор литературы для курсовой.\n\n1. **Вопрос** — сформулировать исследовательский вопрос и ключевые понятия (человек).\n2. **Поиск** — найти источники в библиотеке и базах самому: без поиска модель их выдумает.\n3. **Конспект** — модель: краткое содержание каждой статьи по шаблону.\n4. **Синтез** — модель: таблица «автор — метод — вывод», общие и спорные места.\n5. **Текст** — черновик обзора, затем ваша редактура и сверка ссылок.\n\n**Правило:** модели — то, что можно проверить; человеку — источники, решения и финальный текст.\n\n### Приём «сначала план — потом выполнение»\n\nШаг 1: «Предложи план из 5–6 пунктов с тезисами. Не пиши текст, пока я не отвечу “план утверждён”». Шаг 2: «Пиши по одному пункту и жди команды “дальше”». Правка плана занимает минуту, правка готового текста — полчаса; каждая часть получает всё внимание модели.\n\n### Что показали исследования рассуждения\n\n| Результат | Источник |\n|---|---|\n| Точность на задаче MultiArith выросла с 17,7% до 78,7% после фразы «Let’s think step by step» | Kojima и др., 2022 |\n| На GSM8K: несколько решений и самый частый ответ дали +17,9 п. п. | Wang и др., 2022 |\n| 8 примеров с рассуждениями — рекорд PaLM 540B на GSM8K | Wei и др., 2022 |\n\nВывод: многошаговым задачам нужны промежуточные шаги, несколько попыток повышают надёжность. Но рассуждающим моделям «думай пошагово» не нужно, а само рассуждение не гарантирует верных фактов. (Исследования 2022 года на моделях того времени.)\n\n## Формат ответа\n\n**Структурированный ответ — тот, который можно сразу использовать.**\n\n| Формат | Зачем |\n|---|---|\n| Таблица | Сравнить варианты по одинаковым критериям; вставить в Excel; пустая клетка заметна сразу |\n| Список и шаги | Инструкция, план, чек-лист; нумерация — когда важен порядок; короткие пункты легче проверять |\n| **JSON (JavaScript Object Notation)** | Формат «ключ: значение», который читают программы, боты и сервисы автоматизации; поля всегда одни и те же |\n\nФормат задавайте явно: «ответь таблицей со столбцами …», «только JSON без пояснений». Если задать столбцы, таблицы из разных запросов совпадут по структуре.\n\n**Как убрать лишнее вступление («Конечно! Вот ваша таблица…»):** скажите прямо и в конце промпта: «Ответь только таблицей. Без вступления, пояснений и выводов». Если не помогает — дайте образец первой строки или попросите JSON. Последняя инструкция в промпте обычно влияет сильнее всего.\n\n**Извлечение данных в JSON.** Пример: «Извлеки из объявления поля event, date, place, price. Если поля нет — поставь null. Ответь только JSON». Условие «если нет — null» защищает от выдуманных значений: иначе модель придумает.\n\n### Разделители (delimiters)\n\nБез разделителей модель может принять часть текста за инструкцию (особенно если в тексте есть повелительные фразы). Отделяйте инструкцию от данных:\n\n1. Кавычки и тройные кавычки: `\"\"\" текст \"\"\"`.\n2. Теги: `<письмо> … <\/письмо>`, `<пример> … <\/пример>`.\n3. Заголовки: `### Задача`, `### Данные`, `### Формат`.\n\nРазделители же защищают от внедрения чужих инструкций (подробнее — занятие 7).\n\n### Куда ставить главное в длинном промпте\n\nИсследование «Lost in the Middle» (Liu и др., 2023): модель лучше использует информацию из **начала и конца** длинного контекста, а середина «проваливается».\n\n- Инструкцию — в начало, ключевой вопрос повторите в конце.\n- Длинный документ — между ними, в разделителях.\n- Не вставляйте 50 страниц ради одного абзаца — дайте нужный фрагмент.\n\n### Чувствительность к мелочам\n\nТолько из-за оформления промпта точность LLaMA-2-13B менялась до 76 п. п. (Sclar и др., 2023); порядок примеров меняет результат от почти рекордного до почти случайного (Lu и др., 2022). Выводы: прогоняйте промпт 2–3 раза, перемешивайте примеры разных классов, меняйте одну вещь за раз.\n\n## Шаблоны, мета-промптинг, роли, память\n\n### Шаблон промпта\n\nШаблон — промпт, который сработал, с «дырками» для новых данных: постоянная часть + переменные.\n\n> Ты — [РОЛЬ]. Объясни тему «[ТЕМА]» для [АУДИТОРИЯ]. Формат: [ФОРМАТ]. Длина: не больше [ОБЪЁМ]. Приведи один пример из области «[ОБЛАСТЬ]». Если не уверен в факте — так и напиши.\n\nОдин шаблон — десятки задач: меняются только переменные.\n\n### Библиотека промптов\n\nТаблица: название, задача, шаблон, переменные, где работает лучше, **оценка**. Без оценки библиотека превращается в свалку. Название — глагол + объект («Объясни тему»). Новая удачная версия — новая строка.\n\n### Мета-промптинг (meta-prompting)\n\nМодель сама пишет промпт:\n\n1. **Цель** — опишите задачу и результат своими словами.\n2. **Черновик промпта** — модель пишет по шаблону: роль, задача, контекст, формат, ограничения, отмечая в скобках места для вашего заполнения.\n3. **Ваша правка** — уберите лишнее, добавьте то, что знаете только вы.\n4. **Запуск в новом чате** — чистый контекст даёт честную проверку.\n\n### Самосогласованность (self-consistency)\n\nЗадайте задачу несколько раз (3 новых чата или «реши тремя способами») и возьмите самый частый ответ. Подходит для расчётов, логики, классификации; для творческих задач разные ответы — норма. Расхождение — сигнал перепроверить вручную (Wang и др., 2022).\n\n### «Автор и критик»\n\n1. **Автор** пишет черновик.\n2. **Критик** по вашим критериям находит 3 главные проблемы с цитатами из текста, не переписывая его.\n3. **Автор** исправляет только эти замечания.\n\nБез критериев критик хвалит; с критериями находит конкретные проблемы.\n\n### Роли\n\nНе «ты — эксперт», а точная позиция, меняющая задачу:\n\n| Роль | Пример | Что даёт |\n|---|---|---|\n| Аудитория | «Объясняй, как первокурснику-юристу» | Уровень и примеры |\n| Оппонент | «Найди сильнейшие возражения к тезису» | Проверка аргументов |\n| Панель экспертов | «Оцени план глазами маркетолога и юриста» | Разные точки зрения |\n| Интервьюер | «Проведи пробное собеседование» | Диалог вместо лекции |\n| Редактор | «Правь стиль, факты не трогай» | Роль с границей |\n| Ученик | «Спрашивай, где у меня пробелы» | Проверка понимания |\n\n### Откуда модель знает, как себя вести: четыре слоя инструкций\n\n1. **Системная инструкция сервиса** — задаёт разработчик (тон, правила безопасности, инструменты); пользователь её не видит.\n2. **Память и персонализация** — факты о вас из прошлых диалогов и настроек.\n3. **История текущего чата** — пока помещается в контекстное окно.\n4. **Ваш промпт** — последнее сообщение.\n\nНовый чат обнуляет историю, но не системную инструкцию и не память.\n\n### Память\n\nПамять хранит не переписку, а отдельные факты о вас (профессию, интересы, предпочтения). Детали вчерашней задачи туда обычно не попадают. Чтобы продолжить работу, попросите в конце чата **короткое резюме** и вставьте в начало нового.\n\nЛайфхаки: стартовый промпт проекта (задача, команда, формат) — в начало каждого чата; раз в месяц спрашивайте, что модель о вас знает, и удаляйте устаревшее; новая тема — новый чат; чужую задачу решайте без памяти. Не сообщайте документы, пароли, номера карт и данные других людей.\n\n**Проекты и пространства (projects)** — папка для чатов одной темы: общая инструкция, загруженные файлы доступны в каждом чате. Нужны для курсовой, длинной задачи, подготовки к экзамену. Если функции нет — стартовый промпт, ключевые файлы в начале чата и резюме прошлого чата дают тот же эффект.\n\n## Что такое хороший ответ: критерии и рубрики\n\n«Оцени ответ от 1 до 10» почти бесполезно: без критериев число ничего не значит, модель не знает, за что снижать балл, и ставит высокие оценки. Два запуска могут дать 7 и 9 за один текст. Работает иначе: 3–5 критериев с описанием уровней 0–1–2, и **сначала обоснование, потом балл**.\n\n### Пять измеримых свойств ответа\n\n| Критерий | Смысл |\n|---|---|\n| Точность | Факты верны, расчёты сходятся, нет выдуманных источников |\n| Полнота | Учтены все части задачи и условия |\n| Соответствие задаче | Ответ на тот вопрос, который задан |\n| Формат | Таблица, длина, структура — как просили |\n| Уместность | Тон и уровень подходят аудитории |\n\nДля каждой задачи выбирайте 3–5 критериев, а не все сразу.\n\n### Рубрика (rubric)\n\n**Рубрика** — таблица «критерий × уровень» с описанием каждого уровня; она превращает «нормально» в число.\n\n| Критерий | 0 — не выполнено | 1 — частично | 2 — выполнено |\n|---|---|---|---|\n| Точность | Выдуманный факт или ошибка в расчёте | Мелкие неточности, суть верна | Все факты проверены по источнику |\n| Соответствие задаче | Ответ на другой вопрос | Часть задачи упущена | Все части выполнены |\n| Формат | Не соблюдён | Отклонения: длина, лишний текст | Ровно как задано |\n| Уместность | Не подходит аудитории | Местами сложно или фамильярно | Тон и уровень подходят |\n\nСумма 0–8; версии промпта сравнивают по одной рубрике.\n\n**Чек-лист или рубрика?**\n\n| Чек-лист (да/нет) | Рубрика (0/1/2) |\n|---|---|\n| Быстрая проверка одного ответа | Выбор лучшего промпта, A/B-тест, проект |\n| «Есть ли таблица со столбцами X, Y, Z?» | Каждый уровень описан словами, видно, что именно улучшилось |\n\nРубрику можно поручить модели («составь рубрику из 4 критериев с тремя уровнями, критерии проверяемые: не “интересно”, а “есть пример из жизни студентов”»), но обязательно проверьте: можно ли проверить критерий, не споря; нет ли двух критериев про одно; есть ли точность фактов; совпадает ли рубрика с требованиями задания.\n\n## Модель как судья и самопроверка\n\n### Можно ли просить модель проверить факты в её ответе?\n\nМожно, но проверка слабая: выдумав факт, модель часто «подтвердит» его снова. Надёжнее внешняя опора: поиск со ссылкой к каждому факту, загруженный первоисточник или другая модель. Решающая проверка — открыть источник самому.\n\n### Модель-судья (LLM-as-a-judge)\n\nОдна модель оценивает ответы другой по рубрике и выдаёт обоснование и вердикт. Сильная модель-судья совпадает с оценками людей более чем в 80% случаев — столько же, сколько люди между собой (Zheng и др., 2023, MT-Bench). Удобно для быстрых сравнений, окончательное решение — за человеком.\n\n**Три искажения судьи:**\n\n| Искажение | Суть |\n|---|---|\n| Позиция | Предпочитает ответ, стоящий первым (или вторым). Когда судьёй был ChatGPT, Vicuna-13B «побеждала» его в 66 из 80 вопросов только за счёт порядка (Wang и др., 2023) |\n| Многословие | Длинный ответ кажется лучше, даже если в нём больше воды |\n| Самолюбование | Выше оценивает ответы, похожие на свои собственные |\n\n**Как сделать судью честнее:**\n\n1. Меняйте ответы местами (A–B и B–A): разные вердикты — значит, ответы примерно равны.\n2. Сначала обоснование, потом балл: цитата → вывод → балл.\n3. Рубрика с описанием уровней.\n4. Судья — другая модель, не автор.\n5. Скрывайте авторство.\n\n**Шаблон судьи:** «Ты — беспристрастный эксперт. Оцени два ответа на одну задачу. Задача/ответ 1/ответ 2/рубрика — в тегах. Для каждого ответа и критерия: цитата → вывод → балл 0, 1 или 2. Не учитывай длину, если её нет в рубрике. В конце: сумма и какой ответ лучше; если равны — так и скажи».\n\n### Самопроверка (self-check)\n\n| Находит хорошо | Находит плохо |\n|---|---|\n| Формат и длину, пропущенные пункты, стиль и повторы | Свои выдуманные факты, ошибки в рассуждении, неверные ссылки |\n\nЧто делать: формат — по чек-листу; факты — по источникам; расчёты — кодом. Цикл «черновик → отзыв → правка» (**Self-Refine**) дал ≈20 п. п. прироста (Madaan и др., 2023), но самоисправление без внешних данных может вредить (Huang и др., 2023).\n\n## Итерации и A/B-тест промптов\n\n**Журнал промптов:** версия, что изменил, гипотеза, оценка по рубрике (0–8), вывод.\n\nПример: v1 «Напиши письмо о переносе дедлайна» — 3/8 (нет причины и срока); v2 + адресат, причина, срок, тон — 6/8 (длинно); v3 + не больше 120 слов, одно извинение, структура «просьба — причина — срок» — 8/8.\n\n**Правила:** одна правка — одна версия; каждая версия в новом чате и в одном сервисе; одна рубрика для всех версий.\n\n**Версия v3 хуже v2?** Вернуться к v2, записать, что изменение не сработало, и пробовать другую правку — по одной. Ухудшение — тоже результат.\n\n### A/B-тест промптов\n\n1. Два промпта (A и B), различаются **одним** элементом.\n2. Одинаковые условия: один сервис, новые чаты.\n3. По 3 запуска (ответы различаются от запуска к запуску).\n4. Оценка по одной рубрике; судья — человек или другая модель.\n5. Побеждает **средний балл, а не лучший ответ**.\n\nПобедитель идёт в библиотеку с пометкой, на чём проверен и какой балл.\n\n**Лайфхаки итераций:** говорите, что оставить («структуру оставь, перепиши вступление»); просите список изменений; возвращайтесь к лучшей версии; после пяти безрезультатных правок — новый чат; нужный балл достигнут — остановитесь.\n\n**Типичные ловушки:** менять несколько вещей сразу; сравнивать разные сервисы и промпты одновременно; оценивать «на глаз»; верить одному запуску.\n\n## Главное\n\n1. Сложную задачу делите на шаги: модель делает часть, человек проверяет между шагами.\n2. Формат задавайте явно: таблица, JSON, разделители между инструкцией и данными.\n3. Удачный промпт — шаблон: храните в библиотеке с переменными и оценкой.\n4. Качество измеряют рубрикой с описанием уровней, а не «нравится — не нравится».\n5. Модель-судья полезна, но предвзята: меняйте ответы местами, решение — за вами.","text":"  Повтор занятия 1\n\n  Модель видит токены, а не буквы, поэтому «посчитай символы» лучше решать кодом или проверять вручную.\n  Минимум промпта: задача, контекст, формат.\n  Уверенный пересказ несуществующего — галлюцинация (здесь — от ложной предпосылки).\n  Температура меняет смелость выбора следующего токена: низкая — предсказуемо, высокая — разнообразно и рискованно.\n\n  Сложные задачи: разбить и связать\n\n  Почему один большой промпт проигрывает\n\nЗапрос «проанализируй рынок кофеен, сравни конкурентов, придумай концепцию, посчитай бюджет и напиши питч» одним сообщением плох:\n\n  модель распределяет внимание на всё сразу;\n  ошибка в начале незаметно портит конец;\n  нельзя проверить промежуточные результаты;\n  длинный ответ трудно править по частям.\n\n Цепочка промптов (prompt chain)  — задача из шагов, где выход одного шага — вход следующего. После каждого шага человек проверяет и правит; ошибка исправляется там, где возникла.\n\n Когда цепочка лишняя:  задача решается за один шаг и легко проверяется целиком (перевести абзац, придумать заголовок). Делить нужно, если в задаче несколько разных действий (найти, сравнить, написать) или промежуточный результат должен проверить человек.\n\n  Декомпозиция (decomposition) — дерево задачи\n\nПример: обзор литературы для курсовой.\n\n1.  Вопрос  — сформулировать исследовательский вопрос и ключевые понятия (человек).\n2.  Поиск  — найти источники в библиотеке и базах самому: без поиска модель их выдумает.\n3.  Конспект  — модель: краткое содержание каждой статьи по шаблону.\n4.  Синтез  — модель: таблица «автор — метод — вывод», общие и спорные места.\n5.  Текст  — черновик обзора, затем ваша редактура и сверка ссылок.\n\n Правило:  модели — то, что можно проверить; человеку — источники, решения и финальный текст.\n\n  Приём «сначала план — потом выполнение»\n\nШаг 1: «Предложи план из 5–6 пунктов с тезисами. Не пиши текст, пока я не отвечу “план утверждён”». Шаг 2: «Пиши по одному пункту и жди команды “дальше”». Правка плана занимает минуту, правка готового текста — полчаса; каждая часть получает всё внимание модели.\n\n  Что показали исследования рассуждения\n\n  Результат   Источник  \n \n  Точность на задаче MultiArith выросла с 17,7% до 78,7% после фразы «Let’s think step by step»   Kojima и др., 2022  \n  На GSM8K: несколько решений и самый частый ответ дали +17,9 п. п.   Wang и др., 2022  \n  8 примеров с рассуждениями — рекорд PaLM 540B на GSM8K   Wei и др., 2022  \n\nВывод: многошаговым задачам нужны промежуточные шаги, несколько попыток повышают надёжность. Но рассуждающим моделям «думай пошагово» не нужно, а само рассуждение не гарантирует верных фактов. (Исследования 2022 года на моделях того времени.)\n\n  Формат ответа\n\n Структурированный ответ — тот, который можно сразу использовать. \n\n  Формат   Зачем  \n \n  Таблица   Сравнить варианты по одинаковым критериям; вставить в Excel; пустая клетка заметна сразу  \n  Список и шаги   Инструкция, план, чек лист; нумерация — когда важен порядок; короткие пункты легче проверять  \n   JSON (JavaScript Object Notation)    Формат «ключ: значение», который читают программы, боты и сервисы автоматизации; поля всегда одни и те же  \n\nФормат задавайте явно: «ответь таблицей со столбцами …», «только JSON без пояснений». Если задать столбцы, таблицы из разных запросов совпадут по структуре.\n\n Как убрать лишнее вступление («Конечно! Вот ваша таблица…»):  скажите прямо и в конце промпта: «Ответь только таблицей. Без вступления, пояснений и выводов». Если не помогает — дайте образец первой строки или попросите JSON. Последняя инструкция в промпте обычно влияет сильнее всего.\n\n Извлечение данных в JSON.  Пример: «Извлеки из объявления поля event, date, place, price. Если поля нет — поставь null. Ответь только JSON». Условие «если нет — null» защищает от выдуманных значений: иначе модель придумает.\n\n  Разделители (delimiters)\n\nБез разделителей модель может принять часть текста за инструкцию (особенно если в тексте есть повелительные фразы). Отделяйте инструкцию от данных:\n\n1. Кавычки и тройные кавычки:  \"\"\" текст \"\"\" .\n2. Теги:  <письмо  … <\/письмо ,  <пример  … <\/пример .\n3. Заголовки:   Задача ,   Данные ,   Формат .\n\nРазделители же защищают от внедрения чужих инструкций (подробнее — занятие 7).\n\n  Куда ставить главное в длинном промпте\n\nИсследование «Lost in the Middle» (Liu и др., 2023): модель лучше использует информацию из  начала и конца  длинного контекста, а середина «проваливается».\n\n  Инструкцию — в начало, ключевой вопрос повторите в конце.\n  Длинный документ — между ними, в разделителях.\n  Не вставляйте 50 страниц ради одного абзаца — дайте нужный фрагмент.\n\n  Чувствительность к мелочам\n\nТолько из за оформления промпта точность LLaMA 2 13B менялась до 76 п. п. (Sclar и др., 2023); порядок примеров меняет результат от почти рекордного до почти случайного (Lu и др., 2022). Выводы: прогоняйте промпт 2–3 раза, перемешивайте примеры разных классов, меняйте одну вещь за раз.\n\n  Шаблоны, мета промптинг, роли, память\n\n  Шаблон промпта\n\nШаблон — промпт, который сработал, с «дырками» для новых данных: постоянная часть + переменные.\n\n  Ты — [РОЛЬ]. Объясни тему «[ТЕМА]» для [АУДИТОРИЯ]. Формат: [ФОРМАТ]. Длина: не больше [ОБЪЁМ]. Приведи один пример из области «[ОБЛАСТЬ]». Если не уверен в факте — так и напиши.\n\nОдин шаблон — десятки задач: меняются только переменные.\n\n  Библиотека промптов\n\nТаблица: название, задача, шаблон, переменные, где работает лучше,  оценка . Без оценки библиотека превращается в свалку. Название — глагол + объект («Объясни тему»). Новая удачная версия — новая строка.\n\n  Мета промптинг (meta prompting)\n\nМодель сама пишет промпт:\n\n1.  Цель  — опишите задачу и результат своими словами.\n2.  Черновик промпта  — модель пишет по шаблону: роль, задача, контекст, формат, ограничения, отмечая в скобках места для вашего заполнения.\n3.  Ваша правка  — уберите лишнее, добавьте то, что знаете только вы.\n4.  Запуск в новом чате  — чистый контекст даёт честную проверку.\n\n  Самосогласованность (self consistency)\n\nЗадайте задачу несколько раз (3 новых чата или «реши тремя способами») и возьмите самый частый ответ. Подходит для расчётов, логики, классификации; для творческих задач разные ответы — норма. Расхождение — сигнал перепроверить вручную (Wang и др., 2022).\n\n  «Автор и критик»\n\n1.  Автор  пишет черновик.\n2.  Критик  по вашим критериям находит 3 главные проблемы с цитатами из текста, не переписывая его.\n3.  Автор  исправляет только эти замечания.\n\nБез критериев критик хвалит; с критериями находит конкретные проблемы.\n\n  Роли\n\nНе «ты — эксперт», а точная позиция, меняющая задачу:\n\n  Роль   Пример   Что даёт  \n \n  Аудитория   «Объясняй, как первокурснику юристу»   Уровень и примеры  \n  Оппонент   «Найди сильнейшие возражения к тезису»   Проверка аргументов  \n  Панель экспертов   «Оцени план глазами маркетолога и юриста»   Разные точки зрения  \n  Интервьюер   «Проведи пробное собеседование»   Диалог вместо лекции  \n  Редактор   «Правь стиль, факты не трогай»   Роль с границей  \n  Ученик   «Спрашивай, где у меня пробелы»   Проверка понимания  \n\n  Откуда модель знает, как себя вести: четыре слоя инструкций\n\n1.  Системная инструкция сервиса  — задаёт разработчик (тон, правила безопасности, инструменты); пользователь её не видит.\n2.  Память и персонализация  — факты о вас из прошлых диалогов и настроек.\n3.  История текущего чата  — пока помещается в контекстное окно.\n4.  Ваш промпт  — последнее сообщение.\n\nНовый чат обнуляет историю, но не системную инструкцию и не память.\n\n  Память\n\nПамять хранит не переписку, а отдельные факты о вас (профессию, интересы, предпочтения). Детали вчерашней задачи туда обычно не попадают. Чтобы продолжить работу, попросите в конце чата  короткое резюме  и вставьте в начало нового.\n\nЛайфхаки: стартовый промпт проекта (задача, команда, формат) — в начало каждого чата; раз в месяц спрашивайте, что модель о вас знает, и удаляйте устаревшее; новая тема — новый чат; чужую задачу решайте без памяти. Не сообщайте документы, пароли, номера карт и данные других людей.\n\n Проекты и пространства (projects)  — папка для чатов одной темы: общая инструкция, загруженные файлы доступны в каждом чате. Нужны для курсовой, длинной задачи, подготовки к экзамену. Если функции нет — стартовый промпт, ключевые файлы в начале чата и резюме прошлого чата дают тот же эффект.\n\n  Что такое хороший ответ: критерии и рубрики\n\n«Оцени ответ от 1 до 10» почти бесполезно: без критериев число ничего не значит, модель не знает, за что снижать балл, и ставит высокие оценки. Два запуска могут дать 7 и 9 за один текст. Работает иначе: 3–5 критериев с описанием уровней 0–1–2, и  сначала обоснование, потом балл .\n\n  Пять измеримых свойств ответа\n\n  Критерий   Смысл  \n \n  Точность   Факты верны, расчёты сходятся, нет выдуманных источников  \n  Полнота   Учтены все части задачи и условия  \n  Соответствие задаче   Ответ на тот вопрос, который задан  \n  Формат   Таблица, длина, структура — как просили  \n  Уместность   Тон и уровень подходят аудитории  \n\nДля каждой задачи выбирайте 3–5 критериев, а не все сразу.\n\n  Рубрика (rubric)\n\n Рубрика  — таблица «критерий × уровень» с описанием каждого уровня; она превращает «нормально» в число.\n\n  Критерий   0 — не выполнено   1 — частично   2 — выполнено  \n \n  Точность   Выдуманный факт или ошибка в расчёте   Мелкие неточности, суть верна   Все факты проверены по источнику  \n  Соответствие задаче   Ответ на другой вопрос   Часть задачи упущена   Все части выполнены  \n  Формат   Не соблюдён   Отклонения: длина, лишний текст   Ровно как задано  \n  Уместность   Не подходит аудитории   Местами сложно или фамильярно   Тон и уровень подходят  \n\nСумма 0–8; версии промпта сравнивают по одной рубрике.\n\n Чек лист или рубрика? \n\n  Чек лист (да/нет)   Рубрика (0/1/2)  \n \n  Быстрая проверка одного ответа   Выбор лучшего промпта, A/B тест, проект  \n  «Есть ли таблица со столбцами X, Y, Z?»   Каждый уровень описан словами, видно, что именно улучшилось  \n\nРубрику можно поручить модели («составь рубрику из 4 критериев с тремя уровнями, критерии проверяемые: не “интересно”, а “есть пример из жизни студентов”»), но обязательно проверьте: можно ли проверить критерий, не споря; нет ли двух критериев про одно; есть ли точность фактов; совпадает ли рубрика с требованиями задания.\n\n  Модель как судья и самопроверка\n\n  Можно ли просить модель проверить факты в её ответе?\n\nМожно, но проверка слабая: выдумав факт, модель часто «подтвердит» его снова. Надёжнее внешняя опора: поиск со ссылкой к каждому факту, загруженный первоисточник или другая модель. Решающая проверка — открыть источник самому.\n\n  Модель судья (LLM as a judge)\n\nОдна модель оценивает ответы другой по рубрике и выдаёт обоснование и вердикт. Сильная модель судья совпадает с оценками людей более чем в 80% случаев — столько же, сколько люди между собой (Zheng и др., 2023, MT Bench). Удобно для быстрых сравнений, окончательное решение — за человеком.\n\n Три искажения судьи: \n\n  Искажение   Суть  \n \n  Позиция   Предпочитает ответ, стоящий первым (или вторым). Когда судьёй был ChatGPT, Vicuna 13B «побеждала» его в 66 из 80 вопросов только за счёт порядка (Wang и др., 2023)  \n  Многословие   Длинный ответ кажется лучше, даже если в нём больше воды  \n  Самолюбование   Выше оценивает ответы, похожие на свои собственные  \n\n Как сделать судью честнее: \n\n1. Меняйте ответы местами (A–B и B–A): разные вердикты — значит, ответы примерно равны.\n2. Сначала обоснование, потом балл: цитата → вывод → балл.\n3. Рубрика с описанием уровней.\n4. Судья — другая модель, не автор.\n5. Скрывайте авторство.\n\n Шаблон судьи:  «Ты — беспристрастный эксперт. Оцени два ответа на одну задачу. Задача/ответ 1/ответ 2/рубрика — в тегах. Для каждого ответа и критерия: цитата → вывод → балл 0, 1 или 2. Не учитывай длину, если её нет в рубрике. В конце: сумма и какой ответ лучше; если равны — так и скажи».\n\n  Самопроверка (self check)\n\n  Находит хорошо   Находит плохо  \n \n  Формат и длину, пропущенные пункты, стиль и повторы   Свои выдуманные факты, ошибки в рассуждении, неверные ссылки  \n\nЧто делать: формат — по чек листу; факты — по источникам; расчёты — кодом. Цикл «черновик → отзыв → правка» ( Self Refine ) дал ≈20 п. п. прироста (Madaan и др., 2023), но самоисправление без внешних данных может вредить (Huang и др., 2023).\n\n  Итерации и A/B тест промптов\n\n Журнал промптов:  версия, что изменил, гипотеза, оценка по рубрике (0–8), вывод.\n\nПример: v1 «Напиши письмо о переносе дедлайна» — 3/8 (нет причины и срока); v2 + адресат, причина, срок, тон — 6/8 (длинно); v3 + не больше 120 слов, одно извинение, структура «просьба — причина — срок» — 8/8.\n\n Правила:  одна правка — одна версия; каждая версия в новом чате и в одном сервисе; одна рубрика для всех версий.\n\n Версия v3 хуже v2?  Вернуться к v2, записать, что изменение не сработало, и пробовать другую правку — по одной. Ухудшение — тоже результат.\n\n  A/B тест промптов\n\n1. Два промпта (A и B), различаются  одним  элементом.\n2. Одинаковые условия: один сервис, новые чаты.\n3. По 3 запуска (ответы различаются от запуска к запуску).\n4. Оценка по одной рубрике; судья — человек или другая модель.\n5. Побеждает  средний балл, а не лучший ответ .\n\nПобедитель идёт в библиотеку с пометкой, на чём проверен и какой балл.\n\n Лайфхаки итераций:  говорите, что оставить («структуру оставь, перепиши вступление»); просите список изменений; возвращайтесь к лучшей версии; после пяти безрезультатных правок — новый чат; нужный балл достигнут — остановитесь.\n\n Типичные ловушки:  менять несколько вещей сразу; сравнивать разные сервисы и промпты одновременно; оценивать «на глаз»; верить одному запуску.\n\n  Главное\n\n1. Сложную задачу делите на шаги: модель делает часть, человек проверяет между шагами.\n2. Формат задавайте явно: таблица, JSON, разделители между инструкцией и данными.\n3. Удачный промпт — шаблон: храните в библиотеке с переменными и оценкой.\n4. Качество измеряют рубрикой с описанием уровней, а не «нравится — не нравится».\n5. Модель судья полезна, но предвзята: меняйте ответы местами, решение — за вами.","id":"prodvinutyj-prompting"},{"n":3,"title":"Тексты и работа с документами","short":"Текстовая задача, редактура и свой голос, правила раскрытия ИИ, конспект и извлечение фактов, RAG, проверка цитат","date":"Пары 5–6","min":15,"theory":"## Повтор занятия 2\n\n- **Разделители** нужны, чтобы модель не путала, где задание, а где материал (например, тройные кавычки вокруг текста).\n- Задача не решается одним промптом → **декомпозиция и цепочка промптов**: каждый шаг проверяется отдельно.\n- **Рубрика** позволяет оценивать и сравнивать ответы по понятным критериям.\n- Правила для всех чатов задают в системных инструкциях или персонализации сервиса.\n\n## Тексты с ИИ\n\n**Тезис:** модель — быстрый соавтор черновика и строгий редактор, но автор и ответственность ваши. **Факты даёте вы, модель отвечает за форму.** Если в промпте нет ваших фактов, модель заполнит пустоту правдоподобными общими словами или выдумает детали.\n\n### Где ИИ ускоряет работу с текстом\n\n| Задача | Что делает | Осторожно |\n|---|---|---|\n| Черновик | Первая версия письма, поста, плана | Общие слова вместо ваших фактов |\n| Структура | План эссе, отчёта, выступления | Логика модели — не ваш аргумент |\n| Сокращение | Ужать текст вдвое | Выпадают оговорки и цифры |\n| Смена стиля | Официальный/разговорный, для эксперта/новичка | Меняется смысл терминов |\n| Перевод | Черновой перевод и локализация | Термины и имена собственные |\n| Вычитка | Опечатки, согласование, повторы | «Исправления» правильного |\n\n### Текстовая задача: жанр → аудитория → цель → формат → материал\n\n1. **Жанр** — письмо, пост, аннотация, план эссе: у каждого свои правила.\n2. **Аудитория** — кто читает, что уже знает, сколько у него времени.\n3. **Цель, призыв, действие** — что читатель должен сделать или понять.\n4. **Формат** — объём, структура, тон, площадка.\n5. **Материал** — ваши факты, цифры, образец текста.\n\nДля текстов чаще всего забывают аудиторию и цель — отсюда «вода». Это частный случай анатомии промпта.\n\n### Жанры\n\n| Жанр | Что обязательно указать | Типичная ошибка модели |\n|---|---|---|\n| Деловое письмо | Адресат, повод, просьба, срок | Многословие, просьба теряется |\n| План эссе | Тезис, позиция, аргументы | Обзор без позиции |\n| Пост | Площадка, длина, призыв | Штампы и «вода» в начале |\n| Аннотация | Цель — метод — результат — вывод | Выводы, которых нет в работе |\n| Резюме и сопроводительное письмо | Вакансия, достижения с цифрами | Выдуманный опыт |\n| Конспект | Цель: экзамен, обзор, решение | Пересказ без иерархии |\n\n**Шаблон делового письма:** «Напиши письмо [АДРЕСАТУ]. Повод: … Контекст: [ФАКТЫ]. Просьба: … Тон: вежливый, деловой. Формат: тема + 5–7 предложений, просьба — во втором абзаце. **Только факты отсюда; чего не хватает — оставь в квадратных скобках.**» Скобки вместо выдумок — защита от придуманных деталей. Чем конкретнее вход, тем меньше правок на выходе: время уходит на проверку, а не переписывание.\n\n### Аудитория\n\nОдна идея — три читателя: школьнику объясняют по аналогии («контрольная с открытым учебником»), одногруппнику — механизм, руководителю — пользу и риск. В промпте: «объясни [КОМУ]: он знает [ЧТО] и хочет [ЧЕГО]».\n\n### Стиль на шкалах\n\nЧисловые шкалы понятнее модели, чем прилагательные: формальность 2 из 5, сложность 3 из 5, эмоциональность 1 из 5, длина фраз до 15 слов. Шкалы можно сохранить в «паспорт стиля» — одна строка вместо абзаца пожеланий.\n\n### Перевод и локализация (localization)\n\n1. **Глоссарий в начале** — термины и нужный перевод («НИУ ВШЭ → HSE University»); модель держит их единообразно. Особенно важно для имён, организаций, юридических терминов. После перевода проверьте термины поиском по документу.\n2. **Локализация, а не перевод** — реалии, валюты, единицы, форматы дат, обращения, понятные читателю примеры.\n3. **Обратный перевод** — переведите результат обратно в новом чате и сравните с исходником: видно, где сдвинулся смысл. Быстрая проверка для языка, который вы знаете плохо.\n\n## Редактура и авторский голос\n\nИИ как редактор полезнее, чем ИИ как автор: вы сохраняете мысль, модель помогает с формой.\n\n### Пять операций редактуры — по одной за раз\n\n1. **Сократить** — убрать повторы и вводные, сохранить цифры и оговорки.\n2. **Упростить** — длинные предложения на два, термины с пояснением.\n3. **Оживить** — канцелярит → глаголы и конкретика.\n4. **Выровнять тон** — один регистр от начала до конца.\n5. **Вычитать** — опечатки, согласование, пунктуация.\n\nШаблон: «Отредактируй текст: только [ОПЕРАЦИЯ]. Не меняй факты, цифры и термины. Покажи правки списком: было → стало → почему». Если попросить всё сразу, модель перепишет текст целиком и потеряет ваш голос.\n\n**Канцелярит (officialese)** — признаки: отглагольные существительные («осуществление», «проведение» → «делать», «провести»); цепочки родительных падежей («повышения эффективности осуществления деятельности»); пустые обороты («в целях», «в рамках», «было принято решение»). Пример: «В целях повышения эффективности… было принято решение о проведении мероприятия» → «Чтобы студентам было проще учиться, мы проведём занятие и покажем, как работают инструменты ИИ».\n\n### Модель плохо считает слова\n\nМодель работает с токенами, а пока пишет текст, не «видит» итоговую длину; поэтому «ровно 150 слов» превращается в 120 или 190. Что делать: просить диапазон («120–150 слов»), задавать структуру («3 абзаца по 2–3 предложения»), проверять счётчиком в редакторе, а лимит символов добирать итерациями.\n\n### Авторский голос\n\n1. Возьмите 2–3 своих текста.\n2. Попросите модель выделить 5–7 признаков вашего стиля.\n3. Отредактируйте описание — это **паспорт стиля (style passport)** — и сохраните в инструкциях или памяти.\n4. Черновик пишете вы; модель — редактор, правит форму, не мысль.\n\nПочему работает: это few-shot для стиля. Ваши тексты — примеры, описание — правило; модель повторяет образец вместо «среднего голоса интернета».\n\n**Промпт «паспорт стиля»:** «Ниже три моих текста. Опиши мой стиль как инструкцию для редактора: 1) длина предложений и абзацев; 2) любимые слова и обороты; 3) чего я избегаю; 4) как начинаю и заканчиваю; 5) формальность по шкале 1–5; 6) три типичные фразы. Не оценивай качество — только опиши». Проверьте описание: узнаёте ли себя; уберите то, что не нравится.\n\n### Признаки «шаблонного» текста\n\nНе «детектор ИИ», а признаки слабого текста — человеческого или машинного; их полезно убирать всегда:\n\n| Признак | Пример |\n|---|---|\n| Пустое начало | «В современном мире…», «Ни для кого не секрет…» — первую фразу можно удалить |\n| Слова-усилители | «ключевой», «играет важную роль» — оценка без фактов |\n| Всё по три | Три пункта, три прилагательных — симметрия вместо мысли |\n| Обобщения | «Многие эксперты считают», «исследования показывают» — кто? какие? |\n| Ровный ритм | Все предложения одного строения — монотонно |\n| Вывод = вступление | Заключение пересказывает начало, нового вывода нет |\n\n**ИИ меняет язык науки.** Исследование Kobak и др. (Science Advances, 2025) по «избыточной лексике»: не менее 13,5% аннотаций биомедицинских статей PubMed за 2024 год обработаны с помощью LLM (до 40% в отдельных группах). Слова-маркеры английского «машинного» стиля: *delve, underscore, pivotal, intricate, realm, meticulous, comprehensive, showcase, additionally/furthermore, testament*. Вывод: «машинный» стиль заметен — его стоит редактировать, а использование ИИ раскрывать.\n\n### Детекторы ИИ-текста\n\nИм нельзя доверять: детектор даёт вероятность, а не доказательство. OpenAI закрыла свой классификатор 20 июля 2023 года: он распознавал лишь 26% ИИ-текстов и ошибочно помечал 9% человеческих. Детекторы в среднем приняли за ИИ 61% эссе людей, для которых английский не родной (Liang и др., 2023). Лучшая защита — честное раскрытие использования ИИ.\n\n## ИИ-текст в учёбе: раскрытие\n\n(Правила НИУ ВШЭ «Правила использования искусственного интеллекта студентами»; в другой организации правила могут отличаться.)\n\n- Общего запрета на генеративные модели нет; допустимость в конкретной работе определяет преподаватель.\n- Если использование разрешено — его **раскрывают**; скрывать нельзя. Использовать ИИ, если преподаватель запретил, нельзя.\n- Раскрытие — не признание вины, а нормальная академическая практика. Если правку опечаток нужно раскрывать, достаточно одной строки: какая модель, какие части, цель.\n\n**Описание применения ИИ — четыре пункта:**\n\n1. **Какие части** — вся работа, разделы или фрагменты.\n2. **Цель и способ** — сгенерировано; сгенерировано и отредактировано; авторский текст с материалами ИИ.\n3. **Какая модель** — название и адрес сайта.\n4. **Насколько помогло** — оценка эффективности.\n\nПример: «Раздел 2: план — GigaChat (giga.chat), текст — автор. Аннотации сокращены в Алисе AI. Две выдуманные моделью статьи исключены».\n\n**Серая зона:**\n\n| Ситуация | Как поступить |\n|---|---|\n| План эссе от ИИ, текст свой | Можно, если нет запрета; раскрыть |\n| Редактура своего текста с ИИ | Можно, если нет запрета; раскрыть |\n| Текст от ИИ сдан как свой | Нарушение академических норм |\n| Перевод статьи для понимания | Можно; цитировать — по оригиналу |\n| Список литературы от ИИ | Только с проверкой каждого источника |\n| ИИ на тесте, где он запрещён | Нарушение |\n\n### Как оценить текст, сделанный с ИИ\n\n1. Факты на месте: все цифры и имена из исходника, ничего не добавлено.\n2. Аудитория узнаёт себя: термины, длина, тон.\n3. Цель достигнута: читатель понимает, что от него нужно.\n4. Нет шаблонов: ни пустых начал, ни слов-усилителей без фактов.\n5. Раскрытие конкретное, 2–3 строки.\n\n**Лайфхаки:** сначала 5–7 тезисов, потом текст; три варианта начала — выбрать лучшее; «строгий рецензент: найди 5 слабых мест»; шкалы стиля; обратный перевод. Цифры и имена сверять, чужие персональные данные не вставлять, цитаты брать из реальных источников, длину проверять счётчиком.\n\n## Работа с документами\n\nС документами модель полезна, если опирается на текст и показывает, где это написано.\n\n### Что умеет ИИ\n\nКонспект (сжать статью до тезисов); ответы на вопросы по тексту (с цитатой и местом); извлечение фактов в таблицу (даты, суммы, условия); сравнение версий (что добавили, что убрали); поиск противоречий (цифры, сроки, формулировки); подготовка карточек «вопрос — ответ».\n\n### Три уровня сжатия конспекта\n\n| Уровень | Что | Объём |\n|---|---|---|\n| Структурный конспект | По разделам, с номерами страниц/пунктов | 1–2 страницы |\n| Тезисы | 5–7 главных утверждений с опорой на раздел | полстраницы |\n| Аннотация | 3 предложения: о чём, что сделано, что следует | абзац |\n\nСжимайте по шагам: каждый следующий уровень делайте из предыдущего, а не из исходника. Сначала просите самый подробный уровень с указанием разделов — сжимать проще, чем «развернуть».\n\n### Конспект зависит от цели\n\n| Цель | Что включать |\n|---|---|\n| Для экзамена | Определения, формулы, примеры, типичные вопросы |\n| Для решения | Выводы, варианты, риски, сроки, стоимость |\n| Для обзора литературы | Вопрос, метод, выборка, результат, ограничения |\n| Для критики | Аргументы автора и слабые места, недостающие данные |\n| Для пересказа коллеге | Пять пунктов: что, почему, что изменится, что делать, где подробнее |\n\nНазовите цель в промпте — модель поймёт, что важно.\n\n### Шаблон: извлечение фактов в таблицу\n\n> Извлеки из документа все [ЧТО] в таблицу: | Факт | Цитата дословно | Раздел или страница |. Правила: только то, что есть в тексте; цитата — точная копия в кавычках; если раздел/страницу не видно — «не указано»; в конце перечисли, что искал, но не нашёл.\n\nЗачем каждое правило: запрет добавлять — защита от галлюцинаций; дословную цитату проверяют поиском Ctrl+F; «не указано» честнее выдуманной страницы; список ненайденного показывает пробелы. Строка «не найдено» — признак хорошего промпта, а не плохой модели; если модель «нашла» сумму, которой нет в документе, — это галлюцинация.\n\n### Длинный документ\n\nПринять файл ≠ одинаково внимательно его прочитать: модели хуже используют середину длинного текста («Lost in the Middle»). Поэтому:\n\n- инструкцию — в начало, ключевой вопрос повторить в конце, после документа;\n- большой файл — по главам, каждая глава отдельным запросом; факты из середины проверять особенно внимательно.\n\n**Документ на 300 страниц:** 1) попросить оглавление (разделы и объём); 2) конспект каждой главы отдельным запросом; 3) свести конспекты в один документ; 4) задавать вопросы к сводке и проверять цитаты в оригинале. Лайфхак: «Чего в этом документе НЕТ из того, что обычно бывает в документах такого типа?» — быстро видны пробелы (например, в договоре нет сроков или ответственности).\n\n## RAG: как ИИ отвечает по вашим файлам\n\n**RAG (Retrieval-Augmented Generation — генерация с опорой на найденные фрагменты)** описана Lewis и др., 2020.\n\n**Подготовка (один раз):** документы (PDF, DOCX, страницы) → фрагменты (от абзаца до страницы) → **индекс** («числовой отпечаток» смысла каждого куска).\n\n**Ответ (каждый раз):** вопрос → поиск 3–5 похожих фрагментов → модель получает вопрос + фрагменты → ответ по фрагментам со ссылками.\n\nОтвет можно проверить, но **ошибка поиска становится ошибкой ответа**.\n\n**Аналогия — экзамен:** без RAG — экзамен по памяти (модель не знает ваших документов, уверенно заполняет пробелы); с RAG — экзамен с учебником (сначала находит нужные страницы, отвечает с опорой, может показать источник), но ошибётся, если открыла не ту страницу или информация на странице неверна.\n\n**Где встречается RAG:** поиск с ответом (ИИ-ответ в поисковике), чат по файлу, режимы «Исследовать»/Deep Research, боты с базой знаний, чат-боты банков и магазинов.\n\n### Что выбрать\n\n| Подход | Когда подходит | Ограничение |\n|---|---|---|\n| Весь документ в чат | Один документ, помещается в контекст | Середина «теряется» |\n| RAG по файлам | Много документов, частые вопросы | Ответ хорош настолько, насколько хорош поиск |\n| Поиск в интернете | Свежие события, общедоступные факты | Разное качество источников — проверка |\n| Без источников | Объяснение понятий, идеи, черновики | Не годится для фактов, цифр, цитат |\n\n### Почему ответы по документам тоже ошибаются\n\n| Ошибка | Что делать |\n|---|---|\n| Не нашёл — нужный фрагмент не попал в поиск, «в документе этого нет» | Переформулировать вопрос словами документа |\n| Нашёл не то — похожий, но другой пункт | Проверять цитату и раздел |\n| Склеил — смешал два фрагмента в «факт» | Просить цитату на каждое утверждение |\n| Источник устарел | Проверять дату и редакцию |\n| Додумал «общеизвестное» поверх текста | Запретить внешние знания |\n\n**Номер страницы** модель генерирует как обычный текст: он может быть правдоподобным, но неверным (при извлечении текста из PDF номера страниц часто теряются). Опирайтесь на дословную цитату: находите её Ctrl+F и по ней устанавливайте страницу.\n\n## Проверка цитат и ссылок\n\n**Ссылка для модели — такой же текст, как всё остальное:** она знает, как выглядит ссылка (фамилии, год, журнал, DOI — Digital Object Identifier, цифровой идентификатор объекта), и собирает правдоподобную на несуществующую статью. По Walters и Wilder (Scientific Reports, 2023): 55% ссылок GPT-3.5 и 18% ссылок GPT-4 были выдуманными, а 43% и 24% реальных ссылок содержали существенные ошибки (цифры для моделей 2023 года; режим поиска снижает риск, но не убирает).\n\n**Мораль примера «юристы и ChatGPT»** (дело Mata v. Avianca, суд Нью-Йорка): модель выдала несуществующие судебные решения, юристы сослались на них; 22 июня 2023 года суд оштрафовал юристов и фирму на 5000 долларов. Модель — не база данных.\n\n**Проверка DOI:** добавьте DOI после адреса `doi.org/`: если открывается другая статья или ничего, ссылка выдумана или искажена; затем сверьте авторов, год, название и найдите цитату в тексте статьи.\n\n### Протокол проверки: четыре шага\n\n1. **Существует?** — по DOI, названию, в каталоге библиотеки.\n2. **Дословно?** — найти цитату поиском Ctrl+F.\n3. **В контексте?** — прочитать абзац до и после: не искажён ли смысл.\n4. **Оформлено?** — автор, год, страница по требованиям работы.\n\n| Что проверяем | Где |\n|---|---|\n| Научная статья | doi.org, eLIBRARY.RU, КиберЛенинка, сайт журнала |\n| Закон | Официальный интернет-портал правовой информации pravo.gov.ru |\n| Статистика | Сайт Росстата или первоисточника данных |\n\n**Таблица проверки:** утверждение модели | цитата найдена дословно? | раздел/страница верны? | вывод (оставить / переписать / удалить). Хороший результат — не «модель нигде не ошиблась», а «все ошибки найдены и исправлены».\n\n### «База знаний» из доступных сервисов\n\n1. Подборка 3–5 проверенных источников по теме.\n2. Каждый источник — в отдельном чате, тезисы с цитатами.\n3. Сводка — один документ со всеми конспектами и ссылками.\n4. Вопросы — новый чат: сводка + правило «Отвечай только по текстам ниже. Каждое утверждение подтверждай цитатой в кавычках и источником [1], [2]. Если ответа нет, напиши: “В источниках этого нет”. Не используй общие знания».\n\n### Карточки для самопроверки\n\n«По конспекту составь 10 карточек: Вопрос — Ответ — Где в конспекте. Вопросы разного типа: определение, пример, сравнение, “почему”. Ответы только из конспекта». Тренировка: закрыть ответы и отвечать вслух; ошибки выписывать и повторять через день; попросить модель спрашивать по одному и оценивать ответы. Проверять карточки нужно по конспекту, а не по памяти модели.\n\n**Ловушка-проверка:** вопрос, ответа на который в документе нет. Честная модель скажет «в документе этого нет».\n\n## Лайфхаки для документов\n\n1. Сначала оглавление — решить, что читать подробно.\n2. Цитаты в кавычках — дословный фрагмент на каждое утверждение.\n3. «Чего здесь нет?» — находит недостающие условия.\n4. Сравнение версий — что добавлено, удалено, изменено.\n5. «Только по тексту» — «нет в документе — так и скажи».\n\nОсторожно: персональные данные и коммерческая тайна не загружаются; номера страниц проверять в оригинале; в сканах цифры сверять; проверять дату и редакцию.\n\n## Главное\n\n1. В тексте факты даёт человек, форму — модель; редактируйте по одной операции за запрос.\n2. Голос сохраняется паспортом стиля; шаблонные признаки убирают всегда.\n3. ИИ раскрывают: какие части, как, какая модель, насколько помогло.\n4. По документам — только дословные цитаты и «не найдено» вместо выдумки; большой файл — по главам.\n5. RAG: ошибка поиска = ошибка ответа; ссылки и цитаты проверяются в первоисточнике.","text":"  Повтор занятия 2\n\n   Разделители  нужны, чтобы модель не путала, где задание, а где материал (например, тройные кавычки вокруг текста).\n  Задача не решается одним промптом →  декомпозиция и цепочка промптов : каждый шаг проверяется отдельно.\n   Рубрика  позволяет оценивать и сравнивать ответы по понятным критериям.\n  Правила для всех чатов задают в системных инструкциях или персонализации сервиса.\n\n  Тексты с ИИ\n\n Тезис:  модель — быстрый соавтор черновика и строгий редактор, но автор и ответственность ваши.  Факты даёте вы, модель отвечает за форму.  Если в промпте нет ваших фактов, модель заполнит пустоту правдоподобными общими словами или выдумает детали.\n\n  Где ИИ ускоряет работу с текстом\n\n  Задача   Что делает   Осторожно  \n \n  Черновик   Первая версия письма, поста, плана   Общие слова вместо ваших фактов  \n  Структура   План эссе, отчёта, выступления   Логика модели — не ваш аргумент  \n  Сокращение   Ужать текст вдвое   Выпадают оговорки и цифры  \n  Смена стиля   Официальный/разговорный, для эксперта/новичка   Меняется смысл терминов  \n  Перевод   Черновой перевод и локализация   Термины и имена собственные  \n  Вычитка   Опечатки, согласование, повторы   «Исправления» правильного  \n\n  Текстовая задача: жанр → аудитория → цель → формат → материал\n\n1.  Жанр  — письмо, пост, аннотация, план эссе: у каждого свои правила.\n2.  Аудитория  — кто читает, что уже знает, сколько у него времени.\n3.  Цель, призыв, действие  — что читатель должен сделать или понять.\n4.  Формат  — объём, структура, тон, площадка.\n5.  Материал  — ваши факты, цифры, образец текста.\n\nДля текстов чаще всего забывают аудиторию и цель — отсюда «вода». Это частный случай анатомии промпта.\n\n  Жанры\n\n  Жанр   Что обязательно указать   Типичная ошибка модели  \n \n  Деловое письмо   Адресат, повод, просьба, срок   Многословие, просьба теряется  \n  План эссе   Тезис, позиция, аргументы   Обзор без позиции  \n  Пост   Площадка, длина, призыв   Штампы и «вода» в начале  \n  Аннотация   Цель — метод — результат — вывод   Выводы, которых нет в работе  \n  Резюме и сопроводительное письмо   Вакансия, достижения с цифрами   Выдуманный опыт  \n  Конспект   Цель: экзамен, обзор, решение   Пересказ без иерархии  \n\n Шаблон делового письма:  «Напиши письмо [АДРЕСАТУ]. Повод: … Контекст: [ФАКТЫ]. Просьба: … Тон: вежливый, деловой. Формат: тема + 5–7 предложений, просьба — во втором абзаце.  Только факты отсюда; чего не хватает — оставь в квадратных скобках. » Скобки вместо выдумок — защита от придуманных деталей. Чем конкретнее вход, тем меньше правок на выходе: время уходит на проверку, а не переписывание.\n\n  Аудитория\n\nОдна идея — три читателя: школьнику объясняют по аналогии («контрольная с открытым учебником»), одногруппнику — механизм, руководителю — пользу и риск. В промпте: «объясни [КОМУ]: он знает [ЧТО] и хочет [ЧЕГО]».\n\n  Стиль на шкалах\n\nЧисловые шкалы понятнее модели, чем прилагательные: формальность 2 из 5, сложность 3 из 5, эмоциональность 1 из 5, длина фраз до 15 слов. Шкалы можно сохранить в «паспорт стиля» — одна строка вместо абзаца пожеланий.\n\n  Перевод и локализация (localization)\n\n1.  Глоссарий в начале  — термины и нужный перевод («НИУ ВШЭ → HSE University»); модель держит их единообразно. Особенно важно для имён, организаций, юридических терминов. После перевода проверьте термины поиском по документу.\n2.  Локализация, а не перевод  — реалии, валюты, единицы, форматы дат, обращения, понятные читателю примеры.\n3.  Обратный перевод  — переведите результат обратно в новом чате и сравните с исходником: видно, где сдвинулся смысл. Быстрая проверка для языка, который вы знаете плохо.\n\n  Редактура и авторский голос\n\nИИ как редактор полезнее, чем ИИ как автор: вы сохраняете мысль, модель помогает с формой.\n\n  Пять операций редактуры — по одной за раз\n\n1.  Сократить  — убрать повторы и вводные, сохранить цифры и оговорки.\n2.  Упростить  — длинные предложения на два, термины с пояснением.\n3.  Оживить  — канцелярит → глаголы и конкретика.\n4.  Выровнять тон  — один регистр от начала до конца.\n5.  Вычитать  — опечатки, согласование, пунктуация.\n\nШаблон: «Отредактируй текст: только [ОПЕРАЦИЯ]. Не меняй факты, цифры и термины. Пока
