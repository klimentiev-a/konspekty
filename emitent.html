<script>
(function(){
"use strict";
var D=null,tab="overview",charts=[];
var TABS=[["overview","Обзор"],["fin","Отчётность"],["debt","Долг и облигации"],["biz","Бизнес и расходы"],["market","Рынок и конкуренты"],["method","Методология и риски"]];
function $(s){return document.querySelector(s)}
var MINUS="−";
function f(n,d){if(n==null||isNaN(n))return "—";d=d==null?1:d;var s=Math.abs(n).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});return (n<0?MINUS:"")+s}
function pc(n,d){return n==null||isNaN(n)?"—":f(n*100,d==null?1:d)+"%"}
function ch(n,d){return n==null||isNaN(n)?"—":(n>0?"+":"")+pc(n,d)}
function x(n,d){return n==null||isNaN(n)?"—":f(n,d==null?2:d)+"×"}
function cl(n){return n==null?"":n<0?"neg":"pos"}
function kpi(l,v,s,c){return '<div class="kpi"><div class="label">'+l+'</div><div class="value '+(c||"")+'">'+v+'</div><div class="sub">'+(s||"")+'</div></div>'}
function panel(h,body,note){return '<div class="panel"><h3>'+h+'</h3>'+(note?'<div class="muted" style="font-size:12.5px;margin:-8px 0 12px">'+note+'</div>':'')+body+'</div>'}
function table(head,rows,hl){return '<div class="tbl-wrap"><table><thead><tr>'+head.map(function(h,i){return '<th class="'+(i?'n':'l')+'">'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){var cls=r.h?' class="h"':'';var c=r.c||r;return '<tr'+cls+'>'+c.map(function(v,i){return '<td class="'+(i?'n':'l')+'">'+v+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function P(k){return D.periods.find(function(p){return p.key===k})}
function calc(p){
 var o={};
 if(p.loan_lt!=null){o.debt=p.loan_lt+p.loan_st+p.lease_lt+p.lease_st;o.nd=o.debt-p.cash-p.st_inv}
 o.m_gross=p.gross/p.revenue;o.m_ebitda=p.ebitda/p.revenue;o.m_net=p.net/p.revenue;
 o.cover=p.ebitda/-p.interest_paid;o.fcf=p.cfo+p.capex;o.capex_rev=-p.capex/p.revenue;
 return o}
function ltm(){var a=P("2025"),h5=P("1H2025"),h6=P("1H2026");return a.ebitda+h6.ebitda-h5.ebitda}

var V={};
V.overview=function(){
 var a=P("2025"),b=P("1H2026"),h=P("1H2025"),c26=calc(b),c25=calc(a),L=ltm(),bonds=D.bonds_at_2026_06_30;
 var red=bonds.rows[0].jun26;
 return '<div class="kpis kpis-4">'
  +kpi("Выручка 1П 2026",f(b.revenue,0)+" млн ₽",ch(b.revenue/h.revenue-1)+" к 1П 2025",cl(b.revenue/h.revenue-1))
  +kpi("EBITDA 1П 2026",f(b.ebitda,0)+" млн ₽","маржа "+pc(c26.m_ebitda)+" · 1П 2025: "+f(h.ebitda,0),"pos")
  +kpi("Чистый убыток 1П 2026",f(b.net,0)+" млн ₽","1П 2025: "+f(h.net,0),"neg")
  +kpi("Чистый долг, 30.06.2026",f(c26.nd/1000,1)+" млрд ₽","на конец 2025: "+f(c25.nd/1000,1))
  +kpi("Net Debt / EBITDA (LTM)",x(c26.nd/L,1),"LTM EBITDA "+f(L/1000,2)+" млрд ₽","neg")
  +kpi("EBITDA / уплаченные проценты",x(c26.cover),"1П 2025: "+x(calc(h).cover)+" · 2025: "+x(c25.cover),"neg")
  +kpi("Свободный поток 1П 2026",f(c26.fcf,0)+" млн ₽","1П 2025: "+f(calc(h).fcf,0),cl(c26.fcf))
  +kpi("Деньги + депозиты",f(b.cash+b.st_inv,0)+" млн ₽","погашение 001Р-02 (июль 2026): "+f(red,0))
  +'</div>'
  +panel("Что происходит",'<ul class="ul">'
   +'<li><b>2025 — провальный год.</b> Выручка '+f(a.revenue,0)+' млн ('+ch(a.revenue/P("2024").revenue-1)+'), EBITDA '+f(a.ebitda,0)+' млн (−41% к '+f(P("2024").ebitda,0)+'), чистый '+(a.net<0?'убыток':'доход')+' '+f(Math.abs(a.net),0)+' млн против прибыли '+f(P("2024").net,0)+' млн в 2024.</li>'
   +'<li><b>2026 — улучшение за счёт затрат.</b> За 1П выручка '+ch(b.revenue/h.revenue-1)+', EBITDA '+ch(b.ebitda/h.ebitda-1,0)+': оплата труда в себестоимости −28%, ремонт −5%, закупок самокатов почти нет (CAPEX '+f(-b.capex,0)+' млн против '+f(-h.capex,0)+').</li>'
   +'<li><b>Долг растёт, ставки высокие.</b> Новые облигации 2026 размещены под 22–22,5%, плюс заём от связанных сторон 873 млн под 21%. Проценты по облигациям 1П — '+f(D.fin_exp_1H["1H2026"][0],0)+' млн при EBITDA '+f(b.ebitda,0)+' млн.</li>'
   +'<li><b>Ликвидность перед погашением.</b> На 30.06 деньги '+f(b.cash,0)+' млн + депозиты '+f(b.st_inv,0)+' млн против выпуска 001Р-02 на '+f(red,0)+' млн (июль 2026): запас создан новыми размещениями.</li>'
   +'<li><b>Латинская Америка</b> даёт '+pc(b.seg.rev_la/b.revenue,0)+' выручки и '+pc(b.seg.ebitda_la/b.ebitda,0)+' EBITDA 1П 2026.</li></ul>')

  +'<div class="src">Источник: консолидированная МСФО ПАО «ВУШ Холдинг» с e-disclosure.ru, раздел «Консолидированная». Обновлено '+D.built+'.</div>';
};
V.fin=function(){
 var ks=["2023","2024","1H2025","2025","1H2026"],ps=ks.map(P),H=["млн ₽"].concat(ps.map(function(p){return p.label}));
 function row(l,fn,h){return {h:h,c:[l].concat(ps.map(function(p){var v=fn(p);return v==null?"—":v}))}}
 function num(k,d){return function(p){return p[k]==null?null:'<span class="'+cl(p[k])+'">'+f(p[k],d==null?0:d)+'</span>'}}
 var pl=[row("Выручка",num("revenue"),1),row("Себестоимость",num("cogs")),row("Валовая прибыль",num("gross"),1),row("Коммерческие и управленческие",num("sga")),row("Прочие доходы",num("other_inc")),row("Прочие расходы",num("other_exp")),row("Операционный результат",num("op"),1),row("Финансовые доходы",num("fin_inc")),row("Финансовые расходы",num("fin_exp")),row("Результат до налога",num("pbt")),row("Чистая прибыль (убыток)",num("net"),1),
  row("EBITDA кикшеринга (скорр.)",num("ebitda"),1),row("Маржа EBITDA",function(p){return pc(p.ebitda/p.revenue)}),row("Амортизация",num("da")),row("Убыток от выбытия ОС",num("disp"))];
 var bs3=["2024","2025","1H2026"].map(P),HB=["30 июня 2026","31 дек. 2025","31 дек. 2024"],g=function(p,k){return p[k]};
 function brow(l,k,h){return {h:h,c:[l].concat([bs3[2],bs3[1],bs3[0]].map(function(p){return f(p[k],0)}))}}
 var bsr=[brow("Основные средства","ppe"),brow("Деньги и эквиваленты","cash"),brow("Краткосрочные вложения (депозиты)","st_inv"),brow("Итого активы","assets",1),brow("Облигации и кредиты, долгосрочные","loan_lt"),brow("Облигации и кредиты, краткосрочные","loan_st"),brow("Аренда, долгосрочная","lease_lt"),brow("Аренда, краткосрочная","lease_st"),brow("Собственный капитал","equity",1)];
 var cfr=[row("Операционный поток",num("cfo"),1),row("Проценты уплаченные",num("interest_paid")),row("Инвестиции в СИМ и ПО (CAPEX)",num("capex")),row("Свободный поток (CFO − CAPEX)",function(p){var v=p.cfo+p.capex;return '<span class="'+cl(v)+'">'+f(v,0)+'</span>'},1)];
 return panel("Отчёт о прибылях и убытках",table(H,pl),"Все цифры — из консолидированной МСФО. Строки «Валовая…», «Операционный…», «до налога» пересчитаны и сходятся с отчётом до нуля.")
  +panel("Баланс",table(["млн ₽"].concat(HB),bsr),"Баланс на 30.06.2025 в использованных отчётах не раскрыт.")
  +panel("Денежные потоки",table(H,cfr))
  +panel("Источники по периодам",'<div class="src">'+D.periods.map(function(p){return '<b>'+p.label+'</b>: '+p.src}).join('<br>')+'<br><a href="'+D.source_page+'" target="_blank" rel="noopener">e-disclosure.ru: консолидированная отчётность ПАО «ВУШ Холдинг»</a></div>');
};
V.debt=function(){
 var b=P("1H2026"),a=P("2025"),c=calc(b),ca=calc(a),B=D.bonds_at_2026_06_30,L=ltm();
 var ladder={"2026":0,"2027":0,"2028":0,"2029":0};
 B.rows.forEach(function(r){var y=(r.maturity.match(/\d{4}/)||[])[0];ladder[y]+=r.jun26});
 var disc=B.fair_value.jun26/B.total.jun26;
 var rows=B.rows.map(function(r){return [r.series,r.coupon,r.maturity,f(r.jun26,0),r.dec25==null?"—":f(r.dec25,0)]});
 rows.push({h:1,c:["Облигации, итого","","",f(B.total.jun26,0),f(B.total.dec25,0)]});
 B.other_debt.forEach(function(o){rows.push([o.name,"","",f(o.jun26,0),f(o.dec25,0)])});

  +'</div>'

   +'<li><b>Рынок оценивает облигации ниже номинала:</b> справедливая стоимость '+f(B.fair_value.jun26,0)+' млн против балансовых '+f(B.total.jun26,0)+' млн.</li>'
   +'<li><b>Покрытие процентов тонкое:</b> EBITDA / уплаченные проценты '+x(c.cover)+' в 1П 2026 (в 2024 — '+x(calc(P("2024")).cover)+'). Выручка 1П сезонно слабая, летом EBITDA выше.</li>'
   +'<li><b>Пик погашений — 2027–2028:</b> '+f(ladder["2027"],0)+' и '+f(ladder["2028"],0)+' млн ₽.</li>'
   +'<li>Выпуск 001Р-08 в отчёте на 30.06.2026 не значится (размещён позже, сверить).</li></ul>');
};

 function seg(p){return [["Россия и СНГ",p.seg.rev_ru,p.seg.ebitda_ru,p.seg.capex_ru],["Латинская Америка",p.seg.rev_la,p.seg.ebitda_la,p.seg.capex_la]]}
 var rows=[];
 [["1П 2026",b],["1П 2025",h],["2025",a],["2024",y]].forEach(function(e){seg(e[1]).forEach(function(s){rows.push([e[0]+" · "+s[0],f(s[1],0),f(s[2],0),pc(s[2]/s[1]),f(s[3],0)])})});
 var cg=D.cogs_1H,sg=D.sga_1H;
 function cmp(lab,A,B){return lab.map(function(l,i){return [l,f(A[i],0),f(B[i],0),'<span class="'+(B[i]-A[i]>0?'neg':'pos')+'">'+(A[i]?f((B[i]/A[i]-1)*100,0)+'%':'—')+'</span>']})}

  +panel("Операционные показатели (пресс-релизы компании, не МСФО)",table(["","1П 2025","1П 2026","9М 2026"],[

 return panel("Операторы",table(["","Whoosh","МТС Юрент","Яндекс Go"],[

 var ks=["2023","2024","1H2025","2025","1H2026"],ps=ks.map(P),cat=ps.map(function(p){return p.label});

 if($("#c2")){var B=D.bonds_at_2026_06_30,ladder={"2026":0,"2027":0,"2028":0,"2029":0};B.rows.forEach(function(r){ladder[(r.maturity.match(/\d{4}/)||[])[0]]+=r.jun26});
  mk("#c2",{grid:{left:48,right:12,top:30,bottom:26},xAxis:Object.assign({type:"category",data:Object.keys(ladder)},ax()),yAxis:Object.assign({type:"value"},ax()),series:[{type:"bar",data:Object.keys(ladder).map(function(k){return Math.round(ladder[k])}),itemStyle:{color:css("--acc")},barMaxWidth:46,label:{show:true,position:"top",color:css("--muted")}}]})}
 if($("#c3")){var ks3=["2024","2025","1H2026"],p3=ks3.map(P),nd=p3.map(function(p){return Math.round(calc(p).nd)}),lv=[calc(P("2024")).nd/P("2024").ebitda,calc(P("2025")).nd/P("2025").ebitda,calc(P("1H2026")).nd/ltm()];

}
