<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>Глубина</title>

<style>
:root{--bg:#050a14;--card:#0c1a2e;--line:#1f3a5c;--tx:#e6f1ff;--mu:#7f9cc0;--pk:#ff4d8d;--cy:#4fd1ff;--gd:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
#sea{position:fixed;inset:0;z-index:0;transition:background 1.6s}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.scan{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.app{position:relative;z-index:2;max-width:620px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.top a,.top button{color:var(--mu);font:inherit;font-size:13px;text-decoration:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.logo{letter-spacing:.3em;font-weight:700;font-size:13px;color:var(--cy)}
.gauge{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--mu);font-size:12px;letter-spacing:.15em}
.gauge .bar{flex:1;height:8px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#07101f}
.gauge .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--pk));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--tx);min-width:7ch;text-align:right}
.card{background:var(--card);border:1px solid var(--line);padding:22px 20px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);box-shadow:0 0 40px rgba(79,209,255,.07)}
.eyebrow{color:var(--pk);letter-spacing:.35em;font-size:12px;margin:0 0 14px;text-transform:uppercase}
h1,h2{margin:0 0 12px;font-size:clamp(26px,7vw,36px);line-height:1.12;font-weight:800;letter-spacing:.01em}
h2{font-size:clamp(22px,6vw,30px)}
.sub{color:var(--mu);font-size:14px;margin:6px 0 0}
.hint{color:var(--mu);font-size:12px;letter-spacing:.18em;margin-top:18px;text-align:center}
form{margin-top:18px;display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--tx);background:#07101f;border:1px solid var(--line);border-radius:6px;padding:12px;outline:none}
input:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(79,209,255,.2)}
.btn{font:inherit;font-weight:700;color:#04101f;background:var(--cy);border:0;border-radius:6px;padding:12px 18px;cursor:pointer;letter-spacing:.05em}
.btn.ghost{background:none;color:var(--cy);border:1px solid var(--cy)}
.btn.pk{background:var(--pk);color:#fff}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.skip{margin-top:10px;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
.res{margin-top:16px;animation:rise .5s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.big{font-size:clamp(34px,10vw,52px);font-weight:800;color:var(--gd);line-height:1}
.tag{display:inline-block;font-size:12px;letter-spacing:.12em;padding:3px 8px;border:1px solid currentColor;border-radius:4px;margin-left:8px;vertical-align:middle}
.t0{color:#7fe3a6}.t1{color:var(--cy)}.t2{color:var(--gd)}.t3{color:var(--pk)}.t4{color:#b58cff}.tx{color:var(--mu)}
.deeper{color:var(--mu);font-size:13px;margin-top:10px}
.deeper b{color:var(--tx);font-weight:600}
.list{margin:16px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.list li span:first-child{color:var(--mu);flex:1;min-width:0;overflow-wrap:anywhere}
.list li b{color:var(--tx)}
.list li em{font-style:normal;color:var(--gd);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}
.stats div{border:1px solid var(--line);padding:10px 4px;border-radius:6px}
.stats b{display:block;font-size:20px;color:var(--tx)}.stats span{font-size:11px;color:var(--mu);letter-spacing:.1em}
.menu{display:grid;gap:10px;margin-top:20px}
.note{margin-top:22px;font-size:12px;color:var(--mu)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

function norm(s){return s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9+#\- ]/g,' ').replace(/\s+/g,' ').trim()}
Q.forEach(function(q){q.map={};q.keys.forEach(function(g,i){g.forEach(function(k){var n=norm(k);if(!(n in q.map))q.map[n]=i})});q.n=q.names.length});
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;var d=[],i,j;for(i=0;i<=a.length;i++){d[i]=[i]}for(j=1;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function find(q,text){var n=norm(text);if(n in q.map)return q.map[n];if(n.length>=5){var best=-1;for(var k in q.map){if(lev(n,k)<=1){best=q.map[k];break}}return best}return -1}
function depthOf(q,i){var t=i/(q.n-1);return Math.round(60+(MAXD-60)*Math.pow(t,.85))}
var TIERS=[[0,'Планктон','t0'],[1500,'Сельдь','t1'],[2500,'Тунец','t1'],[3500,'Кальмар','t2'],[4500,'Удильщик','t3'],[5500,'Гигантский кальмар','t4'],[6500,'Левиафан','t4']];
function tier(d){var t=TIERS[0];TIERS.forEach(function(x){if(d>=x[0])t=x});return t}
function rare(i,n){var t=i/(n-1);return t<.15?['частый','t0']:t<.4?['обычный','t1']:t<.7?['редкий','t2']:t<.9?['очень редкий','t3']:['почти никто','t4']}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){var r=mulberry(seed),a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var DAY0=Date.UTC(2026,9,18);
function dayNo(){return Math.floor((Date.now()-DAY0)/864e5)+1}
function dailySet(day){var d=day-1,cyc=Math.floor(d/4),slot=d%4,idx=Q.map(function(_,i){return i});var p=shuffle(idx,cyc*7919+13);return p.slice(slot*7,slot*7+7)}
function randomSet(){var p=shuffle(Q.map(function(_,i){return i}),Math.floor(Math.random()*1e9));return p.slice(0,7)}
var S;try{S=JSON.parse(localStorage.getItem('deep:v1'))}catch(e){}
S=S||{best:0,played:0,streak:0,last:0,daily:{}};
function save(){try{localStorage.setItem('deep:v1',JSON.stringify(S))}catch(e){}}
var game=null;
function setSea(d){var t=Math.min(1,d/6500),l=Math.round(14-10*t),c='hsl(214,70%,'+l+'%)',c2='hsl(222,70%,'+Math.max(1,l-6)+'%)';$('sea').style.background='linear-gradient(180deg,'+c+' 0%,'+c2+' 100%)'}
function setDepth(d){game&&(game.shown=d);$('gv').textContent=fmt(d)+' м';$('gb').style.width=Math.min(100,d/70)+'%';setSea(d)}
function total(){return game.answers.reduce(function(s,a){return s+a.depth},0)}

function menu(){
  game=null;setDepth(0);var day=dayNo(),done=S.daily[day];
  view.innerHTML='<div class="card"><p class="eyebrow">Ежедневное погружение №'+day+'</p><h1>Как глубоко ты сможешь нырнуть?</h1><p class="sub">7 вопросов. Отвечай как придёт в голову: частые ответы почти не опускают, редкие уводят на дно. Вопросы одинаковые для всех в этот день.</p>'
   +'<div class="menu">'+(done?'<button class="btn" id="seeDaily">Мой результат: '+fmt(done.total)+' м</button>':'<button class="btn" id="goDaily">Погрузиться</button>')+'<button class="btn ghost" id="goFree">Безлимит: случайные вопросы</button></div>'
   +'<p class="note">Как считаются метры: у каждого вопроса есть список ответов от самых частых к самым редким. Чем дальше в списке, тем глубже. Ответа нет в списке: засчитывается '+UNK+' м без проверки. Это не опрос людей, а моя подборка.</p></div>';
  var g;(g=$('goDaily'))&&(g.onclick=function(){start('daily')});(g=$('seeDaily'))&&(g.onclick=function(){game={mode:'daily',day:day,answers:done.answers,set:done.set};finish(true)});$('goFree').onclick=function(){start('free')};
}
function start(mode){var day=dayNo();game={mode:mode,day:day,set:mode==='daily'?dailySet(day):randomSet(),answers:[],cur:0};setDepth(0);ask()}
function ask(){
  var qi=game.set[game.cur],q=Q[qi];setDepth(total());
  view.innerHTML='<div class="card"><p class="eyebrow">Вопрос '+(game.cur+1)+' из 7</p><h2>'+esc(q.q)+'</h2><form id="f" autocomplete="off"><input id="in" type="text" maxlength="40" placeholder="Твой ответ" autocapitalize="sentences" enterkeyhint="go"><button class="btn" type="submit">Нырнуть</button></form><button class="skip" id="sk" type="button">Не знаю (0 м)</button><p class="hint">▼ редкие ответы опускают глубже ▼</p></div>';
  var inp=$('in');setTimeout(function(){inp.focus()},50);
  $('f').onsubmit=function(e){e.preventDefault();var t=inp.value.trim();if(t.length<2){inp.focus();return}answer(t)};
  $('sk').onclick=function(){answer('')};
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function answer(t){
  var qi=game.set[game.cur],q=Q[qi],rank=t?find(q,t):-2,a={q:qi,text:t};
  if(rank>=0){a.rank=rank;a.depth=depthOf(q,rank);a.name=q.names[rank]}else if(rank===-2){a.depth=0}else{a.depth=UNK;a.unk=1}
  game.answers.push(a);var tot=total();
  var inf,cls;
  if(a.unk){inf='нет в моей подборке';cls='tx'}else if(rank===-2){inf='пропуск';cls='tx'}else{var r=rare(rank,q.n);inf=r[0];cls=r[1]}
  var deeper='';if(rank>=0&&rank<q.n-1){var pool=q.names.slice(rank+1),pick=shuffle(pool.map(function(_,i){return i}),Date.now()%1e6).slice(0,3).map(function(i){return pool[i]});deeper='<p class="deeper">Глубже было: <b>'+pick.map(esc).join('</b>, <b>')+'</b></p>'}
  else if(rank===q.n-1)deeper='<p class="deeper">Это самое дно списка. Глубже уже некуда.</p>';
  view.innerHTML='<div class="card"><p class="eyebrow">Вопрос '+(game.cur+1)+' из 7</p><h2>'+esc(q.q)+'</h2><div class="res"><div class="deeper" style="margin:0 0 6px">'+(t?'Твой ответ: <b>'+esc(t)+'</b>':'Ответа нет')+'</div><div><span class="big">+'+fmt(a.depth)+' м</span><span class="tag '+cls+'">'+inf+'</span></div>'+deeper+'<div class="row"><button class="btn" id="nx">'+(game.cur<6?'Дальше':'Результат')+'</button></div></div></div>';
  setDepth(tot);$('nx').onclick=function(){game.cur++;game.cur<7?ask():finish(false)};$('nx').focus();
}
function finish(again){
  var tot=total(),tr=tier(tot);setDepth(tot);
  if(!again){S.played++;if(tot>S.best)S.best=tot;
    if(game.mode==='daily'){S.daily[game.day]={total:tot,answers:game.answers,set:game.set};S.streak=(S.last===game.day-1)?S.streak+1:1;S.last=game.day}save()}
  var list=game.answers.map(function(a,i){var q=Q[a.q];return'<li><span>'+esc(q.q.replace('Назови ',''))+': <b>'+esc(a.text||'—')+'</b></span><em>'+(a.depth?'+'+fmt(a.depth)+' м':'0 м')+'</em></li>'}).join('');
  var sq=game.answers.map(function(a){return a.depth>=700?'🟪':a.depth>=400?'🟥':a.depth>=200?'🟨':a.depth>0?'🟦':'⬛'}).join('');
  var share='Глубина'+(game.mode==='daily'?' №'+game.day:'')+': '+fmt(tot)+' м — '+tr[1]+'\n'+sq;
  view.innerHTML='<div class="card"><p class="eyebrow">Погружение завершено</p><div class="big">'+fmt(tot)+' м</div><p class="sub"><span class="tag '+tr[2]+'" style="margin:0">'+tr[1]+'</span></p><ul class="list">'+list+'</ul><div class="stats"><div><b>'+fmt(S.best)+'</b><span>РЕКОРД</span></div><div><b>'+S.played+'</b><span>НЫРКОВ</span></div><div><b>'+S.streak+'</b><span>ДНЕЙ ПОДРЯД</span></div></div><div class="row"><button class="btn pk" id="sh">Поделиться</button><button class="btn ghost" id="fr">Безлимит</button><button class="btn ghost" id="mn">Меню</button></div><p class="note" id="shn"></p></div>';
  $('sh').onclick=function(){if(navigator.share){navigator.share({text:share}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(share).then(function(){$('shn').textContent='Скопировано.'},function(){$('shn').textContent=share})}else{$('shn').textContent=share}};
  $('fr').onclick=function(){start('free')};$('mn').onclick=menu;
}
$('statsbtn').onclick=function(){alert('Рекорд: '+fmt(S.best)+' м\nНырков: '+S.played+'\nДней подряд: '+S.streak)};
/* пузыри и рыбки */
var cv=$('cv'),cx=cv.getContext('2d'),W,H,B=[],F=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(var i=0;i<40;i++)B.push({x:Math.random(),y:Math.random(),r:1+Math.random()*3,v:.0006+Math.random()*.0016});
for(i=0;i<5;i++)F.push({x:Math.random(),y:.05+Math.random()*.9,s:.00012+Math.random()*.0003,z:6+Math.random()*10,d:Math.random()<.5?1:-1});
function frame(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(120,200,255,.35)';
  B.forEach(function(b){b.y-=b.v;if(b.y<-.02){b.y=1.02;b.x=Math.random()}cx.beginPath();cx.arc(b.x*W,b.y*H,b.r,0,7);cx.fill()});
  cx.fillStyle='rgba(8,20,40,.9)';
  F.forEach(function(f){f.x+=f.s*f.d;if(f.x>1.1)f.x=-.1;if(f.x<-.1)f.x=1.1;var x=f.x*W,y=f.y*H,z=f.z*f.d;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-z*2,y-z*.7);cx.lineTo(x-z*2,y+z*.7);cx.fill();cx.beginPath();cx.ellipse(x+z*.2,y,Math.abs(z)*1.4,Math.abs(z)*.7,0,0,7);cx.fill()});
  requestAnimationFrame(frame)}
setSea(0);menu();
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)frame();
})();
</script></body></html>
