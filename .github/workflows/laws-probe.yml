name: Законы — проба источников
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка доступности
        run: |
          set -x
          for u in \
            "https://ru.wikisource.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=%D0%A3%D0%9A_%D0%A0%D0%A4._%D0%A1%D1%82%D0%B0%D1%82%D1%8C%D1%8F_25&format=json" \
            "https://www.consultant.ru/document/cons_doc_LAW_10699/" \
            "http://www.kremlin.ru/acts/constitution" \
            "http://pravo.gov.ru/proxy/ips/?docbody=&nd=102074279" \
            "https://rulaws.ru/uk/Razdel-II/Glava-5/Statya-25" \
            "https://legalacts.ru/kodeks/UK-RF/obshchaja-chast/razdel-ii/glava-5/statja-25/" \
            "https://pravo.ppt.ru/kodeks/uk" ; do
            echo "== $u"; curl -sL -m 25 -A "Mozilla/5.0" -o /tmp/o.html -w "code=%{http_code} size=%{size_download}\n" "$u"; head -c 400 /tmp/o.html | tr '\n' ' '; echo
          done
