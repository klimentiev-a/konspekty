name: Законы — проба источников
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать
        run: |
          mkdir -p out
          get(){ curl -sL -m 60 -A "Mozilla/5.0" -o "out/$1.html" -w "$1 %{http_code} %{size_download}\n" "$2"; sleep 1; }
          get uk25 "https://www.consultant.ru/document/cons_doc_LAW_10699/bf8c1a879a8344fd5cfc85853f5590cef2af1020/"
          for p in 5142:gk1 9027:gk2 34154:gk3 64629:gk4 34481:upk 34683:tk 8982:sk 33773:zk 51057:zhk 19671:nk1 28165:nk2 39570:gpk 37800:apk 34661:koap; do
            id=${p%%:*}; nm=${p##*:}
            curl -sL -m 60 -A "Mozilla/5.0" "https://www.consultant.ru/document/cons_doc_LAW_$id/" | grep -o -m1 "<title>[^<]*</title>" | sed "s/^/$nm $id /"; sleep 1
          done | tee out/titles.txt
      - name: В ветку laws-raw
        run: |
          cd out && git init -q -b laws-raw && git config user.email a@b && git config user.name bot && git add -A && git commit -qm raw && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" laws-raw
