name: Облигации за 10 лет — история индексов
# Скачивает историю индексов облигаций Мосбиржи (ISS) для вкладки «Риск и доходность»; пишет в ветку bonds10-data одним коммитом.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bonds10_fetch.py out
      - name: Отправить ветку bonds10-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && git init -q -b bonds10-data && git config user.name "hub-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "bonds10: история индексов Мосбиржи"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bonds10-data
