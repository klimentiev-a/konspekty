name: Приложение «Калории» (APK)
on:
  push:
    branches: [main]
    paths: ['android-kalorii/**', 'src/kalorii/**', '.github/workflows/android-kalorii.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Страница из шаблона
        run: python3 src/kalorii/build.py
      - name: Сборка
        run: gradle -p android-kalorii assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - run: cp android-kalorii/app/build/outputs/apk/release/app-release.apk Kalorii.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalorii-apk
          path: Kalorii.apk
      - name: Выпуск (страница Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest не ставим: по «последнему выпуску» проверяет обновления приложение Hub
          gh release create "kalorii-v1.${{ github.run_number }}" Kalorii.apk --title "Калории 1.${{ github.run_number }}" --latest=false --notes "Приложение «Калории»: фото еды или скрин меню, Claude считает калории и БЖУ. Нужен ключ Claude API (вводится в приложении)."
