ability)","d":"Возникают из временных разниц между бухгалтерской и налоговой стоимостью активов и обязательств (разная амортизация, перенесённые убытки, резервы). DTA — налог, который фактически уплачен вперёд или будет сэкономлен позже: он уменьшит будущие платежи. DTL — налог, который отложен и будет уплачен позже. В оценке обычно не считаются долгом, но их движение объясняет разницу между расходом по налогу в P&L и уплаченным налогом."},{"p":["Dual\\-class shares"],"t":"Dual-class shares — Акции двух классов","d":"Акции основателей дают больше голосов, чем обычные. Основатели сохраняют контроль с небольшой долей."},{"p":["Due diligence \\(DD\\)"],"t":"Due diligence (DD) — Комплексная проверка компании","d":"Тщательная проверка компании перед сделкой: покупатель смотрит документы, финансы и риски. Как осмотр квартиры и проверка документов перед покупкой"},{"p":["DuPont"],"t":"DuPont — Разложение ROE (Return on Equity) по Дюпону","d":"ROE делят на три части: маржа, оборачиваемость активов, рычаг. Видно, за счёт чего прибыльность: хорошая маржа, быстрые продажи или долг."},{"p":["EAD"],"t":"EAD — Сумма под риском на момент дефолта (Exposure at Default)","d":"Сумма требований к заёмщику, которая окажется под риском в момент его дефолта: выданный кредит плюс ожидаемая выборка по открытым лимитам. Ожидаемые потери считают как PD × LGD × EAD."},{"p":["EAR","APR"],"t":"EAR / APR — Эффективная и номинальная годовая ставка (EAR — Effective Annual Rate; APR — Annual Percentage Rate)","d":"APR — ставка «по бумагам», без учёта частоты начисления. EAR — реальная годовая с учётом сложного процента."},{"p":["Earn\\-out"],"t":"Earn-out — Отложенная доплата за результат","d":"Часть цены сделки, которую платят позже, если компания достигнет оговорённых результатов. Продавец получает доплату, только если бизнес оправдает его обещания"},{"p":["Earnings surprise"],"t":"Earnings surprise — Сюрприз по прибыли","d":"Разница между фактической прибылью и консенсусом."},{"p":["EBITDA margin"],"t":"EBITDA margin — Маржа EBITDA (EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)","d":"Какая доля выручки превращается в EBITDA. Удобно сравнивать компании одной отрасли."},{"p":["EBITDAR"],"t":"EBITDAR — Прибыль до процентов, налогов, амортизации и аренды (Earnings Before Interest, Taxes, Depreciation, Amortization and Rent)","d":"EBITDA до арендных расходов. Нужна для сравнения компаний, где часть бизнеса арендована, а часть куплена (ритейл, авиа, рестораны)."},{"p":["ECL"],"t":"ECL — Ожидаемые кредитные убытки (Expected Credit Loss)","d":"Ожидаемые кредитные потери, которые банк резервирует по МСФО 9 заранее."},{"p":["ECM"],"t":"ECM — Рынок акционерного капитала (Equity Capital Markets)","d":"Рынок, на котором компании привлекают деньги, продавая свои акции (IPO, SPO). Акция — доля в компании, и тот, кто её купил, становится совладельцем"},{"p":["Economic capital"],"t":"Economic capital — Экономический капитал","d":"Сколько капитала нужно банку по его собственной оценке риска, а не по нормативам."},{"p":["Effective tax rate"],"t":"Effective tax rate — Эффективная ставка налога","d":"Фактически уплаченный налог к прибыли до налога. Отличается от законной ставки из-за льгот и невычитаемых расходов."},{"p":["Efficient frontier"],"t":"Efficient frontier — Эффективная граница","d":"Линия на графике «риск — доходность»: лучшие портфели, где нельзя поднять доходность без роста риска."},{"p":["Efficient market hypothesis"],"t":"Efficient market hypothesis — Гипотеза эффективного рынка","d":"Цены уже учитывают всю доступную информацию, поэтому стабильно обыгрывать рынок нельзя. Три формы: слабая, средняя, сильная."},{"p":["EPS"],"t":"EPS — Прибыль на акцию (Earnings Per Share)","d":"Сколько чистой прибыли приходится на одну акцию. Чистая прибыль — то, что осталось после всех расходов и налогов"},{"p":["Equity"],"t":"Equity — Акционерный капитал / акции","d":"Доля владельцев в компании. Может означать и сам капитал, и ценные бумаги, которые его представляют."},{"p":["Equity method"],"t":"Equity method — Метод долевого участия","d":"Как учитывают долю в компании, где у тебя 20–50% и нет контроля: не складывают её отчёт по строкам, а показывают одну строку «доля в прибыли»."},{"p":["Equity multiplier"],"t":"Equity multiplier — Мультипликатор капитала","d":"Активы к собственному капиталу. Часть разложения Дюпона."},{"p":["Equity Value"],"t":"Equity Value — Стоимость собственного капитала","d":"Стоимость акционерного капитала (для публичной компании — капитализация). Это цена только той части бизнеса, которая принадлежит владельцам, без долга"},{"p":["Equivalent annual annuity"],"t":"Equivalent annual annuity — Эквивалентный годовой аннуитет","d":"Способ сравнить проекты разной длительности: NPV каждого пересчитывают в одинаковый годовой платёж."},{"p":["ERM"],"t":"ERM — Управление рисками компании в целом (Enterprise Risk Management)","d":"Система управления всеми рисками компании целиком, а не по отдельности."},{"p":["Escrow"],"t":"Escrow — Эскроу","d":"Часть цены кладут на специальный счёт у третьей стороны и отдают продавцу позже, если не всплыли проблемы."},{"p":["ESG"],"t":"ESG — Экология, социальная ответственность, корпоративное управление (Environmental, Social, Governance)","d":"Оценка компании по экологии, отношению к людям и качеству управления. Влияет на доступ к деньгам крупных фондов."},{"p":["ETF"],"t":"ETF — Биржевой инвестиционный фонд (Exchange-Traded Fund)","d":"Фонд, чьи паи торгуются на бирже как акции. Обычно повторяет индекс и берёт небольшую комиссию."},{"p":["Eurobond"],"t":"Eurobond — Еврооблигация","d":"Облигация, выпущенная в иностранной валюте за пределами страны, где живёт эмитент."},{"p":["EV to Equity bridge"],"t":"EV to Equity bridge — Мост от EV к стоимости акций (EV — Enterprise Value)","d":"Из стоимости компании вычитают долг и доли меньшинства, прибавляют деньги, получают стоимость акций."},{"p":["EV/EBIT"],"t":"EV/EBIT — Стоимость компании к операционной прибыли (EV — Enterprise Value; EBIT — Earnings Before Interest and Taxes)","d":"Стоимость компании к операционной прибыли. Учитывает амортизацию, поэтому лучше для капиталоёмких отраслей."},{"p":["EV/EBITDA"],"t":"EV/EBITDA — Стоимость компании к EBITDA (EV — Enterprise Value; EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)","d":"Главный мультипликатор оценки: стоимость компании в целом к её EBITDA. Не зависит от долговой нагрузки, поэтому подходит для сравнения."},{"p":["EV/Sales"],"t":"EV/Sales — Стоимость компании к выручке (EV — Enterprise Value)","d":"Стоимость компании к выручке. Используют, когда прибыли ещё нет (быстрорастущие компании)."},{"p":["XLOOKUP"],"t":"Excel: ВПР / XLOOKUP — VLOOKUP / XLOOKUP","d":"Найти значение в таблице по ключу. ПРОСМОТРХ (XLOOKUP) удобнее ВПР: ищет в любую сторону и не ломается от вставки столбцов."},{"p":["БС \\(PV","FV\\)"],"t":"Excel: ПС / БС (PV / FV) — PV — Present Value; FV — Future Value","d":"Приведённая и будущая стоимость."},{"p":["Exchange rate"],"t":"Exchange rate — Валютный курс","d":"Цена одной валюты в другой. Прямая котировка: сколько рублей за доллар."},{"p":["Exclusivity"],"t":"Exclusivity — Эксклюзивность","d":"Продавец обязуется на срок переговоров не вести переговоры с другими покупателями."},{"p":["Exit multiple"],"t":"Exit multiple — Мультипликатор выхода","d":"Мультипликатор, по которому оценивают компанию в последнем году прогноза, чтобы получить терминальную стоимость. Альтернатива модели Гордона."},{"p":["Expected loss"],"t":"Expected loss — Ожидаемые потери","d":"Сколько банк в среднем теряет по кредитам из-за дефолтов."},{"p":["Expected shortfall \\(CVaR\\)"],"t":"Expected shortfall (CVaR) — Ожидаемый дефицит (CVaR — Conditional Value at Risk)","d":"Средний убыток в худших случаях за порогом VaR. Честнее, чем VaR."},{"p":["Expense ratio"],"t":"Expense ratio — Коэффициент расходов","d":"Расходы страховщика на ведение дела к собранным премиям. Вместе с коэффициентом убыточности (loss ratio) даёт комбинированный коэффициент (combined ratio)."},{"p":["Fair value"],"t":"Fair value — Справедливая стоимость","d":"Цена, по которой актив можно продать в обычной сделке между участниками рынка на дату оценки."},{"p":["Fairness opinion"],"t":"Fairness opinion — Заключение о справедливости цены","d":"Письмо банка совету директоров: цена в сделке справедлива с финансовой точки зрения. Защита совета от претензий акционеров."},{"p":["FCF"],"t":"FCF — Свободный денежный поток (Free Cash Flow)","d":"Свободный денежный поток: деньги, которые остаются после операционных расходов, налогов и инвестиций. Это деньги, которые можно свободно потратить: выплатить владельцам или вернуть долг. Оговорка: CFO обычно уже после уплаты процентов, поэтому такой FCF ближе к FCFE (потоку акционерам); поток до выплат кредиторам — это FCFF, см. ниже"},{"p":["FCFE"],"t":"FCFE — Свободный денежный поток акционерам (Free Cash Flow to Equity)","d":"Свободный поток только акционерам (после долга). Дисконтируется по Ke. То есть это деньги, которые могут достаться владельцам, когда кредиторы уже получили своё"},{"p":["FCFF"],"t":"FCFF — Свободный денежный поток компании (Free Cash Flow to Firm)","d":"Свободный поток всем инвесторам (до долга), то есть и кредиторам, и акционерам: EBIT×(1−t) + D&A − CAPEX − ΔNWC. Здесь t — налоговая ставка, ΔNWC — прирост оборотного капитала. Дисконтируется по WACC"},{"p":["Fed funds rate"],"t":"Fed funds rate — Ставка ФРС","d":"Ключевая ставка США: по ней банки одалживают друг другу деньги на ночь."},{"p":["Fee income"],"t":"Fee income — Комиссионный доход","d":"Доход банка не от процентов: комиссии за переводы, карты, обслуживание."},{"p":["FFO"],"t":"FFO — Денежные средства от операций (Funds From Operations)","d":"Денежная прибыль REIT (фонда, который владеет недвижимостью). Сюда не включают бумажное списание стоимости зданий, поэтому цифра ближе к реальным деньгам от аренды"},{"p":["Fiduciary duty"],"t":"Fiduciary duty — Фидуциарная обязанность","d":"Обязанность директоров действовать добросовестно и в интересах компании, а не в своих. В РФ — ст. 53.1 ГК (сверить)."},{"p":["FIFO"],"t":"FIFO — Первым пришёл — первым ушёл (FIFO — First In, First Out)","d":"Способ учёта запасов: при продаже в себестоимость идёт самая ранняя партия. При росте цен прибыль выше, чем по LIFO."},{"p":["Finance lease"],"t":"Finance lease — Финансовая аренда (лизинг)","d":"Аренда, по сути равная покупке в рассрочку: актив числится у арендатора, платежи считаются долгом."},{"p":["Financial DD"],"t":"Financial DD — Финансовая проверка (DD — Due Diligence)","d":"Проверка качества прибыли, долга, оборотного капитала и прогнозов перед сделкой."},{"p":["Financial leverage"],"t":"Financial leverage — Финансовый рычаг","d":"Использование долга. Увеличивает доходность для владельцев при хорошей работе и усиливает потери при плохой. Меряют как активы / капитал (equity multiplier), долг / капитал (D/E) или, в кредитном анализе, ND/EBITDA (см. Leverage)."},{"p":["Fintech"],"t":"Fintech — Финтех","d":"Технологические компании в финансах: платежи, кредиты онлайн, инвестиции через приложения."},{"p":["Fiscal policy"],"t":"Fiscal policy — Бюджетная политика","d":"Налоги и расходы государства. Влияет на экономику через спрос."},{"p":["Fixed charge coverage"],"t":"Fixed charge coverage — Покрытие фиксированных платежей","d":"Покрытие не только процентов, но и аренды и других обязательных платежей."},{"p":["Floater","FRN"],"t":"Floater / FRN — Облигация с плавающим купоном, флоатер (FRN — Floating Rate Note)","d":"Облигация, у которой купон меняется: ключевая ставка или RUONIA (Ruble Overnight Index Average, рублёвая ставка овернайт) плюс постоянный спред. Когда ставки растут, купон растёт, поэтому цена почти не падает. В моделях долг по флоатерам считают как «ставка ЦБ + спред»."},{"p":["Football field"],"t":"Football field — «Футбольное поле»","d":"График на слайде, где полосами показаны диапазоны оценки по разным методам: DCF, мультипликаторы, сделки. Видно, где методы сходятся."},{"p":["Forward rate \\(FX\\)"],"t":"Forward rate (FX) — Форвардный курс (FX — Foreign Exchange)","d":"Курс для обмена в будущем, зафиксированный сегодня. Определяется разницей ставок двух валют."},{"p":["Fundamental analysis"],"t":"Fundamental analysis — Фундаментальный анализ","d":"Оценка бумаги через бизнес: отчётность, отрасль, менеджмент, макро."},{"p":["Future value \\(FV\\)"],"t":"Future value (FV) — Будущая стоимость","d":"Во что превратится сегодняшняя сумма через n периодов под ставку r."},{"p":["FX swap"],"t":"FX swap — Валютный своп (FX — Foreign Exchange)","d":"Обменять валюту сейчас и обязаться обменять обратно позже по оговорённому курсу. Краткосрочное фондирование в валюте."},{"p":["Gamma"],"t":"Gamma — Гамма","d":"Как быстро меняется дельта при движении цены актива."},{"p":["GDP"],"t":"GDP — Валовой внутренний продукт (GDP — Gross Domestic Product)","d":"Стоимость всех товаров и услуг, произведённых в стране за год. Главный показатель размера экономики."},{"p":["Gearing"],"t":"Gearing — Долговая нагрузка (брит.)","d":"Британский термин для долговой нагрузки. Чаще всего — доля чистого долга в сумме чистого долга и капитала; иногда считают как чистый долг / капитал, поэтому определение проверяют в отчёте."},{"p":["GMV"],"t":"GMV — Валовой объём продаж через платформу (Gross Merchandise Value)","d":"Общая сумма всех продаж через платформу (маркетплейс). Это не выручка платформы: ей достаётся только комиссия."},{"p":["Going concern"],"t":"Going concern — Непрерывность деятельности","d":"Допущение, что компания проработает ещё минимум год. Если аудитор сомневается, он пишет об этом в заключении."},{"p":["Goodwill"],"t":"Goodwill — Гудвилл (деловая репутация)","d":"Переплата при покупке компании: на сколько цена покупки больше справедливой стоимости её чистых активов. Например, купили за 150 компанию, чьё имущество за вычетом долгов стоит 100: гудвилл равен 50. Это плата за бренд, клиентов, репутацию"},{"p":["Gordon growth model"],"t":"Gordon growth model — Модель Гордона","d":"Стоимость актива, который приносит поток, растущий вечно с постоянным темпом g. Используют в двух местах: для оценки акции по дивидендам (DDM) и для терминальной стоимости в DCF. Работает только если ставка больше роста."},{"p":["GP","LP"],"t":"GP / LP — Управляющий партнёр / партнёр-инвестор фонда (General / Limited Partner)","d":"GP — управляющий фондом, принимает решения. LP — инвестор, даёт деньги и не управляет."},{"p":["Green bond"],"t":"Green bond — Зелёная облигация","d":"Облигация, деньги от которой идут на экологические проекты."},{"p":["Greenshoe"],"t":"Greenshoe — Опцион доразмещения","d":"Право организатора размещения продать дополнительные акции (до 15%), чтобы удерживать цену на стабильном уровне. Это «запасной» объём: если спрос высокий, продают больше, а если цена падает, организатор выкупает акции и поддерживает цену"},{"p":["Gross margin"],"t":"Gross margin — Валовая маржа","d":"Какая доля выручки остаётся после себестоимости."},{"p":["Gross profit"],"t":"Gross profit — Валовая прибыль","d":"Выручка минус себестоимость. Сколько остаётся на всё остальное: зарплаты, аренду, проценты, налоги."},{"p":["Growing perpetuity"],"t":"Growing perpetuity — Растущий перпетуитет","d":"Платёж, который растёт каждый год на g навсегда. Основа модели Гордона и терминальной стоимости."},{"p":["Growth capex"],"t":"Growth capex — Инвестиции в рост","d":"Траты на расширение: новые заводы, магазины, мощности. Их можно отложить, не ломая текущий бизнес."},{"p":["Growth investing"],"t":"Growth investing — Инвестирование в рост","d":"Покупать быстро растущие компании, даже если мультипликаторы высокие, ожидая, что рост окупит цену."},{"p":["Guidance"],"t":"Guidance — Прогноз компании","d":"Ориентир по выручке и прибыли, который компания сама даёт рынку на год или квартал."},{"p":["Haircut"],"t":"Haircut — Дисконт к стоимости залога; списание части долга","d":"1) Скидка к рыночной стоимости залога или бумаги в сделке: кредитор принимает актив не по полной цене, а с запасом на случай её падения. Например, бумагу за 100 засчитывают как залог на 80. 2) При реструктуризации — списание части долга: кредиторы соглашаются получить меньше номинала"},{"p":["Hard currency"],"t":"Hard currency — Твёрдая валюта","d":"Валюта, которую охотно принимают по всему миру: доллар, евро, франк."},{"p":["Hedge fund"],"t":"Hedge fund — Хедж-фонд","d":"Фонд для квалифицированных инвесторов с широкими стратегиями: шорты, плечо, деривативы. Классическая плата «2 и 20»: 2% от активов за управление и 20% от прибыли (сейчас в среднем ниже)."},{"p":["Hedging"],"t":"Hedging — Хеджирование","d":"Сделка, которая страхует от неприятного движения цены: например, продать фьючерс, чтобы защитить стоимость товара на складе."},{"p":["High yield"],"t":"High yield — Высокодоходные облигации","d":"Облигации компаний с низким рейтингом и высокой ставкой. Иначе «мусорные»."},{"p":["Historical cost"],"t":"Historical cost — Первоначальная стоимость","d":"Актив записан по цене покупки и не пересматривается вверх вместе с рынком (только амортизируется)."},{"p":["Holdback"],"t":"Holdback — Удержание","d":"Покупатель удерживает часть цены на срок, чтобы покрыть возможные претензии. Как эскроу, но без третьей стороны."},{"p":["Holding company"],"t":"Holding company — Холдинг","d":"Компания, владеющая долями в других компаниях и управляющая ими."},{"p":["Hostile takeover"],"t":"Hostile takeover — Недружественное поглощение","d":"Покупатель обращается напрямую к акционерам, минуя совет директоров целевой компании."},{"p":["Hurdle rate"],"t":"Hurdle rate — Барьерная ставка","d":"Минимальная доходность, ниже которой вкладываться не стоит. Для проекта — часто WACC плюс премия: если IRR проекта ниже, проект не берут. В фонде прямых инвестиций — порог доходности для инвесторов (обычно около 8%), после которого управляющий получает carry, см. Preferred return. «Hurdle» значит «барьер»"},{"p":["IAS 17"],"t":"IAS 17 — International Accounting Standard 17 «Leases» (международный стандарт об аренде, до 2019 года)","d":"Старые правила аренды: операционную аренду не показывали в балансе, платежи шли в операционные расходы. После перехода на IFRS 16 (International Financial Reporting Standard 16) компании считают EBITDA «по IAS 17», чтобы сравнивать с прошлыми годами и с теми, кто так считает. Тогда арендные платежи вычитают из EBITDA, а аренду не включают в долг."},{"p":["IC memo"],"t":"IC memo — Записка для инвестиционного комитета (Investment Committee memo)","d":"Документ для инвестиционного комитета фонда: тезис, оценка, риски, доходность."},{"p":["ICR","Interest coverage"],"t":"ICR / Interest coverage — Коэффициент покрытия процентов (Interest Coverage Ratio)","d":"Покрытие процентов: во сколько раз операционная прибыль больше процентов (EBIT / проценты; в кредитном анализе и ковенантах чаще берут EBITDA / проценты, как в главах про долг). Если прибыль 90, а проценты 30, ICR равен 3: денег втрое больше, чем нужно на проценты"},{"p":["Idiosyncratic risk"],"t":"Idiosyncratic risk — Специфический риск","d":"Риск одной компании, который убирается диверсификацией."},{"p":["IFRS","МСФО"],"t":"IFRS / МСФО — Международные стандарты финансовой отчётности (International Financial Reporting Standards)","d":"Международные правила составления финансовой отчётности. Они нужны, чтобы компании из разных стран считали и показывали свои цифры одинаково"},{"p":["IFRS 16"],"t":"IFRS 16 — Стандарт об аренде (IFRS — International Financial Reporting Standards)","d":"По МСФО почти любая аренда показывается в балансе: актив (право пользования) и долг на сумму будущих платежей. Из-за этого у арендаторов выросли EBITDA и долг."},{"p":["IFRS 9 stages","Stage 3 loans"],"t":"IFRS 9 stages / Stage 3 loans — Стадии по МСФО 9 (IFRS — International Financial Reporting Standards)","d":"Кредиты делят на три стадии: 1 — риск с момента выдачи заметно не вырос, резерв на ожидаемые потери за 12 месяцев; 2 — риск значительно вырос, резерв на весь срок кредита; 3 — кредит обесценен (дефолт), по смыслу близко к NPL (Non-Performing Loans, проблемные кредиты). Чем выше стадия, тем больше резерв."},{"p":["Impairment"],"t":"Impairment — Обесценение","d":"Если актив стоит меньше, чем записан в балансе (возмещаемая стоимость ниже балансовой), его списывают до возмещаемой стоимости. Убыток разовый и неденежный: деньги не уходят."},{"p":["Implied multiple"],"t":"Implied multiple — Подразумеваемый мультипликатор","d":"Мультипликатор, который «зашит» в полученной оценке. Помогает проверить DCF: если вышло EV/EBITDA = 30, что-то не так."},{"p":["Implied volatility"],"t":"Implied volatility — Подразумеваемая волатильность","d":"Волатильность, которую «закладывает» рынок в цену опциона. Растёт в страх."},{"p":["Income statement \\(P\\&L\\)"],"t":"Income statement (P&L) — Отчёт о прибылях и убытках (P&L — Profit & Loss)","d":"Показывает за период, сколько компания заработала и потратила: от выручки сверху до чистой прибыли внизу."},{"p":["Incremental cash flow"],"t":"Incremental cash flow — Приростный денежный поток","d":"Только те деньги, которые появятся или исчезнут из-за проекта. Остальное в оценку проекта не входит."},{"p":["Indemnity"],"t":"Indemnity — Возмещение потерь","d":"Обязательство продавца покрыть конкретные убытки покупателя, например по налоговой проверке за прошлые годы. В РФ — ст. 406.1 ГК (сверить)."},{"p":["Independent director"],"t":"Independent director — Независимый директор","d":"Член совета, не связанный с компанией и крупными акционерами. Должен защищать интересы всех акционеров."},{"p":["Index"],"t":"Index — Индекс","d":"Число, показывающее, как ведёт себя группа бумаг. IMOEX — российские акции, S&P 500 — американские."},{"p":["Inflation\\-linked bond"],"t":"Inflation-linked bond — Облигация, привязанная к инфляции","d":"Номинал или купон растёт вместе с инфляцией. Защита от обесценения денег. В России — ОФЗ-ИН."},{"p":["Information ratio"],"t":"Information ratio — Информационный коэффициент","d":"Насколько постоянно управляющий обыгрывает бенчмарк, с учётом отклонения от него."},{"p":["Insider trading"],"t":"Insider trading — Инсайдерская торговля","d":"Сделки с бумагами на основе непубличной информации. Запрещена. В РФ — закон 224-ФЗ (сверить)."},{"p":["Intangible assets"],"t":"Intangible assets — Нематериальные активы","d":"Активы без вещественной формы: патенты, лицензии, бренды, программы, гудвилл."},{"p":["Interchange"],"t":"Interchange — Интерчейндж","d":"Часть комиссии за оплату картой, которую банк магазина платит банку покупателя."},{"p":["Interest expense"],"t":"Interest expense — Процентные расходы","d":"Сколько компания заплатила процентов по своим долгам за период."},{"p":["Interested party transaction"],"t":"Interested party transaction — Сделка с заинтересованностью","d":"Сделка, в которой у директора или крупного акционера есть личный интерес. Нужно раскрытие и, по требованию, одобрение. В РФ — глава XI закона об АО (сверить)."},{"p":["Internal audit"],"t":"Internal audit — Внутренний аудит","d":"Служба внутри компании, проверяющая процессы и контроли. Подчиняется совету, а не менеджменту."},{"p":["Intrinsic value"],"t":"Intrinsic value — Внутренняя стоимость опциона","d":"Сколько опцион стоил бы, если бы его исполнили прямо сейчас."},{"p":["Inventory"],"t":"Inventory — Запасы","d":"Сырьё, незавершёнка и готовая продукция на складе. Пока не продано, лежит в балансе как актив."},{"p":["Inventory turnover"],"t":"Inventory turnover — Оборачиваемость запасов","d":"Сколько раз за год запасы «проходят» через продажи."},{"p":["Investment grade"],"t":"Investment grade — Инвестиционный рейтинг","d":"Рейтинг не ниже BBB− по шкале S&P: считается, что компания скорее вернёт долг. Всё ниже — high yield."},{"p":["IPO"],"t":"IPO — Первичное публичное размещение акций (Initial Public Offering)","d":"Первичное публичное размещение: компания впервые продаёт свои акции на бирже. После этого любой человек может купить долю в такой компании"},{"p":["IRS"],"t":"IRS — Процентный своп (Interest Rate Swap)","d":"Процентный своп: стороны меняются платежами по фиксированной и плавающей ставке на одну и ту же сумму. Применяют, чтобы превратить плавающий долг в фиксированный."},{"p":["J\\-curve"],"t":"J-curve — J-кривая","d":"Доходность фонда в первые годы отрицательна (комиссии, неокупившиеся вложения), потом растёт. График по форме похож на букву J."},{"p":["Joint venture"],"t":"Joint venture — Совместное предприятие","d":"Две компании создают общую, делят расходы, риски и прибыль."},{"p":["Key rate"],"t":"Key rate — Ключевая ставка Банка России","d":"Главная ставка Банка России: по ней он на неделю даёт банкам деньги и принимает их излишки (основные операции РЕПО и депозитные аукционы). От неё зависят ставки по депозитам, кредитам, ОФЗ (облигации федерального займа) и купоны флоатеров. Высокая ставка удорожает долг компаний и снижает оценки в DCF (Discounted Cash Flow)."},{"p":["KYC"],"t":"KYC — «Знай своего клиента», проверка клиента (Know Your Customer)","d":"Процедура проверки клиента банком или брокером: кто он, откуда деньги."},{"p":["LCR"],"t":"LCR — Норматив краткосрочной ликвидности (Liquidity Coverage Ratio)","d":"Хватит ли у банка ликвидных активов, чтобы пережить отток денег за 30 дней. Должен быть не ниже 100%."},{"p":["Legal DD"],"t":"Legal DD — Юридическая проверка (DD — Due Diligence)","d":"Проверка прав на акции и активы, договоров, судов, лицензий, трудовых вопросов."},{"p":["Leverage"],"t":"Leverage — Долговая нагрузка (финансовый рычаг)","d":"Использование долга. В кредитном анализе его обычно измеряют как ND/EBITDA (чистый долг к EBITDA). Долг усиливает и прибыль, и убытки, как рычаг: чем длиннее, тем сильнее эффект. Другие меры рычага — см. Financial leverage"},{"p":["Levered beta"],"t":"Levered beta — Бета с учётом долга","d":"Бета акций компании, как она есть: включает риск самого бизнеса и риск долга."},{"p":["LFL","Same\\-store sales"],"t":"LFL / Same-store sales — Сопоставимые продажи (Like-for-Like)","d":"Рост продаж только в магазинах, которые работали в обоих сравниваемых периодах. Отсекает эффект от новых открытий и показывает, растёт ли сам магазин. Делится на трафик (число покупателей) и средний чек."},{"p":["LGD"],"t":"LGD — Доля потерь при дефолте (Loss Given Default)","d":"Доля потерь при дефолте = 1 − recovery rate. Если кредитор вернул 40% долга, потеря составила 60%"},{"p":["LIFO"],"t":"LIFO — Последним пришёл — первым ушёл (LIFO — Last In, First Out)","d":"Способ учёта: в себестоимость идёт самая свежая партия. Разрешён в US GAAP, запрещён в МСФО."},{"p":["Limit order"],"t":"Limit order — Лимитная заявка","d":"Купить или продать не хуже указанной цены. Может не исполниться, если рынок не дошёл."},{"p":["Liquidation preference"],"t":"Liquidation preference — Приоритет при ликвидации","d":"Право инвестора первым забрать свои деньги (иногда с кратным умножением) при продаже или закрытии компании, до основателей."},{"p":["Liquidity risk"],"t":"Liquidity risk — Риск ликвидности","d":"Не суметь быстро продать актив или найти деньги для платежа."},{"p":["LLCR"],"t":"LLCR — Коэффициент покрытия долга за срок кредита (Loan Life Coverage Ratio)","d":"NPV потоков проекта за срок кредита / остаток долга. Показывает, хватит ли денег проекта, чтобы погасить весь кредит. Если меньше 1, не хватит"},{"p":["Loan loss provision"],"t":"Loan loss provision — Резерв на возможные потери по ссудам","d":"Деньги, которые банк откладывает на случай, что часть кредитов не вернут. Уменьшает прибыль."},{"p":["Loan\\-to\\-deposit"],"t":"Loan-to-deposit — Кредиты к депозитам","d":"Сколько кредитов банк выдал на рубль вкладов. Выше 100% — банк зависит от рыночного фондирования."},{"p":["Lock\\-up"],"t":"Lock-up — Запрет на продажу акций","d":"Запрет продавать свои акции после IPO (обычно 180 дней). Нужен, чтобы владельцы не бросились продавать сразу и не обвалили цену"},{"p":["Locked box"],"t":"Locked box — Фиксированная дата баланса в сделке","d":"Способ определить цену сделки: её фиксируют по балансу на прошлую дату, и дальше цена не пересчитывается. Покупатель знает цену заранее, а продавец обещает, что до закрытия сделки деньги из компании не уйдут"},{"p":["LOI","MoU"],"t":"LOI / MoU — Письмо о намерениях / меморандум (LOI — Letter of Intent; MoU — Memorandum of Understanding)","d":"Предварительный документ с основными условиями. Обычно необязательный, кроме эксклюзивности и конфиденциальности."},{"p":["Long/short equity"],"t":"Long/short equity — Стратегия «лонг / шорт» по акциям","d":"Стратегия хедж-фонда: покупать недооценённые акции, шортить переоценённые."},{"p":["Loss aversion"],"t":"Loss aversion — Неприятие потерь","d":"Потеря ощущается сильнее, чем такая же по размеру прибыль. Из-за этого люди держат убыточные позиции слишком долго."},{"p":["Loss ratio"],"t":"Loss ratio — Коэффициент убыточности","d":"Какую долю премий страховщик выплатил как возмещение."},{"p":["LSE","HKEX","SGX"],"t":"LSE / HKEX / SGX — Лондонская, Гонконгская и Сингапурская биржи (LSE — London Stock Exchange; HKEX — Hong Kong Exchanges and Clearing; SGX — Singapore Exchange)","d":"Биржи Лондона, Гонконга, Сингапура. Российские компании размещали GDR в Лондоне до 2022 года."},{"p":["LTGR","Terminal growth"],"t":"LTGR / Terminal growth — Long-Term Growth Rate (долгосрочный темп роста)","d":"Темп роста денежных потоков после прогнозного периода. Идёт в формулу терминальной стоимости (TV, Terminal Value). Не должен превышать рост экономики в номинальном выражении: иначе компания «съест» всю экономику. Для России обычно близок к долгосрочной инфляции."},{"p":["LTM","TTM","NTM"],"t":"LTM / TTM / NTM — Последние / следующие 12 месяцев (Last / Trailing / Next Twelve Months)","d":"Последние 12 месяцев (LTM, TTM) или следующие 12 месяцев (NTM). Так считают показатели за «скользящий» год, а не за календарный"},{"p":["M\\&A"],"t":"M&A — Слияния и поглощения (Mergers & Acquisitions)","d":"Слияния и поглощения компаний. Слияние — две компании становятся одной, поглощение — одна покупает другую"},{"p":["M2"],"t":"M2 — Денежная масса M2 (Money Supply M2)","d":"Наличные, деньги на счетах и на срочных вкладах. Показывает, сколько денег в экономике. Узкий агрегат M1 — наличные и деньги на текущих счетах, M0 — только наличные."},{"p":["MAC","MAE"],"t":"MAC / MAE — Существенное неблагоприятное изменение / последствие (Material Adverse Change / Effect)","d":"Условие, по которому покупатель может отказаться от сделки, если случится существенное негативное событие. Например, пожар на главном заводе до закрытия сделки"},{"p":["MACD"],"t":"MACD — Схождение-расхождение скользящих средних (Moving Average Convergence Divergence)","d":"Индикатор на разнице двух скользящих средних. Показывает смену тренда."},{"p":["Maintenance capex"],"t":"Maintenance capex — Поддерживающие инвестиции","d":"Деньги, которые надо тратить, чтобы бизнес просто не развалился: ремонт, замена оборудования."},{"p":["Major transaction"],"t":"Major transaction — Крупная сделка","d":"Сделка на 25% и больше балансовых активов. Требует одобрения совета или собрания. В РФ — глава X закона об АО (сверить)."},{"p":["Majority shareholder"],"t":"Majority shareholder — Мажоритарий","d":"Акционер с контрольной долей. В РФ по закону об АО есть пороги прав: 1%, 2%, 10%, 25%, 30%, 50%, 75%, 95% (сверить)."},{"p":["Make\\-whole"],"t":"Make-whole — Компенсация при досрочном погашении","d":"Платёж при досрочном погашении облигации по инициативе эмитента: приведённая стоимость всех оставшихся платежей по ставке госбумаг плюс небольшой спред (но не меньше номинала). Делает досрочный выкуп невыгодным для эмитента."},{"p":["Management fee"],"t":"Management fee — Комиссия за управление","d":"Ежегодная плата фонду за управление деньгами, часто 1,5–2% от капитала. Выплачивается независимо от результата."},{"p":["Mandatory offer"],"t":"Mandatory offer — Обязательное предложение","d":"Кто перешёл порог 30% голосующих акций ПАО, обязан предложить остальным выкупить их акции. В РФ — ст. 84.2 закона об АО (сверить)."},{"p":["Margin call"],"t":"Margin call — Маржин-колл","d":"Требование брокера добавить денег на счёт, когда убытки по позиции с плечом съели обеспечение. Не добавил — позицию закроют принудительно."},{"p":["Marginal tax rate"],"t":"Marginal tax rate — Предельная ставка налога","d":"Ставка на следующий рубль дохода. Для налогового щита важна она."},{"p":["Mark\\-to\\-market"],"t":"Mark-to-market — Переоценка по рынку","d":"Оценка позиции по сегодняшней рыночной цене, а не по цене покупки. Прибыль и убыток видны каждый день."},{"p":["Market maker"],"t":"Market maker — Маркетмейкер","d":"Участник, который постоянно выставляет и цену покупки, и цену продажи, давая рынку ликвидность. Зарабатывает на спреде."},{"p":["Market manipulation"],"t":"Market manipulation — Манипулирование рынком","d":"Искусственное движение цены: ложные заявки, сговор, распространение слухов. Запрещено."},{"p":["Market order"],"t":"Market order — Рыночная заявка","d":"Купить или продать сразу по лучшей доступной цене. Исполнится, но цена может отличаться от ожидаемой."},{"p":["Market risk"],"t":"Market risk — Рыночный риск","d":"Потери от движения цен, ставок, курсов."},{"p":["Materiality"],"t":"Materiality — Существенность","d":"Порог, ниже которого ошибка или событие не меняет решения читателя отчётности. Аудитор проверяет только существенное."},{"p":["Max drawdown"],"t":"Max drawdown — Максимальная просадка","d":"Самое глубокое падение портфеля от пика до дна за период. Показывает, сколько можно потерять в плохой момент."},{"p":["MBO"],"t":"MBO — Выкуп компании менеджментом (Management Buyout)","d":"Выкуп компании самим менеджментом, обычно вместе с фондом и за счёт долга."},{"p":["MBS"],"t":"MBS — Ипотечная облигация, бумага под залог ипотек (Mortgage-Backed Security)","d":"Бумага, обеспеченная пулом ипотечных кредитов."},{"p":["Merger arbitrage"],"t":"Merger arbitrage — Арбитраж слияний","d":"Покупка акций цели по цене чуть ниже цены сделки. Заработок, если сделка закроется, убыток, если сорвётся."},{"p":["Mezzanine"],"t":"Mezzanine — Мезонинное финансирование","d":"Дорогой долг между обычным долгом и акциями. Платят выше, чем по кредитам, зато при банкротстве возвращают позже."},{"p":["Mid\\-year convention"],"t":"Mid-year convention — Допущение о середине года","d":"Денежные потоки приходят равномерно в течение года, поэтому их дисконтируют не на конец года, а на середину. Оценка получается выше."},{"p":["Minority discount"],"t":"Minority discount — Скидка за миноритарность","d":"Доля без контроля стоит дешевле пропорциональной доли компании, потому что владелец не может решать."},{"p":["Minority shareholder"],"t":"Minority shareholder — Миноритарий","d":"Акционер с небольшой долей, без контроля. Защищён законом: право на информацию, выкуп при крупных сделках."},{"p":["MIRR"],"t":"MIRR — Модифицированная внутренняя норма доходности (Modified Internal Rate of Return)","d":"IRR с реалистичным допущением: промежуточные потоки реинвестируют по стоимости капитала, а не по самой IRR."},{"p":["Moat"],"t":"Moat — «Ров»","d":"Устойчивое преимущество, которое защищает бизнес: бренд, сеть, лицензия, низкие затраты. Термин Баффетта."},{"p":["Modified duration"],"t":"Modified duration — Модифицированная дюрация","d":"Приблизительно на сколько процентов изменится цена облигации при изменении доходности на 1 п. п."},{"p":["MoM","MOIC"],"t":"MoM / MOIC — Кратность возврата вложенных денег (Multiple of Money / Multiple on Invested Capital)","d":"Во сколько раз выросли вложенные деньги. Вложили 100, получили 250: MoM равен 2,5×"},{"p":["Momentum"],"t":"Momentum — Моментум","d":"Стратегия: покупать то, что росло недавно, продавать то, что падало. Работает до разворота."},{"p":["Monetary policy"],"t":"Monetary policy — Денежно-кредитная политика","d":"Действия центробанка по ставке и количеству денег, чтобы держать инфляцию в цели и поддерживать экономику."},{"p":["Monte Carlo"],"t":"Monte Carlo — Метод Монте-Карло","d":"Тысячи прогонов модели со случайными значениями вводных. На выходе не одно число, а распределение результатов."},{"p":["Moving average"],"t":"Moving average — Скользящая средняя","d":"Средняя цена за последние N дней. Сглаживает график, показывает тренд."},{"p":["MRR"],"t":"MRR — Ежемесячная повторяющаяся выручка (Monthly Recurring Revenue)","d":"Ежемесячная повторяющаяся выручка от подписок. Годовая версия — ARR."},{"p":["Mutual fund"],"t":"Mutual fund — Паевой фонд (ПИФ)","d":"Фонд, где деньги многих инвесторов объединены и управляются управляющей компанией. Пай можно купить и погасить по цене, зависящей от стоимости активов."},{"p":["NASDAQ","NYSE"],"t":"NASDAQ / NYSE — Биржа NASDAQ и Нью-Йоркская фондовая биржа (NASDAQ — National Association of Securities Dealers Automated Quotations; NYSE — New York Stock Exchange)","d":"Две главные биржи США. NYSE — старейшая, NASDAQ — технологические компании."},{"p":["Natural hedge"],"t":"Natural hedge — Естественный хедж","d":"Защита от валютного риска без деривативов: выручка и расходы в одной валюте."},{"p":["NAV"],"t":"NAV — Стоимость чистых активов, СЧА (Net Asset Value)","d":"Стоимость чистых активов: что останется, если из имущества вычесть долги. Как стоимость квартиры за вычетом остатка ипотеки"},{"p":["NBO","BO"],"t":"NBO / BO — Необязывающее / обязывающее предложение (Non-Binding / Binding Offer)","d":"Предложение о покупке: необязывающее (NBO) или обязывающее (BO). Необязывающее — это «пока намерение», от него можно отказаться. Обязывающее — это уже обещание, за отказ от которого могут быть последствия"},{"p":["NCI"],"t":"NCI — Неконтролирующие доли, доли меньшинства (Non-Controlling Interest)","d":"Доли меньшинства: часть дочерней компании, которая принадлежит другим владельцам, а не материнской компании. Например, материнская компания владеет 80% дочерней, а остальные 20% — это NCI"},{"p":["NDA"],"t":"NDA — Соглашение о неразглашении (Non-Disclosure Agreement)","d":"Соглашение о конфиденциальности: стороны обещают не раскрывать полученные сведения. Его подписывают до того, как покупатель увидит внутренние данные компании"},{"p":["NDF"],"t":"NDF — Беспоставочный форвард (Non-Deliverable Forward)","d":"Форвард без поставки валюты: стороны платят только разницу курсов. Для валют с ограничениями, в том числе рубля на внешнем рынке."},{"p":["Net Debt"],"t":"Net Debt — Чистый долг","d":"Чистый долг = Долг − Денежные средства. Если у тебя долг 100 и 30 на счёте, то чистый долг равен 70: на столько ты реально должен"},{"p":["Net debt incl\\. leases"],"t":"Net debt incl. leases — Чистый долг с арендой (Net Debt — чистый долг)","d":"Чистый долг плюс обязательства по аренде. Нужен при оценке по IFRS 16 (International Financial Reporting Standard 16): аренда там долг, значит и в мост от EV (Enterprise Value) к стоимости акций её надо вычесть. При оценке по IAS 17 аренду в долг не включают."},{"p":["Net interest income"],"t":"Net interest income — Чистый процентный доход","d":"Проценты, которые банк получил по кредитам, минус проценты, которые заплатил по вкладам."},{"p":["Net margin"],"t":"Net margin — Чистая маржа","d":"Какая доля выручки доходит до чистой прибыли."},{"p":["Network effect"],"t":"Network effect — Сетевой эффект","d":"Чем больше пользователей, тем полезнее продукт каждому. Создаёт защиту от конкурентов."},{"p":["NIM"],"t":"NIM — Чистая процентная маржа (Net Interest Margin)","d":"Чистая процентная маржа банка: «наценка» банка на разнице между ставками по кредитам и по депозитам. Банк платит вкладчикам 8%, берёт с заёмщиков 12%, и разница в 4% — его маржа"},{"p":["NOI"],"t":"NOI — Чистый операционный доход объекта недвижимости (Net Operating Income)","d":"Чистый операционный доход объекта: аренда минус расходы на содержание, без процентов и амортизации."},{"p":["Non\\-cash items"],"t":"Non-cash items — Неденежные статьи","d":"Расходы и доходы, которые не двигают деньги: амортизация, обесценение, переоценка, опционы сотрудникам."},{"p":["Non\\-compete"],"t":"Non-compete — Запрет конкуренции","d":"Продавец обязуется несколько лет не создавать конкурирующий бизнес и не переманивать сотрудников."},{"p":["Non\\-core assets"],"t":"Non-core assets — Непрофильные активы","d":"Активы, которые не участвуют в основном бизнесе и не дают денег в FCFF (Free Cash Flow to Firm): инвестиционная недвижимость, доли в других компаниях, займы связанным сторонам. Их оценивают отдельно и прибавляют в мосте от EV (Enterprise Value) к стоимости акций."},{"p":["Non\\-recourse"],"t":"Non-recourse — Без регресса","d":"Кредит, который проект гасит только за счёт своих денег. Если проект не выручил, банк не требует остальное с владельцев."},{"p":["NOPAT"],"t":"NOPAT — Операционная прибыль после налогов (Net Operating Profit After Tax)","d":"Операционная прибыль после налога: EBIT × (1 − t). Здесь t — налоговая ставка. Показывает, сколько останется от прибыли основной работы после уплаты налога, если бы долга не было"},{"p":["Normalization"],"t":"Normalization — Нормализация","d":"Очистка показателя от разовых и нетипичных статей, чтобы видеть устойчивый уровень."},{"p":["Notes to accounts"],"t":"Notes to accounts — Примечания к отчётности","d":"Самая содержательная часть отчёта: учётная политика, разбивка долга, аренда, риски, сделки со связанными сторонами."},{"p":["NPL"],"t":"NPL — Проблемные (неработающие) кредиты (Non-Performing Loans)","d":"Проблемные кредиты: те, по которым заёмщик перестал платить. Обычно так называют кредиты с просрочкой больше 90 дней"},{"p":["NSFR"],"t":"NSFR — Норматив чистого стабильного фондирования (Net Stable Funding Ratio)","d":"Достаточно ли у банка устойчивых источников денег (долгие вклады, капитал) относительно долгих активов. Не ниже 100%."},{"p":["NWC"],"t":"NWC — Чистый оборотный капитал (Net Working Capital)","d":"Чистый оборотный капитал: деньги, которые «застряли» в повседневной работе (запасы и долги клиентов минус долги перед поставщиками). Это деньги, которыми компания «кредитует» собственный бизнес"},{"p":["NWC peg","WC peg"],"t":"NWC peg / WC peg — Целевой оборотный капитал (NWC — Net Working Capital; WC — Working Capital)","d":"Нормальный уровень оборотного капитала, зафиксированный в договоре сделки. Если на дату закрытия оборотный капитал меньше нормы, цену снижают, если больше — повышают"},{"p":["OAS"],"t":"OAS — Спред с поправкой на опцион (Option-Adjusted Spread)","d":"Спред облигации с учётом встроенных опционов (например, права досрочного погашения)."},{"p":["Off\\-balance sheet"],"t":"Off-balance sheet — Внебалансовые статьи","d":"Обязательства или активы, которых нет в самом балансе, но они влияют на компанию: гарантии, часть аренды, SPV."},{"p":["Offshore"],"t":"Offshore — Офшор","d":"Юрисдикция с низкими налогами и закрытой информацией о владельцах. Кипр, Британские Виргинские острова, Каймановы острова."},{"p":["OID"],"t":"OID — Дисконт при выпуске долга (Original Issue Discount)","d":"Скидка к номиналу при выдаче долга. Добавляет доходность кредитору."},{"p":["One\\-off items"],"t":"One-off items — Разовые статьи","d":"Расходы и доходы, которые не повторятся: продажа актива, штраф, реструктуризация."},{"p":["Operating income"],"t":"Operating income — Операционная прибыль","d":"То же, что EBIT: прибыль от основной деятельности до процентов и налогов."},{"p":["Operating lease"],"t":"Operating lease — Операционная аренда","d":"Аренда, при которой актив возвращают владельцу. По старым правилам платежи шли в расходы; по IFRS 16 почти любая аренда стала долгом."},{"p":["Operating leverage"],"t":"Operating leverage — Операционный рычаг","d":"Чем больше у бизнеса постоянных расходов, тем сильнее прибыль растёт при росте выручки и тем сильнее падает при снижении."},{"p":["Operating margin"],"t":"Operating margin — Операционная маржа","d":"Доля выручки, которая остаётся после всех операционных расходов, до процентов и налогов."},{"p":["Operational risk"],"t":"Operational risk — Операционный риск","d":"Потери из-за ошибок людей, систем, процессов или мошенничества."},{"p":["OPEX"],"t":"OPEX — Операционные расходы (Operating Expenses)","d":"Операционные расходы: траты на повседневную работу. Зарплаты, аренда, электричество, реклама"},{"p":["Opportunity cost"],"t":"Opportunity cost — Альтернативные издержки","d":"Что ты теряешь, выбирая этот вариант вместо лучшего из остальных. Ставка дисконтирования — это альтернативные издержки капитала."},{"p":["Option premium"],"t":"Option premium — Премия по опциону","d":"Цена самого опциона: деньги, которые покупатель платит продавцу за право."},{"p":["Order book"],"t":"Order book — Книга заявок, «стакан» (market depth)","d":"Таблица всех заявок на покупку и продажу с ценами и объёмами (глубина рынка)."},{"p":["Organic growth"],"t":"Organic growth — Органический рост","d":"Рост бизнеса без покупок других компаний."},{"p":["OTC"],"t":"OTC — Внебиржевой рынок (Over-the-Counter)","d":"Внебиржевой рынок: стороны договариваются напрямую, без общего стакана."},{"p":["Output gap"],"t":"Output gap — Разрыв выпуска","d":"Разница между фактическим ВВП и тем, что экономика может выдать без перегрева."},{"p":["Oversubscription"],"t":"Oversubscription — Переподписка","d":"Заявок на IPO больше, чем бумаг. Бумаги делят между инвесторами пропорционально."},{"p":["P/B"],"t":"P/B — Цена к балансовой стоимости капитала (Price to Book)","d":"Капитализация / балансовый собственный капитал. Главный мультипликатор для банков. Показывает, во сколько раз рынок оценивает компанию дороже, чем стоят её собственные деньги по балансу"},{"p":["P/FFO"],"t":"P/FFO — Цена к FFO, денежным средствам от операций (Price to Funds From Operations)","d":"Цена к денежному потоку от операций, мультипликатор для REIT и недвижимости."},{"p":["P/S"],"t":"P/S — Цена к выручке (Price to Sales)","d":"Капитализация / выручка. Подходит для убыточных и быстрорастущих компаний. Выручка — все деньги от продаж, до вычета расходов. Прибыли у таких компаний ещё нет, поэтому сравнивают по выручке"},{"p":["Par","Premium","Discount"],"t":"Par / Premium / Discount — По номиналу / с премией / с дисконтом","d":"Цена облигации: равна номиналу (par), выше (premium) или ниже (discount)."},{"p":["Payback"],"t":"Payback — Срок окупаемости","d":"Срок окупаемости: за сколько времени вложения вернутся. Потратил 100 и получаешь по 25 в год: окупишься за 4 года"},{"p":["Payback \\(CAC\\)"],"t":"Payback (CAC) — Срок окупаемости клиента (CAC — Customer Acquisition Cost)","d":"За сколько месяцев маржа от клиента вернёт стоимость его привлечения."},{"p":["Payment system"],"t":"Payment system — Платёжная система","d":"Инфраструктура для переводов между банками: Visa, Mastercard, Мир, СБП."},{"p":["Payout ratio"],"t":"Payout ratio — Коэффициент выплат","d":"Какую часть чистой прибыли компания отдаёт в виде дивидендов."},{"p":["PD"],"t":"PD — Вероятность дефолта (Probability of Default)","d":"Вероятность того, что заёмщик не вернёт долг за период."},{"p":["PE \\(Private Equity\\)"],"t":"PE (Private Equity) — Прямые инвестиции","d":"Фонды прямых инвестиций: они покупают компании, чтобы развить их и потом продать дороже. Похоже на покупку старой квартиры, ремонт и перепродажу, но с целыми компаниями"},{"p":["Pecking order"],"t":"Pecking order — Иерархия источников","d":"Компании сначала используют собственную прибыль, потом долг, и только в последнюю очередь выпускают акции."},{"p":["PEG"],"t":"PEG — P/E с поправкой на рост (Price/Earnings to Growth)","d":"P/E, делённый на темп роста EPS. Помогает понять, не переплачиваешь ли за быстрый рост. Меньше — лучше"},{"p":["Percentage of completion"],"t":"Percentage of completion — Метод по мере готовности","d":"Выручку по длинному контракту признают пропорционально выполненной части, а не в конце."},{"p":["Percentile","Quartile"],"t":"Percentile / Quartile — Перцентиль / квартиль","d":"Значение, ниже которого лежит заданная доля данных. 25-й перцентиль (первый квартиль) — ниже него четверть значений, 75-й — три четверти. В таблице аналогов диапазон от 25-го до 75-го отсекает выбросы, а медиана — это 50-й перцентиль."},{"p":["Perpetual bond"],"t":"Perpetual bond — Вечная облигация","d":"Облигация без срока погашения: проценты платят бесконечно."},{"p":["Perpetuity"],"t":"Perpetuity — Перпетуитет (бессрочная рента)","d":"Одинаковый платёж навсегда. Его сегодняшняя стоимость конечна."},{"p":["Phillips curve"],"t":"Phillips curve — Кривая Филлипса","d":"Зависимость между безработицей и инфляцией: чем ниже безработица, тем выше инфляция."},{"p":["PI"],"t":"PI — Индекс прибыльности (Profitability Index)","d":"Индекс прибыльности: PV потоков / инвестиции. PV — сегодняшняя стоимость будущих денег. Если индекс больше 1, проект окупается и приносит прибыль"},{"p":["PIK"],"t":"PIK — Проценты, выплачиваемые наращением долга (Payment-in-Kind)","d":"Проценты, которые не выплачивают, а прибавляют к сумме долга. Сейчас платить легче, но долг растёт: на следующий год проценты начислят уже на большую сумму"},{"p":["PMI"],"t":"PMI — Индекс деловой активности менеджеров по закупкам (Purchasing Managers' Index)","d":"Опрос менеджеров по закупкам. Выше 50 — деловая активность растёт, ниже — падает."},{"p":["PP\\&E"],"t":"PP&E — Основные средства (PP&E — Property, Plant & Equipment)","d":"Здания, станки, оборудование, транспорт: всё, что служит больше года и не продаётся."},{"p":["PPA"],"t":"PPA — Договор на покупку электроэнергии (Power Purchase Agreement)","d":"Долгосрочный договор на покупку электроэнергии по фиксированной цене. Гарантирует выручку проекту."},{"p":["Pre\\-IPO"],"t":"Pre-IPO — Инвестиции до IPO (IPO — Initial Public Offering)","d":"Покупка акций частной компании незадолго до выхода на биржу, обычно со скидкой и с риском, что IPO не будет."},{"p":["Pre\\-money","Post\\-money"],"t":"Pre-money / Post-money — Оценка до / после вложения","d":"Оценка компании до вложения инвестора и после. После = До + Сумма инвестиции."},{"p":["Pre\\-pack"],"t":"Pre-pack — Заранее согласованное банкротство","d":"План реструктуризации согласован с кредиторами до подачи в суд, процедура проходит быстро."},{"p":["Precedent transactions"],"t":"Precedent transactions — Сделки-аналоги","d":"Сделки-аналоги: мультипликаторы, по которым прошли прошлые сделки M&A. Как узнать цену квартиры по тому, за сколько недавно продали похожие в этом доме"},{"p":["Preferred return"],"t":"Preferred return — Приоритетная доходность","d":"Минимальная доходность, которую фонд должен принести инвесторам, прежде чем управляющий возьмёт свой carry."},{"p":["Preferred stock"],"t":"Preferred stock — Привилегированные акции","d":"Акции, по которым дивиденд обычно фиксирован и платится раньше, чем по обычным, но права голоса, как правило, нет."},{"p":["Prepaid expenses"],"t":"Prepaid expenses — Расходы будущих периодов","d":"Оплаченное вперёд (страховка, аренда, подписка), что компания получит позже. До использования лежит в активе, по мере использования уходит в расходы."},{"p":["Present value \\(PV\\)"],"t":"Present value (PV) — Приведённая стоимость","d":"Сколько будущая сумма стоит сегодня, если её «уценить» по ставке."},{"p":["Pricing power"],"t":"Pricing power — Ценовая власть","d":"Способность поднимать цены без потери клиентов."},{"p":["Primary","Secondary market"],"t":"Primary / Secondary market — Первичный / вторичный рынок","d":"На первичном бумаги продаёт сам эмитент (деньги идут компании). На вторичном инвесторы продают их друг другу."},{"p":["Private banking"],"t":"Private banking — Частное банковское обслуживание","d":"Банковское обслуживание состоятельных клиентов с персональным менеджером."},{"p":["Pro forma"],"t":"Pro forma — Проформа","d":"Отчётность «как если бы»: как выглядела бы компания после сделки или события."},{"p":["Prospect theory"],"t":"Prospect theory — Теория перспектив","d":"Модель Канемана и Тверски: люди оценивают выигрыши и потери относительно точки отсчёта и боятся потерь сильнее."},{"p":["Prospectus"],"t":"Prospectus — Проспект эмиссии","d":"Документ с описанием компании и рисков, который выдают инвесторам перед размещением."},{"p":["Provision"],"t":"Provision — Резерв (оценочное обязательство)","d":"Расход, который компания записывает заранее, потому что почти уверена, что заплатит: например, по судебному иску."},{"p":["Purchasing power parity"],"t":"Purchasing power parity — Паритет покупательной способности","d":"Идея, что одна и та же корзина должна стоить одинаково в разных странах по обменному курсу. Если не стоит, валюта недо- или переоценена."},{"p":["Put"],"t":"Put / Call option (доли) — Опцион на долю","d":"Право продать (пут) или купить (колл) долю партнёра по заранее оговорённой цене при наступлении условий."},{"p":["Put option"],"t":"Put option — Опцион пут","d":"Право, но не обязанность продать актив по цене страйк. Выигрыш при падении цены, поэтому его используют как страховку."},{"p":["QE","QT"],"t":"QE / QT — Количественное смягчение / ужесточение (QE — Quantitative Easing; QT — Quantitative Tightening)","d":"QE — центробанк печатает деньги и покупает бумаги, чтобы снизить ставки. QT — наоборот, сокращает баланс."},{"p":["Quality of earnings"],"t":"Quality of earnings — Качество прибыли","d":"Насколько прибыль подкреплена деньгами и повторяема. Высокое качество: прибыль похожа на операционный денежный поток."},{"p":["Quick ratio"],"t":"Quick ratio — Коэффициент быстрой ликвидности","d":"Как текущая ликвидность (current ratio), но без запасов: их не всегда быстро продать."},{"p":["R\\&D capitalization"],"t":"R&D capitalization — Капитализация НИОКР (R&D — Research & Development)","d":"Расходы на разработку признают активом, если продукт точно будет. Исследования всегда идут в расходы."},{"p":["RAB"],"t":"RAB — Регулируемая база активов (Regulatory Asset Base)","d":"Регулируемая база активов: стоимость имущества (сетей, инфраструктуры), на которую государство разрешает получать доходность. На ней строится RAB-регулирование: тариф считают так, чтобы владелец возвращал вложенный капитал через амортизацию и получал на него разумную доходность. Применяют в электросетях и другой инфраструктуре"},{"p":["Ramp\\-up"],"t":"Ramp-up — Выход на плановую мощность","d":"Новый магазин, завод или проект не сразу даёт зрелую выручку. В первый год это, например, 60% от выручки уже работающего магазина, дальше доля растёт. Без учёта ramp-up прогноз завышает выручку от новых открытий."},{"p":["Random walk"],"t":"Random walk — Случайное блуждание","d":"Идея, что движения цен непредсказуемы: завтрашнее изменение не зависит от вчерашнего."},{"p":["RAROC"],"t":"RAROC — Доходность капитала с поправкой на риск (Risk-Adjusted Return on Capital)","d":"Прибыль банка к капиталу, выделенному под риск. Показывает, выгоден ли клиент с учётом риска."},{"p":["Real options"],"t":"Real options — Реальные опционы","d":"Идея, что у менеджмента есть право выбрать: расширить, отложить или закрыть проект. Это право имеет цену, которую обычный DCF не видит."},{"p":["Real vs nominal","Nominal rate"],"t":"Real vs nominal / Nominal rate — Реальная и номинальная величина (ставка)","d":"Номинальное значение (ставку, доход) считают в текущих деньгах, без поправки на инфляцию. Реальное очищают от инфляции. Точная связь — уравнение Фишера."},{"p":["Receivables turnover"],"t":"Receivables turnover — Оборачиваемость дебиторки","d":"Сколько раз за год компания собирает свою дебиторку."},{"p":["Recession"],"t":"Recession — Рецессия","d":"Спад экономики, обычно два квартала подряд падения ВВП."},{"p":["Recovery rate"],"t":"Recovery rate — Доля возврата долга","d":"Доля номинала долга, которую кредитор вернёт при дефолте. Если из долга 100 вернули 40, recovery rate равен 40%"},{"p":["Reinsurance"],"t":"Reinsurance — Перестрахование","d":"Страховая передаёт часть риска другой страховой. Страховка для страховщика."},{"p":["REIT"],"t":"REIT — Инвестиционный фонд недвижимости (Real Estate Investment Trust)","d":"Компания, владеющая недвижимостью и обязанная раздавать большую часть дохода. Покупаешь акцию вместо квартиры."},{"p":["Related party"],"t":"Related party — Связанная сторона","d":"Акционеры, менеджмент, их компании. Сделки с ними раскрывают отдельно, потому что они могут быть не по рынку."},{"p":["Related\\-party lending"],"t":"Related-party lending — Кредитование связанных сторон","d":"Банк выдаёт кредиты своим же акционерам. ЦБ ограничивает нормативом Н25 (сверить)."},{"p":["Relevering"],"t":"Relevering — Релеверинг беты (пересчёт на новую структуру капитала)","d":"Берут бету аналогов, очищают от долга (Unlevered beta) и возвращают долг по целевому соотношению D/E (Debt / Equity, долг к капиталу) оцениваемой компании. Так бета отражает структуру капитала именно этой компании."},{"p":["Repo"],"t":"Repo — Репо","d":"Сделка, где продают бумаги и обязуются выкупить их обратно позже по более высокой цене. По сути краткосрочный кредит под залог."},{"p":["Reps \\& warranties"],"t":"Reps & warranties — Заверения и гарантии","d":"Утверждения продавца о компании в договоре: отчётность верна, судов нет, налоги заплачены. Если неправда, покупатель требует возмещение. В РФ — заверения об обстоятельствах, ст. 431.2 ГК (сверить)."},{"p":["Reserve currency"],"t":"Reserve currency — Резервная валюта","d":"Валюта, в которой центробанки держат запасы. Главные: доллар, евро, юань."},{"p":["Reserves vs resources"],"t":"Reserves vs resources — Запасы и ресурсы","d":"Запасы — то, что точно выгодно добыть. Ресурсы — то, что есть в земле, но пока не доказано, что добыча окупится."},{"p":["Restructuring"],"t":"Restructuring — Реструктуризация долга","d":"Изменение условий: удлинить срок, снизить ставку, списать часть. Должник получает облегчение, кредитор надеется вернуть хоть что-то."},{"p":["Retained earnings"],"t":"Retained earnings — Нераспределённая прибыль","d":"Прибыль, накопленная за все годы, которую не выплатили акционерам, а оставили в компании."},{"p":["Retention"],"t":"Retention — Удержание клиентов","d":"Доля клиентов или пользователей, которые продолжают пользоваться продуктом через неделю, месяц, год. Обратная сторона оттока (churn)."},{"p":["Retention ratio"],"t":"Retention ratio — Коэффициент удержания","d":"Какая часть прибыли остаётся в компании. Дополняет payout ratio до 100%."},{"p":["Revenue recognition"],"t":"Revenue recognition — Признание выручки","d":"Правило, когда именно продажу можно записать в выручку. По IFRS 15 это момент, когда клиент получил контроль над товаром или услугой."},{"p":["Reverse merger"],"t":"Reverse merger — Обратное слияние","d":"Частная компания выходит на биржу, сливаясь с уже торгуемой «пустой» компанией. Быстрее и дешевле, чем IPO."},{"p":["Reverse split"],"t":"Reverse split — Консолидация акций","d":"Несколько акций объединяют в одну: цена растёт, число акций падает. Стоимость компании не меняется."},{"p":["Revolver"],"t":"Revolver — Револьверная кредитная линия","d":"Кредитная линия: взял, вернул, снова взял в пределах лимита. Закрывает кассовые разрывы."},{"p":["Rf"],"t":"Rf — Безрисковая ставка (Risk-free rate)","d":"Безрисковая ставка: доходность вложений, в которых риск практически отсутствует. Обычно это доходность государственных облигаций"},{"p":["RI"],"t":"RI — Остаточная прибыль (Residual Income)","d":"Остаточная прибыль: ЧП − Ke × Капитал (то, что осталось после того, как акционерам заплатили «положенную» доходность). ЧП — чистая прибыль, Ke — доходность, которую ждут акционеры. Если результат положительный, компания зарабатывает больше, чем от неё требуют"},{"p":["Rights issue"],"t":"Rights issue — Выпуск акций с правом первоочередного приобретения","d":"Новые акции предлагают сначала текущим акционерам, чтобы их доля не размылась."},{"p":["Risk appetite"],"t":"Risk appetite — Риск-аппетит","d":"Сколько риска компания готова принять. Фиксируется советом директоров."},{"p":["Risk\\-adjusted return"],"t":"Risk-adjusted return — Доходность с поправкой на риск","d":"Доходность, пересчитанная на взятый риск. Коэффициенты Шарпа, Сортино."},{"p":["ROA"],"t":"ROA — Рентабельность активов (Return on Assets)","d":"Чистая прибыль / активы. Для банков нормой считается 1–3%. Показывает, сколько прибыли приносит каждый рубль имущества компании"},{"p":["Roadshow"],"t":"Roadshow — Роад-шоу","d":"Серия презентаций компании крупным инвесторам перед IPO. Здесь собирают отзывы и определяют цену."},{"p":["ROCE"],"t":"ROCE — Рентабельность задействованного капитала (Return on Capital Employed)","d":"EBIT / (активы − краткосрочные обязательства). Показывает, сколько операционной прибыли приносит весь капитал, работающий в компании"},{"p":["ROIC"],"t":"ROIC — Рентабельность инвестированного капитала (Return on Invested Capital)","d":"NOPAT / инвестированный капитал. Если ROIC > WACC, компания создаёт стоимость. Проще говоря, если бизнес зарабатывает на вложенные деньги больше, чем стоят эти деньги, он выгоден"},{"p":["Roll\\-up"],"t":"Roll-up — Консолидация рынка","d":"Стратегия: купить много мелких компаний одной отрасли и объединить. Выигрыш — в масштабе и в повышении оценки."},{"p":["ROTE"],"t":"ROTE — Рентабельность материального капитала (Return on Tangible Equity)","d":"ROE банка на материальный капитал, без гудвилла. Основная мера прибыльности банков."},{"p":["RSI"],"t":"RSI — Индекс относительной силы (Relative Strength Index)","d":"Индикатор от 0 до 100: выше 70 бумага считается перекупленной, ниже 30 — перепроданной."},{"p":["Rule of 40"],"t":"Rule of 40 — Правило 40","d":"Для SaaS (Software as a Service, программы по подписке): рост выручки в % плюс маржа в % (обычно по EBITDA или свободному денежному потоку) должны быть не меньше 40."},{"p":["Rule of 72"],"t":"Rule of 72 — Правило 72","d":"Быстрая оценка: за сколько лет сумма удвоится. 72 делим на ставку в процентах."},{"p":["Run\\-rate"],"t":"Run-rate — Годовой пересчёт текущих показателей","d":"Годовой показатель, который получают, пересчитав результат последнего месяца или квартала на год (квартал × 4). Например, квартальная выручка 25 даёт run-rate 100 в год. Это грубая оценка «если так пойдёт и дальше»: показывает текущий масштаб, но скрывает сезонность"},{"p":["Runway"],"t":"Runway — Запас хода","d":"На сколько месяцев хватит денег при текущем burn rate."},{"p":["RUONIA"],"t":"RUONIA — Рублёвая ставка овернайт (Ruble Overnight Index Average)","d":"Российская индикативная ставка овернайт. Привязывают к ней плавающие облигации и кредиты."},{"p":["RWA"],"t":"RWA — Активы, взвешенные по риску (Risk-Weighted Assets)","d":"Активы банка, взвешенные на риск (чем рискованнее актив, тем больше вес). На них делят капитал при расчёте коэффициентов капитала. Кредит надёжному заёмщику «весит» меньше, чем рискованному"},{"p":["SAFE"],"t":"SAFE — Соглашение о будущей доле в капитале (Simple Agreement for Future Equity)","d":"Договор, по которому инвестор отдаёт деньги сейчас, а акции получит позже, в следующем раунде, по скидке."},{"p":["Sanctions"],"t":"Sanctions — Санкции","d":"Ограничения государств на сделки с определёнными лицами, компаниями, отраслями. Самый жёсткий — список SDN (Specially Designated Nationals, «особо обозначенные лица») Минфина США."},{"p":["Scenario analysis"],"t":"Scenario analysis — Сценарный анализ","d":"Расчёт модели в нескольких сценариях: базовый, оптимистичный, пессимистичный. Показывает вилку возможных результатов."},{"p":["Seasonality"],"t":"Seasonality — Сезонность","d":"Регулярные колебания внутри года: ритейл зарабатывает в декабре, сельское хозяйство — после урожая."},{"p":["SEC"],"t":"SEC — Комиссия по ценным бумагам и биржам США (Securities and Exchange Commission)","d":"Американский регулятор рынка ценных бумаг."},{"p":["Second lien"],"t":"Second lien — Второй залог","d":"Долг, обеспеченный тем же залогом, что и старший, но с очередью после него."},{"p":["Secondary buyout"],"t":"Secondary buyout — Вторичный выкуп","d":"Один фонд прямого инвестирования продаёт компанию другому фонду."},{"p":["Securitization"],"t":"Securitization — Секьюритизация","d":"Много однотипных кредитов собирают в пул и продают инвесторам в виде бумаг. Платежи заёмщиков идут держателям."},{"p":["Security market line"],"t":"Security market line — Линия рынка ценных бумаг","d":"График CAPM: чем выше бета, тем выше требуемая доходность."},{"p":["Seed"],"t":"Seed — Посевной раунд","d":"Самый ранний раунд: деньги на проверку идеи и первый продукт."},{"p":["Segment reporting"],"t":"Segment reporting — Сегментная отчётность","d":"Разбивка выручки и прибыли по направлениям бизнеса или регионам."},{"p":["Sell\\-side","Buy\\-side"],"t":"Sell-side / Buy-side — Сторона продавца / сторона покупателя","d":"Консультирование продавца (sell-side) или покупателя (buy-side) в сделке; также так называют брокеров (sell-side) и фонды (buy-side). Sell-side продаёт услуги и идеи, buy-side покупает ценные бумаги"},{"p":["Sell\\-side research"],"t":"Sell-side research — Аналитика брокеров","d":"Отчёты с рекомендациями «покупать / держать / продавать» и целевой ценой."},{"p":["Senior debt"],"t":"Senior debt — Старший долг","d":"Долг, который при банкротстве возвращают первым. Самый дешёвый и самый защищённый."},{"p":["Sensitivity analysis"],"t":"Sensitivity analysis — Анализ чувствительности","d":"Таблица, где меняют одну-две вводные (например, WACC и g) и смотрят, как меняется оценка."},{"p":["Series A","B","C"],"t":"Series A / B / C — Раунды венчурного финансирования","d":"Последовательные раунды: A — масштабирование уже работающей идеи, B — рост, C и дальше — выход на большой рынок или подготовка к IPO."},{"p":["Settlement"],"t":"Settlement — Расчёты по сделке","d":"Обмен деньгами и бумагами. T+1 означает «на следующий рабочий день после сделки»."},{"p":["SG\\&A"],"t":"SG&A — Коммерческие, общие и административные расходы (Selling, General & Administrative)","d":"Коммерческие и управленческие расходы: на продажи и на содержание офиса и управления. Например, реклама, зарплата менеджеров и бухгалтеров"},{"p":["Share","Stock"],"t":"Share / Stock — Акция","d":"Ценная бумага, дающая долю в компании и право на часть прибыли (дивиденды)."},{"p":["Share deal vs asset deal"],"t":"Share deal vs asset deal — Сделка с акциями или с активами","d":"Покупка акций — покупаешь компанию целиком со всеми обязательствами. Покупка активов — только выбранное, но дольше и сложнее по налогам."},{"p":["Shares outstanding"],"t":"Shares outstanding — Акции в обращении","d":"Выпущенные акции минус выкупленные самой компанией (казначейские). Именно их число умножают на цену акции для капитализации и делят на него стоимость собственного капитала в DCF."},{"p":["Sharpe ratio"],"t":"Sharpe ratio — Коэффициент Шарпа","d":"Сколько избыточной доходности получено на единицу общего риска. Чем выше, тем лучше."},{"p":["Short selling"],"t":"Short selling — Короткая продажа","d":"Берут бумагу в долг, продают, а потом выкупают дешевле и возвращают. Заработок при падении цены. Убыток при росте не ограничен."},{"p":["Short squeeze"],"t":"Short squeeze — Шорт-сквиз","d":"Цена растёт, шортисты вынуждены закрываться покупкой, что толкает цену ещё выше."},{"p":["Signing"],"t":"Signing — Подписание","d":"Стороны подписали договор, но сделка ещё не закрыта: ждут одобрения регулятора, согласий, финансирования."},{"p":["Size premium"],"t":"Size premium — Премия за размер","d":"Добавка к ставке для малых компаний: считается, что они рискованнее больших."},{"p":["SOFR"],"t":"SOFR — Ставка овернайт под залог гособлигаций США (Secured Overnight Financing Rate)","d":"Американская ставка овернайт под залог гособлигаций. Заменила LIBOR (London Interbank Offered Rate, лондонскую межбанковскую ставку) в долларовых кредитах."},{"p":["Sortino ratio"],"t":"Sortino ratio — Коэффициент Сортино","d":"Как Шарп, но учитывает только риск падения: рост цен не считается плохим."},{"p":["SOTP"],"t":"SOTP — Оценка по частям (Sum of the Parts)","d":"Оценка по частям: каждую часть бизнеса оценивают отдельно и складывают. Как оценить дом, оценив отдельно каждую квартиру"},{"p":["Sovereign wealth fund"],"t":"Sovereign wealth fund — Суверенный фонд","d":"Государственный инвестфонд: норвежский GPFG (Government Pension Fund Global), саудовский PIF (Public Investment Fund), российские ФНБ (Фонд национального благосостояния) и РФПИ (Российский фонд прямых инвестиций)."},{"p":["SPA"],"t":"SPA — Договор купли-продажи акций (Share Purchase Agreement)","d":"Договор купли-продажи акций. Главный документ сделки, в нём цена, условия и гарантии"},{"p":["SPAC"],"t":"SPAC — Компания для целевого поглощения (Special Purpose Acquisition Company)","d":"Пустая компания, которая выходит на биржу, собирает деньги и потом ищет, какую компанию купить. Её называют «компанией с чистым чеком»."},{"p":["Specific risk premium"],"t":"Specific risk premium — Специфическая премия за риск","d":"Надбавка к стоимости собственного капитала за риски именно этой компании: слабое управление, зависимость от одного клиента или поставщика, закрытость отчётности. Оценивается экспертно, поэтому её обязательно объясняют и показывают в анализе чувствительности (Sensitivity analysis)."},{"p":["Spin\\-off"],"t":"Spin-off — Спин-офф","d":"Подразделение выделяют в отдельную компанию, а акции раздают текущим акционерам бесплатно."},{"p":["SPO"],"t":"SPO — Вторичное публичное размещение (Secondary Public Offering)","d":"Повторная продажа акций компании, которая уже торгуется на бирже. Например, компания хочет собрать ещё денег и выпускает дополнительные акции"},{"p":["Spot"],"t":"Spot — Спот","d":"Цена и сделка «на сегодня» с быстрой поставкой, в отличие от фьючерса."},{"p":["SPV"],"t":"SPV — Компания специального назначения (Special Purpose Vehicle)","d":"Отдельная компания, созданная под одну цель: проект, секьюритизацию, сделку. Изолирует риск от основной компании."},{"p":["Squeeze\\-out"],"t":"Squeeze-out — Принудительный выкуп акций миноритариев","d":"Принудительный выкуп оставшихся акций покупателем с долей более 95%. Мелкие владельцы обязаны продать свои акции, чтобы не оставалось «хвостика»"},{"p":["Stagflation"],"t":"Stagflation — Стагфляция","d":"Одновременно высокая инфляция и застой в экономике с безработицей. Центральному банку трудно действовать."},{"p":["Stakeholder"],"t":"Stakeholder — Стейкхолдер","d":"Все, на кого влияет компания: акционеры, сотрудники, клиенты, государство, местные жители."},{"p":["Standard deviation"],"t":"Standard deviation — Стандартное отклонение","d":"Мера разброса доходностей вокруг среднего. В финансах — то же, что волатильность."},{"p":["Standstill"],"t":"Standstill — Соглашение о приостановке","d":"Кредиторы обязуются временно не требовать долг, пока идут переговоры."},{"p":["Statement of changes in equity"],"t":"Statement of changes in equity — Отчёт об изменениях капитала","d":"Объясняет, почему собственный капитал изменился за период: прибыль, дивиденды, выпуск и выкуп акций, прочий совокупный доход."},{"p":["Step\\-up"],"t":"Step-up — Переоценка базы","d":"При покупке активов налоговая стоимость поднимается до цены покупки, и амортизация увеличивается. Выгода покупателя в asset deal."},{"p":["Stock split"],"t":"Stock split — Сплит акций","d":"Каждую акцию дробят на несколько. Цена одной падает, но стоимость компании не меняется."},{"p":["Stock\\-based compensation"],"t":"Stock-based compensation — Оплата акциями","d":"Вознаграждение сотрудникам опционами и акциями. Это расход в P&L, но не деньги, поэтому его часто добавляют обратно в EBITDA."},{"p":["Stop\\-loss"],"t":"Stop-loss — Стоп-лосс","d":"Заявка, которая автоматически закрывает позицию, если цена дошла до заданного убытка."},{"p":["Stress test"],"t":"Stress test — Стресс-тест","d":"Проверка, что будет с компанией или банком при плохом сценарии: ставка 25%, нефть 30 долларов."},{"p":["Strike price"],"t":"Strike price — Цена исполнения (страйк)","d":"Цена, по которой по опциону можно купить или продать актив."},{"p":["Sublease"],"t":"Sublease — Субаренда","d":"Компания сдаёт дальше часть арендованных площадей. Доход от субаренды идёт в прочие операционные доходы, и при расчёте EBITDA его учитывают отдельной строкой."},{"p":["Subordinated debt"],"t":"Subordinated debt — Субординированный долг","d":"Долг, который возвращают после старшего. Риск выше, ставка выше. У банков может засчитываться в капитал."},{"p":["Subprime"],"t":"Subprime — Субстандартная ипотека","d":"Ипотека ненадёжным заёмщикам в США, упакованная в ипотечные облигации (MBS — Mortgage-Backed Securities) и CDO (Collateralized Debt Obligations, обеспеченные долговые обязательства). Причина кризиса 2008 года."},{"p":["Sunk cost"],"t":"Sunk cost — Невозвратные затраты","d":"Деньги, которые уже потрачены и не вернутся. В решении о будущем их учитывать нельзя."},{"p":["Support","Resistance"],"t":"Support / Resistance — Поддержка / сопротивление","d":"Уровни цены, от которых график раньше отскакивал. Трейдеры ждут отскока снова."},{"p":["Sustainability\\-linked bond"],"t":"Sustainability-linked bond — Облигация, привязанная к целям устойчивости","d":"Купон растёт, если компания не выполнила обещанные цели по ESG."},{"p":["Sustainable growth rate"],"t":"Sustainable growth rate — Устойчивый рост","d":"Максимальный рост, который компания может обеспечить без новых акций и без роста долговой нагрузки."},{"p":["Swap"],"t":"Swap — Своп","d":"Договор обменяться денежными потоками. Например, платить фиксированную ставку, а получать плавающую."},{"p":["Synergies"],"t":"Synergies — Синергия","d":"Синергии: дополнительная стоимость, которая появляется от объединения компаний. Например, две компании сливаются и сокращают общие расходы: вместе получается выгоднее, чем по отдельности"},{"p":["Systemic risk"],"t":"Systemic risk — Системный риск","d":"Крах одного участника валит остальных, как в 2008 году."},{"p":["Tag\\-along"],"t":"Tag-along — Право присоединения","d":"Если крупный акционер продаёт долю, миноритарий вправе продать свою на тех же условиях."},{"p":["Tail risk"],"t":"Tail risk — Хвостовой риск","d":"Редкие, но катастрофические события: чёрные лебеди."},{"p":["TAM","SAM","SOM"],"t":"TAM / SAM / SOM — Размеры рынка (TAM — Total Addressable Market; SAM — Serviceable Available Market; SOM — Serviceable Obtainable Market)","d":"Весь возможный рынок / часть, которую можно обслужить / часть, которую реально займёшь."},{"p":["Tangible book value"],"t":"Tangible book value — Материальная балансовая стоимость","d":"Капитал без нематериальных активов и гудвилла. Сколько останется владельцам, если продать только «вещи»."},{"p":["Target price"],"t":"Target price — Целевая цена","d":"Цена, до которой, по мнению аналитика, дойдёт акция за 12 месяцев."},{"p":["Tax DD"],"t":"Tax DD — Налоговая проверка (DD — Due Diligence)","d":"Поиск налоговых рисков за прошлые периоды: что могут доначислить."},{"p":["Tax loss carryforward"],"t":"Tax loss carryforward — Перенос убытков","d":"Прошлые убытки уменьшают налог на прибыль в будущие годы. В РФ не больше 50% базы в год до 2026 (сверить)."},{"p":["Tax shield"],"t":"Tax shield — Налоговый щит","d":"Экономия на налоге за счёт вычитаемых расходов: процентов, амортизации."},{"p":["Taylor rule"],"t":"Taylor rule — Правило Тейлора","d":"Формула, по которой оценивают подходящую ставку центробанка исходя из инфляции и отклонения ВВП от потенциала."},{"p":["Teaser"],"t":"Teaser — Краткое описание компании для инвесторов","d":"Короткое анонимное описание компании, которое рассылают потенциальным покупателям. Название скрыто, нужно лишь, чтобы заинтересовать. Как объявление «продаётся бизнес в сфере…» без адреса"},{"p":["Technical analysis"],"t":"Technical analysis — Технический анализ","d":"Прогноз цены по графику и объёмам, без изучения бизнеса. Академическая наука к нему скептична."},{"p":["Tender offer"],"t":"Tender offer — Публичное предложение о выкупе акций","d":"Публичное предложение ко всем акционерам: продайте нам свои акции по этой цене. Как объявление «куплю у всех желающих по такой-то цене до такой-то даты»"},{"p":["Term Loan A","B"],"t":"Term Loan A / B — Срочный кредит A / B (TLA / TLB)","d":"Старший кредит. Кредит A амортизируется (гасится частями) и обычно выдан банками. Кредит B почти не амортизируется и выдан инвесторами. Старший значит, что его возвращают первым. Кредит B дороже, потому что основную сумму отдают в конце"},{"p":["Term sheet"],"t":"Term sheet — Условия сделки","d":"Короткий документ с главными условиями инвестиции или покупки. Юридически обязывает только частично, но потом по нему пишут договор."},{"p":["Theta"],"t":"Theta — Тета","d":"Сколько стоимости опцион теряет за один день просто от течения времени."},{"p":["Three\\-statement model"],"t":"Three-statement model — Модель трёх отчётов","d":"Финансовая модель, где отчёт о прибылях и убытках (P&L), баланс и отчёт о движении денежных средств (ОДДС) связаны формулами: изменил выручку — поменялось всё."},{"p":["Tier 1","Tier 2"],"t":"Tier 1 / Tier 2 — Основной / дополнительный капитал банка","d":"Уровни капитала банка. Tier 1 — самый надёжный (акции, прибыль), Tier 2 — запасной (например, субординированный долг)."},{"p":["Time value"],"t":"Time value — Временна́я стоимость","d":"Часть цены опциона сверх внутренней стоимости: плата за шанс, что цена ещё выгодно сдвинется. К дате экспирации сходит к нулю."},{"p":["Time value of money"],"t":"Time value of money — Стоимость денег во времени","d":"Рубль сегодня дороже рубля завтра: сегодняшний можно вложить и получить проценты. На этой идее стоит вся оценка."},{"p":["Top line","Bottom line"],"t":"Top line / Bottom line — Верхняя / нижняя строка отчёта (выручка / прибыль)","d":"Верхняя строка P&L — выручка, нижняя — чистая прибыль."},{"p":["Tracking error"],"t":"Tracking error — Ошибка слежения","d":"Насколько сильно доходность портфеля отклоняется от бенчмарка. Для индексного фонда должна быть маленькой."},{"p":["Trade\\-off theory"],"t":"Trade-off theory — Компромиссная теория","d":"Оптимальный долг находят, сравнивая выгоду от налогового щита и расходы на возможное банкротство."},{"p":["Tranche"],"t":"Tranche — Транш","d":"Часть выпуска или кредита с разным риском и доходом. Старший транш получает деньги первым и платит меньше."},{"p":["Transfer of risk"],"t":"Transfer of risk — Передача риска","d":"Переложить риск на другого: застраховать, захеджировать, включить в договор."},{"p":["Translation vs transaction exposure"],"t":"Translation vs transaction exposure — Пересчётный и операционный валютный риск","d":"Пересчётный — бумажный, от перевода отчётности дочек в валюту материнской. Операционный — реальный, по конкретным платежам."},{"p":["Treasury stock"],"t":"Treasury stock — Выкупленные собственные акции","d":"Акции, которые компания выкупила у рынка. В балансе они вычитаются из капитала и не получают дивидендов."},{"p":["Treynor ratio"],"t":"Treynor ratio — Коэффициент Трейнора","d":"Избыточная доходность на единицу рыночного риска (беты)."},{"p":["TSR"],"t":"TSR — Совокупная доходность акционера (Total Shareholder Return)","d":"Полная доходность акционера: рост цены акции + дивиденды. Это всё, что владелец акции заработал: и на подорожании, и на выплатах"},{"p":["TV"],"t":"TV — Терминальная (постпрогнозная) стоимость (Terminal Value)","d":"Терминальная (постпрогнозная) стоимость: стоимость бизнеса за пределами прогнозного периода. Прогноз обычно делают на 5–10 лет, а компания живёт дальше, и эту «остальную жизнь» оценивают одной суммой"},{"p":["Underwriter"],"t":"Underwriter — Андеррайтер","d":"Банк, который организует выпуск бумаг, а иногда гарантирует выкуп непроданной части."},{"p":["Unit economics"],"t":"Unit economics — Юнит-экономика","d":"Прибыльность одной единицы бизнеса: одного клиента, заказа, магазина. Если на одной единице убыток, рост только увеличивает убытки."},{"p":["Unitranche"],"t":"Unitranche — Юнитранш","d":"Один кредит, объединяющий старший и мезонинный долг, с одной ставкой. Любят кредитные фонды."},{"p":["Unlevered beta"],"t":"Unlevered beta — Бета без долга","d":"Бета бизнеса, очищенная от влияния долга. Нужна, чтобы сравнивать компании с разным долгом."},{"p":["Upside"],"t":"Upside — Потенциал роста","d":"Насколько справедливая стоимость акции выше текущей цены. Отрицательный потенциал — акция по модели дороже, чем стоит."},{"p":["Useful life"],"t":"Useful life — Срок полезного использован
