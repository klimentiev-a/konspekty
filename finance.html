ля.","move":"+2,2%","src":"Интерфакс","url":"https://www.interfax.ru/business/1059298"},{"tic":"IMOEX","date":"2026-03-02","title":"Удары США и Израиля по Ирану: нефть к $80, индекс на максимуме","text":"Война в Персидском заливе и атаки на танкеры в Ормузском проливе подняли Brent к $80. Нефтяники выросли на 5–10%, а индекс закрылся на максимуме с сентября 2025 года.","move":"+1,3%","src":"Интерфакс","url":"https://www.interfax.ru/business/1075616"},{"tic":"IMOEX","date":"2026-04-24","title":"ЦБ снизил ставку до 14,5%, но дал жёсткий сигнал","text":"Регулятор не исключил более жёсткой политики в будущем, и рынок воспринял это как намёк на паузу. Сильнее всего упали закредитованные компании и металлурги.","move":"−1,4%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8622706"},{"tic":"IMOEX","date":"2026-06-19","title":"ЦБ снизил ставку лишь на 25 б.п., до 14,25%","text":"Рынок ждал снижения на 50 б.п. Индекс в моменте опустился до минимума с декабря 2024 года (2408 п.), и с этого заседания началось летнее падение.","move":"−1,4%","src":"Интерфакс","url":"https://www.interfax.ru/business/1096989"},{"tic":"IMOEX","date":"2026-06-24","title":"Обвал на 4%: дешевеющая нефть, санкции G7 и пауза ЦБ","text":"Brent впервые с начала ближневосточного конфликта опустилась ниже $74, а G7 пригрозила ужесточить санкции против нефтегаза. Металлурги и IT подешевели на 5–8%.","move":"≈−4%","src":"Интерфакс","url":"https://www.interfax.ru/business/1098111"},{"tic":"IMOEX","date":"2026-07-16","title":"Худший день с сентября 2022 года, индекс у 2000 пунктов","text":"Геополитика, ожидания паузы ЦБ и дивидендные отсечки обрушили индекс до 2022 п. 16–17 июля он впервые с октября 2022 года ушёл ниже 2000 п. и потерял 8,7% за неделю.","move":"−4,24%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8816739"},{"tic":"IMOEX","date":"2026-07-24","title":"ЦБ неожиданно снизил ставку до 14%","text":"До решения индекс опускался ниже 2100 п., после него развернулся вверх. Лидерами .ru/business/1119022"},{"tic":"LKOH","date":"2025-10-23","title":"ЛУКОЙЛ под санкциями США","text":"Минфин США ввёл блокирующие санкции против ЛУКОЙЛа, а совет директоров отменил заседание по дивидендам. Утром бумаги теряли 5–6%.","move":"−3…5%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8142098"},{"tic":"LKOH","date":"2025-11-07","title":"Gunvor отказался покупать зарубежные активы ЛУКОЙЛа","text":"Минфин США не выдал Gunvor лицензию, и сделка по LUKOIL International сорвалась. На открытии бумаги теряли 4,2%.","move":"−4,2% на открытии","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8181806"},{"tic":"LKOH","date":"2026-01-29","title":"ЛУКОЙЛ договорился с Carlyle о продаже зарубежных активов","text":"Компания согласовала продажу LUKOIL International без казахстанских активов. Сделка неэксклюзивна и требует одобрения OFAC.","move":"+3,2%","src":"Интерфакс","url":"https://www.interfax.ru/business/1070030"},{"tic":"LKOH","date":"2026-06-16","title":"Трамп пригрозил вернуть санкции на российскую нефть","text":"Трамп допустил отказ от послаблений после открытия Ормузского пролива. Нефтяники стали лидерами падения рынка.","move":"−4,7%","src":"Интерфакс","url":"https://www.interfax.ru/business/1096303"},{"tic":"LKOH","date":"2026-08-28","title":"Прибыль ЛУКОЙЛа за полугодие выросла в 1,5 раза","text":"Чистая прибыль по МСФО составила 430,9 млрд руб. С конца августа до начала октября акции подорожали более чем на 35%.","move":"+2,6%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/08/28/1224488-tsena-aktsii-lukoila"},{"tic":"LKOH","date":"2026-10-05","title":"NYT: зарубежные активы ЛУКОЙЛа — часть переговоров РФ и США","text":"По данным газеты, их продажа американским и ближневосточным инвесторам обсуждается в рамках урегулирования. 7 октября акции обновили полугодовой максимум у 5670 руб.","move":"+2,1%","src":"Интерфакс","url":"https://www.interfax.ru/business/1120482"},{"tic":"ROSN","date":"2025-10-23","title":"«Роснефть» .ru/doc/8816739"},{"tic":"RUAL","date":"2026-08-10","title":"Алюминий выше $3300 — «Русал» +5%","text":"Цена металла достигла максимума с 22 июня.","move":"+5,4%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8876531"},{"tic":"RUAL","date":"2026-08-14","title":"«Русал» среди лидеров падения рынка на 4,3%","text":"Геополитический негатив и фиксация прибыли ударили по сырьевым бумагам.","move":"−7,8%","src":"Интерфакс","url":"https://www.interfax.ru/business/1109404"},{"tic":"TRNFP","date":"2026-07-06","title":"«Транснефть» обвалилась без объявления дивидендов","text":"Компания всё ещё не объявила дивиденды, а рынок упал на инфраструктурных рисках. В моменте префы теряли 7–9%.","move":"−3…7%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8797685"},{"tic":"TRNFP","date":"2026-07-20","title":"Дивидендный гэп «Транснефти» — 204,17 руб.","text":"Отсечка дивиденда за 2025 год, объявленного 17 июля, всего почти 148 млрд руб.","move":"−14,3%","src":"Интерфакс","url":"https://www.interfax.ru/business/1104411"},{"tic":"SIBN","date":"2026-07-06","title":"Дивидендный гэп «Газпром нефти»","text":"Реестр по дивиденду 28,11 руб. за 2025 год закрылся, цена упала с 447,55 до 425,9 руб.","move":"≈−6%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/07/06/1211489-aktsii-gazprom-nefti"},{"tic":"SIBN","date":"2026-08-28","title":"Прибыль «Газпром нефти» за полугодие выросла в 1,7 раза","text":"Чистая прибыль по МСФО превысила 285 млрд руб. Совет рекомендовал промежуточный дивиденд, почти равный выплате за весь 2025 год.","move":"+5,1%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/08/28/1224520-tsena-aktsii-gazprom-nefti"},{"tic":"SIBN","date":"2026-10-07","title":"«Газпром нефть» на максимуме с марта 2025 года","text":"В моменте цена достигала 597 руб. Источник не называет причину; ранее компания отчиталась о росте чистой прибыли за полугодие на 69%.","move":"+2,2%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/10/07/1235073-aktsii-gazprom-nefti"},{"tic":"IMOEX","date":"2026-10-23","time":"13:30","title":"ЦБ сохранил ставку 14%: индекс кратко просел и отыграл","text":"Решение ждали (25 из 26 экономистов «Ведомостей» прогнозировали паузу), но сразу после объявления в 13:30 индекс упал с 2 433 до минимума 2 418 п., а затем вернулся к росту: ЦБ в паузе, дешёвых денег не будет. Позже рынок отыграл падение на нефтегазе (+1,4%).","move":"−0,6% на минимуме","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/10/23/1239621-indeks-mosbirzhi"},{"tic":"IMOEX","date":"2026-10-27","title":"Индекс Мосбиржи — четырёхмесячный максимум на ожиданиях переговоров по Украине","text":"Рынок закладывает надежду на деэскалацию: поддержку дали ожидания трёхсторонних переговоров по Украине, запланированных на ноябрь в Абу-Даби. Индекс подошёл к 2500 п.; в Кремле сказали, что детали переговоров публичными не будут. ОФЗ вернулись к росту.","move":"+1,3%","src":"Сибирское информационное агентство","url":"https://sia.ru/?section=410&action=show_news&id=16834049"},{"tic":"^GSPC","date":"2026-10-28","time":"21:00","title":"ФРС сохранила ставку 3,75–4,00%","text":"Решение принято 10 голосами против 2: Лиза Кук и Бет Хэммак голосовали за повышение на четверть пункта. Экономику ФРС теперь называет «сильной», а не «устойчивой». Индексы США закрылись небольшим ростом.","move":"небольшой рост","src":"Frank Media","url":"https://frankmedia.ru/312809"},{"tic":"BTC","date":"2026-10-29","title":"Взлом Binance на $6,3 млрд: биткоин упал","text":"Binance оценила ущерб от «инцидента с безопасностью» примерно в $6,3 млрд; по предварительной версии, взломали ноутбук одного из инженеров. Все транзакции приостановили, около $3 млрд заморозили, остальное биржа обещает покрыть из резервного фонда SAFU.","move":"−4,3%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/9064285"},{"tic":"^IXIC","date":"2026-10-30","title":"Распродажа техкомпаний: Nasdaq-100 −3%, Intel −28%","text":"Intel подешевела на 28%, Amazon упала на росте капитальных расходов. Давили и признаки замедления роста у крупнейших техкомпаний — инвесторы засомневались в спросе на всё, что связано с ИИ. Биткоин после взлома Binance опустился примерно до $77 000.","move":"−2,9%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/10/30/1241674-nasdaq-100-upal"}],"brief":{"asof":"9 ноября 2026","pitch":["Неделя после выборов в Конгресс США (3 ноября): техи просели (Nasdaq 5 ноября −5,5%), но 6 ноября частично отыграли: S&P 500 7 377 (+0,3%), Nasdaq 24 579 (+1,1%). Азия на пятничных торгах упала: Nikkei −6,0%, KOSPI −6,0% (причину сверить).","Сильный отчёт по занятости в США за октябрь (6 ноября) вернул ставки на повышение ФРС (Федеральная резервная система, Fed) в декабре (Reuters); точные цифры отчёта сверить.","ЦБ (Центральный банк, Bank of Russia) держит ключевую ставку (key rate) 14% и в резюме от 5 ноября повысил траекторию: 12,5–13,5% в среднем в 2027 году. Следующее решение — 18 декабря. Инфляция замедляется: цены 27 октября – 2 ноября −0,04% за неделю (Росстат), с начала года 6,20%; годовая по оценке Минэка (МЭР) 6,95%.","Рубль слабее: официальный курс ЦБ 82,14 ₽ за доллар (+2,0% с 31 октября), юань 12,27 ₽, евро 92,19 ₽; утром 9 ноября юань на Мосбирже вырос до 12,31 ₽ вслед за нефтью (Интерфакс). Нефть Brent к утру 9 ноября ≈ $96,5 после недельного падения на 16%.","Утро 9 ноября: индекс Мосбиржи +0,6% к 09:15 (2 478, Ведомости), в снимке Hub 10:01 — 2 474 (+0,4%); акции «ЕвроТранса» (владелец сети АЗС) упали более чем на 12–20% после остановки АЗС «Трасса», Мосбиржа запустила дискретный аукцион. Минфин с сегодняшнего дня покупает валюту по 15,6 млрд ₽ в день; правительство разрешило ему занять ещё 1 трлн ₽ сверх плана 5,5 трлн ₽ (Smart-Lab). Сегодня РУСАЛ определяется с дивидендами; 10 ноября — дивидендная политика Сбера, инфляция США (CPI) и переговоры в Абу-Даби."],"phrases":["ЦБ держит 14% и повысил траекторию ставки: экономика «перегрета», инфляция 7% при цели 4%. Снижение в декабре маловероятно.","Рубль слабеет из-за дешёвой нефти (Brent −16% за неделю) и растущих покупок валюты Минфином (15,6 млрд ₽ в день с 9 ноября).","Российский рынок торгует геополитику: ралли октября — ожидания переговоров, в ноябре индекс остыл на 3% от максимума.","Выборы в США пересчитали риски: рынок испугался ограничений для дата-центров, Nasdaq упал на 5,5%, деньги ушли в облигации и золото.","ФРС в режиме ужесточения: после сильной занятости 6 ноября ставки на декабрьское повышение выросли; дальше CPI 10 ноября.","ИИ из истории роста стал историей окупаемости капекса: рынок наказывает за траты без выручки и долговое финансирование.","Для IB главная тема — окно IPO: оценки Anthropic и других мегаразмещений могут снизить. Риск после размещения: уход ниже цены.","Если спросят про риски: срыв переговоров в Абу-Даби, эскалация в Ормузе, повторное повышение ФРС, дефолты в ВДО, регулирование ИИ в США."],"themes":[{"tag":"Ставка","title":"ЦБ держит 14%: экономика «перегрета», траектория ставки выше","lead":"23 октября ЦБ оставил ключевую ставку 14% второй раз подряд. 5 ноября он опубликовал резюме обсуждения: проинфляционные риски высокие, экономика снова вошла в фазу перегрева (спрос превышает возможности производства).","facts":["Годовая инфляция по оценке Минэка (МЭР) 6,95% на 2 ноября (7,11% на 26 октября), цель 4%. Росстат: за неделю 27.10–2.11 цены −0,04%, с начала года 6,20% (оценку МЭР сверить).","Причины паузы по резюме: выбытие производственных мощностей, более крупная индексация коммунальных услуг с 1 октября, высокие инфляционные ожидания, активное корпоративное кредитование, большой вклад бюджета в спрос.","Прогноз средней ключевой ставки повышен: 14,6% в 2026 году, 12,5–13,5% в 2027-м, 9,0–10,0% в 2028-м, 7,5–8,5% в 2029-м (нейтральный уровень).","Положительный разрыв выпуска (output gap) должен сокращаться постепенно, для этого ЦБ нужна жёсткая политика. Набиуллина: цель — чтобы россиянам не нужна была льготная ипотека, а это возможно только при устойчиво низкой инфляции.","До резюме ВТБ оценивал шанс снижения на 0,25 п.п. (процентного пункта) в декабре в 25–30%, Сбер ждал сохранения."]},{"tag":"Облигации","title":"Кривая ОФЗ: длинные ставки выше ключевой","lead":"Кривая бескупонной доходности (КБД, zero-coupon yield curve) растёт: на 9 ноября (снимок 10:01) 1 год 14,26%, 5 лет 16,16%, 10 лет 16,67%. Длинные ставки выше ключевой: рынок не верит в быстрое снижение инфляции.","facts":["Нормальная (растущая) кривая при ставке 14% значит: за длинный срок инвесторы требуют премию за риск инфляции и дефицита.","Дефицит бюджета 2027 года — 5,4 трлн ₽. Его финансируют в основном выпуском ОФЗ, большое предложение давит на цены длинных бумаг.","Индекс гособлигаций RGBI (Russian Government Bond Index) 111,93 пункта, на 0,5% ниже, чем 31 октября.","Корпоративные выпуски в конце октября размещались под 15–21,5%: Европлан под 15%, Воксис под 21,5%. Флоатеры привязаны к КС (ключевая ставка) плюс спред (spread).","Правительство разрешило Минфину занять в 2026 году ещё 1 трлн ₽ сверх плана 5,5 трлн ₽; по оценке Smart-Lab, это может удержать доходности ОФЗ выше 16,5% (мнение автора). Траектория ставки ЦБ на 2027–2028 годы тоже выше прежней."]},{"tag":"Валюта","title":"Рубль слабеет: нефть дешевеет, Минфин покупает больше","lead":"Официальный курс ЦБ с 7 ноября — 82,14 ₽ за доллар, 92,19 ₽ за евро, 12,27 ₽ за юань. Утром 9 ноября юань на Мосбирже вырос до 12,31 ₽ вслед за подешевевшей нефтью (Интерфакс).","facts":["Brent за неделю подешевела на 16%, до $98,3: экспортная выручка в валюте уменьшается, хотя к рынку она приходит с лагом 1–3 месяца.","Минфин с 9 ноября по 4 декабря купит валюту и золото по бюджетному правилу на 312,63 млрд ₽ — по 15,6 млрд ₽ в день. Раньше было 12,7 млрд ₽ в день. Больше покупок значит меньше поддержки рублю.","Нефтегазовые доходы бюджета в октябре оказались на 78,5 млрд ₽ ниже ожидаемых (из-за налога на дополнительный доход, НДД).","Аналитик Зварич (ПРАЙМ): при дальнейшем откате нефти юань может выйти выше 12,5 ₽.","Прогнозы: Совкомбанк на 9–15 ноября — 79–84 ₽ за доллар, 11,9–12,6 ₽ за юань, 89–94 ₽ за евро; данные конца октября: БКС ждал доллар у 82 ₽, Финам — до 86 ₽."]},{"tag":"Бюджет","title":"Бюджет 2027–2029: дефицит 2,2% ВВП","lead":"29 октября Госдума приняла бюджет на 2027–2029 годы в первом чтении (372 голоса «за», против никого).","facts":["2027 год: доходы 43,3 трлн ₽, расходы 48,7 трлн ₽, дефицит 5,4 трлн ₽ (2,2% ВВП, валового внутреннего продукта, GDP).","Раньше на 2027 год планировали дефицит 3,2 трлн ₽ (1,2% ВВП). Ожидаемый дефицит 2026 года — около 5,9 трлн ₽ (2,5% ВВП).","Дефицит снижается до 1,9% ВВП в 2028–2029 годах. Бюджетное правило полностью соблюдут только в 2029 году.","НДС (налог на добавленную стоимость, VAT) с 2026 года 22%. Минфин счёл нецелесообразным менять налогообложение нефтяной отрасли.","Нефтегазовые доходы в октябре ниже ожидаемых на 78,5 млрд ₽. Покупки валюты и золота с 9 ноября: 15,6 млрд ₽ в день."]},{"tag":"Акции","title":"Мосбиржа остыла перед переговорами в Абу-Даби","lead":"9 ноября торги начались ростом: к 09:15 индекс Мосбиржи 2 478 (+0,59%, Ведомости), в снимке Hub 10:01 — 2 474 (+0,4%). Неделей ранее индекс просел более чем на 1% (РБК), максимум — 2 545.","facts":["Акции «ЕвроТранса» (оператор АЗС) утром 9 ноября упали более чем на 12–20% после остановки сети АЗС «Трасса» в Подмосковье; Мосбиржа запустила дискретный аукцион (РБК, Финам). Причину остановки сверить.","Поводом стал состав российской делегации на переговорах в Абу-Даби 10–11 ноября: её главой назначили Мединского, и часть инвесторов решила, что быстрого соглашения не будет.","6 ноября Трамп встретился с Кириллом Дмитриевым (РФПИ, Российский фонд прямых инвестиций) и пообещал «большое прекрасное соглашение». В Кремле ответили, что подробностей у них нет.","Победа демократов в США, по мнению части аналитиков, снижает шансы на быструю сделку: партия традиционно ближе к Украине (оценка автора канала, не факт).","Технический взгляд (мнение автора канала): поддержка 2 400, сопротивление 2 450–2 460 и 2 500. Пробой 2 400 открывает путь к 2 350.","Риски: удары БПЛА (беспилотных летательных аппаратов) по НПЗ (нефтеперерабатывающим заводам) и ЦОДам (центрам обработки данных), слабая нефть, жёсткая ставка."]},{"tag":"Банки","title":"Банки: Сбер растёт, у ВТБ вопрос с дивидендами","lead":"Сезон отчётов за 9 месяцев показал, что крупные банки зарабатывают даже при ставке 14%. 10 ноября набсовет Сбера рассмотрит дивидендную политику на 2027–2029 годы.","facts":["Сбер, МСФО (международные стандарты финансовой отчётности, IFRS) за 9 месяцев: чистая прибыль (Net Income) 1 529,9 млрд ₽ (+17% г/г), чистые процентные доходы (NII, Net Interest Income) 3 158,8 млрд ₽ (+23%), ROE (Return on Equity, рентабельность капитала) 24%.","Герман Греф намекнул, что дивиденды будут «очень хорошие» (по разбору Smart-Lab). При выплате 50% прибыли это около 35,4 ₽ на акцию за 9 месяцев.","Сбер не планирует переходить на квартальные выплаты.","ВТБ подтвердил прогноз чистой прибыли за 2026 год до 600 млрд ₽. Возврат к выплате 50% прибыли в первые годы стратегии 2027–2029 Пьянов назвал маловероятным.","ДОМ.РФ за 9 месяцев: чистая прибыль 86,3 млрд ₽ (+39%). АКРА (рейтинговое агентство) улучшило прогноз по рейтингу «Яндекс банка» (А(RU)) до «позитивного»."]},{"tag":"Отчёты","title":"Отчёты за 3-й квартал: ритейл сильный, металлурги слабые, техи под ударом дронов","lead":"Картина неровная: ритейл и банки сильные, металлургия и золотодобыча слабее, техкомпании страдают от атак БПЛА.","facts":["Яндекс, 3-й квартал: выручка (Revenue) 410,6 млрд ₽ (+12%), чистая прибыль 45,9 млрд ₽ (+2%). Компания отозвала прогноз на 2026 год после октябрьских атак на дата-центры.","Ozon: выручка за 9 месяцев +53%. Убытки от ударов БПЛА по 11 логистическим объектам компания оценила в 30 млрд ₽.","ИКС 5 (X5), 3-й квартал: выручка 1,311 трлн ₽ (+13%), чистая прибыль 29,3 млрд ₽ (+3,8%). 6 ноября совет директоров рекомендовал дивиденд за 9 месяцев 204 ₽ на акцию.","Северсталь: чистая прибыль за 9 месяцев −61%. Сталь страдает от высокой ставки (стройка) и крепкого рубля. 6 ноября компания объявила, что подаст иск к губернатору Вологодской области (о защите репутации).","Полюс: чистая прибыль за 9 месяцев по РСБУ (российские стандарты бухучёта, RAS) −14%. «Газпром» в четвёртый раз с начала ноября обновил рекорд суточных поставок газа в Китай."]},{"tag":"Дивиденды","title":"Дивиденды и долговой рынок","lead":"Осенью идёт сезон промежуточных дивидендов, а на долговом рынке растёт риск у слабых заёмщиков.","facts":["ФосАгро: рекомендация 309 ₽ на акцию (≈5,7%), решение акционеров 2 декабря.","Роснефть: совет директоров рассматривал дивиденды 6 ноября (итог сверить). ИКС 5 (X5): рекомендация 204 ₽ за 9 месяцев (6 ноября). Сбер: дивидендная политика 10 ноября.","МГКЛ допустила технический дефолт (technical default). Мосбиржа запретила короткие продажи (шорт, short selling) её акций.","Высокодоходные облигации (ВДО, high-yield) в конце октября размещались под 18–21,5%: это плата за кредитный риск.","Закон о санации компаний с активами больше 1 млрд ₽ может вступить в силу 1 января 2027 года."]},{"tag":"Нефть","title":"Нефть: Brent упала до $98 на надеждах на мир, но атаки на танкеры продолжаются","lead":"С 28 февраля 2026 года идёт война США и Израиля с Ираном. После выборов в США надежды на урегулирование выросли: 4 ноября Brent и WTI упали более чем на 8%, за неделю Brent подешевела на 16% — самое большое падение со времён пандемии.","facts":["6 ноября Brent около $98,3 за баррель, WTI около $91. 30 октября Brent торговалась у $117,6.","Рынок ждёт, что деэскалация увеличит экспорт из региона и сократит премию за риск на ближневосточные сорта.","Поддержка цене: нападения на суда в Персидском заливе и Ормузском проливе. По данным британского UKMTO (Управление морских торговых операций) число атак на танкеры близко к рекордному.","Через Ормузский пролив идёт около пятой части мирового потребления нефти.","В Европе газ дешевеет (около $1 000 за тысячу кубометров), но отбор из хранилищ 4 ноября — рекорд для этой даты (данные «Газпрома»). Генсек НАТО Рютте заявил, что сделка России и США по дизелю вызвала в Европе панику; Дмитриев назвал сообщения о срыве сделки фейком.","7 ноября хуситы заявили об ударах по нефтяным и военным объектам в Саудовской Аравии и по аэропорту Эр-Рияда; 8 ноября гражданская оборона Саудовской Аравии дала отбой после тревоги в Восточной провинции (заявление хуситов, независимого подтверждения нет, сверить)."]},{"tag":"ФРС","title":"ФРС: ставка 3,75–4,00%, повышение в декабре стало менее вероятным","lead":"28 октября ФРС сохранила ставку 3,75–4,00% (повысила её 16 сентября впервые с 2023 года). Двое членов комитета (Лиза Кук и Бет Хэммак) голосовали за повышение. После выборов шанс декабрьского повышения упал.","facts":["Вероятность повышения в декабре: 67% по рынкам прогнозов (было больше 80%) и 76% по фьючерсам на ставку федеральных фондов (сверить обе цифры).","Председатель ФРС — Кевин Уорш. Хэммак (ФРБ Кливленда) и Баркин (ФРБ Ричмонда) выступают за постепенное повышение ставок для снижения инфляции (Reuters).","Инфляция CPI (Consumer Price Index, индекс потребительских цен) в сентябре — 3,7% г/г, +0,6% м/м (месяц к месяцу). Энергия +20,4% г/г.","6 ноября вышел отчёт по занятости в США за октябрь: по заголовкам Reuters и Bloomberg он сильный, ставки на повышение выросли. Точные цифры сверить. Дейли (ФРС) называет повышение вероятным.","Следующие даты: CPI за октябрь 10 ноября, заседание FOMC (Federal Open Market Committee) 8–9 декабря (сверить)."]},{"tag":"Ставки","title":"Доходность UST ушла ниже 5%: деньги бегут из акций в облигации","lead":"Доходность 10-летних казначейских облигаций США 5 ноября — 4,85% (в сентябре доходила до 5,11%, максимума с июля 2007 года). 30-летних — 5,31%.","facts":["Ориентир доходности 10-летних UST остаётся ниже 5,00% вторую неделю подряд.","Причина: победа демократов усилила ожидания разделённой власти и сдержанных расходов бюджета, а распродажа акций ИИ погнала деньги в защитные активы. В один из дней доходность упала на 19 б.п. (базисных пунктов) — крупнейшее однодневное падение с марта 2023 года (по данным BigGo, сверить).","Разница между доходностью 10- и 2-летних облигаций выросла на 3 б.п. до 0,36 п.п.: доходность 2-летних падает быстрее, трейдеры сокращают ставки на повышения ФРС.","Золото за неделю дорожает более чем на 4% (WSJ). Октябрь: на Мосбирже рекордный объём торгов золотом, 52,2 тонны на 573,4 млрд ₽.","Инфляция растёт по всему миру: в странах ОЭСР 4,5% в сентябре (в августе 4,3%), в еврозоне 4,0% в октябре (3,8% в сентябре)."]},{"tag":"Акции США","title":"Обвал ИИ-акций после выборов: страх регулирования дата-центров","lead":"5 ноября Nasdaq упал на 5,5% до 24 315 (один из худших дней в истории, зона коррекции: минус 10% от максимума), S&P 500 — на 4,4% до 7 354, Dow — на 3,4%. Упали все 11 секторов S&P 500.","facts":["Причина: инвесторы боятся, что новый Конгресс введёт ограничения или запрет на строительство центров обработки данных (data centers), и это замедлит бум ИИ (искусственного интеллекта, AI).","Полупроводники: ETF VanEck Semiconductor −11,2%. Nvidia −9,1% (181,6 $), AMD −17%, Broadcom −10%, Tesla −11%, Oracle −7%, Microsoft −3,6%.","До выборов давление уже накапливалось: доходность облигаций оператора ИИ-облаков CoreWeave выросла на 15 пунктов (риск дефолта), отчёты гиперскейлеров (Alphabet, Amazon, Meta, Microsoft) показали рост капзатрат и отрицательный свободный денежный поток.","Волна дошла до Азии: KOSPI (Южная Корея) −6%, Nikkei (Япония) −6%, Тайвань −4,5%.","Джим Крамер (CNBC): «торговля ИИ не исчезнет». 6 ноября фьючерсы на американские индексы смешанные, ждут отчёт по занятости."]},{"tag":"IPO и M&A","title":"Мегаразмещения под вопросом: Anthropic, SpaceX, Jio","lead":"2026 год — год мегаразмещений (IPO, Initial Public Offering, первичное размещение акций). После обвала ИИ-акций инвесторы начали сомневаться в рекордных оценках.","facts":["Anthropic 26 октября опубликовала проспект S-1 для SEC (Securities and Exchange Commission, Комиссия по ценным бумагам США). Тикер ANT, Nasdaq, организаторы Goldman Sachs и Morgan Stanley.","WSJ (6 ноября): три крупных инвестора сомневаются в оценке $1,5 трлн, она может оказаться ближе к $1 трлн; компания может привлечь около $80 млрд вместо планировавшегося (пересказ, сверить).","Роуд-шоу (roadshow, показ компании инвесторам) может начаться с 9 ноября, дебют — до 26 ноября (Bloomberg, сверить).","SpaceX уже на бирже; после слабых отчётов техов акции опускались ниже цены размещения. Jio Platforms выросла на 21,5% в первый день торгов 28 октября.","M&A (Mergers & Acquisitions, слияния и поглощения): DoorDash покупает Instacart за $17 млрд. Marvell ведёт переговоры о покупке Lumentum.","По FT Anthropic идёт на IPO с оценкой $1,5 трлн, но по CNBC часть инвесторов называет её завышенной и ждёт снижения (сверить итог).","CNBC (7 ноября): IPO (Initial Public Offering, первичное размещение) Anthropic встретило негативную реакцию после выборов — избиратели выразили недоверие к ИИ и центрам обработки данных (пересказ, сверить)."]},{"tag":"Китай","title":"Китай: рост 4,5% за счёт экспорта, ограничения на технологии","lead":"ВВП Китая в 3-м квартале вырос на 4,5% г/г (во 2-м — 4,3%). За 9 месяцев рост 4,6% при цели на год 4,5–5%.","facts":["ВВП Китая в 3-м квартале +4,5% г/г (во 2-м — 4,3%). За 9 месяцев рост 4,6% при цели на год 4,5–5%.","Рост держится на промышленности и высокотехнологичном производстве: high-tech +14,3% за 9 месяцев. Внутренний спрос слабый: розничные продажи в сентябре +1,1% г/г.","6 ноября китайский механизм проверки иностранных инвестиций отказал SoftBank в покупке робототехнических активов ABB в КНР (сообщила ABB).","Китайская AI-лаборатория Moonshot, которую Белый дом обвинил в удалённом доступе к чипам Nvidia, искала доступ к Blackwell через дата-центры в Европе (CNBC).","«Газпром» в четвёртый раз с начала ноября установил рекорд суточных поставок газа в Китай по «Силе Сибири». Курс юаня 12,26 ₽."]},{"tag":"Крипта","title":"Крипта: падение вместе с техами и последствия взлома Binance","lead":"Биткоин 7 ноября около $76 тыс. (+0,8% за сутки, −1,6% за неделю); 6 ноября пробивал $75 тыс. вниз впервые с августа. Ethereum около $2 245. Крипта следует за Nasdaq.","facts":["После распродажи на ИИ ликвидировано позиций с плечом (leverage) более чем на $1 млрд. Из американских биткоин-ETF (exchange-traded fund, биржевой фонд) вышло $430 млн.","Binance оценила ущерб от взлома в $6,3 млрд — крупнейший в истории крипты. По оценке Security Alliance, у хакеров был доступ около 8 недель до вывода средств.","Бразильская биржа Mercado Bitcoin: хакер ещё около 4 часов выводил средства после заявления о локализации атаки (Bitquery).","Strategy (бывшая MicroStrategy) возобновила покупки биткоина: +811 BTC за неделю (2 ноября).","В России Мосбиржа готовит торги криптовалютой: технологическая готовность к 1 декабря (условия и круг инвесторов сверить)."]}]},"risk":{"asof":"05.11.2026","years":[{"y":2016,"ofz":14.82,"corp":10.79,"vdo":null,"key":10.6,"infl":5.38},{"y":2017,"ofz":12.79,"corp":12.28,"vdo":null,"key":9.1,"infl":2.52},{"y":2018,"ofz":2.12,"corp":4.42,"vdo":null,"key":7.4,"infl":4.27},{"y":2019,"ofz":19.99,"corp":14.3,"vdo":null,"key":7.3,"infl":3.05},{"y":2020,"ofz":8.54,"corp":8.25,"vdo":null,"key":5.05,"infl":4.91},{"y":2021,"ofz":-4.94,"corp":-0.05,"vdo":5.82,"key":5.75,"infl":8.39},{"y":2022,"ofz":3.72,"corp":8.27,"vdo":-0.74,"key":10.6,"infl":11.92},{"y":2023,"ofz":0.76,"corp":3.18,"vdo":13.0,"key":9.95,"infl":7.42},{"y":2024,"ofz":-2.11,"corp":4.13,"vdo":0.6,"key":17.5,"infl":9.5},{"y":2025,"ofz":23.09,"corp":26.5,"vdo":31.14,"key":19.2,"infl":5.59}],"cum":{"10":{"from":2016,"to":2025,"n":10,"r":{"ofz":{"x":2.062,"cagr":7.5,"real":1.124},"corp":{"x":2.364,"cagr":8.98,"real":1.288},"key":{"x":2.631,"cagr":10.16,"real":1.434},"infl":{"x":1.835,"cagr":6.26,"real":1.0}}},"5":{"from":2021,"to":2025,"n":5,"r":{"ofz":{" erage Cost of Capital) — средневзвешенная стоимость капитала","d":"Средняя цена денег компании: смесь того, что хотят получать владельцы (Ke) и кредиторы (Kd после налога), с учётом долей. Формула: E/(D+E)×Ke + D/(D+E)×Kd×(1−t), где E — деньги владельцев, D — долг. Для российских компаний сейчас обычно 17–22%."},{"p":["EBITDA"],"t":"EBITDA (Earnings Before Interest, Taxes, Depreciation and Amortization)","d":"Прибыль до вычета процентов, налогов и амортизации (EBIT + амортизация). Грубо показывает, сколько денег приносит основная работа компании. На неё опираются мультипликаторы EV/EBITDA и ND/EBITDA (чистый долг к EBITDA). Для банков не подходит."},{"p":["EBIT"],"t":"EBIT (Earnings Before Interest and Taxes)","d":"Операционная прибыль: что остаётся от выручки после себестоимости, остальных расходов и амортизации, но до процентов по долгам и налогов. Показывает, насколько прибылен сам бизнес."},{"p":["EV"],"t":"EV — стоимость бизнеса (Enterprise Value)","d":"Стоимость всего бизнеса для всех, кто в него вложил деньги (и владельцев, и кредиторов). Считают так: капитализация + долг − деньги на счетах + доли меньшинства (+ префы, аренда) − ассоциированные. Пример: капитализация 100, долг 40, деньги 10 — EV = 130."},{"p":["DCF"],"t":"DCF (Discounted Cash Flow) — дисконтированные денежные потоки","d":"Способ оценить компанию: прогнозируем, сколько свободных денег она принесёт в будущем, пересчитываем их в сегодняшние по ставке WACC (средней цене денег компании) и прибавляем оценку всего, что будет после прогноза (терминальную стоимость)."},{"p":["CAPM"],"t":"CAPM (Capital Asset Pricing Model) — модель ценообразования активов","d":"Формула для расчёта доходности, которую ждут владельцы акций: Ke = Rf + β × ERP, то есть безопасная ставка плюс бета (насколько акция «качается» вместе с рынком) умноженная на премию за риск рынка. Пример: 16% + 1,2 × 5% = 22%."},{"p":["EVA"],"t":"EVA (Economic Value Added) — экономическая добавленная стоимость","d":"Показывает, создаёт ли компания стоимость: (ROIC − WACC) × вложенный капитал. ROIC — сколько прибыли приносит каждый вложенный рубль, WACC — сколько этот рубль стоит компании. Если EVA больше нуля, компания зарабатывает больше, чем стоят деньги в ней. Для банков не подходит."},{"p":["CAPEX"],"t":"CAPEX (Capital Expenditures) — капитальные затраты","d":"Деньги, потраченные на покупку или строительство долгих вещей: станков, зданий, оборудования. Эти траты вычитают, когда считают свободные деньги компании (FCF)."},{"p":["LBO"],"t":"LBO (Leveraged Buyout) — выкуп с плечом","d":"Покупка компании инвестиционным фондом в основном на заёмные деньги (плечо), которые потом гасят деньгами самой купленной компании. Цель фонда — доходность (IRR) 20–25% в год."},{"p":["M&A"],"t":"M&A (Mergers & Acquisitions) — слияния и поглощения","d":"Слияния и поглощения: сделки, когда компании покупают, продают или объединяют. Банк помогает либо продавцу (sell-side), либо покупателю (buy-side)."},{"p":["P/E"],"t":"P/E — цена / прибыль","d":"Во сколько раз цена компании больше её годовой чистой прибыли (капитализация / чистая прибыль). Показывает, за сколько лет прибыли окупится покупка. Пример: P/E 7 — 7 лет. В России около 7 (медиана, то есть типичное значение), в S&P 500 около 26."},{"p":["ROE"],"t":"ROE (Return on Equity) — рентабельность капитала","d":"Рентабельность капитала: сколько чистой прибыли приносит каждый рубль владельцев (чистая прибыль / собственный капитал). Пример: прибыль 20, капитал 100 — ROE 20%. Если ROE выше Ke (доходности, которую ждут владельцы), компания должна стоить дороже своей балансовой стоимости (P/B больше 1) — особенно банк."},{"p":["ERP"],"t":"ERP (Equity Risk Premium) — премия за риск акций","d":"Сколько дополнительных процентов в год ждут от акций по сравнению с самым надёжным вложением (гособлигациями). В США 3,7% (Дамодаран, сент. 2026); в рублях брокеры закладывают 5–8%."},{"p":["чист(?:ый|ого|ому|ым) долг[а-яёА-ЯЁa-zA-Z]*"],"t":"Чистый долг (Net Debt)","d":"Всё, что компания должна, минус деньги, которые у неё уже есть на счетах. Пример: долг 100 млн, на счетах 30 млн — чистый долг 70 млн. Если денег больше, чем долга, чистый долг отрицательный — это хорошо."},{"p":["оборотн(?:ый|ого|ому|ым) капитал[а-яёА-ЯЁa-zA-Z]*"],"t":"Оборотный капитал (NWC — Net Working Capital)","d":"Деньги, застрявшие в повседневных делах компании: товар на складе плюс то, что должны нам покупатели, минус то, что мы должны поставщикам. Чем больше этих денег «заморожено», тем меньше свободных денег остаётся у компании."},{"p":["дебиторк[а-яёА-ЯЁa-zA-Z]*","дебиторск[а-яёА-ЯЁa-zA-Z]* задолженност[а-яёА-ЯЁa-zA-Z]*"],"t":"Дебиторская задолженность","d":"Деньги, которые покупатели ещё не заплатили за товар, уже полученный от компании. Пример: отгрузили товар на 100 тыс. ₽ с оплатой через месяц — эти 100 тыс. ₽ пока «висят» как долг покупателя."},{"p":["кредиторк[а-яёА-ЯЁa-zA-Z]*","кредиторск[а-яёА-ЯЁa-zA-Z]* задолженност[а-яёА-ЯЁa-zA-Z]*"],"t":"Кредиторская задолженность","d":"Деньги, которые сама компания должна поставщикам за уже полученный товар. Это как беспроцентный кредит: пока не заплатили, можно пользоваться чужими деньгами бесплатно."},{"p":["амортизаци[а-яёА-ЯЁa-zA-Z]*"],"t":"Амортизация (D&A — Depreciation & Amortization)","d":"Постепенное «списание» стоимости оборудования и других долгих покупок. Пример: станок за 1 млн, служит 10 лет — каждый год в расходы идёт 100 тыс. ₽, хотя деньги реально потратили один раз. Из-за этого прибыль и налог меньше, а деньги в кассе остаются."},{"p":["выручк[а-яёА-ЯЁa-zA-Z]*"],"t":"Выручка (Revenue)","d":"Все деньги, которые компания заработала продажами за период, до вычета расходов (без налога НДС). Это самая первая, «верхняя» строка отчёта о прибылях и убытках."},{"p":["себестоимост[а-яёА-ЯЁa-zA-Z]*"],"t":"Себестоимость (COGS — Cost of Goods Sold)","d":"Сколько стоило сделать то, что компания продала: сырьё, зарплата рабочих на производстве, электричество. Пример: продали куртку за 5 000 ₽, на её пошив ушло 3 000 ₽ — себестоимость 3 000 ₽."},{"p":["чист(?:ая|ой|ую) прибыл[а-яёА-ЯЁa-zA-Z]*"],"t":"Чистая прибыль (Net Income)","d":"Сколько остаётся у компании после вычета всех расходов, процентов по долгам и налогов. Эта прибыль принадлежит владельцам (акционерам), из неё им выплачивают дивиденды."},{"p":["(?<!тонкой )(?<!Тонкой )капитализаци[а-яёА-ЯЁa-zA-Z]*"],"t":"Рыночная капитализация","d":"Сколько стоит вся компания на бирже: цена одной акции, умноженная на число акций. Пример: акция 100 ₽, акций 1 млн — компания стоит 100 млн ₽."},{"p":["дисконтировани[а-яёА-ЯЁa-zA-Z]*","дисконтир[а-яёА-ЯЁa-zA-Z]+"],"t":"Дисконтирование","d":"Пересчёт будущих денег в сегодняшние: 100 ₽ через год стоят меньше, чем 100 ₽ сейчас, ведь сегодняшние можно вложить и заработать. Пример: при ставке 10% 110 ₽ через год равны 100 ₽ сегодня. Чем дальше срок и выше ставка, тем дешевле будущие деньги."},{"p":["ставк[а-яёА-ЯЁa-zA-Z]* дисконтирования"],"t":"Ставка дисконтирования","d":"Процент в год, который инвестор хочет получать за риск вложения. Чем рискованнее, тем он выше. Для всей компании это WACC (средняя цена всех денег компании), для владельцев — Ke (доходность, которую ждут акционеры)."},{"p":["терминальн[а-яёА-ЯЁa-zA-Z]* стоимост[а-яёА-ЯЁa-zA-Z]*","постпрогнозн[а-яёА-ЯЁa-zA-Z]* стоимост[а-яёА-ЯЁa-zA-Z]*"],"t":"Терминальная стоимость (TV — Terminal Value)","d":"Оценка всего, что компания заработает после последнего года прогноза (обычно прогноз рисуют на 5–10 лет). Считают по формуле Гордона или через мультипликатор выхода (во сколько раз прибыль обычно оценивают при продаже). Часто это 60–80% всей оценки компании."},{"p":["модел[а-яёА-ЯЁa-zA-Z]* Гордона","формул[а-яёА-ЯЁa-zA-Z]* Гордона"],"t":"Модель Гордона","d":"Формула, которая оценивает бесконечный поток денег, растущий каждый год на одну и ту же долю g: первый платёж делим на (r − g), где r — требуемая доходность. Пример: платёж 10, r = 15%, g = 5% дают 10 / 0,10 = 100. Работает, только если r больше g."},{"p":["бет(?:а|ы|у|ой)(?![а-я])"],"t":"Бета (β)","d":"Показывает, насколько акция «качается» вместе с рынком. Бета = 1 — движется как рынок, 1,5 — в полтора раза сильнее (и вверх, и вниз), меньше 1 — спокойнее рынка."},{"p":["премия за риск","премии за риск"],"t":"Премия за риск (ERP — Equity Risk Premium)","d":"Дополнительная доходность, которую инвесторы ждут от акций сверх безопасных вложений (например, гособлигаций) — плата за риск. В США около 3,7% (Дамодаран, сентябрь 2026)."},{"p":["безрисков[а-яёА-ЯЁa-zA-Z]* ставк[а-яёА-ЯЁa-zA-Z]*"],"t":"Безрисковая ставка (Rf)","d":"Доходность самого надёжного вложения — государственных облигаций в той же валюте и на тот же срок. В России это ОФЗ на 10 лет (около 16,6% в октябре 2026), в США — казначейские облигации на 10 лет (около 5,2%)."},{"p":["стоимост[а-яёА-ЯЁa-zA-Z]* собственного капитала"],"t":"Стоимость собственного капитала (Ke)","d":"Сколько процентов в год хотят получать владельцы компании за риск вложения в её акции. Обычно считают по формуле CAPM: безопасная ставка + бета × премия за риск (Rf + β × ERP)."},{"p":["стоимост[а-яёА-ЯЁa-zA-Z]* долга"],"t":"Стоимость долга (Kd)","d":"Процент, под который компания берёт в долг. В расчётах берут его после налога: Kd × (1 − t), где t — ставка налога, потому что проценты по долгу уменьшают налог. Пример: 20% при налоге 25% дают 15%."},{"p":["налогов[а-яёА-ЯЁa-zA-Z]* щит[а-яёА-ЯЁa-zA-Z]*"],"t":"Налоговый щит","d":"Экономия на налоге благодаря тому, что проценты по долгу вычитаются из налогооблагаемой прибыли. Пример: проценты 100 тыс. ₽, налог 25% — компания экономит 25 тыс. ₽. Поэтому долг для компании чуть дешевле, чем кажется."},{"p":["мультипликатор[а-яёА-ЯЁa-zA-Z]*"],"t":"Мультипликатор","d":"Во сколько раз цена компании больше её показателя: прибыли, выручки и т. д. (примеры: P/E, EV/EBITDA). Пример: компания стоит 700 млн, прибыль 100 млн — мультипликатор 7, то есть рынок платит 7 ₽ за каждый рубль прибыли."},{"p":["премия за контроль","премии за контроль","премию за контроль"],"t":"Премия за контроль","d":"Наценка сверх биржевой цены, которую покупатель платит, чтобы получить контроль над компанией: право решать, как ею управлять. Обычно 20–40%. Пример: акция стоит 100 ₽ — покупатель готов заплатить 130 ₽."},{"p":["синерги[а-яёА-ЯЁa-zA-Z]*"],"t":"Синергии","d":"Эффект «1 + 1 = 3»: после объединения двух компаний вместе они зарабатывают больше или тратят меньше, чем по отдельности. Пример: слили две бухгалтерии и сэкономили на зарплатах."},{"p":["гудвил[а-яёА-ЯЁa-zA-Z]*"],"t":"Гудвилл (Goodwill)","d":"Сколько покупатель переплатил за компанию сверх стоимости её реального имущества (за вычетом долгов). Пример: имущество стоит 80 млн, купили за 100 млн — гудвилл 20 млн (за бренд, клиентов, команду). Раз в год проверяют, не обесценился ли он."},{"p":["дол(?:я|и|ю) меньшинства","доли меньшинства","неконтролирующ[а-яёА-ЯЁa-zA-Z]* дол[а-яёА-ЯЁa-zA-Z]*"],"t":"Доли меньшинства (NCI — Non-Controlling Interest)","d":"Часть дочерней компании, которая принадлежит не нам, а другим владельцам. Пример: мы владеем 80% дочки — остальные 20% это доля меньшинства. Когда считаем стоимость акций материнской компании, эту часть вычитают."},{"p":["дюраци[а-яёА-ЯЁa-zA-Z]*"],"t":"Дюрация","d":"Показатель в годах: через сколько в среднем вы получите свои деньги назад по облигации. Чем больше дюрация, тем сильнее цена облигации реагирует на ставки: при дюрации 5 рост ставок на 1 п.п. (процентный пункт, например с 14% до 15%) снизит цену примерно на 5%."},{"p":["доходност[а-яёА-ЯЁa-zA-Z]* к погашению"],"t":"Доходность к погашению (YTM — Yield to Maturity)","d":"Сколько процентов в год вы заработаете, если купите облигацию по сегодняшней цене и продержите до дня погашения (когда вам вернут номинал). Это удобный способ сравнить разные облигации между собой."},{"p":["купон[а-яёА-ЯЁa-zA-Z]*"],"t":"Купон","d":"Регулярная выплата процентов по облигации, обычно считается от её номинала. Пример: облигация номиналом 1 000 ₽ с купоном 10% в год приносит 100 ₽ в год."},{"p":["номинал(?:а|ом|у|ы|ов)?(?![а-я])"],"t":"Номинал облигации","d":"Сумма, которую выпустивший облигацию вернёт владельцу в день погашения, обычно 1 000 ₽. Цену облигации на бирже указывают в процентах от номинала: цена 95% значит 950 ₽."},{"p":["оферт[а-яёА-ЯЁa-zA-Z]*"],"t":"Оферта (по облигации)","d":"Дата, когда выпустивший облигацию обязан выкупить её по желанию владельца (или сам может погасить досрочно). Доходность часто считают именно до этой даты, потому что деньги вернутся раньше срока."},{"p":["кредитн[а-яёА-ЯЁa-zA-Z]* спред[а-яёА-ЯЁa-zA-Z]*","спред[а-яёА-ЯЁa-zA-Z]*"],"t":"Спред","d":"Разница между двумя ставками доходности. Кредитный спред — это разница между доходностью облигации компании и ОФЗ (гособлигаций) того же срока: надбавка за то, что компания может не вернуть долг. Пример: 18% − 15% = спред 3 п.п."},{"p":["ковенант[а-яёА-ЯЁa-zA-Z]*"],"t":"Ковенант","d":"Условие в кредитном договоре или в условиях облигации, которое компания обязана соблюдать. Пример: долг не должен превышать прибыль (EBITDA) более чем в 3 раза. Если нарушила, кредитор вправе потребовать вернуть деньги досрочно."},{"p":["ключев[а-яёА-ЯЁa-zA-Z]* ставк[а-яёА-ЯЁa-zA-Z]*"],"t":"Ключевая ставка","d":"Главная ставка Банка России (ЦБ): под этот процент он даёт деньги банкам и принимает у них вклады. От неё зависят ставки по вкладам, кредитам и облигациям во всей стране. Сейчас 14% (с 27.07.2026)."},{"p":["кривая доходности","кривой доходности","кривую доходности"],"t":"Кривая доходности","d":"График, который показывает, сколько процентов платят по гособлигациям на разные сроки. Обычно чем дольше срок, тем выше процент — это норма. Если короткие ставки выше длинных (инвертированная кривая), рынок ждёт, что ставки снизятся."},{"p":["дивидендн[а-яёА-ЯЁa-zA-Z]* доходност[а-яёА-ЯЁa-zA-Z]*"],"t":"Дивидендная доходность","d":"Сколько процентов в год составляют дивиденды (выплаты владельцам) от цены акции. Пример: дивиденд 10 ₽ в год, акция стоит 100 ₽ — доходность 10%."},{"p":["байбэк[а-яёА-ЯЁa-zA-Z]*","обратн[а-яёА-ЯЁa-zA-Z]* выкуп[а-яёА-ЯЁa-zA-Z]*"],"t":"Байбэк (buyback)","d":"Компания покупает на бирже собственные акции. Это ещё один способ вернуть деньги владельцам, как дивиденды. Акций становится меньше, поэтому прибыль на одну акцию (EPS) растёт."},{"p":["волатильност[а-яёА-ЯЁa-zA-Z]*"],"t":"Волатильность (σ)","d":"Насколько сильно и часто скачет цена актива. Измеряют в % за год: чем больше число, тем рискованнее актив. Пример: волатильность 30% — цена в течение года обычно отклоняется от среднего примерно на треть."},{"p":["ликвидност[а-яёА-ЯЁa-zA-Z]*"],"t":"Ликвидность","d":"Насколько быстро и без потери в цене актив можно превратить в деньги. Наличные — самые ликвидные, квартиру продать сложнее. Для компании это ещё и способность вовремя платить по срочным долгам."},{"p":["инфляци[а-яёА-ЯЁa-zA-Z]*"],"t":"Инфляция (π)","d":"Рост цен в стране: на те же деньги со временем можно купить меньше. В России в сентябре 2026 цены выросли на 6,35% за год, цель ЦБ — 4%."},{"p":["опцион[а-яёА-ЯЁa-zA-Z]*"],"t":"Опцион","d":"Договор, который даёт право (но не обязывает) купить или продать актив по заранее оговорённой цене до определённой даты. Право купить — колл, право продать — пут. Пример: колл на акцию по 100 ₽ выгоден, если акция подорожает до 120 ₽."},{"p":["фьючерс[а-яёА-ЯЁa-zA-Z]*","форвард[а-яёА-ЯЁa-zA-Z]*"],"t":"Форвард / фьючерс","d":"Договор купить или продать что-то в будущем по цене, которую согласовали сегодня. Форвард — частная договорённость, фьючерс — такой же договор, но стандартный и торгуется на бирже."},{"p":["стейблкоин[а-яёА-ЯЁa-zA-Z]*"],"t":"Стейблкоин","d":"Криптовалюта, цена которой привязана к обычной валюте, чаще к доллару (USDT, USDC), поэтому не скачет, как биткоин. Её выпускает компания, которая держит резервы в обеспечение."},{"p":["МСФО"],"t":"МСФО (IFRS — International Financial Reporting Standards)","d":"Международные стандарты финансовой отчётности (на английском IFRS): единые правила, по которым компании составляют отчёты. По ним удобно сравнивать публичные компании, то есть те, чьи акции торгуются на бирже."},{"p":["маржинальност[а-яёА-ЯЁa-zA-Z]*","марж(?:а|и|у|ой)(?![а-я])"],"t":"Маржа","d":"Какая доля выручки превращается в прибыль. Пример: выручка 100 ₽, прибыль 15 ₽ — маржа 15%. Бывает валовая (после себестоимости), по EBITDA и чистая (после всех расходов и налогов)."},{"p":["ОФЗ"],"t":"ОФЗ","d":"Облигации федерального займа — долговые бумаги, которые выпускает государство России. ОФЗ-ПД платят постоянный купон, ОФЗ-ПК — плавающий (зависит от ставки), у ОФЗ-ИН растёт номинал вместе с инфляцией."},{"p":["КБД"],"t":"КБД (кривая бескупонной доходности)","d":"Кривая бескупонной доходности: график, который строят ЦБ и Мосбиржа и который показывает, сколько процентов приносят ОФЗ на разные сроки. По нему определяют безопасную ставку и считают надбавки за риск (спреды)."},{"p":["free float","фрифлоат[а-яёА-ЯЁa-zA-Z]*"],"t":"Free float","d":"Доля акций, которые свободно покупают и продают на бирже, то есть которые не принадлежат главным владельцам компании. Чем она больше, тем проще купить или продать акции."},{"p":["IMOEX","индекс[а-яёА-ЯЁa-zA-Z]* Мосбиржи","индекс[а-яёА-ЯЁa-zA-Z]* МосБиржи"],"t":"Индекс Мосбиржи (IMOEX — Moscow Exchange Index)","d":"Главный показатель российского рынка акций в рублях. Он считается по 40–50 крупнейшим компаниям, которые легко купить и продать; чем компания дороже на бирже и чем больше её акций в свободном обращении (free float), тем сильнее она влияет на индекс. Если индекс растёт, акции в среднем дорожают."},{"p":["S&P 500"],"t":"S&P (Standard & Poor's) 500","d":"Индекс 500 крупнейших американских компаний. По нему смотрят, как в целом дела на рынке акций США: если индекс растёт, акции в среднем дорожают."},{"p":["Дамодаран[а-яёА-ЯЁa-zA-Z]*"],"t":"Асват Дамодаран","d":"Профессор Нью-Йоркского университета (NYU Stern), самый известный специалист по оценке компаний. Бесплатно публикует нужные данные: премию за риск, беты и мультипликаторы по отраслям и странам."},{"p":["10\\-K","10\\-Q","8\\-K"],"t":"10-K / 10-Q / 8-K — Формы отчётности для SEC (Securities and Exchange Commission, Комиссия по ценным бумагам и биржам США)","d":"Американские отчёты: годовой, квартальный и о существенном событии. Публикуются на сайте SEC (EDGAR)."},{"p":["ABB"],"t":"ABB — Ускоренное формирование книги заявок (Accelerated Bookbuilding)","d":"Быстрая (за 1–2 дня) продажа крупного пакета акций крупным инвесторам, например фондам и банкам. Банк быстро собирает заявки и продаёт всё оптом, как распродажа партии товара одному-двум крупным покупателям"},{"p":["ABS"],"t":"ABS — Облигация, обеспеченная активами (Asset-Backed Security)","d":"Бумага, обеспеченная пулом других кредитов или платежей (автокредиты, потребкредиты, лизинг)."},{"p":["Absolute priority rule"],"t":"Absolute priority rule — Правило абсолютного приоритета","d":"Младшие кредиторы и акционеры не получают ничего, пока старшие не получили всё."},{"p":["Accretion","Dilution"],"t":"Accretion / Dilution — Прибавка / разбавление прибыли на акцию","d":"Насколько вырастет или упадёт прибыль на акцию (EPS) у покупателя после сделки. «Accretion» — прибавка, «dilution» — разбавление. Если прибыль на акцию выросла, сделка выгодна акционерам покупателя"},{"p":["Accrual accounting"],"t":"Accrual accounting — Метод начисления","d":"Доходы и расходы записывают, когда они случились, а не когда пришли или ушли деньги. Продал товар в долг — выручка есть сразу, хотя денег ещё нет."},{"p":["Acquiring"],"t":"Acquiring — Эквайринг","d":"Услуга банка магазину: принимать оплату картами. Банк берёт комиссию с каждой покупки."},{"p":["Add\\-backs"],"t":"Add-backs — Корректировки EBITDA (Earnings Before Interest, Taxes, Depreciation and Amortization)","d":"Статьи, которые прибавляют к EBITDA, чтобы получить скорректированную EBITDA (Adjusted EBITDA). Часть нормальна (разовые расходы), часть завышает базу, поэтому проверяют их расшифровку и лимиты корректировок в кредитном договоре."},{"p":["Adjusted EBITDA"],"t":"Adjusted EBITDA — Скорректированная EBITDA (EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization)","d":"EBITDA без разовых и нетипичных статей (реструктуризация, судебные издержки). Компании любят «приукрасить», поэтому корректировки надо проверять."},{"p":["ADR","GDR"],"t":"ADR / GDR — Депозитарные расписки (ADR — American Depositary Receipt; GDR — Global Depositary Receipt)","d":"Бумаги, которые торгуются на иностранной бирже и представляют акции российской или другой компании. ADR — на американской, GDR — на других."},{"p":["Agency problem"],"t":"Agency problem — Проблема агента","d":"Интересы менеджеров (агентов) и акционеров (принципалов) не совпадают: менеджер хочет больше бонусов и меньше риска."},{"p":["Alpha"],"t":"Alpha — Альфа","d":"Доходность управляющего сверх той, которую можно было ожидать при его уровне риска. Показывает мастерство."},{"p":["Altman Z\\-score"],"t":"Altman Z-score — Z-модель Альтмана","d":"Формула из пяти коэффициентов, которая предсказывает банкротство. Ниже 1,8 — зона риска."},{"p":["AML"],"t":"AML — Противодействие отмыванию денег (Anti-Money Laundering)","d":"Правила против отмывания денег. В РФ — закон 115-ФЗ (сверить)."},{"p":["Amortization"],"t":"Amortization — Амортизация (нематериальных активов)","d":"То же списание, но для нематериальных вещей: программ, лицензий, патентов."},{"p":["Amortization of goodwill"],"t":"Amortization of goodwill — Амортизация гудвилла","d":"По МСФО гудвилл не амортизируют, а проверяют на обесценение. По РСБУ амортизируют 20 лет (сверить)."},{"p":["Annuity"],"t":"Annuity — Аннуитет","d":"Ряд одинаковых платежей через равные промежутки: ипотека, аренда, купоны."},{"p":["Anti\\-dilution"],"t":"Anti-dilution — Защита от размытия","d":"Если следующий раунд проходит дешевле предыдущего, инвестор получает дополнительные акции, чтобы сохранить свою долю."},{"p":["APT"],"t":"APT — Теория арбитражного ценообразования (Arbitrage Pricing Theory)","d":"Теория арбитражного ценообразования: доходность определяется несколькими факторами (инфляция, ВВП и т. п.), а не одной бетой."},{"p":["APV"],"t":"APV — Скорректированная приведённая стоимость (Adjusted Present Value)","d":"Сначала считают стоимость компании так, будто долга нет, потом прибавляют сегодняшнюю стоимость (PV) налоговой экономии от процентов по долгу (налогового щита). Проценты по кредиту уменьшают налог, и эту выгоду учитывают отдельной строкой"},{"p":["Arbitrage"],"t":"Arbitrage — Арбитраж","d":"Покупка и продажа одного и того же актива на разных рынках, чтобы без риска забрать разницу цен. Такие возможности быстро исчезают."},{"p":["ARPU"],"t":"ARPU — Средняя выручка на пользователя (Average Revenue Per User)","d":"Сколько выручки в среднем приносит один пользователь (телеком, интернет). Если оператор за месяц получил 1000 рублей от 10 абонентов, ARPU равен 100 рублей"},{"p":["ARR"],"t":"ARR — Годовая повторяющаяся выручка (Annual Recurring Revenue)","d":"Выручка за год, которая повторяется из года в год, например по подписке (SaaS — программы по подписке). Похоже на абонемент в спортзал: деньги приходят регулярно, а не разово"},{"p":["Asset management"],"t":"Asset management — Управление активами","d":"Бизнес по управлению чужими деньгами за комиссию: ПИФы (паевые инвестиционные фонды), доверительное управление, пенсионные деньги."},{"p":["Asset turnover"],"t":"Asset turnover — Оборачиваемость активов","d":"Сколько рублей выручки приносит каждый рубль активов."},{"p":["Audit opinion"],"t":"Audit opinion — Аудиторское заключение","d":"Вывод аудитора: отчётность достоверна (чистое заключение), с оговоркой, отрицательное или отказ."},{"p":["AUM"],"t":"AUM — Активы под управлением (Assets Under Management)","d":"Сколько денег находится под управлением компании. Комиссия считается от AUM."},{"p":["Backlog"],"t":"Backlog — Портфель заказов","d":"Подписанные, но ещё не выполненные заказы. Показывает будущую выручку строителей и машиностроителей."},{"p":["Backwardation"],"t":"Backwardation — Бэквордация","d":"Фьючерсы на более поздний срок дешевле ближайших. Означает дефицит товара сейчас."},{"p":["Balance check"],"t":"Balance check — Проверка баланса","d":"Строка в модели: активы минус обязательства минус капитал. Должна быть ноль во всех годах."},{"p":["Balance sheet"],"t":"Balance sheet — Баланс","d":"Снимок компании на одну дату: что у неё есть (активы) и откуда это взялось (долг и капитал)."},{"p":["Balloon payment"],"t":"Balloon payment — Баллонный платёж","d":"Последний платёж по кредиту намного больше предыдущих. До него платят мало."},{"p":["Bankruptcy"],"t":"Bankruptcy — Банкротство","d":"Состояние, когда должник не может платить по долгам. Имущество продают, деньги делят по очереди."},{"p":["Basel III"],"t":"Basel III — Базель III","d":"Международные правила для банков: сколько капитала и ликвидности держать, чтобы пережить кризис."},{"p":["Basis"],"t":"Basis — Базис; база для сравнения","d":"1) На срочном рынке — разница между ценой актива на споте и ценой фьючерса на него; к дате исполнения фьючерса сходится к нулю. 2) В аналитике — база сравнения: «эффект низкой базы» — рост выглядит большим, потому что в прошлом периоде показатель был маленьким."},{"p":["Behavioral finance"],"t":"Behavioral finance — Поведенческие финансы","d":"Направление о том, как люди реально принимают финансовые решения: с ошибками, страхом и жадностью, а не как «рациональные агенты»."},{"p":["Benchmark"],"t":"Benchmark — Бенчмарк","d":"Индекс, с которым сравнивают результат управляющего. Обыграл индекс — молодец."},{"p":["Beneficial owner"],"t":"Beneficial owner — Бенефициарный владелец","d":"Человек, который в итоге владеет компанией или контролирует её, даже через цепочку фирм."},{"p":["Big Four"],"t":"Big Four — Большая четвёрка","d":"Четыре крупнейшие в мире компании, которые проверяют отчётность других компаний (аудит) и дают налоговые и консалтинговые услуги: Deloitte (Делойт), PwC (ПрайсуотерхаусКуперс), EY (Эрнст энд Янг), KPMG (КПМГ). В 2022 году ушли из России; бывшие российские офисы теперь называются «Деловые решения и технологии» (бывш. Deloitte), «Технологии Доверия» (бывш. PwC), Б1 (бывш. EY), Kept (бывш. KPMG)."},{"p":["Black\\-Scholes"],"t":"Black-Scholes — Модель Блэка — Шоулза","d":"Формула справедливой цены европейского опциона. Использует цену актива, страйк, срок, ставку и волатильность."},{"p":["Blue chip"],"t":"Blue chip — «Голубые фишки»","d":"Акции крупнейших стабильных компаний с долгой историей. В России: Сбербанк, Газпром, Лукойл."},{"p":["BNPL"],"t":"BNPL — «Купи сейчас — плати потом», оплата частями (Buy Now, Pay Later)","d":"Оплата частями без процентов: сервис платит магазину сразу, покупатель платит сервису по частям."},{"p":["Board of directors"],"t":"Board of directors — Совет директоров","d":"Орган, который назначает менеджмент, одобряет стратегию и крупные сделки от имени акционеров."},{"p":["Bond"],"t":"Bond — Облигация","d":"Долговая бумага: ты одалживаешь деньги эмитенту, он платит проценты (купоны) и в конце возвращает номинал."},{"p":["Book building"],"t":"Book building — Сбор заявок","d":"Сбор заявок инвесторов по цене и количеству, по которому определяют цену и распределение акций при размещении."},{"p":["Book value"],"t":"Book value — Балансовая стоимость","d":"Сколько стоит актив или вся компания по записям в балансе."},{"p":["Bookrunner"],"t":"Bookrunner — Ведущий организатор размещения","d":"Банк, который собирает заявки инвесторов при размещении акций или облигаций. Он ведёт «книгу заявок»: список, кто сколько готов купить и по какой цене"},{"p":["BoP","EoP"],"t":"BoP / EoP — Beginning / End of Period (начало / конец периода)","d":"Остаток на начало и на конец периода. В моделях строки долга, основных средств и аренды считают по цепочке: конец периода — это начало плюс приход минус расход, а конец одного года становится началом следующего."},{"p":["Break fee"],"t":"Break fee — Неустойка за выход из сделки (termination fee)","d":"Неустойка, которую платит цель, если выходит из сделки ради другого предложения. Неустойка — это штраф за срыв договорённости. Цель — компания, которую покупают"},{"p":["Break\\-even"],"t":"Break-even — Точка безубыточности","d":"Объём продаж, при котором прибыль равна нулю: маржинальный доход как раз покрыл постоянные расходы."},{"p":["Bridge"],"t":"Bridge — Мост","d":"Разложение изменения показателя на причины: «EBITDA выросла на 10: +15 цена, −3 объём, −2 расходы»."},{"p":["Broker"],"t":"Broker — Брокер","d":"Посредник, через которого частный инвестор торгует на бирже. Берёт комиссию."},{"p":["Budget deficit"],"t":"Budget deficit — Дефицит бюджета","d":"Расходы государства больше доходов. Покрывается займами или резервами."},{"p":["Bulge bracket"],"t":"Bulge bracket — Крупнейшие инвестбанки","d":"Крупнейшие глобальные инвестбанки: Goldman Sachs, Morgan Stanley, JPMorgan, Bank of America, Citi."},{"p":["Bull","Bear market"],"t":"Bull / Bear market — Рынок быков / медведей","d":"Бычий рынок — растущий, медвежий — падающий (обычно от пика минус 20% и больше)."},{"p":["Bullet repayment"],"t":"Bullet repayment — Погашение разом","d":"Весь основной долг возвращают одним платежом в конце срока, до этого платят только проценты."},{"p":["Burn rate"],"t":"Burn rate — Скорость сжигания денег","d":"Сколько денег в месяц компания тратит сверх того, что зарабатывает. Характерно для стартапов."},{"p":["Business judgment rule"],"t":"Business judgment rule — Правило делового решения","d":"Суд не наказывает директора за неудачное, но добросовестное и обоснованное решение."},{"p":["CAC"],"t":"CAC — Стоимость привлечения клиента (Customer Acquisition Cost)","d":"Сколько стоит привлечь одного клиента: вся реклама и продажи, делённые на новых клиентов."},{"p":["CAGR"],"t":"CAGR — Среднегодовой темп роста (Compound Annual Growth Rate)","d":"Средний рост за год с учётом «процента на процент»: (Конец/Начало)^(1/n) − 1. Здесь n — число лет. Это та единая годовая скорость роста, которая из начальной суммы даёт конечную"},{"p":["Call option"],"t":"Call option — Опцион колл","d":"Право, но не обязанность купить актив по цене страйк в будущем. Выигрыш при росте цены."},{"p":["Callable bond"],"t":"Callable bond — Облигация с правом досрочного погашения","d":"Эмитент может выкупить её раньше срока по заранее оговорённой цене. Он делает это, когда ставки упали."},{"p":["Cap rate"],"t":"Cap rate — Ставка капитализации","d":"Доходность недвижимости: годовой чистый операционный доход (NOI — Net Operating Income), делённый на цену объекта. Чем ниже cap rate, тем дороже объект."},{"p":["Cap table"],"t":"Cap table — Таблица капитализации","d":"Список всех владельцев компании: кому какая доля принадлежит, включая опционы."},{"p":["Capex intensity"],"t":"Capex intensity — Капиталоёмкость","d":"Инвестиции к выручке. У телекома и энергетики 15–25%, у IT-сервисов близко к нулю."},{"p":["Capital call"],"t":"Capital call — Вызов капитала","d":"Фонд не берёт все обещанные деньги сразу: он просит их у инвесторов (LP — Limited Partners) по мере необходимости, когда находит сделку."},{"p":["Capital market line"],"t":"Capital market line — Линия рынка капитала","d":"Прямая из безрисковой ставки в рыночный портфель. Показывает доходность портфелей, смешанных из безрисковых вложений и рынка."},{"p":["Capital rationing"],"t":"Capital rationing — Ограничение капитала для проектов","d":"Ограниченный бюджет на инвестиции: проекты выстраивают по индексу прибыльности (PI — Profitability Index) и берут лучшие, пока деньги не кончатся. Как поход в магазин с ограниченной суммой: сначала берёшь самое выгодное"},{"p":["Capital structure"],"t":"Capital structure — Структура капитала","d":"Из чего компания финансируется: сколько долга и сколько собственных денег."},{"p":["Capitalization vs expensing"],"t":"Capitalization vs expensing — Капитализация или расход","d":"Потраченное можно списать в расходы сразу или признать активом и списывать годами. Второе повышает текущую прибыль."},{"p":["Carried interest"],"t":"Carried interest — Доля управляющего в прибыли фонда (carry)","d":"Доля прибыли фонда, которую получает управляющий (GP), обычно 20%, если превышен hurdle rate (барьерная доходность для инвесторов)."},{"p":["Carry trade"],"t":"Carry trade — Керри-трейд","d":"Занять в валюте с низкой ставкой, вложить в валюту с высокой и заработать разницу. Рискует резким изменением курса."},{"p":["Carve\\-out"],"t":"Carve-out — Выделение","d":"Компания продаёт часть бизнеса или выводит его на IPO отдельно, оставляя себе контроль."},{"p":["Cash basis"],"t":"Cash basis — Кассовый метод","d":"Доходы и расходы записывают только когда деньги реально пришли или ушли. Проще, но картина по прибыли искажается. По МСФО и РСБУ для крупных компаний используют начисление."},{"p":["Cash conversion cycle"],"t":"Cash conversion cycle — Цикл конверсии денег","d":"Сколько дней деньги «заморожены» в операциях: от оплаты поставщику до получения денег от клиента."},{"p":["Cash cost"],"t":"Cash cost — Денежная себестоимость","d":"Прямые денежные затраты на единицу продукции без амортизации. Для горняков и металлургов."},{"p":["Cash flow statement"],"t":"Cash flow statement — Отчёт о движении денег (ОДДС)","d":"Показывает, откуда пришли и куда ушли реальные деньги за период, в трёх блоках: операционном, инвестиционном и финансовом."},{"p":["Cash ratio"],"t":"Cash ratio — Коэффициент абсолютной ликвидности","d":"Самая жёсткая проверка: только деньги и их эквиваленты против краткосрочных долгов."},{"p":["Cash sweep"],"t":"Cash sweep — Погашение долга из избытка денег","d":"Условие: весь свободный остаток денег идёт на досрочное погашение долга."},{"p":["Cash\\-free debt\\-free"],"t":"Cash-free debt-free — Без денег и без долга","d":"Цена названа за бизнес как будто без денег и без долга. На закрытии к ней прибавляют деньги и вычитают долг."},{"p":["CDS"],"t":"CDS — Кредитный дефолтный своп (Credit Default Swap)","d":"Страховка от дефолта: покупатель регулярно платит, а если заёмщик не вернёт долг, продавец покрывает убыток. Цена CDS показывает, как рынок оценивает риск."},{"p":["CET1"],"t":"CET1 — Базовый капитал первого уровня (Common Equity Tier 1)","d":"Самый надёжный капитал банка: акции и нераспределённая прибыль (Базель III). Это собственные деньги банка, которыми он в первую очередь покрывает убытки"},{"p":["CFADS"],"t":"CFADS — Денежный поток для обслуживания долга (Cash Flow Available for Debt Service)","d":"Деньги проекта, доступные для платежей по долгу. На них делят платежи, чтобы получить DSCR."},{"p":["CFF"],"t":"CFF — Денежный поток от финансовой деятельности (Cash Flow from Financing)","d":"Финансовый поток: движение денег по долгу, дивидендам, байбэкам (выкупу своих акций) и выпуску новых акций. Это деньги, которые пришли от кредиторов и акционеров или ушли к ним"},{"p":["CFI"],"t":"CFI — Денежный поток от инвестиционной деятельности (Cash Flow from Investing)","d":"Инвестиционный поток: деньги на CAPEX, а также от покупки и продажи активов и компаний. Обычно он отрицательный: компания тратит деньги на развитие"},{"p":["CFO"],"t":"CFO — Денежный поток от операционной деятельности (Cash Flow from Operations)","d":"Операционный денежный поток: деньги, которые компания получила от основной работы. Например, деньги магазина от продажи товаров за вычетом оплаты поставщикам и зарплат"},{"p":["Chapter 11"],"t":"Chapter 11 — Глава 11 Кодекса о банкротстве США","d":"Реорганизация: компания продолжает работать под защитой суда и договаривается с кредиторами о плане."},{"p":["Chapter 7"],"t":"Chapter 7 — Глава 7 Кодекса о банкротстве США","d":"Ликвидация: управляющий продаёт имущество должника и распределяет деньги по очереди, компания закрывается."},{"p":["Churn"],"t":"Churn — Отток клиентов","d":"Доля клиентов, которые ушли за период."},{"p":["CIM"],"t":"CIM — Конфиденциальный информационный меморандум (Confidential Information Memorandum)","d":"Подробное закрытое описание продаваемой компании для покупателей. Как подробное объявление о продаже квартиры с планом, документами и историей, которое показывают только серьёзным покупателям"},{"p":["CIR"],"t":"CIR — Отношение расходов к доходам (Cost-to-Income Ratio)","d":"Какую долю доходов банка съедают его расходы: расходы / доходы. Если на каждые 100 рублей дохода уходит 40 рублей расходов, CIR равен 40%"},{"p":["Circularity"],"t":"Circularity — Циклическая ссылка","d":"В модели проценты зависят от долга, а долг от денежного потока, который зависит от процентов. Excel зацикливается, поэтому включают итерации или упрощают."},{"p":["Claim"],"t":"Claim — Страховой случай / выплата","d":"Требование клиента выплатить деньги по договору страхования."},{"p":["Clean","Dirty price"],"t":"Clean / Dirty price — Чистая / грязная цена","d":"Чистая цена — без накопленного купонного дохода. Грязная — вместе с ним, то есть реально платишь."},{"p":["Clearing"],"t":"Clearing — Клиринг","d":"Сверка и расчёт взаимных обязательств по сделкам, чтобы обе стороны выполнили условия. На Мосбирже этим занимается НКЦ (Национальный клиринговый центр)."},{"p":["Closing"],"t":"Closing — Закрытие сделки","d":"Момент, когда переходят акции и платят деньги. Подписание (signing) может быть задолго до закрытия."},{"p":["Club deal"],"t":"Club deal — Клубная сделка","d":"Сделка узкого круга участников без широкого рынка. В прямых инвестициях (PE, Private Equity) — покупка компании несколькими фондами вместе. В кредитовании — клубный кредит: несколько банков дают кредит без широкой синдикации (без привлечения множества участников)."},{"p":["CoD"],"t":"CoD — Cost of Debt (стоимость долга)","d":"Ставка, по которой компания занимает: доходность её облигаций (YTM, Yield to Maturity) и ставки по кредитам. В WACC берут после налога, потому что проценты уменьшают налог на прибыль."},{"p":["CoE"],"t":"CoE — Cost of Equity (стоимость собственного капитала)","d":"Доходность, которую требуют акционеры за риск вложения в акции компании. Чем рискованнее бизнес, тем выше. В DCF (Discounted Cash Flow) это ставка для денег акционеров, а в WACC (Weighted Average Cost of Capital) — стоимость собственной части финансирования."},{"p":["Collateral"],"t":"Collateral — Залог","d":"Имущество, которое банк заберёт, если заёмщик не вернёт кредит."},{"p":["Combined ratio"],"t":"Combined ratio — Комбинированный коэффициент (страхование)","d":"(Убытки + расходы) / премии у страховщика. Если меньше 100%, страхование само по себе прибыльно. Премии — взносы клиентов. Собрали 100, выплатили и потратили 90: показатель 90%"},{"p":["Common stock"],"t":"Common stock — Обыкновенные акции","d":"Главный вид акций: даёт право голоса и долю в прибыли, но при ликвидации платят после кредиторов и держателей привилегированных."},{"p":["Completion accounts"],"t":"Completion accounts — Отчётность на закрытие","d":"Механизм цены: после закрытия считают реальный долг и оборотный капитал и корректируют цену. Противоположность locked box."},{"p":["Compliance"],"t":"Compliance — Комплаенс","d":"Система внутри компании, которая следит за соблюдением законов и правил."},{"p":["Compounding"],"t":"Compounding — Сложный процент","d":"Проценты начисляют не только на вложенную сумму, но и на уже набежавшие проценты. Чем дольше срок, тем сильнее эффект: 10% годовых за 30 лет превращают 1 рубль примерно в 17,4. Поэтому инвестировать выгодно начинать рано."},{"p":["Comps"],"t":"Comps — Сравнение с компаниями-аналогами (Comparable companies)","d":"Таблица похожих компаний и их мультипликаторов. Мультипликатор — это «во сколько раз цена больше показателя» (прибыли, выручки). Так оценивают компанию по аналогии, как квартиру по цене соседних"},{"p":["Conditions precedent \\(CP\\)"],"t":"Conditions precedent (CP) — Отлагательные условия","d":"Что должно случиться до закрытия: одобрение ФАС (Федеральная антимонопольная служба), согласие банка, выход партнёров."},{"p":["Consensus"],"t":"Consensus — Консенсус","d":"Средний прогноз аналитиков по показателю. Если отчёт лучше консенсуса, акция обычно растёт."},{"p":["Consolidation"],"t":"Consolidation — Консолидация","d":"Сложение отчётов материнской компании и дочерних в один, как будто это одна компания. Взаимные сделки внутри группы вычёркивают."},{"p":["Contango"],"t":"Contango — Контанго","d":"Фьючерсы на более поздний срок дороже ближайших. Нормальная ситуация, когда хранение стоит денег."},{"p":["Contingent liability"],"t":"Contingent liability — Условное обязательство","d":"Возможный долг, который появится, только если случится событие (например, проиграют суд). Его описывают в примечаниях, а в баланс не ставят, если вероятность невысокая."},{"p":["Contribution margin"],"t":"Contribution margin — Маржинальный доход","d":"Что остаётся от выручки после переменных расходов. Идёт на покрытие постоянных расходов и на прибыль."},{"p":["Convertible bond"],"t":"Convertible bond — Конвертируемая облигация","d":"Облигация, которую можно обменять на акции эмитента по заранее оговорённой цене. Поэтому купон у неё ниже обычного."},{"p":["Convexity"],"t":"Convexity — Выпуклость","d":"Поправка к дюрации: показывает, что цена облигации реагирует на падение ставки сильнее, чем на такой же рост."},{"p":["CoR"],"t":"CoR — Стоимость риска (Cost of Risk)","d":"Стоимость риска: какая доля кредитного портфеля банка за год ушла на создание резервов под возможные потери. Это «страховой запас» на случай, что часть клиентов не вернёт долг. Показывает, сколько процентов портфеля «сгорает» за год"},{"p":["Core inflation"],"t":"Core inflation — Базовая инфляция","d":"Инфляция без самых скачущих цен (еда, энергия). Показывает устойчивый тренд."},{"p":["Corporate governance"],"t":"Corporate governance — Корпоративное управление","d":"Система правил, по которым компания управляется и контролируется: совет, аудит, права акционеров, раскрытие."},{"p":["Correlation"],"t":"Correlation — Корреляция","d":"Нормированная ковариация от −1 до +1. +1 — активы двигаются синхронно, 0 — независимо, −1 — зеркально. Чем меньше корреляция, тем сильнее диверсификация."},{"p":["Cost of preferred"],"t":"Cost of preferred — Стоимость привилегированных акций","d":"Цена денег от привилегированных акций: дивиденд, делённый на цену акции."},{"p":["Counterparty risk"],"t":"Counterparty risk — Риск контрагента","d":"Кредитный риск по деривативам и сделкам: другая сторона не исполнит обязательство."},{"p":["Covariance"],"t":"Covariance — Ковариация","d":"Показывает, движутся ли два актива в одну сторону. Положительная — вместе, отрицательная — в разные стороны."},{"p":["Covenant"],"t":"Covenant — Ковенант (условие кредитного договора)","d":"Условие кредитного договора, которое заёмщик обязан соблюдать (например, ND/EBITDA ≤ 3×). ND/EBITDA — это чистый долг, делённый на EBITDA. То есть «чистый долг не должен превышать годовую EBITDA больше чем в 3 раза». При нарушении банк может потребовать вернуть деньги"},{"p":["Covenant\\-lite"],"t":"Covenant-lite — Кредит без финансовых тестов","d":"Кредит без регулярных (maintenance) ковенантов, остаются только условия при действии (incurrence)."},{"p":["Coverage"],"t":"Coverage — Покрытие","d":"Компании, по которым аналитик регулярно пишет отчёты."},{"p":["Covered interest parity"],"t":"Covered interest parity — Покрытый паритет ставок","d":"Форвардный курс не даёт заработать без риска: разница ставок уже в нём заложена."},{"p":["CPI"],"t":"CPI — Индекс потребительских цен (CPI — Consumer Price Index)","d":"Показывает, как изменилась цена корзины товаров, которую покупают семьи. Через него считают инфляцию."},{"p":["Cram\\-down"],"t":"Cram-down — Принудительное утверждение плана","d":"Суд утверждает план реструктуризации, даже если одна группа кредиторов против."},{"p":["Credit rating"],"t":"Credit rating — Кредитный рейтинг","d":"Оценка способности заёмщика вернуть долг. Агентства: S&P, Moody's, Fitch, в России — АКРА и «Эксперт РА»."},{"p":["Credit risk"],"t":"Credit risk — Кредитный риск","d":"Риск, что контрагент не заплатит."},{"p":["Credit spread"],"t":"Credit spread — Кредитный спред","d":"Кредитный спред: доходность облигации компании минус доходность госбумаги того же срока. Это плата за то, что компания надёжна хуже государства. Чем больше разница, тем рискованнее компания"},{"p":["Crossover rate"],"t":"Crossover rate — Ставка пересечения","d":"Ставка, при которой NPV двух проектов равны. Выше неё лучше один, ниже — другой."},{"p":["CRP"],"t":"CRP — Премия за страновой риск (Country Risk Premium)","d":"Надбавка к доходности за то, что вложения в конкретной стране рискованнее. Инвестор требует больше за вложения туда, где больше политических и экономических неожиданностей"},{"p":["Currency risk"],"t":"Currency risk — Валютный риск","d":"Риск потерять из-за изменения курса: выручка в рублях, долг в долларах."},{"p":["Current account"],"t":"Current account — Счёт текущих операций","d":"Разница между тем, сколько страна получила от остального мира за экспорт и доходы, и сколько заплатила. Положительный — экспортёр."},{"p":["Current ratio"],"t":"Current ratio — Коэффициент текущей ликвидности","d":"Хватит ли оборотных активов, чтобы закрыть краткосрочные долги. Выше 1 — запас есть."},{"p":["Current yield"],"t":"Current yield — Текущая доходность","d":"Купоны за год, делённые на цену облигации. Не учитывает разницу цены и номинала."},{"p":["Custodian"],"t":"Custodian — Депозитарий / кастодиан","d":"Организация, которая хранит бумаги клиентов и фиксирует права на них. В России — НРД (Национальный расчётный депозитарий)."},{"p":["D\\&A"],"t":"D&A — Амортизация основных средств и нематериальных активов (Depreciation & Amortization)","d":"Амортизация: постепенное списание стоимости основных средств (ОС) и нематериальных активов (НМА) в расходы. Купили станок за 100 на 10 лет: каждый год в расходы идёт по 10, хотя деньги заплатили один раз. НМА — то, что нельзя потрогать: лицензии, программы, бренд"},{"p":["Data room"],"t":"Data room — Комната данных","d":"Защищённое хранилище документов компании, куда пускают покупателей для проверки. Сейчас почти всегда виртуальная (VDR)."},{"p":["DCM"],"t":"DCM — Долговой рынок капитала (Debt Capital Markets)","d":"Рынок, на котором компании занимают деньги, выпуская облигации. Облигация — это долговая расписка: компания берёт деньги у многих людей и обещает вернуть с процентами"},{"p":["DDM"],"t":"DDM — Модель дисконтирования дивидендов (Dividend Discount Model)","d":"Оценка акции по будущим дивидендам, пересчитанным в сегодняшние деньги. Дивиденд — это часть прибыли, которую компания платит владельцам акций"},{"p":["Deadlock"],"t":"Deadlock — Тупик","d":"Ситуация, когда партнёры 50/50 не могут договориться. В корпоративном договоре заранее пишут выход: «русская рулетка», «техасская перестрелка», медиация."},{"p":["Debt","Equity"],"t":"Debt / Equity — Долг к капиталу","d":"Сколько долга приходится на рубль собственных денег. Мера финансового рычага."},{"p":["Debt capacity"],"t":"Debt capacity — Долговая ёмкость","d":"Максимум долга, который компания может нести без угрозы платежеспособности."},{"p":["Debt schedule"],"t":"Debt schedule — График долга","d":"Таблица в модели: сколько долга на начало года, сколько взяли и погасили, сколько осталось и какие проценты."},{"p":["Debt service"],"t":"Debt service — Обслуживание долга","d":"Проценты плюс погашение основного долга за период."},{"p":["Debt\\-to\\-equity swap"],"t":"Debt-to-equity swap — Обмен долга на акции","d":"Кредиторы прощают долг и получают взамен акции компании. Часто итог реструктуризации."},{"p":["Deferred revenue"],"t":"Deferred revenue — Доходы будущих периодов","d":"Деньги, которые клиент уже заплатил, а услугу или товар компания ещё не отдала. Это обязательство: пока не отдала, выручкой это не считается."},{"p":["Deflation"],"t":"Deflation — Дефляция","d":"Цены в экономике падают. Выглядит приятно, но люди откладывают покупки и экономика замедляется."},{"p":["Delta"],"t":"Delta — Дельта","d":"Насколько изменится цена опциона, если цена актива сдвинется на 1. У колла от 0 до 1."},{"p":["Depreciation"],"t":"Depreciation — Амортизация (основных средств)","d":"Постепенное списание стоимости оборудования, зданий и т. п. на расходы за все годы их службы. Деньги не уходят, но прибыль уменьшается."},{"p":["Devaluation"],"t":"Devaluation — Девальвация","d":"Намеренное или вынужденное снижение курса национальной валюты."},{"p":["Diluted EPS"],"t":"Diluted EPS — Разводнённая прибыль на акцию (EPS — Earnings Per Share)","d":"EPS с учётом всех бумаг, которые можно превратить в акции: опционов, конвертируемых облигаций."},{"p":["Dilution"],"t":"Dilution — Размытие доли","d":"Когда выпускают новые акции, доля каждого старого акционера уменьшается."},{"p":["Direct listing"],"t":"Direct listing — Прямой листинг","d":"Выход на биржу без привлечения новых денег: акции просто начинают торговаться."},{"p":["Disclosure"],"t":"Disclosure — Раскрытие информации","d":"Обязанность публичной компании публиковать отчётность и существенные факты. В РФ правила ЦБ и закон о рынке ценных бумаг (сверить)."},{"p":["Discount factor"],"t":"Discount factor — Коэффициент дисконтирования","d":"Число меньше единицы, на которое умножают будущую сумму, чтобы получить сегодняшнюю."},{"p":["Discount period"],"t":"Discount period — Период дисконтирования","d":"Через сколько лет придёт денежный поток, по которому считают коэффициент дисконтирования. Для года в конце периода — 1, 2, 3; при допущении о середине года — 0,5; 1,5; 2,5. Первый прогнозный год от даты оценки может быть дробным."},{"p":["Discounted payback"],"t":"Discounted payback — Дисконтированный срок окупаемости","d":"За сколько лет дисконтированные потоки вернут вложения. Честнее обычного payback."},{"p":["Distressed debt"],"t":"Distressed debt — Проблемный долг","d":"Долг компании в тяжёлом положении, торгуется с большим дисконтом. Фонды скупают его, надеясь на выкуп или реструктуризацию."},{"p":["Diversification"],"t":"Diversification — Диверсификация","d":"Не класть все яйца в одну корзину. Разные активы падают не одновременно, поэтому риск портфеля меньше риска отдельных бумаг."},{"p":["Divestiture"],"t":"Divestiture — Продажа бизнеса","d":"Компания продаёт неосновной бизнес целиком. Деньги идут на долг, дивиденды или основной бизнес."},{"p":["Dividend policy"],"t":"Dividend policy — Дивидендная политика","d":"Правила, по которым компания решает, сколько прибыли выплатить акционерам, а сколько оставить."},{"p":["Dividend recap"],"t":"Dividend recap — Рекапитализация ради дивиденда","d":"Компания берёт новый долг и выплачивает деньги акционерам. Фонд так возвращает часть вложений до продажи."},{"p":["DPI","TVPI","RVPI"],"t":"DPI / TVPI / RVPI — Выплаты, совокупная и остаточная стоимость к внесённому капиталу (DPI — Distributions to Paid-In Capital; TVPI — Total Value to Paid-In Capital; RVPI — Residual Value to Paid-In Capital)","d":"Метрики фонда. DPI — сколько денег уже вернули инвесторам, RVPI — сколько ещё стоят оставшиеся вложения, TVPI — их сумма."},{"p":["DPS"],"t":"DPS — Дивиденд на акцию (Dividend Per Share)","d":"Сколько дивидендов приходится на одну акцию. Если компания выплатила 1000 и акций 100, то DPS равен 10"},{"p":["Drag\\-along"],"t":"Drag-along — Право принудительной продажи","d":"Если крупные акционеры продают компанию, они могут заставить продать и миноритариев на тех же условиях."},{"p":["DSCR"],"t":"DSCR — Коэффициент покрытия обслуживания долга (Debt Service Coverage Ratio)","d":"Денежный поток для обслуживания долга / (проценты + плановое погашение). Показывает, во сколько раз заработок больше платежей по долгу. Если DSCR меньше 1, денег на платёж не хватает"},{"p":["DSO","DIO","DPO"],"t":"DSO / DIO / DPO — Оборачиваемость дебиторской задолженности, запасов и кредиторской задолженности в днях (Days Sales / Inventory / Payables Outstanding)","d":"За сколько дней в среднем оборачиваются: дебиторка (долги клиентов), запасы, кредиторка (долги перед поставщиками). Например, DSO 30 дней значит, что клиенты платят в среднем через месяц после продажи"},{"p":["DTA","DTL"],"t":"DTA / DTL — Отложенные налоговые активы / обязательства (DTA — Deferred Tax Asset; DTL — Deferred Tax Li
