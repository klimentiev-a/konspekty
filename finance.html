ия, СПИ","d":"Сколько лет актив приносит пользу и списывается через амортизацию. От СПИ зависит годовая амортизация, а значит и прибыль. В моделях берут среднее историческое значение по группе активов."},{"p":["Value investing"],"t":"Value investing — Стоимостное инвестирование","d":"Покупать недооценённые компании: цена ниже, чем должна быть по прибыли и активам. Идея Грэма и Баффетта."},{"p":["VaR"],"t":"VaR — Стоимость под риском (Value at Risk)","d":"Потеря, которую не превысят с заданной вероятностью за период."},{"p":["Variance"],"t":"Variance — Дисперсия","d":"Квадрат стандартного отклонения. Показывает разброс значений."},{"p":["VDR"],"t":"VDR — Виртуальная комната данных (Virtual Data Room)","d":"Виртуальная комната данных: закрытое онлайн-хранилище документов для due diligence. Покупатели заходят туда и изучают документы, а продавец видит, кто что открывал"},{"p":["Vega"],"t":"Vega — Вега","d":"Насколько изменится цена опциона при росте волатильности на 1 п. п."},{"p":["Vendor due diligence"],"t":"Vendor due diligence — Проверка от продавца","d":"Продавец сам заказывает проверку компании и отдаёт отчёт всем покупателям. Ускоряет продажу."},{"p":["Venture capital"],"t":"Venture capital — Венчурный капитал","d":"Деньги, которые вкладывают в молодые компании с высоким риском ради большого роста. Большинство вложений не окупается, пара — окупает всё."},{"p":["Vesting"],"t":"Vesting — Вестинг","d":"Опционы или акции сотрудник получает постепенно, а не сразу. Обычно срок 4 года и «клифф» в год: уйдёшь раньше — ничего не получишь."},{"p":["VIX"],"t":"VIX — Индекс волатильности (VIX — CBOE Volatility Index)","d":"«Индекс страха»: ожидаемая рынком волатильность S&P 500 на 30 дней. Растёт при панике."},{"p":["Volume"],"t":"Volume — Объём торгов","d":"Сколько бумаг или денег прошло через сделки за период. Рост на большом объёме надёжнее."},{"p":["Warrant"],"t":"Warrant — Варрант","d":"Право купить акции компании по зафиксированной цене в течение срока. Часто выдают вместе с облигациями."},{"p":["Waterfall"],"t":"Waterfall — Порядок распределения денег между инвесторами","d":"Очерёдность выплат кредиторам и акционерам, когда делят деньги или компания банкротится. «Водопад»: деньги стекают сверху вниз, и нижние получают только то, что осталось после верхних"},{"p":["Wealth management"],"t":"Wealth management — Управление благосостоянием","d":"Обслуживание богатых клиентов: инвестиции, налоги, наследство, структуры владения."},{"p":["Weighted average cost"],"t":"Weighted average cost — Средневзвешенная стоимость","d":"Способ учёта запасов: берут среднюю цену всех партий."},{"p":["Withholding tax"],"t":"Withholding tax — Налог у источника","d":"Налог, который удерживают при выплате за рубеж: дивиденды, проценты, роялти. Ставку снижают соглашения об избежании двойного налогообложения."},{"p":["Working capital"],"t":"Working capital — Рабочий капитал","d":"То же, что оборотный капитал: деньги, застрявшие в операциях. См. NWC."},{"p":["Working capital adjustment"],"t":"Working capital adjustment — Корректировка на оборотный капитал","d":"Сам механизм корректировки цены сделки по оборотному капиталу на дату закрытия: сравнивают фактический NWC с целевым (см. NWC peg)."},{"p":["XNPV","XIRR"],"t":"XNPV / XIRR — NPV и IRR по точным датам потоков (XNPV — Extended Net Present Value; XIRR — Extended Internal Rate of Return)","d":"Версии NPV и IRR в Excel, которые учитывают точные даты потоков, а не равные периоды."},{"p":["Yield curve inversion"],"t":"Yield curve inversion — Инверсия кривой доходности","d":"Короткие ставки выше длинных. Считается признаком будущей рецессии."},{"p":["YoY","QoQ","MoM"],"t":"YoY / QoQ / MoM — Год к году / квартал к кварталу / месяц к месяцу (YoY — Year-over-Year; QoQ — Quarter-over-Quarter; MoM — Month-over-Month)","d":"Сравнение с тем же периодом год, квартал или месяц назад."},{"p":["YTM"],"t":"YTM — Доходность к погашению (Yield to Maturity)","d":"Доходность к погашению: сколько заработает покупатель облигации, если продержит её до конца срока. Выражается в процентах годовых"},{"p":["Zero\\-coupon bond"],"t":"Zero-coupon bond — Бескупонная облигация","d":"Купонов нет: покупают дешевле номинала, а при погашении получают номинал целиком."},{"p":["АКРА","НКР","НРА"],"t":"АКРА / Эксперт РА / НКР / НРА — Российские кредитные рейтинговые агентства (credit rating agencies)","d":"АКРА (Аналитическое кредитное рейтинговое агентство), «Эксперт РА», НКР (Национальные кредитные рейтинги), НРА (Национальное рейтинговое агентство). Их рейтинги нужны для включения бумаг в ломбардный список ЦБ и для покупки облигаций НПФ (негосударственными пенсионными фондами)."},{"p":["АСВ"],"t":"АСВ — Агентство по страхованию вкладов (Deposit Insurance Agency)","d":"Страхует вклады до 1,4 млн руб. на человека в банке. Платит при отзыве лицензии (сверить)."},{"p":["БПИФ"],"t":"БПИФ — Биржевой паевой инвестиционный фонд (exchange-traded mutual fund)","d":"ПИФ, паи которого торгуются на бирже, как ETF. Российский аналог ETF."},{"p":["ВЭБ\\.РФ"],"t":"ВЭБ.РФ — VEB.RF (state development corporation)","d":"Государственная корпорация развития: финансирует крупные инфраструктурные проекты."},{"p":["ГКО"],"t":"ГКО — Государственные краткосрочные облигации (short-term government bonds)","d":"Короткие гособлигации 1990-х с доходностью до 100%+. По ним и случился дефолт 1998 года."},{"p":["ДПМ"],"t":"ДПМ — Договор о предоставлении мощности (capacity supply agreement)","d":"Российский механизм: инвестор строит станцию, а рынок гарантированно оплачивает ему мощность 10–15 лет (сверить)."},{"p":["ЕГРЮЛ"],"t":"ЕГРЮЛ — Единый государственный реестр юридических лиц (Unified State Register of Legal Entities)","d":"Реестр ФНС со всеми компаниями: директор, учредители, адрес, статус."},{"p":["ИИС"],"t":"ИИС — Индивидуальный инвестиционный счёт (individual investment account)","d":"Брокерский счёт с налоговыми льготами для частного инвестора (условия и типы сверять в актуальных правилах)."},{"p":["КИК"],"t":"КИК — Контролируемая иностранная компания (controlled foreign company)","d":"Иностранная компания, которой владеет российский резидент. С её нераспределённой прибыли надо платить налог в РФ (сверить)."},{"p":["КИУМ"],"t":"КИУМ — Коэффициент использования установленной мощности (capacity factor)","d":"Отношение фактической выработки станции за период к максимально возможной при работе на полной мощности всё это время. АЭС 80–90%, солнечные станции 15–25%."},{"p":["ЛДВ"],"t":"ЛДВ — Льгота на долгосрочное владение ценными бумагами (long-term holding tax exemption)","d":"Освобождение от НДФЛ при продаже бумаг после 3 лет владения, до 3 млн руб. за каждый год (сверить)."},{"p":["НДД"],"t":"НДД — Налог на дополнительный доход от добычи углеводородов (additional income tax)","d":"Альтернатива НДПИ для части месторождений: налог с прибыли от добычи, а не с объёма (сверить)."},{"p":["НДПИ"],"t":"НДПИ — Налог на добычу полезных ископаемых (mineral extraction tax)","d":"Главный налог нефтяников и горняков: с каждой тонны добытого по формуле от мировых цен (сверить)."},{"p":["НДС"],"t":"НДС — Налог на добавленную стоимость (value added tax)","d":"Налог на продажи. Основная ставка 22% с 2026 года, до этого 20% (сверить). Компания платит разницу между НДС с продаж и НДС с закупок."},{"p":["НДФЛ"],"t":"НДФЛ — Налог на доходы физических лиц (personal income tax)","d":"Налог на доходы людей, в том числе от инвестиций. Ставка зависит от размера дохода (условия сверить)."},{"p":["НКД","Accrued interest"],"t":"НКД / Accrued interest — Накопленный купонный доход (accrued interest)","d":"Часть купона, которая набежала с последней выплаты до сегодняшнего дня. Если купон платят раз в полгода, то при покупке облигации через три месяца после выплаты покупатель компенсирует продавцу набежавшую половину"},{"p":["НКЦ"],"t":"НКЦ — Национальный клиринговый центр (National Clearing Centre)","d":"Клиринг и центральный контрагент на Мосбирже: гарантирует исполнение сделок."},{"p":["Н2","Н3\\)"],"t":"Нормативы ЦБ (Н1, Н2, Н3) — Central bank capital and liquidity ratios","d":"Н1 — достаточность капитала, Н2 — мгновенная ликвидность, Н3 — текущая ликвидность. Инструкция 199-И (сверить)."},{"p":["НПФ"],"t":"НПФ — Негосударственный пенсионный фонд (non-state pension fund)","d":"Организация, которая копит и инвестирует пенсионные деньги людей и платит накопленное при выходе на пенсию."},{"p":["НРД"],"t":"НРД — Национальный расчётный депозитарий (National Settlement Depository)","d":"Хранит ценные бумаги и проводит расчёты по сделкам."},{"p":["ОФЗ\\-ИН"],"t":"ОФЗ-ИН — ОФЗ с индексируемым номиналом (inflation-linked federal bonds)","d":"Номинал растёт вместе с инфляцией. Защищает от обесценения."},{"p":["ОФЗ\\-ПД"],"t":"ОФЗ-ПД — ОФЗ с постоянным купонным доходом (fixed-coupon federal bonds)","d":"Обычные ОФЗ с фиксированным купоном."},{"p":["ОФЗ\\-ПК"],"t":"ОФЗ-ПК — ОФЗ с переменным купоном (floating-rate federal bonds)","d":"Купон привязан к ставке денежного рынка (RUONIA), поэтому растёт вместе со ставками."},{"p":["ПАО","АО","ООО"],"t":"ПАО / АО / ООО — PJSC / JSC / LLC","d":"ПАО — публичное акционерное общество, акции торгуются. АО — непубличное. ООО — общество с ограниченной ответственностью, доли, а не акции."},{"p":["ПДН"],"t":"ПДН — Показатель долговой нагрузки (debt-to-income ratio)","d":"Какая доля доходов заёмщика уходит на платежи по кредитам (его регулирует ЦБ). Если человек зарабатывает 100 и платит по кредитам 40, ПДН равен 40%. Чем он выше, тем рискованнее для банка"},{"p":["ПИФ"],"t":"ПИФ — Паевой инвестиционный фонд (mutual fund)","d":"Российский паевой фонд. Покупаешь пай, управляющая компания вкладывает деньги в бумаги. Взимает комиссию за управление."},{"p":["РСБУ"],"t":"РСБУ — Российские стандарты бухгалтерского учёта (Russian Accounting Standards)","d":"Российские правила, по которым компании ведут бухгалтерский учёт и составляют отчётность. Нужны для налогов и отчётов внутри страны, а МСФО — для сравнения с зарубежными компаниями"},{"p":["СБП"],"t":"СБП — Система быстрых платежей (Faster Payments System)","d":"Российская система ЦБ для мгновенных переводов по номеру телефона и оплаты по QR."},{"p":["УСН"],"t":"УСН — Упрощённая система налогообложения (simplified tax system)","d":"Режим для малого бизнеса: платят 6% с доходов или 15% с разницы доходов и расходов вместо налога на прибыль и НДС. С 2025 года при доходах выше порога (60 млн руб. в год, дальше порог снижают) платят и НДС (сверить)."},{"p":["ФАС"],"t":"ФАС — Федеральная антимонопольная служба (Federal Antimonopoly Service)","d":"Одобряет крупные сделки слияния, следит за конкуренцией."},{"p":["ФНБ"],"t":"ФНБ — Фонд национального благосостояния (National Wealth Fund)","d":"Резервный фонд государства РФ: деньги от нефтегазовых доходов, которые копят на трудные времена и пенсионные нужды."},{"p":["ФНС"],"t":"ФНС — Федеральная налоговая служба (Federal Tax Service)","d":"Собирает налоги, ведёт ЕГРЮЛ, проводит проверки."},{"p":["ФСО"],"t":"ФСО — Федеральные стандарты оценки (Federal Valuation Standards)","d":"Стандарты оценочной деятельности РФ. Это обязательные правила, по которым оценщики определяют стоимость имущества и бизнеса"},{"p":["ЦБ РФ"],"t":"ЦБ РФ — Банк России (Bank of Russia)","d":"Центральный банк: ставит ключевую ставку, регулирует банки и рынок, хранит резервы."},{"p":["ЦФА"],"t":"ЦФА — Цифровые финансовые активы (digital financial assets)","d":"Российские цифровые права на блокчейне: можно выпустить аналог облигации или права на товар. Регулируются законом о ЦФА (сверить)."},{"p":["PV"],"t":"PV — Present Value (приведённая стоимость)","d":"Сегодняшняя цена будущих денег. Деньги завтра стоят меньше, чем сегодня, поэтому будущие поступления делят на коэффициент дисконтирования."},{"p":["CFA"],"t":"CFA — Chartered Financial Analyst (аналитик с международной квалификацией)","d":"Профессиональная квалификация для аналитиков и инвесторов, три уровня экзаменов. Её присуждает CFA Institute; по его программе написаны многие разделы конспекта."},{"p":["P\\&L"],"t":"P&L — Profit and Loss statement (отчёт о прибылях и убытках)","d":"Отчёт, который показывает, сколько компания заработала за период: от выручки вычитают расходы и налоги, в конце остаётся чистая прибыль."},{"p":["GAAP","US\\ GAAP"],"t":"GAAP — Generally Accepted Accounting Principles (общепринятые принципы бухучёта, США)","d":"Американские правила составления отчётности, их пишет FASB. В конспекте сравниваются с МСФО (IFRS) и российским РСБУ."},{"p":["IAS"],"t":"IAS — International Accounting Standards (международные стандарты бухгалтерского учёта)","d":"Старые номерные стандарты МСФО (IAS 1, IAS 12 и др.), которые писал предшественник IASB. Многие из них действуют до сих пор рядом со стандартами IFRS."},{"p":["CCC"],"t":"CCC — Cash Conversion Cycle (цикл конвертации денежных средств)","d":"Сколько дней деньги заморожены в обороте: срок оплаты покупателями плюс срок хранения запасов минус срок оплаты поставщикам. Также CCC — низкая оценка кредитного рейтинга."},{"p":["S\\&P"],"t":"S&P — Standard & Poor's (американская рейтинговая компания и фондовый индекс)","d":"S&P Global Ratings присваивает кредитные рейтинги. S&P 500 — индекс акций 500 крупнейших компаний США, по нему оценивают рынок и считают премию за риск."},{"p":["KPI","KPIs"],"t":"KPI — Key Performance Indicator (ключевой показатель эффективности)","d":"Число, по которому видно, хорошо ли идёт бизнес или работа сотрудника. У ритейла это одни показатели, у банка или подписочного сервиса другие."},{"p":["PE"],"t":"PE — Private Equity (прямые инвестиции, частный капитал)","d":"Фонды, которые покупают компании целиком, улучшают их и продают дороже. Часто делают это с помощью займов (LBO). Не путать с P/E — мультипликатором цена/прибыль."},{"p":["IB"],"t":"IB — Investment Banking (инвестиционно-банковский бизнес)","d":"Консультирует компании по сделкам и привлечению денег (M&A, выпуск акций и облигаций) и зарабатывает комиссии. Отличается от Equity Research, трейдинга и PE."},{"p":["ND"],"t":"ND — Net Debt (чистый долг)","d":"Весь долг компании минус деньги на счетах. Показывает, сколько долга останется, если направить все свободные деньги на погашение. Обычно делится на EBITDA."},{"p":["DD","VDD"],"t":"DD — Due Diligence (должная проверка компании)","d":"Проверка компании покупателем перед сделкой: финансы, налоги, право, рынок. Находки влияют на цену. VDD — такая же проверка, заказанная самим продавцом заранее."},{"p":["UST"],"t":"UST — US Treasuries (государственные облигации США)","d":"Долговые бумаги правительства США. Их доходность берут как безрисковую ставку для расчётов в долларах и как базу для кредитного спреда."},{"p":["MNPI"],"t":"MNPI — Material Non-Public Information (существенная непубличная информация)","d":"Закрытые сведения, способные сдвинуть цену бумаги. Торговать на их основе, передавать другим или советовать на их основе нельзя: это инсайд."},{"p":["LTV"],"t":"LTV — Lifetime Value (ценность клиента за всё время)","d":"Сколько денег клиент принесёт, пока остаётся с компанией. Сравнивают со стоимостью привлечения (CAC). Ещё LTV — Loan to Value, отношение долга к стоимости залога."},{"p":["FV"],"t":"FV — Future Value (будущая стоимость)","d":"Во что превратятся сегодняшние деньги через несколько лет, если вложить их под процент. Это сегодняшняя сумма, умноженная на рост с учётом ставки."},{"p":["B2B"],"t":"B2B — Business to Business (продажи бизнесу)","d":"Модель, где компания продаёт товары и услуги другим компаниям, а не обычным людям. Её противоположность — продажи частным клиентам (B2C)."},{"p":["DF"],"t":"DF — Discount Factor (коэффициент дисконтирования)","d":"Число меньше единицы, на которое умножают будущий денежный поток, чтобы получить его сегодняшнюю стоимость. Чем дальше год, тем оно меньше."},{"p":["VC"],"t":"VC — Venture Capital (венчурный капитал)","d":"Деньги, которые вкладывают в молодые рискованные компании ради большого роста. VC method — метод оценки стартапа. В микроэкономике VC — переменные издержки."},{"p":["MC"],"t":"MC — Marginal Cost (предельные издержки)","d":"Во сколько обойдётся ещё одна единица продукции. Максимум прибыли достигается там, где предельная выручка сравнивается с предельными издержками."},{"p":["TLB"],"t":"TLB — Term Loan B (срочный кредит тип B)","d":"Заём под залог, который почти не гасится по ходу срока: основной долг возвращают в конце. Его держат институциональные инвесторы, ставка выше, чем у кредита TLA."},{"p":["HWM"],"t":"HWM — High-Water Mark (планка прошлого максимума)","d":"Фонд не берёт вознаграждение за успех, пока стоимость активов не превысит прошлый максимум. Это защищает инвестора от двойной оплаты одной и той же прибыли."},{"p":["EBT"],"t":"EBT — Earnings Before Taxes (прибыль до налогообложения)","d":"Прибыль после процентов, но до налога на прибыль. С неё считают налог, а после вычета налога получают чистую прибыль."},{"p":["ASC"],"t":"ASC — Accounting Standards Codification (кодификация стандартов бухучёта США)","d":"Свод правил US GAAP, разбитый по темам с номерами: ASC 606 — выручка, ASC 842 — аренда. Аналоги в МСФО: IFRS 15 и IFRS 16."},{"p":["NRR"],"t":"NRR — Net Revenue Retention (чистое удержание выручки)","d":"Как изменилась выручка от клиентов, которые были год назад. Выше 100% — существующие клиенты платят больше, даже если новых нет. Главная метрика подписочного бизнеса."},{"p":["SBC"],"t":"SBC — Stock-Based Compensation (выплаты сотрудникам акциями)","d":"Оплата труда акциями или опционами вместо денег. Это реальный расход компании, хотя денежный поток не уменьшается, поэтому аналитики его учитывают."},{"p":["FC"],"t":"FC — Fixed Costs (постоянные издержки)","d":"Затраты, которые не зависят от объёма выпуска в коротком периоде: аренда, амортизация, зарплата управленцев. Платить приходится, даже если ничего не произвели."},{"p":["IPS"],"t":"IPS — Investment Policy Statement (инвестиционная политика клиента)","d":"Письменный документ с целями инвестора, допустимым риском, сроком и ограничениями. Он служит правилами, по которым управляющий распределяет деньги."},{"p":["PMT"],"t":"PMT — Payment (регулярный платёж)","d":"Одинаковый платёж каждый период, в который входят проценты и часть долга (аннуитет). В Excel его считает функция ПЛТ (PMT)."},{"p":["NI"],"t":"NI — Net Income (чистая прибыль)","d":"Что остаётся у компании после всех расходов, процентов и налогов. В расчётах слияний складывают чистую прибыль покупателя и цели."},{"p":["R\\&D"],"t":"R&D — Research and Development (научно-исследовательские и опытно-конструкторские работы)","d":"Затраты на исследования и разработку нового продукта. По МСФО исследования списывают в расходы, а разработку при выполнении условий записывают в актив."},{"p":["SML"],"t":"SML — Security Market Line (линия рынка ценных бумаг)","d":"Прямая, по которой доходность акции зависит от её беты. Показывает, какую доходность вправе требовать инвестор за рыночный риск акции."},{"p":["UIP"],"t":"UIP — Uncovered Interest Parity (непокрытый паритет процентных ставок)","d":"Гипотеза: валюта с высокой ставкой должна дешеветь на разницу ставок. Курс не фиксируют, поэтому риск остаётся на инвесторе. На практике часто не выполняется."},{"p":["ATC"],"t":"ATC — Average Total Cost (средние общие издержки)","d":"Общие затраты, делённые на число произведённых единиц: сколько в среднем стоит одна штука. Сначала падают, потом растут, минимум лежит на пересечении с MC."},{"p":["MR"],"t":"MR — Marginal Revenue (предельная выручка)","d":"На сколько вырастет выручка от продажи ещё одной единицы. У монополиста она ниже цены, потому что ради лишней единицы приходится снижать цену."},{"p":["GIPS"],"t":"GIPS — Global Investment Performance Standards (глобальные стандарты инвестиционных результатов)","d":"Добровольные правила, по которым управляющие компании честно и сопоставимо показывают результаты клиентам. Их разработал CFA Institute."},{"p":["TLA"],"t":"TLA — Term Loan A (срочный кредит транша A)","d":"Банковский кредит, который гасится частями в течение срока. Обычно дешевле транша B, потому что его дают банки, а долг погашается постепенно."},{"p":["IC"],"t":"IC — Invested Capital (инвестированный капитал)","d":"Все деньги, вложенные в бизнес: собственные и заёмные. Считается как собственный капитал плюс чистый долг. В главе про PE IC также означает инвестиционный комитет (investment committee)."},{"p":["CIB"],"t":"CIB — Corporate and Investment Banking (корпоративно-инвестиционный бизнес)","d":"Подразделение крупного банка, которое работает с большими компаниями: кредиты, размещения акций и облигаций, сопровождение сделок M&A."},{"p":["EMH"],"t":"EMH — Efficient Market Hypothesis (гипотеза эффективного рынка)","d":"Идея, что цены уже учитывают доступную информацию, поэтому после издержек систематически обыгрывать рынок нельзя. Бывает слабая, средняя и сильная формы."},{"p":["CGU","CGUs"],"t":"CGU — Cash-Generating Unit (единица, генерирующая денежные потоки)","d":"Наименьшая группа активов, которая приносит деньги независимо от других. На уровне CGU проверяют обесценение, в том числе гудвила."},{"p":["ATM"],"t":"ATM — At The Money (на деньгах)","d":"Опцион, у которого цена исполнения (страйк) примерно равна текущей цене базового актива. Внутренней стоимости нет, остаётся только временная."},{"p":["AT1"],"t":"AT1 — Additional Tier 1 (добавочный капитал первого уровня)","d":"Бессрочные облигации банка, которые считаются капиталом. Купон можно пропустить, а при нехватке капитала бумагу могут списать или конвертировать в акции."},{"p":["CBAM"],"t":"CBAM — Carbon Border Adjustment Mechanism (углеродный пограничный механизм ЕС)","d":"Углеродный пограничный сбор: ЕС берёт плату за выбросы CO₂ при производстве товаров, которые ввозят в Европу. Он давит на маржу экспортёров."},{"p":["HHI"],"t":"HHI — Herfindahl–Hirschman Index (индекс Херфиндаля–Хиршмана)","d":"Мера концентрации рынка: доли всех игроков возводят в квадрат и складывают. Чем выше значение, тем сильнее рынок поделён между немногими."},{"p":["RPK"],"t":"RPK — Revenue Passenger Kilometers (оплаченные пассажиро-километры)","d":"Показатель авиакомпании: сколько оплативших пассажиров провезли и на сколько километров. Делят на ASK, чтобы получить заполняемость кресел."},{"p":["ASK"],"t":"ASK — Available Seat Kilometers (предельные кресло-километры)","d":"Показатель авиакомпании: сколько кресел можно было бы продать, умножено на дальность полётов. Это вся доступная вместимость, занятая или нет."},{"p":["STAR"],"t":"STAR — Situation, Task, Action, Result (ситуация, задача, действие, результат)","d":"Схема ответа на поведенческие вопросы на собеседовании: опиши ситуацию, свою задачу, свои действия и итог."},{"p":["ROU"],"t":"ROU — Right-of-Use asset (актив в форме права пользования)","d":"Актив, который арендатор по МСФО 16 записывает на баланс при аренде. По величине равен обязательству по аренде; его амортизируют."},{"p":["RSU","RSUs"],"t":"RSU — Restricted Stock Units (ограниченные акции)","d":"Акции, которые сотрудник получает за время работы в компании. При расчёте разводнённых акций их добавляют целиком."},{"p":["CML"],"t":"CML — Capital Market Line (линия рынка капитала)","d":"Прямая, показывающая лучшие доступные сочетания риска и доходности при вложении в безрисковый актив и рыночный портфель. Её наклон равен коэффициенту Шарпа рыночного портфеля."},{"p":["RCF"],"t":"RCF — Revolving Credit Facility (возобновляемая кредитная линия)","d":"Кредитная линия, как карта для компании: взял, вернул, взял снова. Платят проценты за использованное и комиссию за неиспользованный остаток."},{"p":["SLB","SLBs"],"t":"SLB — Sustainability-Linked Bond (облигация, связанная с устойчивостью)","d":"Облигация без целевого назначения денег: если компания не достигнет заявленной экологической цели, купон растёт."},{"p":["TC"],"t":"TC — Total Cost (общие затраты)","d":"Все затраты фирмы при данном объёме выпуска: постоянные плюс переменные. Делят на объём, чтобы получить средние затраты."},{"p":["AVC"],"t":"AVC — Average Variable Cost (средние переменные затраты)","d":"Переменные затраты на одну единицу продукции. Если цена ниже AVC, фирме выгоднее остановиться, чем продолжать выпуск."},{"p":["FIG"],"t":"FIG — Financial Institutions Group (группа по финансовым организациям)","d":"Отраслевая команда инвестбанка, которая работает с банками, страховщиками и управляющими компаниями."},{"p":["AR"],"t":"AR — Accounts Receivable (дебиторская задолженность)","d":"Деньги, которые покупатели ещё должны компании за проданный товар. В главе про рынки AR также значит abnormal return, то есть аномальную доходность."},{"p":["CAPE"],"t":"CAPE — Cyclically Adjusted Price-to-Earnings (циклически скорректированное P/E, мультипликатор Шиллера)","d":"Цена индекса, делённая на среднюю прибыль за 10 лет с поправкой на инфляцию. Сглаживает скачки отдельных лет и показывает, дорог ли рынок."},{"p":["RTS"],"t":"RTS — Russian Trading System index (индекс РТС)","d":"Индекс российского рынка акций, который считается в долларах. Его отслеживают фьючерсы на Московской бирже."},{"p":["OFAC"],"t":"OFAC — Office of Foreign Assets Control (Управление по контролю за иностранными активами Минфина США)","d":"Американское ведомство, которое ведёт санкции и выдаёт лицензии на операции, запрещённые в обычном порядке. Без нужной лицензии сделки с подсанкционными сторонами могут сорваться."},{"p":["TSM"],"t":"TSM — Treasury Stock Method (метод казначейских акций)","d":"Способ учесть опционы в числе акций: считаем, что полученные от исполнения деньги тратятся на выкуп акций, и добавляем только разницу."},{"p":["VDD"],"t":"VDD — Vendor Due Diligence (проверка компании от имени продавца)","d":"Отчёт консультанта, который продавец заказывает заранее, чтобы покупатели доверяли цифрам и проверка шла быстрее."},{"p":["PDIE"],"t":"PDIE — Pre-Deal Investor Education (предварительное знакомство инвесторов с компанией)","d":"Этап перед IPO: аналитики банков общаются с инвесторами и рассказывают о компании и отрасли ещё до публикации условий размещения."},{"p":["IASB"],"t":"IASB — International Accounting Standards Board (Совет по международным стандартам финансовой отчётности)","d":"Организация, которая разрабатывает и обновляет стандарты МСФО."},{"p":["PME"],"t":"PME — Public Market Equivalent (эквивалент публичного рынка)","d":"Способ сравнить фонд с индексом: денежные потоки фонда условно вкладывают в индекс и сравнивают итог. Значение выше единицы значит, что фонд обошёл индекс."},{"p":["CF","CFs"],"t":"CF — Cash Flow (денежный поток)","d":"Деньги, которые бизнес или проект приносит за период: поступления минус платежи. Основа для оценки через дисконтирование."},{"p":["R\\&W"],"t":"R&W — Representations and Warranties (заверения и гарантии)","d":"Письменные утверждения продавца о компании: отчётность верна, налоги уплачены, суды раскрыты. Если они неверны, покупатель вправе требовать компенсацию."},{"p":["B2C"],"t":"B2C — Business to Consumer (бизнес для потребителей)","d":"Модель, когда компания продаёт обычным людям, а не другим компаниям. Противоположность B2B."},{"p":["MSCI"],"t":"MSCI — Morgan Stanley Capital International (поставщик глобальных индексов и ESG-рейтингов)","d":"Компания, которая считает мировые фондовые индексы, например для развитых и развивающихся стран, и выпускает ESG-рейтинги. Индекс MSCI часто берут как «рынок» при расчёте беты."},{"p":["SMB"],"t":"SMB — Small Minus Big (малые минус крупные)","d":"Фактор модели Фама–Френча: разница доходностей акций малых и крупных компаний. Показывает, платит ли рынок премию за вложения в малые компании."},{"p":["HML"],"t":"HML — High Minus Low (высокий минус низкий)","d":"Фактор модели Фама–Френча: разница доходностей «недорогих» акций (высокое отношение балансовой стоимости к рыночной) и акций роста. Это премия за стоимость (value)."},{"p":["MKT"],"t":"MKT — Market factor (рыночный фактор)","d":"Фактор в моделях Фама–Френча: доходность рынка сверх безрисковой ставки. Показывает чувствительность акции к рынку в целом, как бета в CAPM."},{"p":["IR"],"t":"IR — Investor Relations (связи с инвесторами)","d":"Подразделение или команда компании, которая общается с инвесторами и аналитиками: раскрывает информацию, проводит встречи, готовит презентации для рынка."},{"p":["SPIVA"],"t":"SPIVA — S&P Indices Versus Active (индексы S&P против активных фондов)","d":"Регулярный отчёт компании S&P Dow Jones Indices, который сравнивает результаты активных фондов с их индексами. Обычно большинство фондов индекс не обгоняет."},{"p":["OCI"],"t":"OCI — Other Comprehensive Income (прочий совокупный доход)","d":"Часть отчётности, куда попадают переоценки, не проходящие через прибыль, например эффективная часть хеджа денежных потоков. В прибыль они переходят позже."},{"p":["IOI"],"t":"IOI — Indication of Interest (выражение интереса)","d":"Необязывающее письмо покупателя в сделке M&A с предварительным диапазоном цены. Покупать оно не обязывает, но по нему продавец отбирает участников на следующий этап."},{"p":["Q\\&A"],"t":"Q&A — Questions and Answers (вопросы и ответы)","d":"Блок сделки, где покупатели задают вопросы о компании, а продавец отвечает: на встрече с менеджментом или письменно в журнале вопросов (Q&A-лог) в дата-руме."},{"p":["ABO"],"t":"ABO — Accelerated Bookbuild Offering (ускоренное размещение акций)","d":"Быстрое размещение пакета акций: банк за вечер или ночь собирает заявки у крупных фондов, обычно со скидкой к рынку. Другое название — ABB."},{"p":["CIP"],"t":"CIP — Covered Interest Parity (покрытый паритет процентных ставок)","d":"Условие без арбитража: форвардный курс валюты связан со спотом и разницей процентных ставок в двух странах. Иначе можно было бы заработать без риска."},{"p":["PEAD"],"t":"PEAD — Post-Earnings Announcement Drift (дрейф после объявления прибыли)","d":"Аномалия: после неожиданно сильной или слабой отчётности цена акции продолжает двигаться в ту же сторону неделями и месяцами. Это спорит с идеей эффективного рынка."},{"p":["LTCM"],"t":"LTCM — Long-Term Capital Management (американский хедж-фонд)","d":"Хедж-фонд, который в 1998 году едва не рухнул: ставил на схождение цен с огромным плечом. Классический пример того, как заёмные деньги превращают ошибку в катастрофу."},{"p":["SE"],"t":"SE — Standard Error (стандартная ошибка)","d":"Погрешность самого среднего значения выборки: стандартное отклонение, делённое на корень из числа наблюдений. Чем больше наблюдений, тем меньше SE и уже доверительный интервал."},{"p":["OIBDA"],"t":"OIBDA — Operating Income Before Depreciation and Amortization (операционная прибыль до амортизации)","d":"Близкий к EBITDA показатель, но считается от операционной прибыли, без прочих доходов и расходов. Часто встречается в отчётности телекомов и медиа."},{"p":["FRED"],"t":"FRED — Federal Reserve Economic Data (база экономических данных ФРС)","d":"Бесплатная база данных Федерального резерва Сент-Луиса: ставки, инфляция, доходности казначейских облигаций и другие макроряды. Отсюда берут, например, доходность UST."},{"p":["YTD"],"t":"YTD — Year To Date (с начала года)","d":"Период от начала текущего года до сегодняшнего дня. Нужен, например, чтобы посчитать выручку за последние 12 месяцев (LTM) из годовых и промежуточных данных."},{"p":["VWAP"],"t":"VWAP — Volume-Weighted Average Price (средневзвешенная по объёму цена)","d":"Средняя цена за период, где каждая цена учитывается с весом объёма сделок. В M&A её берут как «честную» цену до объявления при расчёте премии."},{"p":["CCS"],"t":"CCS — Cross-Currency Swap (валютно-процентный своп)","d":"Своп, в котором стороны обмениваются суммами в разных валютах, платят друг другу проценты и в конце возвращают суммы обратно. Используют для хеджа валютного долга."},{"p":["KAM"],"t":"KAM — Key Audit Matters (ключевые вопросы аудита)","d":"Раздел аудиторского заключения о темах, где аудитор видел наибольший риск ошибки и которым уделил больше всего внимания. Описан в стандарте МСА 701."},{"p":["CEO"],"t":"CEO — Chief Executive Officer (генеральный директор)","d":"Первое лицо компании, отвечающее за её управление. Уход CEO — пример специфического риска одной компании, который снимается диверсификацией."},{"p":["ISDA"],"t":"ISDA — International Swaps and Derivatives Association (международная ассоциация свопов и деривативов)","d":"Ассоциация участников рынка деривативов. Её типовой договор используется для внебиржевых сделок, а решения комитета определяют, наступило ли кредитное событие по CDS."},{"p":["CSA"],"t":"CSA — Credit Support Annex (приложение о кредитной поддержке)","d":"Приложение к договору ISDA: правила обмена залогом между сторонами внебиржевой сделки, чтобы снизить риск контрагента. В теме ESG так же обозначают опрос S&P Global (Corporate Sustainability Assessment)."},{"p":["OIS"],"t":"OIS — Overnight Index Swap (своп на ставку овернайт)","d":"Своп, где плавающая часть привязана к ставке овернайт, например RUONIA. По его кривой видно, какую ключевую ставку ждёт рынок."},{"p":["OTM"],"t":"OTM — Out of The Money (вне денег)","d":"Опцион, исполнять который сейчас невыгодно: у колла цена актива ниже страйка, у пута выше. Такой опцион стоит дешевле, его цена состоит только из ожиданий."},{"p":["RVI"],"t":"RVI — Russian Volatility Index (индекс волатильности российского рынка)","d":"«Индекс страха» Мосбиржи: считается по ценам опционов на индекс РТС. Чем выше значение, тем сильнее рынок ждёт колебаний. Аналог американского VIX."},{"p":["BEI"],"t":"BEI — Breakeven Inflation (безубыточная инфляция)","d":"Инфляция, заложенная в цены облигаций: считается из разницы доходности обычной облигации и облигации, привязанной к инфляции. Показывает ожидания рынка по росту цен."},{"p":["ITF"],"t":"ITF — Intention To Float (намерение выйти на биржу)","d":"Публичное объявление компании о том, что она планирует IPO. Обычно выходит за несколько недель до начала сбора заявок."},{"p":["TERP"],"t":"TERP — Theoretical Ex-Rights Price (теоретическая цена после размещения прав)","d":"Расчётная цена акции после допэмиссии с преимущественным правом: средневзвешенная между старой ценой и ценой подписки. Показывает, как «разводится» цена."},{"p":["CP"],"t":"CP — Conversion Price (цена конвертации)","d":"Цена, по которой привилегированная акция венчурного инвестора превращается в обыкновенные. При раунде вниз её понижают, и инвестор получает больше акций."},{"p":["FRM"],"t":"FRM — Financial Risk Manager (управляющий финансовыми рисками)","d":"Профессиональная квалификация в риск-менеджменте, которую выдаёт ассоциация GARP. Сдаётся в две части."},{"p":["MPM"],"t":"MPM — Management-defined Performance Measures (показатели эффективности, определённые руководством)","d":"Показатели вроде adjusted EBITDA, которые компания придумала сама. IFRS 18 обязывает раскрывать их в примечаниях и сверять с показателями МСФО."},{"p":["NBER"],"t":"NBER — National Bureau of Economic Research (Национальное бюро экономических исследований США)","d":"Американская некоммерческая организация, публикующая рабочие экономические исследования, в том числе по финансам. Она же датирует рецессии в США."},{"p":["DOL"],"t":"DOL — Degree of Operating Leverage (степень операционного рычага)","d":"Показывает, во сколько раз изменение выручки меняет операционную прибыль EBIT. Чем больше постоянных затрат, тем выше DOL и сильнее колебания прибыли."},{"p":["CR4"],"t":"CR4 — Concentration Ratio of the four largest firms (коэффициент концентрации четырёх крупнейших)","d":"Сумма долей рынка четырёх крупнейших компаний. Чем она выше, тем сильнее рынок похож на олигополию."},{"p":["IWF"],"t":"IWF — Investable Weight Factor (доля акций в свободном обращении)","d":"Коэффициент от нуля до единицы: какая часть акций компании реально торгуется на рынке. Им уменьшают вес компании в индексе, считающемся по free-float."},{"p":["CCP"],"t":"CCP — Central Counterparty (центральный контрагент)","d":"Организация, которая становится стороной для каждого покупателя и продавца и гарантирует исполнение сделки. В России эту роль выполняет НКЦ."},{"p":["MM"],"t":"MM — Modigliani–Miller (теорема Модильяни–Миллера)","d":"Теория о том, что в идеальном мире структура капитала и дивиденды не влияют на стоимость компании. С налогами долг добавляет стоимость за счёт налогового щита."},{"p":["IRP"],"t":"IRP — Interest Rate Parity (паритет процентных ставок)","d":"Связь между спотом, форвардом и ставками в двух валютах: форвардный курс выравнивает доходность вложений в разных валютах. В покрытом варианте это арбитражное условие."}]}</script>

var BC={fv:1000,c:12,m:2,n:5,p:92,name:''};
function bondCalc(){
  var fv=+String(BC.fv).replace(',','.'),c=+String(BC.c).replace(',','.')/100,m=Math.max(1,Math.round(+BC.m)),n=+String(BC.n).replace(',','.'),p=+String(BC.p).replace(',','.')/100*fv;
  if(!(fv>0&&c>=0&&n>0&&p>0))return '<p class="note">Заполни поля.</p>';
  var N=Math.max(1,Math.round(n*m)),cp=fv*c/m;
  function price(r){var s=0;for(var t=1;t<=N;t++)s+=cp/Math.pow(1+r,t);return s+fv/Math.pow(1+r,N)}
  var lo=-0.99,hi=5;for(var i=0;i<200;i++){var mid=(lo+hi)/2;if(price(mid)>p)lo=mid;else hi=mid}
  var r=(lo+hi)/2,ytm=Math.pow(1+r,m)-1,nom=r*m;
  var dm=0;for(var t=1;t<=N;t++)dm+=t/m*cp/Math.pow(1+r,t);dm+=N/m*fv/Math.pow(1+r,N);dm/=p;
  var md=dm/(1+r),dp=(price(Math.pow(1+ytm+0.01,1/m)-1)/p-1)*100;
  var g=kbdAt(dm);
  return '<div class="tiles" style="margin-top:12px">'+
    tile('Доходность к погашению',nf(ytm*100,2)+'%','эффективная годовая · номинальная '+nf(nom*100,2)+'%')+
    tile('Текущая доходность',nf(c*fv/p*100,2)+'%','купон / цена')+
    tile('Дюрация Маколея',nf(dm,2)+' лет','модифицированная '+nf(md,2))+
    tile('Если ставки +1 п.п.',nf(dp,2)+'%','изменение цены')+
    (g!=null?tile('Спред к КБД',(ytm*100-g>0?'+':'')+nf((ytm*100-g)*100,0)+' б.п.','КБД на '+nf(dm,1)+' г.: '+nf(g,2)+'%'):'')+
    '</div>'+(BC.name?'<p class="note">Выпуск: '+esc(BC.name)+' (срок округлён до целого числа купонных периодов, НКД не учтён).</p>':'<p class="note">Срок округляется до целого числа купонных периодов; НКД не учитывается.</p>');
}

}

/* ---------- запоминаем место чтения ---------- */
(function(){
  var SK='scrollpos',hold=0,tgt=null,st=0;
  try{history.scrollRestoration='manual'}catch(e){}
  function rd(){try{var o=JSON.parse(localStorage.getItem(SK)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}}
  function wr(o){try{var ks=Object.keys(o);if(ks.length>80){ks.sort(function(a,b){return (o[a].t||0)-(o[b].t||0)});ks.slice(0,ks.length-80).forEach(function(k){delete o[k]})}localStorage.setItem(SK,JSON.stringify(o))}catch(e){}}
  function key(){return window.__scrollKey?window.__scrollKey():location.pathname.split('/').pop()+location.hash}
  function save(){
    if(Date.now()<hold)return;var k=key();if(!k)return;
    var y=Math.round(window.scrollY),o=rd();if(y<120)delete o[k];else o[k]={y:y,t:Date.now()};wr(o);
  }
  window.addEventListener('scroll',function(){clearTimeout(st);st=setTimeout(save,250)},{passive:true});
  ['touchstart','wheel','keydown','mousedown'].forEach(function(ev){window.addEventListener(ev,function(){hold=0;tgt=null},{passive:true,capture:true})});
  window.addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
  window.__holdScroll=function(){hold=Date.now()+600};
  window.__restoreScroll=function(){
    var k=key(),e=k&&rd()[k];hold=Date.now()+2500;tgt=e&&e.y>0?e.y:null;
    if(tgt===null){hold=Date.now()+300;return false}
    var tries=0;
    (function go(){
      if(tgt===null)return;
      var max=document.documentElement.scrollHeight-window.innerHeight;
      window.scrollTo({top:Math.min(tgt,Math.max(0,max)),behavior:'instant'});
      if(max>=tgt-2){hold=Date.now()+400;return}
      if(++tries>20){hold=0;return}
      setTimeout(go,150);
    })();
    return true;
  };
})();
